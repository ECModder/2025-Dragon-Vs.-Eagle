 egypt_cap_slots_1:0 "1"
 egypt_cap_slots_2:0 "2"
 egypt_cap_status_strike:0 "§RLabor strike: no new decisions§!"
 egypt_cap_status_freeze:0 "§RProject freeze: gains on hold§!"
 egypt_cap_status_water:0 "§YWater crisis: one decision at a time§!"
 egypt_cap_status_normal:0 "§GConstruction on schedule§!"
 egypt_cap_reward_text:0 "§GFinish in time:§!\nThe New Horizon of the Nile"
 egypt_cap_penalty_text:0 "§RMiss the deadline:§!\nThe Desert Facade"
 egypt_cap_reward_tt:0 "§GThe New Horizon of the Nile§!\nA permanent national spirit reflecting Egypt's transition into a modern, centralized tech and economic hub.\nPolitical Power Gain: §G+15%§!\nStability: §G+10%§!\nResearch Speed: §G+5%§!\nProduction Efficiency Cap: §G+10%§!\nConsumer Goods Factories: §G-5%§!\n\n§YImmediately:§! +150 Political Power, +15% War Support, 3 Civilian Factories and 1 Military Factory in the capital state."
 egypt_cap_penalty_tt:0 "§RThe Desert Facade§!\nA permanent national spirit representing economic stagnation and wasted state funds.\nStability: §R-20%§!\nPolitical Power Gain: §R-25%§!\nConsumer Goods Factories: §R+10%§!\nConstruction Speed: §R-15%§!\n\n§YOn 1 January 2032, if the bar is below 100%:§! -100 Political Power, -15% War Support and unrest in all Egyptian core states."

 ## National spirits & modifiers
 egypt_new_horizon_of_the_nile:0 "The New Horizon of the Nile"
 egypt_new_horizon_of_the_nile_desc:0 "The New Administrative Capital is complete. Egypt has made the transition into a modern, centralized tech and economic hub."
 egypt_desert_facade:0 "The Desert Facade"
 egypt_desert_facade_desc:0 "The New Administrative Capital was never finished. Half-empty towers stand as a monument to economic stagnation and wasted state funds, while state credit and building materials remain tied up in the failed capital zone."
 egypt_capital_siphoned_funds:0 "Siphoned State Funds"
 egypt_capital_siphoned_funds_desc:0 "State funds have been diverted to cover the devaluation deficit and keep the capital on schedule."
 egypt_capital_construction_load:0 "New Administrative Capital Works"
 egypt_capital_construction_load_desc:0 "Civilian factories and consumer goods tied up in the capital decisions that are currently under way."
 egypt_capital_unrest:0 "Capital Project Unrest"
 egypt_capital_unrest_desc:0 "Anger over the failed New Administrative Capital."

 ## Events
 egypt_capital.1.t:0 "Suez Revenue Slump Forces Project Freeze"
 egypt_capital.1.d:0 "Red Sea shipping disruptions hit a new low this quarter, draining the state treasury. This unexpected hit to the Egyptian economy will halt progress on the construction of the New Administrative Capital. How will the Egyptian government react?"
 egypt_capital.1.a:0 "How unfortunate..."
 egypt_capital.2.t:0 "Labor Strike at the Central Business District"
 egypt_capital.2.d:0 "Extreme summer heatwaves, combined with delayed wage payouts from a major private contractor, spark widespread wildcat strikes across the Central Business District."
 egypt_capital.2.a:0 "How unfortunate..."
 egypt_capital.3.t:0 "Archaeological Discovery in the Desert"
 egypt_capital.3.d:0 "Construction crews have accidentally unearthed an unmapped ancient burial site or artifact stash east of Cairo. Authorities demand an immediate halt."
 egypt_capital.3.a:0 "Halt work for study"
 egypt_capital.3.b:0 "Plow through it"
 egypt_capital.4.t:0 "Nile Delta Water Supply Discrepancy"
 egypt_capital.4.d:0 "Hydrological assessments show that pumping water to the eastern desert expansion zones is draining the main delta reservoirs faster than anticipated, causing rural friction and structural problems."
 egypt_capital.4.a:0 "Prioritize the capital infrastructure"
 egypt_capital.4.b:0 "Pause expansion to modify piping designs"
 egypt_capital.5.t:0 "Currency Devaluation Crisis"
 egypt_capital.5.d:0 "Global market pressures and inflationary spikes force a sudden devaluation of the Egyptian Pound. Foreign procurement costs for the capital's construction materials skyrocket overnight."
 egypt_capital.5.a:0 "Siphon state funds to cover the deficit"
 egypt_capital.5.b:0 "Freeze non-essential material imports"
 egypt_capital.6.t:0 "Subcontractor Supply Chain Failure"
 egypt_capital.6.d:0 "A major foreign architectural firm supplying smart-grid components has delayed its shipment. This will make it hard to continue construction of the New Administrative Capital of Egypt and will slow down its current projects."
 egypt_capital.6.a:0 "How unfortunate..."
 egypt_capital.10.t:0 "Phase I Complete: The Foundations Are Laid"
 egypt_capital.10.d:0 "The core infrastructure, the government district and the first landmark towers of the New Administrative Capital are in place. Work now moves on to the second phase: the diplomatic quarter, transit links and the business districts."
 egypt_capital.10.a:0 "Begin the second phase"
 egypt_capital.11.t:0 "Phase II Complete: A City Takes Shape"
 egypt_capital.11.d:0 "Embassies, monorail lines, tech parks and residential districts now rise from the desert. Only the final phase remains: connecting the new capital to the world economy."
 egypt_capital.11.a:0 "Begin the final phase"
 egypt_capital.20.t:0 "The New Horizon of the Nile"
 egypt_capital.20.d:0 "The New Administrative Capital is complete. Ministries, embassies and corporate headquarters have moved in, and Egypt presents itself to the world as a modern, centralized tech and economic hub."
 egypt_capital.20.a:0 "A new era for Egypt"
 egypt_capital.21.t:0 "The Desert Facade"
 egypt_capital.21.d:0 "The deadline for the New Administrative Capital has passed and the city stands unfinished. Half-empty towers and idle cranes have become a symbol of wasted state funds, and anger is spreading across the country."
 egypt_capital.21.a:0 "What a waste..."
