 ## Panel
 egypt_cap_title:0 "NEW ADMINISTRATIVE CAPITAL"
 egypt_cap_rule1:0 "§YRule 1:§! Maximum two capital decisions at the same time"
 egypt_cap_rule2:0 "§YRule 2:§! Complete the project before 1 January 2032"
 egypt_cap_p1_title:0 "PHASE I — FOUNDATIONS"
 egypt_cap_p1_text:0 "The first phase focuses on establishing the essential foundations of the new capital. Build core infrastructure, government districts, and major landmarks."
 egypt_cap_p2_title:0 "PHASE II — EXPANSION"
 egypt_cap_p2_text:0 "The second phase builds out the city itself: the Diplomatic Quarter, the East Monorail, embassies, smart-grid networks, New Garden City, tech parks and universities."
 egypt_cap_p3_title:0 "FINAL PHASE — A CAPITAL FOR THE WORLD"
 egypt_cap_p3_text:0 "The final phase connects the capital to the world economy: the Green River park, the Suez logistic corridor, the smart airport, development bonds and the eco-industrial zone."
 egypt_cap_legend:0 "£egypt_mark_red Once    £egypt_mark_yellow Twice    £egypt_mark_green Many times"
 egypt_cap_progress_title:0 "CAPITAL DEVELOPMENT"
 egypt_cap_progress_text:0 "§W[?egypt_capital_progress|0]%   Progress Bar§!"
 egypt_cap_progress_tt:0 "Every finished capital decision adds its gain to the bar. When it reaches §G100%§! the next phase replaces this one; after the final phase the capital is complete."
 egypt_cap_bar_note_p1:0 "Progress bar at the start of the game: 74%"
 egypt_cap_bar_note_p2:0 "Progress bar at the start of this phase: 0%"
 egypt_cap_bar_note_p3:0 "Progress bar at the start of this phase: 0%"
