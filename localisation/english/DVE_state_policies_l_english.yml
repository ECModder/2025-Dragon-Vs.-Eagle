l_english:

 # ==== DvE - Better Laws and Policies: the row and its six groups ====
 state_policies:0 "State Policies"
 national_ideology:0 "National Ideology"
 civil_liberties:0 "Civil Liberties"
 economic_model:0 "Economic Model"
 tax_policy:0 "Tax Policy"
 ideological_mobilisation:0 "Ideological Mobilization"

 # ==== National Ideology ====
 improvised_bureaucracy:0 "Improvised Bureaucracy"
 improvised_bureaucracy_desc:0 "The state runs on whoever happened to be in the building when the ministry was founded. It works, more or less, most days."
 functioning_state:0 "Functioning State"
 functioning_state_desc:0 "Departments answer to a chain of command, paperwork moves in something like order, and decisions get made without three ministries arguing about whose job it was."
 party_guided_state:0 "Party-Guided State"
 party_guided_state_desc:0 "The bureaucracy and the party are, for practical purposes, the same institution. Nothing moves through the state that the party has not already decided."

 # ==== Civil Liberties ====
 tolerated_dissent:0 "Tolerated Dissent"
 tolerated_dissent_desc:0 "People say what they think, organise how they like, and the government lives with the consequences of that."
 managed_opposition:0 "Managed Opposition"
 managed_opposition_desc:0 "Opposition is legal, permits are required, and permits are not always granted."
 banned_opposition:0 "Banned Opposition"
 banned_opposition_desc:0 "There is one legitimate political voice in the country, and it is not up for debate which one that is."

 # ==== Economic Model ====
 mixed_economy:0 "Mixed Economy"
 # description moved to DVE_state_policies_v2_l_english.yml: this
 # law's meaning changed (now locked to the progressive ideology,
 # not a free player choice), the old text no longer fit.
 # state_directed_economy and centrally_planned_economy: removed,
 # replaced by the 8-tier ideology-locked ladder in
 # DVE_state_policies_v2_l_english.yml.

 # ==== Tax Policy ====
 low_taxation:0 "Low Taxation"
 low_taxation_desc:0 "The treasury takes a light hand, and the public notices - in their pockets, if not always in their politics."
 moderate_taxation:0 "Moderate Taxation"
 moderate_taxation_desc:0 "Nobody is thrilled with the rate. Nobody is quite angry enough to say so either."
 high_taxation:0 "High Taxation"
 high_taxation_desc:0 "The treasury takes what it needs first and explains itself after, if it explains itself at all."

 # ==== Ideological Mobilization ====
 minimal_propaganda:0 "Minimal Propaganda"
 minimal_propaganda_desc:0 "The government makes its case like everyone else does: in the papers, sometimes, and not very loudly."
 state_propaganda:0 "State Propaganda"
 state_propaganda_desc:0 "Posters, broadcasts, newsreels - the line is repeated often enough that repeating it stops feeling like a choice."
 total_ideological_mobilisation:0 "Total Ideological Mobilization"
 total_ideological_mobilisation_desc:0 "Every institution the state has - schools, unions, the army itself - exists in part to make the case for the state. There is no corner of public life the message does not reach."
