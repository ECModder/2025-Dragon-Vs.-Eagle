 # ==== DvE - Better Laws and Policies: the row and its six groups ====
 state_policies:0 "State Policies"
 national_ideology:0 "National Ideology"
 civil_liberties:0 "Civil Liberties"
 economic_model:0 "Economic Model"
 tax_policy:0 "Tax Policy"
 ideological_mobilisation:0 "Ideological Mobilization"

 # ==== National Ideology ====
 representative_democracy:0 "Representative Democracy"
 representative_democracy_desc:0 "Elected assemblies make the law, departments answer to a chain of command, and decisions get made without three ministries arguing about whose job it was."
 restricted_democracy:0 "Restricted Democracy"
 restricted_democracy_desc:0 "Elections are held and results are respected, as long as the right people are allowed to stand and the right people are allowed to vote."
 religious_state:0 "Religious State"
 religious_state_desc:0 "Law is read out of scripture and clerics sit in every office that matters. What the state cannot justify in the holy texts it does not do."
 ultranationalist_regime:0 "Ultranationalist Regime"
 ultranationalist_regime_desc:0 "The nation is the only legitimate subject of politics. Every office, school and parade exists to prove it."
 monarchy:0 "Monarchy"
 monarchy_desc:0 "The crown is the state. Ministers serve at its pleasure, and the succession matters more than any election could."
 oligarchy_rule:0 "Oligarchy"
 oligarchy_rule_desc:0 "A small circle of families, generals and financiers decides, and the offices of the state are the rooms they decide in."
 peoples_democratic_dictatorship:0 "People's Democratic Dictatorship"
 peoples_democratic_dictatorship_desc:0 "The bureaucracy and the party are, for practical purposes, the same institution. Nothing moves through the state that the party has not already decided."
 direct_councils_democracy:0 "Direct Councils Democracy"
 direct_councils_democracy_desc:0 "The party apparatus does not so much fall as dissolve into something else: workers', soldiers' and local councils, deciding directly what the ministries used to decide for them."

 # ==== Civil Liberties ====
 tolerated_dissent:0 "Tolerated Dissent"
 tolerated_dissent_desc:0 "People say what they think, organise how they like, and the government lives with the consequences of that."
 managed_opposition:0 "Managed Opposition"
 managed_opposition_desc:0 "Opposition is legal, permits are required, and permits are not always granted."
 banned_opposition:0 "Banned Opposition"
 banned_opposition_desc:0 "There is one legitimate political voice in the country, and it is not up for debate which one that is."

 # ==== Economic Model ====
 mixed_economy:0 "Mixed Economy"
