 # ==== Tax Policy ====
 low_taxation:0 "Low Taxation"
 low_taxation_desc:0 "The treasury takes a light hand, and the public notices - in their pockets, if not always in their politics."
 moderate_taxation:0 "Moderate Taxation"
 moderate_taxation_desc:0 "Nobody is thrilled with the rate. Nobody is quite angry enough to say so either."
 high_taxation:0 "High Taxation"
 high_taxation_desc:0 "The treasury takes what it needs first and explains itself after, if it explains itself at all."

 # ==== Ideological Mobilization ====
 minimal_propaganda:0 "Minimal Propaganda"
 minimal_propaganda_desc:0 "The government makes its case like everyone else does: in the papers, sometimes, and not very loudly."
 state_propaganda:0 "State Propaganda"
 state_propaganda_desc:0 "Posters, broadcasts, newsreels - the line is repeated often enough that repeating it stops feeling like a choice."
 total_ideological_mobilisation:0 "Total Ideological Mobilization"
 total_ideological_mobilisation_desc:0 "Every institution the state has - schools, unions, the army itself - exists in part to make the case for the state. There is no corner of public life the message does not reach."
