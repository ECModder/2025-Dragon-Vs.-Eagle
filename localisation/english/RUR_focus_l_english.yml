l_english:
 # THE CIVIL WAR
 RUR_no_longer_a_dream:0 "It's No Longer a Dream"
 RUR_no_longer_a_dream_desc:0 "For thirty years a free Russia was something said quietly in kitchens. Now the Republic has a flag, an army and a provisional government, and it has to survive long enough to become real."
 RUR_against_communists_and_tsarists:0 "Against the Communists and the Tsarists"
 RUR_against_communists_and_tsarists_desc:0 "Red flags in the west, imperial eagles in the south. The Republic fights on two fronts against two visions of the same old Russia."
 RUR_ask_for_un_help:0 "Ask for the UN's Help"
 RUR_ask_for_un_help_desc:0 "The provisional government appeals to the United Nations as the only legitimate authority left in Russia. Recognition is easier to obtain than soldiers."
 RUR_russia_with_its_forces:0 "Russia with Its Own Forces"
 RUR_russia_with_its_forces_desc:0 "No foreign army will march on Moscow for us. The Republic will win this war with Russian soldiers, or not at all."
 RUR_european_intervention:0 "European Intervention?"
 RUR_european_intervention_desc:0 "Brussels, Berlin and Warsaw have every reason to want the Republic to win. Whether they want it enough to send their own volunteers is another question."
 RUR_compulsory_constraint:0 "Compulsory Constraint"
 RUR_compulsory_constraint_desc:0 "Every able-bodied citizen of the Republic is called up. Democracy will have to be defended before it can be enjoyed."
 RUR_new_era_for_the_russian_people:0 "A New Era for the Russian People"
 RUR_new_era_for_the_russian_people_desc:0 "Moscow is free and the guns are silent. For the first time in its history Russia will choose its government in an open election, and every party is already campaigning."
 # THE FIRST ELECTION (all five are mutually exclusive)
 RUR_rsdp_electoral_victory:0 "RSDP Electoral Victory"
 RUR_rsdp_electoral_victory_desc:0 "The Social Democrats win the first free election, carried by the industrial towns of the Urals and Siberia that held the line in the war."
 RUR_just_russia_victory:0 "Just Russia Victory"
 RUR_just_russia_victory_desc:0 "Just Russia wins on a programme of civil rights, honest courts and a fair share of the oil money for every region."
 RUR_civic_platform_victory:0 "Civic Platform Victory"
 RUR_civic_platform_victory_desc:0 "Civic Platform wins with the votes of the cities and the new middle class: a market economy, a strong currency and an end to adventures abroad."
 RUR_novyye_lyudi_victory:0 "Novyye Lyudi Victory"
 RUR_novyye_lyudi_victory_desc:0 "The New People were barely tolerated under the old regime. Young, pragmatic and impatient, they now win the country."
 RUR_peoples_russia_victory:0 "People's Russia Victory"
 RUR_peoples_russia_victory_desc:0 "Many Russians fought for the Republic without loving it. People's Russia wins their votes with a promise of order, faith and a strong state."
 # RSDP - progressive
 RUR_pro_russian_democratic_federation:0 "Russian Democratic Federation"
 RUR_pro_russian_democratic_federation_desc:0 "A federation of free republics and regions, bound by a common constitution rather than by the Kremlin."
 RUR_pro_northern_european_model:0 "Northern European Model"
 RUR_pro_northern_european_model_desc:0 "Sweden and Finland built prosperous welfare states next door. The Social Democrats intend to copy them."
 RUR_pro_ministry_of_labour:0 "Ministry of Labour"
 RUR_pro_ministry_of_labour_desc:0 "A ministry that enforces contracts, safety rules and the right to strike, for the first time in living memory."
 RUR_pro_semi_direct_democracy:0 "Semi-Direct Democracy"
 RUR_pro_semi_direct_democracy_desc:0 "Citizens may call referendums and recall their deputies. The state answers to the people between elections too."
 RUR_pro_ministry_of_defence:0 "Ministry of Defence"
 RUR_pro_ministry_of_defence_desc:0 "The army that won the war is placed under a civilian minister answerable to parliament."
 RUR_pro_state_participation:0 "State Participation in Enterprises"
 RUR_pro_state_participation_desc:0 "The state takes minority stakes in the strategic companies and invests the dividends in new plants."
 RUR_pro_welfare_state:0 "Welfare State"
 RUR_pro_welfare_state_desc:0 "Pensions that arrive on time, hospitals that have medicine, schools that have teachers."
 RUR_pro_joint_armed_forces:0 "Joint Armed Forces"
 RUR_pro_joint_armed_forces_desc:0 "Army, air force, navy and the regional militias of the war are merged under one joint staff."
 RUR_pro_peer_to_peer_production:0 "Peer-to-Peer Production"
 RUR_pro_peer_to_peer_production_desc:0 "Cooperatives and small firms share designs, machines and orders over an open network."
 RUR_pro_citizens_assemblies:0 "Citizens' Assemblies"
 RUR_pro_citizens_assemblies_desc:0 "Assemblies of citizens drawn by lot debate the great questions before parliament votes on them."
 RUR_pro_centralized_command:0 "Centralized Command"
 RUR_pro_centralized_command_desc:0 "One chain of command and one doctrine, from the general staff down to the last battalion."
 RUR_pro_homeland_democracy_liberty:0 "Homeland, Democracy, Liberty."
 RUR_pro_homeland_democracy_liberty_desc:0 "A social and democratic Russia, at peace with itself and its neighbours. The Social Democrats have kept their promise."
 # JUST RUSSIA - liberal
 RUR_lib_social_and_liberal:0 "Social and Liberal"
 RUR_lib_social_and_liberal_desc:0 "Free markets and a social safety net are not opposites. Just Russia promises both."
 RUR_lib_representative_republic:0 "Representative Republic"
 RUR_lib_representative_republic_desc:0 "Power belongs to a parliament elected by all, not to a president elected for life."
 RUR_lib_revitalizing_the_economy:0 "Revitalizing the Economy"
 RUR_lib_revitalizing_the_economy_desc:0 "Sanctions are lifted, credit returns and frozen projects start moving again."
 RUR_lib_multiparty_democracy:0 "Multiparty Democracy"
 RUR_lib_multiparty_democracy_desc:0 "Every party that renounces violence may run. For the first time the opposition is not a crime."
 RUR_lib_ministry_of_defence:0 "Ministry of Defence"
 RUR_lib_ministry_of_defence_desc:0 "A civilian ministry, a published budget and generals who answer questions in parliament."
 RUR_lib_state_funded_industrialization:0 "State-Funded Industrialization"
 RUR_lib_state_funded_industrialization_desc:0 "Public loans for private factories, as long as they are built in Russia and hire Russians."
 RUR_lib_elected_parliament:0 "A Representatively Elected Parliament"
 RUR_lib_elected_parliament_desc:0 "Proportional representation gives every region and every party its fair share of the Duma."
 RUR_lib_centralized_local_guard:0 "Centralized Local Guard"
 RUR_lib_centralized_local_guard_desc:0 "The volunteer militias of the war become a national guard under federal command."
 RUR_lib_revitalize_the_periphery:0 "Revitalize the Periphery"
 RUR_lib_revitalize_the_periphery_desc:0 "Roads, railways and broadband for the towns of the Volga, the Urals and Siberia that Moscow forgot."
 RUR_lib_centralized_federal_system:0 "Centralized Federal System"
 RUR_lib_centralized_federal_system_desc:0 "Wide autonomy for the regions, coordinated by a federal government that keeps the country together."
 RUR_lib_defending_russian_democracy:0 "Defending Russian Democracy"
 RUR_lib_defending_russian_democracy_desc:0 "The army swears loyalty to the constitution and to nobody else. Russia will not fall back into the hands of a strongman."
 RUR_lib_russia_liberalism_freedom:0 "Russia, Liberalism, Freedom."
 RUR_lib_russia_liberalism_freedom_desc:0 "A free country of free citizens, open to the world. Few believed it possible when the shooting started."
 # CIVIC PLATFORM - centrist
 RUR_cen_free_market_economy:0 "Free-Market Economy"
 RUR_cen_free_market_economy_desc:0 "Prices are freed, licences abolished and the oligarchs' monopolies broken up."
 RUR_cen_fiscally_libertarian:0 "Liberals and Fiscally Libertarian"
 RUR_cen_fiscally_libertarian_desc:0 "Low taxes, a balanced budget and a state that knows its limits."
 RUR_cen_fully_private_economy:0 "Fully Private Economy"
 RUR_cen_fully_private_economy_desc:0 "State corporations are sold at open auctions, and this time the auctions really are open."
 RUR_cen_two_party_system:0 "A Two-Party System"
 RUR_cen_two_party_system_desc:0 "Civic Platform and the New People absorb the smaller parties. Russian politics settles into a contest between centre and centre-right."
 RUR_cen_local_level_defense:0 "Local-Level Defense"
 RUR_cen_local_level_defense_desc:0 "Every region raises its own reserve and keeps its own depots, so that no single coup can disarm the country."
 RUR_cen_shopkeepers_and_medium_enterprises:0 "Shopkeepers and Medium Enterprises"
 RUR_cen_shopkeepers_and_medium_enterprises_desc:0 "The backbone of a free economy is not the oligarch but the family firm. Credit and tax breaks go to them first."
 RUR_cen_bicameral_legislature:0 "A Bicameral Legislature"
 RUR_cen_bicameral_legislature_desc:0 "A Duma elected by the people and a Federation Council chosen by the regions, each able to check the other."
 RUR_cen_federal_local_guard:0 "Federal Local Guard"
 RUR_cen_federal_local_guard_desc:0 "The regional reserves are joined into a federal guard with common equipment and training."
 RUR_cen_reduction_of_public_intervention:0 "Reduction of Public Intervention"
 RUR_cen_reduction_of_public_intervention_desc:0 "Subsidies are cut, regulations repealed and loss-making state firms wound up."
 RUR_cen_federal_republic:0 "Federal Republic"
 RUR_cen_federal_republic_desc:0 "Russia becomes a true federation: the regions govern themselves, the centre keeps defence, currency and foreign policy."
 RUR_cen_defending_russian_liberty:0 "Defending Russian Liberty"
 RUR_cen_defending_russian_liberty_desc:0 "An army of citizens, ready to defend their homes and their freedom."
 RUR_cen_russia_democracy_freedom:0 "Russia, Democracy, Freedom."
 RUR_cen_russia_democracy_freedom_desc:0 "A market economy, a federal state and free elections. The Republic has become an ordinary country, which is the best thing that ever happened to it."
 # NOVYYE LYUDI - conservative
 RUR_con_fiscal_conservatism:0 "Fiscal Conservatism"
 RUR_con_fiscal_conservatism_desc:0 "A balanced budget, a strong rouble and no more printing money to pay for wars."
 RUR_con_traditionalists_and_paternalists:0 "Traditionalists and Paternalists"
 RUR_con_traditionalists_and_paternalists_desc:0 "Family, work and the parish. The New People promise modern government for a traditional country."
 RUR_con_self_employed_economy:0 "Self-Employed Based Economy"
 RUR_con_self_employed_economy_desc:0 "Artisans, shopkeepers and freelancers are the true Russian economy. The rules are rewritten for them."
 RUR_con_presidentialist_federalist_republic:0 "Presidentialist and Federalist Republic"
 RUR_con_presidentialist_federalist_republic_desc:0 "A president elected by the people, strong regions and a parliament that can say no."
 RUR_con_national_defense_committee:0 "National Defense Committee"
 RUR_con_national_defense_committee_desc:0 "Ministers, generals and intelligence chiefs meet at one table to decide the security of the Republic."
 RUR_con_extend_flat_tax:0 "Extend Flat Tax"
 RUR_con_extend_flat_tax_desc:0 "One low rate for everyone. Russia already had a flat income tax; now it covers companies too."
 RUR_con_russian_first:0 "Russians First"
 RUR_con_russian_first_desc:0 "Jobs, housing and benefits go to Russian citizens first. The rule is simple and very popular."
 RUR_con_security_decree:0 "Security Decree"
 RUR_con_security_decree_desc:0 "The police get new powers, the courts new deadlines and the borders new fences."
 RUR_con_low_tax_pressure_for_companies:0 "Low Tax Pressure for Companies"
 RUR_con_low_tax_pressure_for_companies_desc:0 "Russia advertises itself as the place where companies are left in peace. Investors start to believe it."
 RUR_con_truly_presidential_system:0 "A Truly Presidential System"
 RUR_con_truly_presidential_system_desc:0 "The president governs, the regions administer, parliament legislates. Each knows its place."
 RUR_con_defense_of_the_north:0 "Defense of the North"
 RUR_con_defense_of_the_north_desc:0 "The Arctic coast, its ports and its gas fields are the Republic's lifeline. They are fortified and garrisoned."
 RUR_con_russia_nation_identity:0 "Russia, Nation, Identity."
 RUR_con_russia_nation_identity_desc:0 "A modern nation that is proud of its past and sure of its future. The New People have given Russia a new face."
 # PEOPLE'S RUSSIA - reactionary
 RUR_rea_reaction_economy:0 "Reaction Economy"
 RUR_rea_reaction_economy_desc:0 "Strategic industries return under state supervision, and defence orders come first."
 RUR_rea_orthodox_and_traditionalists:0 "Orthodox and Traditionalists"
 RUR_rea_orthodox_and_traditionalists_desc:0 "The Church, the family and the old customs are the foundations of the nation, and the government means to protect them."
 RUR_rea_shopkeepers_first:0 "Shopkeepers First"
 RUR_rea_shopkeepers_first_desc:0 "The corner shop and the family farm come before the oligarchs and the foreign chains."
 RUR_rea_russian_federal_republic:0 "Russian Federal Republic"
 RUR_rea_russian_federal_republic_desc:0 "A federal republic in name, a Russian republic in spirit. The regions are free, as long as they remember where they belong."
 RUR_rea_russian_professional_army:0 "Russian Professional Army"
 RUR_rea_russian_professional_army_desc:0 "No more conscripts thrown into battle untrained. Russia will be defended by professionals."
 RUR_rea_low_tax_pressure:0 "Low Tax Pressure"
 RUR_rea_low_tax_pressure_desc:0 "Taxes fall for families and small businesses. The treasury will make it back from growth, the government says."
 RUR_rea_increase_centralization:0 "Increase Centralization"
 RUR_rea_increase_centralization_desc:0 "Governors are appointed again, and regional budgets pass through Moscow."
 RUR_rea_regionalization_of_security:0 "Regionalization of Security"
 RUR_rea_regionalization_of_security_desc:0 "Every region raises and pays for its own security forces, under a common Russian command in wartime."
 RUR_rea_finances_small_businesses:0 "Finances Small Businesses"
 RUR_rea_finances_small_businesses_desc:0 "A national development bank lends to small firms at rates no private bank would offer."
 RUR_rea_less_immigration_more_security:0 "Less Immigration, More Security"
 RUR_rea_less_immigration_more_security_desc:0 "Borders are tightened and residence permits cut. The government promises safer streets."
 RUR_rea_no_nato_and_no_eu:0 "No NATO and No EU"
 RUR_rea_no_nato_and_no_eu_desc:0 "Russia did not free itself from one master to accept another. The Republic will stand alone."
 RUR_rea_for_the_state_and_god:0 "For the State and God"
 RUR_rea_for_the_state_and_god_desc:0 "The State gives order and God gives meaning. People's Russia asks its citizens for loyalty to both."

