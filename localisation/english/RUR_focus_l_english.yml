 RUR_democratic_struggle:0 "The Democratic Struggle"
 RUR_democratic_struggle_desc:0 "The Republic fights for its survival."
 RUR_international_legitimacy:0 "International Legitimacy"
 RUR_international_legitimacy_desc:0 "Recognised by the United Nations as the government of Russia."
 RUR_russia_alone:0 "Russia with Its Own Forces"
 RUR_russia_alone_desc:0 "No foreign army will win this war for us."
 RUR_ministry_of_labour:0 "Ministry of Labour"
