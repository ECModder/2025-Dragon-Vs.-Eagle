 RUR_private_economy:0 "Private Economy"
 RUR_private_economy_desc:0 "Open auctions for the state corporations."
 RUR_reduced_public_intervention:0 "Reduced Public Intervention"
 RUR_reduced_public_intervention_desc:0 "Whatever survives has earned it."
 RUR_two_party_system:0 "A Two-Party System"
