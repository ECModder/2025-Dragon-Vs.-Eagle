l_english:
 LOM_focus:0 "Padania"

 # THE WAR OF INDEPENDENCE
 LOM_prima_il_nord:0 "Prima il Nord!"
 LOM_prima_il_nord_desc:0 "The old slogan comes back out of the cellar. Rome has sunk into chaos, and the North has no intention of going down with it."
 LOM_padania_finally_free:0 "Padania Finally Free"
 LOM_padania_finally_free_desc:0 "From the Ticino to the Piave the tricolour comes down from the town halls and the Sun of the Alps goes up. Whether Padania stays free now depends on the men who have to defend it."
 LOM_italians_first:0 "Italians First"
 LOM_italians_first_desc:0 "Independence was never the goal; a better Italy was. The national line holds: the North leads, and the rest of the country will follow once it sees how things are done."
 LOM_padanians_first:0 "Padanians First"
 LOM_padanians_first_desc:0 "Thirty years of a 'national' Lega produced nothing but ministries in Rome. The old guard is back in charge, and its programme fits on a banner: the North for the Northerners."
 LOM_myth_of_a_new_italy:0 "Myth of a New Italy"
 LOM_myth_of_a_new_italy_desc:0 "The Republic died of its own corruption. From Milan and Venice a new Italy will be built: efficient, orderly and unmistakably Northern."
 LOM_i_believe_in_the_padanians:0 "I Believe in the Padanians"
 LOM_i_believe_in_the_padanians_desc:0 "A people with its own history, its own dialects and its own work ethic does not need a capital six hundred kilometres away. Pontida was a promise; now it is a state."
 LOM_victory_over_roma_ladrona:0 "Victory over Roma Ladrona"
 LOM_victory_over_roma_ladrona_desc:0 "Rome has stopped sending its prefects and its tax collectors. For the first time since 1861 the money of the North stays in the North."
 # THE PARTY CHOICE (all eight are mutually exclusive)
 LOM_soc_peoples_workers_party:0 "People's Workers' Party"
 LOM_soc_peoples_workers_party_desc:0 "The Padanian workers' movement refuses to choose between Rome and Pontida. Its answer is the Partito dei Lavoratori Italiani and a federation of free peoples, from the Alps to Sicily."
 LOM_soc_comunisti_padani:0 "Comunisti Padani"
 LOM_soc_comunisti_padani_desc:0 "The hardliners of the Comunisti Padani want no federation and no compromise: a single party, a single plan and a border that stays closed."
 LOM_lib_lavoro_padano:0 "Lavoro Padano"
 LOM_lib_lavoro_padano_desc:0 "Union leaders, mayors and the European left of the North gather under one banner. Padania will be social, democratic and anchored to Brussels."
 LOM_con_forza_padania:0 "Forza Padania"
 LOM_con_forza_padania_desc:0 "The industrialists of Brianza and the Veneto kept the country running through the war. Now they want a government that will leave them alone."
 LOM_lega_keep_salvinis_lega:0 "Keep Salvini's Lega"
 LOM_lega_keep_salvinis_lega_desc:0 "The Captain is still in charge. The Lega keeps its leader, its rallies and its ballot boxes, and promises voters that nothing will change except the address of the government."
 LOM_lega_destra_padana:0 "Destra Padana"
 LOM_lega_destra_padana_desc:0 "The war made the general more popular than any politician. The Destra Padana offers order first and elections later, if at all."
 LOM_bossi_eternal_leader:0 "Bossi, Eternal Leader"
 LOM_bossi_eternal_leader_desc:0 "The Senatùr never really left. The movement crowns its founder as the living symbol of Padania, and the party that once mocked the monarchists of Rome now calls itself Casa Bossi."
 LOM_unp_unione_nazionalista_padana:0 "Unione Nazionalista Padana"
 LOM_unp_unione_nazionalista_padana_desc:0 "For the UNP, Padania is not a federation of regions but a nation of blood and soil. Parliament may talk; the movement will act."
 # COMMUNISTS - People's Workers' Party / Comunisti Padani
 LOM_soc_peoples_democratic_republic:0 "People's Democratic Republic"
 LOM_soc_peoples_democratic_republic_desc:0 "A People's Democratic Republic on the model of the old East: several parties on paper, one programme in practice."
 LOM_soc_north_korea_of_europe:0 "The North Korea of Europe"
 LOM_soc_north_korea_of_europe_desc:0 "Closed borders, self-reliance and a leadership above criticism. Foreign journalists call it the North Korea of Europe; the Party prints the phrase on its posters."
 LOM_soc_forced_reindustrialization:0 "Forced Reindustrialization"
 LOM_soc_forced_reindustrialization_desc:0 "The factories closed by globalization are reopened by decree. Nobody asks whether they are profitable."
 LOM_soc_central_committee:0 "Central Committee"
 LOM_soc_central_committee_desc:0 "Decisions are taken in the capital by a committee of veterans of the struggle, and carried out everywhere else."
 LOM_soc_peoples_workers_army:0 "People's Workers' Army"
 LOM_soc_peoples_workers_army_desc:0 "The factory militias become a regular army, with ranks, uniforms and a commissar in every battalion."
 LOM_soc_bureaucratic_control_over_factories:0 "Bureaucratic Control over Factories"
 LOM_soc_bureaucratic_control_over_factories_desc:0 "Every factory gets a director, a plan and an inspector from the ministry. Output is now measured, and woe to whoever falls short."
 LOM_soc_central_political_bureau:0 "Central Political Bureau"
 LOM_soc_central_political_bureau_desc:0 "A smaller circle within the committee takes the decisions that matter. The committee is informed afterwards."
 LOM_soc_joint_armed_forces:0 "Joint Armed Forces"
 LOM_soc_joint_armed_forces_desc:0 "Army, militias and border guard are merged under a single command that answers to the Party."
 LOM_soc_state_collective_farms:0 "State Collective Farms"
 LOM_soc_state_collective_farms_desc:0 "The farms of the Po valley are merged into state collectives. The richest farmland in Europe will feed the workers first."
 LOM_soc_supreme_peoples_assembly:0 "Supreme People's Assembly"
 LOM_soc_supreme_peoples_assembly_desc:0 "The Assembly meets twice a year, votes unanimously and goes home. It is the most stable parliament in Italian history."
 LOM_soc_centralized_command:0 "Centralized Command"
 LOM_soc_centralized_command_desc:0 "One general staff, one chain of command and one doctrine, drawn up in the capital and applied without discussion."
 LOM_soc_communism_nation_patriotism:0 "Communism, Nation, Patriotism."
 LOM_soc_communism_nation_patriotism_desc:0 "The red flag and the Sun of the Alps fly side by side. The Party has given the North what Rome never could: a cause."
 # LAVORO PADANO - liberal
 LOM_lib_padania_social_and_liberal:0 "Padania, Social and Liberal"
 LOM_lib_padania_social_and_liberal_desc:0 "Independence is no excuse to dismantle the welfare state. Lavoro Padano promises a Padania that protects its workers as well as its businesses."
 LOM_lib_democrats_and_europeans:0 "Democrats and Europeans"
 LOM_lib_democrats_and_europeans_desc:0 "A small new country needs friends. Brussels is reminded that Padania was always the most European part of Italy."
 LOM_lib_revitalizing_the_economy:0 "Revitalizing the Economy"
 LOM_lib_revitalizing_the_economy_desc:0 "The war left empty warehouses and frozen credit. A recovery plan puts both back to work."
 LOM_lib_multiparty_democracy:0 "Multiparty Democracy"
 LOM_lib_multiparty_democracy_desc:0 "The emergency is over and the parties are back. Padania will be governed by those who win elections, not by those who won the war."
 LOM_lib_ministry_of_defence:0 "Ministry of Defence"
 LOM_lib_ministry_of_defence_desc:0 "The militias are placed under a civilian ministry, with a budget, a parliament and rules."
 LOM_lib_state_funded_industrialization:0 "State-Funded Industrialization"
 LOM_lib_state_funded_industrialization_desc:0 "Public money for private factories, provided they hire locally and pay their taxes in Padania."
 LOM_lib_local_welfare_management:0 "Local Welfare Management"
 LOM_lib_local_welfare_management_desc:0 "Hospitals, schools and pensions are run by the regions that pay for them. Lombardy and the Veneto have waited decades to say so."
 LOM_lib_centralized_local_guard:0 "Centralized Local Guard"
 LOM_lib_centralized_local_guard_desc:0 "The local guards are brought under one command and given proper equipment. They answer to the law, not to the mayors."
 LOM_lib_revitalize_the_italian_periphery:0 "Revitalize the Italian Periphery"
 LOM_lib_revitalize_the_italian_periphery_desc:0 "Investment flows to the valleys and small towns that Rome forgot. Roads, railways and broadband come first."
 LOM_lib_centralized_federal_system:0 "Centralized Federal System"
 LOM_lib_centralized_federal_system_desc:0 "Wide autonomy for the regions, firm coordination from the centre. A federation that works, at last."
 LOM_lib_defending_padanian_democracy:0 "Defending Padanian Democracy"
 LOM_lib_defending_padanian_democracy_desc:0 "The army swears loyalty to the constitution and to nobody else. Padania will not become what it fought against."
 LOM_lib_padania_europe_freedom:0 "Padania, Europe, Freedom."
 LOM_lib_padania_europe_freedom_desc:0 "A democratic Padania, part of the European family and a free society. Few believed it possible when the shooting started."
 # FORZA PADANIA - conservative
 LOM_con_free_market_economy:0 "Free-Market Economy"
 LOM_con_free_market_economy_desc:0 "The state steps back and the market steps in. The entrepreneurs of the North have been asking for this since the 1990s."
 LOM_con_liberals_and_fiscally_libertarian:0 "Liberals and Fiscally Libertarian"
 LOM_con_liberals_and_fiscally_libertarian_desc:0 "Fewer taxes, fewer forms, fewer ministries. Forza Padania sells the programme as common sense, and the North buys it."
 LOM_con_fully_private_economy:0 "Fully Private Economy"
 LOM_con_fully_private_economy_desc:0 "State shareholdings are sold off one after another. Most buyers are from Milan, which suits everyone in Milan."
 LOM_con_regionalist_democracy:0 "Regionalist Democracy"
 LOM_con_regionalist_democracy_desc:0 "Every region keeps its own government, its own budget and its own grievances. The federal parliament mediates."
 LOM_con_local_level_defense:0 "Local-Level Defense"
 LOM_con_local_level_defense_desc:0 "Defence starts at home: every province organizes its own reservists, depots and fortified positions."
 LOM_con_shopkeepers_and_medium_enterprises:0 "Shopkeepers and Medium Enterprises"
 LOM_con_shopkeepers_and_medium_enterprises_desc:0 "The backbone of the North is not big industry but the family firm. Credit and tax breaks go to them first."
 LOM_con_not_a_new_roma_ladrona:0 "Not a New \"Roma Ladrona\""
 LOM_con_not_a_new_roma_ladrona_desc:0 "Padania did not leave Italy to build its own Rome. Public tenders go online and the auditors get real powers."
 LOM_con_federal_local_guard:0 "Federal Local Guard"
 LOM_con_federal_local_guard_desc:0 "The provincial guards are joined into a federal corps with common equipment and training."
 LOM_con_reduction_of_public_intervention:0 "Reduction of Public Intervention"
 LOM_con_reduction_of_public_intervention_desc:0 "Subsidies are cut, regulations repealed and public companies wound up. Whatever survives has earned it."
 LOM_con_localist_federal_system:0 "Localist Federal System"
 LOM_con_localist_federal_system_desc:0 "Decisions are taken as close as possible to those who pay for them. The federal government keeps defence, the currency and little else."
 LOM_con_defending_padanian_liberty:0 "Defending Padanian Liberty"
 LOM_con_defending_padanian_liberty_desc:0 "An army of citizens, ready to defend their homes and their freedom and uninterested in anyone else's."
 LOM_con_padania_regionalism_freedom:0 "Padania, Regionalism, Freedom."
 LOM_con_padania_regionalism_freedom_desc:0 "A free market, free regions and free citizens. The North has finally been allowed to work."
 # LEGA - Keep Salvini's Lega (reactionary) / Destra Padana (authoritarianism)
 LOM_lega_command_economy:0 "Command Economy"
 LOM_lega_command_economy_desc:0 "War production cannot be left to the market. The government sets the priorities, and the factories of the North follow them."
 LOM_lega_traditionalists_and_paternalists:0 "Traditionalists and Paternalists"
 LOM_lega_traditionalists_and_paternalists_desc:0 "Family, parish, work and dialect. The government promises to look after the North the way a father looks after his household."
 LOM_lega_self_employed_based_economy:0 "Self-Employed Based Economy"
 LOM_lega_self_employed_based_economy_desc:0 "Artisans, shopkeepers and the self-employed are the true Padanian economy. The rules are rewritten for them."
 LOM_lega_presidentialist_and_federalist_republic:0 "Presidentialist and Federalist Republic"
 LOM_lega_presidentialist_and_federalist_republic_desc:0 "A strong president elected by the people, strong regions and a weak parliament. The constitution is written accordingly."
 LOM_lega_national_defense_committee:0 "National Defense Committee"
 LOM_lega_national_defense_committee_desc:0 "Ministers and generals sit at the same table. Security policy is decided there, quickly and quietly."
 LOM_lega_extend_flat_tax:0 "Extend Flat Tax"
 LOM_lega_extend_flat_tax_desc:0 "One rate for everyone, low enough that nobody bothers to evade it. In theory."
 LOM_lega_first_the_padanians:0 "First the Padanians"
 LOM_lega_first_the_padanians_desc:0 "Jobs, housing and benefits go to residents first. The rule is simple and very popular."
 LOM_lega_security_decree:0 "Security Decree"
 LOM_lega_security_decree_desc:0 "The police get new powers, the courts new deadlines and the border new fences."
 LOM_lega_low_tax_pressure_for_companies:0 "Low Tax Pressure for Companies"
 LOM_lega_low_tax_pressure_for_companies_desc:0 "Padania advertises itself across Europe as the place where companies are left in peace. Some of them believe it."
 LOM_lega_localist_presidential_system:0 "Localist Presidential System"
 LOM_lega_localist_presidential_system_desc:0 "The President governs, the regions administer, and the citizens vote twice a decade and are otherwise left alone."
 LOM_lega_defense_of_the_north:0 "Defense of the North"
 LOM_lega_defense_of_the_north_desc:0 "The Alpine passes and the crossings of the Po are fortified. Whoever comes from the south will find the North ready."
 LOM_lega_padania_nation_identity:0 "Padania, Nation, Identity."
 LOM_lega_padania_nation_identity_desc:0 "Padania is no longer a slogan at a rally. It is a nation with a state, a flag and a people that recognizes itself in both."
 # BOSSI - absolutism
 LOM_bossi_territorial_and_local_economy:0 "Territorial and Local Economy"
 LOM_bossi_territorial_and_local_economy_desc:0 "Every valley its own bank, every town its own industrial district. The economy of the North was built from below and will stay that way."
 LOM_bossi_against_roma_ladrona:0 "Against \"Roma Ladrona\""
 LOM_bossi_against_roma_ladrona_desc:0 "The old battle cry rings out again in the piazzas. Rome stole for a hundred and fifty years; it will not get another chance."
 LOM_bossi_shopkeepers_first:0 "Shopkeepers First"
 LOM_bossi_shopkeepers_first_desc:0 "The corner shop, the workshop and the family trattoria come before the multinationals and the shopping centres."
 LOM_bossi_federalism_and_devolution:0 "Federalism and Devolution"
 LOM_bossi_federalism_and_devolution_desc:0 "Fiscal federalism at last: what the regions earn, the regions keep. Bossi first promised it in 1991."
 LOM_bossi_padanian_professional_army:0 "Padanian Professional Army"
 LOM_bossi_padanian_professional_army_desc:0 "No more conscripts. Padania will be defended by volunteers who know what they are fighting for."
 LOM_bossi_low_tax_pressure:0 "Low Tax Pressure"
 LOM_bossi_low_tax_pressure_desc:0 "The tax burden falls for families and small firms. The treasury will make it back through growth, or so the Senatùr assures."
 LOM_bossi_questione_settentrionale:0 "Questione Settentrionale"
 LOM_bossi_questione_settentrionale_desc:0 "For decades Rome ignored the Northern Question. Now it is the only question that matters."
 LOM_bossi_regionalization_of_security:0 "Regionalization of Security"
 LOM_bossi_regionalization_of_security_desc:0 "Every region raises and pays for its own security forces, under a common Padanian command in wartime."
 LOM_bossi_finances_small_businesses:0 "Finances Small Businesses"
 LOM_bossi_finances_small_businesses_desc:0 "A Padanian development bank lends to small firms at rates no Roman bank ever offered."
 LOM_bossi_less_immigration_more_security:0 "Less Immigration, More Security"
 LOM_bossi_less_immigration_more_security_desc:0 "Borders are tightened and residence permits cut. The government promises safer streets and keeps the statistics to itself."
 LOM_bossi_no_nato_and_no_eu:0 "No NATO and No EU"
 LOM_bossi_no_nato_and_no_eu_desc:0 "Padania will not trade one master for another. Brussels and Washington are politely informed that the new state means to stand alone."
 LOM_bossi_la_lega_ce_lha_duro:0 "La Lega ce l'ha Duro"
 LOM_bossi_la_lega_ce_lha_duro_desc:0 "The old rallying cry of Pontida. The Lega has outlived the Republic, and its founder has outlived everybody."
 # UNIONE NAZIONALISTA PADANA - ultranationalism
 LOM_unp_state_corporatism:0 "State Corporatism"
 LOM_unp_state_corporatism_desc:0 "Employers and workers sit together in state corporations, under the eye of the movement. Strikes are no longer necessary, and no longer legal."
 LOM_unp_ethnic_and_identity_nationalism:0 "Ethnic and Identity Nationalism"
 LOM_unp_ethnic_and_identity_nationalism_desc:0 "The Padanian nation is defined by descent, tradition and faith. Everything else is foreign."
 LOM_unp_public_sector_serving_the_private:0 "Public Sector Serving the Private"
 LOM_unp_public_sector_serving_the_private_desc:0 "State companies exist to supply and protect Padanian private industry, not to compete with it."
 LOM_unp_zero_immigration:0 "Zero Immigration"
 LOM_unp_zero_immigration_desc:0 "The borders are closed. Not reduced, not regulated: closed."
 LOM_unp_national_army:0 "National Army"
 LOM_unp_national_army_desc:0 "A conscript army of the whole nation, trained to defend Padanian soil to the last."
 LOM_unp_economic_sovereignty:0 "Economic Sovereignty"
 LOM_unp_economic_sovereignty_desc:0 "Padania will produce its own steel, its own weapons and its own energy, whatever the cost."
 LOM_unp_security_and_public_order:0 "Security and Public Order"
 LOM_unp_security_and_public_order_desc:0 "Patrols in every city, curfews where needed, and a police force that answers to the movement."
 LOM_unp_party_command_of_the_army:0 "Party Command of the Army"
 LOM_unp_party_command_of_the_army_desc:0 "Every general has a party commissar at his side. The army belongs to the nation, and the nation belongs to the movement."
 LOM_unp_industrial_self_sufficiency:0 "Industrial Self-Sufficiency"
 LOM_unp_industrial_self_sufficiency_desc:0 "Autarky is no longer a dirty word. The factories of the North will supply the North, and nobody else."
 LOM_unp_hardline_catholics_and_traditionalists:0 "Hardline Catholics and Traditionalists"
 LOM_unp_hardline_catholics_and_traditionalists_desc:0 "The movement finds allies among traditionalist Catholics: the crucifix returns to classrooms and courtrooms."
 LOM_unp_defense_of_the_padanian_nation:0 "Defense of the Padanian Nation"
 LOM_unp_defense_of_the_padanian_nation_desc:0 "Every citizen a soldier and every town a fortress. Padania will not be conquered again."
 LOM_unp_for_the_state_god_and_padania:0 "For the State, God, and Padania"
 LOM_unp_for_the_state_god_and_padania_desc:0 "The State gives order, God gives meaning, Padania gives identity. The movement asks for nothing less than everything."

