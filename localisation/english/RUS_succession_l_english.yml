 RUS_succession_crisis_category:0 "The Succession Crisis"

 RUS_succession_countdown:0 "The Succession Crisis"
 RUS_succession_countdown_desc:0 "The president is dead and no mechanism exists to replace him. Four movements believe the country is theirs to inherit, and each is counting the days until the others move first. Complete one faction's path before the clock runs out - or Russia will settle the question the way it settled it in 1917."
 RUS_delay_the_congress:0 "Delay the Succession Congress"
 RUS_delay_the_congress_desc:0 "Procedural objections, quorum disputes, a hall that turns out to be double-booked. Every week the congress does not sit is a week nobody else can claim legitimacy either."
 RUS_martial_law_in_moscow:0 "Martial Law in Moscow"
 RUS_martial_law_in_moscow_desc:0 "Curfew in the capital, checkpoints on the ring road, and the Kantemirovskaya Division parked where everyone can see it. Nothing can be decided while nothing can move."

 RUS_back_the_socialists:0 "Back the Socialists"
 RUS_back_the_socialists_desc:0 "Money, presses and organisers go to the Big Red Tent. Factory committees reopen, party cells come out of hibernation, and the memory of the Union is put to work against the men who lost the war."
 RUS_back_the_democrats:0 "Back the Democrats"
 RUS_back_the_democrats_desc:0 "The exiled channels are funded, the student unions rebuilt, and the urban professionals who tolerated the regime while it paid are reminded that it has stopped paying."
 RUS_back_the_government:0 "Back the Government"
 RUS_back_the_government_desc:0 "United Russia still has an office in every district, a list of everyone who owes it something, and the evening news. All three are mobilised for continuity."
 RUS_back_the_nationalists:0 "Back the Nationalists"
 RUS_back_the_nationalists_desc:0 "The volunteer battalions are armed, the Patriarchate is persuaded, and the veterans' leagues are told exactly whose fault the defeat was. They are extremely willing to believe it."
