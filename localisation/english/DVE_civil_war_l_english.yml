l_english:
 DVE_civil_war_category:0 "Civil War - Emergency Powers"

 DVE_cw_call_militia:0 "Call Up the Territorial Militia"
 DVE_cw_call_militia_desc:0 "Two battalions' worth of men from the nearest districts, handed rifles and a week of drill. They will not hold a line against armour, but they will hold a town. Available again after ten days."
 DVE_cw_mass_levy:0 "Order a Mass Levy"
 DVE_cw_mass_levy_desc:0 "Empty the villages. Five formations at once, badly equipped and barely trained, and a countryside that will remember who took its sons. Available again after twenty days."

 DVE_cw_requisition_food:0 "Requisition Food from the Population"
 DVE_cw_requisition_food_desc:0 "Granaries, depots and warehouses go to the army. The soldiers eat, the rear does not, and the receipts are promises. Available again after fifteen days."
 DVE_cw_seize_industry:0 "Seize the Civilian Industry"
 DVE_cw_seize_industry_desc:0 "A plant in the capital is put under military management and retooled for weapons. Whatever it was making before, it is not making it any more."
 DVE_cw_seize_transport:0 "Commandeer the Trucks and the Railways"
 DVE_cw_seize_transport_desc:0 "Haulage firms and rail stock are taken over where they stand. The front gets its supply columns, the cities get empty shelves."

 DVE_cw_rally_support:0 "Rally Support for the Cause"
 DVE_cw_rally_support_desc:0 "Radio, pulpit, factory gate and street corner. Raises support for the ideologies your faction is built on - which ones depends on who you are."

 DVE_cw_shoot_deserters:0 "Shoot the Deserters"
 DVE_cw_shoot_deserters_desc:0 "Field courts behind the lines, sentences carried out the same afternoon. The regiments stop melting away. Nobody writes home about it."
 DVE_cw_open_the_arsenals:0 "Open the Strategic Arsenals"
 DVE_cw_open_the_arsenals_desc:0 "The sealed war reserve, kept for a conflict with NATO and now spent on Russians. Once only - there is no second set of keys."
