 # ==== DvE - generali e consiglieri russi ====

 # ---- generali ----
 RUS_sergey_shoigu:0 "Sergey Shoigu"
 RUS_valery_gerasimov:0 "Valery Gerasimov"
 RUS_nikolai_bogdanovsky:0 "Nikolai Bogdanovsky"
 RUS_sergei_rudskoy:0 "Sergei Rudskoy"
 RUS_yevgeny_burdinsky:0 "Yevgeny Burdinsky"

 # ---- consiglieri politici ----
 RUS_gennady_zyuganov:0 "Gennady Zyuganov"
 RUS_gennady_zyuganov_desc:0 "Chairman of the KPRF since 1993, and a candidate for the presidency four times. He has spent thirty years being the acceptable opposition, and knows exactly how much of the old Union he is allowed to promise."
 RUS_factory_committee:0 "Factory Committee"
 RUS_factory_committee_desc:0 "Not a man but a body, and one that was never supposed to reconstitute itself. The IPKB does not petition the state; it organises the shop floor and lets the state notice."
 RUS_sergey_mironov:0 "Sergey Mironov"
 RUS_sergey_mironov_desc:0 "Leader of A Just Russia, geologist by training, loyal by long habit. He argues for the pension and the wage rather than the flag, which in Moscow passes for the left."
 RUS_aleksey_zhuravlyov:0 "Aleksey Zhuravlyov"
 RUS_aleksey_zhuravlyov_desc:0 "Rodina - the Motherland party. Conservative in the way that means church, family and a very particular reading of the last century."
 RUS_vladimir_yakushev:0 "Vladimir Yakushev"
 RUS_vladimir_yakushev_desc:0 "Secretary of the General Council of United Russia. He does not make policy: he makes sure the machine that carries out policy is staffed by people who will not ask about it."
 RUS_leonid_slutsky:0 "Leonid Slutsky"
 RUS_leonid_slutsky_desc:0 "The hard edge of the parliamentary right, and the loudest voice in the Duma for finishing what was started. Where Yakushev manages, Slutsky demands."
 RUS_eduard_limonov:0 "Eduard Limonov"
 RUS_eduard_limonov_desc:0 "Poet, exile, founder of the National Bolsheviks. He has been imprisoned by the state he wants to rebuild and admired by people on both ends of it."

 # ---- tratti dei consiglieri ----
 DVE_kprf_chairman:0 "Chairman of the KPRF"
 DVE_kprf_chairman_desc:0 "Pushes the country toward Totalitarian Socialism and Authoritarian Socialism."
 DVE_factory_committee:0 "Factory Committee"
 DVE_factory_committee_desc:0 "Pushes the country toward Vanguard Socialism, and to a lesser degree Revolutionary Socialism."
 DVE_just_russia_leader:0 "A Just Russia"
 DVE_just_russia_leader_desc:0 "Pushes the country toward Progressivism and Centrism."
 DVE_rodina_leader:0 "Rodina"
 DVE_rodina_leader_desc:0 "Pushes the country toward Conservatism."
 DVE_united_russia_apparatus:0 "The Party Apparatus"
 DVE_united_russia_apparatus_desc:0 "Pushes the country toward Autocracy, Authoritarianism and Reaction."
 DVE_united_russia_hardliner:0 "United Russia Hardliner"
 DVE_united_russia_hardliner_desc:0 "Pushes the country toward Ultranationalism and Fundamentalism."
 DVE_nbp_leader:0 "The National Bolsheviks"
 DVE_nbp_leader_desc:0 "Pushes the country toward Absolutism."
