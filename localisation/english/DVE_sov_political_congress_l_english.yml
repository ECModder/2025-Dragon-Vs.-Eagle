l_english:
 # ==== DvE - le sei decisioni del Congresso politico (SOV) ====

 dve_sovpol.1.t:0 "The Shape of the State"
 dve_sovpol.1.d:0 "The Congress is in session and the first question cannot be postponed: on what does the Soviet state actually rest? The councils that made the revolution, the assembly that claims to speak for it, or the apparatus that has to run it tomorrow morning."
 dve_sovpol.1.a:0 "The State of the Councils"
 dve_sovpol.1.b:0 "Parliamentary Communism"
 dve_sovpol.1.c:0 "Bureaucracy at the Helm"

 dve_sovpol.2.t:0 "How the Plan Is Made"
 dve_sovpol.2.d:0 "Whatever the state rests on, someone has to draw up the plan. The delegates argue over whose signature belongs at the bottom of it: the factory councils, the unions, or the cadres trained for exactly this."
 dve_sovpol.2.a:0 "Workers' Council Based Planning"
 dve_sovpol.2.b:0 "Workers' Unions Based Planning"
 dve_sovpol.2.c:0 "Cadre Bureaucratic Based Planning"

 dve_sovpol.3.t:0 "Where Power Sits"
 dve_sovpol.3.d:0 "Every revolution eventually names the room where decisions are really taken. The Congress must now name ours."
 dve_sovpol.3.a:0 "Democratic Centralism"
 dve_sovpol.3.b:0 "A Strong Supreme Soviet"
 dve_sovpol.3.c:0 "Recreation of the Politburo"

 dve_sovpol.4.t:0 "The Organs of Security"
 dve_sovpol.4.d:0 "No one in the hall pretends the Republic can do without an organ of security. The argument is only over which of the three that came before it should be the model - and every name in that list carries its own ghosts."
 dve_sovpol.4.a:0 "Cheka Model"
 dve_sovpol.4.b:0 "NKVD Model"
 dve_sovpol.4.c:0 "KGB Model"

 dve_sovpol.5.t:0 "The Voice of the Party"
 dve_sovpol.5.d:0 "The Republic has to explain itself, to its own people first of all. The question is whether that voice belongs to the agitators, the ideologues, or the professionals of propaganda."
 dve_sovpol.5.a:0 "Restart Agit-Prop"
 dve_sovpol.5.b:0 "Ideologicheskiy Otdel"
 dve_sovpol.5.c:0 "Otdel Propagandy"

 dve_sovpol.6.t:0 "All Power To..."
 dve_sovpol.6.d:0 "Everything decided in these last days has been preparation for this. The Congress votes once, and the vote settles what the Chinese, the Americans and our own grandchildren will call this state."
 dve_sovpol.6.a:0 "All Power to The Soviets"
 dve_sovpol.6.b:0 "All Power to The Revolution"
 dve_sovpol.6.c:0 "All Power to The Party"
