l_english:
 DVE_puppet_alignment_category:0 "Alignment of the Satellites"

 ITA_align_puppet_vanguard:0 "Install the Workers' Councils"
 ITA_align_puppet_vanguard_desc:0 "Rome sends its own cadres and its own statute. The local government is dissolved and Internationalism - Communist Struggle takes its place, answering to the Workers' Councils and, through them, to us. The streets will not all be grateful."
 ITA_align_puppet_revolutionary:0 "Install the Central Councils"
 ITA_align_puppet_revolutionary_desc:0 "The Revolutionary Communist Party is chartered in the satellite and the Central Councils take over the ministries. One revolution, one line, decided here."

 SOV_align_puppet_vanguard:0 "Install the Central Soviet"
 SOV_align_puppet_vanguard_desc:0 "The satellite gets the party Moscow gives it: Internatsionalistskaya partiya Kommunisticheskaya bor'ba (b), with a Central Soviet drawn up in advance and flown in. It has worked before."
 SOV_align_puppet_revolutionary:0 "Install the Central Councils"
 SOV_align_puppet_revolutionary_desc:0 "The Revolutionary Communist Party replaces whatever was governing here, and the Central Councils answer to the ones in the capital. Permanent revolution needs a permanent chain of command."

 dve_puppet.1.t:0 "The Line Comes From Abroad"
 dve_puppet.1.d:0 "The delegation did not ask. It arrived with a party statute already drafted, a list of names for the new council, and a printing press for the first issue of the paper. By the evening our government had been dissolved and reconstituted under a banner chosen in a foreign capital. Some of our people cheered. Some of them have stopped speaking to the rest."
 dve_puppet.1.a:0 "We serve the revolution, wherever it is decided."
