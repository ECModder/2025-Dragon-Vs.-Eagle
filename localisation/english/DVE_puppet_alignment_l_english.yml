l_english:
 DVE_puppet_alignment_category:0 "Alignment of the Satellites"

 ITA_align_puppet_vanguard:0 "Install the Workers' Councils"
 ITA_align_puppet_vanguard_desc:0 "Rome sends its own cadres and its own statute to every satellite at once. Their governments are dissolved and Internationalism - Communist Struggle takes their place, answering to the Workers' Councils and, through them, to us. Works on puppets and on faction members alike."
 ITA_align_puppet_revolutionary:0 "Install the Central Councils"
 ITA_align_puppet_revolutionary_desc:0 "The Revolutionary Communist Party is chartered in every satellite and the Central Councils take over their ministries. One revolution, one line, decided here."

 SOV_align_puppet_vanguard:0 "Install the Central Soviet"
 SOV_align_puppet_vanguard_desc:0 "Every satellite gets the party Moscow gives it: Internatsionalistskaya partiya Kommunisticheskaya bor'ba (b), with a Central Soviet drawn up in advance and flown in. It has worked before."
 SOV_align_puppet_revolutionary:0 "Install the Central Councils"
 SOV_align_puppet_revolutionary_desc:0 "The Revolutionary Communist Party replaces whatever was governing in each satellite, and their Central Councils answer to the one in the capital. Permanent revolution needs a permanent chain of command."

 dve_puppet.1.t:0 "The Line Comes From Abroad"
 dve_puppet.1.d:0 "The delegation did not ask. It arrived with a party statute already drafted, a list of names for the new council, and a printing press for the first issue of the paper. By the evening our government had been dissolved and reconstituted under a banner chosen in a foreign capital. Some of our people cheered. Some of them have stopped speaking to the rest."
 dve_puppet.1.a:0 "We serve the revolution, wherever it is decided."
