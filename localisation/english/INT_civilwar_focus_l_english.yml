l_english:
 INT_civil_war_focus:0 "Civilwar INT Path"

 INT_cw_internationalist_united_front:0 "Internationalist United Front"
 INT_cw_internationalist_united_front_desc:0 "Lotta Comunista, the PCR and the metalworkers of the FIOM have spent decades arguing over who betrayed the working class first. Now they man the same barricades from Turin to Trieste. The argument has only been postponed, but for once it can wait."
 INT_cw_against_stalinists_and_black_barons:0 "Against the Stalinists and the Black Barons"
 INT_cw_against_stalinists_and_black_barons_desc:0 "In Naples the Stalinists have hung the old portraits back on the walls; in Rome the Black Barons have dusted off the fasces. Two enemies, two fronts, and one conclusion: the revolution will be internationalist or it will not happen at all."

 INT_cw_permit_international_brigades:0 "Permit International Brigades"
 INT_cw_permit_international_brigades_desc:0 "They come over the Alpine passes and off the trains at Trieste, with rucksacks, old rifles and a dozen languages. Madrid once had its brigades. Now it is Milan's turn."
 INT_cw_permit_international_brigades_tt:0 "Revolutionary governments abroad become far more willing to send §Yvolunteers§! to [ROOT.GetNameDef]."
 INT_cw_leonardo_beretta_new_putilov:0 "Leonardo and Beretta, the New Putilov"
 INT_cw_leonardo_beretta_new_putilov_desc:0 "The workers' councils have taken over the Beretta works in the Val Trompia and the Leonardo plants around Turin. Every union leaflet makes the comparison with the Putilov factory, and this time the owners are not coming back."
 INT_cw_red_guards:0 "The Red Guards"
 INT_cw_red_guards_desc:0 "Factory squads from Mirafiori, Sesto San Giovanni and the Bologna rail yards, armed at the gate and sworn in on the shop floor. They are not an army yet, but they know every street in their neighbourhood."

 INT_cw_political_commissars:0 "Use Political Commissars"
 INT_cw_political_commissars_desc:0 "Every commander gets a comrade from the Party at their side, with the right to countersign orders and the right to relieve them. The officers complain. The desertions stop."
 INT_cw_confiscate_means_of_production:0 "Confiscate the Means of Production"
 INT_cw_confiscate_means_of_production_desc:0 "The decree is short: every factory, warehouse and depot in liberated territory belongs to the workers who run it. The committees take the keys, the managers take the train to Switzerland, and production answers to the front."
 INT_cw_conscription_for_women:0 "Conscription for Women Too"
 INT_cw_conscription_for_women_desc:0 "The partisan women of 1944 carried messages, weapons and rifles of their own, and afterwards were thanked and sent home. This time the decree is one line long and makes no distinction."

 INT_cw_every_weapon_must_be_used:0 "Every Weapon Must Be Used"
 INT_cw_every_weapon_must_be_used_desc:0 "Hunting rifles from the Apennines, old Garands from forgotten army depots, pistols collected from police stations. Half of it belongs in a museum, but a museum piece still fires."
 INT_cw_rehabilitating_factories:0 "Rehabilitating Factories for the Revolution"
 INT_cw_rehabilitating_factories_desc:0 "Shuttered plants across the industrial belt reopen, their lines stripped and refitted for the war by the same workers who were laid off from them. Nobody asks for overtime pay."
 INT_cw_call_to_arms_proletariat:0 "Call to Arms for the Proletariat"
 INT_cw_call_to_arms_proletariat_desc:0 "The same poster on every factory gate from Turin to Trieste: every worker who can hold a rifle is wanted at the front. The militias are turning into an army, with ranks, supply columns and a single chain of command."

 INT_cw_revolutionary_fervor:0 "Revolutionary Fervor"
 INT_cw_revolutionary_fervor_desc:0 "Every civil war has a moment when fear turns into momentum, and the side that reaches it first usually wins. In the north, that moment has come."
 INT_cw_revolutionary_vanguard_army:0 "A Revolutionary Vanguard Army"
 INT_cw_revolutionary_vanguard_army_desc:0 "The best of the militias are pulled out of the line, re-equipped and drilled into a strike force. They will be first through every breach, and they know it."

 INT_cw_if_lenin_could_see_us:0 "If Lenin Could See Us..."
 INT_cw_if_lenin_could_see_us_desc:0 "The last resistance in Rome has laid down its arms and the red flag flies over the Quirinale. Someone in the crowd wonders aloud what the old man would have made of it. Nobody answers. There is a country to build."
