
l_english:
 SWI_alpine_fortress:0 "The Alpine Fortress"
 SWI_alpine_fortress_desc:0 "Switzerland's mountainous terrain and extensive defensive preparations have long formed the backbone of its national security."

 SWI_schwyz_neutrality:0 "Swiss Neutrality"
 SWI_schwyz_neutrality_desc:0 "For generations, Switzerland has maintained its independence through a policy of neutrality, avoiding foreign conflicts while preserving its sovereignty."

 SWI_spirit_of_rutli:0 "Spirit of Rütli"
 SWI_spirit_of_rutli_desc:0 "The legendary Rütli Oath symbolizes the foundations of the Swiss Confederation, embodying the traditions of independence, unity and collective defence."

 SWI_land_of_chocolate_and_gold:0 "The Land of Chocolate and Gold"
 SWI_land_of_chocolate_and_gold_desc:0 "From its world-renowned banks to its chocolate and luxury industries, Switzerland has built an international reputation for wealth, quality and financial stability."

 SWI_swiss_consensus:0 "The Swiss Consensus"
 SWI_swiss_consensus_desc:0 "Direct democracy, federalism and a longstanding culture of political compromise have helped maintain stability across Switzerland's diverse cantons."

 SWI_workshops_of_helvetia:0 "Workshops of Helvetia"
 SWI_workshops_of_helvetia_desc:0 "Swiss precision engineering, watchmaking, pharmaceuticals and advanced manufacturing remain pillars of the country's innovative economy."

 SWI_surrounded_by_giants:0 "Surrounded by Giants"
 SWI_surrounded_by_giants_desc:0 "Though politically independent, Switzerland remains surrounded by larger European powers and deeply reliant on its neighbours for trade, energy and transportation."
