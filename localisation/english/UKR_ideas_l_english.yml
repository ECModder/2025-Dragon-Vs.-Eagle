l_english:
 UKR_the_war_for_ukraine:0 "The War for Ukraine"
 UKR_the_war_for_ukraine_desc:0 "Years of full-scale war have transformed every aspect of Ukrainian society. The survival of the state, the liberation of occupied territories and the defence of the nation dominate political, economic and military life."

 UKR_the_ukrainian_exodus:0 "The Ukrainian Exodus"
 UKR_the_ukrainian_exodus_desc:0 "Millions of Ukrainians have been forced from their homes by years of war. While many remain displaced within the country, millions more have sought refuge abroad, depriving Ukraine of workers, families and potential recruits."

 UKR_the_bulwark_of_europe:0 "The Bulwark of Europe"
 UKR_the_bulwark_of_europe_desc:0 "Years of war have transformed Ukraine into a heavily defended frontier on the eastern edge of Europe. Extensive battlefield experience has refined defensive tactics, strengthened fortifications and accelerated the development and adoption of new military technologies."

 UKR_economic_resilience:0 "Economic Resilience"
 UKR_economic_resilience_desc:0 "Despite years of war, damaged infrastructure and severe demographic pressures, the Ukrainian economy has proven remarkably resilient. Businesses have adapted to wartime conditions, production has been reorganized and vital industries continue to operate under constant threat. Nevertheless, the enormous cost of the war continues to constrain Ukraine's economic potential."

 UKR_democracy_under_martial_law:0 "Democracy Under Martial Law"
 UKR_democracy_under_martial_law_desc:0 "Ukraine remains a democratic republic, but war has fundamentally altered its political life. Martial law, postponed elections, mobilisation and the demands of national survival have concentrated authority in Kyiv."

 UKR_frontline_veterans:0 "Frontline Veterans"
 UKR_frontline_veterans_desc:0 "Years of continuous warfare have given Ukraine's armed forces extensive combat experience. Hard-earned lessons from the front have shaped a military accustomed to rapid adaptation, battlefield coordination and the demands of modern warfare."

 UKR_the_riches_of_ukraine:0 "The Riches of Ukraine"
 UKR_the_riches_of_ukraine_desc:0 "Ukraine possesses vast reserves of iron ore, manganese, titanium, graphite, coal and other strategically important resources. However, occupation, damaged infrastructure and the proximity of key deposits to the front have severely limited the country's ability to exploit its natural wealth."