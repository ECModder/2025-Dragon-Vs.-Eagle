 FRA_unstable_parliament:0 "Unstable Parliament"
 FRA_unstable_parliament_desc:0 "The 2024 snap elections have left the National Assembly deeply divided. No political bloc holds a clear majority, and the fall of Michel Barnier's government has shown just how fragile the Fifth Republic has become. François Bayrou now faces the same impossible task: finding enough support to govern without being brought down by his opponents. Every major decision risks opening another political crisis. Compromise may keep the government alive, but one wrong move could bring it all crashing down."

 FRA_crisis_of_confidence:0 "Crisis of Confidence"
 FRA_crisis_of_confidence_desc:0 "Emmanuel Macron's decision to call a snap election has failed to restore political stability. Instead, the country has entered 2025 with a weakened presidency and a population increasingly dissatisfied with its leadership. For many French citizens, the government no longer seems capable of solving the country's problems. Macron remains in office, but his authority has been seriously damaged. Rebuilding public confidence will require more than speeches and promises."

 FRA_agricultural_unrest:0 "Agricultural Unrest"
 FRA_agricultural_unrest_desc:0 "The agricultural crisis has not disappeared. French farmers remain frustrated by regulations, rising costs and competition from imports. Opposition to the EU-Mercosur trade agreement has added further fuel to their anger, and renewed tractor protests threaten to disrupt roads and put pressure on the government."

 FRA_social_discontent:0 "Social Discontent"
 FRA_social_discontent_desc:0 "Years of disputes over pensions, public services and the cost of living have left deep divisions in French society. The political crisis has only made matters worse, with many citizens feeling that their concerns are being ignored by those in power."
