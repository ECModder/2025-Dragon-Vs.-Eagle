l_english:

 DVE_arms_market_category:0 "Arms Market"
 DVE_arms_market_category_desc:0 "The Arms Market offers modern, top-of-the-line military equipment fresh off the assembly line - at a matching price."
 DVE_surplus_market_category:0 "Surplus Market"
 DVE_surplus_market_category_desc:0 "The Surplus Market provides access to older and retired military equipment at significantly lower prices.\nIt is intended primarily for countries that cannot afford modern equipment or simply need large quantities of inexpensive equipment."
 DVE_black_market_category:0 "Black Market"
 DVE_black_market_category_desc:0 "The Black Market provides access to equipment through illegal or unofficial channels. It primarily exists to allow countries to acquire equipment that would otherwise be unavailable to them.\nBlack Market purchases are generally smaller and relatively expensive."

