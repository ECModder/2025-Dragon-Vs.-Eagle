 dve_grecw.1.t:0 "Greece Divided"
 dve_grecw.1.d:0 "The consensus that held Greece together since the fall of the colonels has finally broken. In Athens and on the islands, SYRIZA, the KKE and the movements of the street have formed a §YPopular Front of the Left§!. In Thessaloniki the nationalist right, with much of the army behind it, has proclaimed a §YNational Front of the Right§! and refuses to recognise anyone in Athens.\n\nThe Hellenic Republic has stopped functioning. There is no longer one Greece, and every Greek must choose a side."
 dve_grecw.1.a:0 "Stand with the Popular Front of the Left"
 dve_grecw.1.b:0 "Stand with the National Front of the Right"

 dve_grecw.2.t:0 "Civil War in Greece"
 dve_grecw.2.d:0 "For the second time in less than a century, Greeks are fighting Greeks. Athens and the islands have fallen to a Popular Front of the Left, while the nationalist right holds Thessaloniki and the north under a National Front.\n\nEurope watches as a member of the Union and of NATO tears itself apart."
 dve_grecw.2.a:0 "Not again..."

 DVE_debug_greece_category:0 "DVE DEBUG - Greek Civil War"
 DVE_debug_greece_category_desc:0 "Debug tools for the Greek civil war. Visible only in debug mode, playing Greece."
 DVE_debug_greece_civil_war:0 "[DEBUG] Start the Greek Civil War"
 DVE_debug_greece_civil_war_desc:0 "Splits Greece between the Popular Front of the Left (GSR: Attica, Crete, Aegean Islands) and the National Front of the Right (GNR: Central Macedonia, Thrace, Epirus, Peloponnese, Dodecanese). Greece disappears: the choice event moves the player to the chosen side."
