l_english:

 dve_gendec.1.t:0 "Public Services Expanded"
 dve_gendec.1.d:0 "The public service investments authorized months ago are finally reaching ordinary people, and it shows in the public mood."
 dve_gendec.1.a:0 "Good."

 dve_gendec.2.t:0 "Infrastructure Modernized"
 dve_gendec.2.d:0 "The national infrastructure program is complete. Roads, rail and utilities across the country now move goods and people faster than before."
 dve_gendec.2.a:0 "Excellent."

 dve_gendec.3.t:0 "Opposition Crushed"
 dve_gendec.3.d:0 "The crackdown has run its course. The ruling party emerges stronger, though the manner of it has left its mark on the country's stability."
 dve_gendec.3.a:0 "It was necessary."

 dve_gendec.4.t:0 "Military Exercises"
 dve_gendec.4.d:0 "Which branch of the armed forces should be put through live exercises?"
 dve_gendec.4.a:0 "Train the Army."
 dve_gendec.4.b:0 "Naval Training."
 dve_gendec.4.c:0 "Train the Air Force."

 dve_gendec.5.t:0 "Army Training Complete"
 dve_gendec.5.d:0 "The exercises are over. The army has drawn real lessons from them."
 dve_gendec.5.a:0 "Good work."

 dve_gendec.6.t:0 "Naval Training Complete"
 dve_gendec.6.d:0 "The fleet returns to port. The exercises have sharpened the navy's edge."
 dve_gendec.6.a:0 "Good work."

 dve_gendec.7.t:0 "Air Force Training Complete"
 dve_gendec.7.d:0 "The squadrons return to base. The exercises have sharpened the air force's edge."
 dve_gendec.7.a:0 "Good work."

 dve_gendec.8.t:0 "Officer Corps Reformed"
 dve_gendec.8.d:0 "The expansion and reform of the officer corps is complete. Command of the army is now in more capable hands."
 dve_gendec.8.a:0 "Good."
