l_english:
 # ==== DvE - albero provvisorio della Revolutionary Socialist America ====
 RCA_root:0 "Revolutionary Socialist America"
 RCA_root_desc:0 "The republic that spent two centuries telling the world it was the alternative has become somebody else's alternative. The flag keeps the stripes."
 RCA_federal_reserve:0 "Seize the Federal Reserve"
 RCA_federal_reserve_desc:0 "Not nationalised - opened. The ledgers are the first thing the committees ask for and the last thing anyone expected them to understand."
 RCA_arsenals:0 "Nationalise the Arsenals"
 RCA_arsenals_desc:0 "The largest arms industry ever assembled, and for the first time nobody is asking what the shareholders think."
 RCA_arm_committees:0 "Arm the Committees"
 RCA_arm_committees_desc:0 "In a country with more rifles than citizens, the hard part was never the rifles."
 RCA_continental_congress:0 "The Continental Congress of Workers"
 RCA_continental_congress_desc:0 "Delegates from fifty states and four currents that have been arguing since the Second International, in a hall built for a Congress that no longer sits."
 RCA_internationalism:0 "Internationalism"
 RCA_internationalism_desc:0 "§YInternationalism - Communist Struggle§!\nThe American section of an organisation that is not American. It does not run candidates, it runs schools, and it regards the revolution it is standing in as one chapter of something with a longer index."
 RCA_cadre_before_crowd:0 "The Cadre Before the Crowd"
 RCA_cadre_before_crowd_desc:0 "A hundred people who have read everything, against a million who have read a pamphlet. The argument has never been settled and is not being settled now."
 RCA_one_section:0 "One Section of Something Larger"
 RCA_one_section_desc:0 "The Congress is informed that America is a front, not a cause. It does not take this well."
 RCA_internationalism_power:0 "All Power to the Councils"
 RCA_internationalism_power_desc:0 "The question the Congress was called to settle, settled."
 RCA_america_not_the_point:0 "America Is Not the Point"
 RCA_america_not_the_point_desc:0 "The most powerful state the world has produced declares that it is a means. Nobody outside the hall believes it means it."
 RCA_rca:0 "RCA"
 RCA_rca_desc:0 "§YRevolutionary Communist America§!\nThe section of the Revolutionary Communist International, and the current that actually made this happen. It has no intention of stopping now that it has a country."
 RCA_does_not_pause:0 "The Revolution Does Not Pause"
 RCA_does_not_pause_desc:0 "Every previous American revolution stopped the moment it had won something. This one has read the histories."
 RCA_carry_it_south:0 "Carry It South"
 RCA_carry_it_south_desc:0 "Two continents, one language of debt, and a great many people who remember exactly who held the paper."
 RCA_rca_power:0 "All Power to the Revolution"
 RCA_rca_power_desc:0 "The question the Congress was called to settle, settled."
 RCA_hemisphere_follows:0 "The Hemisphere Follows"
 RCA_hemisphere_follows_desc:0 "The Monroe Doctrine is not repealed. It is inverted, kept word for word, and applied by people who were on the other end of it."
 RCA_cpusa:0 "CPUSA"
 RCA_cpusa_desc:0 "§YCommunist Party USA§!\nA century old, surveilled for ninety of those years, and in possession of the only membership records in the country that were never digitised - which is why they still exist."
 RCA_oldest_party:0 "The Oldest Party in the Hall"
 RCA_oldest_party_desc:0 "Everyone else in the room is younger than the Party's oldest surviving grievance."
 RCA_discipline_over_enthusiasm:0 "Discipline Over Enthusiasm"
 RCA_discipline_over_enthusiasm_desc:0 "The committees are told, politely, that enthusiasm built the barricades and will not build a steel plant."
 RCA_cpusa_power:0 "All Power to the Party"
 RCA_cpusa_power_desc:0 "The question the Congress was called to settle, settled."
 RCA_party_with_a_continent:0 "A Party With a Continent"
 RCA_party_with_a_continent_desc:0 "The organisation that spent ninety years being infiltrated now runs the agency that used to do the infiltrating."
 RCA_psl:0 "PSL"
 RCA_psl_desc:0 "§YParty for Socialism and Liberation§!\nThe current that already had cadres in every city when the others had mailing lists. It is unsentimental about how power is held because it has spent a long time studying people who held it."
 RCA_already_organised:0 "The Party That Was Already Organised"
 RCA_already_organised_desc:0 "While the rest of the left held conferences, they held blocks."
 RCA_cadres_every_city:0 "Cadres in Every City"
 RCA_cadres_every_city_desc:0 "Not members. Cadres - a distinction the Congress is asked to take seriously."
 RCA_psl_power:0 "All Power to the Committee"
 RCA_psl_power_desc:0 "The question the Congress was called to settle, settled."
 RCA_republic_consolidated:0 "The Republic Consolidated"
 RCA_republic_consolidated_desc:0 "The revolution stops being an event and becomes an administration, which the other three currents call betrayal and the PSL calls Tuesday."
