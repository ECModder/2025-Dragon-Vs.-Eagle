l_english:
 conservatism:0 "Conservatism"
 conservatism_desc:0 "§HConservatism§!\n\n\n\n\n\n\n\n\n£img_conservatism \n\n\n\n\n\n\n\n\nConsidering rapid changes to society to be potentially harmful, conservatism espouses tradition and moderate reforms, sometimes advocating a return to old moral values."
 liberalism:0 "Liberalism"
 liberalism_desc:0 "With a long philosophical tradition of valuing personal liberty, liberalism views safeguarding these rights as the primary function of the state."
 socialism:0 "Socialism"
 socialism_desc:0 "§HSocialism§!\n\n\n\n\n\n\n\n\n£img_socialism \n\n\n\n\n\n\n\n\nStriving for equality and a socialist state by reformist means, democratic socialism aims to abolish or mitigate the effects of capitalism with public mandate."
 marxism:0 "Marxism"
 marxism_desc:0 "Encompassing a broad spectrum of economic and historical views, Marxist politics seek to apply the theories of Karl Marx to political practice. Class struggle and the need for transition to a society based on common ownership of the means of production characterize these ideologies."
 leninism:0 "Leninism"
 leninism_desc:0 "A political ideology based in Marxist thought, Leninism seeks to establish a socialist state by a vanguard party leading a revolution overthrowing capitalist society. Once in power, the party rules through a system whereby policies are open for internal debate until a decision has been made."
 stalinism:0 "Stalinism"
 stalinism_desc:1 "§HStalinism§!\n\n\n\n\n\n\n\n\n£img_stalinism \n\n\n\n\n\n\n\n\nIdentifying as a form of government applying and developing Marxist-Leninist policies, Stalinism emphasizes rapid industrialization and collectivization as well as the need for a strong, authoritative socialist state to purge any counter-revolutionary elements."
 anti_revisionism:0 "Anti-Revisionism"
 anti_revisionism_desc:0 "A reaction to the many ideologies claiming to be successors to Marxism, Anti-Revisionism advocates retaining key elements of original revolutionary theory. Mainly opposing incorporation of capitalist economic elements into socialist states, the ideology is defined as much by what it isn't as what it is."
 nazism:0 "Nazism"
 nazism_desc:0 "Rooted in extreme nationalism, National Socialism is driven by ideas of Germanic supremacy. It promotes aggressive expansionism and a totalitarian state where the people are united under a leader with absolute power, the Führer."
 gen_nazism:0 "Nazism"
 gen_nazism_desc:0 "Rooted in extreme nationalism, National Socialism is driven by ideas of racial supremacy. It promotes aggressive expansionism and a totalitarian state where the people are united under a leader with absolute power."
 fascism_ideology:0 "Fascism"
 fascism_ideology_desc:0 "Encompassing a variety of ultra-nationalist movements, fascism typically venerates devotion to the state and uniting the people under a strong leader."
 falangism:0 "Falangism"
 falangism_desc:0 "An authoritarian ideology with traits of fascism and conservatism, Falangism values national and Catholic identity."
 rexism:0 "Rexism"
 rexism_desc:0 "Strongly opposed to both liberal and communist ideals, Rexism is a staunchly conservative nationalist movement who advocate a corporatist economic policy. Employing increasingly populist and authoritarian rhetoric, their ideals are shifting closer to other fascist movements."
 neutrality:0 "Non-Aligned"
 neutrality_noun:0 "Non-Aligned"
 neutrality_desc:0 "Authoritarian Regime"
 despotism:0 "Despotic"
 despotism_desc:0 "Despotism is a form of government in which a single person rules with absolute power."
 oligarchism:0 "Oligarchic"
 oligarchism_desc:0 "Oligarchy is a form of government in which a group of people rule with absolute power."
 moderatism:1 "Moderatism"
 moderatism_desc:1 "Moderatism is a form of government which avoids the extremes of left and right by taking a moderate position or course of action."
 centrism:1 "Centrism"
 centrism_desc:1 "Centrism is a form of government which wants to achieve common sense solutions that appropriately address current and future needs, that support the public trust and serve the common good with consideration of risk and capacity in context of these needs."
 anarchism:0 "Anarchism"
 anarchism_desc:0 "Anarchism is the rejection of authority itself, promoting the division of society into self-managing and self-governing collectives instead of a singular, centralized state."

#Ideologies#
 ############
 #Totalitarian Socialism#
 totalitarian_socialism:0 "Totalitarian Socialist"
 totalitarian_socialism_noun:0 "Totalitarian Socialism"
 maoism:0 "Maoism"
 maoism_desc:0 "§HMaoism§!\n\n\n\n\n\n\n\n\n£img_maoism \n\n\n\n\n\n\n\n\nRevolution made by the countryside against the city and kept alive by permanent mobilisation. The masses are the party's raw material, and no victory is ever declared final."
 chekist_communism:0 "Chekist Communism"
 chekist_communism_desc:0 "§HChekist Communism§!\n\n\n\n\n\n\n\n\n£img_chekist_communism \n\n\n\n\n\n\n\n\nThe security service does not serve the party; it has become the party. Socialism is whatever the organs need it to be in order to keep watching."
 jacobinism:0 "Jacobinism"
 jacobinism_desc:0 "§HJacobinism§!\n\n\n\n\n\n\n\n\n£img_jacobinism \n\n\n\n\n\n\n\n\nVirtue enforced by the committee. The republic of equals is defended against its enemies with emergency powers that never quite expire."
 transhumanistanarchoprimitivism:0 "Transhumanist-anarcho-primitivism"
 transhumanistanarchoprimitivism_desc:0 "§HTranshumanist-anarcho-primitivism§!\n\n\n\n\n\n\n\n\n£img_transhumanistanarchoprimitivism \n\n\n\n\n\n\n\n\nAbolish civilisation, keep the upgrades. A doctrine that wants the forest back and the human body rebuilt to survive in it, and sees no contradiction between the two."
 juche:0 "Juche"
 juche_desc:0 "§HJuche§!\n\n\n\n\n\n\n\n\n£img_juche \n\n\n\n\n\n\n\n\nSelf-reliance raised to a state religion: one leader, one line, and a nation organised as a single fortress that owes nothing to anybody."
 Pol_Pot_Thought:0 "Pol Pot Thought"
 Pol_Pot_Thought_desc:0 "§HPol Pot Thought§!\n\n\n\n\n\n\n\n\n£img_pol_pot_thought \n\n\n\n\n\n\n\n\nYear Zero. Cities are emptied, money is abolished and the past is declared closed, in the name of a peasant utopia that only the Organisation can see."
 #Authoritarian Socialism#
 FACTION_AUTHSOC_1:0 "Council of Mutual Defence"
 FACTION_AUTHSOC_2:0 "Union of Socialist States"
 authoritarian_socialism:0 "Authoritarian Socialist"
 authoritarian_socialism_noun:0 "Authoritarian Socialism"
 authoritarian_socialism_desc:0 "State socialism in its managerial form: a single party holds every lever of the state, the market is tolerated as long as it stays useful, and the revolution is declared finished. Order and continuity come before doctrine."
 socialist_military_junta:0 "Socialist Military Junta"
 socialist_military_junta_desc:0 "§HSocialist Military Junta§!\n\n\n\n\n\n\n\n\n£img_socialist_military_junta \n\n\n\n\n\n\n\n\nThe officers have seized power in the name of the workers and intend to keep it on their behalf. Barracks discipline is presented as the shortest road to socialism."
 sovietism:0 "Sovietism"
 sovietism_desc:0 "§HSovietism§!\n\n\n\n\n\n\n\n\n£img_sovietism \n\n\n\n\n\n\n\n\nGovernment by the councils, in name at least. Power flows upward through a pyramid of soviets that ratifies what the party has already decided."
 authoritarian_communism:0 "Authoritarian Communism"
 authoritarian_communism_desc:0 "§HAuthoritarian Communism§!\n\n\n\n\n\n\n\n\n£img_authoritarian_communism \n\n\n\n\n\n\n\n\nThe party owns the state and the state owns everything else. Communism administered from the top down, where discipline is the doctrine and dissent is a management problem."
 Workerism:0 "Workerism"
 Workerism_desc:0 "§HWorkerism§!\n\n\n\n\n\n\n\n\n£img_workerism \n\n\n\n\n\n\n\n\nPolitics begins and ends at the factory gate. The party exists to serve the shop floor, and anyone who has never worked a shift has no business speaking for those who have."
 transhumanist:0 "Transhumanist"
 transhumanist_desc:0 "§HTranshumanist§!\n\n\n\n\n\n\n\n\n£img_transhumanist \n\n\n\n\n\n\n\n\nThe workers' state as an engineering project: technology is expected to finish the job that politics started, and the human being is one more system to be improved."
 left_nationalism:0 "Left Nationalism"
 left_nationalism_desc:0 "§HLeft Nationalism§!\n\n\n\n\n\n\n\n\n£img_left_nationalism \n\n\n\n\n\n\n\n\nSocialism inside one nation and for it: the class struggle is fought first of all against foreign capital, and the flag flies over the red banner."
 market_socialism:0 "Market Socialism"
 market_socialism_desc:0 "§HMarket Socialism§!\n\n\n\n\n\n\n\n\n£img_market_socialism \n\n\n\n\n\n\n\n\nPublic ownership of the commanding heights, private competition everywhere else. The plan sets the direction, the market sets the prices."
 xi_jinping_thought:0 "Xi Jinping Thought"
 xi_jinping_thought_desc:0 "§HXi Jinping Thought§!\n\n\n\n\n\n\n\n\n£img_xi_jinping_thought \n\n\n\n\n\n\n\n\nSocialism with national characteristics for a new era: a disciplined party, a managed economy and a state that claims its place at the centre of the world."
 Deutsche_Communism:0 "Deutsche Communism"
 Deutsche_Communism_desc:0 "§HDeutsche Communism§!\n\n\n\n\n\n\n\n\n£img_deutsche_communism \n\n\n\n\n\n\n\n\nThe German road to socialism, built on heavy industry, a vast security apparatus and the conviction that the workers' state must never be left unguarded."
 deutsche_conservatorist_socialism:0 "Deutsche Conservatorist Socialism"
 deutsche_conservatorist_socialism_desc:0 "§HDeutsche Conservatorist Socialism§!\n\n\n\n\n\n\n\n\n£img_deutsche_conservatorist_socialism \n\n\n\n\n\n\n\n\nSocialism kept as an institution rather than a promise: the workers' state is preserved the way a nation preserves its church and its army, with discipline, order and a deep suspicion of anyone who wants to reform it."
 maximalism:0 "Maximalism"
 maximalism_desc:0 "§HMaximalism§!\n\n\n\n\n\n\n\n\n£img_maximalism \n\n\n\n\n\n\n\n\nNo half measures and no coalitions: the maximum programme, at once, or nothing at all."
 anarchoprimitivism:0 "Anarcho-Primitivism"
 anarchoprimitivism_desc:0 "§HAnarcho-Primitivism§!\n\n\n\n\n\n\n\n\n£img_anarchoprimitivism \n\n\n\n\n\n\n\n\nIndustrial civilisation is the problem, not the means. Dismantle the machine and let people live at a human scale again."
 populist_socialism:0 "Populist Socialism"
 populist_socialism_desc:0 "§HPopulist Socialism§!\n\n\n\n\n\n\n\n\n£img_populist_socialism \n\n\n\n\n\n\n\n\nSocialism run from the rally, not the politburo. The line comes from whoever the crowd is still listening to this month, and the party apparatus exists to keep up with them."
 #Vanguard Socialism#
 vanguard_socialism:0 "Vanguard Socialist"
 vanguard_socialism_noun:0 "Vanguard Socialism"
 leninist_internationalism:0 "Leninist Internationalism"
 leninist_internationalism_desc:0 "§HLeninist Internationalism§!\n\n\n\n\n\n\n\n\n£img_leninist_internationalism \n\n\n\n\n\n\n\n\nThe party as the general staff of the working class, built by patient work in the factories and bound to a single strategy. The revolution is international or it is nothing."
 trotskyism:0 "Trotskyism"
 trotskyism_desc:0 "§HTrotskyism§!\n\n\n\n\n\n\n\n\n£img_trotskyism \n\n\n\n\n\n\n\n\nPermanent revolution and workers' democracy, against both capital and the bureaucracy that claims to have replaced it. The revolution must spread, or it will rot."
 neo_sovietism:0 "Neo-Sovietism"
 neo_sovietism_desc:0 "§HNeo-Sovietism§!\n\n\n\n\n\n\n\n\n£img_neo_sovietism \n\n\n\n\n\n\n\n\nThe Union was a mistake only in the way it ended. A new generation wants the councils, the planning and the red flag back, this time with servers instead of typewriters."
 left_communism:0 "Left Communism"
 left_communism_desc:0 "§HLeft Communism§!\n\n\n\n\n\n\n\n\n£img_left_communism \n\n\n\n\n\n\n\n\nAgainst parliaments, unions and national fronts alike: the class emancipates itself through its own councils, or it merely changes masters."
 #Revolutionary Socialism#
 revolutionary_socialism:0 "Revolutionary Socialist"
 revolutionary_socialism_noun:0 "Revolutionary Socialism"
 left_baathism:0 "Left Baathism"
 left_baathism_desc:0 "§HLeft Baathism§!\n\n\n\n\n\n\n\n\n£img_left_baathism \n\n\n\n\n\n\n\n\nArab unity, liberty and socialism, read from the left: land reform, nationalised oil and a single party that speaks in the name of the Arab masses."
 left_anarchist:0 "Left Anarchist"
 left_anarchist_desc:0 "§HLeft Anarchist§!\n\n\n\n\n\n\n\n\n£img_left_anarchist \n\n\n\n\n\n\n\n\nNo gods, no masters, no central committee. Federated communes and assemblies take the place of the state, which is not to be conquered but dismantled."
 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "§HSyndicalism§!\n\n\n\n\n\n\n\n\n£img_syndicalism \n\n\n\n\n\n\n\n\nThe union is the school, the weapon and the future government of the working class. The general strike takes the economy, and the federations of producers run it."
 nasserism:0 "Nasserism"
 nasserism_desc:0 "§HNasserism§!\n\n\n\n\n\n\n\n\n£img_nasserism \n\n\n\n\n\n\n\n\nArab socialism under a strong president: anti-imperialism, state-led industry and a single mass movement, with the army as guardian of the revolution."
 zapatismo:0 "Zapatismo"
 zapatismo_desc:0 "§HZapatismo§!\n\n\n\n\n\n\n\n\n£img_zapatismo \n\n\n\n\n\n\n\n\nTo lead by obeying. Indigenous communities govern themselves through assemblies and rotating councils, and ask of the state only that it stays away."
 #Reformist Socialism (id: progressive)#
 progressive:0 "Reformist Socialist"
 progressive_noun:0 "Reformist Socialism"
 progressivism:0 "Progressivism"
 progressivism_desc:0 "§HProgressivism§!\n\n\n\n\n\n\n\n\n£img_progressivism \n\n\n\n\n\n\n\n\nReform as a habit of mind: expand rights, tax wealth, regulate the powerful, and trust that institutions can be made fairer one law at a time."
 reformist_socialism:0 "Reformist Socialism"
 reformist_socialism_desc:0 "§HReformist Socialism§!\n\n\n\n\n\n\n\n\n£img_reformist_socialism \n\n\n\n\n\n\n\n\nSocialism by ballot and by statute. Capitalism is to be outgrown through nationalisations, strong unions and a welfare state, without anybody storming anything."
 social_democracy:0 "Social Democracy"
 social_democracy_desc:0 "§HSocial Democracy§!\n\n\n\n\n\n\n\n\n£img_social_democracy \n\n\n\n\n\n\n\n\nA market economy tamed by collective bargaining, public services and progressive taxation. The class struggle is settled around a table, and everyone gets a pension."
 neo_socialism:0 "Neo-Socialism"
 neo_socialism_desc:0 "§HNeo-Socialism§!\n\n\n\n\n\n\n\n\n£img_neo_socialism \n\n\n\n\n\n\n\n\nPlanning, order and the nation in place of class war. A socialism that has lost patience with parliament and looks to a strong state and its technicians."
 #Liberal#
 liberal:0 "Liberal"
 liberal_noun:0 "Liberalism"
 social_liberal:0 "Social Liberalism"
 social_liberal_desc:0 "§HSocial Liberalism§!\n\n\n\n\n\n\n\n\n£img_social_liberal \n\n\n\n\n\n\n\n\nIndividual freedom needs more than the absence of the state: it needs schools, hospitals and a safety net. Civil rights and a regulated market, kept in careful balance."
 left_centrist:0 "Left Centrist"
 left_centrist_desc:0 "§HLeft Centrist§!\n\n\n\n\n\n\n\n\n£img_left_centrist \n\n\n\n\n\n\n\n\nModerate reformism for voters who distrust ideology: fiscal prudence with a social conscience, and an instinct for the coalition that offends the fewest."
 left_populism:0 "Left Populism"
 left_populism_desc:0 "§HLeft Populism§!\n\n\n\n\n\n\n\n\n£img_left_populism \n\n\n\n\n\n\n\n\nThe people against the oligarchy. A charismatic movement that turns anger at the elites into a programme of redistribution, sovereignty and direct appeal to the squares."
 green_leftist:0 "Green Leftist"
 green_leftist_desc:0 "§HGreen Leftist§!\n\n\n\n\n\n\n\n\n£img_green_leftist \n\n\n\n\n\n\n\n\nClimate and class are the same fight. Ecological transition, redistribution and grassroots democracy, pursued by parties that began as movements and still argue like them."
 #Centrist#
 centrist:0 "Centrist"
 centrist_noun:0 "Centrism"
 centrist_desc:0 "Centrism is a political position that rejects ideological extremes in an attempt to strike a balance between social justice and economic freedom. It supports pragmatism, compromise and gradual reform rather than radical change in order to preserve society’s stability. It combines progressive social values with regulated market economics in order to protect individual rights and democratic institutions."
 liberal_socialdemocrat:0 "Liberal Socialdemocrat"
 liberal_socialdemocrat_desc:0 "§HLiberal Socialdemocrat§!\n\n\n\n\n\n\n\n\n£img_liberal_socialdemocrat \n\n\n\n\n\n\n\n\nIt is an ideology that blends individual self-determination with a strong, caring welfare state. The government intervenes in the market to actively diminish wealth and social inequalities. Equal opportunity is the result of public funding for education and national infrastructure. The ultimate goal is to see robust economic growth and social peace as mutually reinforcing goals."
 green_liberalism:0 "Green Liberalism"
 green_liberalism_desc:0 "§HGreen Liberalism§!\n\n\n\n\n\n\n\n\n£img_green_liberalism \n\n\n\n\n\n\n\n\nGreen liberalism is the use of market economic instruments in the service of strong environmental protection. It favors technological innovation and financial incentives over strict government bans and regulations. Use smart market signals such as carbon taxation to achieve ecological sustainability. From this perspective, environmental stewardship is a major opportunity for economic growth."
 ultra_liberalism:0 "Ultra Liberalism"
 ultra_liberalism_desc:0 "§HUltra Liberalism§!\n\n\n\n\n\n\n\n\n£img_ultra_liberalism \n\n\n\n\n\n\n\n\nThis philosophy prizes personal independence and economic freedom above all else. It calls for a major reduction in the role of government, in taxes and in welfare provision. Free market competition is seen as the most efficient regulator for society. This system substitutes state-backed collective safety nets with individual responsibility entirely."
 centrist_populism:0 "Centrist Populism"
 centrist_populism_desc:0 "§HCentrist Populism§!\n\n\n\n\n\n\n\n\n£img_centrist_populism \n\n\n\n\n\n\n\n\nThis kind of politics claims to be the voice of reason for the reasonable majority. It sharply distances itself from the perceived dangers of both far-right and far-left extremes. Very pragmatic, direct and popular solutions are used to solve complex problems of the society. The movement mobilizes the broad mass of moderate citizens with an anti-elite rhetoric."
 #Conservative#
 conservative:0 "Conservative"
 conservative_noun:0 "Conservatism"
 classical_liberalism:0 "Classical Liberalism"
 classical_liberalism_desc:0 "§HClassical Liberalism§!\n\n\n\n\n\n\n\n\n£img_classical_liberalism \n\n\n\n\n\n\n\n\nLimited government, free trade and the rule of law. The state should guard property and contracts, and otherwise keep out of the citizen's way."
 civic_nationalism:0 "Civic Nationalism"
 civic_nationalism_desc:0 "§HCivic Nationalism§!\n\n\n\n\n\n\n\n\n£img_civic_nationalism \n\n\n\n\n\n\n\n\nThe nation as a community of citizens rather than of blood: shared institutions, a shared language of rights, and loyalty owed to the constitution above all."
 trumpism:0 "Trumpism"
 trumpism_desc:0 "§HTrumpism§!\n\n\n\n\n\n\n\n\n£img_trumpism \n\n\n\n\n\n\n\n\nAmerica first, and the leader before the party. Tariffs, closed borders and open contempt for the establishment, held together by rallies and a permanent sense of grievance."
 americanism:0 "Americanism"
 americanism_desc:0 "§HAmericanism§!\n\n\n\n\n\n\n\n\n£img_americanism \n\n\n\n\n\n\n\n\nThe nation as a creed rather than a party programme: borders, industry and family put back at the centre, and a foreign policy that asks what is in it for America first."
 constitutionalist:0 "Constitutionalist"
 constitutionalist_desc:0 "§HConstitutionalist§!\n\n\n\n\n\n\n\n\n£img_constitutionalist \n\n\n\n\n\n\n\n\nThe charter is the only sovereign. Powers are separated, mandates are limited, and every reform must first answer the question of whether it is permitted."
 christian_democracy:0 "Christian Democracy"
 christian_democracy_desc:0 "§HChristian Democracy§!\n\n\n\n\n\n\n\n\n£img_christian_democracy \n\n\n\n\n\n\n\n\nSocial market economy, family and subsidiarity. A broad popular party that takes its ethics from the Church and its votes from the middle of society."
 classical_populism:0 "Classical Populism"
 classical_populism_desc:0 "§HClassical Populism§!\n\n\n\n\n\n\n\n\n£img_classical_populism \n\n\n\n\n\n\n\n\nThe plain people against the politicians. No fixed doctrine, only a promise to lower taxes, cut privileges and say aloud what the voter says at home."
 national_liberalism:0 "National Liberalism"
 national_liberalism_desc:0 "§HNational Liberalism§!\n\n\n\n\n\n\n\n\n£img_national_liberalism \n\n\n\n\n\n\n\n\nFree markets at home and a firm flag abroad. Liberal in the economy, conservative on identity, and convinced that the nation-state is liberty's natural home."
 #Reactionary#
 reactionary:0 "Reactionary"
 reactionary_noun:0 "Reactionaryism"
 military_democracy:0 "Military Democracy"
 military_democracy_desc:0 "§HMilitary Democracy§!\n\n\n\n\n\n\n\n\n£img_military_democracy \n\n\n\n\n\n\n\n\nThis system is a cross between a democratic voting one and a general strong military leadership one. It places national security and strict discipline at the core of civic life. The right to participate in civic life is often contingent upon military service or loyalty to the ideals of national defense. It aims to uphold the democratic order through institutional strength, hierarchy and armed readiness."
 paleoconservative:0 "Paloconservative"
 paleoconservative_desc:0 "This ideology emphasizes local identity, traditional values, and tight restriction of government interference. It is strongly opposed to mass immigration, globalist economic treaties, and foreign military interventions. Religious traditions and the nuclear family are the ultimate bases of civil society. It supports economic protectionism to shield local workers and local cultures from global influences. "
 traditionalismo:0 "Traditionalismo"
 traditionalismo_desc:0 "§HTraditionalismo§!\n\n\n\n\n\n\n\n\n£img_traditionalismo \n\n\n\n\n\n\n\n\nGod, fatherland, ancient rights and the legitimate king. A counter-revolution that has been waiting, patiently and in arms, since the nineteenth century."
 clericalism:0 "Clericalism"
 clericalism_desc:0 "§HClericalism§!\n\n\n\n\n\n\n\n\n£img_clericalism \n\n\n\n\n\n\n\n\nThe Church as the conscience of the state, with a veto over its laws. Schools, marriage and public morals are handed back to those who claim to know best."
 corporatism:0 "Corporatism"
 corporatism_desc:0 "§HCorporatism§!\n\n\n\n\n\n\n\n\n£img_corporatism \n\n\n\n\n\n\n\n\nSociety as a body, with each profession an organ. Employers and workers are bound into state-supervised corporations, so that class conflict has nowhere to happen."
 hardline_conservatism:0 "Hardline Conservatism"
 hardline_conservatism_desc:0 "§HHardline Conservatism§!\n\n\n\n\n\n\n\n\n£img_hardline_conservatism \n\n\n\n\n\n\n\n\nOrder, borders and identity, defended without apology. A right that keeps the ballot box but has stopped pretending to like the liberal consensus around it."
 paternalism:0 "Paternalism"
 paternalism_desc:0 "§HPaternalism§!\n\n\n\n\n\n\n\n\n£img_paternalism \n\n\n\n\n\n\n\n\nThe state as a stern father: it provides, protects and decides. Citizens are cared for as long as they do not ask to be consulted."
 paleoconservatism:0 "Paleoconservatism"
 paleoconservatism_desc:0 "§HPaleoconservatism§!\n\n\n\n\n\n\n\n\n£img_paleoconservatism \n\n\n\n\n\n\n\n\nThis ideology emphasizes local identity, traditional values, and tight restriction of government interference. It is strongly opposed to mass immigration, globalist economic treaties, and foreign military interventions. Religious traditions and the nuclear family are the ultimate bases of civil society. It supports economic protectionism to shield local workers and local cultures from global influences."
 conservative_zionist:0 "Conservative Zionism"
 conservative_zionist_desc:0 "§HConservative Zionism§!\n\n\n\n\n\n\n\n\n£img_conservative_zionist \n\n\n\n\n\n\n\n\nSecurity first, and the whole Land of Israel: a strong army, free enterprise and a national identity rooted in tradition, with little faith in concessions."
 #Authoritarianism#
 authoritarianism:0 "Authoritarian"
 authoritatianism_noun:0 "Authoritarianism"
 putinism:0 "Putinism"
 putinism_desc:0 "§HPutinism§!\n\n\n\n\n\n\n\n\n£img_putinism \n\n\n\n\n\n\n\n\nA vertical of power resting on the security services, the state companies and a restored sense of national greatness. Stability is the promise, and loyalty the only real institution."
 patriotic_socialism:0 "Patriotic Socialism"
 patriotic_socialism_desc:0 "§HPatriotic Socialism§!\n\n\n\n\n\n\n\n\n£img_patriotic_socialism \n\n\n\n\n\n\n\n\nWelfare for the nation, discipline for its critics. A ruling movement that mixes social spending with flags, and treats opposition as a foreign import."
 illiberal_democracy:0 "Illiberal Democracy"
 illiberal_democracy_desc:0 "§HIlliberal Democracy§!\n\n\n\n\n\n\n\n\n£img_illiberal_democracy \n\n\n\n\n\n\n\n\nElections are held and regularly won. In between, courts, media and universities are brought into line, so that the next result is never in much doubt."
 oligarchy:0 "Oligarchy"
 oligarchy_desc:0 "§HOligarchy§!\n\n\n\n\n\n\n\n\n£img_oligarchy \n\n\n\n\n\n\n\n\nA handful of families and fortunes share out the state between them. Governments change; the owners of the ports, the banks and the television do not."
 technocracy:0 "Technocracy"
 technocracy_desc:0 "§HTechnocracy§!\n\n\n\n\n\n\n\n\n£img_technocracy \n\n\n\n\n\n\n\n\nGovernment by those who know. Engineers and economists run the country as a problem to be optimised, and consider politics the main source of error."
 guided_democracy:0 "Guided Democracy"
 guided_democracy_desc:0 "§HGuided Democracy§!\n\n\n\n\n\n\n\n\n£img_guided_democracy \n\n\n\n\n\n\n\n\nThe people vote, but within limits drawn by a guide who knows where the nation should go. Consensus is organised from above and then solemnly consulted."
 autocratic_liberalism:0 "Autocratic Liberalism"
 autocratic_liberalism_desc:0 "§HAutocratic Liberalism§!\n\n\n\n\n\n\n\n\n£img_autocratic_liberalism \n\n\n\n\n\n\n\n\nOpen markets under a closed political system. Investors enjoy every guarantee that voters are denied, and growth is offered in place of consent."
 #Autocracy#
 autocracy:0 "Autocratic"
 autocracy_noun:0 "Autocracy"
 populist_putinism:0 "Populist Putinism"
 mafia_state:0 "Mafia State"
 mafia_state_desc:0 "§HMafia State§!\n\n\n\n\n\n\n\n\n£img_mafia_state \n\n\n\n\n\n\n\n\nOrganised crime and public office have merged into a single structure. Contracts, courts and police are run as a protection racket with a flag."
 red_army:0 "Red Army"
 red_army_desc:0 "§HRed Army§!\n\n\n\n\n\n\n\n\n£img_red_army \n\n\n\n\n\n\n\n\nThe army that won the civil war has not handed the state back. Commanders and commissars govern in the name of the revolution, by order of the day."
 peoples_liberation_army:0 "People's Liberation Army"
 peoples_liberation_army_desc:0 "§HPeople's Liberation Army§!\n\n\n\n\n\n\n\n\n£img_peoples_liberation_army \n\n\n\n\n\n\n\n\nThe gun commands the party. The armed forces rule directly, combining a Marxist vocabulary with the habits of a general staff."
 us_army:0 "US Army"
 us_army_desc:0 "§HUS Army§!\n\n\n\n\n\n\n\n\n£img_us_army \n\n\n\n\n\n\n\n\nThe Joint Chiefs have assumed the powers of a paralysed republic. The constitution is said to be merely suspended, pending a return to normality."
 personal_dictatorship:0 "Personal Dictatorship"
 personal_dictatorship_desc:0 "§HPersonal Dictatorship§!\n\n\n\n\n\n\n\n\n£img_personal_dictatorship \n\n\n\n\n\n\n\n\nOne ruler, and no ideology worth the name. Power is kept through patronage, fear and a talent for outliving every rival."
 theocratic_autocracy:0 "Theocratic Autocracy"
 theocratic_autocracy_desc:0 "§HTheocratic Autocracy§!\n\n\n\n\n\n\n\n\n£img_theocratic_autocracy \n\n\n\n\n\n\n\n\nSupreme authority belongs to a religious leader who answers to God alone. The clergy staff the state, and scripture serves as its constitution."
 kleptocracy:0 "Kleptocracy"
 kleptocracy_desc:0 "§HKleptocracy§!\n\n\n\n\n\n\n\n\n£img_kleptocracy \n\n\n\n\n\n\n\n\nThe state exists to be looted by those who run it. Offices are investments, the budget is the return, and elections are a business expense."
 securocracy:0 "Securocracy"
 securocracy_desc:0 "§HSecurocracy§!\n\n\n\n\n\n\n\n\n£img_securocracy \n\n\n\n\n\n\n\n\nThe country is run by its intelligence chiefs and interior ministers. Every question is a security question, and every answer is classified."
 military_dictatorship:0 "Military Dictatorship"
 military_dictatorship_desc:0 "§HMilitary Dictatorship§!\n\n\n\n\n\n\n\n\n£img_military_dictatorship \n\n\n\n\n\n\n\n\nA general rules in his own name, with the army as his party. The constitution is suspended until further notice, and notice is never given."
 personalist_dictatorship:0 "Personalist Dictatorship"
 personalist_dictatorship_desc:0 "§HPersonalist Dictatorship§!\n\n\n\n\n\n\n\n\n£img_personalist_dictatorship \n\n\n\n\n\n\n\n\nThe state is one man, his relatives and his portrait. Institutions exist to carry out his will, and to be blamed when it fails."
 theocratic_dictatorship:0 "Theocratic Dictatorship"
 theocratic_dictatorship_desc:0 "§HTheocratic Dictatorship§!\n\n\n\n\n\n\n\n\n£img_theocratic_dictatorship \n\n\n\n\n\n\n\n\nA single ruler governs with the sanction of the clergy. Dissent is at once a crime and a sin, which saves the courts some time."
 technocratic_dictatorship:0 "Technocratic Dictatorship"
 technocratic_dictatorship_desc:0 "§HTechnocratic Dictatorship§!\n\n\n\n\n\n\n\n\n£img_technocratic_dictatorship \n\n\n\n\n\n\n\n\nAn unelected cabinet of experts with emergency powers. The plan is rational, the figures add up, and nobody was asked."
 corporatocracy:0 "Corporatocracy"
 corporatocracy_desc:0 "§HCorporatocracy§!\n\n\n\n\n\n\n\n\n£img_corporatocracy \n\n\n\n\n\n\n\n\nThe largest companies no longer lobby the government: they are the government. Policy is decided in boardrooms and announced like a quarterly result."
 military_junta:0 "Military Junta"
 military_junta_desc:0 "§HMilitary Junta§!\n\n\n\n\n\n\n\n\n£img_military_junta \n\n\n\n\n\n\n\n\nA council of officers holds power collectively after the coup. Army, navy and air force each take their share, and call the arrangement national salvation."
 soviet_army:0 "Soviet Army"
 soviet_army_desc:0 "§HSoviet Army§!\n\n\n\n\n\n\n\n\n£img_soviet_army \n\n\n\n\n\n\n\n\nMarshals in place of secretaries. The armed forces have taken over a socialist state in order to save it from its own politicians."
 #Absolutism#
 absolutism:0 "Absolutist"
 absolutism_noun:0 "Absolutism"
 monarchism:0 "Monarchism"
 monarchism_desc:0 "§HMonarchism§!\n\n\n\n\n\n\n\n\n£img_monarchism \n\n\n\n\n\n\n\n\nThe crown as the living symbol of the nation and the guarantee of its continuity. A king above the parties and, ideally, above the quarrel."
 casa_savoia:0 "Casa Savoia"
 casa_savoia_desc:0 "§HCasa Savoia§!\n\n\n\n\n\n\n\n\n£img_casa_savoia \n\n\n\n\n\n\n\n\nThe House of Savoy returns to the Quirinal. The dynasty that united Italy offers itself once more as the one institution older than the country's divisions."
 absolute_monarchy:0 "Absolute Monarchy"
 absolute_monarchy_desc:0 "§HAbsolute Monarchy§!\n\n\n\n\n\n\n\n\n£img_absolute_monarchy \n\n\n\n\n\n\n\n\nThe sovereign reigns and governs. Ministers serve at his pleasure, the law is his decree, and the dynasty is the only constitution."
 divine_monarchy:0 "Divine Monarchy"
 divine_monarchy_desc:0 "§HDivine Monarchy§!\n\n\n\n\n\n\n\n\n£img_divine_monarchy \n\n\n\n\n\n\n\n\nThe ruler holds the throne by the will of heaven and is himself an object of reverence. To question him is not politics but blasphemy."
 imperial_monarchy:0 "Imperial Monarchy"
 oligarchic_monarchy:0 "Oligarchic Monarchy"
 oligarchic_monarchy_desc:0 "§HOligarchic Monarchy§!\n\n\n\n\n\n\n\n\n£img_oligarchic_monarchy \n\n\n\n\n\n\n\n\nA king reigns, but a circle of great families and princes divides the offices and the revenue. The throne is the seal on their agreement."
 theocratic_monarchy:0 "Theocratic Monarchy"
 theocratic_monarchy_desc:0 "§HTheocratic Monarchy§!\n\n\n\n\n\n\n\n\n£img_theocratic_monarchy \n\n\n\n\n\n\n\n\nCrown and altar in one person. The monarch is both sovereign and guardian of the faith, and governs with the clergy as his natural ministers."
 imperial_autocracy:0 "Imperial Autocracy"
 imperial_autocracy_desc:0 "§HImperial Autocracy§!\n\n\n\n\n\n\n\n\n£img_imperial_autocracy \n\n\n\n\n\n\n\n\nOne emperor over many peoples, ruling by decree through governors and guards. The empire is its own justification."
 #Ultranationalism#
 ultranationalism:0 "Ultranationalist"
 ultranationalism_noun:0 "Ultranationalism"
 neo_fascist:0 "Neo-Fascist"
 neo_fascist_desc:0 "§HNeo-Fascist§!\n\n\n\n\n\n\n\n\n£img_neo_fascist \n\n\n\n\n\n\n\n\nThe heirs of the regime in new suits. Nation, order and the strong state, with the nostalgia kept just deniable enough for television."
 neo_nazist:0 "Neo-Nazist"
 neo_nazist_desc:0 "§HNeo-Nazist§!\n\n\n\n\n\n\n\n\n£img_neo_nazist \n\n\n\n\n\n\n\n\nRacial doctrine and the cult of violence, handed down by a movement that lost a world war and learned nothing from it."
 fascist:0 "Fascist"
 fascist_desc:0 "§HFascist§!\n\n\n\n\n\n\n\n\n£img_fascist \n\n\n\n\n\n\n\n\nEverything within the state, nothing outside it. One leader, one party and a nation mobilised like an army, for which war is the natural condition."
 nationalsocialist:0 "NationalSocialist"
 nationalsocialist_desc:0 "§HNationalSocialist§!\n\n\n\n\n\n\n\n\n£img_nationalsocialist \n\n\n\n\n\n\n\n\nThe national community defined by blood and led by a single will. Expansion abroad and persecution at home are the same policy."
 nazi_maoism:0 "Nazi Maoism"
 nazi_maoism_desc:0 "§HNazi Maoism§!\n\n\n\n\n\n\n\n\n£img_nazi_maoism \n\n\n\n\n\n\n\n\nPeople's war for the fatherland. A fringe doctrine that borrows the methods of the far left to serve the myths of the far right."
 strassarite:0 "Strassarite"
 strassarite_desc:0 "§HStrassarite§!\n\n\n\n\n\n\n\n\n£img_strassarite \n\n\n\n\n\n\n\n\nThe second revolution that never came: a nationalism that calls itself anti-capitalist, and wants industry nationalised and the nation purified at the same time."
 national_bolshevism:0 "National Bolshevism"
 national_bolshevism_desc:0 "§HNational Bolshevism§!\n\n\n\n\n\n\n\n\n£img_national_bolshevism \n\n\n\n\n\n\n\n\nRed flag, national soil. The planned economy and the strong state of the Soviets, put at the service of the nation instead of the class."
 national_syndicalism:0 "National Syndicalism"
 national_syndicalism_desc:0 "§HNational Syndicalism§!\n\n\n\n\n\n\n\n\n£img_national_syndicalism \n\n\n\n\n\n\n\n\nThe unions absorbed into the nation. Workers and owners are organised in vertical syndicates under a single party, and a strike becomes treason."
 ultranationalism_party:0 "Ultranationalism"
 ultranationalism_party_desc:0 "§HUltranationalism§!\n\n\n\n\n\n\n\n\n£img_ultranationalism_party \n\n\n\n\n\n\n\n\nThe nation above every law, treaty and neighbour. Its greatness is the only programme, and its enemies are everywhere."
 ultranationalist_socialism:0 "Ultranationalist Socialism"
 ultranationalist_socialism_desc:0 "§HUltranationalist Socialism§!\n\n\n\n\n\n\n\n\n£img_ultranationalist_socialism \n\n\n\n\n\n\n\n\nSocial justice for the nation's own, and for nobody else. Welfare, land and work are promised to the people and denied to everyone outside it."
 Kahanism:0 "Kahanism"
 Kahanism_desc:0 "§HKahanism§!\n\n\n\n\n\n\n\n\n£img_kahanism \n\n\n\n\n\n\n\n\nA religious ultranationalism that wants a state governed by religious law and emptied of those it considers foreign to it."
 #Fundamentalism#
 fundamentalism:0 "Fundamentalist"
 fundamentalism_noun:0 "Funamentamentalism"
 islamic_fundamentalism:0 "Islamic Fundamentalism"
 islamic_fundamentalism_desc:0 "§HIslamic Fundamentalism§!\n\n\n\n\n\n\n\n\n£img_islamic_fundamentalism \n\n\n\n\n\n\n\n\nThe sharia as the whole of the law. The state exists to enforce the faith as its scholars read it, and politics is a branch of jurisprudence."
 christian_fundamentalism:0 "Christian Fundamentalism"
 christian_fundamentalism_desc:0 "§HChristian Fundamentalism§!\n\n\n\n\n\n\n\n\n£img_christian_fundamentalism \n\n\n\n\n\n\n\n\nScripture as statute. The nation is to be governed by biblical morality, and secular institutions are treated as a mission field."
 clerical_fascism:0 "Clerical Fascism"
 clerical_fascism_desc:0 "§HClerical Fascism§!\n\n\n\n\n\n\n\n\n£img_clerical_fascism \n\n\n\n\n\n\n\n\nThe party's uniform under the priest's blessing. Authoritarian nationalism presents itself as the armed defence of the Church."
 religious_nationalism:0 "Religious Nationalism"
 religious_nationalism_desc:0 "§HReligious Nationalism§!\n\n\n\n\n\n\n\n\n£img_religious_nationalism \n\n\n\n\n\n\n\n\nFaith and nation are one identity. To belong to the people is to belong to its religion, and minorities are guests at best."
 ultratraditionalism:0 "Ultratraditionalism"
 ultratraditionalism_desc:0 "§HUltratraditionalism§!\n\n\n\n\n\n\n\n\n£img_ultratraditionalism \n\n\n\n\n\n\n\n\nThe modern world is the error. Every reform since some lost golden age is to be undone, and ancestral custom restored as law."
 theocratic_state:0 "Theocratic State"
 theocratic_state_desc:0 "§HTheocratic State§!\n\n\n\n\n\n\n\n\n£img_theocratic_state \n\n\n\n\n\n\n\n\nThe clergy govern directly. Councils of jurists and priests hold the final word over parliament, courts and army alike."
 jihadism:0 "Jihadism"
 jihadism_desc:0 "§HJihadism§!\n\n\n\n\n\n\n\n\n£img_jihadism \n\n\n\n\n\n\n\n\nArmed struggle as a religious duty without borders. The movement fights to build its state on conquered ground, and recognises no other."
 evangelical_nationalism:0 "Evangelical Nationalism"
 evangelical_nationalism_desc:0 "§HEvangelical Nationalism§!\n\n\n\n\n\n\n\n\n£img_evangelical_nationalism \n\n\n\n\n\n\n\n\nThe country has a covenant, and the congregations intend to hold it to it. Megachurches, broadcasters and voters move as a single bloc."
 hindu_nationalism:0 "Hindu Nationalism"
 hindu_nationalism_desc:0 "§HHindu Nationalism§!\n\n\n\n\n\n\n\n\n£img_hindu_nationalism \n\n\n\n\n\n\n\n\nHindutva: the nation defined as a Hindu civilisation. A mass movement of cadres and temples that wants the state to reflect the faith of the majority."
