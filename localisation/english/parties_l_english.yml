 #Centrist#
 centrist:0 "Centrist"
 centrist_noun:0 "Centrism"
 centrist_desc:0 "Centrism is a political position that rejects ideological extremes in an attempt to strike a balance between social justice and economic freedom. It supports pragmatism, compromise and gradual reform rather than radical change in order to preserve society’s stability. It combines progressive social values with regulated market economics in order to protect individual rights and democratic institutions."
 liberal_socialdemocrat:0 "Liberal Socialdemocrat"
 liberal_socialdemocrat_desc:0 "It is an ideology that blends individual self-determination with a strong, caring welfare state. The government intervenes in the market to actively diminish wealth and social inequalities. Equal opportunity is the result of public funding for education and national infrastructure. The ultimate goal is to see robust economic growth and social peace as mutually reinforcing goals."
 green_liberalism:0 "Green Liberalism"
 green_liberalism_desc:0 "Green liberalism is the use of market economic instruments in the service of strong environmental protection. It favors technological innovation and financial incentives over strict government bans and regulations. Use smart market signals such as carbon taxation to achieve ecological sustainability. From this perspective, environmental stewardship is a major opportunity for economic growth."
 ultra_liberalism:0 "Ultra Liberalism"
 ultra_liberalism_desc:0 "This philosophy prizes personal independence and economic freedom above all else. It calls for a major reduction in the role of government, in taxes and in welfare provision. Free market competition is seen as the most efficient regulator for society. This system substitutes state-backed collective safety nets with individual responsibility entirely."
 centrist_populism:0 "Centrist Populism"
 centrist_populism_desc:0 "This kind of politics claims to be the voice of reason for the reasonable majority. It sharply distances itself from the perceived dangers of both far-right and far-left extremes. Very pragmatic, direct and popular solutions are used to solve complex problems of the society. The movement mobilizes the broad mass of moderate citizens with an anti-elite rhetoric."
