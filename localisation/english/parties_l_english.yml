 #Authoritarian Socialism#
 FACTION_AUTHSOC_1:0 "Council of Mutual Defence"
 FACTION_AUTHSOC_2:0 "Union of Socialist States"
 authoritarian_socialism:0 "Authoritarian Socialist"
 authoritarian_socialism_noun:0 "Authoritarian Socialism"
 authoritarian_socialism_desc:0 "State socialism in its managerial form: a single party holds every lever of the state, the market is tolerated as long as it stays useful, and the revolution is declared finished. Order and continuity come before doctrine."
 socialist_military_junta:0 "Socialist Military Junta"
 sovietism:0 "Sovietism"
 sovietism_desc:0 "Government by the councils, in name at least. Power flows upward through a pyramid of soviets that ratifies what the party has already decided."
 authoritarian_communism:0 "Authoritarian Communism"
 authoritarian_communism_desc:0 "The party owns the state and the state owns everything else. Communism administered from the top down, where discipline is the doctrine and dissent is a management problem."
 Workerism:0 "Workerism"
 Workerism_desc:0 "Politics begins and ends at the factory gate. The party exists to serve the shop floor, and anyone who has never worked a shift has no business speaking for those who have."
 transhumanist:0 "Transhumanist"
 transhumanist_desc:0 "The workers' state as an engineering project: technology is expected to finish the job that politics started, and the human being is one more system to be improved."
 left_nationalism:0 "Left Nationalism"
 left_nationalism_desc:0 "Socialism inside one nation and for it: the class struggle is fought first of all against foreign capital, and the flag flies over the red banner."
 market_socialism:0 "Market Socialism"
 market_socialism_desc:0 "Public ownership of the commanding heights, private competition everywhere else. The plan sets the direction, the market sets the prices."
 xi_jinping_thought:0 "Xi Jinping Thought"
 xi_jinping_thought_desc:0 "Socialism with national characteristics for a new era: a disciplined party, a managed economy and a state that claims its place at the centre of the world."
 Deutsche_Communism:0 "Deutsche Communism"
 Deutsche_Communism_desc:0 "The German road to socialism, built on heavy industry, a vast security apparatus and the conviction that the workers' state must never be left unguarded."
 deutsche_conservatorist_socialism:0 "Deutsche Conservatorist Socialism"
 deutsche_conservatorist_socialism_desc:0 "Socialism kept as an institution rather than a promise: the workers' state is preserved the way a nation preserves its church and its army, with discipline, order and a deep suspicion of anyone who wants to reform it."
 maximalism:0 "Maximalism"
 maximalism_desc:0 "No half measures and no coalitions: the maximum programme, at once, or nothing at all."
 anarchoprimitivism:0 "Anarcho-Primitivism"
 anarchoprimitivism_desc:0 "Industrial civilisation is the problem, not the means. Dismantle the machine and let people live at a human scale again."
