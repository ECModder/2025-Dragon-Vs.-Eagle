 DVE_intl_motion_common_plan:0 "Motion: Common Economic Plan"
 DVE_intl_motion_common_plan_desc:0 "One plan for every member: shared targets, shared machine tools, shared credit."
 DVE_intl_motion_name_common_plan:0 "Common Economic Plan"
 DVE_intl_motion_solidarity_fund:0 "Motion: Solidarity Fund"
 DVE_intl_motion_solidarity_fund_desc:0 "Every member pays into a common fund, and the Council assigns it to the state that needs it most: ours."
 DVE_intl_motion_name_solidarity_fund:0 "Solidarity Fund"
 DVE_intl_motion_open_borders:0 "Motion: Open Borders of the International"
 DVE_intl_motion_open_borders_desc:0 "Volunteers, advisers and matériel move between the member states without asking anyone's permission."
 DVE_intl_motion_name_open_borders:0 "Open Borders of the International"
 DVE_intl_motion_mobilization:0 "Motion: Internationalist Mobilization"
 DVE_intl_motion_mobilization_desc:0 "The Council calls the working class of every member state to stand ready."
 DVE_intl_motion_name_mobilization:0 "Internationalist Mobilization"
 DVE_intl_motion_red_helmets:0 "Request the Red Helmets"
 DVE_intl_motion_red_helmets_desc:0 "We ask the Council to send the International's own brigades to our front."
 DVE_intl_motion_name_red_helmets:0 "The Red Helmets"
 DVE_intl_motion_common_plan_effect_tt:0 "If carried: every member gains §YCommon Economic Plan§! for 365 days (construction speed §G+10%§!, factory output §G+5%§!)."
 DVE_intl_motion_solidarity_fund_effect_tt:0 "If carried: every other member pays §R10§! political power; we receive §G100§! political power, §Y3000§! infantry equipment and §Y300§! support equipment."
 DVE_intl_motion_open_borders_effect_tt:0 "If carried: every member gains §YOpen Borders of the International§! for 365 days (more volunteers, sent at any world tension)."
 DVE_intl_motion_mobilization_effect_tt:0 "If carried: every member gains §YInternationalist Mobilization§! for 180 days (war support §G+10%§!, recruitable population §G+5%§!)."
 DVE_intl_motion_red_helmets_effect_tt:0 "If carried: we receive §Y6§! divisions of §YRed Helmets§! and §Y2000§! infantry equipment."

 DVE_intl_attend_assembly:0 "Attend General Assembly"
 DVE_intl_attend_assembly_desc:0 "Our delegation takes its seats in the Central Council and is heard."
 DVE_intl_support_development:0 "Support Development Programs"
 DVE_intl_support_development_desc:0 "Schools, clinics and power lines in the poorer member states, built with our engineers."
 DVE_intl_cooperation:0 "International Cooperation"
 DVE_intl_cooperation_desc:0 "Joint commissions, shared patents and exchanges of cadres with the other member states."
 DVE_intl_host_summit:0 "Host International Summit"
 DVE_intl_host_summit_desc:0 "The delegations of the whole International meet in our capital."
 DVE_intl_humanitarian_aid:0 "Provide Humanitarian Aid"
 DVE_intl_humanitarian_aid_desc:0 "Convoys with our flag reach the comrades who need them most."
 DVE_intl_promote_internationalism:0 "Promoting Internationalism"
 DVE_intl_promote_internationalism_desc:0 "Press, schools and party cells are told the same thing: the revolution has no fatherland."
 DVE_intl_seek_recognition:0 "Seek Recognition"
 DVE_intl_seek_recognition_desc:0 "A first delegation knocks at the door of the Central Council."
 DVE_intl_outreach:0 "Diplomatic Outreach"
 DVE_intl_outreach_desc:0 "Envoys visit the member states one by one."
 DVE_intl_app_cooperation:0 "International Cooperation"
 DVE_intl_app_cooperation_desc:0 "We work with the International's commissions as if we were already inside."
 DVE_intl_app_summit:0 "Host International Summit"
 DVE_intl_app_summit_desc:0 "The comrades are invited to see our revolution with their own eyes."
 DVE_intl_sponsors:0 "Sponsors within the International"
 DVE_intl_sponsors_desc:0 "A member state agrees to speak for us in the Council. Such friendships are not free."
 DVE_intl_appeal:0 "An Appeal for Recognition"
 DVE_intl_appeal_desc:0 "An open letter to the workers' councils of every member state."
 DVE_intl_pursue:0 "Pursue Diplomatic Recognition"
 DVE_intl_pursue_desc:0 "A full campaign, capital by capital, for a formal seat."
 DVE_intl_submit_application:0 "Submit Membership Application"
 DVE_intl_submit_application_desc:0 "We ask the Central Council for a seat. The members have a week to vote."

