 DVE_intl_back_pro:0 "Campaign for the Left Communists"
 DVE_intl_back_pro_desc:0 "Our delegates speak for the Left Communists: the councils decide, not the party offices."
 DVE_intl_back_pro_tt:0 "The §YLeft Communists§! win §G25§! seats in the Central Council, taken from the other currents in proportion.\nSeats won by campaigns for this current so far: §Y[?global.DVE_intl_boost_pro|0]§! of §Y250§!. They fade by a tenth every month."
