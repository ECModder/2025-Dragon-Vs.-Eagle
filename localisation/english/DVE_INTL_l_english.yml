 dve_intl.2.t:0 "The Central Council Has Voted"
 dve_intl.2.d:0 "The count is over.\n\n[GetDVEIntlFloor]\n\n[GetDVEIntlTally]"
 dve_intl.2.a:0 "The Council has spoken"
 dve_intl.3.t:0 "[DVE_intl_proposer.GetNameDefCap] Asks to Join the International"
 dve_intl.3.d:0 "[DVE_intl_proposer.GetNameDefCap] has applied for a seat in the International. The member states have a week to vote, one vote each; [INT.GetNameDef] has five and a veto.\n\nWe can cast our vote from the panel of the International, among the decisions."
 dve_intl.3.a:0 "We will decide how to vote"
 dve_intl.4.t:0 "A Motion Before the Central Council"
 dve_intl.4.d:0 "[DVE_intl_proposer.GetNameDefCap] has put a motion to the Central Council of the International: §Y[GetDVEIntlMotion]§!.\n\nThe currents of the Council are voting, each with its seats. The count is in a week."
 dve_intl.4.a:0 "We will see how the Council votes"
 dve_intl.5.t:0 "A Seat in the International"
 dve_intl.5.d:0 "Our delegates have taken their seats in the Central Council of the International. From now on we vote on its motions, and we can put our own."
 dve_intl.5.a:0 "Workers of the world, unite"

 DVE_intl_back_tot:0 "Campaign for the Neo-Communists"
 DVE_intl_back_tot_desc:0 "Our press and our delegates take the side of the Neo-Communists: the party-state, the plan, and no patience for dissent."
 DVE_intl_back_tot_tt:0 "The §YNeo-Communists§! win §G25§! seats in the Central Council, taken from the other currents in proportion.\nSeats won by campaigns for this current so far: §Y[?global.DVE_intl_boost_tot|0]§! of §Y250§!. They fade by a tenth every month."
