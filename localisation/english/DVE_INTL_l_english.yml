l_english:
 DVE_intl_member_category:0 "The International: Central Council"
 DVE_intl_member_category_desc:0 "The Central Council of the International has 1000 seats. They are assigned to the member states by the weight of their industry, and the delegates of each state sit with the current they belong to at home.\n\n§YMotions§! are voted by the §Ycurrents§!, each with its seats: more seats in favour than against carries the motion. A current always backs a motion put by its own government, and a high standing in the International wins over the others.\n\n§YAdmissions§! are voted by the §Ymember states§!, one vote each. [INT.GetNameDefCap] has §Y5§! votes and a §Yveto§!.\n\nEvery vote lasts a week, and then the Council goes into recess for 30 days."
 DVE_intl_applicant_category:0 "The International: The Fight for Recognition"
 DVE_intl_applicant_category_desc:0 "The International admits new members by a vote of its member states: one vote each, §Y5§! for [INT.GetNameDef], which also holds a §Yveto§!. A progressive or socialist state that wants a seat must first build its standing among the members, then submit its application: the higher the standing, the more members vote in favour.\n\nA rejected application costs 20 standing and cannot be repeated for 180 days."

