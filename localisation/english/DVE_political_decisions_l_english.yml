l_english:
 anti_radicals_raids:0 "Anti Radicals Raids"
 anti_radicals_raids_desc:0 "Order the security services to move against the revolutionary left. Communist cells, workers' councils and revolutionary organisers will be broken up before they can turn discontent into insurrection - at the cost of unrest in the streets."
 anti_democratic_raids:0 "Anti Democratic Raids"
 anti_democratic_raids_desc:0 "Silence the liberal and parliamentary opposition. Party offices are shut, newspapers seized and rallies dispersed, weakening the democratic bloc at the price of open resentment among the public."
 anti_illiberals_raids:0 "Anti Illiberals Raids"
 anti_illiberals_raids_desc:0 "Strike at the authoritarian right. The old guard, the security apparatus and the reactionary establishment are purged from public life, breaking their grip on the state while shaking its stability."
 anti_extremists_raids:0 "Anti Extremists Raids"
 anti_extremists_raids_desc:0 "Crush the extremist fringe. Monarchist circles, ultranationalist militias and religious radicals are outlawed and their leaders arrested, robbing them of momentum at a heavy cost to public order."
