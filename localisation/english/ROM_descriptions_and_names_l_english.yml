 DVE_ROM_BOOKMARK_DESC:0 "Heir to Dacia and Rome, Romania stands between empires, guarded by the Carpathians and opened to the world by the Danube and Black Sea. Coveted for its oil and farmland, it now faces war on its northern border, a divided Moldova, and a tired government. With the world split between Dragon and Eagle, Bucharest must decide whether Romania remains a pawn—or claims its own destiny."