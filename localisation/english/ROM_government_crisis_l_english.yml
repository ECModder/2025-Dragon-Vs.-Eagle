l_english:
 # ===== The Government Crisis (May 2026) =====
 ROM_government_crisis_spirit:0 "The Government Crisis"
 ROM_government_crisis_spirit_desc:0 "The government has fallen and Parliament cannot agree on another. A caretaker cabinet that may not start new programmes runs the country while one candidate for Prime Minister after another is voted down. The austerity measures stay in force, the leu is slipping, prices are rising faster than anywhere else in the European Union, and the deadlines for Romania's share of the EU recovery fund pass with the reforms still unvoted."

 ROM_elect.50.t:0 "The Government Falls"
 ROM_elect.50.d_bolojan:0 "The Social Democrats have walked out of the coalition over the austerity package, and today they joined AUR to pass a motion of no confidence. Ilie Bolojan's cabinet has fallen less than a year after it was sworn in.\n\nIt stays on as a caretaker government with limited powers until Parliament confirms a new one, and nobody can yet say which majority that would be."
 ROM_elect.50.d:0 "The governing coalition has broken apart over the cost of cutting the deficit. One of the partners walked out and voted with the opposition, a motion of no confidence has passed, and the cabinet has fallen.\n\nIt stays on as a caretaker government with limited powers until Parliament can agree on a new Prime Minister."
 ROM_elect.50.a:0 "The caretaker cabinet will keep the country running."
 ROM_elect.50.b:0 "Call every party leader to Cotroceni tonight."

 ROM_elect.51.t:0 "Parliament Rejects the Cabinet"
 ROM_elect.51.d_first:0 "The Prime Minister-designate came to Parliament with a programme, a list of ministers and a promise to end the crisis quickly. The vote fell short. The caretaker cabinet stays in office, and the President must begin the consultations again."
 ROM_elect.51.d_second:0 "For the second time Parliament has voted down a proposed cabinet. The parties blame each other, the markets mark down Romanian bonds and Brussels asks how much longer the reforms will have to wait. Whoever is nominated next will find the parties too exhausted to say no."
 ROM_elect.51.a:0 "Back to the consultations."

 ROM_elect.52.t:0 "A Government at Last"
 ROM_elect.52.d:0 "After months of consultations Parliament has confirmed a new cabinet. The crisis is over, but the bill for it is not: the austerity measures stay, the unions want wages and pensions unfrozen, and the opposition has already promised to bring the new government down."
 ROM_elect.52.a:0 "A cabinet of experts under a non-party Prime Minister."
 ROM_elect.52.b:0 "A political cabinet led by the largest party."

 ROM_nominate_prime_minister:0 "Nominate a Prime Minister"
 ROM_nominate_prime_minister_desc:0 "The President asks a candidate to form a government and put it to a vote of confidence in Parliament."
 ROM_nominate_prime_minister_tt:0 "Parliament votes on the new cabinet.\nThe first vote will probably fail. Every rejected cabinet makes the next vote more likely to pass, and the §Ythird§! vote always passes.\nA Parliamentary Majority above §Y60§! seats improves the odds.\nIf the vote passes, §YThe Government Crisis§! ends."
 ROM_gov_crisis_consultations_tt:0 "The President's consultations with the parties are still under way."
 ROM_gov_crisis_next_vote_tt:0 "§YNominate a Prime Minister§! can be taken again in §Y30§! days, and the next vote is more likely to pass."
