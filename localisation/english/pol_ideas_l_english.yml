l_english:
 POL_divided_country: "divided country"
 POL_divided_country_desc: "for over 20 yers poland was ruled by two parties PIS and KO, this is not good for the country and people but will this ever end?"
 POL_anti_ukr_support: "Growing Anti-Ukrainian Sentiment"
 POL_anti_ukr_support_desc: "In 2022, when the war in Ukraine started, Poland was number one in supporting Ukraine, sent huge amounts of equipment, accepted immigrants, and sent its own people to fight. Ukraine returned the favor by disrespecting us and hating on us. Our people have had enough."
 POL_new_heart: "The New Heart of Europe"
 POL_new_heart_desc: "With Poland's economy approaching 1 trillion in GDP in 2025, the nation is emerging as one of Europe's fastest-growing economic powers. Meanwhile, Western European states face economic stagnation and growing social pressures linked to uncontrolled illegal migration, allowing Poland to position itself as the new heart of Europe."
 POL_polish_army: "Polish Army"
 POL_polish_army_desc: "Polish Armed forces are already one of the best in Europe, BUT this is NOT enough! WE NEED to improve!"
