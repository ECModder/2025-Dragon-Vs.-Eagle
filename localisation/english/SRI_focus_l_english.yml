 SRI_new_socialism:0 "New Socialism for a New Age"
 SRI_new_socialism_desc:0 "A socialism that functions."
 SRI_old_school_communism:0 "Old-School Communism"
 SRI_old_school_communism_desc:0 "What worked once needs no updating."
 SRI_nkvd:0 "The NKVD"
 SRI_nkvd_desc:0 "Its own troops, its own courts, its own quotas."
 SRI_cadre_planning:0 "Cadre Planning"
 SRI_cadre_planning_desc:0 "Factories receive figures, not explanations."
 SRI_bureaucracy_at_the_helm:0 "Bureaucracy at the Helm"
 SRI_bureaucracy_at_the_helm_desc:0 "The state runs on files, and the files are in order."
 SRI_socialist_peoples_republic:0 "Socialist People's Republic"
 SRI_socialist_peoples_republic_desc:0 "One party, one front, one list."
 SRI_politburo_of_yes_men:0 "Politburo of Yes Men"
 SRI_politburo_of_yes_men_desc:0 "Every vote is unanimous."
 SRI_wave_of_purges:0 "A Wave of Purges"
 SRI_wave_of_purges_desc:0 "The lists are long and the criteria flexible."
 SRI_party_with_a_state:0 "A Party With a State"
 SRI_party_with_a_state_desc:0 "Two chains of command, and only one of them matters."
 SRI_state_capitalism:0 "State Capitalism"
 SRI_state_capitalism_desc:0 "One owner, one employer, one bank."
 SRI_state_capitalism_2:0 "Command Economy"
