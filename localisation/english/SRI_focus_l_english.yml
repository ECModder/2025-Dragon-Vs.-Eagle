l_english:
 SRI_focus:0 "Socialist Republic of Italy"

 # THE CIVIL WAR
 SRI_cw_united_communist_front:0 "United Communist Front"
 SRI_cw_united_communist_front_desc:0 "The PdRC, the new PCI and Potere al Popolo have spent thirty years splitting over commas. With the Republic collapsing around them they finally agree on one thing: whoever holds Naples holds the South."
 SRI_cw_all_unite_in_a_party:0 "All Unite in a Party"
 SRI_cw_all_unite_in_a_party_desc:0 "A front is a committee that argues; a party is an apparatus that obeys. The organizations of the front dissolve into the Partito Comunista Italiano Unificato: one card and one line for everybody."
 SRI_cw_buy_weapons_from_china:0 "Buy Weapons from China"
 SRI_cw_buy_weapons_from_china_desc:0 "Beijing will not recognize us yet, but its export companies are less fussy. Containers marked as agricultural machinery are unloaded at night in the port of Naples."
 SRI_cw_against_trotskyists_and_black_barons:0 "Against the Trotskyists and the Black Barons"
 SRI_cw_against_trotskyists_and_black_barons_desc:0 "To the north the Internationale preaches world revolution; in Latina the fascists dream of their Social Republic. The Party has two enemies and one answer for both."
 SRI_cw_request_chinese_forces:0 "Request Chinese Forces"
 SRI_cw_request_chinese_forces_desc:0 "Advisers first, then 'volunteers' with suspiciously uniform haircuts. The People's Republic does not send armies abroad; it merely fails to stop those who wish to go."
 SRI_cw_red_militia:0 "The Red Militia"
 SRI_cw_red_militia_desc:0 "Dockers from Naples, steelworkers from Taranto, students from half the South. They get a rifle, a red armband and a political officer, in that order."
 SRI_cw_victory_over_social_fascists:0 "Victory Over the Social-Fascists"
 SRI_cw_victory_over_social_fascists_desc:0 "Rome is ours. The bourgeois Republic, its Trotskyist would-be heirs and the blackshirts all went under the same heading in the Party press, and they have all ended the same way."
 # THE PCI-U CONGRESS
 SRI_pol_pci_u_congress:0 "PCI-U Congress"
 SRI_pol_pci_u_congress_desc:0 "The first congress of the unified party meets in a capital that still smells of smoke. The war kept the factions quiet; peace gives them something to fight over."
 SRI_pol_reformist_faction_majority:0 "Reformist Faction Majority"
 SRI_pol_reformist_faction_majority_desc:0 "The delegates side with the General Secretaries: a socialism that works with what it finds, looks to Beijing rather than to 1937, and prefers a full shop to a full prison."
 SRI_pol_hardline_factions_majority:0 "HardLine Factions Majority"
 SRI_pol_hardline_factions_majority_desc:0 "The delegates side with the Central Committee. No concessions, no experiments, no 'characteristics': the Party already knows what socialism looks like, and it looks like it did."
 # POLITICS - REFORMIST FACTION (authoritarian_socialism)
 SRI_pol_kgb_model:0 "KGB Model"
 SRI_pol_kgb_model_desc:0 "A security service that reads, files and waits. It is quieter than its predecessors and better educated, and it knocks on fewer doors because it already knows who is behind them."
 SRI_pol_xxi_century_communism:0 "XXI Century Communism"
 SRI_pol_xxi_century_communism_desc:0 "Fibre optics in the Party schools and data centres next to the steelworks. The theory stays the same; only the tools are allowed to be new."
 SRI_pol_ref_restore_authority:0 "Restore the Authority of the Party"
 SRI_pol_ref_restore_authority_desc:0 "The war was won by commanders, militias and local committees who all learned to decide by themselves. They will now unlearn it."
 SRI_pol_socialist_dream:0 "The Socialist Dream"
 SRI_pol_socialist_dream_desc:0 "A flat, a job, a pension and a holiday on the Adriatic. The Party promises its citizens a modest prosperity and asks them, in return, not to ask for anything else."
 SRI_pol_peoples_democratic_dictatorship:0 "People's Democratic Dictatorship Model"
 SRI_pol_peoples_democratic_dictatorship_desc:0 "Democracy for the people, dictatorship over their enemies; the Party decides who belongs to which. The formula is borrowed from Beijing, along with much else."
 SRI_pol_ensure_peoples_support:0 "Ensure People's Support"
 SRI_pol_ensure_peoples_support_desc:0 "Committees in every neighbourhood listen to complaints about buses, hospitals and rents, and some of the complaints are even dealt with."
 SRI_pol_repudiate_trotskyism:0 "Repudiate Trotskyism"
 SRI_pol_repudiate_trotskyism_desc:0 "The Internationale is beaten on the field; now it must be beaten in the libraries. Permanent revolution is officially declared an adventure paid for by other people's workers."
 SRI_pol_democracy_within_pci_u:0 "Democracy Within the PCI-U"
 SRI_pol_democracy_within_pci_u_desc:0 "Sections may debate freely until the line is decided, and several candidates may stand for the same post, provided they are all good comrades."
 SRI_pol_new_party_cadres:0 "New Party Cadres"
 SRI_pol_new_party_cadres_desc:0 "Engineers, economists and administrators under forty take the place of men whose only qualification was having been there in the first winter."
 SRI_pol_anti_corruption_campaign:0 "Anti-Corruption Campaign"
 SRI_pol_anti_corruption_campaign_desc:0 "Tigers and flies alike: from the regional secretary with a villa in Posillipo to the clerk who sells permits. The trials are public, and popular."
 SRI_pol_long_live_general_secretaries:0 "Long Live the General Secretaries"
 SRI_pol_long_live_general_secretaries_desc:0 "No single name, no single portrait. The collective leadership turns its own blandness into a doctrine, and the country finds it reassuring."
 SRI_pol_bureaucracy_serves_the_people:0 "Bureaucracy Serves the People"
 SRI_pol_bureaucracy_serves_the_people_desc:0 "Fewer stamps, fewer counters, deadlines that bind the office and not only the citizen. Even the Italian state can be made to work, apparently."
 SRI_pol_new_socialism_new_age:0 "New Socialism for a New Age"
 SRI_pol_new_socialism_new_age_desc:0 "Neither the barracks of the last century nor the market of this one. Italy has built a socialism that functions, and that may be its most subversive achievement."
 # POLITICS - HARDLINE FACTIONS (totalitarian_socialism)
 SRI_pol_hard_restore_authority:0 "Restore the Authority of the Party"
 SRI_pol_hard_restore_authority_desc:0 "The war was won by commanders, militias and local committees who all learned to decide by themselves. They will be reminded who decides."
 SRI_pol_old_school_communism:0 "Old-School Communism"
 SRI_pol_old_school_communism_desc:0 "Portraits back on the walls, the Short Course back on the syllabus. What worked from the Elbe to the Pacific needs no updating for the Tyrrhenian."
 SRI_pol_nkvd_model:0 "NKVD Model"
 SRI_pol_nkvd_model_desc:0 "A security service with its own troops, its own courts and its own quotas. It answers to the Central Committee alone, and the Central Committee prefers not to ask."
 SRI_pol_cadre_bureaucratic_planning:0 "Cadre Bureaucratic Based Planning"
 SRI_pol_cadre_bureaucratic_planning_desc:0 "The plan is written by the apparatus and carried out by the apparatus. Factories receive figures, not explanations."
 SRI_pol_socialist_peoples_republic_model:0 "Socialist People's Republic Model"
 SRI_pol_socialist_peoples_republic_model_desc:0 "One party, one front, one list. The constitution is copied from the people's democracies of the last century, with the dates changed."
 SRI_pol_trotskyism_degeneration:0 "Trotskyism Is a Degeneration of Socialism"
 SRI_pol_trotskyism_degeneration_desc:0 "The Party's verdict on the Internationale is final: not a mistaken current of the movement, but its disease. One does not debate with an infection."
 SRI_pol_politburo_of_yes_men:0 "Politburo of Yes Men"
 SRI_pol_politburo_of_yes_men_desc:0 "Every vote is unanimous and every meeting ends early. Those who once raised objections have been reassigned to provinces with very poor connections."
 SRI_pol_state_commanded_from_above:0 "State Commanded from Above"
 SRI_pol_state_commanded_from_above_desc:0 "Regions, municipalities and ministries become transmission belts. An order leaves Rome in the morning and is law in Reggio Calabria by evening."
 SRI_pol_wave_of_purges:0 "A Wave of Purges"
 SRI_pol_wave_of_purges_desc:0 "The lists are long and the criteria flexible: former front allies, officers with opinions, anyone who met the wrong person in the wrong year."
 SRI_pol_bureaucracy_at_the_helm:0 "Bureaucracy at the Helm"
 SRI_pol_bureaucracy_at_the_helm_desc:0 "The administrators have outlasted the revolutionaries, as they always do. The state now runs on files, and the files are in order."
 SRI_pol_long_live_central_committee:0 "Long Live the Central Committee"
 SRI_pol_long_live_central_committee_desc:0 "The Committee is always right because it is the Committee. Its portrait is a group photograph; nobody in it is smiling."
 SRI_pol_arrest_counter_revolutionaries:0 "Arrest All the Counter-Revolutionaries"
 SRI_pol_arrest_counter_revolutionaries_desc:0 "The prisons of the old Republic prove too small for the new one. Camps are opened in the Sila and on the islands."
 SRI_pol_party_with_a_state:0 "A Party With a State"
 SRI_pol_party_with_a_state_desc:0 "There is no longer any point where the Party ends and Italy begins. Every office, every factory and every regiment has two chains of command, and only one of them matters."
 # ECONOMY - STATE CAPITALISM (HardLine)
 SRI_eco_state_capitalism:0 "State Capitalism"
 SRI_eco_state_capitalism_desc:0 "One owner, one employer, one bank: the state. Lenin called it a step forward, and the Central Committee sees no reason to take the second one."
 SRI_eco_renationalization:0 "Renationalization of Industries"
 SRI_eco_renationalization_desc:0 "Steel, energy, telecoms, motorways: everything the Republic sold off in the nineties comes back, without compensation."
 SRI_eco_establish_gosplan:0 "Establish Gosplan"
 SRI_eco_establish_gosplan_desc:0 "A State Planning Committee is set up in the old Treasury building. Its first act is to discover that nobody knows how many factories the country has."
 SRI_eco_cult_of_industrialization:0 "The Cult of Industrialization"
 SRI_eco_cult_of_industrialization_desc:0 "Chimneys on the posters, blast furnaces in the newsreels. Tonnes of steel become the measure of everything, including people."
 SRI_eco_economic_sovereignty:0 "Economic Sovereignty"
 SRI_eco_economic_sovereignty_desc:0 "No foreign shareholders, no foreign creditors, no foreign rules. What Italy needs, Italy will make; what it cannot make, it will do without."
 SRI_eco_nationalize_all_industries:0 "Nationalize All Industries"
 SRI_eco_nationalize_all_industries_desc:0 "After the giants come the workshops, the family firms and the cooperatives. The Italy of small business enters the plan, whether it fits or not."
 SRI_eco_comprehensive_work_planning:0 "Comprehensive Work Planning"
 SRI_eco_comprehensive_work_planning_desc:0 "Every worker has a norm, every norm a deadline, every deadline an inspector."
 SRI_eco_repeal_liberal_reforms:0 "Repeal the Liberal Reforms"
 SRI_eco_repeal_liberal_reforms_desc:0 "Thirty years of privatizations, labour-market reforms and European directives are struck out in one session."
 SRI_eco_revitalize_periphery:0 "Revitalize the Italian Periphery"
 SRI_eco_revitalize_periphery_desc:0 "The Mezzogiorno was promised development by every government since unification. This one sends concrete, rails and deadlines."
 SRI_eco_tackle_demographic_collapse:0 "Tackle the Demographic Collapse"
 SRI_eco_tackle_demographic_collapse_desc:0 "A country of pensioners cannot fulfil a plan. Nurseries, housing priority and medals for mothers, and far fewer exit visas."
 SRI_eco_end_landlordism:0 "End Landlordism"
 SRI_eco_end_landlordism_desc:0 "Rented flats pass to the municipality, empty ones to whoever needs them. The rent is now a line in the state budget."
 SRI_eco_food_self_sufficiency:0 "Food Self-Sufficiency"
 SRI_eco_food_self_sufficiency_desc:0 "State farms on the Tavoliere and in the Agro Pontino. Italy will eat what it grows, and bread comes before exports."
 SRI_eco_centralized_work_assignment:0 "Centralized Work Assignment"
 SRI_eco_centralized_work_assignment_desc:0 "Graduates are sent where the plan needs them, not where their mothers live. For Italy, this is the real revolution."
 SRI_eco_tolerate_the_shopkeepers:0 "Tolerate the Shopkeepers"
 SRI_eco_tolerate_the_shopkeepers_desc:0 "The barber, the baker and the bar on the corner are left alone. Even the Central Committee wants its coffee made properly."
 SRI_eco_quantity_over_quality:0 "Quantity Over Quality"
 SRI_eco_quantity_over_quality_desc:0 "The plan counts units, so units are produced. Whether they work is a matter for the next plan."
 SRI_eco_eliminate_unemployment:0 "Eliminate Unemployment"
 SRI_eco_eliminate_unemployment_desc:0 "Everyone has a job by decree; the jobs are found afterwards. Southern youth unemployment disappears from the statistics and, largely, from reality."
 SRI_eco_solidify_party_cadres:0 "Solidify the Party Cadres"
 SRI_eco_solidify_party_cadres_desc:0 "Factory directors are Party men first and engineers second. Loyalty is the one resource the plan never runs short of."
 SRI_eco_building_stalinkas:0 "Building Stalinkas"
 SRI_eco_building_stalinkas_desc:0 "Monumental apartment blocks rise along the avenues of Rome and Naples, with high ceilings, heavy cornices and a waiting list."
 SRI_eco_skyrocketing_quotas:0 "Skyrocketing Production Quotas"
 SRI_eco_skyrocketing_quotas_desc:0 "The targets are raised every quarter, because the previous ones were met, at least on paper."
 SRI_eco_reward_heavy_industry:0 "Reward Heavy Industry"
 SRI_eco_reward_heavy_industry_desc:0 "Steelworkers and miners get the best wages, the best flats and the first holidays. Everyone else gets the poster."
 SRI_eco_socialist_economy_as_god_teaches:0 "A Socialist Economy as God Teaches"
 SRI_eco_socialist_economy_as_god_teaches_desc:0 "Come Dio comanda: everything owned, everything planned, everything counted. Italy has become the last proper command economy in Europe."
 # ECONOMY - MARKET SOCIALISM (Reformist)
 SRI_eco_market_socialism:0 "Market Socialism"
 SRI_eco_market_socialism_desc:0 "The commanding heights stay with the state; below them, let prices do the paperwork. The General Secretaries have read their Deng."
 SRI_eco_belt_and_road:0 "The Belt and Road Initiative"
 SRI_eco_belt_and_road_desc:0 "Rome signed the memorandum once before and then lost its nerve. This time the cranes in Taranto and Naples really are painted red."
 SRI_eco_nep_restarts:0 "NEP Restarts"
 SRI_eco_nep_restarts_desc:0 "Small firms may hire, sell and keep their profits. A hundred years after Lenin's retreat, the Party retreats in good order to the same line."
 SRI_eco_red_consumer_market:0 "A Red Consumer Market"
 SRI_eco_red_consumer_market_desc:0 "State brands, state malls, state advertising. The citizen is still a comrade, but on Saturdays he is also a customer."
 SRI_eco_chinese_investors:0 "Chinese Investors and Specialists"
 SRI_eco_chinese_investors_desc:0 "Joint ventures in the industrial zones of the South, each with a Chinese partner, a Chinese engineer and a Party secretary to keep an eye on both."
 SRI_eco_let_some_get_rich:0 "Let Some Get Rich First"
 SRI_eco_let_some_get_rich_desc:0 "A few will get rich before the others. The Party asks only that they do it visibly, pay their taxes and stay out of politics."
 SRI_eco_socialist_consumerism:0 "Socialist Consumerism"
 SRI_eco_socialist_consumerism_desc:0 "A car, a phone and a television within reach of every family. A people with instalments to pay does not go out into the squares."
 SRI_eco_economic_partnership_with_china:0 "Economic Partnership with China"
 SRI_eco_economic_partnership_with_china_desc:0 "Tariffs fall, credit lines open and the lira is quietly pegged to the yuan. Italy is the People's Republic's door to the Mediterranean."
 SRI_eco_allow_private_homes:0 "Allow Private Ownership of Homes"
 SRI_eco_allow_private_homes_desc:0 "Eight Italians in ten owned their homes before the revolution. The Party decides this is one fight not worth having."
 SRI_eco_red_stock_exchange:0 "The Red Stock Exchange"
 SRI_eco_red_stock_exchange_desc:0 "Piazza Affari reopens with a hammer and sickle above the door. The state holds fifty-one per cent of everything listed on it."
 SRI_eco_meritocratic_system:0 "Meritocratic System"
 SRI_eco_meritocratic_system_desc:0 "Examinations, rankings and promotions by results. The Party card still helps, but it no longer suffices."
 SRI_eco_professional_chinese_specialists:0 "Professional Chinese Specialists"
 SRI_eco_professional_chinese_specialists_desc:0 "They arrive with the machinery and stay to teach how it is used: high-speed rail, batteries, networks, ports."
 SRI_eco_state_co_owned_enterprises:0 "State Co-Owned Enterprises"
 SRI_eco_state_co_owned_enterprises_desc:0 "Private capital is welcome in strategic firms as a minority partner. It brings money and takes orders."
 SRI_eco_export_of_processed_products:0 "Export of Processed Products"
 SRI_eco_export_of_processed_products_desc:0 "Not raw steel but machines, not grain but brands. 'Made in Italy' still sells, whatever flag flies over the factory."
 SRI_eco_join_the_wto:0 "Join the WTO"
 SRI_eco_join_the_wto_desc:0 "The Socialist Republic claims the seat of the state it replaced. The negotiations are long, and the West discovers it would rather trade than sulk."
 SRI_eco_pragmatic_approach:0 "A Pragmatic Approach"
 SRI_eco_pragmatic_approach_desc:0 "Black cat or white cat: the plan sets the goals, the managers choose the means, and ideology is consulted afterwards."
 SRI_eco_investing_heavy_economy:0 "Investing in the Heavy Economy"
 SRI_eco_investing_heavy_economy_desc:0 "The profits of trade are ploughed back into steel, shipyards and machine tools."
 SRI_eco_new_tech_sector:0 "A New Tech Sector"
 SRI_eco_new_tech_sector_desc:0 "Technology parks around Naples, Bari and Bologna, with tax holidays for anyone who can write code and keep quiet."
 SRI_eco_state_corporatism:0 "State Corporatism"
 SRI_eco_state_corporatism_desc:0 "State, managers and the single trade union sit at one table and settle wages, prices and investment among themselves. Italy has seen this before, under another colour."
 SRI_eco_military_overproduction:0 "Military Overproduction"
 SRI_eco_military_overproduction_desc:0 "The arms factories produce more than the army can use. The surplus finds buyers."
 SRI_eco_new_factory_of_the_world:0 "The New Factory of the World"
 SRI_eco_new_factory_of_the_world_desc:0 "What Guangdong was to the last generation, the Mezzogiorno will be to the next: Europe's workshop, under a red flag."
 # MILITARY - THE SOVIET ARMY
 SRI_mil_create_the_soviet_army:0 "Create the Soviet Army"
 SRI_mil_create_the_soviet_army_desc:0 "The militias of the civil war are disbanded and reborn as a regular army on the Soviet pattern: conscripts, ranks and a great many tanks on parade."
 SRI_mil_politicized_military:0 "Politicized Military"
 SRI_mil_politicized_military_desc:0 "Every officer carries a Party card and every unit has its cell. The army does not merely defend the state; it belongs to the Party."
 SRI_mil_purge_traitors_of_the_people:0 "Purge the Traitors of the People"
 SRI_mil_purge_traitors_of_the_people_desc:0 "Officers who served the Republic too well, or changed sides too late, are retired, tried or simply not seen again."
 SRI_mil_political_commissars:0 "Political Commissars"
 SRI_mil_political_commissars_desc:0 "Each commander is given a second signature. The commissar teaches the troops why they fight and tells the Party how."
 SRI_mil_relentless_propaganda:0 "Relentless Propaganda"
 SRI_mil_relentless_propaganda_desc:0 "Radio, posters, serials and school books speak with one voice, and it never stops."
 SRI_mil_red_terror:0 "Red Terror"
 SRI_mil_red_terror_desc:0 "The security organs are given a free hand in the rear. Fear is cheap, and for a while it works."
 SRI_mil_connections_with_china:0 "Connections with China"
 SRI_mil_connections_with_china_desc:0 "Italian cadets in the academies of Nanjing, Chinese attaches at every manoeuvre."
 SRI_mil_sino_italian_agreement:0 "Sino-Italian Agreement"
 SRI_mil_sino_italian_agreement_desc:0 "Licences, technology and credit, but no treaty. Italy will arm itself with Chinese help and fight only its own wars."
 SRI_mil_italian_chinese_alliance:0 "Italian-Chinese Alliance"
 SRI_mil_italian_chinese_alliance_desc:0 "A mutual defence pact signed in the Great Hall of the People. Whoever threatens Italy now threatens Beijing, and the reverse is also true."
 SRI_mil_total_industrial_mobilization:0 "Total Industrial Mobilization"
 SRI_mil_total_industrial_mobilization_desc:0 "Tractor plants turn out armoured vehicles and shipyards work three shifts."
 SRI_mil_centralize_military_structures:0 "Centralize Military Structures"
 SRI_mil_centralize_military_structures_desc:0 "Army, navy, air force and security troops are placed under one General Staff, and the General Staff under the Party."
 SRI_mil_import_chinese_equipment:0 "Import Chinese Equipment"
 SRI_mil_import_chinese_equipment_desc:0 "Whole trainloads of trucks, guns and missiles cross Eurasia. The manuals are translated on the way."
 SRI_mil_revitalize_the_navy:0 "Revitalize the Navy"
 SRI_mil_revitalize_the_navy_desc:0 "Taranto and La Spezia are put back to work. A peninsula cannot be defended from the beach."
 SRI_mil_no_step_back_policy:0 "No Step Back Policy"
 SRI_mil_no_step_back_policy_desc:0 "Withdrawal without orders is treason. Blocking detachments stand behind the line to remind the forgetful."
 SRI_mil_start_motorizing:0 "Start Motorizing"
 SRI_mil_start_motorizing_desc:0 "The infantry gets off its feet. Chinese designs are built under licence in Italian plants."
 SRI_mil_revitalize_the_air_force:0 "Revitalize the Air Force"
 SRI_mil_revitalize_the_air_force_desc:0 "New squadrons, new airfields and pilots trained abroad. The red star is painted over the tricolour roundel."
 SRI_mil_red_patriotism:0 "Red Patriotism"
 SRI_mil_red_patriotism_desc:0 "Garibaldi and Gramsci share the same poster. The fatherland is socialist, but it is still the fatherland."
 SRI_mil_mass_conscription:0 "Mass Conscription"
 SRI_mil_mass_conscription_desc:0 "Two years of service for every citizen, and reserve duty until fifty."
 SRI_mil_joint_military_forces:0 "Joint Military Forces"
 SRI_mil_joint_military_forces_desc:0 "Large combined exercises teach land, sea and air to fight the same battle."
 SRI_mil_motherland_above_all:0 "The Motherland Above All!"
 SRI_mil_motherland_above_all_desc:0 "Everything for the front, everything for victory. There is no private life in a besieged country."
 SRI_mil_red_tsunami:0 "A Red Tsunami"
 SRI_mil_red_tsunami_desc:0 "Division after division, wave after wave. The General Staff counts on arithmetic."
 SRI_mil_ura_uraa_uraaa:0 "URA! URAA!! URAAA!!!"
 SRI_mil_ura_uraa_uraaa_desc:0 "The parade takes six hours to pass the Altare della Patria. Europe has not seen an army like this since 1945, and has not forgotten the last one."

 # Tooltips
 SRI_cw_request_chinese_forces_tt:0 "[PRC.GetNameDefCap] becomes far more willing to send §Yvolunteers§! to [ROOT.GetNameDef]."
 SRI_cw_victory_cores_tt:0 "[ROOT.GetNameDefCap] gains §Ycores§! on every Italian state."
 SRI_mil_italian_chinese_alliance_tt:0 "If [PRC.GetNameDef] leads a faction and we are in none, [ROOT.GetNameDef] §Yjoins§! it."

