l_english:
 # ===== romania_uprise: redesigned Economy and Armed Forces branches =====
 # Only the NEW focuses and spirits are here. Focuses kept from the old
 # branches still use their text in romania_l_english.yml and
 # ROM_dve_rework_l_english.yml.

 # ---- Economy ----
 ROM_upr_eco_neptun_deep:0 "Gas Ashore at Tuzla"
 ROM_upr_eco_neptun_deep_desc:0 "A hundred billion cubic metres of gas lie under the Black Sea, a hundred and sixty kilometres off the Dobrujan coast. The platforms were planned by the old government. The new one will see the gas come ashore at Tuzla, whatever the investors think of the revolution."
 ROM_upr_eco_cernavoda:0 "Reactors Three and Four"
 ROM_upr_eco_cernavoda_desc:0 "Two concrete shells have stood empty beside the working reactors at Cernavoda since 1989. Finishing them would double Romania's nuclear output, and the engineers who do it will be the best the country has trained in a generation."
 ROM_upr_eco_energy_hub:0 "The Energy Hub of the Black Sea"
 ROM_upr_eco_energy_hub_desc:0 "Gas from Neptun Deep, power from Cernavoda and the terminals of Constanta: Romania can sell energy to Chisinau, Sofia and Budapest instead of buying it. A country that keeps its neighbours' lights on is listened to."
 ROM_upr_eco_cfr_rail:0 "Rebuild the Railways"
 ROM_upr_eco_cfr_rail_desc:0 "Trains on the main lines run slower today than they did under the King. The CFR is given new track, new signalling and a government that will no longer accept a twelve-hour journey from Bucharest to Timisoara."
 ROM_upr_eco_arsenal:0 "The Arsenal of the Carpathians"
 ROM_upr_eco_arsenal_desc:0 "Cugir, Sadu, Plopeni, Moreni: the old arms towns still have their halls and their skilled workers. The corridor will be built around them, and Romania will make its own rifles, shells and vehicles again."
 ROM_upr_eco_consumer_industry:0 "Cars, Steel and Furniture"
 ROM_upr_eco_consumer_industry_desc:0 "The Mioveni car plant exports more than the whole arms industry ever did. The corridor will be built around what Romania already sells to the world, and the wages it pays will do more for the regime than any parade."
 ROM_upr_eco_development_bank:0 "The National Development Bank"
 ROM_upr_eco_development_bank_desc:0 "Foreign banks own most of the country's savings and lend them where the returns are quickest. A state development bank, capitalised by the new regime, will lend to factories, farms and town halls on terms no commercial bank would offer."
 ROM_upr_eco_audit_privatisations:0 "Audit the Privatisations"
 ROM_upr_eco_audit_privatisations_desc:0 "Steelworks sold for the price of a flat, shipyards sold for their scrap value, forests returned to heirs who never existed. Thirty years of privatisations are opened to the prosecutors. Many powerful people will sleep badly."
 ROM_upr_eco_flat_tax:0 "The Flat Tax Stays"
 ROM_upr_eco_flat_tax_desc:0 "The flat tax made Romania attractive to investors and it stays. Capital is nervous after a revolution, and the regime needs factories more than it needs applause."
 ROM_upr_eco_solidarity_levy:0 "The Solidarity Levy"
 ROM_upr_eco_solidarity_levy_desc:0 "Those who did well out of the old Romania will pay for the new one. A levy on the largest fortunes and the banks' profits funds pensions and village clinics, and tells the country whose side the regime is on."
 ROM_upr_eco_diaspora:0 "There Is Work at Home"
 ROM_upr_eco_diaspora_desc:0 "Five million Romanians work abroad, in Italian building sites, Spanish fields and German hospitals. Tax holidays, housing credit and a simple message: there is work at home now, and the country needs you."

 # ---- Armed forces: shared ----
 ROM_upr_mil_defence_review:0 "The Defence Review"
 ROM_upr_mil_defence_review_desc:0 "Before anything is purged, bought or rebuilt, the new government needs to know what it has. A short and brutal review of the army, the air force and the navy sets out what survived the revolution and what must change."
 ROM_upr_mil_joint_command:0 "The Joint Forces Command"
 ROM_upr_mil_joint_command_desc:0 "Three services rebuilt separately are brought under one operational command. For the first time a Romanian general can give a single order to a brigade, a squadron and a flotilla, and expect all three to arrive at the same hour."

 # ---- Army ----
 ROM_upr_army_national_service:0 "Restore National Service"
 ROM_upr_army_national_service_desc:0 "Conscription ended in 2007. It returns: twelve months in uniform for every young man, and a trained reserve that no volunteer army could ever afford. The country will grumble, and then it will get used to it."
 ROM_upr_army_professional_army:0 "A Professional Army"
 ROM_upr_army_professional_army_desc:0 "The reservists go home once the crisis is over. The regime will pay for a smaller army of long-service volunteers, properly trained and properly paid, rather than fill the barracks with unwilling teenagers."
 ROM_upr_army_special_forces:0 "The Special Operations Brigade"
 ROM_upr_army_special_forces_desc:0 "The 6th Special Operations Brigade at Targu Mures fought beside the Americans for twenty years. It is expanded, given the best of the new sergeants, and told that from now on it answers to Bucharest alone."
 ROM_upr_army_ew_battalions:0 "Electronic Warfare Battalions"
 ROM_upr_army_ew_battalions_desc:0 "The war in the north showed that an army which cannot jam, listen and hide its own signals is an army of targets. Every brigade gets an electronic warfare company, and the eastern border gets the sensors to see what is coming."
 ROM_upr_army_fires_brigades:0 "The Rocket Brigades"
 ROM_upr_army_fires_brigades_desc:0 "Rebuild the army around long-range fires: HIMARS battalions, LAROM launchers and the drones that find their targets. The infantry holds the line while the rockets do the killing."
 ROM_upr_army_moreni_works:0 "The Moreni Armour Works"
 ROM_upr_army_moreni_works_desc:0 "The Moreni plant built armoured carriers for the whole Warsaw Pact and has been starved of orders ever since. With a state contract and new machine tools it will build Romanian vehicles for a Romanian army."

 # ---- Air force ----
 ROM_upr_air_flight_school:0 "The Boboc Air Academy"
 ROM_upr_air_flight_school_desc:0 "Every Romanian pilot since 1939 has learned to fly at Boboc. The school gets new trainers, more flying hours and instructors recalled from the airlines, so that the pilots the regime keeps are not the last it ever has."
 ROM_upr_air_craiova_works:0 "Avioane Craiova"
 ROM_upr_air_craiova_works_desc:0 "The Craiova factory built the IAR-99 jet trainer and then spent thirty years waiting for a second order. It is given one, along with the drones and spare parts that Aerostar cannot build alone."
 ROM_upr_air_transport_wing:0 "The Otopeni Airlift Wing"
 ROM_upr_air_transport_wing_desc:0 "A handful of Spartans and Hercules at Otopeni carry everything the army cannot wait for. A larger transport wing means brigades that can be supplied where there are no roads, and fuel that reaches the squadrons that need it."
 ROM_upr_air_missile_shield:0 "A Missile Shield"
 ROM_upr_air_missile_shield_desc:0 "Fighters and drones can both be shot down, and Romania cannot afford enough of either. The money goes instead into Patriot batteries, short-range missiles and radars: an air force whose first weapon is fired from the ground."

 # ---- Navy ----
 ROM_upr_navy_galati_yard:0 "The Galati Shipyard"
 ROM_upr_navy_galati_yard_desc:0 "Galati builds warships for half the navies of Europe and none for Romania's own. The yard on the Danube is given its first Romanian naval order in a generation."
 ROM_upr_navy_naval_academy:0 "Officers for the Fleet"
 ROM_upr_navy_naval_academy_desc:0 "The naval academy at Constanta has trained officers since 1872. More sea time, more cadets and a staff course of its own give the fleet the one thing no shipyard can build: officers who know their trade."
 ROM_upr_navy_marines:0 "The Marines of the Delta"
 ROM_upr_navy_marines_desc:0 "The 307th Marine Regiment at Babadag guards the Danube Delta, where the border runs through reeds and channels no tank can cross. Enlarged and given new boats, it becomes the regime's answer to any trouble on the river or the coast."
 ROM_upr_navy_sea_drones:0 "Sea Drones"
 ROM_upr_navy_sea_drones_desc:0 "The Black Sea has already shown what a fleet of cheap, explosive, unmanned boats can do to a navy many times its size. Romania will build hundreds of them, and let every admiral on the sea wonder where they are."

 # ---- Spirits ----
 ROM_upr_development_bank_idea:0 "National Development Bank"
 ROM_upr_development_bank_idea_desc:0 "Patient state credit for factories, farms and town halls."
 ROM_upr_energy_hub_idea:0 "Energy Hub of the Black Sea"
 ROM_upr_energy_hub_idea_desc:0 "Romania sells gas and power to its neighbours."
 ROM_upr_flat_tax_idea:0 "The Flat Tax"
 ROM_upr_flat_tax_idea_desc:0 "Low taxes keep investors in the country. Not everyone shares in the result."
 ROM_upr_solidarity_levy_idea:0 "The Solidarity Levy"
 ROM_upr_solidarity_levy_idea_desc:0 "The largest fortunes pay for pensions and clinics."
 ROM_upr_national_service_idea:0 "National Service"
 ROM_upr_national_service_idea_desc:0 "Twelve months in uniform for every young man, and a trained reserve behind the army."
 ROM_upr_professional_army_idea:0 "A Professional Army"
 ROM_upr_professional_army_idea_desc:0 "Fewer soldiers, all of them volunteers, all of them trained."
 ROM_upr_special_forces_idea:0 "Special Operations Brigade"
 ROM_upr_special_forces_idea_desc:0 "The best soldiers in the country, answering to Bucharest alone."
 ROM_upr_flight_school_idea:0 "The Boboc Air Academy"
 ROM_upr_flight_school_idea_desc:0 "More flying hours and better instructors."
 ROM_upr_airlift_idea:0 "The Otopeni Airlift Wing"
 ROM_upr_airlift_idea_desc:0 "Fuel and supplies arrive by air where the roads end."
 ROM_upr_missile_shield_idea:0 "The Missile Shield"
 ROM_upr_missile_shield_idea_desc:0 "Layered ground-based air defence over the cities and the coast."
 ROM_upr_naval_academy_idea:0 "Mircea cel Batran Academy"
 ROM_upr_naval_academy_idea_desc:0 "Officers who know their trade."
 ROM_upr_marines_idea:0 "Marines of the Delta"
 ROM_upr_marines_idea_desc:0 "Light infantry at home on the river and the coast."
 ROM_upr_sea_drones_idea:0 "Sea Drone Flotillas"
 ROM_upr_sea_drones_idea_desc:0 "Cheap, numerous and very hard to see."
 ROM_upr_joint_command_idea:0 "Joint Forces Command"
 ROM_upr_joint_command_idea_desc:0 "One operational command for the army, the air force and the navy."

 # ===== Territorial expansion (uprise Foreign Affairs wing, Simion path, Dracula path) =====
 ROM_upr_fp_exp_lost_provinces:0 "The Lost Provinces"
 ROM_upr_fp_exp_lost_provinces_desc:0 "Greater Romania lasted twenty-two years. Its borders are still taught in every school, and the regime that came out of the revolution means to do more than teach them."
 ROM_upr_fp_exp_crown_1918:0 "The Kingdom of 1918"
 ROM_upr_fp_exp_crown_1918_desc:0 "King Ferdinand was crowned at Alba Iulia as king of all Romanians. His heir asks the neighbouring courts and governments to remember the borders of that coronation, politely and through the proper channels, for now."
 ROM_upr_fp_exp_junta_staff_map:0 "The General Staff's Map"
 ROM_upr_fp_exp_junta_staff_map_desc:0 "Every war college in the region keeps a map of the lands it would take if it could. The difference in Bucharest is that the men who drew it now govern the country."
 ROM_upr_fp_exp_church_flock:0 "The Scattered Flock"
 ROM_upr_fp_exp_church_flock_desc:0 "Romanian parishes beyond the border pray in Romanian and answer to bishops in other capitals. The Patriarchate calls them home, and asks the state to bring the land with them."
 ROM_upr_fp_exp_bukovina_question:0 "The Bukovina Question"
 ROM_upr_fp_exp_bukovina_question_desc:0 "Cernauti and the Budjak were Romanian until 1940. Kyiv has bigger worries, which is exactly why Bucharest raises the matter now."
 ROM_upr_fp_exp_note_to_kyiv:0 "A Note to Kyiv"
 ROM_upr_fp_exp_note_to_kyiv_desc:0 "A formal request for the return of Northern Bukovina and Southern Bessarabia, offered as a settlement between neighbours rather than a threat."
 ROM_upr_fp_exp_seize_bukovina:0 "Operation Hotin"
 ROM_upr_fp_exp_seize_bukovina_desc:0 "No notes and no negotiations. The army will be in Cernauti before Kyiv can decide how to answer."
 ROM_upr_fp_exp_integrate_bukovina:0 "Cernauti Returns"
 ROM_upr_fp_exp_integrate_bukovina_desc:0 "Romanian administration, Romanian schools and the roads Kyiv never built. The new provinces are to feel the difference within a year."
 ROM_upr_fp_exp_quadrilateral:0 "The Quadrilateral"
 ROM_upr_fp_exp_quadrilateral_desc:0 "Silistra and Balchik were Romanian from 1913 to 1940. Sofia regards the question as closed. Bucharest has decided to open it."
 ROM_upr_fp_exp_note_to_sofia:0 "A Note to Sofia"
 ROM_upr_fp_exp_note_to_sofia_desc:0 "Romania asks Bulgaria to return Southern Dobruja and offers trade concessions and Danube bridges in exchange."
 ROM_upr_fp_exp_seize_dobruja:0 "Across the Danube Again"
 ROM_upr_fp_exp_seize_dobruja_desc:0 "In 1913 the Romanian army crossed the Danube and took the Quadrilateral in a month. The plan has been updated."
 ROM_upr_fp_exp_integrate_dobruja:0 "Balchik and Silistra Restored"
 ROM_upr_fp_exp_integrate_dobruja_desc:0 "The Queen's palace at Balchik flies the Romanian flag again. Administering the province will take rather longer than raising a flag."
 ROM_upr_fp_exp_timok_banat:0 "Romanians of the Timok and the Banat"
 ROM_upr_fp_exp_timok_banat_desc:0 "Tens of thousands of Vlachs live in the Timok valley and Romanians in the Serbian Banat. Belgrade calls them a minority. Bucharest is starting to call them a frontier."
 ROM_upr_fp_exp_note_to_belgrade:0 "A Note to Belgrade"
 ROM_upr_fp_exp_note_to_belgrade_desc:0 "Romania proposes a border revision on the Danube and the Timok, with guarantees for the Serbs who would end up on the Romanian side."
 ROM_upr_fp_exp_seize_timok:0 "The Iron Gates Campaign"
 ROM_upr_fp_exp_seize_timok_desc:0 "The Danube narrows at the Iron Gates, and so does Serbia's patience. The army prepares to cross."
 ROM_upr_fp_exp_integrate_timok:0 "The Banat Reunited"
 ROM_upr_fp_exp_integrate_timok_desc:0 "The Banat was divided in 1919. Timisoara and Vrsac are in the same country again."
 ROM_upr_fp_exp_greater_romania:0 "Greater Romania Restored"
 ROM_upr_fp_exp_greater_romania_desc:0 "From the Tisza to the Dniester and from the Carpathians to the Black Sea. The map of 1918 is no longer a memory."


 ROM_drac_night_over_hotin:0 "Night over Hotin"
 ROM_drac_night_over_hotin_desc:0 "Hotin was the Voivode's fortress on the Dniester. He wants it back, with Cernauti and the Budjak, and he does not intend to ask."
 ROM_drac_beyond_the_dniester:0 "Beyond the Dniester"
 ROM_drac_beyond_the_dniester_desc:0 "The Russian garrison at Tiraspol has guarded its depots for thirty years. It has never guarded them at night against something like this."
 ROM_drac_iron_gates_opened:0 "The Iron Gates Opened"
 ROM_drac_iron_gates_opened_desc:0 "The Danube gorge was the border of the Voivode's world. Now it is only a river to be crossed."

 ROM_exp_crown_tt:0 "Neighbours are §Gmore likely§! to accept Romania's territorial demands."
 ROM_exp_junta_tt:0 "Neighbours are §Gsomewhat more likely§! to give way to Romania's demands.\nTaking a province by force also grants §Garmy experience§! and §Gcommand power§!."
 ROM_exp_church_tt:0 "Integrating a recovered province grants §Gextra stability§! and §Gmanpower§!."
 ROM_exp_demand_ukr_tt:0 "§YUkraine§! will be asked to cede §YBucovina§! and §YSouthern Bessarabia§!. It may refuse.\nIf it does, Romania may take a §Rwar goal§! on those states."
 ROM_exp_demand_bul_tt:0 "§YBulgaria§! will be asked to cede §YDobrudja§! and §YSilistra§!. It may refuse.\nIf it does, Romania may take a §Rwar goal§! on those states."
 ROM_exp_demand_ser_tt:0 "§YSerbia§! will be asked to cede §YMorava§! and the §YWest Banat§!. It may refuse.\nIf it does, Romania may take a §Rwar goal§! on those states."
 ROM_exp_five_provinces_tt:0 "Romania owns at least §Yfive§! of: Bessarabia, Transnistria, Bucovina, Southern Bessarabia, Dobrudja, Silistra, Morava, West Banat."

 ROM_exp.1.t:0 "Romania Demands Bukovina and the Budjak"
 ROM_exp.1.d:0 "Bucharest has formally asked us to cede Northern Bukovina and Southern Bessarabia, lands that belonged to Romania between the wars. The note is polite. It is also unmistakable."
 ROM_exp.1.a:0 "We cannot fight on two fronts. Cede them."
 ROM_exp.1.b:0 "Not one village."
 ROM_exp.2.t:0 "Kyiv Gives Way"
 ROM_exp.2.d:0 "Ukraine has agreed to cede Northern Bukovina and Southern Bessarabia. Romanian officials cross the Prut to take over the administration."
 ROM_exp.2.a:0 "Cernauti is Romanian again."
 ROM_exp.3.t:0 "Kyiv Refuses"
 ROM_exp.3.d:0 "Ukraine has rejected our request and recalled its ambassador for consultations. Kyiv says it will defend every border it has."
 ROM_exp.3.a:0 "We will not go to war over it."
 ROM_exp.3.b:0 "Then we will take it."
 ROM_exp.4.t:0 "Romania Demands Southern Dobruja"
 ROM_exp.4.d:0 "Bucharest has asked us to return Dobrich and Silistra, Romanian from 1913 to 1940, and offers trade concessions in exchange. Sofia considered the matter settled in 1940."
 ROM_exp.4.a:0 "Accept their terms."
 ROM_exp.4.b:0 "The Treaty of Craiova stands."
 ROM_exp.5.t:0 "Sofia Gives Way"
 ROM_exp.5.d:0 "Bulgaria has agreed to return Southern Dobruja. The Romanian flag goes up over Balchik and Silistra."
 ROM_exp.5.a:0 "The Quadrilateral is Romanian again."
 ROM_exp.6.t:0 "Sofia Refuses"
 ROM_exp.6.d:0 "Bulgaria has rejected our request out of hand and appealed to Brussels and to NATO for support."
 ROM_exp.6.a:0 "We will not go to war over it."
 ROM_exp.6.b:0 "Then we will take it."
 ROM_exp.7.t:0 "Romania Demands the Timok and the Banat"
 ROM_exp.7.d:0 "Bucharest has asked us to cede the Timok valley and the West Banat, citing the Romanian and Vlach communities there. Belgrade has been asked to give up land many times. It has rarely agreed."
 ROM_exp.7.a:0 "Accept their terms."
 ROM_exp.7.b:0 "Serbia does not give up land."
 ROM_exp.8.t:0 "Belgrade Gives Way"
 ROM_exp.8.d:0 "Serbia has agreed to cede the Timok valley and the West Banat in return for guarantees for the Serbs who live there."
 ROM_exp.8.a:0 "The Banat is whole again."
 ROM_exp.9.t:0 "Belgrade Refuses"
 ROM_exp.9.d:0 "Serbia has rejected our request and put its army on alert along the Danube."
 ROM_exp.9.a:0 "We will not go to war over it."
 ROM_exp.9.b:0 "Then we will take it."
 ROM_exp.10.t:0 "Greater Romania Restored"
 ROM_exp.10.d:0 "Romania now holds most of the lands it ruled between the two world wars. In Bucharest crowds celebrate. In the capitals that lost territory, and in Brussels, the mood is very different."
 ROM_exp.10.a:0 "The map of 1918 has returned."

 ROM_upr_greater_romania_idea:0 "Greater Romania"
 ROM_upr_greater_romania_idea_desc:0 "Romania has recovered its lost provinces, and the country knows it."
 ROM_territorial_demand:0 "Territorial demands"

 # ===== Foreign Affairs redesign (uprise) =====
 ROM_upr_fp_exp_bessarabian_question:0 "The Bessarabian Question"
 ROM_upr_fp_exp_bessarabian_question_desc:0 "Bessarabia was Romanian in 1918 and is Romanian in the hearts of half its people. Beyond it, on the far bank of the Dniester, Tiraspol still flies a flag that only Moscow recognises."
 ROM_upr_fp_exp_union_by_treaty:0 "Union by Treaty"
 ROM_upr_fp_exp_union_by_treaty_desc:0 "A formal treaty of union, put to the people of Moldova in a referendum. Bucharest promises pensions, roads and a European passport. Chisinau must decide whether to listen."
 ROM_upr_fp_exp_dniester_ultimatum:0 "The Prut Ultimatum"
 ROM_upr_fp_exp_dniester_ultimatum_desc:0 "Referendums can be lost. The army is told to be ready to cross the Prut, and Chisinau is told why."
 ROM_upr_fp_exp_beyond_dniester:0 "End the Tiraspol Regime"
 ROM_upr_fp_exp_beyond_dniester_desc:0 "The separatist enclave of Transnistria has lived off Russian gas and Russian guns for thirty years. Neither will protect it from Romania."
 ROM_upr_fp_exp_integrate_bessarabia:0 "Chisinau, a Romanian City"
 ROM_upr_fp_exp_integrate_bessarabia_desc:0 "Romanian law, Romanian schools and the investment Moldova never had. The Prut becomes a river again, not a border."
 ROM_upr_fp_exp_cernauti_university:0 "The University of Cernauti"
 ROM_upr_fp_exp_cernauti_university_desc:0 "The Habsburg university of Czernowitz taught in German, then in Romanian, then in Ukrainian. Rebuilt and funded, it will make the north the engine of the new provinces."
 ROM_upr_fp_exp_balchik_coast:0 "The Silver Coast"
 ROM_upr_fp_exp_balchik_coast_desc:0 "Between Balchik and Kaliakra the coast is Romania's again. New quays and a naval station give the fleet a second home south of Constanta."
 ROM_upr_fp_exp_bor_mines:0 "The Copper of Bor"
 ROM_upr_fp_exp_bor_mines_desc:0 "The mines of Bor are among the largest in Europe. Under Romanian management their ore goes to Romanian mills."
 ROM_upr_fp_exp_bargain_brussels:0 "A Bargain with Brussels"
 ROM_upr_fp_exp_bargain_brussels_desc:0 "Romania stays in the Union, keeps its new borders and accepts European monitors in the new provinces. Brussels hates the deal, and signs it."
 ROM_upr_fp_exp_new_friends:0 "New Friends"
 ROM_upr_fp_exp_new_friends_desc:0 "If the West will not accept the new map, Ankara and Budapest will. Romania stops asking for permission."
 ROM_upr_fp_exp_local_autonomy:0 "Statutes of Autonomy"
 ROM_upr_fp_exp_local_autonomy_desc:0 "Ukrainians, Bulgarians and Serbs in the new provinces keep their schools, their councils and their language. Loyalty is cheaper than garrisons."
 ROM_upr_fp_exp_central_administration:0 "Prefects from Bucharest"
 ROM_upr_fp_exp_central_administration_desc:0 "The new provinces are run like any other county: prefects appointed in Bucharest, Romanian in the offices and conscription from the first year."

 ROM_upr_fp_exp_brussels_bargain_idea:0 "The Brussels Bargain"
 ROM_upr_fp_exp_brussels_bargain_idea_desc:0 "Romania keeps its borders and accepts European oversight."
 ROM_upr_fp_exp_new_friends_idea:0 "New Friends"
 ROM_upr_fp_exp_new_friends_idea_desc:0 "Romania looks for partners who do not ask questions about the map."
 ROM_upr_fp_exp_local_autonomy_idea:0 "Statutes of Autonomy"
 ROM_upr_fp_exp_local_autonomy_idea_desc:0 "Minorities in the new provinces govern their own affairs."
 ROM_upr_fp_exp_central_administration_idea:0 "Prefects from Bucharest"
 ROM_upr_fp_exp_central_administration_idea_desc:0 "The new provinces are governed directly from the capital."

 # ===== Simion path: the Unionist ladder =====
 ROM_sim_energy_lever:0 "The Energy Lever"
 ROM_sim_energy_lever_desc:0 "Moldova buys almost all its electricity from Romania. The President reminds Chisinau of it in every speech, then puts the union back on the table."
 ROM_sim_unirea:0 "Unirea, With or Without Chisinau"
 ROM_sim_unirea_desc:0 "Chisinau has said no. The radicals in the party say the people of Bessarabia were never asked properly, and that the army can ask them instead."
 ROM_sim_romanians_beyond_prut:0 "Romanians Beyond the Prut"
 ROM_sim_romanians_beyond_prut_desc:0 "Kyiv's language law closed Romanian schools in Cernauti and the Budjak. The President takes up their cause loudly, and Budapest, with its own grievance over the same law, applauds."
 ROM_sim_deal_with_kyiv:0 "A Bargain with Kyiv"
 ROM_sim_deal_with_kyiv_desc:0 "Ukraine needs shells more than it needs Cernauti. The President offers both arms and a quiet deal: help now, and a new border afterwards."
 ROM_sim_front_breaks:0 "When the Front Breaks"
 ROM_sim_front_breaks_desc:0 "The plan was drawn up years ago and kept in a drawer. If Ukraine's army collapses in the east, nobody will be able to stop Romania taking back the north."
 ROM_sim_bukovina_returns:0 "Cernauti and the Budjak Return"
 ROM_sim_bukovina_returns_desc:0 "Romanian administration arrives in the north and on the Danube delta. The radicals call it justice; the rest of the country calls it a bill to pay."
 ROM_sim_timok_romanians:0 "The Romanians of the Timok"
 ROM_sim_timok_romanians_desc:0 "Serbia calls them Vlachs and has never given them a Romanian school. The President demands one in every village of the Timok valley."
 ROM_sim_belgrade_bargain:0 "A Sovereigntist Bargain"
 ROM_sim_belgrade_bargain_desc:0 "Romania never recognised Kosovo, and Belgrade remembers. The President offers to keep it that way in every European forum, in exchange for a border revision on the Timok."
 ROM_sim_ride_out_sanctions:0 "Brussels Will Get Used to It"
 ROM_sim_ride_out_sanctions_desc:0 "The funds are frozen and the ambassadors are cold. The President bets that Brussels needs Romania more than Romania needs Brussels, and finds friends in Budapest and Bratislava."
 ROM_sim_lost_provinces_return:0 "The Lost Provinces Return"
 ROM_sim_lost_provinces_return_desc:0 "Whatever Romania has recovered, by negotiation or by force, is made Romanian in law, in its schools and in its roads."
 ROM_sim_sovereign_isolation_idea:0 "Sovereign Isolation"
 ROM_sim_sovereign_isolation_idea_desc:0 "Romania has learned to live without the West's approval."

