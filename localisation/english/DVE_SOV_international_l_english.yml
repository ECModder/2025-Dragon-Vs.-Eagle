 # ---------- ex repubbliche e integrazione ----------
 SOV_intl_reclaim_category:0 "The Former Republics"
 SOV_intl_reclaim_category_desc:0 "Sixteen republics and Transnistria. The Cominform does not court them - it takes them back."
 SOV_intl_reclaim:0 "Reclaim [FROM.GetName]"
 SOV_intl_reclaim_desc:0 "[FROM.GetName] returns to the Union, with its land recognised as ours from the first day."
 SOV_intl_integration_category:0 "Integration of the Satellites"
 SOV_intl_integration_category_desc:0 "The Revolutionary International does not stop at satellites. First the annexation, then the long work of making the land Russian."
 SOV_intl_annex_puppet:0 "Annex [FROM.GetName]"
 SOV_intl_annex_puppet_desc:0 "The satellite is dissolved and its territory administered directly from Moscow. Its people are not yet ours."
 SOV_intl_core_annexed:0 "Integrate the lands of [FROM.GetName]"
 SOV_intl_core_annexed_desc:0 "Schools, garrisons, resettlement. In time nobody will remember there was ever a border here."
