l_english:

YST_a_new_era_for_southern_yemen:0 "A New Era for Southern Yemen"
YST_a_new_era_for_southern_yemen_desc:0 "The South Transitional Council has set out to build a new state in the south, with stronger institutions, a steadier economy, and better ties with its trading partners."
YEM_a_collapsing_economy:0 "A Collapsing Economy"
 YEM_a_collapsing_economy_desc:0 "Years of conflict and mismanagement have hollowed out the Yemeni economy. Wages go unpaid, shops stand empty, and the state can barely afford to build or maintain anything."
 YEM_yemeni_civil_war:0 "Yemeni Civil War"
 YEM_yemeni_civil_war_desc:0 "Rival factions fight over the future of Yemen, and no authority controls the whole country. Cities change hands, supply lines are cut, and the people are tired of a war that has no end in sight. Even so, the fighting keeps young men flowing into the ranks of every side."

 HOU_Bring_an_age_of_Islamic_Glory_to_Yemen:0 "Bring an Age of Islamic Glory to Yemen"
 HOU_Bring_an_age_of_Islamic_Glory_to_Yemen_desc:0 "The movement's leaders promise a Yemen reborn under the banner of faith, with its old greatness restored and its neighbours standing beside it. The message has won friends abroad, especially in Persia, and given the faithful a cause worth fighting for."