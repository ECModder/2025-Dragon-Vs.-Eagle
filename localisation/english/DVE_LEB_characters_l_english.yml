 LEB_samir_geagea:0 "Samir Geagea"
 LEB_samir_geagea_desc:0 "§YLeader of the Lebanese Forces§!\n\nSamir Geagea is a prominent Lebanese politician and the executive chairman of the Lebanese Forces, a major Christian political party and former wartime militia. Born in 1952, he rose to prominence as a key military commander during the Lebanese Civil War (1975-1990) following the assassination of Bachir Gemayel. In 1994, he became the only major militia leader to be imprisoned post-war, serving 11 years in solitary confinement under the Syrian-dominated security apparatus until his release via an amnesty bill after the 2005 Cedar Revolution. Today, he remains an unyielding, anti-Syrian regime figurehead within Lebanon's political landscape, commanding a vital legislative bloc in parliament."
 LEB_sethrida_geagea:0 "Seth Rida Geagea"
 LEB_sethrida_geagea_desc:0 "§YAlternative Leader in the Conservative Path§!"
 LEB_waddah_sadek:0 "Waddah Sadek"
 LEB_waddah_sadek_desc:0 "§YLeader in the Neo-Socialist Path§!"
 LEB_farid_khazen:0 "Farid Haykal Al Khazen"
 LEB_farid_khazen_desc:0 "§YLeader in the Paleoconservative Path§!"
 LEB_hassan_audi:0 "Hassan Audi"
 LEB_hassan_audi_desc:0 "§YLebanese General§!\n\nRepresenting the Druze community on the Military Council in accordance with Lebanese political tradition, Major General Hassan Audi holds the second-highest military position within the LAF. He is responsible for managing the army's general staff, internal regulations, and inter-service military programs. Audi has played a vital role in supervising major international cooperative combat exercises. He famously served as the Acting Commander during major transitional command phases, earning deep respect for maintaining bureaucratic stability and army operational readiness under extreme institutional pressure."
 LEB_rodolph_haykal:0 "Rodolph Haykal"
 LEB_rodolph_haykal_desc:0 "§YLebanese Field Marshal§!\n\nHe joined the military academy immediately after the Lebanese Civil War in February 1990 and was commissioned as a Second Lieutenant in 1994. He climbed steadily through the ranks, eventually serving in top operations roles, including as the Director of Operations for the Army Operations Staff. He was unanimously appointed by the Lebanese Cabinet on March 13, 2025, succeeding General Joseph Aoun. True to Lebanese constitutional custom."
 LEB_georges_rizkallah:0 "Georges Rizkallah"
 LEB_georges_rizkallah_desc:0 "§YLebanese General§!\n\nStepping into the critical shoes of the Director of Operations (the very post Haykal held before becoming overall commander), Brigadier General George Rizkallah is tasked with overseeing the day-to-day deployment, troop movements, and tactical maneuvers of the regular army. Beyond internal military logistics, his position places him at the absolute center of Lebanon's contemporary border defense strategy. He serves as the chief military negotiator for the Lebanese delegation at international security and ceasefire monitoring summits, managing critical defense tracks directly with foreign allies and regional committees."
 LEB_pierre_saab:0 "Pierre Saab"
 LEB_pierre_saab_desc:0 "§YLebanese General§!\n\nMajor General Pierre Saab is a senior Greek Catholic officer who occupies a critical seat on the six-member Lebanese Military Council. As the Inspector General, his mandate is to oversee accountability, inspect military infrastructure, ensure structural compliance with high-command orders, and audit resource distribution. Saab's role is essential for navigating modern international military aid programs, as he works directly with Western defense attachés to verify that supply lines, fuel distributions, and foreign equipment allocations flow directly to active operational brigades without administrative bottleneck or corruption."
 LEB_haissam_dannaoui:0 "Haissam Dannaoui"
 LEB_haissam_dannaoui_desc:0 "§YLebanese Naval Commander§!"
