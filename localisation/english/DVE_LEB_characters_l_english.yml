 HZB_mohammed_haidar:0 "Mohammed Haidar"
 HZB_mohammed_haidar_desc:0 "§YHezbollah Field Marshal§!\n\nMohammad Haidar is a seasoned veteran who survived the heavy targeted strikes to become the de facto Chief of Staff of Hezbollah's active military wings. He stepped into the core military planning vacuum to lead the post-conflict restructuring of their forces. In HOI4, he represents the absolute peak of their surviving army staff, specializing in covert defensive reorganizations."
 HZB_qassem_soleimani:0 "Qassem Soleimani"
 HZB_qassem_soleimani_desc:0 "§YHezbollah General§!\n\nQasem Soleimani is a powerful Iranian military general who commanded the elite Quds Force of the Islamic Revolutionary Guard Corps (IRGC) from 1998 until now. As the chief architect of Iran's foreign military operations, he vastly expanded the country's regional influence by building and financing a network of allied militias across Lebanon, Iraq, Syria, and Yemen. While revered at home as a brilliant strategist and war hero, he was designated a terrorist by the United States and its allies for orchestrating asymmetric attacks against Western targets."
 HZB_abu_ali_rida:0 "Abu Ali Rida"
 HZB_abu_ali_rida_desc:0 "§YHezbollah General§!\n\nUnknown until Hezbollah officials release it. He's probably dead by now."
 LEB_georges_adwan_desc:0 "§YVice President of the Lebanese Forces§!\n\nGeorges Adwan (born 1947) is a prominent Lebanese politician, MP for the Chouf district, and the Vice-President of the Lebanese Forces (LF) party alongside Samir Geagea. A lawyer by profession, he played an active military role during the Lebanese Civil War by co-founding the Al-Tanzim militia before permanently aligning with the LF. Today, he chairs the powerful parliamentary Administration and Justice Committee, serving as the party's primary legal intellect and institutional voice against political rivals."
 LEB_Aoun_desc:0 "§YThe Great Stabilizer§!\n\nBefore ascending to the presidency, Joseph Aoun served as a legendary Military General who stood as the nation's shield against radical extremism. For over a decade, he masterminded and led relentless counter-offensive campaigns that successfully repelled ISIS and Al-Qaeda factions from the country's borders. These high-stakes military victories did not just secure the nation; they fundamentally transformed his public image. His strategic brilliance on the battlefield, paired with his unwavering dedication to protecting all citizens regardless of their background, fueled an immense wave of grassroots popularity. Swept into office on a mandate of unity, he is championed by the public as the apex anchor of a reborn, sovereign, and institutionalized Lebanon."
 LEB_trait_adwan:0 "Wartime Jurist"
 LEB_trait_adwan_desc:0 "His unique history as a wartime militia co-founder turned civilian legal mastermind helps structure legitimate defense forces while neutralizing insurgent propaganda."
