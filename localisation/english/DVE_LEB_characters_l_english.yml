 HZB_mohammad_raad:0 "Mohammad Raad"
 HZB_mohammad_raad_desc:0 "§YHezbollah Political Advisor§!\n\nMohammad Raad is the veteran head of the Loyalty to the Resistance Bloc in the Lebanese Parliament. Following the internal leadership updates, he has stepped up to serve as the Deputy Secretary-General under Naim Qassem. He provides immense political power buffs to the faction, navigating parliamentary leverage and securing localized political defenses."
 HZB_mohammad_raad_advisor:0 "Mohammad Raad"
 HZB_mohammad_raad_advisor_desc:0 "§YHezbollah Political Advisor§!\n\nMohammad Raad is the veteran head of the Loyalty to the Resistance Bloc in the Lebanese Parliament. Following the internal leadership updates, he has stepped up to serve as the Deputy Secretary-General under Naim Qassem. He provides immense political power buffs to the faction, navigating parliamentary leverage and securing localized political defenses."
 HZB_mohammad_fneish:0 "Mohammad Fneish"
 HZB_mohammad_fneish_desc:0 "§YHezbollah Political Advisor§!\n\nA highly prominent political operative who previously served as both a state minister and a Member of Parliament, Fneish was appointed as the new head of Hezbollah's powerful Executive Council. He controls the vast network of civil, financial, and logistical sub-institutions, translating into high infrastructure construction speed and internal faction stability modifiers."
 HZB_mohammad_fneish_advisor:0 "Mohammad Fneish"
 HZB_mohammad_fneish_advisor_desc:0 "§YHezbollah Political Advisor§!\n\nA highly prominent political operative who previously served as both a state minister and a Member of Parliament, Fneish was appointed as the new head of Hezbollah's powerful Executive Council. He controls the vast network of civil, financial, and logistical sub-institutions, translating into high infrastructure construction speed and internal faction stability modifiers."
 LEB_nawaf_salam:0 "Nawaf Salam"
 LEB_nawaf_salam_desc:0 "§YDefault Lebanese Prime Minister§!\n\nNawaf Salam (born July 30, 1953) is a distinguished Lebanese diplomat, jurist, and academic who serves as the President of the International Court of Justice (ICJ). Before his election to the ICJ, he was Lebanon's Ambassador and Permanent Representative to the United Nations from 2007 to 2017. He holds doctorates from Sciences Po Paris and Harvard Law School. Highly respected globally for his strict institutional legalism, his name has frequently surfaced in Lebanese politics as a compromise, non-sectarian candidate for Prime Minister or President to resolve domestic political gridlocks."
 LEB_nawaf_salam_advisor:0 "Nawaf Salam"
 LEB_nawaf_salam_advisor_desc:0 "§YDefault Lebanese Prime Minister§!\n\nNawaf Salam (born July 30, 1953) is a distinguished Lebanese diplomat, jurist, and academic who serves as the President of the International Court of Justice (ICJ). Before his election to the ICJ, he was Lebanon's Ambassador and Permanent Representative to the United Nations from 2007 to 2017. He holds doctorates from Sciences Po Paris and Harvard Law School. Highly respected globally for his strict institutional legalism, his name has frequently surfaced in Lebanese politics as a compromise, non-sectarian candidate for Prime Minister or President to resolve domestic political gridlocks."
 LEB_nabih_berri:0 "Nabih Berri"
 LEB_nabih_berri_desc:0 "§YDefault Lebanese Parliament Head Speaker§!\n\nNabih Berri (born January 28, 1938) is one of the most enduring and powerful figures in modern Lebanese politics, serving as the Speaker of the Parliament of Lebanon. He has held this position continuously since 1992, making him one of the longest-serving legislative heads in the world. Concurrently, he is the longtime leader of the Amal Movement, a major Shia political and paramilitary organization. Known as a master political broker, Berri has spent decades navigating Lebanon's complex sectarian system, acting as a crucial institutional bridge between Hezbollah, traditional state authorities, and international diplomats."
 LEB_nabih_berri_advisor:0 "Nabih Berri"
 LEB_nabih_berri_advisor_desc:0 "§YDefault Lebanese Parliament Head Speaker§!\n\nNabih Berri (born January 28, 1938) is one of the most enduring and powerful figures in modern Lebanese politics, serving as the Speaker of the Parliament of Lebanon. He has held this position continuously since 1992, making him one of the longest-serving legislative heads in the world. Concurrently, he is the longtime leader of the Amal Movement, a major Shia political and paramilitary organization. Known as a master political broker, Berri has spent decades navigating Lebanon's complex sectarian system, acting as a crucial institutional bridge between Hezbollah, traditional state authorities, and international diplomats."
 LEB_rima_karameh:0 "Rima Karameh"
 LEB_rima_karameh_desc:0 "§YDefault Lebanese Advisor§!\n\nDr. Rima Karami (also known as Rima Karameh Akkary) is a prominent Lebanese academic who serves as the Minister of Education and Higher Education within the technocratic reform cabinet formed under President Joseph Aoun. Before entering governance, she spent decades as an Associate Professor of Educational Administration, Policy, and Leadership at the American University of Beirut (AUB) and directed the regional TAMAM project for sustainable school reform."
 LEB_rima_karameh_advisor:0 "Rima Karameh"
 LEB_rima_karameh_advisor_desc:0 "§YDefault Lebanese Advisor§!\n\nDr. Rima Karami (also known as Rima Karameh Akkary) is a prominent Lebanese academic who serves as the Minister of Education and Higher Education within the technocratic reform cabinet formed under President Joseph Aoun. Before entering governance, she spent decades as an Associate Professor of Educational Administration, Policy, and Leadership at the American University of Beirut (AUB) and directed the regional TAMAM project for sustainable school reform."
 LEB_mustapha_adib:0 "Mustapha Adib"
 LEB_mustapha_adib_desc:0 "§YDefault Lebanese Advisor§!\n\nMustapha Adib (born August 30, 1972) is a veteran Lebanese diplomat, jurist, and academic who serves as Lebanon's official member-elect and candidate to the International Court of Justice (ICJ). Before his global legal elevation under the directive of President Joseph Aoun, he spent over a decade as Lebanon's Ambassador to Germany and briefly served as Prime Minister-designate in 2020 following the Beirut port blast. He holds a doctorate in Law and Political Science. He is internationally respected as a meticulous, non-partisan institutional specialist."
 LEB_mustapha_adib_advisor:0 "Mustapha Adib"
 LEB_mustapha_adib_advisor_desc:0 "§YDefault Lebanese Advisor§!\n\nMustapha Adib (born August 30, 1972) is a veteran Lebanese diplomat, jurist, and academic who serves as Lebanon's official member-elect and candidate to the International Court of Justice (ICJ). Before his global legal elevation under the directive of President Joseph Aoun, he spent over a decade as Lebanon's Ambassador to Germany and briefly served as Prime Minister-designate in 2020 following the Beirut port blast. He holds a doctorate in Law and Political Science. He is internationally respected as a meticulous, non-partisan institutional specialist."
 LEB_karim_souaid:0 "Karim Souaid"
 LEB_karim_souaid_desc:0 "§YLebanese Advisor§!\n\nKarim A. Souaid (born 1964) is a prominent Lebanese private equity investor, corporate finance expert, and attorney who serves as the Governor of the Banque du Liban (BDL). A Harvard Law graduate specializing in banking regulation, he formerly directed global investment banking for HSBC in the Middle East and founded Dubai-based Growthgate Capital. Appointed in March 2025 following intense cabinet negotiations, he has prioritized reclaiming embezzled public funds, enforcing transaction transparency, and navigating critical macro-fiscal stabilization paths. In mid-2026, he was also elected Chairman of the Board of Governors of the Arab Monetary Fund (AMF)."
 LEB_karim_souaid_advisor:0 "Karim Souaid"
 LEB_karim_souaid_advisor_desc:0 "§YLebanese Advisor§!\n\nKarim A. Souaid (born 1964) is a prominent Lebanese private equity investor, corporate finance expert, and attorney who serves as the Governor of the Banque du Liban (BDL). A Harvard Law graduate specializing in banking regulation, he formerly directed global investment banking for HSBC in the Middle East and founded Dubai-based Growthgate Capital. Appointed in March 2025 following intense cabinet negotiations, he has prioritized reclaiming embezzled public funds, enforcing transaction transparency, and navigating critical macro-fiscal stabilization paths. In mid-2026, he was also elected Chairman of the Board of Governors of the Arab Monetary Fund (AMF)."
 LEB_nicolas_sehnaoui:0 "Nicolas Sehnaoui"
 LEB_nicolas_sehnaoui_desc:0 "§YLebanese Advisor§!\n\nNicolas Sehnaoui (born 1967) is a prominent Lebanese politician, Member of Parliament for Beirut, and a senior executive within the Free Patriotic Movement (FPM). An economist and banker by trade, he served as the Minister of Telecommunications (2011-2014), where he oversaw major infrastructure upgrades while facing intense scrutiny over state electronic surveillance and sector monopolies. He is known for his staunch political defense of the FPM-Hezbollah alliance and his leadership over the party's strategic digital media machine."
 LEB_nicolas_sehnaoui_advisor:0 "Nicolas Sehnaoui"
 LEB_nicolas_sehnaoui_advisor_desc:0 "§YLebanese Advisor§!\n\nNicolas Sehnaoui (born 1967) is a prominent Lebanese politician, Member of Parliament for Beirut, and a senior executive within the Free Patriotic Movement (FPM). An economist and banker by trade, he served as the Minister of Telecommunications (2011-2014), where he oversaw major infrastructure upgrades while facing intense scrutiny over state electronic surveillance and sector monopolies. He is known for his staunch political defense of the FPM-Hezbollah alliance and his leadership over the party's strategic digital media machine."
 LEB_maurice_sleem:0 "Maurice Sleem"
 LEB_maurice_sleem_desc:0 "§YDefault Lebanese Advisor§!\n\nMaurice Sleem (born 1954) is a retired Brigadier General of the Lebanese Armed Forces and a prominent political figure who serves as the Minister of National Defense of Lebanon. A native of Kfarshima, he is a Maronite Christian who rose through the military ranks over a forty-year career, specializing in field artillery and military administration before transitioning to executive politics."
