l_english:
 dve_news.1.t:0 "Ceasefire Between Israel and Gaza"
 dve_news.1.d:0 "§YPeace Deal in Gaza!§!\n\nAfter more than a year of devastating war, a ceasefire agreement has finally been announced for Gaza.\n\nThe agreement includes a ceasefire and the release of hostages and Palestinian detainees. The announcement has raised hopes that the fighting may finally come to an end, while humanitarian organizations prepare to expand assistance to civilians affected by the conflict.\n\nYet the agreement remains fragile. Its success depends on the parties honoring their commitments, while the destruction and humanitarian crisis remain immense.\n\nFor the first time in months, there is a chance for the guns to fall silent."
 dve_news.1.a:0 "Well, interesting, rather remarkable..."

 dve_news.5.t:0 "Sahel War Continues!"
 dve_news.5.d:0 "§YAnother Year, Another War for the Sahel§!\n\nThe violence in the Sahel shows no sign of ending.\n\nMali remains caught between several armed movements with very different goals. Al-Qaeda-linked JNIM continues to conduct attacks against government forces and civilians, while Tuareg and Arab separatist groups continue their struggle for Azawad in the north.\n\nThe Malian military government is fighting on multiple fronts, while Burkina Faso and Niger face similar Islamist insurgencies. The three governments have increasingly relied on their own regional cooperation through the Alliance of Sahel States, including plans for a joint 5,000-person force.\n\nThe conflict is no longer a simple war between two sides. Governments, separatists, Islamist organizations and local armed groups all pursue different objectives, making a single peace agreement extremely difficult.\n\nThe Sahel remains trapped between rebellion, extremism and a struggle for control."
 dve_news.5.a:0 "The war I've never even heard of..."

 dve_news.7.t:0 "4 Years of Hell in Myanmar"
 dve_news.7.d:0 "§YHell Enters Another Year in Myanmar§!\n\nMyanmar enters a fifth year of civil war.\n\nFour years after the military seized power in the coup of 1 February 2021, the junta remains locked in a war it is struggling to win. Resistance forces loyal to the National Unity Government and a patchwork of ethnic armed organizations now control large parts of the borderlands, while the army relies on air strikes and forced conscription to hold its ground.\n\nMore than three million people have been driven from their homes, and nearly twenty million need humanitarian assistance. The elections promised by the military are widely seen as an attempt to legitimize its rule rather than to end the fighting.\n\nWith no side able to win outright and no credible talks in sight, the war shows no sign of ending.\n\nMyanmar remains trapped between military rule and a resistance that refuses to surrender."
 dve_news.7.a:0 "Hell never stops."

 dve_news.11.t:0 "Yemen's Endless Crisis"
 dve_news.11.d:0 "§YYemen's Nightmare Never Ending Resolution§!\n\nYemen remains trapped in a conflict that has lasted for years.\n\nAlthough the intensity of the civil war has fallen from its worst periods, the country remains deeply divided between the internationally recognized government and the Houthi-controlled areas. The fragile calm has not brought an end to the underlying conflict, while the wider Red Sea crisis has drawn Yemen into a much broader regional confrontation.\n\nHouthi attacks against shipping and attacks connected to the wider Middle East conflict have brought international military action closer to Yemen. Meanwhile, civilians continue to face poverty, food insecurity, displacement, damaged infrastructure, and limited access to essential services. In 2025, an estimated §Y19.5 million people§! in Yemen require humanitarian assistance.\n\nYears of war have left Yemen's economy devastated, while efforts to reach a lasting political settlement remain fragile. The conflict may no longer dominate the headlines every day, but for millions of Yemenis, the crisis has never truly ended.\n\nYemen remains caught between a fragile peace and another escalation."
 dve_news.11.a:0 "Hell never stops."

 dve_news.12.t:0 "Tigray Left the Tiger Scarred"
 dve_news.12.d:0 "§YTigray and Ethiopia Maintained the Ceasefire§!\n\nThe peace in Tigray is under pressure.\n\nMore than two years after the Pretoria Agreement ended the major fighting, Ethiopia has avoided a return to the devastating war that tore through Tigray. Yet political divisions within the Tigray People's Liberation Front are threatening to undermine the fragile stability that followed the agreement.\n\nThe African Union has called upon all sides to exercise restraint and uphold the Permanent Cessation of Hostilities. The hard-won peace remains dependent on continued dialogue, cooperation and implementation of the agreement.\n\nA return to war would threaten a region still recovering from years of destruction and displacement.\n\nThe peace has been won. Now it must be protected."
 dve_news.12.a:0 "Well, this was over..."

 dve_news.13.t:0 "New Fight for Somalia"
 dve_news.13.d:0 "§YSomalian Eternal Conflict?§!\n\nSomalia enters 2025 facing an uncertain security future.\n\nAfter years of fighting against Al-Shabaab, Somali forces are taking greater responsibility for the country's security. The African Union's new AUSSOM mission has replaced ATMIS, with its mandate focused on supporting Somali forces and helping degrade Al-Shabaab and affiliated armed groups.\n\nThe transition comes at a difficult time. Al-Shabaab remains capable of carrying out attacks, while Somalia continues to struggle with displacement, poverty, food insecurity and limited access to basic services. Nearly six million people are expected to require humanitarian assistance during 2025.\n\nThe international military presence is changing, but the war is far from over. Somalia's own forces must increasingly carry the burden of defending the country while international partners continue to provide support.\n\nA new year brings a new phase in Somalia's long struggle against instability."
 dve_news.13.a:0 "This war is never over."
