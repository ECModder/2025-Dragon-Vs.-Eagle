 # ---- decisions ----
 ROM_form_roman_empire:0 "Restore the Roman Empire"
 ROM_form_roman_empire_desc:0 "Rome and Greece answer to Bucharest. The descendants of Trajan's colonists can now claim what no Romanian ruler ever dared: the inheritance of the Empire itself."
 ROM_form_ottoman_empire:0 "Restore the Ottoman Empire"
 ROM_form_ottoman_empire_desc:0 "Anatolia, Thrace and the Straits are under Romanian control. The lands once ruled from the Sublime Porte can be governed again from a single capital, only this time it is Bucharest."
 # ---- events ----
 ROM_iohannis.1.t:0 "A Letter from Sibiu"
 ROM_iohannis.1.d:0 "Nobody can say who delivered it. The envelope was found on the desk of the interim president one morning, with no stamp, no return address and the seal of a house in Sibiu that has been shut for months. Inside there is a single sheet of paper and a telephone number.\n\nFor weeks there have been rumours. A car with diplomatic plates seen at Otopeni at night. A former adviser who suddenly cancelled her book tour. A reservation at a quiet restaurant near Cotroceni, booked under a name nobody recognises, for a table that remained empty.\n\nThe letter speaks of an unfinished duty, of a country that should not have to vote three times to find a president, and of someone who once left 'to spare Romania a crisis' and now believes the crisis did not wait for him. It is signed only with an initial.\n\nThe chiefs of staff of the interim government know whose handwriting it is. They also know that answering will change the rerun, and that not answering will leave the rumours to grow on their own."
 ROM_iohannis.1.a:0 "Call the number."
 ROM_iohannis.1.b:0 "Burn the letter. The past should stay in the past."
 ROM_iohannis.2.t:0 "Klaus Iohannis Returns to Cotroceni"
 ROM_iohannis.2.d:0 "Former President Klaus Iohannis, who resigned in February 2025 to avoid a suspension procedure, has won Romania's rerun presidential election and will return to Cotroceni Palace. In a short statement read in Sibiu without questions from the press, he said that Romania 'cannot afford another year without a government that works' and promised to stay only until the institutions are stable again.\n\nThe result has split Bucharest. The Liberals and much of the political centre welcome a familiar name in a time of chaos; the nationalist opposition calls it 'the return of the system'. In Brussels and Washington officials have greeted the news with visible relief, and Romanian bond yields fell within the hour."
 ROM_iohannis.2.a:0 "An old name for a new crisis."
 ROM_iohannis.2.b:0 "Bucharest's elder statesman is back."
 ROM_iohannis.3.t:0 "The Candidate from Sibiu"
 ROM_iohannis.3.d:0 "Klaus Iohannis meets the party leaders one by one at a hotel in Bucharest. He asks for nothing in public: no party, no campaign, no rallies. In private he asks for a lot: a cabinet of technocrats, a free hand with the prosecutors and a promise that the next election will be held on time and without interference.\n\nThe Liberals are ready to put his name forward in Parliament. The others are calculating whether they can afford to say no."
 ROM_iohannis.3.a:0 "His name will be put forward."
 # ---- Iohannis presidency: national spirits ----
 ROM_ioh_absent_president_idea:0 "The Absent President"
 ROM_ioh_absent_president_idea_desc:0 "Romanians still joke about the president who was always abroad and never at a press conference. Until he shows them otherwise, they will assume nothing has changed."
 ROM_ioh_aloof_statesman_idea:0 "The Aloof Statesman"
 ROM_ioh_aloof_statesman_idea_desc:0 "He governs from a distance, through communiqués and decrees. Foreign capitals like it. Romanians respect it, but they do not love him for it."
 ROM_ioh_technocratic_cabinet_idea:0 "Technocratic Cabinet"
 ROM_ioh_technocratic_cabinet_idea_desc:0 "Ministers from the central bank and the universities. Competent, honest and without a single voter of their own."
 ROM_ioh_grand_coalition_idea:0 "The Grand Coalition"
 ROM_ioh_grand_coalition_idea_desc:0 "Liberals and Social Democrats govern together. The majority is large, and so is the bill for keeping everyone happy."
 ROM_ioh_liberal_government_idea:0 "Liberal Minority Government"
 ROM_ioh_liberal_government_idea_desc:0 "A government of one party, a programme of one party and a majority that has to be rebuilt for every vote."
 ROM_ioh_anticorruption_drive_idea:0 "The Anticorruption Drive"
 ROM_ioh_anticorruption_drive_idea_desc:0 "Nobody is protected any more. Investors are pleased; politicians are nervous."
 ROM_ioh_lean_state_idea:0 "A Leaner State"
 ROM_ioh_lean_state_idea_desc:0 "Fewer agencies, fewer state secretaries, fewer jobs for party loyalists."
 ROM_ioh_consolidation_idea:0 "Fiscal Consolidation"
 ROM_ioh_consolidation_idea_desc:0 "The deficit is closing. The cost is paid in frozen wages and higher taxes."
 ROM_ioh_euro_convergence_idea:0 "Euro Convergence"
 ROM_ioh_euro_convergence_idea_desc:0 "Romania is on course to meet the criteria for the single currency, and the markets have noticed."
 ROM_ioh_carpathian_tiger_idea:0 "The Carpathian Tiger"
 ROM_ioh_carpathian_tiger_idea_desc:0 "Fast growth, sound finances and investment spread across the whole country."
 ROM_ioh_eu_core_idea:0 "In the Core of Europe"
 ROM_ioh_eu_core_idea_desc:0 "Romania sits with Berlin and Paris when the Union's decisions are made."
 ROM_ioh_us_partner_idea:0 "America's Black Sea Partner"
 ROM_ioh_us_partner_idea_desc:0 "American instructors, American equipment and American exercises on Romanian soil."
 ROM_ioh_heart_of_europe_idea:0 "Romania at the Heart of Europe"
 ROM_ioh_heart_of_europe_idea_desc:0 "A country its allies rely on, rather than one they worry about."
 ROM_ioh_parliamentary_republic_idea:0 "The Parliamentary Republic"
 ROM_ioh_parliamentary_republic_idea_desc:0 "The presidency has given up its powers. Governments now rise and fall in Parliament."
 ROM_ioh_guardian_regime_idea:0 "The Guardian of the Republic"
 ROM_ioh_guardian_regime_idea_desc:0 "The President stays in office for as long as the emergency lasts, and he decides how long that is."
 # ---- Iohannis presidency: tooltips ----
 ROM_ioh_unlock_tt:0 "§YKlaus Iohannis§! will be on the ballot when we go §YBack to the Ballot Box§!."
 ROM_ioh_wins_tt:0 "Unlocks the §YPresident Klaus Iohannis§! branch."
 ROM_ioh_who_governs_tt:0 "Choose the government: §YTechnocrats§!, a §YGrand Coalition§! or a §YLiberal§! government."
 ROM_ioh_dna_event_tt:0 "A member of the government will soon be §Rinvestigated§!."
 ROM_ioh_constitution_tt:0 "Opens the way to §YThe Parliamentary Republic§! and §YThe Guardian of the Republic§!."
 ROM_ioh_budget_tt:0 "Choose between §YClose the Deficit§! and §YSpend the Recovery Funds§!."
 ROM_ioh_houses_tt:0 "A §Rscandal§! about the President's properties will break."
 ROM_ioh_leave_tt:0 "The next presidential election will be held §Gon time§!."
 ROM_ioh_protests_tt:0 "§RThe streets will not accept this quietly.§!"
 ROM_ioh_successor_tt:0 "We will choose who carries on the Iohannis presidency."
 ROM_ioh_second_chance_guardian_tt:0 "The President §Rremains in office§!."
 # ---- Iohannis presidency: events ----
 ROM_iohannis.4.d:0 "Klaus Iohannis wins the presidency."
 ROM_iohannis.5.t:0 "A Minister in Handcuffs"
 ROM_iohannis.5.d:0 "At six in the morning, DNA prosecutors arrived at the home of one of the government's own ministers. By noon the images were on every channel: the minister led to a car, a jacket over his hands. The coalition partners are furious and want the President to say that the investigation has gone too far.\n\nIohannis promised that nobody would be protected. Now everyone is waiting to see whether he meant it."
 ROM_iohannis.5.a:0 "The law applies to everyone."
 ROM_iohannis.5.b:0 "Perhaps a word with the Prosecutor General."
 ROM_iohannis.6.t:0 "The Houses of Sibiu"
 ROM_iohannis.6.d:0 "The story never really went away. In 2015 the courts took back one of the Iohannis family's houses in Sibiu, ruling that it had been obtained with forged documents. Now an opposition newspaper has published new papers about the family's other properties, and the hashtag is trending.\n\nThe President's advisers are divided. Some want him to give the houses away and apologise on television. Others want him to fight every word in court. A few think the best defence is to remind voters who is printing the story, and why."
 ROM_iohannis.6.a:0 "Give the houses back and apologise."
 ROM_iohannis.6.b:0 "We will see them in court."
 ROM_iohannis.6.c:0 "This is the opposition's last trick."
 ROM_iohannis.7.t:0 "The Succession"
 ROM_iohannis.7.d:0 "The election date is set and the President will not stand. Ilie Bolojan, who held Cotroceni during the interim, is the obvious heir. The party wants to choose for itself, and a group of former technocratic ministers has proposed a candidate from outside politics altogether.\n\nWhoever Iohannis backs will start the campaign as the favourite."
 ROM_iohannis.7.a:0 "Ilie Bolojan finishes what we started."
 ROM_iohannis.7.b:0 "The party will choose."
 ROM_iohannis.7.c:0 "Someone from outside politics."
 ROM_iohannis.8.t:0 "Protests in Piata Victoriei"
 ROM_iohannis.8.d:0 "Tens of thousands have filled Piata Victoriei in front of the government building, as they did in 2017 and in 2018, with phone lights, flags and a single word on their banners: 'Rezist'. This time they are protesting against the President who once joined them.\n\nThe Gendarmerie is ready. So are the cameras."
 ROM_iohannis.8.a:0 "Promise a referendum on the emergency."
 ROM_iohannis.8.b:0 "Clear the square."
 ROM_formable.1.t:0 "Romania Proclaims the Restoration of Dacia"
 ROM_formable.1.d:0 "At a ceremony among the ruins of Sarmizegetusa Regia, the ancient capital of the Dacian kings, the government in Bucharest has proclaimed the restoration of Dacia, uniting under one state all the lands from the Tisza to the Black Sea. The wolf-headed draco has been raised beside the Romanian tricolour.\n\nNeighbouring capitals have reacted with alarm and protest notes. Historians point out that ancient Dacia never had borders anyone could draw with certainty; the new state has drawn them anyway."
 ROM_formable.1.a:0 "Dacia lives again."
 ROM_formable.1.b:0 "A two-thousand-year-old kingdom returns to the map."
 ROM_formable.2.t:0 "Bucharest Proclaims a New Roman Empire"
 ROM_formable.2.d:0 "In a ceremony broadcast from the Palace of the Parliament, the Romanian government has proclaimed the restoration of the Roman Empire, claiming the inheritance of both Rome and Constantinople. Legionary standards were carried through the streets of Bucharest, and the new state's eagle now flies over Rome and Athens.\n\nThe proclamation has stunned the world. Governments from Paris to Ankara have called emergency sessions of their security councils, and the word 'empire' is back in the headlines for the first time in a century."
 ROM_formable.2.a:0 "Imperium Romanum restitutum est."
 ROM_formable.2.b:0 "Rome rises again, in Bucharest."
 ROM_formable.3.t:0 "Romania Claims the Legacy of the Porte"
 ROM_formable.3.d:0 "In a move few believed possible, the government in Bucharest has proclaimed itself the successor of the Ottoman state and announced that the lands of Anatolia, Thrace and the Straits will be governed as a commonwealth of peoples and faiths. For the first time since 1922 the Black Sea is ruled from a single capital.\n\nIn the conquered provinces the proclamation has been met with protests and strikes; abroad, diplomats are trying to understand how the former vassal became the heir of its old masters."
 ROM_formable.3.a:0 "The Black Sea is ours."
 ROM_formable.3.b:0 "The Sublime Porte moves to Bucharest."
