l_english:
 # DvE rework (armed-forces spirits, military branches, formables, Iohannis storyline)
 # ---- focuses (new) ----
 ROM_dacia_path_1:0 "Heirs of Burebista"
 ROM_dacia_path_1_desc:0 "Before Rome, before the voivodes, there was Dacia: one kingdom from the Tisza to the Black Sea under Burebista and Decebalus. The idea that Romanians are their heirs is two centuries old. We will make it the programme of the state."
 ROM_dacia_path_2:0 "Sarmizegetusa Restored"
 ROM_dacia_path_2_desc:0 "The ruined capital of the Dacian kings in the Orastie Mountains becomes a national monument, a pilgrimage site and the backdrop of every state ceremony. Romanians are told where they come from."
 ROM_dacia_path_3:0 "The Wolf Standard"
 ROM_dacia_path_3_desc:0 "The draco, the wolf-headed war standard of the Dacians, is carried again at the head of the army. Volunteers come in their thousands, and so does the suspicion of every neighbour."
 ROM_dacia_path_4:0 "One People, One Land"
 ROM_dacia_path_4_desc:0 "Moldovans, Vlachs of the Timok, Romanians of Bukovina and Maramures: one people divided by borders drawn by empires. A single integration plan prepares the administration, schools and courts for the day those borders disappear."
 ROM_dacia_path_5:0 "The Dacian Awakening"
 ROM_dacia_path_5_desc:0 "Dacia is no longer a museum and a schoolbook. It is a national movement with a flag, a capital and a plan, and the government is at its head."
 ROM_roman_path_1:0 "Heirs of Trajan"
 ROM_roman_path_1_desc:0 "Romania is the only nation east of the Adriatic that still carries Rome in its name and its language. If anyone may claim the inheritance of the Empire, it is the descendants of Trajan's colonists."
 ROM_roman_path_2:0 "The Legions Reborn"
 ROM_roman_path_2_desc:0 "The army is reorganised in legions, cohorts and centuries, at least on paper and on the parade ground. Recruiting offices have never been busier."
 ROM_roman_path_3:0 "The Eastern Claim"
 ROM_roman_path_3_desc:0 "Rome did not fall in 476; it fell in 1453, at Constantinople. Bucharest presents itself as the heir of both Romes, and its diplomats are suddenly very busy explaining that it is only history."
 ROM_roman_path_4:0 "All Roads Lead to Bucharest"
 ROM_roman_path_4_desc:0 "New highways named Via Traiana and Via Egnatia, and a programme to link Bucharest with every capital of the old Empire. Neighbours read the maps very carefully."
 ROM_roman_path_5:0 "Imperium Restitutum"
 ROM_roman_path_5_desc:0 "The eagle returns to the flags of the army and SPQR to the facade of the Senate. Romania no longer speaks of Rome as its past. It speaks of Rome as its future."
 ROM_ottoman_path_1:0 "The Phanariot Legacy"
 ROM_ottoman_path_1_desc:0 "For three centuries Wallachia and Moldavia were ruled from Constantinople, often by Greek princes of the Phanar who were Ottoman officials and Romanian rulers at once. A strange inheritance, but an inheritance: the Sublime Porte's claim to rule the lands around the Black Sea."
 ROM_ottoman_path_2:0 "Masters of the Straits"
 ROM_ottoman_path_2_desc:0 "Whoever held the Bosporus held the Empire. The fleet at Constanta is told to plan for the day the Straits are Romanian waters."
 ROM_ottoman_path_3:0 "The Millet Compact"
 ROM_ottoman_path_3_desc:0 "The Ottoman state let every faith govern itself under the Sultan's protection. A new compact promises Hungarians, Turks, Tatars and Bulgarians under Romanian rule their own schools, courts and councils, as long as they stay loyal."
 ROM_ottoman_path_4:0 "Caravans of the Black Sea"
 ROM_ottoman_path_4_desc:0 "Pipelines, ferries and free ports from Constanta to Trabzon. The trade routes the Porte once controlled are rebuilt, and they run through Romanian ports."
 ROM_ottoman_path_5:0 "The Sublime State"
 ROM_ottoman_path_5_desc:0 "The government speaks of a Black Sea commonwealth of peoples and faiths, governed from Bucharest as it was once governed from Constantinople. Not everyone at home is happy to be told that the Sultan had a point."
 # ---- Klaus Iohannis presidency ----
 ROM_ioh_victory:0 "President Klaus Iohannis"
 ROM_ioh_victory_desc:0 "The man who left Cotroceni in February 2025 to spare the country a suspension has won the rerun and come back to finish what he started. The parties that forced him out now depend on him, and his opponents call it the return of the system. Whatever he does next, nobody can say he does not know the job."
 ROM_ioh_who_governs:0 "Who Governs Romania?"
 ROM_ioh_who_governs_desc:0 "A president needs a government, and Parliament is divided. Iohannis can ask experts to run the ministries, bring the Social Democrats into a grand coalition or trust the Liberals to govern alone. Each choice decides who will owe him, and who will try to bring him down."
 ROM_ioh_face_the_press:0 "Face the Press"
 ROM_ioh_face_the_press_desc:0 "For ten years he was the president who never gave interviews, never explained himself and was always on a plane. This time he holds a press conference every month and answers every question, including the unpleasant ones."
 ROM_ioh_above_the_fray:0 "Above the Fray"
 ROM_ioh_above_the_fray_desc:0 "A president does not argue with talk-show hosts. Iohannis governs as he always did: by decree, by communiqué and by the occasional televised address. It is efficient, and it makes him look like a man who does not need anyone."
 ROM_ioh_technocrats:0 "A Cabinet of Technocrats"
 ROM_ioh_technocrats_desc:0 "No party leaders, no county barons: ministers chosen from the central bank, the universities and the European institutions. The parties will vote for it because the alternative is another election."
 ROM_ioh_grand_coalition:0 "The Grand Coalition"
 ROM_ioh_grand_coalition_desc:0 "PNL and PSD have governed together before, and both have been punished for it. A grand coalition gives the President a large majority and a cabinet full of ministers who expect to be rewarded."
 ROM_ioh_liberal_government:0 "A Liberal Government"
 ROM_ioh_liberal_government_desc:0 "The National Liberal Party brought him back and the National Liberal Party will govern. It does not have a majority, so every vote will have to be won in the corridors of Parliament."
 ROM_ioh_rule_of_law:0 "The Rule of Law, Again"
 ROM_ioh_rule_of_law_desc:0 "The fight against corruption was the cause of his first two mandates. The prosecutors get their budget, their independence and their president back."
 ROM_ioh_unleash_the_dna:0 "Unleash the DNA"
 ROM_ioh_unleash_the_dna_desc:0 "The National Anticorruption Directorate is told that nobody is protected: not the county barons, not the ministers and not the President's own party. Some of the government's allies will end up in court."
 ROM_ioh_quiet_reform:0 "Reform Without Scandal"
 ROM_ioh_quiet_reform_desc:0 "Handcuffs on television win elections and lose coalitions. The government changes the procurement rules, the asset declarations and the appointment of magistrates instead, quietly, one law at a time."
 ROM_ioh_open_the_files:0 "Open the Last Files"
 ROM_ioh_open_the_files_desc:0 "Thirty-five years after the revolution, part of the Securitate archive is still classified. The President orders the remaining files transferred to the CNSAS. Some respected names will not survive the reading."
 ROM_ioh_magistrates:0 "Independent Magistrates"
 ROM_ioh_magistrates_desc:0 "Judges appointed by judges, prosecutors appointed by open competition, and a Superior Council of Magistracy that answers to the law and not to the government of the day."
 ROM_ioh_slim_the_state:0 "Merge the Agencies"
 ROM_ioh_slim_the_state_desc:0 "Romania has more state agencies than anyone can list. Merging them saves money and removes hundreds of comfortable jobs from the parties' patronage lists, which is exactly why it has never been done."
 ROM_ioh_special_pensions:0 "End the Special Pensions"
 ROM_ioh_special_pensions_desc:0 "Magistrates, officers and former MPs retire earlier and on higher pensions than anyone else. Every government promised to end it; every government lost the vote. The President puts his own name on the bill."
 ROM_ioh_constitutional_review:0 "The Constitutional Commission"
 ROM_ioh_constitutional_review_desc:0 "Two annulled elections and a suspended president have shown how fragile the 2003 constitution is. A commission of jurists is asked to rewrite the chapters on the presidency, the Parliament and the courts. What it proposes will decide how the Iohannis years end."
 ROM_ioh_honest_budget:0 "A Budget Brussels Will Believe"
 ROM_ioh_honest_budget_desc:0 "For years Romania sent the Commission budgets that nobody expected it to respect. This one comes with real numbers, real cuts and a real plan. The question is whether to close the deficit first or to spend the European money first."
 ROM_ioh_consolidation:0 "Close the Deficit"
 ROM_ioh_consolidation_desc:0 "Higher taxes, frozen wages and a hiring stop. The rating agencies will be pleased; the voters will not."
 ROM_ioh_recovery_funds:0 "Spend the Recovery Funds"
 ROM_ioh_recovery_funds_desc:0 "Billions from the Recovery and Resilience Facility are still unspent. Spend them now, on factories and roads, and worry about the deficit when the economy has grown out of it. Not every contract will be clean."
 ROM_ioh_maastricht:0 "The Maastricht Criteria"
 ROM_ioh_maastricht_desc:0 "Inflation, deficit, debt, interest rates, exchange rate: five numbers stand between Romania and the euro. With the deficit under control, the National Bank can finally publish a date."
 ROM_ioh_sibiu_model:0 "The Sibiu Model"
 ROM_ioh_sibiu_model_desc:0 "As mayor of Sibiu, Iohannis brought German factories to Transylvania with German-speaking officials, fast permits and honest tenders. The President wants the whole country to work like his old city."
 ROM_ioh_motorway_contracts:0 "Unblock the Motorways"
 ROM_ioh_motorway_contracts_desc:0 "Contracts signed, cancelled, challenged and signed again: Romania has fewer kilometres of motorway than countries half its size. The recovery money pays for the missing sections, and the courts are told to hear the challenges in weeks, not years."
 ROM_ioh_brua_pipeline:0 "The BRUA Pipeline"
 ROM_ioh_brua_pipeline_desc:0 "Bulgaria, Romania, Hungary, Austria: a gas corridor that would carry Black Sea gas into Central Europe. Finishing it turns Romania from a customer of Gazprom into a supplier of its neighbours."
 ROM_ioh_saxon_engineers:0 "Engineers of Transylvania"
 ROM_ioh_saxon_engineers_desc:0 "German car makers already build in Transylvania; now their research centres follow. Engineering faculties in Cluj, Brasov and Sibiu get laboratories paid for by the companies that will hire their graduates."
 ROM_ioh_carpathian_tiger:0 "The Carpathian Tiger"
 ROM_ioh_carpathian_tiger_desc:0 "Growth above four percent, a deficit inside the rules and investment that no longer stops at Bucharest and Cluj. The newspapers that called him the absent president now call Romania the tiger of the Carpathians."
 ROM_ioh_european_anchor:0 "The European Anchor"
 ROM_ioh_european_anchor_desc:0 "Brussels, Berlin and Washington know him. Recovery funds frozen during the crisis are released, and Romania's allies stop asking who is in charge in Bucharest."
 ROM_ioh_berlin_connection:0 "The Berlin Connection"
 ROM_ioh_berlin_connection_desc:0 "A German-speaking president from the Transylvanian Saxon minority has friends in Berlin that no other Romanian politician has. Romania will move into the core of the Union, beside Germany and France."
 ROM_ioh_washington_line:0 "Washington's Black Sea Partner"
 ROM_ioh_washington_line_desc:0 "Europe talks; America deploys. The President bets on the alliance that put a missile defence site at Deveselu and soldiers at Mihail Kogalniceanu."
 ROM_ioh_moldova_path:0 "Moldova's European Road"
 ROM_ioh_moldova_path_desc:0 "Union can wait; membership cannot. Bucharest becomes Chisinau's advocate in every European capital, and its electricity, its gas and its motorways cross the Prut first."
 ROM_ioh_bucharest_nine:0 "Lead the Bucharest Nine"
 ROM_ioh_bucharest_nine_desc:0 "Iohannis founded the Bucharest Nine with Poland in 2015: the eastern flank of NATO speaking with one voice. With war across the border, the group needs a leader again."
 ROM_ioh_strategic_partnership:0 "The Strategic Partnership, Renewed"
 ROM_ioh_strategic_partnership_desc:0 "A new defence agreement with the United States: American equipment, joint exercises and a share of the production on Romanian soil."
 ROM_ioh_arm_ukraine:0 "Arm Ukraine"
 ROM_ioh_arm_ukraine_desc:0 "Romania has sent Ukraine more than it ever announced. Now it says so, and sends more, from ammunition to air defence. Moscow's warnings are louder than ever."
 ROM_ioh_grain_corridor:0 "The Grain Corridor"
 ROM_ioh_grain_corridor_desc:0 "The most useful help Romania can give is not weapons but ports. Constanta and the Danube become Ukraine's lifeline to the world's markets, and Romanian farmers are compensated for the competition."
 ROM_ioh_heart_of_europe:0 "Romania at the Heart of Europe"
 ROM_ioh_heart_of_europe_desc:0 "For the first time Romania is not the country Europe worries about but one of the countries Europe relies on. Its President is invited to every summit, and he actually attends."
 ROM_ioh_houses_of_sibiu:0 "The Houses of Sibiu"
 ROM_ioh_houses_of_sibiu_desc:0 "Every Romanian remembers the house in Sibiu that the courts took back from the Iohannis family in 2015. The opposition has found a new document, and the story is on every front page again. The President's reply will be remembered longer than any of his reforms."
 ROM_ioh_leave_on_time:0 "Leave for the Last Time"
 ROM_ioh_leave_on_time_desc:0 "He came back to hold an election that would stand. He will leave when it is held, on time, without emergency decrees and without changing the rules. The man who resigned once to spare the country a crisis will resign once more to show there is none."
 ROM_ioh_parliamentary_republic:0 "The Parliamentary Republic"
 ROM_ioh_parliamentary_republic_desc:0 "The Commission's boldest proposal: a president elected by Parliament, with no veto and no power to dissolve it. Iohannis would be the last president with real power, and he would be the one who gave it away."
 ROM_ioh_guardian_of_the_republic:0 "The Guardian of the Republic"
 ROM_ioh_guardian_of_the_republic_desc:0 "War next door, sabotage at home and a Parliament that cannot agree on anything. The President's advisers argue that the country needs him for longer than the constitution allows, and that the constitution can be read differently."
 ROM_ioh_name_a_successor:0 "Name a Successor"
 ROM_ioh_name_a_successor_desc:0 "A presidency that ends well needs someone to carry it on. Iohannis has to decide whether to back a candidate, and whom."
 ROM_ioh_institutions_that_work:0 "Institutions That Work"
 ROM_ioh_institutions_that_work_desc:0 "Ministers answer to Parliament, Parliament answers to the voters and the courts answer to nobody but the law. It is less exciting than a strong president. It is also much harder to break."
 ROM_ioh_the_long_presidency:0 "The Long Presidency"
 ROM_ioh_the_long_presidency_desc:0 "Elections are postponed 'until the security situation allows'. Nobody has said when that will be."
 ROM_ioh_second_chance:0 "A Second Chance for Romania"
 ROM_ioh_second_chance_desc:0 "The interim years are over. Whether Iohannis leaves the presidency, gives its powers to Parliament or keeps them for himself, the country he leads is no longer the one that could not find a president in 2025."
 ROM_upr_army_depot_inventory:0 "Count Every Rifle"
 ROM_upr_army_depot_inventory_desc:0 "Nobody knows what is left in the depots after the looting of the revolution. A full inventory, county by county, finds more than anyone expected, and some of it is even usable."
 ROM_upr_army_nco_academy:0 "The Sergeants of Sibiu"
 ROM_upr_army_nco_academy_desc:0 "Armies are run by their sergeants. A new academy for non-commissioned officers at Sibiu turns the best of the revolution's volunteers into the backbone of the new army."
 ROM_upr_army_rail_mobilisation:0 "Mobilisation by Rail"
 ROM_upr_army_rail_mobilisation_desc:0 "Romanian railways can move a brigade across the country in two days, if the trains are ready and the timetables are written in advance. The army takes over the rail plans."
 ROM_upr_army_artillery_park:0 "The Artillery Park"
 ROM_upr_army_artillery_park_desc:0 "The LAROM launchers and towed guns scattered across a dozen garrisons are concentrated in a single artillery park, under one command and on one railway line."
 ROM_upr_air_ground_crews:0 "Bring Back the Ground Crews"
 ROM_upr_air_ground_crews_desc:0 "Mechanics, armourers and air traffic controllers walked off the bases during the revolution. Bringing them back is less glamorous than buying jets, and more urgent."
 ROM_upr_air_helicopter_lift:0 "Helicopters over the Carpathians"
 ROM_upr_air_helicopter_lift_desc:0 "The Puma and H215 helicopters built at Brasov become the army's lifeline in the mountains, where no road can be trusted."
 ROM_upr_air_dispersed_airstrips:0 "Dispersed Airstrips"
 ROM_upr_air_dispersed_airstrips_desc:0 "Highways, farm strips and forest clearings that a squadron can use for a week. An air force that cannot be found on the ground cannot be destroyed there."
 ROM_upr_navy_port_security:0 "Guard the Harbours"
 ROM_upr_navy_port_security_desc:0 "Divers, patrol boats and harbour booms at Constanta and Mangalia. Sabotage is the cheapest way to sink a navy."
 ROM_upr_navy_harbour_defence:0 "Fortress Constanta"
 ROM_upr_navy_harbour_defence_desc:0 "Old coastal guns, new missiles and the mines in between turn Constanta into a harbour no raider wants to approach."
 ROM_upr_navy_river_monitors:0 "Monitors of the Danube"
 ROM_upr_navy_river_monitors_desc:0 "The old river monitors are rebuilt with modern guns and missiles. On the Danube, a gunboat is still a battleship."
 ROM_upr_eco_customs_crackdown:0 "Close the Smuggling Routes"
 ROM_upr_eco_customs_crackdown_desc:0 "Smuggled fuel, cigarettes and timber cross every border the revolution left unguarded. Customs officers backed by the gendarmerie take the money back, and make enemies doing it."
 ROM_upr_eco_fuel_reserves:0 "Strategic Fuel Reserves"
 ROM_upr_eco_fuel_reserves_desc:0 "Strategic fuel tanks at Constanta and Ploiesti, filled while the refineries run, empty only by order of the government."
 ROM_dracula_army_1:0 "The Voivode's Muster"
 ROM_dracula_army_1_desc:0 "Every regiment parades before him at midnight on the plain of Targoviste. He walks the ranks without a word, stops before a few officers, and looks at them for a long time. The next morning those officers have resigned."
 ROM_dracula_army_2:0 "The Boyars' Levy"
 ROM_dracula_army_2_desc:0 "In his first reign every boyar owed the Voivode men in proportion to his land. The new boyars, mayors and county barons, are reminded of the old debt, and the villages fill the barracks."
 ROM_dracula_army_3:0 "The Gunsmiths of Brasov"
 ROM_dracula_army_3_desc:0 "The Saxon merchants of Brasov once sold him powder and paid for it later with their lives. Their heirs run the arms plants of Transylvania, and they have read their history."
 ROM_dracula_army_4:0 "A Forest of Stakes"
 ROM_dracula_army_4_desc:0 "In 1462 the Sultan turned back at the sight of twenty thousand impaled prisoners outside Targoviste. The engineers build a modern version on the eastern border: minefields, obstacle belts and something else, which the newspapers are not allowed to photograph."
 ROM_dracula_army_5:0 "The Night Attack"
 ROM_dracula_army_5_desc:0 "He once rode into the Ottoman camp at night to kill the Sultan in his tent. Every Romanian brigade now trains to fight in darkness, and some of them seem to prefer it."
 ROM_dracula_army_6:0 "The Iron Wolves"
 ROM_dracula_army_6_desc:0 "The tank brigade at Bucharest is renamed after the wolves of the Carpathians and given the newest vehicles the factories can build. Its crews paint the wolf's head on every turret."
 ROM_dracula_army_7:0 "Rule by Terror"
 ROM_dracula_army_7_desc:0 "Deserters are hanged at the barracks gate and cowards are named in the newspapers. Nobody in the army will ever again hesitate to obey, because everybody has seen what happens to those who do."
 ROM_dracula_army_8:0 "The Order of the Dragon"
 ROM_dracula_army_8_desc:0 "His father was a knight of the Order of the Dragon, and the name Dracula means the dragon's son. The Order is reborn as a military brotherhood for the officer corps: oaths, rings, and promotion only for its members."
 ROM_dracula_army_9:0 "The Carpathian Fastnesses"
 ROM_dracula_army_9_desc:0 "Poenari, Rasnov, Rucar, the old fortresses of the passes, become the hinges of a mountain defence. Their tunnels are older than anyone admits, and the army is told not to go below the third level."
 ROM_dracula_army_10:0 "Riders of the Night"
 ROM_dracula_army_10_desc:0 "Light mechanised raiding groups that strike across the border at night and are back before dawn, in the tradition of the Wallachian light horse."
 ROM_dracula_army_11:0 "An Army That Never Sleeps"
 ROM_dracula_army_11_desc:0 "The Romanian army marches, trains and fights by night as easily as by day. Its soldiers sleep little and fear nothing except their own Voivode, which is exactly what he intended."
 ROM_dracula_air_1:0 "Wings of the Dragon"
 ROM_dracula_air_1_desc:0 "The Voivode has never seen an aircraft before this year. He watches the F-16s take off from Borcea, asks how high they can fly and how far, and then asks whether they can fly without lights."
 ROM_dracula_air_2:0 "The Silent Hangars"
 ROM_dracula_air_2_desc:0 "Hangars cut into the Carpathian rock, invisible from orbit, built by crews who are flown in blindfolded. Nobody outside the air staff knows how many there are."
 ROM_dracula_air_3:0 "Aerostar in the Dark"
 ROM_dracula_air_3_desc:0 "The Aerostar plant at Bacau works three shifts, and the night shift works under contracts nobody has seen. Its output is not reported to anyone outside Snagov."
 ROM_dracula_air_4:0 "Pilots Who Do Not Blink"
 ROM_dracula_air_4_desc:0 "The pilots who volunteer for the new night squadrons undergo a treatment at Laboratory Nine. Afterwards they see in the dark, never seem tired, and avoid mirrors."
 ROM_dracula_air_5:0 "Bats over Snagov"
 ROM_dracula_air_5_desc:0 "Swarms of small black drones, launched at dusk from the lake shore, fly patterns no air traffic controller can explain. The villagers of Snagov call them the bats, and stay indoors."
 ROM_dracula_air_6:0 "Watchtowers of the Old Fortresses"
 ROM_dracula_air_6_desc:0 "Radars on the citadel towers of Transylvania, where the Voivode's sentries once watched for Ottoman raiders. The view has not changed much."
 ROM_dracula_air_7:0 "Hunters of the Night Sky"
 ROM_dracula_air_7_desc:0 "The air force will defend the Voivode's sky above all. Interceptors patrol at night, and any aircraft that crosses the border without permission does not cross back."
 ROM_dracula_air_8:0 "Wings of Terror"
 ROM_dracula_air_8_desc:0 "The air force will be a weapon of fear: low-level night raids on columns, depots and command posts, so the enemy never knows when the sky will open."
 ROM_dracula_air_9:0 "The Red Sky over Wallachia"
 ROM_dracula_air_9_desc:0 "Anti-aircraft batteries ring Bucharest and the coast. On clear nights their searchlights paint the clouds red, and the capital is told to take it as a reassurance."
 ROM_dracula_air_10:0 "Fire from the Clouds"
 ROM_dracula_air_10_desc:0 "The IAR-99 trainers are fitted with rockets and night sights and sent to the ground-attack squadrons. Cheap, slow and frightening."
 ROM_dracula_air_11:0 "Dominion of the Night Sky"
 ROM_dracula_air_11_desc:0 "From the Tisza to the Black Sea, the night sky belongs to the Voivode. His pilots no longer file flight plans, and his neighbours have stopped asking for them."
 ROM_dracula_navy_1:0 "Chilia Remembered"
 ROM_dracula_navy_1_desc:0 "Chilia, the fortress at the mouth of the Danube, was the key to his first reign, and he lost it. He visits Constanta, asks to see the fleet, and is silent for a long time."
 ROM_dracula_navy_2:0 "The Danube Raiders"
 ROM_dracula_navy_2_desc:0 "In 1462 he crossed the frozen Danube and burned every Ottoman fort from Vidin to the sea. The river flotilla is given fast boats, assault troops and a copy of his campaign letter."
 ROM_dracula_navy_3:0 "Hulls from Mangalia"
 ROM_dracula_navy_3_desc:0 "The Mangalia yard is placed under military administration. Its workers are paid double, and none of them leave."
 ROM_dracula_navy_4:0 "Monitors of the Iron Gates"
 ROM_dracula_navy_4_desc:0 "The Danube narrows between the cliffs of the Iron Gates. Armoured river monitors and hidden batteries make the gorge a door the Voivode can close."
 ROM_dracula_navy_5:0 "The Iron Teeth of Constanta"
 ROM_dracula_navy_5_desc:0 "Missile batteries, minefields and coastal guns turn the approaches to Constanta into a killing ground. The fishermen are told which lanes to use and are no longer allowed out at night."
 ROM_dracula_navy_6:0 "Black Sea Wolves"
 ROM_dracula_navy_6_desc:0 "Fast missile boats with no names, only numbers, and crews chosen for their loyalty. They hunt in packs."
 ROM_dracula_navy_7:0 "The Drowned Fleet"
 ROM_dracula_navy_7_desc:0 "The navy will fight from below: submarines, mines and unmanned craft that wait on the sea bed for weeks. A fleet that is never seen is never sunk."
 ROM_dracula_navy_8:0 "The Dragon's Galleys"
 ROM_dracula_navy_8_desc:0 "The navy will fight on the surface, fast and in the open: raiding groups of corvettes and missile boats that strike and vanish into the night, like the Wallachian galleys of old."
 ROM_dracula_navy_9:0 "Mines in the Dark Water"
 ROM_dracula_navy_9_desc:0 "A belt of smart mines from the Danube delta to Cape Kaliakra. Only the Voivode's captains hold the charts."
 ROM_dracula_navy_10:0 "Raiders of the Sea Lanes"
 ROM_dracula_navy_10_desc:0 "The raiding groups train to cut an enemy's sea lanes in a single night. Insurers in London quietly raise their premiums for the Black Sea."
 ROM_dracula_navy_11:0 "Lord of the Black Sea"
 ROM_dracula_navy_11_desc:0 "Five centuries after he lost Chilia, the Voivode's ships command the western Black Sea. He orders a new fortress built at the mouth of the Danube, on the old foundations."
 # ---- national spirits ----
 ROM_army_spirit:0 "A Force in Transition"
 ROM_army_spirit_desc:0 "The Romanian Land Forces are an army halfway between two worlds. The mechanised brigades train to NATO standards with American, French and Polish allies and are getting new Piranha V vehicles, but most of the armour is still the TR-85M1, an upgraded descendant of a 1980s design, and the artillery is largely towed Soviet-pattern guns. Conscription ended in 2007, recruitment falls short every year, and the reserve exists mostly on paper."
 ROM_army_spirit_2:0 "A Reforming Army"
 ROM_army_spirit_2_desc:0 "The reform has chosen its direction. New equipment is arriving, training is longer and harder, and the old Warsaw Pact habits are finally being trained out of the officer corps. The army is not there yet, but it knows where it is going."
 ROM_army_spirit_nato:0 "NATO's South-Eastern Bastion"
 ROM_army_spirit_nato_desc:0 "A mechanised, networked and well-trained army, fully integrated with the allied brigades on Romanian soil. It is still small for the frontier it guards, but no one doubts any more that it would fight, and fight well."
 ROM_army_spirit_uprise:0 "Army of the Second Revolution"
 ROM_army_spirit_uprise_desc:0 "Purged, rebuilt and loyal to the new order, the army that came out of the revolution is aggressive and quick to mobilise. Its logistics never fully recovered from the purges."
 ROM_army_spirit_dracula:0 "The Voivode's Army"
 ROM_army_spirit_dracula_desc:0 "The army fights at night, does not retreat and fears only its own commander. Cohesion comes from terror, not trust, and officers who ask questions are no longer seen."
 ROM_air_spirit:0 "Falcons over the Black Sea"
 ROM_air_spirit_desc:0 "Romania flies some thirty F-16s, bought second-hand from Portugal and Norway and integrated into NATO air policing on the eastern flank. The F-16 school at Fetesti is training a new generation of pilots, but the force is small, the MiG-21 LanceR years left a legacy of worn airframes and accidents, and since the IAR-93 the air force has had no dedicated attack aircraft."
 ROM_air_spirit_2:0 "A Growing Air Force"
 ROM_air_spirit_2_desc:0 "More pilots, more flying hours and a clear doctrine. The accident rate is falling and the squadrons are slowly growing."
 ROM_air_spirit_nato:0 "Guardians of the Eastern Sky"
 ROM_air_spirit_nato_desc:0 "F-35s, F-16s and an integrated air defence, all plugged into NATO's air picture. Romania's air force can now hold its own sky, as long as the allied tankers and AWACS keep flying."
 ROM_air_spirit_uprise:0 "Wings of the New Romania"
 ROM_air_spirit_uprise_desc:0 "An air force rebuilt for the new government's priorities: close support for the army first. Western spare parts are no longer guaranteed."
 ROM_air_spirit_dracula:0 "Lords of the Night Sky"
 ROM_air_spirit_dracula_desc:0 "The Voivode's squadrons fly at night and strike without warning. Cut off from NATO's data links, they are blind by day and deadly by night."
 ROM_navy_spirit:0 "A Coast Guard with Frigates"
 ROM_navy_spirit_desc:0 "The Romanian Navy is two Type 22 frigates bought from the Royal Navy, one Romanian-built destroyer from 1985, two Tetal II corvettes and three Tarantul missile boats, all based at Constanta. Since 2022 its crews have become experts at clearing drifting mines, but the fleet cannot operate far from its own coast."
 ROM_navy_spirit_2:0 "A Navy Being Rebuilt"
 ROM_navy_spirit_2_desc:0 "New ships are on the slipways and the crews spend more time at sea. The navy is still a Black Sea navy, but a better one."
 ROM_navy_spirit_nato:0 "Sentinel of the Western Black Sea"
 ROM_navy_spirit_nato_desc:0 "Modern frigates, corvettes, submarines and coastal missiles under one command. The Romanian Navy now guards the western Black Sea for the whole alliance."
 ROM_navy_spirit_uprise:0 "The Revolution's Fleet"
 ROM_navy_spirit_uprise_desc:0 "Small, fast and aggressive, built for mines and missile boats close to home rather than voyages beyond the Straits."
 ROM_navy_spirit_dracula:0 "The Drowned Dragon"
 ROM_navy_spirit_dracula_desc:0 "Submarines, mines and raiders that strike from the dark water and vanish. The fleet is feared, but it does not stray far from the Romanian coast."
 ROM_procurement_burden_idea:0 "Procurement Burden"
 ROM_procurement_burden_idea_desc:0 "A large arms contract is being paid for, and civilian industry is feeling it."
 ROM_dracula_fastnesses_idea:0 "The Carpathian Fastnesses"
 ROM_dracula_fastnesses_idea_desc:0 "The old fortresses of the passes are the hinges of the mountain defence."
 ROM_dracula_night_hunters_idea:0 "Hunters of the Night Sky"
 ROM_dracula_night_hunters_idea_desc:0 "Interceptors that patrol at night and do not miss."
 ROM_dracula_wings_of_terror_idea:0 "Wings of Terror"
 ROM_dracula_wings_of_terror_idea_desc:0 "Low-level night raids that leave the enemy never knowing when the sky will open."
 ROM_dracula_danube_raiders_idea:0 "The Danube Raiders"
 ROM_dracula_danube_raiders_idea_desc:0 "Fast boats and assault troops on the river, in the tradition of the 1462 winter campaign."
 ROM_dracula_drowned_fleet_idea:0 "The Drowned Fleet"
 ROM_dracula_drowned_fleet_idea_desc:0 "A navy that fights from below and is never seen."
 ROM_dracula_dragon_galleys_idea:0 "The Dragon's Galleys"
 ROM_dracula_dragon_galleys_idea_desc:0 "Raiding groups of corvettes and missile boats that strike and vanish into the night."
 ROM_iohannis_restoration_idea:0 "The President Returns"
 ROM_iohannis_restoration_idea_desc:0 "Klaus Iohannis is back at Cotroceni. The institutions trust him, foreign capitals know him and the parties need him. The public is less sure: many still remember why he left, and nobody wants to fight for a caretaker."
 ROM_ioh_european_anchor_idea:0 "The European Anchor"
 ROM_ioh_european_anchor_idea_desc:0 "Frozen funds released, investors reassured, allies back on the phone."
 ROM_iohannis_legacy_idea:0 "The Iohannis Legacy"
 ROM_iohannis_legacy_idea_desc:0 "The returning president leaves behind institutions that work and a country that is calmer than the one he found."
 ROM_dacia_heritage_idea:0 "Sarmizegetusa Restored"
 ROM_dacia_heritage_idea_desc:0 "The Dacian past is everywhere: on stamps, in schoolbooks and in every speech."
 ROM_dacia_wolf_standard_idea:0 "The Wolf Standard"
 ROM_dacia_wolf_standard_idea_desc:0 "Volunteers flock to the colours. The neighbours watch nervously."
 ROM_dacia_integration_idea:0 "One People, One Land"
 ROM_dacia_integration_idea_desc:0 "The administration is ready to absorb the lands beyond the borders, at the cost of investment at home."
 ROM_dacia_path_spirit:0 "The Dacian Awakening"
 ROM_dacia_path_spirit_desc:0 "A nationalist movement in power, with one flag and one idea: the reunion of all the lands of ancient Dacia. It unites the country and isolates it, and the money spent on monuments is not spent on factories or laboratories."
 ROM_dacia_formed_idea:0 "Restored Dacia"
 ROM_dacia_formed_idea_desc:0 "The kingdom of Burebista and Decebalus lives again, two thousand years later."
 ROM_roman_legions_idea:0 "The Legions Reborn"
 ROM_roman_legions_idea_desc:0 "The army is organised, trained and paraded in the Roman manner."
 ROM_roman_eastern_claim_idea:0 "The Eastern Claim"
 ROM_roman_eastern_claim_idea_desc:0 "Bucharest claims the inheritance of both Romes, and its neighbours are not amused."
 ROM_roman_path_spirit:0 "Imperium Restitutum"
 ROM_roman_path_spirit_desc:0 "Romania sees itself as the heir of Rome and builds an army to match. The cost is a permanently mobilised society, an economy bent to the military and neighbours who expect the worst."
 ROM_roman_empire_formed_idea:0 "The Restored Empire"
 ROM_roman_empire_formed_idea_desc:0 "The eagle flies again over Rome and Constantinople, this time from Bucharest."
 ROM_ottoman_straits_idea:0 "Masters of the Straits"
 ROM_ottoman_straits_idea_desc:0 "The fleet plans and trains for the Bosporus, while the army waits its turn."
 ROM_ottoman_millet_idea:0 "The Millet Compact"
 ROM_ottoman_millet_idea_desc:0 "Every community governs its own affairs under the protection of the state."
 ROM_ottoman_caravans_idea:0 "Caravans of the Black Sea"
 ROM_ottoman_caravans_idea_desc:0 "Ports, ferries and pipelines from Constanta to Trabzon."
 ROM_ottoman_path_spirit:0 "The Sublime State"
 ROM_ottoman_path_spirit_desc:0 "A Black Sea commonwealth of peoples and faiths, rich in trade and reach. At home it is unpopular, and in the lands it rules it is a foreign power."
 ROM_ottoman_empire_formed_idea:0 "The Restored Porte"
 ROM_ottoman_empire_formed_idea_desc:0 "The Black Sea is once again ruled from a single capital."
