l_english:
 SOV_civil_war_focus:0 "Civilwar Communist Path"

 SOV_cw_strange_united_front:0 "A Strange United Front"
 SOV_cw_strange_united_front_desc:0 "Stalinists, Leninists, Trotskyists and council communists have spent a century calling each other traitors. This morning they are sharing a trench, a map and the last crate of cartridges. Nobody says it out loud, but everyone knows the argument resumes the day the shooting stops."
 SOV_cw_against_the_whites:0 "Against the Whites and the Black Barons"
 SOV_cw_against_the_whites_desc:0 "Old flags have come out of old attics: tsarist eagles, monarchist tricolours, the black banners of men who call themselves barons again. The names have changed, the enemy has not, and neither has the answer."

 SOV_cw_centralized_command_center:0 "Centralized Command Center"
 SOV_cw_centralized_command_center_desc:0 "Four militias, four staffs, four sets of orders that contradict each other by noon. One map room, one telephone exchange, one signature at the bottom of the order - the rest is sentiment."
 SOV_cw_political_commissars:0 "Use Political Commissars"
 SOV_cw_political_commissars_desc:0 "Beside every officer a Party man, with the authority to countersign an order and the authority to stop one. The regiments hold the line better than before. A handful of colonels do not come back from the interview."
 SOV_cw_permit_international_brigades:0 "Permit International Brigades"
 SOV_cw_permit_international_brigades_desc:0 "They arrive with their own rifles and their own languages, from a dozen countries where the police already have a file on them. Some came for the revolution, some came because there was nothing left at home. Both fight."

 SOV_cw_new_putilov_workshops:0 "The New Putilov Workshops"
 SOV_cw_new_putilov_workshops_desc:0 "The name is a deliberate quotation. The plant that armed the first revolution is being rebuilt on the site of a bankrupt assembly line, and the first shift is already running before the roof is finished."
 SOV_cw_every_weapon_must_be_used:0 "Every Weapon Must Be Used"
 SOV_cw_every_weapon_must_be_used_desc:0 "Museum Mosins, hunting rifles, crates dug out of a depot that closed in 1993. Half the stock is older than the men carrying it, and all of it still fires."
 SOV_cw_war_communism_once_again:0 "War Communism Once Again"
 SOV_cw_war_communism_once_again_desc:0 "Requisition in the countryside, rationing in the cities, the factory committee answering directly to the front. It worked in 1918 and it nearly starved the republic doing it. Nobody pretends this time will be gentler."

 SOV_cw_red_guards:0 "The Red Guards"
 SOV_cw_red_guards_desc:0 "Factory detachments, armed at the gate and sworn in at the bench. They are not soldiers yet, but they know the streets they are defending better than any professional ever will."
 SOV_cw_conscription_for_women:0 "Conscription For Women Too"
 SOV_cw_conscription_for_women_desc:0 "The decree is one paragraph long and ends a debate that lasted eighty years. The queues outside the recruitment offices are longer than the planners expected, and considerably angrier."
 SOV_cw_workers_army:0 "The Workers' Army"
 SOV_cw_workers_army_desc:0 "No longer a collection of armed factories but an army, with a chain of command, a supply train and a rank badge that means something. The lathe operators who started this are now sergeants."

 SOV_cw_revolutionary_fervor:0 "Revolutionary Fervor"
 SOV_cw_revolutionary_fervor_desc:0 "There is a point in every civil war where fear turns into momentum, and the side that reaches it first usually wins. The columns are singing again on the march, which the commissars report as a good sign and the quartermasters as a bad one."
 SOV_cw_revolutionary_vanguard_army:0 "The Revolutionary Vanguard Army"
 SOV_cw_revolutionary_vanguard_army_desc:0 "The best of the militias, pulled out of the line, re-equipped and drilled into a striking force. When it goes in, it goes in first and it does not stop to consolidate."

 SOV_cw_if_lenin_could_see_us:0 "If Lenin Could See Us..."
 SOV_cw_if_lenin_could_see_us_desc:0 "The last White column has surrendered and the red flag is over the Kremlin again. Someone in the crowd says it out loud - if Lenin could see us. Nobody answers, because the hard part starts tomorrow: now the union has to be governed."
