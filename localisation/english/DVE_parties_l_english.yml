 DVE_pt_ui_rules1:0 "Boost or reduce a party by 2% for 25 political power. Each party has its own 14-day cooldown."
 DVE_pt_ui_rules2:0 "A new government needs a valid coalition with at least 51% of the vote. Dissolving the government costs 50 political power and 5% stability."
 DVE_pt_ui_open_tt:0 "Open the party panel.\nBoost or reduce the parties and, after dissolving the government, form a new coalition."
 DVE_pt_ui_boost_tt:0 "Boost this party: §G+2%§! popularity.\nCosts §Y25§! political power. Each party can be changed once every §Y14§! days (boosting and reducing share the same cooldown)."
 DVE_pt_ui_deboost_tt:0 "Reduce this party: §R-2%§! popularity.\nCosts §Y25§! political power. Each party can be changed once every §Y14§! days (boosting and reducing share the same cooldown)."
 DVE_pt_ui_ally_tt:0 "Add this party to the coalition, or take it out again.\nOnly the parties that the lead party may bring in can join. The lead party always stays in."
 DVE_pt_ui_lead_tt_totalitarian_socialism:0 "Make the Totalitarian Socialists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Authoritarian Socialists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_authoritarian_socialism:0 "Make the Authoritarian Socialists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Revolutionary Socialists, Reformist Socialists and Liberals.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_vanguard_socialism:0 "Make the Vanguard Socialists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Revolutionary Socialists and Reformist Socialists.\nThe coalition is valid only if it includes the Revolutionary Socialists or the Reformist Socialists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_revolutionary_socialism:0 "Make the Revolutionary Socialists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Vanguard Socialists, Reformist Socialists and Authoritarian Socialists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_progressive:0 "Make the Reformist Socialists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Totalitarian Socialists, Revolutionary Socialists, Liberals and Authoritarian Socialists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_liberal:0 "Make the Liberals lead the coalition. The partners chosen so far are cleared.\nMay bring in: Reformist Socialists, Authoritarian Socialists and Centrists, plus Totalitarian Socialists and Revolutionary Socialists together (both or neither).\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_centrist:0 "Make the Centrists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Liberals and Conservatives, plus Reformist Socialists and Authoritarian Socialists together (both or neither).\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_conservative:0 "Make the Conservatives lead the coalition. The partners chosen so far are cleared.\nMay bring in: Centrists, Reactionaries and Authoritarians.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_reactionary:0 "Make the Reactionaries lead the coalition. The partners chosen so far are cleared.\nMay bring in: Conservatives, Autocrats and Authoritarians.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_authoritarianism:0 "Make the Authoritarians lead the coalition. The partners chosen so far are cleared.\nMay bring in: Conservatives, Reactionaries, Autocrats and Absolutists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_autocracy:0 "Make the Autocrats lead the coalition. The partners chosen so far are cleared.\nMay bring in: Reactionaries, Authoritarians, Absolutists and Conservatives, plus Ultranationalists and Fundamentalists together (both or neither).\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_absolutism:0 "Make the Absolutists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Reactionaries, Authoritarians, Autocrats, Ultranationalists and Fundamentalists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_ultranationalism:0 "Make the Ultranationalists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Absolutists, Autocrats and Fundamentalists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_lead_tt_fundamentalism:0 "Make the Fundamentalists lead the coalition. The partners chosen so far are cleared.\nMay bring in: Autocrats, Ultranationalists and Absolutists.\nTogether the coalition needs at least §Y51%§! of the vote."
 DVE_pt_ui_dissolve_tt:0 "Dissolve the government and start the talks for a new one.\nCosts §Y50§! political power and §Y5%§! stability. Possible once every 30 days, and only in a country that holds elections."
 DVE_pt_ui_form_tt:0 "Form the government with the chosen coalition.\nThe coalition must be valid and its parties must hold at least §Y51%§! of the vote together. The lead party becomes the ruling party."
 DVE_pt_ui_cancel_tt:0 "Give up the talks and keep the current government.\nThe political power spent is not refunded."
 DVE_pt_ui_elections_tt:0 "Call new elections instead.\nThe results come in the next day and change the popularity of the parties."
 DVE_pt_ui_ruling_tt:0 "Ruling party"
 DVE_pt_ui_member_tt:0 "Coalition member"
 DVE_pt_ui_cooldown_tt:0 "On cooldown: this party cannot be boosted or reduced again for 14 days."
