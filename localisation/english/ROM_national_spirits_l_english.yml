l_english:
 # DvE: Romania in 2025 - starting National Spirits
 ROM_euro_atlantic_spirit:0 "Anchored in the West"
 ROM_euro_atlantic_spirit_desc:0 "Romania has been in NATO since 2004 and in the European Union since 2007, and joined Schengen in full on 1 January 2025. EU funds pay for most of the country's investment and the single market buys most of its exports. Membership also brings rules, deadlines and conditions."
 ROM_euro_atlantic_spirit_core:0 "At the Heart of Europe"
 ROM_euro_atlantic_spirit_core_desc:0 "Romania is no longer a newcomer at the European table. It sits among the countries that set the rules, and the money and investment follow."
 ROM_euro_atlantic_spirit_strained:0 "Strained Alliances"
 ROM_euro_atlantic_spirit_strained_desc:0 "Bucharest still belongs to the EU and NATO, but it argues with Brussels in public. Funds arrive late or not at all, and the government enjoys the fight."
 ROM_deficit_spirit:0 "The Largest Deficit in the EU"
 ROM_deficit_spirit_desc:0 "The 2024 budget deficit reached almost nine percent of GDP, the highest in the European Union, and Brussels has opened an excessive deficit procedure. Public investment is the first thing to be cut, and every budget vote becomes a crisis."
 ROM_deficit_spirit_consolidated:0 "Consolidated Finances"
 ROM_deficit_spirit_consolidated_desc:0 "The deficit is under control. The cuts still hurt, but the markets and Brussels have stopped worrying."
 ROM_black_sea_gas_spirit:0 "Black Sea Energy"
 ROM_black_sea_gas_spirit_desc:0 "Romania produces most of the gas it uses and refines its own oil at Petrobrazi and Petromidia. With the Neptun Deep field due to start production in 2027, it is expected to become the largest gas producer in the EU."
 ROM_black_sea_gas_spirit_2:0 "Gas Exporter of the Black Sea"
 ROM_black_sea_gas_spirit_2_desc:0 "Neptun Deep is producing. Romania now sells gas to its neighbours instead of buying it, and its industry runs on cheap domestic energy."
 ROM_diaspora_spirit:0 "The Diaspora"
 ROM_diaspora_spirit_desc:0 "Between four and five million Romanians live and work abroad, in Italy, Spain, Germany and Britain. Their remittances keep many families afloat, but hospitals, building sites and factories at home cannot find enough workers."
 ROM_diaspora_spirit_returning:0 "Coming Home"
 ROM_diaspora_spirit_returning_desc:0 "For the first time in thirty years more Romanians are coming home than leaving. They bring savings, skills and new expectations."
 ROM_it_hub_spirit:0 "Tech Hub of the East"
 ROM_it_hub_spirit_desc:0 "Cluj, Bucharest and Iasi are among the leading software centres of Eastern Europe, and Romania has some of the fastest broadband on the continent. IT is one of the few sectors where Romanian salaries can compete with the West."
 ROM_it_hub_spirit_2:0 "Digital Romania"
 ROM_it_hub_spirit_2_desc:0 "Romanian start-ups, chip designers and research centres have turned the outsourcing hubs into a real technology industry."
 ROM_divided_country_spirit:0 "A Divided Country"
 ROM_divided_country_spirit_desc:0 "The annulment of the 2024 presidential election has split Romania. Nationalist and anti-system parties hold about a third of Parliament, trust in the institutions is at a record low, and every vote is treated as a battle for the country's future."
 ROM_divided_country_spirit_healed:0 "A Country Reconciled"
 ROM_divided_country_spirit_healed_desc:0 "The wounds of 2024 are closing. Romanians still disagree, but most of them accept that the institutions are theirs."
 ROM_divided_country_spirit_radical:0 "Politics of the Street"
 ROM_divided_country_spirit_radical_desc:0 "Compromise is treason and the opposition is the enemy. Power is easy to mobilise and hard to keep calm."
 ROM_granary_spirit:0 "Granary of the Black Sea"
 ROM_granary_spirit_desc:0 "Romania is one of the largest grain exporters in the European Union, and Constanta ships wheat and maize around the world. Yet millions of farms are tiny family plots, and much of the rural population still lives from subsistence agriculture."
 ROM_granary_spirit_2:0 "Modern Agriculture"
 ROM_granary_spirit_2_desc:0 "Irrigation, consolidated farms and a food industry that processes at home what used to be exported raw."
 ROM_infrastructure_gap_spirit:0 "Roads Not Yet Built"
 ROM_infrastructure_gap_spirit_desc:0 "Romania has some of the fewest kilometres of motorway per inhabitant in the European Union, and its trains are among the slowest. EU money is finally paying for new roads, but projects still run years late."
 ROM_infrastructure_gap_spirit_closing:0 "Closing the Gap"
 ROM_infrastructure_gap_spirit_closing_desc:0 "The great motorways across the Carpathians and Moldavia are open, and the rail network is being rebuilt."
 ROM_war_next_door_spirit:0 "The War Next Door"
 ROM_war_next_door_spirit_desc:0 "Romania shares a 650 km border with Ukraine. Drone fragments fall near Tulcea, refugees and grain trucks cross the border every day, and the Danube ports carry Ukraine's exports. Romanians support the defence of their neighbour, but they are afraid of the war spreading."
 ROM_war_next_door_spirit_frontline:0 "Frontline State"
 ROM_war_next_door_spirit_frontline_desc:0 "Romania has accepted its role on the front line of Europe. Its people have grown used to the danger and are ready to face it."
