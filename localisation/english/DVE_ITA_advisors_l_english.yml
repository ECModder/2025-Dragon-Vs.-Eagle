l_english:

 ITA_circoli_operai:0 "Workers' Circles"
 ITA_circoli_operai_desc:0 "The party's base unit: a room above a garage, a table of pamphlets, a few dozen names that show up every week. They do not run the state - they argue with it, one workplace and one neighbourhood at a time, and every argument they win is a vote for the line."

 ITA_segretari_locali:0 "Local Secretaries"
 ITA_segretari_locali_desc:0 "Every circle answers to someone, and every someone answers to Milan. The local secretaries are the party's actual machinery - the ones who make sure the factory floor, the ration office and the recruiting table all report the same numbers, on the same day, to the same address."

 ITA_consiglio_centrale:0 "Central Council"
 ITA_consiglio_centrale_desc:0 "The line comes from here, not from the street. A dozen people around a table under the flags decide what internationalism means this month, and the rest of the country finds out from the pamphlets the Local Secretaries hand out the next morning."
