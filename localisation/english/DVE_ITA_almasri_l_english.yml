l_english:
 dve_almasri.1.t:0 "The General from Mitiga"
 dve_almasri.1.d:0 "Italian judicial police have detained Osama Elmasri Njeem in Turin, the day after the International Criminal Court issued a warrant against him for war crimes and crimes against humanity.\n\nNjeem is linked to the Rada militia and to the running of the Mitiga prison in Tripoli. The Court of Appeal of Rome must now rule on the arrest."
 dve_almasri.1.a:0 "The Court of Appeal will decide."
 dve_almasri.2.t:0 "Released and Flown Home"
 dve_almasri.2.d:0 "On 21 January the Court of Appeal of Rome ordered Njeem's release, ruling the arrest irregular and noting that no precautionary measure had been requested. The same day he was flown back to Libya on an official flight."
 dve_almasri.2.a:0 "Reasons of state."
 dve_almasri.2.b:0 "A procedural failure, nothing more."
 dve_almasri.3.t:0 "The Ministers' Tribunal"
 dve_almasri.3.d:0 "On 1 August the Ministers' Tribunal of Rome sent the Chamber of Deputies a request for authorisation to proceed, under article 96 of the Constitution, against Justice Minister Carlo Nordio, Interior Minister Matteo Piantedosi and Undersecretary Alfredo Mantovano.\n\nThe Chamber must now vote on whether the three can be tried over the Njeem affair."
 dve_almasri.3.a:0 "The majority will be asked to refuse."
 dve_almasri.3.b:0 "Parliament must decide freely."
 dve_almasri.4.t:0 "The Chamber Says No"
 dve_almasri.4.d:0 "On 9 October the Chamber of Deputies denied authorisation to proceed against Nordio, Piantedosi and Mantovano."
 dve_almasri.4.a:0 "The matter is closed."
 dve_almasri.4.b:0 "The opposition will not let it go."
 dve_almasri.5.t:0 "Tripoli Sentences Njeem"
 dve_almasri.5.d:0 "After his arrest in Tripoli in November 2025, Osama Elmasri Njeem has been sentenced by a criminal court in the Libyan capital to seven years and four months in prison.\n\nThe verdict arrives seventeen months after Italy flew him home."
 dve_almasri.5.a:0 "Libyan justice has spoken."
 dve_almasri.5.b:0 "The International Criminal Court will be heard."
 dve_almasri.6.t:0 "The Constitutional Court Rules"
 dve_almasri.6.d:0 "With judgment no. 143 of 23 July 2026, the Constitutional Court declared articles 2 and 4 of law 237/2012 unconstitutional in so far as they do not provide for the immediate transmission to the Prosecutor General at the Court of Appeal of Rome of the International Criminal Court's requests for cooperation, save a reasoned refusal to protect paramount constitutional principles."
 dve_almasri.6.a:0 "Accept the ruling."
 dve_almasri.6.b:0 "Defend the old rule."
 dve_almasri.7.t:0 "The File Goes to Rome's Prosecutor General"
 dve_almasri.7.d:0 "On 30 July it was reported that, following the ruling, Justice Minister Nordio had sent the International Criminal Court's file on the Njeem case to the Prosecutor General's office in Rome."
 dve_almasri.7.a:0 "Let the prosecutors work."
 dve_almasri.8.t:0 "A Conflict Between Powers"
 dve_almasri.8.d:0 "On 6 November 2026 judgment no. 190/2026 of the Constitutional Court partly upheld the Chamber of Deputies in the conflict of attribution it had raised over the proceedings concerning the former chief of staff of the Justice Ministry."
 dve_almasri.8.a:0 "Every power has its limits."
 DVE_almasri_repatriation:0 "Njeem Sent Home"
 DVE_almasri_trial:0 "Njeem Tried in Tripoli"
