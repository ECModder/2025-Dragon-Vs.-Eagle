 # Group descriptions
 totalitarian_socialism_desc:0 "Socialism as total mobilisation: one party, one doctrine and one leadership reach into every corner of life, and the security organs make sure that nothing is left outside the plan."
 vanguard_socialism_desc:0 "The revolution led by a disciplined party of professional militants. Power belongs to the workers' councils, the strategy to the party, and the horizon is the world rather than the nation."
 revolutionary_socialism_desc:0 "Capitalism is to be overthrown, not managed. A family of movements, from Trotskyists to syndicalists and anarchists, that agree on the uprising and on little else."
 progressive_desc:0 "Socialism reached through elections, unions and legislation. The market is corrected and gradually outgrown, and the constitution is kept."
 liberal_desc:0 "Civil liberties, pluralism and a market economy with a social conscience. Rights come first, and the state exists to guarantee them and to widen access to them."
 conservative_desc:0 "Institutions, property and gradual change. The free market and the constitutional order are defended as an inheritance to be handed on intact."
 reactionary_desc:0 "A right that wants to restore rather than conserve: nation, religion and hierarchy against a liberal order it holds responsible for decline."
 authoritarianism_desc:0 "Power concentrated in an executive that tolerates elections and courts only as long as they do not get in the way. Stability is the stated aim, and the opposition is managed rather than defeated."
 autocracy_desc:0 "Rule by one man, one clique or one army, without any real limit. Institutions survive as scenery."
 absolutism_desc:0 "Sovereignty rests in a crown, by inheritance or by divine right. The dynasty is the state, and politics is what happens at court."
 ultranationalism_desc:0 "The nation as the supreme value, above law, class and individual. A single party and a single leader claim to embody it, and treat everything foreign as a threat."
 fundamentalism_desc:0 "The state as an instrument of the faith. Religious law overrides civil law, and the clergy or their militants claim the last word."

