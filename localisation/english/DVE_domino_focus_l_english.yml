l_english:
 # ==== DvE - le quattro rivoluzioni del domino ====
 LT_redpol:0 "The Polish October"
 LT_redpol_desc:0 "The industrial triangle rises first, as it did in 1956 and 1970 and 1980, and this time nobody in Warsaw is willing to order the shooting. The government withdraws east to Bialystok and calls it a redeployment."
 LT_redgre:0 "The Second Round"
 LT_redgre_desc:0 "Greece has done this before and remembers exactly how it ended. The mainland goes red - Macedonia and Epirus first, where ELAS still has grandchildren - and the government leaves for Crete, as governments here have a habit of doing."
 LT_redscand:0 "The Nordic Union"
 LT_redscand_desc:0 "Three kingdoms whose labour movements spent a century being told they had already won. The populated south of all three goes over at once; what is left of the three governments withdraws to Norrbotten, Troms and Greenland, and does not accept the result."
 LT_redyugo:0 "Yugoslavia Reassembled"
 LT_redyugo_desc:0 "Six countries that spent thirty years insisting they were nations are put back into one, by people who were told all their lives it could never be undone. Each keeps a strip and keeps fighting - except Montenegro, which is too small to split and simply stops existing."
