l_english:
 # ==== DvE - le quattro rivoluzioni del domino ====
 LT_redpol:0 "The Polish October"
 LT_redpol_desc:0 "The industrial triangle rises first, as it did in 1956 and 1970 and 1980, and this time nobody in Warsaw is willing to order the shooting. The government withdraws east to Bialystok and calls it a redeployment."
 LT_redgre:0 "The Second Round"
 LT_redgre_desc:0 "Greece has done this before and remembers exactly how it ended. The mainland goes red - Macedonia and Epirus first, where ELAS still has grandchildren - and the government leaves for Crete, as governments here have a habit of doing."
 LT_redscand:0 "The Nordic Union"
 LT_redscand_desc:0 "Three kingdoms whose labour movements spent a century being told they had already won. The populated south of all three goes over at once; what is left of the three governments withdraws to Norrbotten, Troms and Greenland, and does not accept the result."
 LT_redyugo:0 "Yugoslavia Reassembled"
 LT_redyugo_desc:0 "Six countries that spent thirty years insisting they were nations are put back into one, by people who were told all their lives it could never be undone. Each keeps a strip and keeps fighting - except Montenegro, which is too small to split and simply stops existing."

 # ==== DvE - le cinque rivoluzioni maggiori ====
 LT_redfra:0 "The Third Commune"
 LT_redfra_desc:0 "Paris has done this twice and been shot for it twice. The industrial north and the whole Mediterranean coast go over in a fortnight; what is left of the Republic withdraws to the south-west and insists it is still the Republic."
 LT_redspa:0 "The Second Republic"
 LT_redspa_desc:0 "Madrid, Catalonia, the Basque country and Asturias - the same map as 1936, drawn by the grandchildren of the people who drew it then. The government falls back on Galicia. Lisbon does not even wait to be asked: the carnations come out of the rifles a second time, and Portugal goes with them."
 LT_redger:0 "Germany Divided Again"
 LT_redger_desc:0 "A country that spent forty years being told the eastern half had been an aberration. The industrial west and the whole of the old east go over together, which is not the division anybody expected, and the government leaves for the north."
 LT_redeng:0 "The General Strike"
 LT_redeng_desc:0 "In 1926 the unions blinked. This time nobody goes back to work, the docks and the mining valleys go first, and by the time London understands what is happening London is no longer the capital."
 LT_domino:0 "The Rest Follow"
 LT_domino_desc:0 "Albania, Belgium, the Netherlands and Austria are not conquered. They are surrounded - by France, by Germany, by Italy, by the sea - and they read the map and draw the only conclusion available to them. Not a shot is fired."
