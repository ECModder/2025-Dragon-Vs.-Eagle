l_english:
 DVE_POR_BOOKMARK_DESC:0 "A small republic with an ocean of its own, Portugal begins 2025 with a minority government, a housing crisis and armed forces stretched across the Atlantic from the Azores to Madeira. Montenegro, Pedro Nuno Santos and André Ventura will fight for the Presidency in 2026 - but the most famous Portuguese man alive has not yet said his last word. Will Portugal stay a quiet Atlantic partner, or look to its old empire and its Iberian neighbour?"
 # ============================================================
 #  DvE - PORTUGAL. In 'replace' so these keys win over any base
 #  game POR_ key of the same name. No double quotes inside texts.
 # ============================================================
 # ---- OPENING ----
 POR_a_republic_at_a_crossroads:0 "A Republic at a Crossroads"
 POR_a_republic_at_a_crossroads_desc:0 "January 2025. Portugal is proud of its history, its culture and its football, and unsure of almost everything else: who will govern, for how long, and to what end. The next two years will decide what kind of country comes out of them."
 POR_the_madeira_question:0 "The Madeira Question"
 POR_the_madeira_question_desc:0 "The dissolution of the Regional Parliament in Funchal is a warning from the islands. Lisbon should answer it with attention and with money for the things Madeira has been asking for."
 POR_state_of_the_nation_debate:0 "State of the Nation Debate"
 POR_state_of_the_nation_debate_desc:0 "Housing, hospitals, immigration, wages, defence, Europe. Let the Assembly argue all of it in the open, so the country at least knows what the argument is about."
 POR_review_public_services:0 "Review the Public Services"
 POR_review_public_services_desc:0 "Before promising anything, count: waiting lists, vacant teaching posts, permits stuck in drawers. An honest inventory of the state is the first reform."
 POR_respond_to_the_blackout:0 "Respond to the Blackout"
 POR_respond_to_the_blackout_desc:0 "On 28 April 2025 the lights went out across the peninsula. The government owes the country more than restored power: it owes an account of what happened and what changes."
 POR_respond_to_the_blackout_tt:0 "The government takes political ownership of the recovery."
 POR_commission_of_inquiry:0 "Commission of Inquiry"
 POR_commission_of_inquiry_desc:0 "Give the investigators the documents, the engineers and the time. An interim report within weeks, a final one when the work is actually done."
 POR_commission_of_inquiry_tt:0 "An §Yinterim report§! on the blackout will arrive in about 20 days."
 POR_open_the_presidential_race:0 "Open the Presidential Race"
 POR_open_the_presidential_race_desc:0 "In this timeline three names will be on the ballot of 18 January 2026: Luis Montenegro, Pedro Nuno Santos and Andre Ventura. The President does not govern, but in a fragmented republic his vetoes, his appointments and his power to dissolve Parliament weigh more than ever."
 POR_open_the_presidential_race_tt:0 "Opens the §YPresidential Campaign§! decisions if they are not open yet."
 POR_back_candidate_tt:0 "This candidate will win the election of §Y18 January 2026§!. The §YPresidential Campaign§! decides whether the mandate is strong, ordinary or contested. The route begins at the inauguration on §Y9 March 2026§!."
 POR_back_montenegro:0 "Back Luis Montenegro"
 POR_back_montenegro_desc:0 "The Democratic Alliance candidate offers stability, growth and a firm place in Europe and NATO: a pragmatic centre-right presidency that negotiates more than it shouts."
 POR_back_santos:0 "Back Pedro Nuno Santos"
 POR_back_santos_desc:0 "The Socialist candidate offers an active state: a rebuilt health service, homes people can afford, stronger labour rights, and the public investment to pay for a fairer country."
 POR_back_ventura:0 "Back Andre Ventura"
 POR_back_ventura_desc:0 "The Chega candidate offers a break with the parties that have alternated in power: stricter borders, accountability in public office, national sovereignty first, and a harder line in Brussels."
 # ---- MONTENEGRO ----
 POR_a_mandate_for_stability:0 "A Mandate for Stability"
 POR_a_mandate_for_stability_desc:0 "After years of governments that fell before their budgets, the new President reads his victory one way: the country wants institutions that work together and last."
 POR_rebuilding_political_confidence:0 "Rebuilding Political Confidence"
 POR_rebuilding_political_confidence_desc:0 "Regular meetings with every parliamentary group, published agendas, fewer surprises. Trust is rebuilt by being boring on purpose."
 POR_a_government_that_can_last:0 "A Government That Can Last"
 POR_a_government_that_can_last_desc:0 "Belem uses its influence to keep the government and the Assembly talking. The aim is a legislature that reaches its last day."
 POR_cutting_administrative_barriers:0 "Cutting Administrative Barriers"
 POR_cutting_administrative_barriers_desc:0 "One counter, one form, one deadline. A modernised public administration is the cheapest economic policy available."
 POR_a_competitive_portuguese_economy:0 "A Competitive Portuguese Economy"
 POR_a_competitive_portuguese_economy_desc:0 "Lower taxes on work and on business, and a clear signal to investors. The left will call it a gift to the rich and will vote accordingly."
 POR_a_pact_on_regime_matters:0 "A Pact on Regime Matters"
 POR_a_pact_on_regime_matters_desc:0 "Justice, defence, Europe and the budget calendar are settled with the Socialists, outside daily politics. It costs political capital and leaves the populist right as the only real opposition."
 POR_hold_the_centre_right_line:0 "Hold the Centre-Right Line"
 POR_hold_the_centre_right_line_desc:0 "No grand bargain. Govern with the centre-right alone, bill by bill, and dare the others to bring it down."
 POR_a_new_investment_programme:0 "A New Investment Programme"
 POR_a_new_investment_programme_desc:0 "Industrial parks in the north, logistics around Lisbon, private capital carrying most of the weight."
 POR_portugal_in_europe:0 "Portugal in Europe"
 POR_portugal_in_europe_desc:0 "A reliable partner in the Council, a serious user of European funds, a voice for the Atlantic edge of the Union."
 POR_strengthening_the_atlantic_partnership:0 "Strengthening the Atlantic Partnership"
 POR_strengthening_the_atlantic_partnership_desc:0 "The oldest alliance in Europe, the Lajes base, the sea lanes: Portugal's weight in NATO is geographic, and geography should be invested in."
 POR_stability_delivered:0 "Stability Delivered"
 POR_stability_delivered_desc:0 "A government that lasted, budgets that passed, reforms that were negotiated instead of imposed. Not glamorous. That was the point."
 # ---- SANTOS ----
 POR_a_new_social_contract:0 "A New Social Contract"
 POR_a_new_social_contract_desc:0 "The new President asks the government, whatever its colour, to put the Portuguese people first: health, housing, wages. He cannot legislate. He can make it very hard to look away."
 POR_restoring_trust_in_the_socialists:0 "Restoring Trust in the Socialists"
 POR_restoring_trust_in_the_socialists_desc:0 "The party left office under a cloud. It returns to relevance the slow way: new faces, clean lists, and a programme people can check."
 POR_rebuilding_the_national_health_service:0 "Rebuilding the National Health Service"
 POR_rebuilding_the_national_health_service_desc:0 "Family doctors for everyone, emergency rooms that stay open, careers that keep nurses in the country. Expensive, and popular."
 POR_homes_for_the_portuguese_people:0 "Homes for the Portuguese People"
 POR_homes_for_the_portuguese_people_desc:0 "A public housing programme on a scale Portugal has not tried in decades: build, buy, renovate, and rent at prices tied to wages."
 POR_homes_for_the_portuguese_people_tt:0 "Starts a §Ypublic housing programme§!: the Economy focus §YBuild the Homes§! gives extra stability."
 POR_a_fairer_labour_market:0 "A Fairer Labour Market"
 POR_a_fairer_labour_market_desc:0 "Less precarious work, stronger collective bargaining, a higher wage floor. Employers warn about costs; they are not entirely wrong."
 POR_investing_in_education:0 "Investing in Education"
 POR_investing_in_education_desc:0 "Teachers, vocational schools, universities linked to industry. The return arrives in a decade, which is why it is rarely funded."
 POR_modernising_public_transport:0 "Modernising Public Transport"
 POR_modernising_public_transport_desc:0 "Metro extensions, suburban rail, passes people can afford. The homes are only affordable if the journey to work is too."
 POR_tax_the_windfalls:0 "Tax the Windfalls"
 POR_tax_the_windfalls_desc:0 "Pay for the programme with contributions from banks, energy and large property portfolios. The right mobilises against it; the accounts balance."
 POR_borrow_to_build:0 "Borrow to Build"
 POR_borrow_to_build_desc:0 "Invest now and let growth repay it. It builds more and faster, and it puts the deficit back on the front pages."
 POR_the_social_republic:0 "The Social Republic"
 POR_the_social_republic_desc:0 "A stronger public sphere, a more active state, services people trust again. The social-democratic Portugal promised in 2026, with its bill attached."
 # ---- VENTURA ----
 POR_breaking_the_political_establishment:0 "Breaking the Political Establishment"
 POR_breaking_the_political_establishment_desc:0 "Fifty years of alternation between two parties ended at the ballot box. The new President intends to use every power the Constitution gives him, and to argue about the ones it does not."
 POR_a_new_political_mandate:0 "A New Political Mandate"
 POR_a_new_political_mandate_desc:0 "Rallies after the election, not only before it. The presidency is used as a permanent campaign to keep the voters mobilised."
 POR_accountability_in_public_office:0 "Accountability in Public Office"
 POR_accountability_in_public_office_desc:0 "Asset declarations, faster corruption trials, audits of public contracts. The one part of the programme the other parties find hard to oppose."
 POR_a_different_immigration_policy:0 "A Different Immigration Policy"
 POR_a_different_immigration_policy_desc:0 "Quotas, stricter residence rules, more controls. Employers in farming, tourism and construction warn of labour shortages; supporters say that was the mandate."
 POR_reforming_the_state:0 "Reforming the State"
 POR_reforming_the_state_desc:0 "Fewer agencies, fewer appointments, lower taxes. The civil service resists, as civil services do."
 POR_defending_national_sovereignty:0 "Defending National Sovereignty"
 POR_defending_national_sovereignty_desc:0 "Portugal stays in the Union and says no more often: on migration, on fiscal rules, on anything presented as decided elsewhere."
 POR_the_portuguese_question:0 "The Portuguese Question"
 POR_the_portuguese_question_desc:0 "Can the Constitution of 1976 be rewritten to match the mandate of 2026? A revision needs two thirds of the Assembly. The President has a megaphone and a veto, not two thirds."
 POR_the_portuguese_question_tt:0 "The §Yconstitutional revision§! reaches the Assembly."
 POR_force_the_constitutional_revision:0 "Force the Constitutional Revision"
 POR_force_the_constitutional_revision_desc:0 "A deliberate alternate-history escalation: vetoes, dissolution threats and street pressure to break the two-thirds wall. If Parliament does not bend, the institutions jam."
 POR_work_within_the_constitution:0 "Work Within the Constitution"
 POR_work_within_the_constitution_desc:0 "Take the partial revision the centre-right will sign, bank the anti-corruption and security chapters, and leave the rest for another election. The base will call it surrender."
 POR_a_new_political_order:0 "A New Political Order"
 POR_a_new_political_order_desc:0 "The transformation reaches its end, one way or the other: a changed republic, or a blocked one."
 POR_a_new_political_order_tt:0 "If the revision was §Yforced§! and Parliamentary Support is §Rbelow 50§!: §RInstitutional Deadlock§!. Otherwise: §GA New Political Order§!. Either replaces §YNational Transformation§!."
 # ---- SHARED 2027-2029 ----
 POR_the_autonomous_regions_compact:0 "The Autonomous Regions Compact"
 POR_the_autonomous_regions_compact_desc:0 "Madeira and the Azores are where Portugal meets the ocean. A new financing and investment agreement gives the islands what the crisis of 2025 showed they lacked."
 POR_an_atlantic_diplomacy:0 "An Atlantic Diplomacy"
 POR_an_atlantic_diplomacy_desc:0 "Between Europe, Africa and the Americas, Portugal has more friends than its size suggests. Use them: Lusophone capitals, Atlantic allies, the sea itself."
 POR_the_state_of_the_republic:0 "The State of the Republic"
 POR_the_state_of_the_republic_desc:0 "Three years after the election, a formal accounting before the Assembly and the country: what was promised, what was done, what comes next."
 # ---- RONALDO ----
 POR_obrigado_capitao:0 "Obrigado, Capitao"
 POR_obrigado_capitao_desc:0 "§YAlternate history.§! Cristiano Ronaldo dos Santos Aveiro has announced that he will leave the national team. For a country that measures part of itself in football, it is the end of an era, and people want to mark it."
 POR_the_footballing_legacy:0 "The Footballing Legacy"
 POR_the_footballing_legacy_desc:0 "With his retirement from football entirely, in this timeline after a 1,000th career goal, the career becomes heritage. Museums, a national day of sport, a name on stadiums: the pride is real and can be put to use."
 POR_academies_of_the_future:0 "Academies of the Future"
 POR_academies_of_the_future_desc:0 "Sports schools in the interior, pitches where there were none, scholarships tied to study. The legacy invested in children who will never play in a final."
 POR_the_world_watches_lisbon:0 "The World Watches Lisbon"
 POR_the_world_watches_lisbon_desc:0 "Portugal co-hosts the 2030 World Cup with Spain and Morocco. With its most famous citizen as ambassador, the tournament becomes a four-year advertisement for the country."
 POR_from_pitch_to_public_life:0 "From Pitch to Public Life"
 POR_from_pitch_to_public_life_desc:0 "Foundations, hospital wings, long interviews about the country rather than the game. The former captain starts talking about Portugal, and Portugal listens."
 POR_found_the_renewal_movement:0 "Found the Renewal Movement"
 POR_found_the_renewal_movement_desc:0 "Not a party, its founders insist: a movement to restore national confidence and bring Portugal to international prominence. It has a famous face, a great deal of goodwill and, for now, no structure at all."
 POR_found_the_renewal_movement_tt:0 "Founds the §YMovimento Renovacao Nacional§! and opens the §YNational Renewal§! decisions.\nThe Liberal Initiative's electorate is absorbed into the new movement."
 POR_caravan_of_the_regions:0 "Caravan of the Regions"
 POR_caravan_of_the_regions_desc:0 "From Braganca to Faro, from Funchal to Ponta Delgada: town squares, not television studios."
 POR_talks_with_the_institutions:0 "Talks With the Institutions"
 POR_talks_with_the_institutions_desc:0 "Mayors, unions, employers, the armed forces chiefs, the parties themselves. A movement that wants to change the state has to be on speaking terms with it."
 POR_the_national_renewal_programme:0 "The National Renewal Programme"
 POR_the_national_renewal_programme_desc:0 "National unity, a public sector that performs, growth, sport, infrastructure, prestige abroad and defence reform, in one document. Ambitious is the kindest word its critics use."
 POR_the_armed_forces_proposal:0 "The Armed Forces Proposal"
 POR_the_armed_forces_proposal_desc:0 "The programme's boldest chapter: armed forces ranked among the world's best, a return to a form of national service, and a headline figure of a million participants. The chiefs of staff read it twice."
 POR_the_renaissance_prospectus:0 "The Renaissance Prospectus"
 POR_the_renaissance_prospectus_desc:0 "Rail, ports, technology, tourism and industry, with sponsors and investors invited to read the small print. It fills the movement's accounts before it builds anything."
 POR_the_question_of_destiny:0 "The Question of Destiny"
 POR_the_question_of_destiny_desc:0 "What is Portugal for? The movement's intellectuals offer two answers that cannot both be true: a renewed Portuguese-speaking sphere across the oceans, or a union with Spain. Both are far outside current policy, and both fill halls."
 POR_audience_with_the_council_of_state:0 "Audience With the Council of State"
 POR_audience_with_the_council_of_state_desc:0 "The President invites the movement's founder to address the Council of State. It is a courtesy, and courtesies at Belem are never only that."
 POR_audience_with_the_council_of_state_tt:0 "The movement is recognised as a §Ylegitimate national interlocutor§!. What the Presidency does with that, time will tell."
 POR_needs_coop_50_tt:0 "§YInstitutional Cooperation§! is at least §Y50§!"
 POR_the_tenth_of_june:0 "The Tenth of June"
 POR_the_tenth_of_june_desc:0 "Portugal Day, 2030. President Cristiano Ronaldo dos Santos Aveiro, 45, takes the oath. The programme was a document; now it is a job."
 POR_a_nation_in_uniform:0 "A Nation in Uniform?"
 POR_a_nation_in_uniform_desc:0 "The President asks the Assembly to debate a return to national service. Parents, students, employers, generals and economists all have a view, and few of them agree."
 POR_servico_nacional:0 "Servico Nacional"
 POR_servico_nacional_desc:0 "A period of national service for every young citizen, military or civil. Recruitment capacity rises sharply; so do the costs of training, housing and paying a generation."
 POR_service_imposed_tt:0 "The Assembly did §Rnot§! vote for the principle: the law is imposed."
 POR_a_voluntary_national_corps:0 "A Voluntary National Corps"
 POR_a_voluntary_national_corps_desc:0 "No compulsion: a well-paid, well-regarded volunteer corps with civil and military branches. Smaller numbers, far less resistance."
 POR_the_million_ambition:0 "The Million Ambition"
 POR_the_million_ambition_desc:0 "A million participants, counting conscripts, reservists, civil service and volunteers from abroad. No planner believes the figure is reachable soon; as a political target it reorganises the whole state around it, and the budget with it."
 POR_the_million_ambition_tt:0 "§YA political target, not an army.§! Recruitment capacity grows over years, at a lasting cost in consumer goods, construction and stability."
 POR_the_international_volunteer_statute:0 "The International Volunteer Statute"
 POR_the_international_volunteer_statute_desc:0 "A legal path for volunteers from the Portuguese-speaking world and the diaspora to serve, with residence and citizenship at the end of it."
 POR_arsenal_of_the_atlantic:0 "Arsenal of the Atlantic"
 POR_arsenal_of_the_atlantic_desc:0 "People in uniform need equipment, and buying it all abroad would bankrupt the programme. A national procurement industry, built almost from nothing."
 POR_the_renaissance_budget:0 "The Renaissance Budget"
 POR_the_renaissance_budget_desc:0 "The largest public works budget in the history of the democracy. For two years, cranes everywhere; the accountants are told to wait their turn."
 POR_high_speed_portugal:0 "High-Speed Portugal"
 POR_high_speed_portugal_desc:0 "Lisbon to Porto in little over an hour, the interior connected, the border crossings rebuilt."
 POR_from_stadiums_to_startups:0 "From Stadiums to Startups"
 POR_from_stadiums_to_startups_desc:0 "Sport science, media, tourism technology: a famous name opens doors for an economy that wants to sell more than sunshine."
 POR_brand_portugal:0 "Brand Portugal"
 POR_brand_portugal_desc:0 "Madeira, the Alentejo coast and the Douro marketed with a budget the tourism board never had."
 POR_the_bill_comes_due:0 "The Bill Comes Due"
 POR_the_bill_comes_due_desc:0 "The works are finished or nearly so. The debt is not. How the programme is paid for will define the presidency as much as what it built."
 POR_the_bill_comes_due_tt:0 "§YRenaissance Works§! ends. An event decides how the programme is paid for."
 POR_the_imperial_question:0 "The Imperial Question"
 POR_the_imperial_question_desc:0 "§YAlternate history.§! The debate the movement started in lecture halls reaches the Presidency. Two visions of Portuguese greatness, and room for only one."
 POR_the_lusophone_vision:0 "The Lusophone Vision"
 POR_the_lusophone_vision_desc:0 "A Portuguese sphere restored not by flags on maps but by treaties: partnership with Brazil, Angola, Mozambique, Guinea-Bissau, Cabo Verde and Sao Tome, built on recognition, trade and legitimacy. Each of them is free to say no."
 POR_the_lusophone_vision_tt:0 "Opens the §YLusophone§! decisions: cultural missions and §Ypartnership treaties§!, each needing the partner's consent."
 POR_the_iberian_vision:0 "The Iberian Vision"
 POR_the_iberian_vision_desc:0 "An old idea from both sides of the border: two nations, shared institutions, one voice in Europe. It means negotiating sovereignty with a neighbour five times larger, who may simply decline."
 POR_the_iberian_vision_tt:0 "Opens the §YIberian§! negotiation decisions. Talks start at §Y10§!."
 POR_a_community_of_destiny:0 "A Community of Destiny"
 POR_a_community_of_destiny_desc:0 "A summit of Portuguese-speaking heads of state in Lisbon, with an offer on the table: partnership between equals."
 POR_lisbon_the_lusophone_capital:0 "Lisbon, the Lusophone Capital"
 POR_lisbon_the_lusophone_capital_desc:0 "A development bank, a common business register, flights and fibre: the economic links that make a treaty worth signing."
 POR_lisbon_the_lusophone_capital_tt:0 "Invited countries are §Gmore likely§! to accept a partnership treaty."
 POR_the_fifth_empire:0 "The Fifth Empire"
 POR_the_fifth_empire_desc:0 "The old prophecy of a Portuguese empire of the spirit, reread as a community of nations that chose each other. Critics call it nostalgia with better manners."
 POR_needs_three_partners_tt:0 "At least §Y3§! Lusophone partnership treaties are in force"
 POR_the_peninsular_summit:0 "The Peninsular Summit"
 POR_the_peninsular_summit_desc:0 "The two governments meet with the word union on the agenda for the first time since the seventeenth century."
 POR_shared_institutions:0 "Shared Institutions"
 POR_shared_institutions_desc:0 "A common energy market, a joint rail authority, a shared civil protection command. Institutions first, flags later, if ever. At home, the word sovereignty is heard often."
 POR_propose_the_iberian_union:0 "Propose the Iberian Union"
 POR_propose_the_iberian_union_desc:0 "A treaty of union between two sovereign states: shared institutions, open borders in every sense, one external voice. Madrid will answer as it sees fit."
 POR_propose_the_iberian_union_tt:0 "§YSpain§! receives the proposal and may §Gaccept§! or §Rdecline§!. The further the talks, the better the odds."
 POR_needs_talks_60_tt:0 "§YIberian Talks§! are at least §Y60§!"
 POR_needs_talks_90_tt:0 "§YIberian Talks§! are at least §Y90§!"
 POR_talks_p10_tt:0 "Iberian Talks: §G+10§!"
 POR_talks_p15_tt:0 "Iberian Talks: §G+15§!"
 POR_portugal_reborn:0 "Portugal Reborn"
 POR_portugal_reborn_desc:0 "A country that set itself absurd targets and reached some of them. Whatever history makes of the Ronaldo presidency, it will not say Portugal lacked confidence."
 # ---- DEFENCE ----
 POR_strategic_defence_review:0 "Strategic Defence Review"
 POR_strategic_defence_review_desc:0 "Army, Air Force and Navy examined together for the first time in a generation: what Portugal must be able to do, what it can do today, and the distance between the two."
 POR_strategic_defence_review_tt:0 "Opens the §YDefence Modernisation§! decisions."
 POR_army_readiness_audit:0 "Army Readiness Audit"
 POR_army_readiness_audit_desc:0 "Units at half strength, vehicles older than their crews. The audit is published in full."
 POR_recruitment_and_retention:0 "Recruitment and Retention"
 POR_recruitment_and_retention_desc:0 "Better pay, housing and careers. Soldiers who stay are cheaper than soldiers who must be replaced."
 POR_equipment_recapitalisation:0 "Equipment Recapitalisation"
 POR_equipment_recapitalisation_desc:0 "A procurement drive for the basics: personal equipment, vehicles, communications, ammunition stocks."
 POR_a_professional_force:0 "A Professional Force"
 POR_a_professional_force_desc:0 "A smaller, fully professional army: high readiness, deployable brigades, long careers."
 POR_an_expanded_reserve:0 "An Expanded Reserve"
 POR_an_expanded_reserve_desc:0 "A modest active force backed by a large trained reserve, called up when needed. More people, slower to field."
 POR_the_national_service_debate:0 "The National Service Debate"
 POR_the_national_service_debate_desc:0 "Should conscription return? The question divides the parties and the generations. For now it stays a debate, though a useful one for recruiters."
 POR_training_centres:0 "Training Centres"
 POR_training_centres_desc:0 "Modern ranges, simulators and instructors: training capacity is the real limit on any army's size."
 POR_strategic_logistics_command:0 "Strategic Logistics Command"
 POR_strategic_logistics_command_desc:0 "One command for transport, maintenance and supply across the three services and the islands."
 POR_strategic_logistics_command_support:0 "Strategic Logistics Command"
 POR_land_systems_industry:0 "Land Systems Industry"
 POR_land_systems_industry_desc:0 "Who builds and maintains the army's equipment? The answer depends on who governs: allied supply chains, a public arsenal, or sovereign production."
 POR_modern_land_forces:0 "Modern Land Forces"
 POR_modern_land_forces_desc:0 "People, training and equipment finally in balance. The readiness problems of 2025 are closed."
 POR_needs_defence_balance_tt:0 "§YRecruitment§!, §YTraining§! and §YEquipment§! are all at least §Y50§!"
 POR_air_force_modernisation_plan:0 "Air Force Modernisation Plan"
 POR_air_force_modernisation_plan_desc:0 "The fighter fleet is flying towards the end of its life. A two-year transition programme begins before the airframes decide the matter themselves."
 POR_pilot_training_programme:0 "Pilot Training Programme"
 POR_pilot_training_programme_desc:0 "More flying hours, modern trainers, instructors kept from leaving for the airlines."
 POR_maintenance_and_sustainment:0 "Maintenance and Sustainment"
 POR_maintenance_and_sustainment_desc:0 "Hangars, spares and technicians. An aircraft on the ground waiting for a part is the most expensive kind."
 POR_airbase_infrastructure:0 "Airbase Infrastructure"
 POR_airbase_infrastructure_desc:0 "Beja and Lajes expanded and hardened: runways, shelters, fuel."
 POR_buy_allied_fighters:0 "Buy Allied Fighters"
 POR_buy_allied_fighters_desc:0 "A proven aircraft from an ally, off the shelf: fast, interoperable, and dependent on someone else's factory."
 POR_a_european_fighter_consortium:0 "A European Fighter Consortium"
 POR_a_european_fighter_consortium_desc:0 "Join a European programme as an industrial partner. Slower and costlier now; work for Portuguese engineers for decades."
 POR_radar_and_air_defence_integration:0 "Radar and Air Defence Integration"
 POR_radar_and_air_defence_integration_desc:0 "Mainland and island radars joined in one picture, shared with the allied network."
 POR_domestic_aerospace_development:0 "Domestic Aerospace Development"
 POR_domestic_aerospace_development_desc:0 "The maintenance works at Alverca and the factories at Evora grow from subcontractors into an aerospace cluster."
 POR_nato_air_interoperability:0 "NATO Air Interoperability"
 POR_nato_air_interoperability_desc:0 "Air policing rotations, common procedures, shared exercises over the Atlantic."
 POR_integrated_air_defence:0 "Integrated Air Defence"
 POR_integrated_air_defence_desc:0 "Sensors, command and ground-based defences under one authority."
 POR_a_modern_air_force:0 "A Modern Air Force"
 POR_a_modern_air_force_desc:0 "New aircraft, trained crews, an industry behind them. The ageing fleet is retired."
 POR_atlantic_maritime_strategy:0 "Atlantic Maritime Strategy"
 POR_atlantic_maritime_strategy_desc:0 "One of the largest maritime zones in Europe and a navy sized for a much smaller one. Decide what must be patrolled, protected and deterred."
 POR_naval_bases_and_maintenance:0 "Naval Bases and Maintenance"
 POR_naval_bases_and_maintenance_desc:0 "The Lisbon naval base and the Alfeite arsenal modernised: ships that are repaired on time are ships that exist."
 POR_maritime_surveillance:0 "Maritime Surveillance"
 POR_maritime_surveillance_desc:0 "Coastal radar, patrol aircraft and satellites watching the sea between the mainland, Madeira and the Azores."
 POR_shipbuilding_revival:0 "Shipbuilding Revival"
 POR_shipbuilding_revival_desc:0 "The yards of Viana do Castelo get orders again, starting with the navy's own patrol vessels."
 POR_ocean_patrol_priority:0 "Ocean Patrol Priority"
 POR_ocean_patrol_priority_desc:0 "Many long-range patrol vessels for presence across the whole maritime zone: fisheries, rescue, sovereignty."
 POR_escort_and_frigate_priority:0 "Escort and Frigate Priority"
 POR_escort_and_frigate_priority_desc:0 "Fewer, more capable frigates for escort and anti-submarine work alongside the allies."
 POR_the_atlantic_surveillance_network:0 "The Atlantic Surveillance Network"
 POR_the_atlantic_surveillance_network_desc:0 "The islands become the anchor of a permanent picture of the mid-Atlantic."
 POR_the_portuguese_shipbuilding_initiative:0 "The Portuguese Shipbuilding Initiative"
 POR_the_portuguese_shipbuilding_initiative_desc:0 "A long-term order book and a design office: the navy as the first customer of a national industry."
 POR_fleet_modernisation_programme:0 "Fleet Modernisation Programme"
 POR_fleet_modernisation_programme_desc:0 "Two years of new construction and mid-life upgrades on the chosen fleet priority."
 POR_nato_maritime_cooperation:0 "NATO Maritime Cooperation"
 POR_nato_maritime_cooperation_desc:0 "Standing naval groups, shared surveillance data, allied use of Portuguese ports."
 POR_guardian_of_the_atlantic:0 "Guardian of the Atlantic"
 POR_guardian_of_the_atlantic_desc:0 "The responsibilities have not shrunk. The navy has finally grown to meet them."
 # ---- ECONOMY ----
 POR_the_state_of_the_economy:0 "The State of the Economy"
 POR_the_state_of_the_economy_desc:0 "Growth above the European average, wages below it, productivity stuck, the young leaving. An honest diagnosis before the prescriptions."
 POR_public_finances_review:0 "Public Finances Review"
 POR_public_finances_review_desc:0 "The debt has come down at a price. How much room is there, and who gets it?"
 POR_the_infrastructure_backlog:0 "The Infrastructure Backlog"
 POR_the_infrastructure_backlog_desc:0 "Railways planned in the 1990s, an airport debated for fifty years. Start with what is already designed."
 POR_workforce_and_skills:0 "Workforce and Skills"
 POR_workforce_and_skills_desc:0 "Train the people the economy needs, and give the ones already trained a reason to stay."
 POR_balanced_books:0 "Balanced Books"
 POR_balanced_books_desc:0 "Surpluses, falling debt, credibility with lenders. Growth through confidence, with less to spend today."
 POR_balanced_books_clears_pressure_tt:0 "Fiscal consolidation ends §YBudget Pressure§!."
 POR_investment_led_growth:0 "Investment-Led Growth"
 POR_investment_led_growth_desc:0 "Use the fiscal room while it exists. More construction now, a higher bill for households."
 POR_tax_reform:0 "Tax Reform"
 POR_tax_reform_desc:0 "Everyone agrees the system needs reform. Which reform depends entirely on who is governing."
 POR_tax_reform_montenegro_tt:0 "§YMontenegro:§! lower business taxes."
 POR_tax_reform_santos_tt:0 "§YSantos:§! a more progressive system."
 POR_tax_reform_ventura_tt:0 "§YVentura:§! broad tax cuts."
 POR_private_investment_incentives:0 "Private Investment Incentives"
 POR_private_investment_incentives_desc:0 "Tax credits, fast licensing and stable rules to bring private capital in."
 POR_a_public_investment_plan:0 "A Public Investment Plan"
 POR_a_public_investment_plan_desc:0 "The state as lead investor in networks and strategic industries."
 POR_infrastructure_renewal:0 "Infrastructure Renewal"
 POR_infrastructure_renewal_desc:0 "An eighteen-month campaign of rail, road and network works."
 POR_ports_of_the_atlantic:0 "Ports of the Atlantic"
 POR_ports_of_the_atlantic_desc:0 "Sines as a deep-water gateway to Europe, with Leixoes and Lisbon behind it."
 POR_the_housing_emergency:0 "The Housing Emergency"
 POR_the_housing_emergency_desc:0 "Rents in Lisbon and Porto have outrun wages for a decade. Declare it what it is."
 POR_build_the_homes:0 "Build the Homes"
 POR_build_the_homes_desc:0 "Public, private or both: tens of thousands of homes people on Portuguese wages can afford."
 POR_public_housing_bonus_tt:0 "The §Ypublic housing programme§! delivers:"
 POR_private_builders_bonus_tt:0 "§YInvestment Incentives§! bring private builders in:"
 POR_technology_and_startups:0 "Technology and Startups"
 POR_technology_and_startups_desc:0 "Lisbon already hosts the conferences. Keep the companies too."
 POR_the_digital_atlantic_hub:0 "The Digital Atlantic Hub"
 POR_the_digital_atlantic_hub_desc:0 "Submarine cables land in Portugal from three continents. Data centres, research and a space port in the Azores follow the cables."
 POR_tourism_and_services:0 "Tourism and Services"
 POR_tourism_and_services_desc:0 "Quality over volume: higher-value tourism and exportable services."
 POR_industrial_diversification:0 "Industrial Diversification"
 POR_industrial_diversification_desc:0 "Components, pharmaceuticals, batteries, moulds: industry beyond the traditional sectors, especially in the interior."
 POR_agriculture_and_the_interior:0 "Agriculture and the Interior"
 POR_agriculture_and_the_interior_desc:0 "Water, roads and services for the half of the country that is emptying."
 POR_energy_resilience_programme:0 "Energy Resilience Programme"
 POR_energy_resilience_programme_desc:0 "The answer to 28 April 2025: black-start capacity, grid monitoring and emergency planning so that a failure stays local."
 POR_grid_lessons_bonus_tt:0 "§YLessons of the blackout§! were recorded during the recovery:"
 POR_unlock_grid_decisions_tt:0 "Opens the §YEnergy Resilience§! decisions."
 POR_storage_and_interconnectors:0 "Storage and Interconnectors"
 POR_storage_and_interconnectors_desc:0 "Battery parks, pumped hydro and stronger links through Spain to the rest of Europe."
 POR_a_modern_portuguese_economy:0 "A Modern Portuguese Economy"
 POR_a_modern_portuguese_economy_desc:0 "Diversified, connected, resilient. The structural weaknesses of 2025 no longer define the country."
 POR_review_public_services_tech:0 "Review of the Public Services"
 POR_investing_in_education_industry:0 "Investing in Education"
 por_46_industry:0 "Competitiveness: Industry"
 por_46_technology:0 "Competitiveness: Technology"
 POR_dec_azores_space_port:0 "Azores Space Port"
 POR_ventura_import_cost_tt:0 "§YVentura:§! buying abroad sits badly with a sovereignty platform."
 POR_brussels_friction_cost_tt:0 "§YBrussels Friction§! makes European partners harder to convince."
 POR_santos_public_stake_tt:0 "§YSantos:§! the state takes a stake and guarantees the jobs."
 POR_montenegro_nato_bonus_tt:0 "§YMontenegro:§! the Atlantic priority pays off."
 POR_ventura_national_yards_tt:0 "§YVentura:§! national yards, national crews."
 POR_unlock_parliament_tt:0 "Opens the §YAssembly of the Republic§! decisions."
 POR_needs_parl_50_tt:0 "§YParliamentary Support§! is at least §Y50§!"
 # ---- NATIONAL SPIRITS ----
 POR_political_uncertainty:0 "Political Uncertainty"
 POR_political_uncertainty_desc:0 "Short-lived governments, a fragmented Assembly and a presidential election on the horizon. Nobody plans beyond the next vote. It ends with the inauguration of March 2026."
 POR_footballing_nation:0 "A Footballing Nation"
 POR_footballing_nation_desc:0 "The country of Eusebio, Luis Figo and Cristiano Ronaldo. Football is part of how Portugal sees itself and most of how the world sees Portugal."
 POR_structural_economic_challenges:0 "Structural Economic Challenges"
 POR_structural_economic_challenges_desc:0 "Low productivity, low wages, slow licensing and an ageing population. Improved in three stages by Economy focuses; removed by the focus A Modern Portuguese Economy."
 POR_housing_pressure:0 "Housing Pressure"
 POR_housing_pressure_desc:0 "Rents and prices far ahead of wages; the young emigrate or stay with their parents. Replaced by the focus Build the Homes."
 POR_army_readiness_problems:0 "Army Readiness Problems"
 POR_army_readiness_problems_desc:0 "Undermanned units, old equipment, recruits who do not stay. Improved in three stages by Army focuses; removed by the focus Modern Land Forces."
 POR_ageing_aircraft_fleet:0 "Ageing Aircraft Fleet"
 POR_ageing_aircraft_fleet_desc:0 "Fighters bought in the 1990s, kept flying by skill and spare parts. Improved in three stages by Air Force focuses; removed by the focus A Modern Air Force."
 POR_atlantic_naval_responsibilities:0 "Atlantic Naval Responsibilities"
 POR_atlantic_naval_responsibilities_desc:0 "A vast maritime zone and a small, hard-worked fleet that spends too long in the yard. Improved in three stages by Navy focuses; removed by the focus Guardian of the Atlantic."
 POR_madeira_political_crisis:0 "The Madeira Political Crisis"
 POR_madeira_political_crisis_desc:0 "The Regional Parliament has been dissolved. Until the islands vote, the crisis in Funchal is a preview of the one in Lisbon."
 POR_parl_fragile:0 "Fragile Parliament"
 POR_parl_fragile_desc:0 "Parliamentary Support is below 40. Every vote is a negotiation and every negotiation may be the last."
 POR_parl_working:0 "Working Parliament"
 POR_parl_working_desc:0 "Parliamentary Support is between 40 and 69. Bills pass, slowly."
 POR_parl_stable:0 "Stable Majority"
 POR_parl_stable_desc:0 "Parliamentary Support is 70 or more. The government can plan in years."
 POR_caretaker_government:0 "Caretaker Government"
 POR_caretaker_government_desc:0 "After a lost confidence vote the government only manages current affairs. Expires after 120 days."
 POR_blackout_disruption:0 "Blackout Disruption"
 POR_blackout_disruption_desc:0 "Trains stopped, networks down, shops and factories closed. Ends when the recovery is assessed, ten days after the blackout."
 POR_blackout_aftermath:0 "Iberian Blackout Aftermath"
 POR_blackout_aftermath_desc:0 "The power is back; the confidence is not, quite. Removed by the focus Energy Resilience Programme."
 POR_blackout_aftermath_severe:0 "Iberian Blackout Aftermath (Severe)"
 POR_blackout_aftermath_severe_desc:0 "A badly handled recovery left losses, anger and a long list of questions. Removed by the focus Energy Resilience Programme."
 POR_strong_mandate:0 "Strong Mandate"
 POR_strong_mandate_desc:0 "Elected in the first round. For one year, few dare to cross the new President."
 POR_contested_mandate:0 "Contested Mandate"
 POR_contested_mandate_desc:0 "A narrow runoff victory. For one year, half the country acts as if the election were still on."
 POR_government_seeking_stability:0 "A Government Seeking Stability"
 POR_government_seeking_stability_desc:0 "President Montenegro's first goal is modest and hard: institutions that cooperate. Upgraded by the focus Stability Delivered."
 POR_stable_institutions:0 "Stable Institutions"
 POR_stable_institutions_desc:0 "President, government and Assembly work to a shared calendar. Parliamentary Support no longer erodes by itself."
 POR_competitive_economy:0 "A Competitive Economy"
 POR_competitive_economy_desc:0 "Lower taxes and predictable rules attract investment."
 POR_lean_administration:0 "Lean Administration"
 POR_lean_administration_desc:0 "Fewer forms, shorter deadlines, a state that answers."
 POR_atlantic_partnership:0 "The Atlantic Partnership"
 POR_atlantic_partnership_desc:0 "Closer work with the Atlantic allies at sea and in the air."
 POR_social_renewal_programme:0 "Social Renewal Programme"
 POR_social_renewal_programme_desc:0 "President Santos pushes health, housing and wages to the top of every agenda. Upgraded by the focus The Social Republic."
 POR_social_republic:0 "The Social Republic"
 POR_social_republic_desc:0 "Stronger public services and a more active state, paid for by households and firms."
 POR_sns_rebuilt:0 "A Rebuilt Health Service"
 POR_sns_rebuilt_desc:0 "Family doctors, open emergency rooms, staff who stay."
 POR_fair_labour_market:0 "A Fairer Labour Market"
 POR_fair_labour_market_desc:0 "Stable contracts and stronger bargaining: more productive workers, costlier expansion."
 POR_budget_pressure:0 "Budget Pressure"
 POR_budget_pressure_desc:0 "Borrowing for the programme has reopened the deficit. Ended by trimming the programme or by the focus Balanced Books."
 POR_national_transformation:0 "National Transformation"
 POR_national_transformation_desc:0 "President Ventura governs in permanent confrontation with the old parties. Replaced by the focus A New Political Order."
 POR_new_political_order:0 "A New Political Order"
 POR_new_political_order_desc:0 "A revised settlement with a stronger presidency and stricter rules for public office. Europe keeps its distance."
 POR_institutional_deadlock:0 "Institutional Deadlock"
 POR_institutional_deadlock_desc:0 "The revision was forced without the votes. President and Assembly block each other, and Parliamentary Support erodes faster."
 POR_accountability_drive:0 "Accountability Drive"
 POR_accountability_drive_desc:0 "Audits, declarations and faster trials."
 POR_border_control_regime:0 "Border Control Regime"
 POR_border_control_regime_desc:0 "Quotas and controls reduce arrivals, and the labour supply with them."
 POR_brussels_friction:0 "Brussels Friction"
 POR_brussels_friction_desc:0 "A confrontational line on selected European policies has a price in trade and goodwill."
 POR_budget_restraint:0 "Budget of Restraint"
 POR_budget_restraint_desc:0 "The 2028 budget holds spending down. Lasts one year."
 POR_budget_expansion:0 "Budget of Investment"
 POR_budget_expansion_desc:0 "The 2028 budget spends on public works. Lasts one year."
 POR_footballing_legacy:0 "The Footballing Legacy"
 POR_footballing_legacy_desc:0 "A career that ended is now a national inheritance: pride at home, a calling card abroad."
 POR_national_renewal_movement:0 "The National Renewal Movement"
 POR_national_renewal_movement_desc:0 "A civic movement built on one man's popularity, promising national confidence and international prominence. Becomes the Renewal Presidency if its founder takes office."
 POR_renewal_presidency:0 "The Renewal Presidency"
 POR_renewal_presidency_desc:0 "Enthusiasm, expectations and spending, all high. Upgraded by the focus Portugal Reborn."
 POR_portugal_reborn_idea:0 "Portugal Reborn"
 POR_portugal_reborn_idea_desc:0 "A confident country that set large goals and met enough of them."
 POR_nation_in_uniform_debate:0 "A Nation in Uniform? (Debate)"
 POR_nation_in_uniform_debate_desc:0 "The country argues about compulsory service. Lasts 240 days, or until a service model is adopted."
 POR_servico_nacional_idea:0 "Servico Nacional"
 POR_servico_nacional_idea_desc:0 "National service for every young citizen. Far more people available and far more to train, house and pay."
 POR_voluntary_national_corps:0 "Voluntary National Corps"
 POR_voluntary_national_corps_desc:0 "A respected, well-paid volunteer corps. Fewer people, better motivated."
 POR_million_ambition:0 "The Million Ambition"
 POR_million_ambition_desc:0 "A million participants is a political target, not a headcount. Recruitment grows year by year while the state reorganises, expensively, around the goal."
 POR_international_volunteers:0 "International Volunteers"
 POR_international_volunteers_desc:0 "Volunteers from the Portuguese-speaking world and the diaspora serve under a special statute."
 POR_arsenal_of_the_atlantic_idea:0 "Arsenal of the Atlantic"
 POR_arsenal_of_the_atlantic_idea_desc:0 "A national defence industry built at speed and at cost."
 POR_renaissance_works:0 "Renaissance Works"
 POR_renaissance_works_desc:0 "Two years of public works on an unprecedented scale. Ends after 720 days or with the focus The Bill Comes Due."
 POR_selecao_economy:0 "The Selecao Economy"
 POR_selecao_economy_desc:0 "Sport, media and tourism technology grown around the country's best-known name."
 POR_renaissance_debt:0 "Renaissance Debt"
 POR_renaissance_debt_desc:0 "The programme is being repaid over decades."
 POR_renaissance_dividend:0 "Renaissance Dividend"
 POR_renaissance_dividend_desc:0 "The new networks earn their keep."
 POR_lusophone_sphere_1:0 "Lusophone Partnership"
 POR_lusophone_sphere_1_desc:0 "One or two partnership treaties are in force."
 POR_lusophone_sphere_2:0 "Lusophone Community"
 POR_lusophone_sphere_2_desc:0 "Three or four partnership treaties are in force."
 POR_lusophone_sphere_3:0 "Lusophone Commonwealth"
 POR_lusophone_sphere_3_desc:0 "Five or more partnership treaties are in force."
 POR_fifth_empire:0 "The Fifth Empire"
 POR_fifth_empire_desc:0 "A Portuguese-speaking community of nations that chose each other, with Lisbon as its meeting place."
 POR_iberian_dialogue:0 "The Iberian Dialogue"
 POR_iberian_dialogue_desc:0 "Negotiations with Spain are open. Trade grows; so do worries about sovereignty."
 POR_iberian_union_institutions:0 "Iberian Union Institutions"
 POR_iberian_union_institutions_desc:0 "Two sovereign states with shared institutions for energy, transport and civil protection, and a common voice abroad."
 POR_iberian_rejection:0 "The Iberian Rejection"
 POR_iberian_rejection_desc:0 "Madrid said no. Lasts one year."
 POR_army_procurement_drive:0 "Army Procurement Drive"
 POR_army_procurement_drive_desc:0 "An eighteen-month push to replace basic equipment. Expires after 540 days."
 POR_professional_army_reforms:0 "Professional Army Reforms"
 POR_professional_army_reforms_desc:0 "A smaller, career army at high readiness."
 POR_expanded_reserve_system:0 "Expanded Reserve System"
 POR_expanded_reserve_system_desc:0 "A large trained reserve behind a modest active force. Superseded if Servico Nacional is adopted."
 POR_national_service_debate:0 "National Service Debate"
 POR_national_service_debate_desc:0 "Parliament and the press argue about conscription. Expires after 180 days."
 POR_nato_interoperable_army:0 "NATO-Interoperable Army"
 POR_nato_interoperable_army_desc:0 "Allied standards, allied supply chains, gradual procurement."
 POR_public_arsenal:0 "Public Arsenal"
 POR_public_arsenal_desc:0 "State-owned defence works with guaranteed jobs and guaranteed costs."
 POR_sovereign_procurement:0 "Sovereign Procurement"
 POR_sovereign_procurement_desc:0 "National control of production and maintenance, whatever partners think of it."
 POR_land_systems_industry_idea:0 "Land Systems Industry"
 POR_land_systems_industry_idea_desc:0 "Domestic production and maintenance of the army's equipment."
 POR_modern_land_forces_idea:0 "Modern Land Forces"
 POR_modern_land_forces_idea_desc:0 "People, training and equipment in balance."
 POR_defence_budget_strain:0 "Defence Budget Strain"
 POR_defence_budget_strain_desc:0 "Defence spending is growing faster than the budget can carry. Disappears when Budget Strain falls below 45."
 POR_pilot_training_programme_idea:0 "Pilot Training Programme"
 POR_pilot_training_programme_idea_desc:0 "More hours, better trainers, fewer accidents."
 POR_aircraft_modernisation_programme:0 "Aircraft Modernisation Programme"
 POR_aircraft_modernisation_programme_desc:0 "Two fleets at once during the transition. Expires after 730 days or with the focus A Modern Air Force."
 POR_allied_fighter_fleet:0 "Allied Fighter Fleet"
 POR_allied_fighter_fleet_desc:0 "A proven allied aircraft, bought off the shelf."
 POR_european_fighter_partner:0 "European Fighter Partner"
 POR_european_fighter_partner_desc:0 "An industrial share in a European combat aircraft."
 POR_integrated_air_defence_idea:0 "Integrated Air Defence"
 POR_integrated_air_defence_idea_desc:0 "One picture of the sky, one command to act on it."
 POR_domestic_aerospace_development_idea:0 "Domestic Aerospace Development"
 POR_domestic_aerospace_development_idea_desc:0 "An aerospace cluster around maintenance and components."
 POR_modern_air_force:0 "A Modern Air Force"
 POR_modern_air_force_desc:0 "New aircraft, trained crews, an industry behind them."
 POR_improved_naval_maintenance:0 "Improved Naval Maintenance"
 POR_improved_naval_maintenance_desc:0 "Ships leave the yard on schedule."
 POR_ocean_patrol_fleet:0 "Ocean Patrol Fleet"
 POR_ocean_patrol_fleet_desc:0 "Presence across the whole maritime zone."
 POR_escort_fleet:0 "Escort Fleet"
 POR_escort_fleet_desc:0 "Frigates built for escort and anti-submarine work."
 POR_fleet_modernisation_programme_idea:0 "Fleet Modernisation Programme"
 POR_fleet_modernisation_programme_idea_desc:0 "New construction and upgrades. Expires after 730 days."
 POR_atlantic_surveillance_network:0 "Atlantic Surveillance Network"
 POR_atlantic_surveillance_network_desc:0 "Mainland and islands share one picture of the sea."
 POR_portuguese_shipbuilding_initiative:0 "Portuguese Shipbuilding Initiative"
 POR_portuguese_shipbuilding_initiative_desc:0 "National yards with a long-term order book."
 POR_atlantic_guardian:0 "Guardian of the Atlantic"
 POR_atlantic_guardian_desc:0 "A navy sized for the ocean it answers for."
 POR_balanced_books_idea:0 "Balanced Books"
 POR_balanced_books_idea_desc:0 "Surpluses and falling debt."
 POR_investment_led_growth_idea:0 "Investment-Led Growth"
 POR_investment_led_growth_idea_desc:0 "Spend now, grow later."
 POR_investment_incentives:0 "Investment Incentives"
 POR_investment_incentives_desc:0 "Private capital is welcome and knows it."
 POR_public_investment_plan:0 "Public Investment Plan"
 POR_public_investment_plan_desc:0 "The state leads on networks and strategic industry."
 POR_infrastructure_renewal_idea:0 "Infrastructure Renewal"
 POR_infrastructure_renewal_idea_desc:0 "A national works campaign. Expires after 540 days."
 POR_housing_relief:0 "Housing Relief"
 POR_housing_relief_desc:0 "New homes are reaching the people who needed them."
 POR_tourism_services_economy:0 "Tourism and Services Economy"
 POR_tourism_services_economy_desc:0 "Higher-value tourism and exportable services."
 POR_industrial_diversification_idea:0 "Industrial Diversification"
 POR_industrial_diversification_idea_desc:0 "New industries beyond the traditional sectors."
 POR_digital_atlantic_hub:0 "Digital Atlantic Hub"
 POR_digital_atlantic_hub_desc:0 "Cables, data centres and research."
 POR_energy_resilience_programme_idea:0 "Energy Resilience Programme"
 POR_energy_resilience_programme_idea_desc:0 "Black-start capacity, monitoring and emergency plans. Upgraded by the focus Storage and Interconnectors."
 POR_resilient_grid:0 "A Resilient Grid"
 POR_resilient_grid_desc:0 "Storage and interconnection: a failure now stays local."
 POR_modern_economy:0 "A Modern Economy"
 POR_modern_economy_desc:0 "Diversified, connected and resilient."
 # ---- CHARACTER, PARTY, NAMES ----
 POR_cristiano_ronaldo:0 "Cristiano Ronaldo"
 POR_cristiano_ronaldo_desc:0 "§YFictional alternate-history portrayal.§!\n\nCristiano Ronaldo dos Santos Aveiro was born in Funchal, Madeira, on 5 February 1985, and became one of the most recognisable footballers in the world and the long-serving captain of the national team.\n\nIn this timeline he left the national team in November 2026, retired from football in June 2027 and founded a movement for national renewal. On 10 June 2030, aged 45, he was sworn in as President of the Republic."
 POR_o_capitao:0 "O Capitao"
 POR_o_capitao_desc:0 "Admired at home and known everywhere abroad, with more confidence than political experience."
 POR_IBERIAN_UNION:0 "Iberian Union"
 POR_IBERIAN_UNION_DEF:0 "the Iberian Union"
 POR_IBERIAN_UNION_ADJ:0 "Iberian"
 POR_european_partner:0 "European Partner"
 POR_atlantic_ally:0 "Atlantic Ally"
 POR_lusophone_ties:0 "Lusophone Ties"
 POR_world_cup_partners:0 "World Cup Co-Hosts"
 POR_iberian_partner:0 "Iberian Partner"
 POR_state_visit:0 "State Visit"
 POR_cultural_mission:0 "Cultural Mission"
 POR_border_dispute:0 "Border Controls"
 POR_cold_shoulder:0 "Deferred Commitments"
 POR_luso_treaty:0 "Lusophone Partnership Treaty"
 POR_iberian_union_treaty:0 "Iberian Union Treaty"
 POR_parl_p5_tt:0 "Parliamentary Support: §G+5§!"
 POR_parl_m5_tt:0 "Parliamentary Support: §R-5§!"
 POR_parl_p10_tt:0 "Parliamentary Support: §G+10§!"
 POR_parl_m10_tt:0 "Parliamentary Support: §R-10§!"
 POR_parl_p15_tt:0 "Parliamentary Support: §G+15§!"
 POR_parl_m15_tt:0 "Parliamentary Support: §R-15§!"
 POR_conf_p5_tt:0 "Public Confidence: §G+5§!"
 POR_conf_m5_tt:0 "Public Confidence: §R-5§!"
 POR_mom_p5_tt:0 "Campaign Momentum: §G+5§!"
 POR_mom_m5_tt:0 "Campaign Momentum: §R-5§!"
 POR_conf_p10_tt:0 "Public Confidence: §G+10§!"
 POR_conf_m10_tt:0 "Public Confidence: §R-10§!"
 POR_mom_p10_tt:0 "Campaign Momentum: §G+10§!"
 POR_mom_m10_tt:0 "Campaign Momentum: §R-10§!"
