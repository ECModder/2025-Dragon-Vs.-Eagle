 POR_army_reform_1:0 "Army Recovery Plan"
 POR_army_reform_1_desc:0 "The readiness audit is published and the worst gaps are being filled. Stage 1 of 3; the focus Modern Land Forces completes it."
 POR_army_reform_2:0 "Army Reform Programme"
 POR_army_reform_2_desc:0 "Units are back to strength and training on a regular cycle. Stage 2 of 3."
 POR_army_reform_3:0 "Army Transformation"
 POR_army_reform_3_desc:0 "Training, logistics and readiness work as one system. Stage 3 of 3."
 POR_air_reform_1:0 "Air Fleet Transition"
 POR_air_reform_1_desc:0 "Old and new aircraft fly side by side while the force changes over. Stage 1 of 3; the focus A Modern Air Force completes it."
 POR_air_reform_2:0 "Air Force Renewal"
 POR_air_reform_2_desc:0 "Maintenance and crews have caught up with the fleet. Stage 2 of 3."
 POR_air_reform_3:0 "Air Force Transformation"
 POR_air_reform_3_desc:0 "Sensors, aircraft and bases are integrated. Stage 3 of 3."
 POR_navy_reform_1:0 "Maritime Strategy Adopted"
 POR_navy_reform_1_desc:0 "The navy knows what it must cover; it is not yet able to. Stage 1 of 3; the focus Guardian of the Atlantic completes it."
 POR_navy_reform_2:0 "Fleet Renewal"
 POR_navy_reform_2_desc:0 "Ships leave the yard on time and see further. Stage 2 of 3."
 POR_navy_reform_3:0 "Atlantic Fleet Transformation"
 POR_navy_reform_3_desc:0 "Bases, sensors and ships cover the whole maritime zone. Stage 3 of 3."
 POR_economy_reform_1:0 "Economic Diagnosis"
 POR_economy_reform_1_desc:0 "The weaknesses are named and costed. Stage 1 of 3; the focus A Modern Portuguese Economy completes it."
 POR_economy_reform_2:0 "Economic Reform Programme"
 POR_economy_reform_2_desc:0 "Licensing is faster and the networks are being rebuilt. Stage 2 of 3."
 POR_economy_reform_3:0 "Economic Transformation"
 POR_economy_reform_3_desc:0 "New industries and better infrastructure are lifting productivity. Stage 3 of 3."
 POR_defence_industrial_base:0 "Defence Industrial Base"
 POR_defence_industrial_base_desc:0 "Arms, vehicles, aircraft parts and ships built and maintained in Portugal."
 POR_defence_dividend_idea:0 "Defence Dividend"
 POR_defence_dividend_idea_desc:0 "Defence orders have left skills, suppliers and exports behind them."
 POR_dual_use_technology_idea:0 "Dual-Use Technology"
 POR_dual_use_technology_idea_desc:0 "Radar, satellite and data work done for the armed forces now feeds civilian firms, and the reverse."
 POR_wildfire_readiness:0 "Wildfire Readiness"
 POR_wildfire_readiness_desc:0 "Firebreaks cleared, aircraft contracted and crews pre-positioned before the summer. Lasts one year."
 POR_2026_budget:0 "The 2026 State Budget"
 POR_2026_budget_desc:0 "A budget voted on time, with its investment lines intact. Lasts one year."
 # ---- REDESIGN: new focuses ----
 POR_wildfire_season_plan:0 "The Wildfire Season Plan"
 POR_wildfire_season_plan_desc:0 "Every summer the interior burns. Clear the firebreaks, contract the aircraft and position the crews before July, not after the first fire."
 POR_wildfire_in_time_tt:0 "§GReady before 1 July 2025:§!"
 POR_wildfire_late_tt:0 "§RToo late for this summer:§! only a small benefit."
 POR_a_budget_for_2026:0 "A Budget for 2026"
 POR_a_budget_for_2026_desc:0 "The State Budget must pass the Assembly before December. Without a majority the country runs on monthly twelfths of last year's budget."
 POR_budget_passed_tt:0 "§GParliamentary Support 50 or more:§! the budget passes."
 POR_budget_twelfths_tt:0 "§RParliamentary Support below 50:§! the country runs on twelfths of the old budget."
 POR_army_light_aviation:0 "Army Light Aviation"
 POR_army_light_aviation_desc:0 "Give the Army its own helicopters again for transport, evacuation and support to the brigades."
 POR_unmanned_systems_battalion:0 "Unmanned Systems Battalion"
 POR_unmanned_systems_battalion_desc:0 "Drones and counter-drone systems for the brigades, built with Portuguese technology firms. Needs §YTechnology and Startups§! or §YDual-Use Technology§! from the Economy branch."
 POR_unmanned_systems_battalion_elec:0 "Unmanned Systems Battalion"
 POR_national_armoured_vehicle_programme:0 "National Armoured Vehicle Programme"
 POR_national_armoured_vehicle_programme_desc:0 "Replace the old tracked carriers with vehicles assembled and maintained in Portugal. Needs §YDefence Industrial Strategy§! from the Economy branch."
 POR_super_tucano_trainers:0 "Super Tucano Trainers"
 POR_super_tucano_trainers_desc:0 "The light attack and training aircraft ordered in 2024 enter service: pilots train on them before the jets, and they cost far less per flying hour."
 POR_kc390_industrial_partnership:0 "KC-390 Industrial Partnership"
 POR_kc390_industrial_partnership_desc:0 "Portuguese firms already build parts of the KC-390. Make Portugal the aircraft's European maintenance and assembly partner. Needs §YIndustrial Diversification§! or §YDefence Industrial Strategy§!."
 POR_npo3s_patrol_vessels:0 "Six New Patrol Vessels"
 POR_npo3s_patrol_vessels_desc:0 "A third series of ocean patrol vessels from Viana do Castelo, with drones and space for the islands' missions."
 POR_viana_order_book:0 "The Viana Order Book"
 POR_viana_order_book_desc:0 "Naval orders and civilian ships together keep the northern yards busy for a decade. Needs §YPorts of the Atlantic§! from the Economy branch."
 POR_multipurpose_ship:0 "The Multipurpose Ship"
 POR_multipurpose_ship_desc:0 "A ship that carries drones, marines, hospitals and disaster relief: the navy's answer to an ocean too large for frigates alone."
 POR_next_generation_frigates:0 "Next-Generation Frigates"
 POR_next_generation_frigates_desc:0 "The frigates of the 1990s cannot sail forever. Their successors are the largest naval order in a generation, and the treasury must be able to carry it."
 POR_needs_fiscal_course_tt:0 "A fiscal course or defence industry is in place: §YBalanced Books§!, §YInvestment-Led Growth§!, §YA Modern Economy§! or §YDefence Industrial Base§!"
 POR_defence_industrial_strategy:0 "Defence Industrial Strategy"
 POR_defence_industrial_strategy_desc:0 "Turn scattered suppliers into a defence industry with a long-term plan and guaranteed orders."
 POR_defence_industrial_strategy_tt:0 "Unlocks §YNational Armoured Vehicle Programme§! (Army) and §YKC-390 Industrial Partnership§! (Air Force)."
 POR_defence_dividend:0 "The Defence Dividend"
 POR_defence_dividend_desc:0 "Defence orders have left skills, suppliers and exports behind them. Needs two of: §YLand Systems Industry§!, §YDomestic Aerospace Development§!, §YThe Portuguese Shipbuilding Initiative§!, §YKC-390 Industrial Partnership§!."
 POR_needs_two_defence_industries_tt:0 "At least §Y2§! of the four defence-industry focuses are completed"
 POR_dual_use_technology:0 "Dual-Use Technology"
 POR_dual_use_technology_desc:0 "Sensor and data work from the armed forces feeds civilian firms. Needs §YRadar and Air Defence Integration§! or §YMaritime Surveillance§!."
 # ==== THIRD PASS: focuses ====
 POR_m_second_wave_of_reforms:0 "The Second Wave of Reforms"
 POR_m_second_wave_of_reforms_desc:0 "Stability was the first promise. With it delivered, the Presidency can ask for the reforms that need a government sure of its next budget."
 POR_m_justice_reform:0 "Justice Reform"
 POR_m_justice_reform_desc:0 "Trials that take a decade are a tax on everyone. Faster procedure, specialised courts, digital case files."
 POR_m_digital_state:0 "The Digital State"
 POR_m_digital_state_desc:0 "One identity, one portal, every public service online. The state Portuguese citizens already expect from their banks."
 POR_m_a_fiscal_rule:0 "A Fiscal Rule"
 POR_m_a_fiscal_rule_desc:0 "Write the surplus into law so that no future government can spend the windfall of a good year."
 POR_m_pension_sustainability:0 "Pension Sustainability"
 POR_m_pension_sustainability_desc:0 "An ageing country cannot avoid this debate. Gradual changes now, agreed with the opposition, instead of brutal ones later."
 POR_m_european_funds_machine:0 "A European Funds Machine"
 POR_m_european_funds_machine_desc:0 "Money from Brussels has too often arrived and gone unspent. A dedicated agency turns allocations into projects in the interior."
 POR_m_capital_markets_union:0 "Capital Markets Union"
 POR_m_capital_markets_union_desc:0 "Portuguese firms borrow from banks or not at all. Joining Europe's capital markets gives them another way to grow."
 POR_m_a_grand_coalition:0 "A Grand Coalition"
 POR_m_a_grand_coalition_desc:0 "The two parties that built the democracy govern it together for a legislature. It buys peace in the Assembly and gives the populists the opposition to themselves."
 POR_m_a_reformist_majority:0 "A Reformist Majority"
 POR_m_a_reformist_majority_desc:0 "With public confidence high, the centre-right asks the voters for a majority of its own and the freedom to finish the job."
 POR_m_the_portuguese_model:0 "The Portuguese Model"
 POR_m_the_portuguese_model_desc:0 "A small country that grew faster than its neighbours and governed calmly. Other capitals start to ask how it was done."
 POR_s_green_transition_fund:0 "The Green Transition Fund"
 POR_s_green_transition_fund_desc:0 "Public money for rail, insulation and clean energy, raised once and spent over a decade."
 POR_s_public_investment_bank:0 "A Public Investment Bank"
 POR_s_public_investment_bank_desc:0 "A development bank that lends where private banks will not: the interior, small firms, long projects."
 POR_s_rail_renaissance:0 "Rail Renaissance"
 POR_s_rail_renaissance_desc:0 "Reopen the lines closed in the 1980s and electrify the rest. Trains for the interior, not only for the coast."
 POR_s_a_shorter_working_week:0 "A Shorter Working Week"
 POR_s_a_shorter_working_week_desc:0 "A national pilot of the four-day week, with the same pay. Employers in the scheme report fewer absences and more applicants."
 POR_s_rent_regulation:0 "Rent Regulation"
 POR_s_rent_regulation_desc:0 "Caps on rent increases and limits on short-term letting in the most pressured parishes. Tenants cheer; investors pause."
 POR_s_energy_communities:0 "Energy Communities"
 POR_s_energy_communities_desc:0 "Neighbourhoods and villages that produce and share their own solar power. Advances the clean energy spirit."
 POR_s_union_partnership:0 "A Partnership With the Unions"
 POR_s_union_partnership_desc:0 "A standing social pact: wages, training and conditions agreed at one table each year."
 POR_s_a_wealth_contribution:0 "A Wealth Contribution"
 POR_s_a_wealth_contribution_desc:0 "Those with the most pay for the programme. It balances the accounts and unites the right against it."
 POR_s_a_growth_compact:0 "A Growth Compact"
 POR_s_a_growth_compact_desc:0 "Finance the social programme from growth instead: an agreement with business on investment, productivity and wages."
 POR_s_a_fairer_portugal:0 "A Fairer Portugal"
 POR_s_a_fairer_portugal_desc:0 "The Social Republic completed: services people trust, work that pays, homes they can afford."
 POR_v_the_second_mandate:0 "The Second Mandate"
 POR_v_the_second_mandate_desc:0 "The new order exists. Now it must be defended against the institutions that never accepted it."
 POR_v_national_security_council:0 "A National Security Council"
 POR_v_national_security_council_desc:0 "Police, intelligence and the armed forces under one council chaired from Belem. Critics call it a parallel government."
 POR_v_judicial_overhaul:0 "Judicial Overhaul"
 POR_v_judicial_overhaul_desc:0 "New rules for appointing judges and prosecutors. The judiciary calls it an attack on its independence."
 POR_v_family_and_birth_policy:0 "Family and Birth Policy"
 POR_v_family_and_birth_policy_desc:0 "Tax relief, housing priority and allowances for large families: the answer to an ageing country that does not rely on immigration."
 POR_v_police_modernisation:0 "Police Modernisation"
 POR_v_police_modernisation_desc:0 "New equipment, pay and powers for the security forces."
 POR_v_referendum_democracy:0 "Referendum Democracy"
 POR_v_referendum_democracy_desc:0 "Let the people decide directly on the questions Parliament will not settle. It is also the way out of an institutional deadlock."
 POR_v_bring_the_emigrants_home:0 "Bring the Emigrants Home"
 POR_v_bring_the_emigrants_home_desc:0 "Two million Portuguese live abroad. Tax breaks and jobs to bring them back."
 POR_v_a_eurorealist_alliance:0 "A Eurorealist Alliance"
 POR_v_a_eurorealist_alliance_desc:0 "Join the governments that want a looser Union. Friends in some capitals, enemies in Brussels."
 POR_v_atlantic_first:0 "Atlantic First"
 POR_v_atlantic_first_desc:0 "Mend fences in Europe and look west: Washington, London and the sea are Portugal's oldest guarantees. Ends Brussels Friction."
 POR_v_the_fourth_republic:0 "The Fourth Republic"
 POR_v_the_fourth_republic_desc:0 "§YAlternate history.§! A revised constitutional order with a stronger presidency. Cannot be proclaimed while the institutions are in deadlock."
 POR_a_foreign_policy_for_2025:0 "A Foreign Policy for 2025"
 POR_a_foreign_policy_for_2025_desc:0 "Europe, the Atlantic and the Portuguese-speaking world: Portugal's three circles. Each one asks something different of a small country."
 POR_fp_the_european_core:0 "The European Core"
 POR_fp_the_european_core_desc:0 "Be at the table where the Union's decisions are made, not merely bound by them."
 POR_fp_the_atlantic_bridge:0 "The Atlantic Bridge"
 POR_fp_the_atlantic_bridge_desc:0 "The oldest alliance in Europe and a founding member of NATO: Portugal links Europe to the Americas."
 POR_fp_the_lusophone_community:0 "The Lusophone Community"
 POR_fp_the_lusophone_community_desc:0 "More than 250 million people speak Portuguese. Few countries of ten million have that kind of reach."
 POR_fp_a_voice_in_the_council:0 "A Voice in the Council"
 POR_fp_a_voice_in_the_council_desc:0 "Coalitions with like-minded member states on the budget, the Atlantic and migration. Not available under Brussels Friction."
 POR_fp_iberian_summitry:0 "Iberian Summitry"
 POR_fp_iberian_summitry_desc:0 "Annual summits with Spain on energy, rail and the border regions. Also helps the Ronaldo route's Iberian talks."
 POR_fp_the_lajes_agreement:0 "The Lajes Agreement"
 POR_fp_the_lajes_agreement_desc:0 "Renegotiate the use of Lajes Air Base in the Azores with the United States: investment and jobs in return for access."
 POR_fp_united_nations_engagement:0 "United Nations Engagement"
 POR_fp_united_nations_engagement_desc:0 "A country that sent a Secretary-General to New York keeps its seat at the multilateral table."
 POR_fp_a_cplp_summit_in_lisbon:0 "A CPLP Summit in Lisbon"
 POR_fp_a_cplp_summit_in_lisbon_desc:0 "Host the Community of Portuguese Language Countries and give it an agenda beyond culture: trade, mobility, health."
 POR_fp_african_partnerships:0 "African Partnerships"
 POR_fp_african_partnerships_desc:0 "Training missions, development aid and investment in Angola, Mozambique, Guinea-Bissau and Sao Tome."
 POR_fp_european_defence_pillar:0 "A European Defence Pillar"
 POR_fp_european_defence_pillar_desc:0 "Join the common European defence projects. Bigger reward with a §YDefence Industrial Base§!."
 POR_fp_meeting_nato_commitments:0 "Meeting NATO Commitments"
 POR_fp_meeting_nato_commitments_desc:0 "Reach the spending target the allies keep reminding Lisbon about. All three services benefit; the defence budget feels it."
 POR_fp_support_for_ukraine:0 "Support for Ukraine"
 POR_fp_support_for_ukraine_desc:0 "Equipment, training and reconstruction aid within the allied effort."
 POR_fp_a_strategic_partnership_with_brazil:0 "A Strategic Partnership With Brazil"
 POR_fp_a_strategic_partnership_with_brazil_desc:0 "Joint aerospace work, investment both ways and a common voice in the South Atlantic."
 POR_fp_the_mediterranean_and_sahel:0 "The Mediterranean and the Sahel"
 POR_fp_the_mediterranean_and_sahel_desc:0 "Portuguese units in European missions to the south, where migration and security meet."
 POR_fp_a_peacekeeping_tradition:0 "A Peacekeeping Tradition"
 POR_fp_a_peacekeeping_tradition_desc:0 "From Bosnia to the Central African Republic, Portuguese troops have a reputation in difficult missions. Build on it."
 POR_fp_lusophone_mobility:0 "Lusophone Mobility"
 POR_fp_lusophone_mobility_desc:0 "Easier residence and work for citizens of the Portuguese-speaking countries. Clashes with a §YBorder Control Regime§!."
 POR_fp_a_bridge_between_worlds:0 "A Bridge Between Worlds"
 POR_fp_a_bridge_between_worlds_desc:0 "European, Atlantic and Lusophone at once: a small country with a large voice. Replaces §YCPLP Leadership§!."
 POR_a_country_of_ten_million:0 "A Country of Ten Million"
 POR_a_country_of_ten_million_desc:0 "An ageing population, an emptying interior, two island regions far out in the Atlantic. Portugal's society needs its own policy, not just leftovers from the budget."
 POR_sr_the_emptying_interior:0 "The Emptying Interior"
 POR_sr_the_emptying_interior_desc:0 "Villages with more houses than people. Bring back services, jobs and connections."
 POR_sr_the_demographic_question:0 "The Demographic Question"
 POR_sr_the_demographic_question_desc:0 "Fewer births, longer lives, many young people abroad. Every other policy depends on the answer."
 POR_sr_the_autonomous_regions:0 "The Autonomous Regions"
 POR_sr_the_autonomous_regions_desc:0 "Madeira and the Azores govern themselves within the Republic. Make that work for both sides."
 POR_sr_rural_broadband:0 "Rural Broadband"
 POR_sr_rural_broadband_desc:0 "Fibre to every parish: remote work makes the interior an option again."
 POR_sr_a_fire_resilient_landscape:0 "A Fire-Resilient Landscape"
 POR_sr_a_fire_resilient_landscape_desc:0 "Manage the forests, pay owners to clear them, replant with native species. Builds on the 2025 wildfire plan."
 POR_sr_family_support:0 "Family Support"
 POR_sr_family_support_desc:0 "Free nurseries, longer parental leave, housing for young families."
 POR_sr_programa_regressar:0 "Programa Regressar"
 POR_sr_programa_regressar_desc:0 "Tax relief and support for emigrants who come home, often with skills learned abroad."
 POR_sr_madeira_financing_law:0 "A Madeira Financing Law"
 POR_sr_madeira_financing_law_desc:0 "A new financing law for the region. Ends the §YMadeira Political Crisis§! if it is still running."
 POR_sr_the_azores_sea_economy:0 "The Azores Sea Economy"
 POR_sr_the_azores_sea_economy_desc:0 "Fisheries, marine science and ports in the middle of the Atlantic."
 POR_sr_a_regionalisation_referendum:0 "A Regionalisation Referendum"
 POR_sr_a_regionalisation_referendum_desc:0 "Elected regional governments on the mainland, promised in the Constitution since 1976 and rejected by voters in 1998. Ask again."
 POR_sr_strong_municipalities:0 "Strong Municipalities"
 POR_sr_strong_municipalities_desc:0 "Skip the regions: hand powers and money straight to the councils, which people already trust."
 POR_sr_an_integration_policy:0 "An Integration Policy"
 POR_sr_an_integration_policy_desc:0 "Language courses, recognised qualifications, faster papers: immigrants who stay should belong. Under a §YBorder Control Regime§! the focus gives a different reward."
 POR_sr_an_islands_compact:0 "An Islands Compact"
 POR_sr_an_islands_compact_desc:0 "A standing agreement between Lisbon, Funchal and Ponta Delgada on transport, health and money."
 POR_sr_a_national_health_workforce:0 "A National Health Workforce"
 POR_sr_a_national_health_workforce_desc:0 "Train, hire and keep doctors and nurses. Stronger if the health service was already rebuilt."
 POR_sr_outermost_region_status:0 "Outermost Region Status"
 POR_sr_outermost_region_status_desc:0 "Use the Union's special rules for its most distant regions to the full. Not available under Brussels Friction."
 POR_sr_a_cohesive_country:0 "A Cohesive Country"
 POR_sr_a_cohesive_country_desc:0 "Coast and interior, mainland and islands, old and young: one country again."
 POR_energy_and_science_strategy:0 "An Energy and Science Strategy"
 POR_energy_and_science_strategy_desc:0 "Sun, wind, water and a few minerals: Portugal could produce more clean energy than it needs. Science decides what it does with it."
 POR_es_renewables_first:0 "Renewables First"
 POR_es_renewables_first_desc:0 "More than half of Portugal's power already comes from renewable sources. Aim for all of it. Starts the §YClean Energy§! spirit."
 POR_es_the_resource_question:0 "The Resource Question"
 POR_es_the_resource_question_desc:0 "Northern Portugal holds some of Europe's largest lithium deposits, under protected farmland. Mine it or leave it."
 POR_es_science_and_universities:0 "Science and Universities"
 POR_es_science_and_universities_desc:0 "More researchers, better paid, and fewer of them leaving."
 POR_es_offshore_wind:0 "Offshore Wind"
 POR_es_offshore_wind_desc:0 "Floating wind farms off the northern coast, built in Portuguese yards. Advances the §YClean Energy§! spirit."
 POR_es_solar_alentejo:0 "Solar Alentejo"
 POR_es_solar_alentejo_desc:0 "The sunniest region of Europe becomes its power plant. Advances the §YClean Energy§! spirit."
 POR_es_open_the_lithium_mines:0 "Open the Lithium Mines"
 POR_es_open_the_lithium_mines_desc:0 "License the mines in the north. Industry and jobs, local protests and a damaged landscape."
 POR_es_protect_the_barroso:0 "Protect the Barroso"
 POR_es_protect_the_barroso_desc:0 "The Barroso is a protected agricultural heritage landscape. Keep it that way, and buy batteries abroad."
 POR_es_research_funding:0 "Research Funding"
 POR_es_research_funding_desc:0 "Double the science budget over a legislature."
 POR_es_a_portuguese_space_agency:0 "A Portuguese Space Agency"
 POR_es_a_portuguese_space_agency_desc:0 "Small satellites, ground stations and the Azores as a launch site: space from the edge of Europe."
 POR_es_green_hydrogen_at_sines:0 "Green Hydrogen at Sines"
 POR_es_green_hydrogen_at_sines_desc:0 "Turn surplus clean power into hydrogen for export through the deep-water port. Needs §YPorts of the Atlantic§!. Advances the §YClean Energy§! spirit."
 POR_es_a_battery_value_chain:0 "A Battery Value Chain"
 POR_es_a_battery_value_chain_desc:0 "Refine the lithium at home and build cells, not just dig ore."
 POR_es_quantum_and_ai:0 "Quantum and AI"
 POR_es_quantum_and_ai_desc:0 "National computing centres and research programmes in the technologies of the next decade."
 POR_es_an_energy_exporter:0 "An Energy Exporter"
 POR_es_an_energy_exporter_desc:0 "Portugal sells clean power and hydrogen to Europe. The grid must be strong enough to carry it: needs §YEnergy Resilience Programme§! or §YA Resilient Grid§!."
 POR_es_an_atlantic_spaceport:0 "An Atlantic Spaceport"
 POR_es_an_atlantic_spaceport_desc:0 "A launch site on Santa Maria, in the Azores."
 POR_es_a_knowledge_economy:0 "A Knowledge Economy"
 POR_es_a_knowledge_economy_desc:0 "Energy, science and industry feeding each other. Upgrades §YScience Investment§!."
 POR_special_operations_command:0 "Special Operations Command"
 POR_special_operations_command_desc:0 "Commandos, rangers and naval special forces under one joint command."
 POR_a_cyber_defence_command:0 "A Cyber Defence Command"
 POR_a_cyber_defence_command_desc:0 "Networks are the newest front line. A joint command to defend them."
 POR_a_territorial_defence_reserve:0 "A Territorial Defence Reserve"
 POR_a_territorial_defence_reserve_desc:0 "Volunteer reservists in every district, trained for defence and emergencies. Not available with Servico Nacional."
 POR_the_army_of_2035:0 "The Army of 2035"
 POR_the_army_of_2035_desc:0 "A complete modern army, ready for the next decade. Upgrades §YModern Land Forces§!."
 POR_an_air_drone_squadron:0 "An Air Drone Squadron"
 POR_an_air_drone_squadron_desc:0 "The Air Force's drone squadron grows from surveillance to armed missions."
 POR_the_f16_successor:0 "The F-16 Successor"
 POR_the_f16_successor_desc:0 "The F-16s cannot fly forever. Their successor is the largest purchase in the Air Force's history, and needs a settled fiscal course."
 POR_space_and_air_surveillance:0 "Space and Air Surveillance"
 POR_space_and_air_surveillance_desc:0 "Radar and satellite tracking over Portuguese territory and the Atlantic. Bigger reward with a Portuguese space agency."
 POR_the_air_force_of_2035:0 "The Air Force of 2035"
 POR_the_air_force_of_2035_desc:0 "New fighters, drones and sensors working together. Upgrades §YA Modern Air Force§!."
 POR_replacing_the_submarines:0 "Replacing the Submarines"
 POR_replacing_the_submarines_desc:0 "The two submarines of 2010 need successors before the end of the next decade."
 POR_seabed_infrastructure_protection:0 "Seabed Infrastructure Protection"
 POR_seabed_infrastructure_protection_desc:0 "Undersea cables from three continents land in Portugal. Watch over them."
 POR_the_navy_of_2035:0 "The Navy of 2035"
 POR_the_navy_of_2035_desc:0 "Frigates, submarines and drones covering the whole maritime zone. Upgrades §YGuardian of the Atlantic§!."
 POR_r_the_2030_world_cup:0 "The 2030 World Cup"
 POR_r_the_2030_world_cup_desc:0 "§YAlternate history.§! Portugal co-hosts the World Cup, weeks after its new President took office. Only while the tournament is on."
 POR_r_the_captains_diplomacy:0 "The Captain's Diplomacy"
 POR_r_the_captains_diplomacy_desc:0 "Few heads of state can get a meeting anywhere in the world as easily. Use it."
 POR_r_sport_for_all:0 "Sport for All"
 POR_r_sport_for_all_desc:0 "Sport in every school, a pitch in every parish."
 POR_r_a_stronger_presidency:0 "A Stronger Presidency"
 POR_r_a_stronger_presidency_desc:0 "§YAlternate history.§! Ask for constitutional powers to match the popularity. The Assembly resists."
 POR_r_the_constitution_stands:0 "The Constitution Stands"
 POR_r_the_constitution_stands_desc:0 "Govern within the semi-presidential system as it is. The institutions respect the restraint."
 POR_r_a_second_term:0 "A Second Term"
 POR_r_a_second_term_desc:0 "Five years on, the voters are asked again. Needs Public Confidence of 60 or more."
 POR_r_the_portuguese_century:0 "The Portuguese Century"
 POR_r_the_portuguese_century_desc:0 "§YAlternate history.§! A decade of confidence. Upgrades §YPortugal Reborn§!."
 POR_a_territorial_cohesion_fund:0 "A Territorial Cohesion Fund"
 POR_a_territorial_cohesion_fund_desc:0 "A national fund for the districts that European money tends to miss."
 POR_a_diplomatic_network_reform:0 "Diplomatic Network Reform"
 POR_a_diplomatic_network_reform_desc:0 "Fewer embassies in old capitals, more in the growing economies of Africa, Asia and the Americas."
 POR_a_public_trust_agenda:0 "A Public Trust Agenda"
 POR_a_public_trust_agenda_desc:0 "Open data, lobbying rules and faster answers from the state."
 POR_capital_markets_reform:0 "Capital Markets Reform"
 POR_capital_markets_reform_desc:0 "A deeper stock exchange and venture capital for Portuguese firms. Advances the economy spirit."
 POR_quality_tourism:0 "Quality Tourism"
 POR_quality_tourism_desc:0 "Fewer, better-spending visitors. Eases the pressure on city housing."
 POR_agri_food_exports:0 "Agri-Food Exports"
 POR_agri_food_exports_desc:0 "Wine, olive oil, fruit and fish to the world, processed at home."
 POR_the_blue_economy:0 "The Blue Economy"
 POR_the_blue_economy_desc:0 "Shipbuilding, aquaculture, ports and marine science: the sea as an industry."
 # ==== THIRD PASS: spirits ====
 POR_justice_reform_idea:0 "Justice Reform"
 POR_justice_reform_idea_desc:0 "Faster courts and digital case files."
 POR_digital_state_idea:0 "The Digital State"
 POR_digital_state_idea_desc:0 "Public services online and a state that answers quickly."
 POR_portuguese_model_idea:0 "The Portuguese Model"
 POR_portuguese_model_idea_desc:0 "Steady growth and calm government. Replaces Stable Institutions."
 POR_green_transition_fund_idea:0 "Green Transition Fund"
 POR_green_transition_fund_idea_desc:0 "A decade of public investment in rail, insulation and clean energy."
 POR_fair_portugal_idea:0 "A Fairer Portugal"
 POR_fair_portugal_idea_desc:0 "Trusted services, decent work and affordable homes. Replaces The Social Republic."
 POR_judicial_overhaul_idea:0 "Judicial Overhaul"
 POR_judicial_overhaul_idea_desc:0 "New appointment rules for judges and prosecutors, contested by the judiciary."
 POR_fourth_republic_idea:0 "The Fourth Republic"
 POR_fourth_republic_idea_desc:0 "A revised constitutional order with a stronger presidency. Replaces A New Political Order."
 POR_eu_council_voice_idea:0 "A Voice in the Council"
 POR_eu_council_voice_idea_desc:0 "Portugal builds coalitions inside the European Council."
 POR_lajes_agreement_idea:0 "The Lajes Agreement"
 POR_lajes_agreement_idea_desc:0 "A renewed agreement on the Azores air base."
 POR_cplp_leadership_idea:0 "CPLP Leadership"
 POR_cplp_leadership_idea_desc:0 "Lisbon leads the Community of Portuguese Language Countries. Replaced by A Bridge Between Worlds."
 POR_peacekeeping_tradition_idea:0 "A Peacekeeping Tradition"
 POR_peacekeeping_tradition_idea_desc:0 "Portuguese units are sought after for difficult missions."
 POR_bridge_between_worlds_idea:0 "A Bridge Between Worlds"
 POR_bridge_between_worlds_idea_desc:0 "European, Atlantic and Lusophone at once."
 POR_interior_revival_idea:0 "Interior Revival"
 POR_interior_revival_idea_desc:0 "Services and jobs are coming back to the interior. Upgraded by A Cohesive Country."
 POR_regionalisation_idea:0 "Regionalisation"
 POR_regionalisation_idea_desc:0 "Elected regional governments on the mainland."
 POR_strong_municipalities_idea:0 "Strong Municipalities"
 POR_strong_municipalities_idea_desc:0 "Councils with real powers and budgets."
 POR_diaspora_return_idea:0 "The Diaspora Returns"
 POR_diaspora_return_idea_desc:0 "Emigrants are coming home with skills learned abroad."
 POR_integration_policy_idea:0 "An Integration Policy"
 POR_integration_policy_idea_desc:0 "Immigrants who stay are helped to belong."
 POR_cohesive_country_idea:0 "A Cohesive Country"
 POR_cohesive_country_idea_desc:0 "Coast and interior, mainland and islands, closer than they have been for decades."
 POR_clean_energy_1:0 "Clean Energy I"
 POR_clean_energy_1_desc:0 "Renewables lead the power mix. Stage 1 of 3; An Energy Exporter completes it."
 POR_clean_energy_2:0 "Clean Energy II"
 POR_clean_energy_2_desc:0 "Wind and solar at scale. Stage 2 of 3."
 POR_clean_energy_3:0 "Clean Energy III"
 POR_clean_energy_3_desc:0 "Surplus power becomes hydrogen. Stage 3 of 3."
 POR_energy_exporter_idea:0 "An Energy Exporter"
 POR_energy_exporter_idea_desc:0 "Portugal sells clean power and hydrogen to Europe."
 POR_lithium_mining_idea:0 "Lithium Mining"
 POR_lithium_mining_idea_desc:0 "The northern mines are open: resources and industry, with local opposition."
 POR_protected_barroso_idea:0 "The Barroso Protected"
 POR_protected_barroso_idea_desc:0 "The landscape is kept; the lithium stays in the ground."
 POR_science_investment_idea:0 "Science Investment"
 POR_science_investment_idea_desc:0 "A doubled science budget. Upgraded by A Knowledge Economy."
 POR_knowledge_economy_idea:0 "A Knowledge Economy"
 POR_knowledge_economy_idea_desc:0 "Energy, science and industry feeding each other."
 POR_cyber_command_idea:0 "Cyber Defence Command"
 POR_cyber_command_idea_desc:0 "A joint command defends the state's networks."
 POR_army_2035_idea:0 "The Army of 2035"
 POR_army_2035_idea_desc:0 "A fully modern army. Replaces Modern Land Forces."
