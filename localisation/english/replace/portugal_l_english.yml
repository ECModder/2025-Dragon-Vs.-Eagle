 POR_parliament_category:0 "Assembly of the Republic"
 POR_parliament_category_desc:0 "§YParliamentary Support:§! [?POR_parl_support|0] / 100     §YPublic Confidence:§! [?POR_confidence|0] / 100\n\n§R0-39§! Fragile Parliament   §Y40-69§! Working Parliament   §G70+§! Stable Majority\n\nSupport erodes by 1 every month. Below §R25§! the government faces a confidence crisis. Public Confidence drifts back towards 50, and can be spent or lost through events."
 POR_blackout_category:0 "Blackout Recovery"
 POR_blackout_category_desc:0 "§YAllocations left:§! [?POR_relief_points|0]\n\nEssential infrastructure: §Y[?POR_bo_essential|0]§!   Public services: §Y[?POR_bo_services|0]§!   Grid resilience: §Y[?POR_bo_grid|0]§!\n\nYou have §Y5§! allocations and ten days. §Y2§! in Essential Infrastructure and §Y2§! in Public Services give a clean recovery. §Y2§! in Grid Resilience record the lessons that make the later Energy Resilience Programme stronger. You cannot have all three."
 POR_campaign_category:0 "Presidential Campaign"
 POR_campaign_category_desc:0 "Election day: §Y18 January 2026§!\n\nNorth: §Y[?POR_camp_north|0]§!   Lisbon and Centre: §Y[?POR_camp_lisbon|0]§!   South and Islands: §Y[?POR_camp_south|0]§!   Momentum: §Y[?POR_campaign|0]§!\n§YScore§! (regional average + momentum): §Y[?POR_camp_score|0]§!\n\n§G55+§! first-round victory and a Strong Mandate   §Y40-54§! victory in the runoff of 8 February   §Rbelow 40§! narrow runoff and a Contested Mandate\n\nBack a candidate with a focus first. With no candidate backed, Luis Montenegro wins an ordinary mandate."
 POR_belem_category:0 "Presidency of the Republic"
 POR_belem_category_desc:0 "The President does not govern. From the Palace of Belem he mediates, vetoes, speaks to the country and convenes the Council of State. The Palace's affairs are worth watching even in quiet years."
 POR_programme_category:0 "The Government Programme"
 POR_programme_category_desc:0 "Initiatives of the political family that holds the Presidency."
 POR_grid_category:0 "Energy Resilience"
 POR_grid_category_desc:0 "The long answer to 28 April 2025: storage, interconnection and emergency planning."
 POR_projects_category:0 "National Projects"
 POR_projects_category_desc:0 "Large economic and infrastructure works. Each needs its focus first and takes months to complete."
 POR_defence_category:0 "Defence Modernisation"
 POR_defence_category_desc:0 "Recruitment: §Y[?POR_def_recruit|0]§!   Training: §Y[?POR_def_training|0]§!   Equipment: §Y[?POR_def_equipment|0]§!   §RBudget Strain:§! [?POR_def_strain|0]\n\nEverything that builds capability adds strain. Strain falls by 3 a month. At §R60§! strain the §YDefence Budget Strain§! spirit appears and stays until strain is under 45.\n\n§YGoal:§! all three capabilities at §Y50§! or more unlock the focus §YModern Land Forces§!."
 POR_renewal_category:0 "The National Renewal Movement"
 POR_renewal_category_desc:0 "Public Support: §Y[?POR_renewal_support|0]§!   Budget: §Y[?POR_renewal_budget|0]§!   Institutional Cooperation: §Y[?POR_renewal_coop|0]§!   Ambition: §Y[?POR_renewal_ambition|0]§!\n\nThe budget drains by 2 a month; an empty budget bleeds support. If Ambition runs more than §R30§! ahead of Cooperation, the institutions push back.\n\nA movement with §Y55§! support is a national force. One with §Y50§! cooperation is one the institutions will receive."
 POR_vision_category:0 "The Vision for Portugal"
 POR_vision_category_desc:0 "§YLusophone partnership treaties in force:§! [?POR_luso_partners|0]\n§YIberian Talks:§! [?POR_iberian_talks|0]\n\nBoth visions are pursued by consent. A partner can always decline."
