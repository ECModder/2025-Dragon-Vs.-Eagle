 # ---- EVENTS ----
 por.1.t:0 "Madeira's Parliament Dissolved"
 por.1.d:0 "Funchal, 17 January 2025. After the regional government lost the confidence of its assembly, the Regional Parliament of Madeira has been dissolved and the islands will vote again, in a snap election set for 23 March.\n\nIn Lisbon the news is read as a warning. Madeira's quarrels - a government without a majority, an opposition that can bring it down but not replace it - look very much like the mainland's."
 por.1.a:0 "An early warning from the islands."
 por.2.t:0 "Madeira Votes: The Democratic Alliance Wins"
 por.2.d:0 "Funchal, 23 March 2025. The snap election in Madeira has given victory to the Democratic Alliance. The regional government returns with a firmer hold on the assembly than the one it lost in January.\n\nFor the centre-right in Lisbon it is proof that voters will reward stability when it is offered. For everyone else it is one regional result, and the national arithmetic has not changed."
 por.2.a:0 "Funchal has a government again."
 por.3.t:0 "A Budget Row in the Assembly"
 por.3.d:0 "The opposition parties have found something they agree on: the government's spending plans. Between them they have the votes to amend the budget line by line. The parliamentary affairs minister wants to know whether to bargain or to fight."
 por.3.a:0 "Bargain. A budget that passes is better than a perfect one."
 por.3.b:0 "Fight. Let them explain their amendments to the country."
 por.4.t:0 "Housing Marches Fill the Avenues"
 por.4.d:0 "Tens of thousands marched through Lisbon and Porto today under one slogan: a home to live in. Nurses, students, delivery riders and pensioners walked together. Rents have risen far faster than wages for a decade, and the marchers want to know which party intends to do something about it before the election rather than after."
 por.4.a:0 "Promise an emergency housing package."
 por.4.b:0 "The market will adjust. Do not legislate from the street."
 por.5.t:0 "Confidence Crisis"
 por.5.d:0 "The government has run out of friends in the Assembly. A motion of no confidence has been tabled and, on today's numbers, it will pass. The President has let it be known that he will not dissolve Parliament lightly: the parties are expected to find a way through."
 por.5.a:0 "The government falls. A caretaker cabinet takes over."
 por.5.b:0 "One last deal, whatever it costs."
 por.6.t:0 "A Stable Majority"
 por.6.d:0 "For the first time in years the government can count its votes a month in advance. The whips have stopped sleeping in their offices. Ministers have started using the word 'medium-term' without irony."
 por.6.a:0 "Use it well."
 por.10.t:0 "Blackout Across the Peninsula"
 por.10.d:0 "28 April 2025, shortly after midday. Electricity has failed across mainland Portugal and Spain. Traffic lights are dark, the metro has stopped between stations, mobile networks are failing as their batteries drain, and airports have suspended departures. Hospitals are running on generators.\n\nThe grid operator reports a sudden and massive loss of power on the Iberian system. Nobody can yet say why. The islands are unaffected."
 por.10.a:0 "Convene the crisis cabinet."
 por.11.t:0 "A Country Without Power"
 por.11.d:0 "Eight hours in. Card payments do not work and cash machines are dead. Queues form at the few petrol stations with generators. Trains are stranded in open country. Radio is, suddenly, the only medium that reaches everyone. The civil protection authority asks what the government wants said, and how often."
 por.11.a:0 "Priority to emergency communications and order."
 por.11.b:0 "A minister on the radio every hour, with the truth."
 por.12.t:0 "The Call to Madrid"
 por.12.d:0 "The Portuguese and Spanish grids fell together and must be brought back together, piece by piece. Spanish and Portuguese operators are already cooperating. The question for the government is political: restart in step with Spain, sharing what generation comes back first, or bring the national system up alone from the hydro plants and reconnect afterwards."
 por.12.a:0 "Together. One peninsula, one restart."
 por.12.b:0 "National black start first. Reconnect when we are stable."
 por.13.t:0 "The Recovery Assessed"
 por.13.d.good:0 "Ten days after the blackout the civil protection authority delivers its assessment. Hospitals and water never failed. Transport and payments were back within a day, and shops and schools reopened quickly. The country was frightened, not harmed, and it has noticed who was in charge."
 por.13.d.mixed:0 "Ten days after the blackout the civil protection authority delivers its assessment. Part of the response worked and part did not: some essential services held while others were left to improvise. The losses are bearable. The stories of what went wrong will be told for months."
 por.13.d.poor:0 "Ten days after the blackout the civil protection authority delivers its assessment, and it is bleak. Generators that did not start, stranded passengers left for a night, businesses that lost a week. The power came back because the engineers brought it back. The state was mostly a spectator."
 por.13.a:0 "The country held together."
 por.13.b:0 "We got through it. Just."
 por.13.c:0 "There will be questions."
 por.14.t:0 "How Fragile Are We?"
 por.14.d:0 "With the lights back on, the argument starts. Engineers, economists and former ministers fill the evening programmes. How can a modern country lose all its power in seconds? Is the grid too dependent on a single interconnection? Who plans for the day the networks fail? The public wants a commitment, not a seminar."
 por.14.a:0 "Pledge a national energy resilience plan."
 por.14.b:0 "It was an exceptional event. Do not overreact."
 por.15.t:0 "The Inquiry Opens"
 por.15.d:0 "The Assembly has set up a commission of inquiry into the blackout: preparedness, the response, and responsibility. The grid operator, the regulator and several ministers will be called. The government must decide how much to help."
 por.15.a:0 "Every document, every witness."
 por.15.b:0 "Defend the operators. They brought the power back."
 por.16.t:0 "The Interim Report"
 por.16.d:0 "The investigators' interim report is on the Prime Minister's desk. It establishes the sequence of the failure second by second, says the restart was competently improvised, and lists what it cannot yet explain. It is long, technical and unflattering in places."
 por.16.a:0 "Publish all of it."
 por.16.b:0 "Publish a summary."
 por.17.t:0 "The Blackout: Final Conclusions"
 por.17.d:0 "28 April 2027, two years to the day. The joint commission has published its final conclusions.\n\nIn this timeline's account, no single fault and no attack caused the blackout. Voltage oscillations on a heavily loaded system triggered a chain of automatic disconnections; with too little reserve able to respond in seconds, and a weak link to the rest of Europe, the Iberian system could not be held. Portugal had too few plants able to restart without outside power, and emergency plans that assumed the telephones would work.\n\nThe commission recommends storage, stronger interconnection, more black-start capacity and yearly national exercises. It also notes, drily, that most of this was recommended before."
 por.17.a:0 "Commit to the full programme."
 por.17.b:0 "Someone must answer for the warnings ignored."
 por.17.c:0 "Note the report. The budget has other priorities."
 por.20.t:0 "Three Candidates for Belem"
 por.20.d:0 "15 October 2025. The race for the Presidency of the Republic is open, and in this timeline three names dominate it.\n\nLuis Montenegro, for the Democratic Alliance, promises stability, growth and a firm European course. Pedro Nuno Santos, for the Socialist Party, promises social equality, public investment and stronger institutions. Andre Ventura, for Chega, promises to break with the established parties, tighten immigration and defend national sovereignty.\n\nThe President does not govern. But he appoints, vetoes, mediates and can dissolve Parliament, and in a divided Assembly those powers matter. The vote is on 18 January 2026."
 por.20.a:0 "The campaign begins."
 por.21.t:0 "The Televised Debate"
 por.21.d:0 "Three lecterns, two moderators, ninety minutes, and the largest audience of the campaign. The advisers have prepared two plans: a calm, presidential evening, or an attack on the two rivals at once."
 por.21.a:0 "Calm and presidential."
 por.21.b:0 "Go on the attack."
 por.21.c:0 "The government watches from the sidelines."
 por.22.t:0 "Election Night"
 por.22.d.first:0 "18 January 2026. With nearly all parishes counted, the result is clear: one candidate has passed fifty per cent and there will be no second round. The headquarters of the other two went quiet early."
 por.22.d.runoff:0 "18 January 2026. No candidate has reached fifty per cent. The two best-placed go to a runoff on 8 February, and three more weeks of campaigning begin tonight."
 por.22.a:0 "The count goes on."
 por.23.t:0 "Luis Montenegro Elected President"
 por.23.d:0 "Luis Montenegro has been elected President of the Republic. In his first statement the candidate of the Democratic Alliance promised to be a President of stability and cooperation between institutions. Markets and European capitals are relieved; the opposition says the centre-right now holds too many offices at once."
 por.23.a:0 "A vote for stability."
 por.24.t:0 "Pedro Nuno Santos Elected President"
 por.24.d:0 "Pedro Nuno Santos has been elected President of the Republic. The Socialist candidate promised a presidency that will hold every government to its duties towards ordinary people. Portugal now faces cohabitation: a President of the left and a government of the centre-right."
 por.24.a:0 "A vote for a social republic."
 por.25.t:0 "Andre Ventura Elected President"
 por.25.d:0 "Andre Ventura has been elected President of the Republic. The Chega leader called the result the end of half a century of alternation. His powers are those of the Constitution - veto, appointment, dissolution - and both he and his opponents intend to find out exactly how far they reach."
 por.25.a:0 "A vote against the establishment."
 por.26.t:0 "The Inauguration"
 por.26.d.m:0 "9 March 2026. Before the Assembly of the Republic, Luis Montenegro takes the oath as President. The speech is about institutions that last. The uncertainty of the last two years is, at least formally, over."
 por.26.d.s:0 "9 March 2026. Before the Assembly of the Republic, Pedro Nuno Santos takes the oath as President. The speech is about health, housing and wages. The government benches applaud politely."
 por.26.d.v:0 "9 March 2026. Before the Assembly of the Republic, Andre Ventura takes the oath as President. The speech is about a new chapter. Half the chamber stands; half stays seated."
 por.26.a:0 "A new presidency begins."
 por.30.t:0 "The First Hundred Days"
 por.30.d:0 "The President's advisers offer two ways to start. A quiet round of talks with every party, to agree the rules of the legislature before anything else. Or public backing for a rapid economic package, to show results before the goodwill fades."
 por.30.a:0 "Talks first. Agree the rules."
 por.30.b:0 "Results first. Back the package."
 por.31.t:0 "Where to Begin"
 por.31.d:0 "The President can set an agenda but not a budget. He has one first use of his platform, and two emergencies competing for it: the hospitals and the rents."
 por.31.a:0 "The health service comes first."
 por.31.b:0 "Housing comes first."
 por.32.t:0 "The First Clash"
 por.32.d:0 "The President wants to open with a show of strength: a veto, a message to the Assembly, a demand. His more cautious advisers suggest starting where the other parties cannot easily say no, with the anti-corruption package."
 por.32.a:0 "Confront the Assembly now."
 por.32.b:0 "Start with the fight we can win."
 por.33.t:0 "The Revision Reaches the Assembly"
 por.33.d:0 "A constitutional revision has been tabled: a stronger presidency, harsher rules for public office, new limits on immigration and on European primacy. It needs two thirds of the deputies. It does not have them. The question is whether to seek a narrower text the centre-right could sign, or to take the argument to the country."
 por.33.a:0 "Take it to the country."
 por.33.b:0 "Open talks on a partial revision."
 por.34.t:0 "A Warning on the Deficit"
 por.34.d:0 "The Public Finance Council and the European Commission say the same thing in two languages: the investment programme, financed by borrowing, is pushing the deficit beyond what was promised. Neither can stop it. Both can make it more expensive."
 por.34.a:0 "Trim the programme."
 por.34.b:0 "Defend the plan."
 por.35.t:0 "The Opposition Tables a Motion"
 por.35.d:0 "Without a pact, the government lives vote to vote, and the opposition has decided to test it with a motion of censure. The numbers are close."
 por.35.a:0 "Negotiate abstentions."
 por.35.b:0 "Dare them to vote."
 por.40.t:0 "One Year On"
 por.40.d.m:0 "9 March 2027. A year into the Montenegro presidency, the newspapers publish their balance sheets. The promise was stability and cooperation between institutions. The question is whether anyone can point to it."
 por.40.d.s:0 "9 March 2027. A year into the Santos presidency, the newspapers publish their balance sheets. The promise was a state that puts people first. The question is whether the waiting lists and the rents have noticed."
 por.40.d.v:0 "9 March 2027. A year into the Ventura presidency, the newspapers publish their balance sheets. The promise was to break the old system. The question is what, exactly, has been broken."
 por.40.a:0 "Promises kept, so far."
 por.40.b:0 "Promises pending."
 por.41.t:0 "The 2028 Budget"
 por.41.d:0 "The budget debate is the real annual election. Restraint would reassure lenders and disappoint everyone waiting for services. Investment would do the reverse. A compromise would satisfy no one and probably pass."
 por.41.a:0 "Restraint."
 por.41.b:0 "Investment."
 por.41.c:0 "A negotiated compromise."
 por.42.t:0 "Homes and Hospitals"
 por.42.d.good:0 "The mid-year reports on housing and health show movement for the first time in years: construction starts are up, and fewer people are without a family doctor. Nobody calls it solved."
 por.42.d.bad:0 "The mid-year reports on housing and health show what everyone already knew. Rents are still rising and emergency rooms are still closing at weekends. Whatever was promised in 2026 has not reached the street."
 por.42.a:0 "Keep going."
 por.42.b:0 "Commit new funds now."
 por.42.c:0 "It took decades to break. It will take more than a year to fix."
 por.43.t:0 "The Defence Review"
 por.43.d:0 "The government has opened a multi-year review of the armed forces: readiness, procurement, and what Portugal owes its allies. The allies have views. So does the finance ministry."
 por.43.a:0 "Meet the alliance targets early."
 por.43.b:0 "A balanced path: people and training first."
 por.43.c:0 "Defer. The budget cannot carry it yet."
 por.44.t:0 "Midterm Pressure"
 por.44.d:0 "Two years after the election, the polls have turned restless and the Assembly with them. Deputies who voted with the government last year now want to be asked nicely."
 por.44.a:0 "The majority holds."
 por.44.b:0 "Concede a reshuffle."
 por.44.c:0 "Ride it out."
 por.45.t:0 "The Islands' Turn"
 por.45.d:0 "The governments of Madeira and the Azores have come to Lisbon with their lists. Madeira wants transport links and a fairer financing law. The Azores want their position in the middle of the Atlantic treated as a national asset, with the ports and runways to match."
 por.45.a:0 "Transport links for Madeira."
 por.45.b:0 "An Atlantic hub in the Azores."
 por.45.c:0 "A new financing law for both regions."
 por.46.t:0 "The Competitiveness Debate"
 por.46.d:0 "A national conference on competitiveness ends, as they do, with four lobbies and one budget line. Tourism, industry, technology and small businesses each explain why they are the future."
 por.46.a:0 "Tourism."
 por.46.b:0 "Industry."
 por.46.c:0 "Technology."
 por.46.e:0 "Small businesses."
 por.47.t:0 "Atlantic Security"
 por.47.d:0 "Undersea cables, shipping lanes, the gap between Europe and America: the Atlantic matters again. Portugal can offer the allies a home for maritime coordination, build its own initiative with the Portuguese-speaking countries around the ocean, or keep its commitments modest."
 por.47.a:0 "Host an allied maritime centre."
 por.47.b:0 "A Lusophone maritime initiative."
 por.47.c:0 "Keep commitments modest."
 por.48.t.m:0 "The European Funds Review"
 por.48.d.m:0 "Brussels is reviewing how Portugal has used its European funds. The verdict is good but conditional: the remaining money depends on reforms being delivered ahead of schedule."
 por.48.a:0 "Front-load the reforms."
 por.48.b:0 "Keep the agreed pace."
 por.48.t.s:0 "The Unions Lose Patience"
 por.48.d.s:0 "The union confederations supported the social programme and expected faster results. They are now threatening a general strike over wages in the public sector."
 por.48.c:0 "A social pact with the unions."
 por.48.e:0 "Hold the budget line."
 por.48.t.v:0 "The Court Rules"
 por.48.d.v:0 "The Constitutional Court has struck down central parts of the new immigration regime, and the European Commission has opened proceedings against others. The President must decide whether the answer is compliance or confrontation."
 por.48.f:0 "Comply, and legislate again."
 por.48.g:0 "The mandate comes from the people."
 por.49.t:0 "The State of the Republic"
 por.49.d:0 "9 March 2029. Three years after the election, the Assembly holds a full debate on the state of the Republic: the record of the presidency and the government, and what the country should expect before it votes again."
 por.49.a:0 "Defend the record."
 por.49.b:0 "Announce a new agenda."
 por.50.t:0 "What Five Years Built"
 por.50.d:0 "The audit court and the defence council have reviewed the programmes started since 2025. The long reports reduce to one question for the government: what should the country be told it has to show for the money?"
 por.50.a:0 "Armed forces transformed."
 por.50.b:0 "An economy and a grid rebuilt."
 por.50.c:0 "The work is unfinished."
 por.51.t:0 "The Mood of the Country"
 por.51.d:0 "Autumn 2029. The opposition has called a season of protest and the pollsters are busy. How it goes depends on something built or wasted over five years: whether people believe their institutions."
 por.51.a:0 "The country stands behind its institutions."
 por.51.b:0 "Restless, but governable."
 por.51.c:0 "A wave of protest."
 por.52.t:0 "A New Decade"
 por.52.d:0 "25 April 2030. On the anniversary of the revolution, with the World Cup weeks away, the Republic takes stock. The crises of 2025 are history. The presidency continues its term, and the next election is already being discussed."
 por.52.a:0 "The Republic carries on."
 por.60.t:0 "Ronaldo to Leave the National Team"
 por.60.d:0 "§YAlternate history.§! 5 November 2026. Cristiano Ronaldo dos Santos Aveiro has announced that he will leave the Portuguese national team. After more than two decades, the most capped and highest-scoring player in the team's history will stop wearing the shirt.\n\nTelevision schedules were cleared within minutes. Former team-mates, rivals and heads of state have sent tributes, and Funchal, where he was born, has filled its streets. Many note that he said nothing about retiring from football altogether."
 por.60.a:0 "Obrigado, Capitao."
 por.60.b:0 "A great player. Tomorrow there is a country to run."
 por.61.t:0 "What Do We Owe Him?"
 por.61.d:0 "The country is discussing a legacy. Some want a state tribute at the national stadium and the highest honour of the Republic. Others, without disputing the career, think the football federation can thank a footballer and the state should keep its ceremonies for other things."
 por.61.a:0 "A national tribute."
 por.61.b:0 "Leave it to the federation."
 por.62.t:0 "One Thousand"
 por.62.d:0 "§YAlternate history.§! 23 May 2027. In this timeline it happened tonight: Cristiano Ronaldo has scored the 1,000th goal of his senior career. The match stopped for several minutes. Whatever one thinks of counting goals, nobody watching doubted they had seen something that will not be repeated soon."
 por.62.a:0 "A number for the history books."
 por.63.t:0 "The Last Whistle"
 por.63.d:0 "§YAlternate history.§! 10 June 2027, Portugal Day. Having reached his thousandth goal, Cristiano Ronaldo has announced his retirement from football entirely. He chose the national day and said, briefly, that he had given the game everything and now wanted to give something to the country that made him.\n\nCommentators spent the evening on the career. A few spent it on that last sentence."
 por.63.a:0 "The end of an era."
 por.64.t:0 "A New Kind of Interview"
 por.64.d:0 "The former captain's foundation has opened its third clinic, and his interviews have changed subject: emigration, the interior, why a country this talented expects so little of itself. He belongs to no party and says he wants none. The parties are not sure whether to be relieved."
 por.64.a:0 "The country can use every voice."
 por.64.b:0 "The parties close ranks, politely."
 por.65.t:0 "A Movement Is Born"
 por.65.d:0 "The Movimento Renovacao Nacional has been registered, with a programme to follow and a founder who needs no introduction. It promises to restore national confidence and bring Portugal to international prominence. The Presidency must decide how to treat it: as a guest, or as a rival."
 por.65.a:0 "Receive the founders at Belem."
 por.65.b:0 "Keep a correct distance."
 por.66.t:0 "The Movement Grows"
 por.66.d:0 "A year after its founding the movement has members in every district and no agreement on what it is. Its organisers want local chapters and numbers. Its advisers want economists, diplomats and generals. Its founder is told he must choose what kind of thing he leads."
 por.66.a:0 "Chapters in every parish."
 por.66.b:0 "Bring in the experts."
 por.66.c:0 "Stay a civic platform."
 por.67.t:0 "The Institutions Push Back"
 por.67.d:0 "The programme's latest promises have gone further than its friends in the state can follow. Constitutional scholars are writing open letters, the chiefs of staff have asked not to be quoted, and the parties have found a common enemy. A movement that wants to be received at Belem cannot be at war with everyone who works there."
 por.67.a:0 "Moderate the message."
 por.67.b:0 "They are afraid. Good."
 por.68.t:0 "Dinner at Belem"
 por.68.d:0 "The invitation was private and so was the dinner. The President talked about the weight of the office, about how a term can run out of purpose before it runs out of time, and about what the country seems to want.\n\nAt the door he said only that the Council of State would meet early in the new year, that the Palace would have matters to settle before spring, and that some conversations are better held by telephone."
 por.68.a:0 "He listened more than he spoke."
 por.69.t:0 "The Call"
 por.69.d:0 "§YAlternate history.§! The President came to the point quickly. He believes the country needs a new chapter and that he is not the one to write it. He intends to stand down and open the way to an early election, and he wanted to ask - before telling anyone else - whether Cristiano Ronaldo dos Santos Aveiro, 45 this month, would consider the Presidency of the Republic.\n\nThe line was quiet for some time."
 por.69.a:0 "For Portugal, yes."
 por.70.t:0 "The President Will Stand Down"
 por.70.d:0 "§YAlternate history.§! In a short address from Belem the President has announced that he will resign his office, opening the way to an early presidential election on 19 May 2030. He said the Republic was sound and that soundness was the right moment for renewal. He named no successor.\n\nWithin the hour the Movimento Renovacao Nacional confirmed that its founder would stand."
 por.70.a:0 "An election nobody planned."
 por.71.t:0 "Ronaldo Elected President"
 por.71.d:0 "§YAlternate history.§! 19 May 2030. Cristiano Ronaldo dos Santos Aveiro has been elected President of the Republic in the first round. The established parties ran candidates and campaigned hard on experience. The country, weeks before hosting a World Cup, voted for confidence.\n\nHe will take office on 10 June, Portugal Day."
 por.71.a:0 "From captain to President."
 por.72.t:0 "President Cristiano Ronaldo dos Santos Aveiro"
 por.72.d:0 "§YAlternate history.§! 10 June 2030. Before the Assembly of the Republic, Cristiano Ronaldo dos Santos Aveiro has taken the oath as President. The National Renewal Programme, until today a movement's document, is now the agenda of the head of state: unity, a state that performs, an economic renaissance, a transformed defence, and an answer to the question of what Portugal is for.\n\nThe Constitution has not changed. The President still does not govern alone. The next years will show how much one man's popularity can move a republic."
 por.72.a:0 "A new chapter begins."
 por.73.t:0 "The Call Declined"
 por.73.d:0 "The answer, when it came, was courteous and final. The movement would go on serving the country as a movement. The President thanked him, and the conversation was never officially held."
 por.73.a:0 "Some doors are better left closed."
 por.74.t:0 "A Rumour in the Capital"
 por.74.d:0 "A story is going round the cafes near the Assembly: that some weeks ago the Palace tried to reach a very famous man about a very large matter, and that nobody picked up. Belem denies it. The movement says it has no comment on telephone calls."
 por.74.a:0 "What might have been."
 por.75.t:0 "The Vote of Principle"
 por.75.d:0 "After weeks of debate the Assembly votes on the principle of national service. The President has asked for a clear mandate. The parties are split down the middle and within themselves: the generals want trained people, the economists count the cost, and the young have filled the galleries."
 por.75.a:0 "The Assembly backs national service."
 por.75.b:0 "The Assembly backs a voluntary corps only."
 por.76.t:0 "The Bill Comes Due"
 por.76.d:0 "The Renaissance works are built. The finance ministry has put the cost on one page and it is larger than any budget the Republic has passed. There are three ways to pay: spread it over decades, cut the programme back and absorb the anger, or sell stakes in the new networks to foreign investors."
 por.76.a:0 "Spread it over decades."
 por.76.b:0 "Scale it back."
 por.76.c:0 "Bring in foreign capital."
 por.77.t:0 "A Treaty Offered by Lisbon"
 por.77.d:0 "[From.GetNameDefCap] proposes a treaty of partnership between our two countries: preferential trade, a common business register, cooperation in education and at sea. Lisbon stresses that it is an agreement between equals and that we are free to decline."
 por.77.a:0 "Sign the treaty."
 por.77.b:0 "Decline, with thanks."
 por.78.t:0 "[From.GetNameDefCap] Signs"
 por.78.d:0 "[From.GetNameDefCap] has signed the partnership treaty. The Lusophone community has one more member, by its own choice."
 por.78.a:0 "A partnership between equals."
 por.79.t:0 "[From.GetNameDefCap] Declines"
 por.79.d:0 "[From.GetNameDefCap] has declined the partnership treaty. The reply is friendly and firm: memories of empire are long, and Lisbon's sudden interest is not everywhere taken at face value."
 por.79.a:0 "That is their right."
 por.80.t:0 "Lisbon Proposes a Union"
 por.80.d:0 "[From.GetNameDefCap] formally proposes a treaty of union: shared institutions for energy, transport and civil protection, and a common external voice, between two states that remain sovereign. Nothing like it has been on the table for centuries."
 por.80.a:0 "Accept the treaty."
 por.80.b:0 "Decline. Good neighbours, nothing more."
 por.81.t:0 "The Iberian Union Treaty"
 por.81.d:0 "§YAlternate history.§! Spain has accepted. Portugal and Spain remain two sovereign states and now share institutions for energy, transport and civil protection and speak with one voice abroad. In Lisbon some celebrate and some hang the flag of 1640 from their windows."
 por.81.a:0 "Two nations, one peninsula."
 por.82.t:0 "Madrid Says No"
 por.82.d:0 "Spain has declined the proposal. The reply praises the friendship of the two countries and sees no need to change its form. The Iberian vision ends here, as a possibility Madrid was always free to refuse."
 por.82.a:0 "Accept the verdict."
 por.82.b:0 "Keep the partnership, drop the union."
 por.83.t:0 "Lisbon Proposes a Federation"
 por.83.d:0 "[From.GetNameDefCap] proposes to turn the union of institutions into a single federal state of the two nations. It would be the end of Spain as a separate country."
 por.83.a:0 "Accept the federation."
 por.83.b:0 "Decline. The union is enough."
 por.84.t:0 "The Federal Iberian Union"
 por.84.d:0 "§YAlternate history.§! Spain has accepted. The two states will merge into one federation, the Iberian Union, with institutions in both capitals. It is the most radical redrawing of the map of western Europe in living memory, and it was done by treaty."
 por.84.a:0 "One federation."
 por.85.t:0 "Madrid Declines the Federation"
 por.85.d:0 "Spain will not go further. The union of institutions stays as it is, and the federal idea returns to the lecture halls it came from."
 por.85.a:0 "The union stands as it is."
