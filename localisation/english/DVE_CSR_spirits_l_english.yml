l_english:
 # ==== DvE - spiriti dell'albero CSR ====

 idea_CSR_internationalist_faction:0 "The Internationalist Current"
 idea_CSR_internationalist_faction_desc:0 "China is one front of something larger, and never the most important one. It is an unpopular thing to say in Chinese, and the cadres who say it say it anyway."

 idea_CSR_revolutionary_faction:0 "The Revolutionary Current"
 idea_CSR_revolutionary_faction_desc:0 "The revolution is not a thing that happened; it is a thing that is happening, and will stop the moment anyone is allowed to sit down. Nobody sits down."

 idea_CSR_workerist_faction:0 "The Workerist Current"
 idea_CSR_workerist_faction_desc:0 "Power belongs to those who administer production, which in practice means those who administer the administrators. Concrete is poured. Questions are discouraged."

 idea_CSR_all_power_soviets:0 "All Power to The Soviets"
 idea_CSR_all_power_soviets_desc:0 "The soviets were not a stage on the way to something else. They were the something else, and the Republic is finally governed by them."

 idea_CSR_all_power_revolution:0 "All Power to The Revolution"
 idea_CSR_all_power_revolution_desc:0 "Not a republic that had a revolution: a revolution that happens to hold provinces. Borders, ministries and quiet evenings are all provisional."

 idea_CSR_all_power_party:0 "All Power to The Party"
 idea_CSR_all_power_party_desc:0 "The Party is not an organ of the state. The state is an organ of the Party. For years this was a distinction only pedants drew; it is now written down."

 idea_CSR_socialization_means:0 "Socialization of the Means of Production"
 idea_CSR_socialization_means_desc:0 "The factory belongs to the people inside it, and so does the decision about what it makes on Thursday. Lines find their rhythm astonishingly fast. Groundbreaking takes three meetings."

 idea_CSR_collectivization_means:0 "Collectivization of the Means of Production"
 idea_CSR_collectivization_means_desc:0 "Everything is held in common, which means everything is claimed by everyone. Output climbs and so does the bill the Republic settles every month in grain and cloth."

 idea_CSR_state_capitalism:0 "State Capitalism"
 idea_CSR_state_capitalism_desc:0 "The commanding heights are held by one owner, and that owner does not negotiate with its workforce. The results are undeniable. So is what they cost."

 idea_CSR_restore_red_army:0 "The Red Army Restored"
 idea_CSR_restore_red_army_desc:0 "An army of volunteers with commissars beside the officers rather than above them. It learns quickly, because nobody has been shot for suggesting an improvement."

 idea_CSR_restore_soviet_army:0 "The Soviet Army Restored"
 idea_CSR_restore_soviet_army_desc:0 "Mass, discipline and a very short conversation about individual initiative. It will be enormous long before it is good."

 idea_CSR_sino_soviet_agreement:0 "Sino-Soviet Agreement"
 idea_CSR_sino_soviet_agreement_desc:0 "Two revolutions sign as equals, which is exactly the phrasing both delegations insisted on and neither entirely believes."

 idea_CSR_soviet_chinese_alliance:0 "Soviet-Chinese Alliance"
 idea_CSR_soviet_chinese_alliance_desc:0 "Not a treaty between equals but a common command, and everyone knows which capital it sits in. What it lacks in dignity it makes up for in divisions."

 idea_CSR_spectre_of_communism:0 "A Spectre is Haunting the World"
 idea_CSR_spectre_of_communism_desc:0 "It was a figure of speech for a century and a half. It is now a foreign policy with a budget."

 idea_CSR_trotsky_young_again:0 "The Permanent Revolution"
 idea_CSR_trotsky_young_again_desc:0 "The old man was right and was murdered for it, which the Republic considers proof rather than coincidence. The revolution does not stop at the border, or anywhere else."

 idea_CSR_party_with_a_state:0 "A Party With a State"
 idea_CSR_party_with_a_state_desc:0 "Other countries have a state that contains a party. Here the party has acquired a state, the way a man acquires a coat."

 idea_CSR_digital_marxism:0 "Full-Blown Digital Marxism"
 idea_CSR_digital_marxism_desc:0 "What the planners of the last century lacked was not will but arithmetic. The arithmetic has arrived, and it fits in a building outside Chengdu."

 idea_CSR_true_communist_economy:0 "A True Communist Economy"
 idea_CSR_true_communist_economy_desc:0 "No market, no rent, no owner. Whether it works is a question the Republic has stopped treating as open."

 idea_CSR_some_more_equal:0 "Some Are More Equal Than Others"
 idea_CSR_some_more_equal_desc:0 "The plan is met, the quotas are exceeded, and the men who sign off on both eat rather better than the men who fill them. Everyone has noticed. Nobody says so."

 idea_CSR_workers_of_world_unite:0 "Workers of the World Unite"
 idea_CSR_workers_of_world_unite_desc:0 "An army that reads. It is slower to form than a conscript mass and considerably harder to break, because it knows precisely what it would be surrendering."

 idea_CSR_ura:0 "URA!"
 idea_CSR_ura_desc:0 "There is no translation. There has never needed to be one."
