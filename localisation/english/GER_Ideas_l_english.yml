l_english:
 GER_rise_of_radicalism:0 "Rise of Radicalism"
 GER_rise_of_radicalism_desc:0 "Political extremism is spreading across the Federal Republic. As confidence in established parties declines, radical movements on both ends of the political spectrum gain increasing support, threatening Germany's democratic stability."

 GER_german_legacy:0 "The German Legacy"
 GER_german_legacy_desc:0 "The shadows of Germany's turbulent past continue to shape its political identity. Historical responsibility, public distrust of militarism, and conflicting visions of the nation's future complicate efforts to establish a unified political direction."

 GER_society_in_transition:0 "A Society in Transition"
 GER_society_in_transition_desc:0 "Germany's population is undergoing significant demographic changes. Immigration helps address labour shortages and an ageing workforce, while integration, housing shortages, and pressure on public services present challenges for policymakers."

 GER_hollow_bundeswehr:0 "The Hollow Bundeswehr"
 GER_hollow_bundeswehr_desc:0 "Despite possessing modern equipment and highly trained personnel, the Bundeswehr suffers from persistent shortages, inadequate infrastructure, and limited operational readiness. Years of insufficient investment have left Germany's armed forces struggling to meet their commitments."

 GER_german_division:0 "East–West Divide"
 GER_german_division_desc:0 "More than three decades after reunification, economic disparities, political polarization and cultural differences continue to divide eastern and western Germany."

 GER_cracks_in_wirtwunder:0 "Cracks in the Wirtschaftswunder"
 GER_cracks_in_wirtwunder_desc:0 "Germany's once-celebrated economic model is showing signs of strain. Industrial stagnation, high energy costs, excessive bureaucracy, and declining competitiveness threaten the prosperity that has long defined the Federal Republic."

 GER_beacon_of_europe:0 "Beacon of Europe"
 GER_beacon_of_europe_desc:0 "As Europe's largest economy and a central pillar of European integration, Germany remains an influential defender of democratic institutions and continental cooperation. Despite mounting domestic challenges, the Federal Republic continues to play a leading role in shaping Europe's future."