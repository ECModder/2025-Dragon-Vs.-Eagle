l_english:
 ROM_presidency.1.t: "Klaus Iohannis Resigns"
 ROM_presidency.1.desc: "On 12 February 2025, Klaus Iohannis has left the office of President of Romania. Senate President Ilie Bolojan has assumed the presidency on an interim basis until a new president is elected."
 ROM_presidency.1.a: "Ilie Bolojan assumes the interim presidency."

 ROM_nicusor_dan:0 "Nicusor Daniel Dan"
 ROM_nicusor_dan_desc:0 "A mathematician and politician who became a prominent figure in Romanian public life. His leadership will shape the country's direction in the years ahead."
 ROM_ilie_bolojan:0 "Ilie Bolojan"
 ROM_ilie_bolojan_desc:0 "A Romanian politician and longtime administrator known for his work in local government. As leader, he faces the challenge of steering Romania through a period of political change."
 ROM_klaus_iohannis:0 "Klaus Iohannis"
 ROM_klaus_iohannis_desc:0 "Klaus Iohannis, a former teacher and longtime mayor of Sibiu, served as Romania’s president from 2014 to 2025. Known for his reserved style and pro-Western outlook, he led the country through a decade of political tension and shifting alliances."
