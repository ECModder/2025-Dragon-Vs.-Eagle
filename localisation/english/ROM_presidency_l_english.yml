l_english:
 ROM_presidency.1.t: "Klaus Iohannis Resigns"
 ROM_presidency.1.desc: "On 12 February 2025, Klaus Iohannis has left the office of President of Romania. Senate President Ilie Bolojan has assumed the presidency on an interim basis until a new president is elected."
 ROM_presidency.1.a: "Ilie Bolojan assumes the interim presidency."

 ROM_presidency.2.t: "Nicusor Dan Takes Office"
 ROM_presidency.2.desc: "Following the 2025 presidential election, Nicusor Dan has taken the oath of office and become President of Romania."
 ROM_presidency.2.a: "A new president takes office."

 ROM_IOHANNIS_DESC: "President of Romania, 2014–2025."
 ROM_ILIE_BOLOJAN_DESC: "Interim President of Romania, February–May 2025."
 ROM_NICUSOR_DAN_DESC: "President of Romania from May 2025."
