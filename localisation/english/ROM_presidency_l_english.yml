l_english:

 ROM_nicusor_dan:0 "Nicusor Daniel Dan"
 ROM_nicusor_dan_desc:0 "A mathematician and politician who became a prominent figure in Romanian public life. His leadership will shape the country's direction in the years ahead."
 ROM_ilie_bolojan:0 "Ilie Bolojan"
 ROM_ilie_bolojan_desc:0 "A Romanian politician and longtime administrator known for his work in local government. As leader, he faces the challenge of steering Romania through a period of political change."
 ROM_klaus_iohannis:0 "Klaus Iohannis"
 ROM_klaus_iohannis_desc:0 "Klaus Iohannis, a former teacher and longtime mayor of Sibiu, served as Romania’s president from 2014 to 2025. Known for his reserved style and pro-Western outlook, he led the country through a decade of political tension and shifting alliances."

 # ---- 2025 party leaders (characters in common/characters/DVE_ROM.txt) ----
 ROM_george_simion:0 "George Simion"
 ROM_george_simion_desc:0 "Co-founder and president of the Alliance for the Union of Romanians (AUR) since 2019. A street organiser turned parliamentary leader, he campaigns on sovereignty, the Orthodox faith and the union of Romania and Moldova, and speaks for voters who feel forgotten by Bucharest and Brussels alike."
 ROM_calin_georgescu:0 "Calin Georgescu"
 ROM_calin_georgescu_desc:0 "An agronomist and former UN official who came out of nowhere to win the first round of the November 2024 presidential election before the Constitutional Court annulled it. Barred from the rerun and under criminal investigation, he remains the hero of the sovereigntist street and the man the uprising turns to first."
 ROM_crin_antonescu:0 "Crin Antonescu"
 ROM_crin_antonescu_desc:0 "A veteran liberal, former leader of the National Liberal Party and President of the Senate, who briefly served as interim President of Romania in 2012. In 2025 he returns as the candidate of the governing coalition, offering experience and the backing of the established parties."
 ROM_elena_lasconi:0 "Elena Lasconi"
 ROM_elena_lasconi_desc:0 "A former television journalist and mayor of Campulung, she leads the Save Romania Union (USR). She reached the run-off of the annulled 2024 presidential election and campaigns for clean government and a firmly pro-European Romania."
 ROM_diana_sosoaca:0 "Diana Sosoaca"
 ROM_diana_sosoaca_desc:0 "A lawyer and the combative founder of S.O.S. Romania. Elected to the European Parliament in 2024 and barred from that year's presidential race, she thrives on confrontation and speaks for the most radical wing of Romanian nationalism."
 ROM_anamaria_gavrila:0 "Anamaria Gavrila"
 ROM_anamaria_gavrila_desc:0 "Leader of the Party of Young People (POT), a small sovereigntist party that rose to prominence by backing Calin Georgescu in 2024. She presents herself as the voice of a new generation that has given up on the old parties."

