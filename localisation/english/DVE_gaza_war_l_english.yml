 # ---------------- events ----------------
 gaza_war.1.t:0 "Hamas Defeated in Gaza"
 gaza_war.1.d:0 "After months of fighting, the last organised Hamas brigades in the Gaza Strip have collapsed. The army now controls the Strip, and the government must decide how Gaza will be governed after the war."
 gaza_war.1.a:0 "The campaign is over."
 gaza_war.3.t:0 "Ceasefire in Gaza"
 gaza_war.3.d:0 "International pressure and exhaustion at home have forced a ceasefire. Hamas is battered but still holds the Gaza Strip, and the government faces hard questions about a war that did not reach its goals."
 gaza_war.3.a:0 "We will have to accept it."
 gaza_war.4.t:0 "We Endured"
 gaza_war.4.d:0 "A ceasefire has come into force. Gaza lies in ruins, but the movement survived the Israeli campaign and still holds the Strip."
 gaza_war.4.a:0 "We are still here."
