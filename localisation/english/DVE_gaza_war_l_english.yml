 # ---------------- Hamas decisions ----------------
 HAM_gaza_condemn_ethics:0 "Condemn Israeli Military Ethics"
 HAM_gaza_condemn_ethics_desc:0 "Push the conduct of the Israeli campaign to the front of the world's attention and make every week of the war more costly for Jerusalem."
 HAM_gaza_humanitarian_aid:0 "A Cry for Humanitarian Aid"
 HAM_gaza_humanitarian_aid_desc:0 "Appeal to the United Nations, Qatar and Egypt for aid convoys. International pressure will slow the Israeli advance."
 HAM_gaza_plan_next_offensive:0 "Plan for the Next Offensive"
 HAM_gaza_plan_next_offensive_desc:0 "Regroup the surviving brigades and prepare the next round of operations."
 HAM_gaza_defensive_parameters:0 "Organize Defensive Parameters"
 HAM_gaza_defensive_parameters_desc:0 "Divide the Strip into defensive sectors so that no single breakthrough can collapse the front."
 HAM_gaza_underground_infrastructure:0 "Our Underground Infrastructure"
 HAM_gaza_underground_infrastructure_desc:0 "Repair and extend the tunnel network beneath Gaza to move fighters and supplies out of sight."
 HAM_gaza_desperate_defense:0 "A Strategy of Desperate Defense"
 HAM_gaza_desperate_defense_desc:0 "Commit every remaining fighter to holding the ground, whatever the cost."
 HAM_gaza_attack_idf_outposts:0 "Attack IDF Outposts in Gaza"
 HAM_gaza_attack_idf_outposts_desc:0 "Strike Israeli military positions inside the Strip to slow their operations."
 HAM_gaza_incursion:0 "Incursion on Zionist Territory"
 HAM_gaza_incursion_desc:0 "Raid Israeli army positions across the border. It will set the enemy back, but it will also harden Israeli resolve."

 # ---------------- Israel decisions ----------------
 ISR_gaza_us_backing:0 "Secure American Backing"
 ISR_gaza_us_backing_desc:0 "Lock in diplomatic and military support from Washington for the length of the campaign."
 ISR_gaza_hostage_negotiations:0 "Hostage Negotiations"
 ISR_gaza_hostage_negotiations_desc:0 "Work through Qatari and Egyptian mediators to bring hostages home."
 ISR_gaza_counter_pressure:0 "Counter the International Pressure"
 ISR_gaza_counter_pressure_desc:0 "Send envoys to our allies to answer the criticism and keep the campaign's freedom of action."
 ISR_gaza_air_campaign:0 "Precision Air Campaign"
 ISR_gaza_air_campaign_desc:0 "Target Hamas command posts, weapons stores and launch sites from the air."
 ISR_gaza_mobilize_reserves:0 "Mobilize the Reserves"
 ISR_gaza_mobilize_reserves_desc:0 "Call up the reserve brigades for a long campaign."
 ISR_gaza_clear_tunnels:0 "Clear the Tunnel Network"
 ISR_gaza_clear_tunnels_desc:0 "Engineering units map and destroy the tunnels Hamas uses to move under the Strip."
 ISR_gaza_northern_ground_op:0 "Ground Operation in Northern Gaza"
 ISR_gaza_northern_ground_op_desc:0 "Armoured and infantry brigades move into the north of the Strip and Gaza City."
 ISR_gaza_rafah_operation:0 "Operation in Rafah"
 ISR_gaza_rafah_operation_desc:0 "Take the last Hamas stronghold on the Egyptian border."

