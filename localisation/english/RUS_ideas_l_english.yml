l_english:
 RUS_the_russian_regime:0 "The Russian Regime"
 RUS_the_russian_regime_desc:0 "Elections are held, parties are registered, courts convene - and none of it decides anything. Power runs in a single vertical line from the Kremlin outward, and everyone in the country knows exactly where they stand on it. The system is remarkably stable and remarkably incapable of correcting itself."
 RUS_csto_military_alliance:0 "CSTO Military Alliance"
 RUS_csto_military_alliance_desc:0 "On paper it is a mutual defence pact of sovereign equals. In practice it is a ring of clients whose officers train in Russian academies, whose armies use Russian doctrine, and whose governments know who to call when the crowds gather in the capital."
 RUS_brics_member:0 "BRICS Member"
 RUS_brics_member_desc:0 "A bloc that agrees on very little except that the old order should not get to write the rules alone. Its summits produce more communiques than institutions - but its banks lend without conditions, its members buy what the West will not, and its very existence means the door is never fully shut."
 RUS_the_war_in_ukraine:0 "The War in Ukraine"
 RUS_the_war_in_ukraine_desc:0 "It was to last three days. It has lasted years. The front feeds on men and shells and gives back neither, the economy bends around it, and an entire generation has learned soldiering the hard way - as veterans if they are lucky, as casualty figures if they are not."
 RUS_the_russian_army:0 "The Russian Army"
 RUS_the_russian_army_desc:0 "Vast, stubborn and difficult to move. It digs in superbly and dies in place rather than yield ground, but its columns crawl, its staffs improvise, and its logistics have never quite recovered from the reforms that were supposed to fix them."
 RUS_dependent_on_china:0 "Dependent on China"
 RUS_dependent_on_china_desc:0 "With the West closed, one customer remains - and that customer sets the price. Chinese goods fill the shops, Chinese machine tools keep the plants running, and every deal signed in Beijing costs a little more sovereignty than the last."
 RUS_papier_mache_giant:0 "A Papier-Mache Giant"
 RUS_papier_mache_giant_desc:0 "The parades are magnificent. The maps are enormous. Behind them sit padded readiness reports, depots emptied by theft, and factories whose output figures were agreed upon long before anything was produced. Nobody knows how much of the giant is real until it is struck."
 RUS_specter_of_the_ussr:0 "The Specter of the USSR"
 RUS_specter_of_the_ussr_desc:0 "The Union has been gone for a generation and refuses to leave. Its anthem stirs crowds, its victory is the one unquestioned holy day, its red flags reappear at every demonstration - and its memory makes the present republic look small by comparison."
