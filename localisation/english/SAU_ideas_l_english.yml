 SAU_royal_absolute_will:0 "The Royal Absolute Will"
 SAU_royal_absolute_will_desc:0 "Power is tightly centralized under the Crown Prince and the Council of Ministers. While this top-down command allows the state to bypass traditional bureaucratic gridlock and execute sweeping societal reforms instantly, it makes the entire government structure deeply dependent on a single leadership core."

 SAU_gigaproject_capital_drain:0 "The Gigaproject Capital Drain"
 SAU_gigaproject_capital_drain_desc:0 "The sheer scale of Vision 2030 projects, such as NEOM, the Line, and the New Murabba demands high amounts of domestic funding. Because foreign direct investment has fallen short of initial targets, the Public Investment Fund (PIF) must constantly swallow immense domestic capital costs, placing a heavy strain on civilian industrial capacity."

 SAU_petro_dollar_paradox:0 "The Petro-Dollar Paradox"
 SAU_petro_dollar_paradox_desc:0 "Saudi Arabia is aggressively trying to build a post-oil economy, yet it relies entirely on high crude oil prices to fund that very transition. With the state's fiscal break-even point hovering above $90 a barrel, any unexpected drop in global oil markets or enforcement of OPEC+ production cuts directly slows down the diversification progress."

 SAU_localizing_the_armed_forces:0 "Localizing the Armed Forces"
 SAU_localizing_the_armed_forces_desc:0 "Historically dependent on Western arms manufacturers for its high-tech defense needs, the Kingdom is enforcing a strict industrial mandate to localize 50% of its military spending. While this initiative is laying the foundation for a domestic defense industry, the transitional phase introduces temporary supply delays and bottlenecks for frontline deployments."

