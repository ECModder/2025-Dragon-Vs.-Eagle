l_english:
 prc_focus:0 "People's Republic of China"
 PRC_state_of_the_republic:0 "The State of the Republic"
 PRC_state_of_the_republic_desc:0 "Beijing takes stock: a weak army, a fractured Party, and an economy still finding its feet. The Congress must decide where to spend its strength first."
 PRC_the_peoples_liberation_army:0 "The People's Liberation Army"
 PRC_the_peoples_liberation_army_desc:0 "Decades of underinvestment have left the PLA a shadow of the force the Party needs. Reform cannot wait."
 PRC_gradual_modernization:0 "Gradual Modernization"
 PRC_gradual_modernization_desc:0 "A measured, methodical rebuilding of the armed forces, careful not to destabilize the wider economy."
 PRC_crash_rearmament_program:0 "Crash Rearmament Program"
 PRC_crash_rearmament_program_desc:0 "Every factory, every yuan, every worker mobilized for one goal: a modern military, built in years rather than decades."
 PRC_conscription_overhaul:0 "Conscription Overhaul"
 PRC_conscription_overhaul_desc:0 "A wider and better-organized draft brings the PLA's ranks back up to strength."
 PRC_officer_corps_reform:0 "Officer Corps Reform"
 PRC_officer_corps_reform_desc:0 "Promotion by merit, not only by loyalty: a professionalized officer corps takes shape."
 PRC_combined_arms_doctrine:0 "Combined Arms Doctrine"
 PRC_combined_arms_doctrine_desc:0 "Infantry, armor and artillery drilled to operate as one."
 PRC_peoples_war_strategy:0 "People's War Strategy"
 PRC_peoples_war_strategy_desc:0 "Mao's old doctrine, dusted off: the masses themselves are the PLA's deepest reserve."
 PRC_militia_integration:0 "Militia Integration"
 PRC_militia_integration_desc:0 "Provincial militias are folded into the regular reserve structure."
 PRC_veteran_cadres:0 "Veteran Cadres"
 PRC_veteran_cadres_desc:0 "Long-service soldiers are retained as instructors, passing on hard-won experience."
 PRC_expand_the_fleet:0 "Expand the Fleet"
 PRC_expand_the_fleet_desc:0 "New hulls slide down the ways at Dalian and Jiangnan."
 PRC_coastal_defense_squadrons:0 "Coastal Defense Squadrons"
 PRC_coastal_defense_squadrons_desc:0 "Fast attack craft and coastal patrol groups shield the mainland's long coastline."
 PRC_blue_water_ambitions:0 "Blue-Water Ambitions"
 PRC_blue_water_ambitions_desc:0 "The PLA Navy looks past its own coastline for the first time."
 PRC_modernize_the_air_force:0 "Modernize the Air Force"
 PRC_modernize_the_air_force_desc:0 "Obsolete airframes are retired in favor of a new generation of aircraft."
 PRC_domestic_fighter_program:0 "Domestic Fighter Program"
 PRC_domestic_fighter_program_desc:0 "State design bureaus race to field a fighter that owes nothing to foreign blueprints."
 PRC_air_defense_network:0 "Air Defense Network"
 PRC_air_defense_network_desc:0 "Radar stations and interceptor bases knit the mainland's skies into a single defensive web."
 PRC_state_arms_industry:0 "State Arms Industry"
 PRC_state_arms_industry_desc:0 "New arms plants rise under direct state control."
 PRC_soviet_military_technology:0 "Soviet Military Technology"
 PRC_soviet_military_technology_desc:0 "Blueprints and advisors cross the border, a decades-old debt of revolutionary solidarity called in."
 PRC_military_academies_expansion:0 "Military Academies Expansion"
 PRC_military_academies_expansion_desc:0 "New academies open their doors, training the next generation of the PLA's command."
 PRC_a_modern_peoples_army:0 "A Modern People's Army"
 PRC_a_modern_peoples_army_desc:0 "Whichever road was taken, the PLA that emerges is unrecognizable from the force that started it."
 PRC_the_congress_convenes:0 "The Congress Convenes"
 PRC_the_congress_convenes_desc:0 "Five factions, one Party: the Congress must decide who truly speaks for the revolution."
 PRC_contain_the_hardliners:0 "Contain the Hardliners"
 PRC_contain_the_hardliners_desc:0 "The New Left and the Bolshevik faction are told, gently at first, to fall back in line."
 PRC_contain_the_reformists:0 "Contain the Reformists"
 PRC_contain_the_reformists_desc:0 "The Riformisti and their fellow travelers in the minor parties are reminded who holds power."
 PRC_denounce_the_new_left:0 "Denounce the New Left"
 PRC_denounce_the_new_left_desc:0 "State media turns on the New Left faction, branding its Maoist nostalgia a threat to stability."
 PRC_arrest_bolshevik_agitators:0 "Arrest Bolshevik Agitators"
 PRC_arrest_bolshevik_agitators_desc:0 "MSS units move against the Bolshevik faction's cells in the universities and the army."
 PRC_purge_the_ultra_left:0 "Purge the Ultra-Left"
 PRC_purge_the_ultra_left_desc:0 "A wave of expulsions clears the Party's leftmost wing from any position of real authority."
 PRC_totalitarian_threat_contained:0 "The Totalitarian Threat, Contained"
 PRC_totalitarian_threat_contained_desc:0 "The New Left and Bolshevik factions are reduced to a marginal, watched minority."
 PRC_strengthen_the_central_committee:0 "Strengthen the Central Committee"
 PRC_strengthen_the_central_committee_desc:0 "Power is drawn steadily back toward the Committee, at the expense of provincial autonomy."
 PRC_cult_of_personality:0 "Cult of Personality"
 PRC_cult_of_personality_desc:0 "Portraits, slogans, study sessions: the leadership is elevated above ordinary politics."
 PRC_centralist_supremacy:0 "Centralist Supremacy"
 PRC_centralist_supremacy_desc:0 "The Centralist faction now controls every major lever of the Party apparatus."
 PRC_denounce_the_reformists:0 "Denounce the Reformists"
 PRC_denounce_the_reformists_desc:0 "The Riformisti are accused of harboring capitalist sympathies under a socialist mask."
 PRC_arrest_liberal_intellectuals:0 "Arrest Liberal Intellectuals"
 PRC_arrest_liberal_intellectuals_desc:0 "Editors and academics sympathetic to the minor democratic parties disappear from public life."
 PRC_purge_the_right_opposition:0 "Purge the Right Opposition"
 PRC_purge_the_right_opposition_desc:0 "The RCCK, CNDCA and CDL are stripped of what little independent influence they retained."
 PRC_deng_faction_contained:0 "The Reformist Faction, Contained"
 PRC_deng_faction_contained_desc:0 "Talk of opening and liberalization is quietly shelved for another generation."
 PRC_paramount_leader:0 "The Paramount Leader"
 PRC_paramount_leader_desc:0 "Whatever faction was broken along the way, one man now stands unchallenged at the top of the Party."
 PRC_the_economy_needs_reform:0 "The Economy Needs Reform"
 PRC_the_economy_needs_reform_desc:0 "Decades of agrarian stagnation cannot be fixed with slogans alone."
 PRC_shorter_market_plans:0 "Shorter Market Plans"
 PRC_shorter_market_plans_desc:0 "Short, flexible economic plans, market-tested rather than dictated from above."
 PRC_the_five_year_plan:0 "The Five-Year Plan"
 PRC_the_five_year_plan_desc:0 "A single, centrally-dictated plan for every factory, farm and worker in the country."
 PRC_light_industry_push:0 "Light Industry Push"
 PRC_light_industry_push_desc:0 "Textile mills and consumer workshops spread through the coastal provinces."
 PRC_consumer_goods_production:0 "Consumer Goods Production"
 PRC_consumer_goods_production_desc:0 "Shop shelves fill for the first time in a generation."
 PRC_trade_liberalization:0 "Trade Liberalization"
 PRC_trade_liberalization_desc:0 "Export licenses are eased, and foreign currency begins to flow back into the country."
 PRC_special_economic_zones:0 "Special Economic Zones"
 PRC_special_economic_zones_desc:0 "Shenzhen and a handful of coastal cities are carved out as laboratories for a different kind of economy."
 PRC_foreign_investment_zones:0 "Foreign Investment Zones"
 PRC_foreign_investment_zones_desc:0 "Joint ventures bring foreign capital and foreign know-how through the same door."
 PRC_market_experimentation:0 "Market Experimentation"
 PRC_market_experimentation_desc:0 "Price controls are loosened, cautiously, on an ever-widening list of goods."
 PRC_heavy_industry_push:0 "Heavy Industry Push"
 PRC_heavy_industry_push_desc:0 "Steel mills and foundries are declared the measure of the nation's strength."
 PRC_steel_production_targets:0 "Steel Production Targets"
 PRC_steel_production_targets_desc:0 "Every province is set a quota, and every quota is announced as met."
 PRC_industrial_expansion:0 "Industrial Expansion"
 PRC_industrial_expansion_desc:0 "New industrial belts rise around the inland cities, spreading production away from the vulnerable coast."
 PRC_collectivize_agriculture:0 "Collectivize Agriculture"
 PRC_collectivize_agriculture_desc:0 "Private plots are folded into people's communes across the countryside."
 PRC_rural_communes:0 "Rural Communes"
 PRC_rural_communes_desc:0 "The commune becomes the basic unit of rural life, organizing labor for the state's needs."
 PRC_grain_production_quotas:0 "Grain Production Quotas"
 PRC_grain_production_quotas_desc:0 "Fixed procurement quotas guarantee the cities' granaries, whatever the cost to the villages."
 PRC_nationalize_key_industries:0 "Nationalize Key Industries"
 PRC_nationalize_key_industries_desc:0 "The last privately-held enterprises of any size are brought under state ownership."
 PRC_state_owned_enterprises:0 "State-Owned Enterprises"
 PRC_state_owned_enterprises_desc:0 "New state combines absorb what remains of the old private sector."
 PRC_five_year_plan_fulfilled:0 "The Five-Year Plan, Fulfilled"
 PRC_five_year_plan_fulfilled_desc:0 "The Plan is declared a triumph, its shortfalls quietly written out of the official record."
 PRC_economic_miracle:0 "Economic Miracle"
 PRC_economic_miracle_desc:0 "Whichever path was taken, the People's Republic enters a new economic era."
