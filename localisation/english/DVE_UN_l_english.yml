 DVE_un_leg_plus_4_tt:0 "UN Legitimacy: §G+4§!"
 DVE_un_leg_plus_6_tt:0 "UN Legitimacy: §G+6§!"
 DVE_un_leg_plus_8_tt:0 "UN Legitimacy: §G+8§!"
 DVE_un_leg_minus_20_tt:0 "UN Legitimacy: §R-20§!"
