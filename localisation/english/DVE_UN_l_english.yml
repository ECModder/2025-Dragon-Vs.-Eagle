l_english:
 DVE_un_recognition_category:0 "The United Nations: The Fight for Recognition"
 DVE_un_recognition_category_desc:0 "§YHow to become a UN member§!\nTo become a member of the United Nations, a country must first build sufficient UN Legitimacy through diplomatic efforts and international cooperation. Once enough legitimacy has been gained, the country may submit an application for membership, which will be reviewed by the international community. Depending on its stability, diplomatic standing, and current situation, the application has a chance of being accepted or rejected. If accepted, the country officially joins the United Nations and gains all benefits of membership.\n\n§YThe Fight for Recognition§!\nFor many states, gaining a seat at the United Nations is more than a simple application; it is a struggle for international recognition. Governments must prove their legitimacy, strengthen diplomatic ties, and demonstrate their ability to uphold international law and maintain stability. Recognition can be complicated by rival governments, territorial disputes, foreign opposition, or a lack of diplomatic support, making UN membership a difficult but important step toward gaining legitimacy on the world stage."
 DVE_un_member_category:0 "The United Nations: The General Assembly"
 DVE_un_member_category_desc:0 "§YThe Guardians of Peace?§!\nThe United Nations is an international organization founded in 1945, following the devastation of World War II, to promote international peace, security, and cooperation between nations. Through its various bodies, the UN provides a forum for diplomacy, humanitarian assistance, and collective action, seeking to prevent conflicts and address major global crises. Its members work together to uphold international law, resolve disputes peacefully, and respond to threats to global stability.\n\n§YThe Security Council§!\nThere are exactly fifteen UN Security Council members. Five of them (the Veto Right powers) are permanent, while the other 10 are replaced every year.\n§YTerm ending December 31, 2026:§! Denmark, Greece, Pakistan, Panama, Somalia.\n§YTerm ending December 31, 2027:§! Bahrain, Colombia, Democratic Republic of the Congo, Latvia, Liberia.\n\nThe five permanent members hold the power to veto a motion, even when a majority is not reached in their negation."

