 DVE_un_member_spirit:0 "Member of the United Nations"
 DVE_un_member_spirit_desc:0 "A seat in the General Assembly: recognized by the world, and bound by its rules."
 DVE_un_unrecognized_spirit:0 "Unrecognized by the United Nations"
 DVE_un_unrecognized_spirit_desc:0 "No seat, no vote, no voice. For most of the world this country does not officially exist."
 DVE_un_program_donor:0 "UN Program Donor"
 DVE_un_program_donor_desc:0 "Our contributions keep UN programs running, and the world has noticed."
 DVE_un_assembly_goodwill:0 "Goodwill at the General Assembly"
 DVE_un_promote_cooperation_threat:0 "UN cooperation campaign"

 dve_un.1.t:0 "[ROOT.GetNameDefCap] Seeks United Nations Membership"
 dve_un.1.d:0 "The application is ready. Once it is submitted, the Security Council and the General Assembly will decide whether [ROOT.GetNameDef] takes a seat among the nations.\n\nThe vote depends on our stability, on whether we are at peace, on how the world sees us, and above all on the five powers that hold a veto.\n\nEstimated chance of acceptance: §Y[?DVE_un_accept_chance|0]%§!"
 dve_un.1.a:0 "Submit the application"
 dve_un.1.b:0 "Not yet"
 dve_un.2.t:0 "[ROOT.GetNameDefCap] Joins the United Nations"
 dve_un.2.d:0 "The votes are counted and the result is read out to applause. A new flag is raised in front of the headquarters in New York: [ROOT.GetNameDef] is a member of the United Nations."
 dve_un.2.a:0 "We have a seat at the table"
 dve_un.3.t:0 "Membership Application Rejected"
 dve_un.3.d:0 "The application did not pass. Whether it was a veto in the Security Council or too few hands raised in the Assembly, the answer is the same: not this time.\n\nWe can keep building our legitimacy and try again."
 dve_un.3.a:0 "We will be back"
 dve_un.4.t:0 "[DVE_un_new_member.GetNameDefCap] Joins the United Nations"
 dve_un.4.d:0 "The General Assembly has voted to admit [DVE_un_new_member.GetNameDef] as a member of the United Nations. Its flag now flies with the others in front of the headquarters in New York."
 dve_un.4.a:0 "A new member"
