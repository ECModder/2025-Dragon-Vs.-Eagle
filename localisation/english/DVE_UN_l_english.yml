 DVE_un_status_1:0 "Internationally Isolated"
 DVE_un_status_2:0 "Limited Recognition"
 DVE_un_status_3:0 "Emerging Recognition"
 DVE_un_status_4:0 "Broadly Recognized"
 DVE_un_status_5:0 "Highly Recognized"

 DVE_un_seek_recognition:0 "Seek UN Recognition"
 DVE_un_seek_recognition_desc:0 "Our delegation asks to be heard in New York. Every speech from the visitors' gallery is one more reminder that we exist."
 DVE_un_diplomatic_outreach:0 "Diplomatic Outreach"
 DVE_un_diplomatic_outreach_desc:0 "Envoys are sent to the capitals that have not yet made up their mind about us."
 DVE_un_international_cooperation:0 "International Cooperation"
 DVE_un_international_cooperation_desc:0 "Joining treaties, conventions and agencies that do not require a seat in the Assembly shows the world we play by its rules."
 DVE_un_host_summit:0 "Host International Summit"
 DVE_un_host_summit_desc:0 "Foreign delegations in our capital, our flag beside theirs on the podium: recognition in everything but name."
 DVE_un_humanitarian_aid:0 "Provide Humanitarian Aid"
 DVE_un_humanitarian_aid_desc:0 "Aid convoys carry our flag where the world's attention is. Gratitude is a form of recognition too."
 DVE_un_appeal_global_support:0 "An Appeal for Global Support"
 DVE_un_appeal_global_support_desc:0 "A direct appeal to the peoples and parliaments of the world, over the heads of the governments that ignore us."
 DVE_un_pursue_recognition:0 "Pursue Diplomatic Recognition"
 DVE_un_pursue_recognition_desc:0 "A full campaign for formal recognition, one government at a time, with everything our diplomacy can offer in exchange."
 DVE_un_submit_application:0 "Submit Membership Application"
 DVE_un_submit_application_desc:0 "Our legitimacy can grow no further from the outside. It is time to ask the General Assembly for a seat."

 DVE_un_attend_assembly:0 "Attend General Assembly"
 DVE_un_attend_assembly_desc:0 "Our head of delegation takes the podium in New York. Showing up, speaking and listening is half of diplomacy."
 DVE_un_attend_assembly_tt:0 "Every other UN member gains the opinion modifier §Y$DVE_un_assembly_goodwill$§! (§G+10§!) toward us."
 DVE_un_support_development:0 "Support UN Development Programs"
 DVE_un_support_development_desc:0 "Schools, clinics and wells with a blue flag on the gate, and our name on the list of donors."
 DVE_un_fund_programs:0 "Fund UN Programs"
 DVE_un_fund_programs_desc:0 "A larger share of the UN budget buys a larger share of its goodwill."
 DVE_un_promote_cooperation:0 "Promote Worldwide Cooperation"
 DVE_un_promote_cooperation_desc:0 "A campaign of summits, resolutions and mediation offers to lower the temperature of the world."

 DVE_un_below_100_tt:0 "UN Legitimacy is below §Y100§!"
 DVE_un_at_100_tt:0 "UN Legitimacy has reached §Y100§!"
