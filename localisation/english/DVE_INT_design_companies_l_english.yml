l_english:

 INT_tank_manufacturer:0 "Self-Managed Armor Works"
 INT_tank_manufacturer_desc:0 "No owner, no board - just the workers who used to build tractors, now voting on gun mantlets and voting on shift schedules with the same show of hands."

 INT_naval_manufacturer:0 "Self-Managed Shipyard"
 INT_naval_manufacturer_desc:0 "The keel-layers and the riveters run the yard themselves now. The ships still get built - if anything, faster, since nobody is arguing with a foreman anymore."

 INT_light_aircraft_manufacturer:0 "Aviation Cooperative - Fighters"
 INT_light_aircraft_manufacturer_desc:0 "A cooperative of engineers and assembly crews, chasing every gram they can shave off an airframe. Nobody signs off on the design; the whole floor argues it out."

 INT_medium_aircraft_manufacturer:0 "Aviation Cooperative - Medium Bombers"
 INT_medium_aircraft_manufacturer_desc:0 "The same cooperative, scaled up for bigger airframes and longer wings. The council still argues over every rivet, just over more of them."

 INT_heavy_aircraft_manufacturer:0 "Aviation Cooperative - Heavy Bombers"
 INT_heavy_aircraft_manufacturer_desc:0 "Building the biggest airframes the cooperative can put in the sky. Nobody enjoys the load-bearing calculations, but everybody gets a vote on them anyway."

 INT_naval_aircraft_manufacturer:0 "Aviation Cooperative - Naval Aviation"
 INT_naval_aircraft_manufacturer_desc:0 "A section of the cooperative that answers to the shipyards more than to itself, building whatever needs to fold its wings and land on a deck."

 INT_motorized_equipment_manufacturer:0 "Transport Workers' Cooperative"
 INT_motorized_equipment_manufacturer_desc:0 "The people who used to drive the trucks now decide how they get built. It shows in the details nobody else would have bothered fixing."

 INT_infantry_equipment_manufacturer:0 "People's Small Arms Workshop"
 INT_infantry_equipment_manufacturer_desc:0 "Every worker who ever stood guard outside a factory gate had an opinion on the rifle they were handed. This is what happens when the workshop finally listens to all of them at once."

 INT_artillery_manufacturer:0 "People's Artillery Foundry"
 INT_artillery_manufacturer_desc:0 "A foundry council that debates barrel lengths the way it once debated shift quotas - loudly, at length, and with a vote at the end that everyone actually respects."
