l_english:
 # Descrizioni dei paesi nella schermata di selezione. Senza queste il
 # riquadro "Brief History" mostra la chiave grezza, come DVE_USA_BOOKMARK_DESC.
 DVE_USA_BOOKMARK_DESC:0 "The republic did not fall so much as change hands. Two decades of hollowed-out towns and a political class that stopped pretending produced something nobody in Washington had planned for, and the flag over the Capitol is not the one that was there in 2016. Abroad, the allies are still waiting to be told what the new arrangement means for them."
 DVE_PRC_BOOKMARK_DESC:0 "The century was supposed to be Chinese and, on the numbers, it is. Beijing holds the supply chains, the ports and the debt of half the world. What it does not yet hold is the sea it considers its own, and everyone from Taipei to Canberra knows the question will be settled in this decade."
 DVE_RUS_BOOKMARK_DESC:0 "Three years of war have bought a strip of ruined ground and cost a generation. The army is a hollow shell dressed as a superpower, the economy runs on Chinese credit, and the man who started it is old. What comes after him is the only question that matters in Moscow."
 DVE_ENG_BOOKMARK_DESC:0 "The union holds together out of habit. A weary electorate, an army smaller than at any point since the Napoleonic wars, and a foreign policy that consists of following Washington a respectful step behind. There is still a fleet, still a bomb, and still the assumption that Britain matters."
 DVE_FRA_BOOKMARK_DESC:0 "The Fifth Republic is running out of centre. The Assembly has three blocs that will not govern together, the Sahel garrisons have come home, and the force de frappe is the last argument that nobody disputes. Paris still speaks for Europe when Berlin hesitates."
 DVE_GER_BOOKMARK_DESC:0 "The engine of Europe is running cold. Cheap gas is gone, the factories are moving east, and the coalition argues about the past while the present gets away from it. Rearmament was announced with great solemnity and has proceeded with none."
 DVE_ITA_BOOKMARK_DESC:0 "Italy has learned to be governed from somewhere else - Brussels, Frankfurt, Washington - and has grown quietly tired of it. The industry of the north is still among the best in Europe and the Mediterranean is still, in Roman eyes, a domestic matter."
 DVE_POL_BOOKMARK_2025_DESC:0 "Poland has spent the war years becoming the largest land army in Europe, and it did not do so in order to be a junior partner. East of the Bug the old empire is coming apart; west of the Oder they are still debating. Warsaw has stopped waiting for either."
