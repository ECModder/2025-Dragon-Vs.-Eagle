l_english:
 INT_uprising_category:0 "The Unions Are Ready"
 INT_uprising_trigger_CMU:0 "Call the Communard Unions to Arms"
 INT_uprising_trigger_CMU_desc:0 "The Communard Republic's own unions are already halfway to insurrection. All they need is the Internationale's word."
 INT_uprising_trigger_SPA:0 "Call the Spanish Unions to Arms"
 INT_uprising_trigger_SPA_desc:0 "Spain's workers' clubs have been organizing quietly for months. It's time to see what they can do."
 INT_uprising_trigger_GDR:0 "Call the German Unions to Arms"
 INT_uprising_trigger_GDR_desc:0 "The old workers' movement never really died here, it just waited. The Internationale can give it a reason to move."
 INT_uprising_trigger_PRS:0 "Call the Portuguese Unions to Arms"
 INT_uprising_trigger_PRS_desc:0 "Portugal's unions have their own grievances and their own numbers. The Internationale only has to light the match."
 INT_uprising_trigger_ENG:0 "Call the British Unions to Arms"
 INT_uprising_trigger_ENG_desc:0 "A united front of every party of the British left, waiting for a single push."

 INT_uprising_annex_category:0 "The Internationale"
 INT_intl_subordinate_member:0 "Bring [FROM.GetName] Under the Internationale"
 INT_intl_subordinate_member_desc:0 "[FROM.GetNameDefCap] sits in the International as an equal. The revolution needs one command, not a table of allies: its government will be asked to answer to ours."
 INT_intl_subordinate_member_tt:0 "[FROM.GetNameDefCap] is asked to place itself under our authority. If it accepts it becomes our §Ysubject§! and can later be §Yunited§! with us. If it refuses we cannot ask again for §Y180 days§!."
 INT_intl_subordinate_not_asked_tt:0 "Is not already considering our request"
 INT_intl_subordinate_not_refused_tt:0 "Has not refused our request in the last §Y180 days§!"
 DVE_intl_standing_minus_15_tt:0 "Standing in the International: §R-15§!"
 INT_uprising_annex_puppet:0 "Formally Unite with [FROM.GetName]"
 INT_uprising_annex_puppet_desc:0 "The war that brought it into the fold is over. There's no reason left to keep it as a subject rather than a part of the Internationale itself."

 dve_intup.1.t:0 "The Unions Take the Streets"
 dve_intup.1.d:0 "The Internationale's agents have made their offer: power, backed by the unions and the workers' clubs, in exchange for a place in the fold. All it takes is a decision."
 dve_intup.1.a:0 "Take power"
 dve_intup.1.b:0 "Not yet"

 dve_intup.2.t:0 "The Uprising Failed"
 dve_intup.2.d:0 "The CGT and the workers' clubs of [int_uprising_failed_target.GetName] made their move and lost. The government held, and the moment has passed - for now."
 dve_intup.2.a:0 "Noted"

 dve_intup.3.t:0 "The Internationale Asks for Union"
 dve_intup.3.d:0 "A delegation of the Internationale has arrived with a plain request: our government is to answer to the central committee from now on. We would keep our institutions and our seat in the International, but foreign policy, the army and the plan would be decided elsewhere. They speak of one revolution and one command."
 dve_intup.3.a:0 "One revolution, one command"
 dve_intup.3.b:0 "We are comrades, not subordinates"

 dve_intup.4.t:0 "[From.GetNameDefCap] Accepts"
 dve_intup.4.d:0 "The government of [From.GetNameDef] has agreed to answer to the central committee. Its ministries now take their instructions from us, and the road to a formal union is open."
 dve_intup.4.a:0 "The union grows"

 dve_intup.5.t:0 "[From.GetNameDefCap] Refuses"
 dve_intup.5.d:0 "The government of [From.GetNameDef] has turned our delegation away. It remains a member of the International, but it will not answer to the central committee. The matter cannot be raised again for some time."
 dve_intup.5.a:0 "They will come around"
