l_english:

 DVE_domestic_affairs_category:0 "Domestic Affairs"
 DVE_domestic_affairs_category_desc:0 "Universal domestic policy tools open to any government, regardless of its own path to power."
 DVE_military_affairs_category:0 "Military Affairs"
 DVE_military_affairs_category_desc:0 "Universal tools for training and modernizing the armed forces, open to any government."
 DVE_foreign_relations_category:0 "Foreign Relations"
 DVE_foreign_relations_category_desc:0 "Universal diplomatic tools open to any government, regardless of its own path to power."

 DVE_anti_corruption_campaign:0 "Launch Anti-Corruption Campaign"
 DVE_anti_corruption_campaign_desc:0 "A sweeping crackdown on graft and bribery restores some public trust in the government.\n\n+0.2 weekly stability for 60 days."
 DVE_expand_public_services:0 "Expand Public Services"
 DVE_expand_public_services_desc:0 "Investment in public services takes time to reach people, but the population notices eventually.\n\nGrants +3% stability after 100 days."
 DVE_subsidize_strategic_industries:0 "Subsidize Strategic Industries"
 DVE_subsidize_strategic_industries_desc:0 "Direct subsidies squeeze more out of strategic industries, at the cost of public approval.\n\n-0.2 weekly stability for 90 days, grants +2% industrial output."
 DVE_improve_national_infrastructure:0 "Improve National Infrastructure"
 DVE_improve_national_infrastructure_desc:0 "A long-term investment in roads, rail and utilities.\n\nGrants +2% infrastructure construction speed after 120 days."
 DVE_crack_down_on_opposition:0 "Crack Down on Opposition"
 DVE_crack_down_on_opposition_desc:0 "Suppressing dissent boosts the ruling party, at a cost to overall stability.\n\nAfter 90 days, +3% party popularity and -3% stability."
 DVE_emergency_economic_measures:0 "Emergency Economic Measures"
 DVE_emergency_economic_measures_desc:0 "Wartime-style economic controls squeeze more out of the factories, at the cost of both stability and the shelves.\n\nFor 120 days: -5% consumer goods, +3% factory output, -0.2 weekly stability."

 DVE_military_exercises:0 "Military Exercises"
 DVE_military_exercises_desc:0 "Live exercises sharpen one branch of the armed forces, at the cost of political and command capital. Choose which branch to train."
 DVE_expand_officer_corps:0 "Expand Officer Corps"
 DVE_expand_officer_corps_desc:0 "A larger, better-trained officer corps takes time to bear fruit.\n\nGrants +3% army organization and +2% planning speed after 110 days."
 DVE_modernize_armed_forces:0 "Modernize Armed Forces"
 DVE_modernize_armed_forces_desc:0 "Modernization programs speed up research and boost factory output.\n\nFor 120 days: +4% research speed, +2% factory output."
 DVE_military_recruitment_drive:0 "Military Recruitment Drive"
 DVE_military_recruitment_drive_desc:0 "A nationwide recruitment campaign swells the ranks and rallies support for the war effort.\n\nFor 150 days: +5% recruitable population, +0.2% weekly war support."

 DVE_diplomatic_outreach:0 "Diplomatic Outreach"
 DVE_diplomatic_outreach_desc:0 "A dedicated diplomatic push improves how the world sees the country.\n\nFor 180 days: +10% improve relations opinion gain, +5% ideology drift defense."
 DVE_international_cooperation:0 "International Cooperation"
 DVE_international_cooperation_desc:0 "Closer cooperation with foreign partners opens doors in both trade and research.\n\nFor 180 days: +5% trade deal opinion factor, +5% research speed."
