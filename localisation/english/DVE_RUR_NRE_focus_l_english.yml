l_english:
 # ==== DvE - alberi di RUR e NRE ====
 RUR_root:0 "A Russia Without United Russia"
 RUR_root_desc:0 "The party that governed for a quarter of a century is banned, its files are open, and nobody in the building has ever worked under anything else. The Republic begins by discovering how much of the state was the Party."
 RUR_rebuild_institutions:0 "Courts That Rule Against the State"
 RUR_rebuild_institutions_desc:0 "A judiciary that has never once found against the government is being asked to learn how, quickly and in public."
 RUR_restart_economy:0 "Unfreeze What Was Seized"
 RUR_restart_economy_desc:0 "Twenty-five years of assets held by men who are now abroad, in prison, or dead. Somebody has to decide who owns the country."
 RUR_new_army:0 "An Army That Swears to the Constitution"
 RUR_new_army_desc:0 "Not to a man, not to a party. The wording took four months to agree and nobody is entirely comfortable with it."
 RUR_first_free_election:0 "The First Free Election in Thirty Years"
 RUR_first_free_election_desc:0 "Turnout is enormous and the result is a mess: three blocs, none with a majority, and a Duma that has to learn to negotiate before it can learn anything else."
 RUR_civic_platform:0 "Civic Platform"
 RUR_civic_platform_desc:0 "The liberals. They have the cities, the universities and the newspapers, and they are aware that this has never once been enough."
 RUR_constitution:0 "A Constitution Worth the Paper"
 RUR_constitution_desc:0 "Not a new text - the old one, enforced for the first time."
 RUR_regions_speak:0 "The Regions Speak for Themselves"
 RUR_regions_speak_desc:0 "Eighty-three federal subjects that have spent a generation being told what they think."
 RUR_back_into_europe:0 "Back Into Europe"
 RUR_back_into_europe_desc:0 "The visas, the flights, the students. Everything except the apology, which nobody has agreed on."
 RUR_republic_of_laws:0 "A Republic of Laws"
 RUR_republic_of_laws_desc:0 "The question the Republic was convened to settle, settled."
 RUR_second_republic:0 "The Second Russian Republic"
 RUR_second_republic_desc:0 "It is not a great power any more and it says so out loud, which in this country is the most radical thing anyone has said in a century."
 RUR_nlm:0 "The National Liberation Movement"
 RUR_nlm_desc:0 "Sovereigntists. They welcomed the fall of United Russia and want it understood that this does not make them anybody's friend."
 RUR_neither_brussels:0 "Neither Brussels Nor Beijing"
 RUR_neither_brussels_desc:0 "The Republic will take loans from both and instructions from neither. This is stated more often than it is achieved."
 RUR_army_not_party:0 "The Army Is Not a Party"
 RUR_army_not_party_desc:0 "Generals who backed the wrong faction are retired with full honours and no command."
 RUR_rebuild_federation:0 "Rebuild the Federation"
 RUR_rebuild_federation_desc:0 "The republics that drifted during the collapse are invited back, and the invitation is warm."
 RUR_answer_to_no_one:0 "A Russia That Answers to No One"
 RUR_answer_to_no_one_desc:0 "The question the Republic was convened to settle, settled."
 RUR_sovereign_republic:0 "The Sovereign Republic"
 RUR_sovereign_republic_desc:0 "Elections, courts and a free press, and a foreign policy that would be recognisable to any Tsar."
 RUR_kprf:0 "The KPRF"
 RUR_kprf_desc:0 "The largest legal party in the country, and the only one with a structure that survived the collapse intact, because it had spent thirty years being tolerated rather than trusted."
 RUR_largest_legal_party:0 "The Largest Legal Party"
 RUR_largest_legal_party_desc:0 "Membership cards that never stopped being printed, in a country where every other list was destroyed."
 RUR_renationalise:0 "Renationalise What Was Sold"
 RUR_renationalise_desc:0 "The 1990s are reopened as a legal question, and the answers are expensive."
 RUR_union_by_ballot:0 "The Union, By the Ballot Box"
 RUR_union_by_ballot_desc:0 "What was taken by force in 1991 is asked for politely, republic by republic, with observers present."
 RUR_red_majority:0 "The Red Majority"
 RUR_red_majority_desc:0 "The question the Republic was convened to settle, settled."
 RUR_union_without_a_shot:0 "The Union Restored Without a Shot"
 RUR_union_without_a_shot_desc:0 "No civil war, no tanks, no October. A parliamentary majority and a series of referenda, which is either the vindication of the whole movement or its final surrender."
 RUR_russia_after_putin:0 "Russia After Putin"
 RUR_russia_after_putin_desc:0 "The man has been dead long enough that people have stopped dating things from it. Whatever this country becomes now, it becomes on its own account."
 NRE_root:0 "The Empire Proclaimed"
 NRE_root_desc:0 "The Federation was a republic that behaved like an empire and apologised for neither. Its successor has dropped the first half."
 NRE_the_church:0 "Bring Back the Church"
 NRE_the_church_desc:0 "Not as a moral authority. As a ministry, with a budget line and a seat at the table."
 NRE_the_purge:0 "Close the Rest of Them Down"
 NRE_the_purge_desc:0 "Communists, liberals, the remains of United Russia. The lists were drawn up years ago by people who assumed they would never be used."
 NRE_imperial_army:0 "The Imperial Army"
 NRE_imperial_army_desc:0 "New oaths, new colours, and the officers who hesitated in the civil war quietly not reappointed."
 NRE_who_wears_the_crown:0 "Who Wears the Crown"
 NRE_who_wears_the_crown_desc:0 "Three currents claim the Empire and only one of them wants a monarch. The argument is settled indoors and the result is announced as though it had never been in doubt."
 NRE_ldpr:0 "The LDPR"
 NRE_ldpr_desc:0 "Thirty years of saying the unsayable on television, and an audience that stopped treating it as theatre somewhere around the second civil war."
 NRE_last_thrust_south:0 "The Last Thrust South"
 NRE_last_thrust_south_desc:0 "An old man's promise about washing boots in a warm ocean, now costed by a planning staff."
 NRE_every_russian:0 "Every Russian Under One Roof"
 NRE_every_russian_desc:0 "Wherever the language is spoken, the Empire discovers an obligation."
 NRE_army_of_empire:0 "The Army of the Empire"
 NRE_army_of_empire_desc:0 "Conscription without exemption, and a general staff that answers to one office."
 NRE_empire_marches:0 "The Empire Marches"
 NRE_empire_marches_desc:0 "The question was never really open. It is now formally closed."
 NRE_baltic_to_indian_ocean:0 "From the Baltic to the Indian Ocean"
 NRE_baltic_to_indian_ocean_desc:0 "The sentence that got him laughed at for three decades is now a map on a wall, with pins in it."
 NRE_nbp:0 "The National Bolshevik Party"
 NRE_nbp_desc:0 "Red flag, imperial eagle, and a founder who was jailed by every government he outlived. Nobody has ever been able to place them on a spectrum and they consider this the point."
 NRE_red_flag_eagle:0 "Red Flag, Imperial Eagle"
 NRE_red_flag_eagle_desc:0 "Two symbols that spent a century killing each other, printed on the same banner and handed out at rallies."
 NRE_streets_are_ours:0 "The Streets Belong to Us"
 NRE_streets_are_ours_desc:0 "Not an electoral strategy. A statement about who is physically present when it matters."
 NRE_limonov_testament:0 "Limonov's Testament"
 NRE_limonov_testament_desc:0 "The poet's programme, read out at the congress by people who were children when he wrote it."
 NRE_the_other_revolution:0 "The Other Revolution"
 NRE_the_other_revolution_desc:0 "The question was never really open. It is now formally closed."
 NRE_neither_left_nor_right:0 "Neither Left Nor Right, Russian"
 NRE_neither_left_nor_right_desc:0 "A state that nationalises the banks and crowns an emperor in the same month, and is genuinely puzzled that anyone finds this contradictory."
 NRE_orthodox:0 "The Russian Orthodox Church"
 NRE_orthodox_desc:0 "The one institution that outlasted the Tsars, the Bolsheviks and the Federation, and has never once been in a hurry."
 NRE_patriarch_and_state:0 "The Patriarch and the State"
 NRE_patriarch_and_state_desc:0 "An arrangement with no name in the constitution and no ambiguity in practice."
 NRE_moral_restoration:0 "Moral Restoration"
 NRE_moral_restoration_desc:0 "Schools, broadcasting, the calendar. The state stops pretending to be neutral about anything."
 NRE_symphony_of_powers:0 "Symphony of Powers"
 NRE_symphony_of_powers_desc:0 "The Byzantine doctrine, dusted off: two authorities, one body, no daylight between them."
 NRE_third_rome:0 "The Third Rome"
 NRE_third_rome_desc:0 "The question was never really open. It is now formally closed."
 NRE_holy_russia:0 "A Holy Russia"
 NRE_holy_russia_desc:0 "Two Romes have fallen, a third stands, and a fourth there shall not be. The line is five hundred years old and has never been meant metaphorically."
 NRE_empire_endures:0 "The Empire Endures"
 NRE_empire_endures_desc:0 "Whatever else was lost in the civil war, the thing that came out of it does not intend to be a republic again."

 # ---- RUR: il ramo socialdemocratico (Just Russia, progressive) ----
 RUR_just_russia:0 "Just Russia"
 RUR_just_russia_desc:0 "Social democrats, and the second party in the country by anything that can honestly be called support. They do not campaign about flags: they campaign about the pension, the wage and who pays the heating bill."
 RUR_pension_before_flag:0 "The Pension Before the Flag"
 RUR_pension_before_flag_desc:0 "The Republic's first budget does not fund a parade. This is pointed out, repeatedly, by people who miss the parades."
 RUR_a_living_wage:0 "A Wage You Can Live On"
 RUR_a_living_wage_desc:0 "The minimum wage already existed on paper. Now it exists in the pay packet, and somebody has to account for the thirty years in between."
 RUR_social_state:0 "The Social State, On Paper and Off"
 RUR_social_state_desc:0 "The 1993 constitution calls Russia a social state. It stayed a sentence for a generation."
 RUR_government_of_the_left:0 "A Government of the Left"
 RUR_government_of_the_left_desc:0 "The question the Republic was convened to settle, settled."
 RUR_social_republic:0 "The Social Republic"
 RUR_social_republic_desc:0 "Not the superpower and not the empire: a normal-sized country that has decided to look after its own citizens before its own stature. In Russia that is a more radical proposal than it sounds."

