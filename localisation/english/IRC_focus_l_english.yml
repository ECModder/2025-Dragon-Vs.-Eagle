l_english:
 IRC_focus:0 "The Italian Revolutionary Communist Republic"
 IRC_civil_war_focus:0 "Civilwar IRC Path"

 IRC_cw_hold_the_three_pockets:0 "Hold the Three Pockets"
 IRC_cw_hold_the_three_pockets_desc:0 "Bologna, the Apuan coast and the Esino valley: three islands of the PCR in a sea of other people's flags. If one falls the other two follow, and the Central Council has ordered every pocket to hold."
 IRC_cw_workers_militias:0 "The Workers' Militias"
 IRC_cw_workers_militias_desc:0 "Every factory council in the three pockets gets a rifle rack and a roster. The militias are not an army yet, but nobody in Panigale or Jesi intends to wait for one."
 IRC_cw_factory_councils:0 "Factory Councils at the Lathes"
 IRC_cw_factory_councils_desc:0 "The Borgo Panigale workshops and the marble works of Carrara switch to whatever the war needs. The councils decide the shifts and the quotas; the Central Council decides what gets built."
 IRC_cw_trotskys_red_army:0 "Trotsky's Red Army"
 IRC_cw_trotskys_red_army_desc:0 "The man who built the Red Army out of conscripts and militias in a civil war wrote the manual, and the PCR's officers read it again, this time to apply it."
 IRC_cw_requisition_the_stocks:0 "Requisition the Stocks"
 IRC_cw_requisition_the_stocks_desc:0 "Depots, barracks and warehouses abandoned in the collapse of Rome are emptied in the name of the revolution. Whatever the Republic left behind goes to the councils."
 IRC_cw_permanent_revolution:0 "The Permanent Revolution"
 IRC_cw_permanent_revolution_desc:0 "The revolution cannot stop at the edge of a pocket, a province or a country. Everything the three pockets have is thrown into the war, and the Central Council promises that it will not end at Rome."

 IRC_mil_military_decision_center:0 "Military Decision Center"
 IRC_mil_military_decision_center_desc:0 "The militias won the civil war. Turning them into an army that can hold a border is a different job."
 IRC_mil_red_army:0 "The Red Army"
 IRC_mil_red_army_desc:0 "The brigades, the Red Guards and the internationalist volunteers are merged into a single Red Army of the Revolution."
 IRC_mil_military_commissars:0 "Military Commissars"
 IRC_mil_military_commissars_desc:0 "Many of the new army's officers served the old state. Every one of them gets a commissar at their side."
 IRC_mil_reforming_military_corps:0 "Reforming the Military Corps"
 IRC_mil_reforming_military_corps_desc:0 "The corps structure of the old army is torn up and rebuilt around what actually worked in the civil war."
 IRC_mil_smart_military_manufacturing:0 "Smart Military Manufacturing"
 IRC_mil_smart_military_manufacturing_desc:0 "Lines that switch from rifles to drones in a week, designed by the engineers who will use them."
 IRC_mil_political_commissars:0 "Political Commissars"
 IRC_mil_political_commissars_desc:0 "The commissars stop checking up on the officers and start educating the soldiers. Every unit knows what it is fighting for."
 IRC_mil_trial_corrupt_traitors:0 "Trial of the Corrupt and Traitors"
 IRC_mil_trial_corrupt_traitors_desc:0 "Quartermasters who sold fuel to the enemy and colonels who kept their old friends informed face a people's tribunal."
 IRC_mil_peer_to_peer_production:0 "Peer-to-Peer Production"
 IRC_mil_peer_to_peer_production_desc:0 "Open designs shared between every arms plant in the country. A fix found in Brescia is running in Bologna by the next shift."
 IRC_mil_loyal_to_revolution:0 "Loyal to the Revolution"
 IRC_mil_loyal_to_revolution_desc:0 "Purged, reorganized and politically reliable, the Red Army is ready to be more than a garrison."
 IRC_mil_make_way_young:0 "Make Way for the Young"
 IRC_mil_make_way_young_desc:0 "The commanders who proved themselves in the civil war are promoted over the heads of the old staff officers."
 IRC_mil_workers_army:0 "The Workers' Army"
 IRC_mil_workers_army_desc:0 "Every factory trains its own reserve company. The army and the working class become the same thing."
 IRC_mil_cult_blitzkrieg:0 "The Cult of the Blitzkrieg"
 IRC_mil_cult_blitzkrieg_desc:0 "Speed, concentration and surprise. The next war will be decided in its first weeks."
 IRC_mil_red_airforce:0 "The Red Airforce"
 IRC_mil_red_airforce_desc:0 "Pilots from the old air force and drone operators from the militias, under one command."
 IRC_mil_red_navy:0 "The Red Navy"
 IRC_mil_red_navy_desc:0 "The crews at La Spezia and Taranto have to be won over one ship at a time. The ones already on our side form the core of a new fleet."
 IRC_mil_mechanized_army:0 "A Mechanized Army"
 IRC_mil_mechanized_army_desc:0 "Trucks, armoured carriers and the drivers to go with them. The infantry will not walk to the next war."
 IRC_mil_study_new_doctrines:0 "Study New Doctrines"
 IRC_mil_study_new_doctrines_desc:0 "The staff college reads everything from Tukhachevsky to the drone war in Ukraine."
 IRC_mil_red_academies:0 "The Red Academies"
 IRC_mil_red_academies_desc:0 "Officer schools open to the sons and daughters of workers, teaching tactics alongside political economy."
 IRC_mil_superiority_of_tanks:0 "Superiority of Tanks"
 IRC_mil_superiority_of_tanks_desc:0 "Drones have not made the tank obsolete, only the badly used tank."
 IRC_mil_electronic_warfare:0 "Electronic Warfare"
 IRC_mil_electronic_warfare_desc:0 "Jammers, spoofers and signals intelligence. Modern battles are won in the spectrum first."
 IRC_mil_quality_training:0 "Quality Training Programs"
 IRC_mil_quality_training_desc:0 "Fewer parades and more live-fire exercises. Every soldier trains as if the war started tomorrow."
 IRC_mil_overwhelming_superiority:0 "Overwhelming Superiority"
 IRC_mil_overwhelming_superiority_desc:0 "More tanks, more guns and more shells than the enemy can count, at the exact point where it matters."
 IRC_mil_workers_of_world_unite:0 "Workers of the World Unite"
 IRC_mil_workers_of_world_unite_desc:0 "The Red Army of the Revolution is no longer an Italian army. It is the army of the working class, wherever it is."
 IRC_mil_proletarian_military_industries:0 "Proletarian Military Industries"
 IRC_mil_proletarian_military_industries_desc:0 "Beretta, Leonardo, Fincantieri and Iveco now belong to the people who work in them, and the people have a war to prepare for."
 IRC_mil_national_academies_sciences:0 "National Academies of Sciences"
 IRC_mil_national_academies_sciences_desc:0 "The universities of Milan, Turin and Bologna are organized into academies that work directly for the plan."
 IRC_mil_total_industrial_mobilization:0 "Total Industrial Mobilization"
 IRC_mil_total_industrial_mobilization_desc:0 "Every plant that can make something useful for the army will make it, starting this month."
 IRC_mil_ultra_engineered_equipment:0 "Ultra-Engineered Equipment"
 IRC_mil_ultra_engineered_equipment_desc:0 "Italian design was always good at making beautiful machines. The revolution wants them to be unbreakable as well."
 IRC_mil_reindustrialization:0 "Reindustrialization"
 IRC_mil_reindustrialization_desc:0 "The industrial districts that globalization emptied are filled again, this time with plants that cannot be moved abroad."
 IRC_mil_optimize_production_lines:0 "Optimize Production Lines"
 IRC_mil_optimize_production_lines_desc:0 "Time-and-motion studies, done by the workers themselves this time."
 IRC_mil_tsunami_military_hardware:0 "A Tsunami of Military Hardware"
 IRC_mil_tsunami_military_hardware_desc:0 "The first mobilization quotas are met ahead of schedule. The depots are filling faster than the army can empty them."
 IRC_mil_centralize_military_structures:0 "Centralize Military Structures"
 IRC_mil_centralize_military_structures_desc:0 "Army, navy, air force and war industry answer to one defence council in Milan."
 IRC_mil_expand_red_navy:0 "Expand the Red Navy"
 IRC_mil_expand_red_navy_desc:0 "The yards of Monfalcone and Livorno are turned over to warships."
 IRC_mil_expand_aircraft_industry:0 "Expand the Aircraft Industry"
 IRC_mil_expand_aircraft_industry_desc:0 "The aerospace plants around Turin and Varese are given priority on materials and engineers."
 IRC_mil_expand_army:0 "Expand the Army"
 IRC_mil_expand_army_desc:0 "New divisions need new recruits, new barracks and new depots."
 IRC_mil_submarine_warfare:0 "Submarine Warfare"
 IRC_mil_submarine_warfare_desc:0 "The Mediterranean is narrow and crowded. A fleet of submarines can close it to anyone we choose."
 IRC_mil_increase_aircraft_production:0 "Increase Aircraft Production"
 IRC_mil_increase_aircraft_production_desc:0 "Second and third shifts on every assembly line."
 IRC_mil_start_motorizing:0 "Start Motorizing"
 IRC_mil_start_motorizing_desc:0 "Iveco's lines stop building delivery vans and start building troop carriers."
 IRC_mil_offensive_maritime_strategy:0 "Offensive Maritime Strategy"
 IRC_mil_offensive_maritime_strategy_desc:0 "The fleet will not wait in port to be sunk. It goes looking for the enemy."
 IRC_mil_automatic_aircraft_systems:0 "Automatic Aircraft Systems"
 IRC_mil_automatic_aircraft_systems_desc:0 "Drones that fly in swarms and aircraft that fly themselves. Pilots are too valuable to lose."
 IRC_mil_adaptable_red_army:0 "An Adaptable Red Army"
 IRC_mil_adaptable_red_army_desc:0 "No doctrine survives contact with the enemy. The army trains to change its plans faster than the enemy can change theirs."
 IRC_mil_oceangoing_navy:0 "An Oceangoing Navy"
 IRC_mil_oceangoing_navy_desc:0 "The revolution has friends in Havana and Asmara. The navy must be able to reach them."
 IRC_mil_reds_in_the_sky:0 "The Reds in the Sky"
 IRC_mil_reds_in_the_sky_desc:0 "The red star over the Alps is painted on the wings of the Revolution's air force."
 IRC_mil_glory_red_army:0 "The Glory of the Red Army"
 IRC_mil_glory_red_army_desc:0 "Songs, films and monuments. The army that won the civil war becomes the pride of the new republic."
 IRC_mil_red_tsunami:0 "A Red Tsunami"
 IRC_mil_red_tsunami_desc:0 "The war industry is running at full capacity. When the Red Army moves, it will not run short of anything."
 IRC_mil_revolution_above_all:0 "The Revolution Above All!"
 IRC_mil_revolution_above_all_desc:0 "Not the nation, not the party, not the leader: the revolution."
