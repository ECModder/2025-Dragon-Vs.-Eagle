IRQ_fractured_muhasasa_system:0 "The Fractured Muhasasa System"
IRQ_fractured_muhasasa_system_desc:0 "The complex ethno-religious power-sharing system between Shias, Sunnis, Kurds and Yazidis has left the central government deeply paralyzed. Bureaucratic infighting and frequent political boycotts prevent the passing of any major economic or structural legislation."

 IRQ_hydrocarbon_dependency:0 "The Hydrocarbon Dependency"
 IRQ_hydrocarbon_dependency_desc:0 "Iraq's economy is dangerously reliant on crude oil exports for over 90% of state revenues. Rampant corruption, decaying pipeline infrastructure, and volatile global oil markets leave the national budget highly unstable and unable to fund domestic industrial decentralization."

 IRQ_autonomy_of_the_pmf:0 "Autonomy of the PMF"
 IRQ_autonomy_of_the_pmf_desc:0 "The Popular Mobilization Forces (Hashd al-Shaabi) operate as a massive, parallel military group alongside the regular Iraqi Army. Loyal to local commanders and regional backers rather than the central state, their dominant influence severely fractures national military cohesion."