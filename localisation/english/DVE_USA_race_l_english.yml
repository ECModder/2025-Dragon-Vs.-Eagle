 DVE_USA_race_category:0 "The Race for the White House"
 DVE_USA_race_category_desc:0 "Midterms on 3 November 2026, then the presidential election on 7 November 2028."
 DVE_USA_balance_category:0 "Factions Vying for the Presidency"
 DVE_USA_balance_category_desc:0 "Democratic camp against Republican camp in the Electoral College. Choose the bloc and candidate you want to carry to the White House."
 USA_pick_soc:0 "Run the Socialist ticket"
 USA_pick_soc_desc:0 "The PCUSA, the Party for Socialism and Liberation and the ACP rally behind Gloria La Riva. Winning even one state is close to impossible, but a victory would change the country.\n\nOnly the player can choose this bloc.\n\nThe first choice is free; changing bloc later costs 100 political power and resets the campaign gains."
 USA_pick_ld:0 "Run the Left Democrats"
 USA_pick_ld_desc:0 "The Democratic Socialists of America push Alexandria Ocasio-Cortez against the party establishment: tax the rich, health care, renewables.\n\nOnly the player can choose this bloc.\n\nThe first choice is free; changing bloc later costs 100 political power and resets the campaign gains."
 USA_pick_cd:0 "Back the Centrist Democrats"
 USA_pick_cd_desc:0 "The Democratic establishment and its Third Way wing, led by Gavin Newsom: the New Economic Bargain, rules for Big Tech and AI, abortion rights.\n\nThe first choice is free; changing bloc later costs 100 political power and resets the campaign gains."
 USA_pick_gn:0 "Back the GOP Neoconservatives"
 USA_pick_gn_desc:0 "After the midterms the post-Trump Republican line emerges around Marco Rubio: tax cuts, strong alliances, a hard stance on borders. Available only after the midterms.\n\nThe first choice is free; changing bloc later costs 100 political power and resets the campaign gains."
 USA_pick_gt:0 "Back the Trumpist GOP"
 USA_pick_gt_desc:0 "Until the midterms every Republican follows Donald Trump: tariffs, the Trump Dividend, mass deportations. Back the whole party behind him.\n\nOnly the player can choose this bloc.\n\nThe first choice is free; changing bloc later costs 100 political power and resets the campaign gains."
 USA_pick_gt3:0 "Run the Trumpists for a third mandate"
 USA_pick_gt3_desc:0 "Donald Trump is barred by the 22nd Amendment, but his movement wants him back on the ballot for a third mandate. The Republican vote splits between Trumpists and neoconservatives. Available only after the midterms.\n\nOnly the player can choose this bloc.\n\nThe first choice is free; changing bloc later costs 100 political power and resets the campaign gains."
