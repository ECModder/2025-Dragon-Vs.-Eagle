 USA_fund_grass_1:0 "Small-donor drive"
 USA_fund_grass_1_desc:0 "Your volunteers run a small-donor drive across the country: ten dollars at a time, from the bottom up.\n\nEvery fundraising decision gives the same political power, whatever its source. Socialists and Left Democrats raise money from below; Centrist Democrats and both Republican factions ask the companies."
 USA_fund_grass_2:0 "Door-to-door fundraising"
 USA_fund_grass_2_desc:0 "Rallies, house parties and door-to-door collections bring in money from ordinary people.\n\nEvery fundraising decision gives the same political power, whatever its source. Socialists and Left Democrats raise money from below; Centrist Democrats and both Republican factions ask the companies."
 USA_fund_corp_1:0 "Courting corporate donors"
 USA_fund_corp_1_desc:0 "The campaign asks the big companies for money: breakfast meetings, bundlers and super PAC pledges.\n\nEvery fundraising decision gives the same political power, whatever its source. Socialists and Left Democrats raise money from below; Centrist Democrats and both Republican factions ask the companies."
 USA_fund_corp_2:0 "Fundraising dinner with the lobbies"
 USA_fund_corp_2_desc:0 "A 5,000 dollar a plate dinner with the industry lobbies fills the war chest.\n\nEvery fundraising decision gives the same political power, whatever its source. Socialists and Left Democrats raise money from below; Centrist Democrats and both Republican factions ask the companies."
 USA_congress_gop_hold:0 "Republican Congress"
 USA_congress_gop_hold_desc:0 "The Republicans held both chambers in the midterms of 2026. The administration has the votes it needs."
 USA_congress_divided:0 "Divided Congress"
 USA_congress_divided_desc:0 "One chamber changed hands in the midterms of 2026. Washington is in gridlock."
 USA_congress_dem_wave:0 "Democratic Congress"
 USA_congress_dem_wave_desc:0 "The Democrats took both chambers in the midterms of 2026 and opened inquiries into the administration."
 USA_mandate_landslide:0 "Landslide Mandate"
 USA_mandate_landslide_desc:0 "The president won the Electoral College by a very wide margin."
 USA_mandate_narrow:0 "Clear Mandate"
 USA_mandate_narrow_desc:0 "The president won the Electoral College."
 USA_mandate_contested:0 "Contested Mandate"
 USA_mandate_contested_desc:0 "The Electoral College ended in a 269 to 269 tie and the House settled it along party lines. Half the country questions the result."
 USA_third_mandate_crisis:0 "Third Mandate Crisis"
 USA_third_mandate_crisis_desc:0 "A third presidential term breaks the 22nd Amendment. Courts, governors and the streets are in open conflict with the White House."
 dve_usa.1.t:0 "Trump Takes the Oath"
 dve_usa.1.d:0 "At noon on 20 January 2025 Donald Trump was sworn in as the 47th President of the United States. The cold sent the ceremony inside the Capitol Rotunda, where the new president spoke with his arms wide open to a crowded room.\n\nThe second Trump administration opens with promises of lasting tax cuts, tariffs on imports, mass deportations and a completed border wall, in a country still deeply divided over all of it. In Washington both parties are already counting votes for the midterms of 3 November 2026 and for the presidential race of 2028.\n\n§YThe race for the White House begins: the United States can now open the electoral map from the Decisions tab.§!"
 dve_usa.1.a:0 "A new term begins"
 dve_usa.2.t:0 "The Midterms: America Has Voted"
 dve_usa.2.d:0 "On 3 November 2026 Americans voted in the first national election since the return of Donald Trump. The cost of living, energy bills and the war against Iran, opposed by about two voters in three, dominated the campaign. The Republicans promised a 5,000 dollar Trump Dividend for every adult, paid for with tariffs, and permanent relief on tips, overtime and pensions. The Democrats ran on prices, health costs and drugs, renewable energy, rules for AI and data centers, and inquiries into the administration.\n\n[GetUSAMidtermResult]\n\nElectoral map of the night: Democratic camp §C[?global.USA_res_dem_ev|0]§! votes, Republican camp §R[?global.USA_res_gop_ev|0]§!.\nHouse: Democrats §C[?global.USA_res_house_d|0]§!, Republicans §R[?global.USA_res_house_r|0]§!. Senate: Democrats §C[?global.USA_res_senate_d|0]§!, Republicans §R[?global.USA_res_senate_r|0]§!.\n\n§YUntil now every Republican was a Trumpist. With the midterms behind it the party starts to split between the Trumpists, who want a third mandate, and the post-Trump line of the neoconservatives.§!"
 dve_usa.2.a:0 "On to 2028"
 USA_MID_WAVE:0 "§CA Democratic wave.§! Both chambers of Congress change hands. Working-class white voters without a degree swung hard towards the Democrats, Hispanic and Black voters came back to them, and women voted for them by a wide margin. The Republicans lost ground even in their strongholds."
 USA_MID_HOLD:0 "§RThe Republicans hold.§! Both chambers stay in Republican hands. The Trump Dividend and the hard line on borders were enough to blunt the wave that analysts had expected."
 USA_MID_DIV:0 "§YA split verdict.§! One chamber changes hands and the other does not, and Washington is headed for two years of gridlock."
 dve_usa.3.t:0 "The Nation Has Chosen"
 dve_usa.3.d:0 "On 7 November 2028 the United States elected a president. The 22nd Amendment bars Donald Trump from a third mandate, and the Republican field had pitted the MAGA wing against the traditional line while the Democrats argued over the economic bargain, Big Tech and the cost of health care. Pennsylvania, Georgia, North Carolina, Michigan, Arizona, Wisconsin and Nevada decided the night.\n\n[GetUSAElectionResult]\n\n[GetUSAElectionContext]\n\nElectoral votes: Democratic camp §C[?global.USA_res_dem_ev|0]§!, Republican camp §R[?global.USA_res_gop_ev|0]§!. The winner takes §Y[?global.USA_res_win_ev|0]§! votes (270 needed)."
 dve_usa.3.a:0 "The people have spoken"
 USA_ELE_1:0 "In the greatest upset in American history the Socialist ticket of Gloria La Riva, backed by the PCUSA, the Party for Socialism and Liberation and the ACP, carries the Electoral College."
 USA_ELE_2:0 "The Democratic Socialists of America and their standard-bearer, Alexandria Ocasio-Cortez, carry the Electoral College after beating the party establishment from the left."
 USA_ELE_3:0 "Governor Gavin Newsom carries the Electoral College for the Democratic establishment on the promise of a New Economic Bargain."
 USA_ELE_4:0 "Senator Marco Rubio carries the Electoral College for the traditional Republican line: tax cuts, strong alliances and a hard stance on borders."
 USA_ELE_5:0 "Donald Trump, running for a third mandate in defiance of the 22nd Amendment, carries the Electoral College. Constitutional lawyers speak of a crisis."
 USA_ELE_0:0 "The count is over."
 USA_CTX_HUNG:0 "§RAn exact 269 to 269 tie.§! The House settled the result along party lines after a bitter fight, and half the country questions it."
 USA_CTX_LAND:0 "§GIt was a landslide.§! No state of the swing belt was left undecided."
 USA_CTX_NORMAL:0 "The margin in the swing states was thin but clear."
 dve_usa.4.t:0 "Inauguration Day"
 dve_usa.4.d:0 "At noon on 20 January 2029 the new president took the oath of office on the steps of the Capitol.\n\n[GetUSAInaugurationText]"
 dve_usa.4.a:0 "Hail to the chief"
 USA_INA_1:0 "Gloria La Riva swears the oath as the first socialist president, promising public ownership of key industries, a federal jobs guarantee and an end to the wars. Wall Street is in shock and the Republican governors are already talking about secession."
 USA_INA_2:0 "Alexandria Ocasio-Cortez is sworn in as the youngest president in the history of the republic. Her inaugural speech promises a tax on the richest, health care for all and a Green New Deal."
 USA_INA_3:0 "Gavin Newsom takes the oath and promises a New Economic Bargain: a strong middle class, rules for Big Tech and AI, and the defence of abortion rights."
 USA_INA_4:0 "Marco Rubio takes the oath after beating the MAGA wing at the convention. He promises lower taxes, a firm hand on the border and a return to strong alliances."
 USA_INA_5:0 "Donald Trump takes the oath for a third time. Crowds cheer on the Mall, while courts, governors and the streets challenge a mandate that the Constitution does not allow."
 USA_INA_0:0 "The new president takes the oath."
