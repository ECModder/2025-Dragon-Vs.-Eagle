 USA_BANNER_BTN:0 "Open the electoral map"
 USA_BANNER_BTN_TT:0 "Opens the map of the fifty states and the five blocs.\n\nA state goes to the camp (Democratic or Republican) that leads there and takes the colour of the strongest bloc inside that camp. Socialists and Left Democrats can only be chosen by the player, and so can the Trumpist third-mandate ticket that appears after the midterms. Until the midterms every Republican is a Trumpist."
 USA_BANNER_TIP:0 "[GetUSABannerTip]"
 USA_THEME_1_BTN:0 "Campaign: Economy & Taxes"
 USA_THEME_1_TT:0 "§HEconomy & Taxes§!\nRepublican promises: extend the 2017 tax cuts, universal tariffs of 10 to 20% (up to 60% on Chinese goods), lower inflation through deregulation, the Trump Dividend.\nDemocratic promises: help for the middle class with tax credits of up to 25,000 dollars for a first home and 6,000 for newborns, a federal ban on grocery price speculation, higher taxes on top incomes.\n\nCosts 25 political power. It moves more voters where it is a top issue of the state and where your bloc is credible; the further the state is from your bloc on the left-right axis, the less it moves. Gains fade 10% a month."
 USA_THEME_2_BTN:0 "Campaign: Energy & Climate"
 USA_THEME_2_TT:0 "§HEnergy & Climate§!\nRepublican promises: more oil and gas drilling, the Arctic included, to bring energy costs down.\nDemocratic promises: continue the Biden investments in renewables and the green transition, new rules on AI and data centers.\n\nCosts 25 political power. It moves more voters where it is a top issue of the state and where your bloc is credible; the further the state is from your bloc on the left-right axis, the less it moves. Gains fade 10% a month."
 USA_THEME_3_BTN:0 "Campaign: Immigration & Borders"
 USA_THEME_3_TT:0 "§HImmigration & Borders§!\nRepublican promises: mass deportation of undocumented immigrants and a completed wall on the Mexican border.\nDemocratic promises: a bipartisan law to strengthen border security.\n\nCosts 25 political power. It moves more voters where it is a top issue of the state and where your bloc is credible; the further the state is from your bloc on the left-right axis, the less it moves. Gains fade 10% a month."
 USA_THEME_4_BTN:0 "Campaign: Rights & Healthcare"
 USA_THEME_4_TT:0 "§HRights & Healthcare§!\nRepublican promises: abortion regulation left to the states after Roe v. Wade, defence of the Second Amendment.\nDemocratic promises: a federal law restoring abortion rights nationwide, an assault weapons ban, wider health coverage and cheaper drugs.\n\nCosts 25 political power. It moves more voters where it is a top issue of the state and where your bloc is credible; the further the state is from your bloc on the left-right axis, the less it moves. Gains fade 10% a month."
 USA_THEME_5_BTN:0 "Campaign: Foreign Policy"
 USA_THEME_5_TT:0 "§HForeign Policy§!\nRepublican promises: a protectionist approach and a review of international alliances.\nDemocratic promises: a stronger NATO and ties with the European Union, continued support for Ukraine and Israel.\n\nCosts 25 political power. It moves more voters where it is a top issue of the state and where your bloc is credible; the further the state is from your bloc on the left-right axis, the less it moves. Gains fade 10% a month."
