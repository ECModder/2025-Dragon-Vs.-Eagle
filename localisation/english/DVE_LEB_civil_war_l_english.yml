l_english:
 dve_lebcw.1.t:0 "THE SECOND LEBANESE CIVIL WAR"
 dve_lebcw.1.d:0 "After a failure in the Lebanese Army's operation to disarm Hezbollah, Lebanon is once again engulfed in the uncertain fog of internal crisis and fighting. The Second Lebanese Civil War is on."
 dve_lebcw.1.a:0 "Trust the Current Government"
 dve_lebcw.1.b:0 "Go with the Islamic Resistance"
 dve_lebcw.2.t:0 "Lebanon Falls into Civil War"
 dve_lebcw.2.d:0 "Lebanon has slid into its second civil war. The army and Hezbollah are fighting for the country, while the Sunni militias of Tripoli and Akkar, the Druze of the Chouf and the armed committees of Beirut hold their own ground and answer to neither side. Every faction is at war with all the others, and the capital is cut off behind its own barricades."
 dve_lebcw.2.a:0 "Another war in the Levant"
 dve_lebcw.3.t:0 "General Aoun Takes Command"
 dve_lebcw.3.d:0 "A month after civilian authority collapsed, Georges Adwan, the Lebanese Forces vice president who led the emergency administration, has handed over to former president and General Joseph Aoun. Martial law stays in force, but parliament and the courts keep sitting, and elections are promised once the fighting is over."
 dve_lebcw.3.a:0 "Order first, then politics"
 DVE_FACTION_LEB_UNITY:0 "The Emergency Coalition"
 DVE_debug_lebanon_category:0 "DVE DEBUG - Lebanese Civil War"
 DVE_debug_lebanon_category_desc:0 "Debug tools for the Second Lebanese Civil War. Visible only in debug mode."
 DVE_debug_lebanon_civil_war:0 "[DEBUG] Start the Second Lebanese Civil War"
 DVE_debug_lebanon_civil_war_desc:0 "Fires the war-start news event: Lebanon splits between LEB, HSC, HZB, BEZ and DUZ, each with leaders and an army, every faction goes to war with every other, and General Aoun replaces Adwan after 30 days. A human player can then pick a side."
 DVE_debug_lebanon_emergency_coalition:0 "[DEBUG] The Emergency Coalition"
 DVE_debug_lebanon_emergency_coalition_desc:0 "White peace between the Government, the Hariri Salvation Council and the Druze Mountain Authority, then the three in one faction led by Lebanon. The wars against Hezbollah and the Beirut Exclusion Zone go on. Needs the war to have started."
 DVE_debug_lebanon_reset:0 "[DEBUG] Undo the Lebanese Civil War"
 DVE_debug_lebanon_reset_desc:0 "Lebanon takes back every state and core, loses the coalition faction, the wartime divisions and the wartime government, and Hezbollah gives back its national spirits, so the test can be run again. Equipment already handed out stays in the stockpiles."
