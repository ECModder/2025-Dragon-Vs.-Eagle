 DVE_RF_VOTE_TT:0 "Put the selected law to a vote of the parties.\nThe filing fee of §Y25§! political power is lost if the motion fails. A failed motion blocks new votes on this law for §Y14§! days. Only one vote every §Y7§! days."
 DVE_RF_DECREE_TT:0 "Impose the selected law by decree, without a vote.\nCosts political power (more for bigger changes) and, in a country that holds elections, stability. Only one decree every §Y60§! days."
