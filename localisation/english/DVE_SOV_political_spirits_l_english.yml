l_english:
 # ==== DvE - spiriti del Congresso politico (SOV) ====

 idea_SOV_state_of_the_councils:0 "The State of the Councils"
 idea_SOV_state_of_the_councils_desc:0 "Power is exercised where it was seized: in the councils. Decisions carry the weight of the people who made them, and take exactly as long as persuading those people takes."

 idea_SOV_parliamentary_communism:0 "Parliamentary Communism"
 idea_SOV_parliamentary_communism_desc:0 "A chamber that debates, votes and answers for itself. It gives the Republic a legitimacy no decree can buy, and a chain of command that stops at the podium."

 idea_SOV_bureaucracy_at_the_helm:0 "Bureaucracy at the Helm"
 idea_SOV_bureaucracy_at_the_helm_desc:0 "The apparatus does not debate: it files, allocates and builds. Nobody voted for the men signing the requisition orders, and everybody knows it."

 idea_SOV_workers_council_planning:0 "Workers' Council Based Planning"
 idea_SOV_workers_council_planning_desc:0 "The people at the machines write the plan for the machines. Lines find their rhythm quickly and nobody has to be told twice - but nobody is pushed past what the shop floor considers reasonable, either."

 idea_SOV_workers_unions_planning:0 "Workers' Unions Based Planning"
 idea_SOV_workers_unions_planning_desc:0 "The unions deliver the workforce and expect to be paid in more than slogans. Output rises, and so does the bill the Republic settles every month in goods."

 idea_SOV_cadre_bureaucratic_planning:0 "Cadre Bureaucratic Based Planning"
 idea_SOV_cadre_bureaucratic_planning_desc:0 "Trained cadres draw the plan and revise it whenever the figures displease Moscow. Concrete is poured at remarkable speed; the factories underneath it change purpose twice before they finish."

 idea_SOV_democratic_centralism:0 "Democratic Centralism"
 idea_SOV_democratic_centralism_desc:0 "Argue until the vote, then close ranks. It is the oldest discipline the movement has, and the one that has kept it alive through everything that was supposed to end it."

 idea_SOV_strong_supreme_soviet:0 "A Strong Supreme Soviet"
 idea_SOV_strong_supreme_soviet_desc:0 "A body large enough to speak for the Union and small enough to be convened overnight. When it votes for war, the country understands that the question has been asked properly."

 idea_SOV_recreation_of_politburo:0 "Recreation of the Politburo"
 idea_SOV_recreation_of_politburo_desc:0 "Eleven men in one room, and the minutes are not circulated. Decisions arrive fully formed and terrifyingly fast; the country reads about them in Pravda like everyone else."

 idea_SOV_cheka_model:0 "Cheka Model"
 idea_SOV_cheka_model_desc:0 "Improvised, armed and answerable to the revolution rather than to a code of procedure. It is extraordinarily effective in occupied territory and no comfort at all to the people who created it."

 idea_SOV_nkvd_model:0 "NKVD Model"
 idea_SOV_nkvd_model_desc:0 "The most complete internal quiet the Union has ever known, purchased at a price the officer corps is still paying. Nobody conspires. Nobody competent is left to."

 idea_SOV_kgb_model:0 "KGB Model"
 idea_SOV_kgb_model_desc:0 "Files instead of firing squads. A professional service that recruits engineers as readily as thugs, and brings home rather more than confessions."

 idea_SOV_restart_agitprop:0 "Restart Agit-Prop"
 idea_SOV_restart_agitprop_desc:0 "Trucks, loudspeakers and young people who believe it. Agitation does what no decree can: it makes volunteering feel like the obvious thing to do on a Tuesday."

 idea_SOV_ideologicheskiy_otdel:0 "Ideologicheskiy Otdel"
 idea_SOV_ideologicheskiy_otdel_desc:0 "The department that decides what is orthodox this year. Doctrine holds like iron - and occasionally a branch of science is found to be bourgeois and quietly stops receiving funding."

 idea_SOV_otdel_propagandy:0 "Otdel Propagandy"
 idea_SOV_otdel_propagandy_desc:0 "Not agitators and not inquisitors: professionals, with print runs and viewing figures. They do not tell the Union what to think so much as arrange for it not to think about anything else."

 idea_SOV_all_power_to_soviets:0 "All Power to The Soviets"
 idea_SOV_all_power_to_soviets_desc:0 "The slogan of 1917, honoured this time. Power sits where the banners always said it did, and the Union governs itself through the bodies that made it."

 idea_SOV_all_power_to_revolution:0 "All Power to The Revolution"
 idea_SOV_all_power_to_revolution_desc:0 "The Republic is not a country that had a revolution: it is a revolution that happens to hold territory. Everything else - borders, ministries, quiet evenings - is provisional."

 idea_SOV_all_power_to_party:0 "All Power to The Party"
 idea_SOV_all_power_to_party_desc:0 "The Party is not an instrument of the state; the state is an instrument of the Party. The distinction was academic for years. It is now constitutional."
