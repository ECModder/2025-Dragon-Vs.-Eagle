 # ==== DvE - the Azad Kashmir crisis: decisions ====
 PAK_kashmir_crisis_category:0 "The Kashmir Crisis"
 PAK_kashmir_crisis_category_desc:0 "The JAAC controls the streets of Muzaffarabad. Islamabad has one month to bring the valley back under control before the initiative slips further still."
 PAK_negotiate_with_jaac:0 "Negotiate with the JAAC leadership"
 PAK_negotiate_with_jaac_desc:0 "Not every man carrying a JAAC banner wants a revolution. Some of them can still be talked to - and bought."
 PAK_deploy_frontier_corps:0 "Deploy the Frontier Corps"
 PAK_deploy_frontier_corps_desc:0 "Boots on the ground, checkpoints on every road into the valley. It will not win any hearts, but it slows the JAAC down."
 PAK_media_blackout:0 "Impose a media blackout in the valley"
 PAK_media_blackout_desc:0 "No footage, no livestreams, no international headlines. What Islamabad cannot stop, it can at least keep off the evening news."

 # ==== DvE - the Azad Kashmir crisis: events ====
 dve_kashmir.1.t:0 "The Streets of Muzaffarabad"
 dve_kashmir.1.d:0 "The Joint Awami Action Committee has done what three governments in a row could not: it has emptied every town in Azad Kashmir onto the street at once, and it is the JAAC's flag flying over the assembly building this morning, not Pakistan's.\n\nIslamabad has a month to answer this, or someone else will."
 dve_kashmir.1.a:0 "A month, then."

 dve_kashmir.2.t:0 "Muzaffarabad, Contained"
 dve_kashmir.2.d:0 "The negotiators, the checkpoints, the silence on the evening news - between them, it worked. The JAAC's committees are still there, and still angry, but the flag over the assembly building is Pakistan's again."
 dve_kashmir.2.a:0 "For now."

 dve_kashmir.3.t:0 "The Inqalabi Communist Party"
 dve_kashmir.3.d:0 "A month bought nothing. The JAAC's committees have given way to the RCP's, the assembly has declared itself the government of a free Kashmir, and the young men who spent April in the streets are spending May in a barracks, learning to hold a rifle.\n\nAzad Kashmir is no longer Pakistan's to command."
 dve_kashmir.3.a:0 "Not for lack of trying."

 dve_kashmir.4.t:0 "No Other Border Like It"
 dve_kashmir.4.d:0 "A communist republic on the Kashmir frontier is not a neighbour Islamabad is willing to have. The order goes out from General Headquarters this morning: the Frontier Corps crosses the line it has held for seventy years, and this time it is not coming back to it."
 dve_kashmir.4.a:0 "For Pakistan."
