l_english:

 # ==== DvE - albero dei focus ucraino ====
 UKR_three_years_of_war:0 "Three Years of War"
 UKR_three_years_of_war_desc:0 "The country has been at war longer than some of the men fighting it have been adults. Everything that follows - the front, the parliament, the factories - is decided by how long this can be endured."
 UKR_the_front_holds:0 "The Front Holds"
 UKR_the_front_holds_desc:0 "Three winters and it has not broken. That is not victory, but it is the precondition for everything that could become victory."
 UKR_hold_the_line:0 "Hold the Line"
 UKR_hold_the_line_desc:0 "No grand offensives. Trade shells for ground, make every kilometre cost more than it is worth, and let the other side run out of patience first."
 UKR_general_counteroffensive:0 "General Counteroffensive"
 UKR_general_counteroffensive_desc:0 "Waiting has a price too, paid in occupied towns. The army goes forward, on the timetable the army chooses, and accepts what that will cost."
 UKR_fortify_the_line:0 "Fortify the Line"
 UKR_fortify_the_line_desc:0 "Concrete, dragon's teeth and trench lines dug by people who have dug them before. The map stops moving, which is the point."
 UKR_liberate_the_donbass:0 "Liberate the Donbass"
 UKR_liberate_the_donbass_desc:0 "Four oblasts that have been called liberated by two different armies. This time the word is used by the side whose flag the schools already fly."
 UKR_every_town_a_fortress:0 "Every Town a Fortress"
 UKR_every_town_a_fortress_desc:0 "What was retaken will not be given back. Each settlement is prepared to be defended alone, because at some point one of them will have to be."
 UKR_the_long_war:0 "The Long War"
 UKR_the_long_war_desc:0 "Nobody says the word attrition out loud. The planning assumes it anyway: budgets to 1948, conscription classes not yet born, a war that outlasts governments."
 UKR_western_liaison:0 "Western Liaison"
 UKR_western_liaison_desc:0 "Officers in Wiesbaden and Brussels who speak the language of the people sending the shells. It is not an alliance. It is close enough to plan around."
 UKR_integrated_air_defence:0 "Integrated Air Defence"
 UKR_integrated_air_defence_desc:0 "A single picture of the sky, stitched from a dozen donated systems that were never designed to speak to one another. The cities sleep a little better."
 UKR_unified_general_staff:0 "Unified General Staff"
 UKR_unified_general_staff_desc:0 "Three years of improvisation turned into doctrine, and the brigade commanders who improvised it turned into the staff that writes it down."
 UKR_military_counterintelligence:0 "Military Counterintelligence"
 UKR_military_counterintelligence_desc:0 "Every offensive that was known about before it started was known about from inside. That is now somebody's full-time problem."
 UKR_sbu_ascendant:0 "The SBU Ascendant"
 UKR_sbu_ascendant_desc:0 "The security service ends the war larger, richer and less answerable than it began it. Everyone notices. Nobody says so during a war."
 UKR_total_mobilisation:0 "Total Mobilisation"
 UKR_total_mobilisation_desc:0 "The exemptions go, the age brackets widen, and the recruitment offices stop being places anyone walks past by accident."
 UKR_combined_arms_brigades:0 "Combined Arms Brigades"
 UKR_combined_arms_brigades_desc:0 "Armour, infantry and guns under one commander who has met all three. It sounds obvious. It took three years and a great many funerals."
 UKR_liberation_fervour:0 "Liberation Fervour"
 UKR_liberation_fervour_desc:0 "Every village retaken is a photograph, and every photograph is worth a battalion of volunteers. The country believes again, which is a resource like any other."
 UKR_deep_strike_campaign:0 "Deep Strike Campaign"
 UKR_deep_strike_campaign_desc:0 "The refineries, the railheads, the bridges. If the shells cannot be stopped at the front they will be stopped at the factory that makes them."
 UKR_drone_supremacy:0 "Drone Supremacy"
 UKR_drone_supremacy_desc:0 "A war fought by people who were building startups in 2021, using parts ordered online. It is undignified, and it works."
 UKR_carry_the_war_across:0 "Carry the War Across"
 UKR_carry_the_war_across_desc:0 "For three years the fighting happened only on one side of the line. That symmetry ends, and the ending of it is felt in Moscow more than any communique."
 UKR_liberate_every_oblast:0 "Liberate Every Oblast"
 UKR_liberate_every_oblast_desc:0 "The 1991 borders, on the ground and not on a map in a foreign ministry. It took longer than anyone promised and cost more than anyone admitted."
 UKR_martial_law:0 "Martial Law"
 UKR_martial_law_desc:0 "Renewed every ninety days since the first morning, by a parliament that keeps voting for it and a president who keeps asking. Nobody calls it temporary any more."
 UKR_the_european_course:0 "The European Course"
 UKR_the_european_course_desc:0 "The war is a queue for membership, and every reform demanded from Brussels is one more step forward in it. Sovereignty pooled is sovereignty kept."
 UKR_the_national_camp:0 "The National Camp"
 UKR_the_national_camp_desc:0 "Nobody died at Bakhmut for a directive on agricultural standards. The country that came out of this war is owed something more than an accession chapter."
 UKR_holos_in_government:0 "Holos in Government"
 UKR_holos_in_government_desc:0 "The liberals who spent the war being told their concerns were a peacetime luxury are handed ministries, and with them the bill for the reforms."
 UKR_meet_poroshenko:0 "An Understanding with Poroshenko"
 UKR_meet_poroshenko_desc:0 "The predecessor, the rival, the man with the chocolate factory and the army he began rebuilding in 2014. The arrangement is not friendship. It is arithmetic."
 UKR_ban_the_pro_russian_parties:0 "Ban the Pro-Russian Parties"
 UKR_ban_the_pro_russian_parties_desc:0 "Eleven parties struck off in a morning. Some of them had genuinely changed. The commission does not have time to work out which."
 UKR_europe_is_the_only_road:0 "Europe Is the Only Road"
 UKR_europe_is_the_only_road_desc:0 "The choice between east and west, which has torn every Ukrainian parliament since 1991, is settled by the people who did the tearing having chosen the wrong side of a war."
 UKR_presidential_vertical:0 "The Presidential Vertical"
 UKR_presidential_vertical_desc:0 "Decisions that used to take a season now take a morning, and go through one building. It was necessary. Necessary things have a way of becoming permanent."
 UKR_break_the_oligarchs:0 "Break the Oligarchs"
 UKR_break_the_oligarchs_desc:0 "The men who owned the television stations, the steel and half the deputies. The war took their assets in the east; the state takes the rest."
 UKR_zelensky_undisputed:0 "Zelensky Undisputed"
 UKR_zelensky_undisputed_desc:0 "The comedian nobody took seriously ends the decade as the only figure the country agrees on. Agreement on one man is not the same as agreement."
 UKR_meet_tymoshenko:0 "An Understanding with Tymoshenko"
 UKR_meet_tymoshenko_desc:0 "She has survived Kuchma, prison and three revolutions, and she is still counting deputies. Whatever is being built, she intends to be inside it."
 UKR_svoboda_rises:0 "Svoboda Rises"
 UKR_svoboda_rises_desc:0 "A party that polled two per cent in peacetime finds that three years of war have made its vocabulary ordinary."
 UKR_the_azov_question:0 "The Azov Question"
 UKR_the_azov_question_desc:0 "Men who held a steelworks for eighty-two days and came back from captivity as living monuments. Monuments are difficult to demobilise."
 UKR_heroes_never_die:0 "Heroes Never Die"
 UKR_heroes_never_die_desc:0 "The chant from the barricades in 2014, sung now at state funerals by ministers. What began as mourning becomes a governing principle."
 UKR_a_nation_forged:0 "A Nation Forged"
 UKR_a_nation_forged_desc:0 "Whatever Ukraine was on the twenty-third of February, it is not that now. The war made a nation of it, in the way wars do, which is not gently."
 UKR_the_economy_in_ruins:0 "The Economy in Ruins"
 UKR_the_economy_in_ruins_desc:0 "A third of the output gone, a quarter of the people gone, and a budget in which the word deficit has stopped meaning anything. It still has to buy shells tomorrow."
 UKR_reconstruction_first:0 "Reconstruction First"
 UKR_reconstruction_first_desc:0 "A country with no power stations cannot make weapons either. Rebuild what is behind the line, and the line will hold longer for it."
 UKR_everything_for_the_front:0 "Everything for the Front"
 UKR_everything_for_the_front_desc:0 "Reconstruction is what you do after. Anything spent on after is taken from the chance of there being one."
 UKR_rebuild_the_grid:0 "Rebuild the Grid"
 UKR_rebuild_the_grid_desc:0 "Every winter the substations are hit and every spring they are rebuilt, a little tougher and a little more dispersed. The fourth winter, the lights stay on."
 UKR_the_grain_corridor:0 "The Grain Corridor"
 UKR_the_grain_corridor_desc:0 "The ships leave Odessa again, hugging the Romanian coast, and half of Africa notices before half of Europe does."
 UKR_accession_to_the_union:0 "Accession to the Union"
 UKR_accession_to_the_union_desc:0 "Thirty-five chapters, a decade of arguing about cheese, and a queue that Kyiv entered with the strongest possible argument and the weakest possible economy."
 UKR_western_reconstruction_fund:0 "The Reconstruction Fund"
 UKR_western_reconstruction_fund_desc:0 "Money that arrives with auditors attached. The auditors are resented, and they are the reason the next tranche arrives."
 UKR_privatise_or_perish:0 "Privatise or Perish"
 UKR_privatise_or_perish_desc:0 "The state owns three thousand enterprises and can run perhaps thirty. The rest go, at prices that will be argued about for a generation."
 UKR_the_eastern_marshall_plan:0 "The Eastern Marshall Plan"
 UKR_the_eastern_marshall_plan_desc:0 "Not charity and never called it: the money comes back as contracts for the firms that lent it. Everyone understands this and everyone signs."
 UKR_corruption_at_war:0 "Corruption at War"
 UKR_corruption_at_war_desc:0 "Eggs at three times the price, body armour that was never delivered. It is not the largest problem the country has, and it is the one the donors read about."
 UKR_nabu_unleashed:0 "NABU Unleashed"
 UKR_nabu_unleashed_desc:0 "The anti-corruption bureau is given the one thing it has always lacked, which is permission. The first arrests are of people who assumed the war protected them."
 UKR_clean_hands:0 "Clean Hands"
 UKR_clean_hands_desc:0 "A country that spent thirty years being told corruption was in its character discovers that it was in its incentives, and changes them."
 UKR_nationalise_war_industry:0 "Nationalise the War Industry"
 UKR_nationalise_war_industry_desc:0 "Ukroboronprom stops being a holding company for other people's arrangements and starts being a ministry that makes things."
 UKR_domestic_drone_industry:0 "The Drone Industry"
 UKR_domestic_drone_industry_desc:0 "Four hundred firms, most of them founded since the invasion, most of them in somebody's garage. Together they out-produce a continent."
 UKR_arms_for_export:0 "Arms for Export"
 UKR_arms_for_export_desc:0 "The only army in Europe that has tested everything it sells. The catalogue writes itself, and the queue forms early."
 UKR_foreign_weapons_purchases:0 "Foreign Weapons Purchases"
 UKR_foreign_weapons_purchases_desc:0 "Buying rather than begging changes the conversation. It also empties the treasury, which is a conversation for afterwards."
 UKR_the_ammunition_initiative:0 "The Ammunition Initiative"
 UKR_the_ammunition_initiative_desc:0 "A million shells promised, rather fewer delivered, and an entire continent discovering what its defence industry actually is."
 UKR_no_shell_left_unused:0 "No Shell Left Unused"
 UKR_no_shell_left_unused_desc:0 "Counter-battery discipline enforced from the top: nothing is fired to make a point. Every round is accounted for, because every round was argued for in a foreign parliament."
 UKR_a_western_economy:0 "A Western Economy"
 UKR_a_western_economy_desc:0 "The thing the Maidan was about, arrived at by the least imaginable road. Poorer than it was in 2021, and pointed somewhere it never quite was before."

 # ==== i tooltip delle condizioni di guerra ====
 UKR_tt_war_ongoing:0 "The war with Russia is still being fought"
 UKR_tt_donbass:0 "The four oblasts of the Donbass have been liberated"
 UKR_tt_crimea:0 "Crimea has been retaken"
 UKR_tt_into_russia:0 "The war has been carried onto Russian soil"
