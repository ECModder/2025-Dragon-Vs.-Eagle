l_english:
 # ==== DvE - la guerra d'Ucraina ====

 # ---- missioni ----
 RUS_ukraine_campaign:0 "The Ukrainian Campaign"
 RUS_ukraine_campaign_desc:0 "Two hundred and seventy-eight days to finish what was begun. Hold the four oblasts of the Donbass, take Odessa, and then take Kyiv. If the year runs out with the map unchanged, the guns stop where they stand and the Federation explains the result to itself as best it can."
 UKR_liberation_campaign:0 "The Campaign of Liberation"
 UKR_liberation_campaign_desc:0 "Two hundred and seventy-eight days, and the same clock. Retake the four oblasts, retake Crimea, and carry the war across the border. If the year runs out first, the front line becomes a border, whatever anyone calls it."

 # ---- Russia ----
 dve_ukrwar.1.t:0 "The Donbass Is Secured"
 dve_ukrwar.1.d:0 "Kherson, Zaporozhe, Donetsk and Lugansk are held to the last village. The oblasts the Federation has claimed for years are, for the first time, entirely in its hands.\n\nThe General Staff would like it noted that this was the easy part."
 dve_ukrwar.1.a:0 "Now the coast."
 dve_ukrwar.2.t:0 "Odessa Has Fallen"
 dve_ukrwar.2.d:0 "The port is taken and Ukraine is cut from the sea. Whatever happens now, the country to the west is landlocked and knows it.\n\nOne objective remains, and everyone in the room has been thinking about it since February."
 dve_ukrwar.2.a:0 "Kyiv."
 dve_ukrwar.3.t:0 "Kyiv"
 dve_ukrwar.3.d:0 "The capital is taken. What is signed afterwards is a formality: Ukraine will have a government, a flag and an army, and none of the three will decide anything Moscow has not decided first.\n\nThe war is over. The Federation has what it came for."
 dve_ukrwar.3.a:0 "It is finished."
 dve_ukrwar.4.t:0 "The Guns Stop Where They Stand"
 dve_ukrwar.4.d:0 "Two hundred and seventy-eight days, and the map is close enough to where it started that the difference can be measured in villages. Neither side can move the other, and both have run out of ways to explain why.\n\nThe front line becomes a border. Nobody signs anything calling it that."
 dve_ukrwar.4.a:0 "A pause, then. Only a pause."
 dve_ukrwar.5.t:0 "Lost in Ukraine"
 dve_ukrwar.5.d:0 "The four oblasts are gone. Not contested, not encircled - gone, with Ukrainian administrators already sitting in the offices.\n\nWhat follows is not a military problem. An army that loses a war it was told it had already won comes home with opinions, and so does everyone who watched."
 dve_ukrwar.5.a:0 "Someone will have to answer for this."

 # ---- Ucraina ----
 dve_ukrwar.10.t:0 "The Oblasts Are Ours Again"
 dve_ukrwar.10.d:0 "Kherson, Zaporozhe, Donetsk and Lugansk are back under Kyiv's administration, and the Russian army is falling back to positions it has not held in years.\n\nThe war is not over. But for the first time it is being fought on someone else's schedule."
 dve_ukrwar.10.a:0 "Do not stop."
 dve_ukrwar.11.t:0 "Crimea"
 dve_ukrwar.11.d:0 "The peninsula is retaken. It was supposed to be the one thing that could never be undone, and it has been undone.\n\nThe Black Sea Fleet has nowhere left to anchor that Kyiv cannot reach."
 dve_ukrwar.11.a:0 "It was always ours."
 dve_ukrwar.12.t:0 "The War Crosses the Border"
 dve_ukrwar.12.d:0 "Ukrainian units are operating on Russian soil, in oblasts that have never in living memory heard artillery.\n\nWhatever else this war produces, the argument that it could only ever be fought in one direction has been settled."
 dve_ukrwar.12.a:0 "Let them find out what it is like."
 dve_ukrwar.13.t:0 "The Front Line Becomes a Border"
 dve_ukrwar.13.d:0 "The fighting stops with the map where it is. Kyiv has survived, which at the beginning of all this was more than most capitals abroad were willing to bet on.\n\nIt is not victory. It is not defeat either, and the difference matters."
 dve_ukrwar.13.a:0 "We are still here."
