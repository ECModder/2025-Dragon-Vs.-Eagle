 l_english:
 dve_rom.1.t:0 "Romania and Bulgaria in Schengen"
 dve_rom.1.d:0 "After years of waiting, Romania and Bulgaria are officially in the Schengen Area. Border checkpoints are shutting down. Passports are no longer needed to travel to the rest of the bloc.\n\nThis ends a long diplomatic fight. It brings both countries closer to the rest of Europe. Trade will move faster without the long lines of trucks at the border. Their economies will get a boost. For the citizens, it means true freedom of movement at last."
 dve_rom.1.a:0 "What a step for both nations."
 dve_rom.2.t:0 "The January Strikes"
 dve_rom.2.d:0 "In January 2025, a wave of strikes and industrial actions swept across Romania as workers confronted worsening economic conditions and government austerity measures.\n\nPolice officers, railway workers, miners, forestry workers, steelworkers, public-sector employees and other organized labor groups took collective action over frozen wages, pension concerns, reduced benefits and measures introduced through the government's so-called 'austerity ordinance'.\n\nThe strikes represented a growing confrontation between organized labor and the Romanian government, with unions demanding that workers' rights and incomes be protected.\n\nDemonstrations organized specifically around political issues and the annulled presidential election remained a separate movement, distinct from the labor actions.\n\nThe January Strikes became a defining moment of labor unrest in Romania - a month when workers organized, withdrew their labor and demanded to be heard."
 dve_rom.2.a:0 "Hope the people get what they want."
 dve_rom.3.t:0 "Klaus Iohannis Resigns"
 dve_rom.3.d:0 "After more than a decade at the helm of Romania, President Klaus Iohannis announced his resignation on February 10, 2025, amid mounting political pressure and a parliamentary procedure seeking his suspension.\n\nIn his address from Cotroceni Palace, Iohannis stated that he was resigning to spare Romania from what he described as an unnecessary and damaging political crisis. His announcement immediately changed the political landscape, ending the planned parliamentary suspension proceedings.\n\nTwo days later, on February 12, Iohannis formally left Cotroceni Palace. Senate President Ilie Bolojan assumed the role of interim president, beginning a transitional period ahead of the rescheduled presidential election."
 dve_rom.3.a:0 "Good luck for him."
 dve_rom.4.t:0 "The Detention of Calin Georgescu"
 dve_rom.4.d:0 "On February 26, 2025, Calin Georgescu was stopped by police in Bucharest while traveling to submit his candidacy for the upcoming presidential election. He was taken to the Prosecutor General's Office for questioning as prosecutors opened a criminal investigation into several alleged offenses.\n\nGeorgescu was questioned for approximately five hours.\n\nProsecutors announced accusations including alleged incitement to actions against the constitutional order, communicating false information, false declarations concerning campaign financing, and promoting extremist organizations and ideologies. Georgescu denied wrongdoing and characterized the investigation as an attempt to prevent his candidacy.\n\nAfter the questioning, Georgescu was released under judicial control for 60 days, including a prohibition on leaving Romania.\n\nHis detention triggered demonstrations outside the prosecutor's office, where supporters gathered demanding his release.\n\nA presidential candidate was taken in for questioning. A political crisis deepened."
 dve_rom.4.a:0 "Welp, there goes a hero."
 dve_rom.5.t:0 "The Presidential Election"
 dve_rom.5.d:0 "The presidential election was held on May 18 2025, it was between Nicusor Dan, Gheorghe Simion and Crin Antonescu. All three of them appear to be really trusted by the people but only one of them can win. Who will the people choose?"
 dve_rom.6.t:0 "The 2nd Revolution"
 dve_rom.6.d:0 "It began with strikes in the oil fields and empty shelves in Cluj. Within a week the crowds had reached Bucharest, and the square that toppled Ceaușescu in 1989 filled once more. The ruling party has lost the streets, the barracks are wavering, and old claimants and new prophets are both waiting in the wings. Romania has risen a second time, and the old order will not survive the week."
 dve_rom.7.t:0 "The New Candidates for the 2025 Elections"
 dve_rom.7.d:0 "The campaign is open, and three names dominate the country. Nicușor Dan, the mayor of Bucharest, promises clean government and civic reform. Crin Antonescu, the liberal veteran, offers experience and the backing of the established parties. George Simion, leader of the nationalist right, speaks for those who feel forgotten by Bucharest and Brussels alike. Three men, three visions of Romania, and one election to decide between them."
 # ===== Prelude tree (romania.txt, Romania_Focus_Tree) =====
 ROM_the_new_year:0 "The New Year"
 ROM_the_new_year_desc:0 "The year is 2025. Let us hope it brings stability rather than chaos."
 ROM_remove_the_strikes:0 "Remove the Strikes"
 ROM_remove_the_strikes_desc:0 "Ever since the Constitutional Court annulled the presidential election in December 2024, protests have kept flaring up across the country. The streets must be calmed before the unrest spreads any further."
 ROM_announce_the_new_candidates:0 "Announce the New Candidates"
 ROM_announce_the_new_candidates_desc:0 "The nation awaits a fresh start. It is time to announce the candidates who will compete for the presidency in this year's elections."
 ROM_stagnate_the_economy:0 "Stagnate the Economy"
 ROM_stagnate_the_economy_desc:0 "The economy is struggling and every bold reform risks making matters worse. For now, the wisest course may be to hold steady and avoid further decline."
 ROM_the_2025_elections:0 "The 2025 Elections"
 ROM_the_2025_elections_desc:0 "The day has finally come. The Romanian people will go to the polls and choose their next president."
 ROM_screw_the_elections:0 "Screw the Elections"
 ROM_screw_the_elections_desc:0 "Weary of endless elections and broken promises, the people have lost their patience. They will no longer wait for the ballot box and have decided to take matters into their own hands."
 ROM_screw_the_elections_tt:0 "§YThe Romanian Revolution§! begins: §YAUR§! seizes power under §YCalin Georgescu§!."

 # ===== romania_elections: The Republic Decides (generated by tools/gen) =====
 ROM_interim_mandate:0 "The Interim Mandate"
 ROM_interim_mandate_desc:0 "The country did not give any candidate a clear mandate. Ilie Bolojan stays on as interim president, the cabinet runs on autopilot and every party is already counting the days to a rerun. The state cannot drift for long."
 ROM_interim_budget:0 "The Provisional Budget"
 ROM_interim_budget_desc:0 "A caretaker government cannot pass a real budget, but it can extend last year's by ordinance, freeze new spending and keep paying pensions and salaries on time. Nobody will thank it; everybody would notice if it failed."
 ROM_interim_security:0 "Keep the Services Neutral"
 ROM_interim_security_desc:0 "The intelligence services, the prosecutors and the army have all been accused of taking sides in 2024. Bolojan summons their chiefs to Cotroceni and makes them sign a public pledge of neutrality before the rerun."
 ROM_interim_integrity:0 "Freeze the Appointments"
 ROM_interim_integrity_desc:0 "No new prefects, no new boards and no last-minute contracts until there is an elected president. The parties hate it: an interim period is usually the best time to place one's people."
 ROM_interim_parties:0 "Talks at Cotroceni"
 ROM_interim_parties_desc:0 "The party leaders are invited to agree on a date, a campaign code and a commitment to accept the result. Some come to negotiate and some come to be seen refusing."
 ROM_snagov_survey:0 "The Snagov Survey"
 ROM_snagov_survey_desc:0 "Routine work, on paper: the National Heritage Institute is surveying the foundations of the monastery on Snagov island before restoration. Then the ground-penetrating radar finds a sealed chamber under the church that appears on no plan, and the SRI asks the archaeologists to stop talking to journalists."
 ROM_rerun_the_ballot:0 "Back to the Ballot Box"
 ROM_rerun_the_ballot_desc:0 "The Permanent Electoral Authority has set a new date. This time the result will stand, whoever wins it. A second inconclusive vote would be a gift to everyone who claims the republic no longer works."
 ROM_the_sealed_crypt:0 "Open the Sealed Crypt"
 ROM_the_sealed_crypt_desc:0 "Bolojan could hand the file to the next president and hold the rerun on time. Or the interim government can postpone the vote on grounds of national security, keep the services working on Snagov and find out what was walled up under the island five hundred years ago. Nobody outside a very small room will be told the real reason."
 ROM_nicusor_victory:0 "President Nicusor Dan"
 ROM_nicusor_victory_desc:0 "The mathematician who spent two decades suing developers over Bucharest's parks has won the presidency. He has no party of his own, a coalition that does not trust him and a deficit of nearly nine percent of GDP. He also has the one thing his rivals lacked: credibility."
 ROM_the_investiture_of_prime_minister_bolojan:0 "The Bolojan Cabinet"
 ROM_the_investiture_of_prime_minister_bolojan_desc:0 "Ilie Bolojan built his reputation by cutting payrolls in Oradea and Bihor. Asking him to form a government signals that the presidency means to fix the public finances first and ask for applause later. The shape of his cabinet will decide how much of Parliament comes along."
 ROM_cut_everything:0 "The Fiscal Consolidation Package"
 ROM_cut_everything_desc:0 "Higher VAT, frozen public wages and a hiring stop across the administration. Brussels has opened an excessive deficit procedure and the rating agencies are one downgrade away from junk. The package is necessary; it will also be the most unpopular law of the decade."
 ROM_reform_the_goverment:0 "Slim the State"
 ROM_reform_the_goverment_desc:0 "Romania has more agencies than anyone can list and more state secretaries than its larger neighbours. Merging ministries and closing duplicate agencies will save money, and it will show voters that the cuts start at the top."
 ROM_dan_digital_state:0 "One Login for the State"
 ROM_dan_digital_state_desc:0 "A Romanian still needs a stamped paper certificate from one office to obtain a stamped paper certificate from another. A single digital identity, accepted by every institution, is the reform that voters will notice every week."
 ROM_special_pensions:0 "End the Special Pensions"
 ROM_special_pensions_desc:0 "Magistrates retiring at 48 on pensions above their final salary have become a national scandal. The judges will fight the reform in the Constitutional Court and the coalition will wobble. Passing it needs a majority that holds together under pressure."
 ROM_state_enterprises:0 "Professionalise the State Companies"
 ROM_state_enterprises_desc:0 "Hidroelectrica, Romgaz and Nuclearelectrica are profitable, but their boards are filled by party appointments. Independent management and a partial listing on the Bucharest exchange would raise money and close a reliable source of patronage."
 ROM_the_trial_of_georgescu:0 "Expose the 2024 Interference"
 ROM_the_trial_of_georgescu_desc:0 "Declassified CSAT files describe paid influencer networks and coordinated accounts behind the annulled first round. Publishing everything and prosecuting the organisers would harden the republic against the next attempt. It would also confirm, for many voters, that the vote was stolen from them."
 ROM_national_reconciliation:0 "Turn the Page"
 ROM_national_reconciliation_desc:0 "A third of the country voted for candidates who called the annulment a coup. Dan can choose not to relitigate 2024: close the open files quietly, invite the opposition to the table and govern for the people who did not vote for him."
 ROM_dan_eguvernare:0 "Close the Paper Counters"
 ROM_dan_eguvernare_desc:0 "Every form that can be filed online will be, and every office that only exists to stamp paper will close. Thousands of clerks are retrained; thousands of small bribes for 'speeding up' a file disappear with them."
 ROM_deficit_under_control:0 "Deficit Below Six Percent"
 ROM_deficit_under_control_desc:0 "If the package holds for a full budget year, the numbers will turn. Brussels will suspend the deficit procedure, borrowing costs will fall and the government can begin to ease the measures that kept it unpopular."
 ROM_address_corruption:0 "Restore the DNA's Teeth"
 ROM_address_corruption_desc:0 "The National Anticorruption Directorate was once the most trusted institution in the country, until successive governments trimmed its powers. Restoring its independence and budget is the reform Dan's own voters care about most."
 ROM_dan_cyber_shield:0 "A Civilian Cyber Shield"
 ROM_dan_cyber_shield_desc:0 "Hospitals, the electoral authority and the energy grid were all probed by hostile hackers during the 2024 campaign. A national cyber directorate with civilian oversight protects the digital state before it becomes a target."
 ROM_dan_open_data:0 "The Open Data Law"
 ROM_dan_open_data_desc:0 "Budgets, contracts, inspection reports and court rulings published in machine-readable form. Journalists and civic hackers do the rest."
 ROM_dan_oecd:0 "Join the OCED"
 ROM_dan_oecd_desc:0 "Accession talks began in 2022 and stalled whenever reforms did. Meeting the remaining standards on state companies, competition and anti-bribery would make Romania the first post-communist Balkan member and a safer bet for every investor."
 ROM_dan_judicial_merit:0 "Judges Chosen by Merit"
 ROM_dan_judicial_merit_desc:0 "Promotions in the magistracy are decided by colleagues who owe one another favours. Anonymous written exams and published evaluations would make careers depend on competence instead."
 ROM_dan_prosecutors_charter:0 "The Prosecutors' Charter"
 ROM_dan_prosecutors_charter_desc:0 "The Special Section that investigated magistrates was abolished in 2022, but the rules that let politicians lean on prosecutors survived. The charter puts the chief prosecutors' appointments beyond the reach of the Justice Minister."
 ROM_dan_digital_romania:0 "Digital Romania 2030"
 ROM_dan_digital_romania_desc:0 "With a working digital state behind it, Romania can sell what it has learned: e-government services for Moldova and the Western Balkans, and a public cloud that keeps citizens' data inside the EU."
 ROM_dan_euro_roadmap:0 "The Euro Roadmap"
 ROM_dan_euro_roadmap_desc:0 "Romania is legally bound to adopt the euro and has never set a date. A credible roadmap, with the deficit under three percent and two years in the exchange-rate mechanism, would anchor the reforms beyond this presidency."
 ROM_civic_compact:0 "The Civic Compact"
 ROM_civic_compact_desc:0 "With the budget stabilised and the prosecutors back at work, the presidency can offer something positive: a ten-year compact on schools, hospitals and digital public services, signed by every party willing to sign it."
 ROM_dan_teachers_pact:0 "The Teachers' Pact"
 ROM_dan_teachers_pact_desc:0 "A teacher in a Romanian village earns less than a supermarket manager, and a fifth of fifteen-year-olds cannot read a simple text. Higher pay tied to training, and a curriculum written by educators rather than ministers, is a generation's work."
 ROM_dan_county_hospitals:0 "Regional Hospitals"
 ROM_dan_county_hospitals_desc:0 "The three regional emergency hospitals in Iasi, Cluj and Craiova have been 'about to start' since 2014. Building them, on budget and in public view, would show the compact is more than a signature."
 ROM_dan_rural_doctors:0 "Doctors for the Villages"
 ROM_dan_rural_doctors_desc:0 "Hundreds of communes have no family doctor at all. Housing, bonuses and shorter residencies for doctors who settle in the countryside bring the state back to places that had forgotten what it looked like."
 ROM_the_conservative_state_of_romania:0 "Rebuild the Liberal Centre"
 ROM_the_conservative_state_of_romania_desc:0 "The National Liberals have carried Dan's programme through Parliament. Endorsing them openly would give the presidency a stable base for the next decade, at the cost of tying a non-party president to one party's fortunes."
 ROM_party_of_the_president:0 "A Movement of the President"
 ROM_party_of_the_president_desc:0 "Dan won without a party machine and could build one now: independent mayors, reform-minded deputies and the civic groups that organised his campaign. It would shake up the old parties for good, and they will make the next year very difficult."
 ROM_dan_euro_adoption:0 "Into the Eurozone"
 ROM_dan_euro_adoption_desc:0 "Two years of discipline in the exchange-rate mechanism, a deficit under three percent and a vote in the European Council. Romania joins the euro: cheaper borrowing for everyone, and no more room for a government to inflate its way out of trouble."
 ROM_dan_decentralise:0 "Decentralise the Republic"
 ROM_dan_decentralise_desc:0 "County councils receive the money and the powers that ministries in Bucharest have hoarded since 1990: roads, schools, local health. With open data and audited contracts, the risk that county barons simply steal it is lower than it has ever been."
 ROM_republic_of_merit:0 "The Republic of Merit"
 ROM_republic_of_merit_desc:0 "Promotion by competence rather than by party card was the promise of 1989 that every government since has broken. If this presidency keeps it, the state Romanians meet at the counter, in the courtroom and at the hospital will finally feel like their own."
 ROM_dan_second_term:0 "The 2030 Mandate"
 ROM_dan_second_term_desc:0 "Five years after an election nobody expected him to win, Dan asks the country to judge his record. The old parties have regrouped, the nationalists have a new candidate and the reformers' voters are tired of being patient."
 ROM_dan_european_romania:0 "Romania at Europe's Core"
 ROM_dan_european_romania_desc:0 "Euro or not, Romania now sits at the tables where the Union is decided: a net contributor to regional security, a model of digital government and a country whose young people have started coming home. The republic of 1989 has become what its founders hoped for."
 ROM_simion_victory:0 "President George Simion"
 ROM_simion_victory_desc:0 "The man who began as a unionist street organiser now sleeps at Cotroceni. His AUR is the largest single party, yet well short of a majority, and every other faction in Parliament campaigned against him. Brussels, Washington and Kyiv are waiting to see which Simion took the oath."
 ROM_cabinet_of_patriots:0 "Hunt for a Majority"
 ROM_cabinet_of_patriots_desc:0 "Thirty-eight seats in a hundred do not pass laws. Simion can court the restless right wing of the National Liberals, or he can govern by emergency ordinance and dare Parliament to bring him down."
 ROM_sim_mobilise_the_squares:0 "Keep the Squares Full"
 ROM_sim_mobilise_the_squares_desc:0 "The movement won in the streets before it won at the ballot box. Weekly rallies, online assemblies and a national day of the movement keep supporters engaged, and remind Parliament who is watching."
 ROM_sim_party_congress:0 "The First Congress in Power"
 ROM_sim_party_congress_desc:0 "Three thousand delegates in the Romexpo halls, and three wings that each think the victory was theirs: the Strasbourg conservatives who want respectability, the street radicals who want Georgescu back, and the county organisers who want jobs."
 ROM_sim_county_network:0 "The County Organisation"
 ROM_sim_county_network_desc:0 "AUR has activists everywhere and administrators almost nowhere. Recruiting mayors, councillors and local businessmen, including some who were in other parties last year, builds a machine that can govern. It also builds one that can be bought."
 ROM_sovereign_not_isolated:0 "Sovereign, Not Isolated"
 ROM_sovereign_not_isolated_desc:0 "AUR's voters want Romania to stand up for itself; few want it outside NATO with a war next door. Simion can govern like the European conservatives he sits with in Strasbourg: loud about sovereignty, careful about alliances."
 ROM_sim_party_school:0 "The Party Academy"
 ROM_sim_party_school_desc:0 "A movement of volunteers cannot staff ministries. A party academy trains the cadres who will run prefectures, agencies and state companies. Who teaches there, and what, will decide what kind of party AUR becomes."
 ROM_release_calin_georgecu:0 "Pardon Calin Georgescu"
 ROM_release_calin_georgecu_desc:0 "The movement's martyr is still under judicial control. A presidential pardon would electrify the base and bring Georgescu back into public life. It would also be read in Brussels as a declaration of war on the rule of law, and the money would stop."
 ROM_romania_first_policy:0 "The Romania First Budget"
 ROM_romania_first_policy_desc:0 "Lower VAT on food, protection for farmers against cheap imports and a ban on selling farmland to foreign funds. Economists will grumble. The villages that voted for AUR will feel listened to for the first time in years."
 ROM_sovereign_bloc:0 "The Sovereigntist Caucus"
 ROM_sovereign_bloc_desc:0 "Warsaw's conservatives and Rome's governing right share AUR's view that the Union should be a club of nations rather than a federation in waiting. A coordinated bloc in the European Council would give Bucharest weight it has never had alone."
 ROM_diaspora_homecoming:0 "Bring the Diaspora Home"
 ROM_diaspora_homecoming_desc:0 "Between three and five million Romanians live abroad, and the diaspora voted for Simion more than anyone. Tax holidays for returning workers, recognised foreign qualifications and housing grants could start to reverse thirty years of emigration."
 ROM_purge_the_institutions:0 "Purge the 'Parallel State'"
 ROM_purge_the_institutions_desc:0 "Simion's base blames the Constitutional Court, the intelligence services and the prosecutors for 2024. Replacing their leadership with loyalists would remove every brake on the government. Many deputies who fear being next will fall into line; others will resign in protest."
 ROM_the_idea_of_a_greater_romania:0 "The Unionist Programme"
 ROM_the_idea_of_a_greater_romania_desc:0 "Unionism was Simion's cause long before it was his party's. The programme declares the union of Bessarabia a national objective, not a slogan, and refuses to rule out any means of achieving it."
 ROM_sim_farmers_charter:0 "The Farmers' Charter"
 ROM_sim_farmers_charter_desc:0 "Smallholders who sell at the market pay the same paperwork as an agro-holding of fifty thousand hectares. Simplified rules, local abattoirs and a state buyer of last resort turn AUR's rural vote into a lasting rural base."
 ROM_sim_council_presidency:0 "Chairing the Sovereigntist Bloc"
 ROM_sim_council_presidency_desc:0 "With Warsaw and Rome behind it, Bucharest can chair the bloc's common positions on migration, the budget and enlargement. For the first time Romania sets an agenda in Brussels instead of following one."
 ROM_sim_history_curriculum:0 "History in Every School"
 ROM_sim_history_curriculum_desc:0 "Union, the Carpathians, the national poets and the anti-communist resistance at the centre of the curriculum. Historians welcome more history hours; many object to who decides what it says, and the Hungarian minority asks where its own history fits."
 ROM_sim_diaspora_vote:0 "Diaspora Constituencies"
 ROM_sim_diaspora_vote_desc:0 "Romanians abroad elect six deputies for millions of voters. More seats, postal voting and polling stations in every European city they live in would turn the movement's strongest constituency into lasting power."
 ROM_sim_sovereign_constitution:0 "A Sovereigntist Constitution"
 ROM_sim_sovereign_constitution_desc:0 "The radicals' draft would subordinate European law to the Romanian constitution, curb the Constitutional Court and let the president dissolve Parliament more easily. It needs a referendum, and a country willing to vote for it."
 ROM_sim_passports_for_bessarabia:0 "Passports for Bessarabia"
 ROM_sim_passports_for_bessarabia_desc:0 "Every Moldovan citizen with a Romanian grandparent can already claim a Romanian passport. Speeding up the process to weeks, and opening offices in every Moldovan district, makes union a matter of paperwork."
 ROM_remain_in_nato_but_in_our_terms:0 "The Eastern Flank on Our Terms"
 ROM_remain_in_nato_but_in_our_terms_desc:0 "Romania hosts the Aegis Ashore site at Deveselu and soon the largest allied base in Europe. That is leverage. Simion can stay a loyal ally while demanding American industrial investment and a permanent brigade in exchange."
 ROM_sim_second_congress:0 "The Second Congress"
 ROM_sim_second_congress_desc:0 "Two years into power, the movement must choose its line for the rest of the term. Whichever wing has built the most influence will carry the congress and write the programme; the others will have to accept it, or leave."
 ROM_reclaim_northern_bukovina:0 "Northern Bukovina Is Romanian"
 ROM_reclaim_northern_bukovina_desc:0 "Cernauti was a Romanian city until 1940. Saying so while Ukraine fights for its life would horrify every ally Romania has. The radicals around the President insist that history does not wait for convenient moments."
 ROM_sim_respect_the_court:0 "Respect the Court's Ruling"
 ROM_sim_respect_the_court_desc:0 "The Constitutional Court has struck down the government's emergency ordinances on the media and the magistracy. Complying would cost the President face with his base and show the country that the movement governs within the rules."
 ROM_sim_defy_the_court:0 "Defy the Court"
 ROM_sim_defy_the_court_desc:0 "The President announces that the government will not apply a ruling 'dictated by the parallel state'. The squares fill with supporters; the opposition calls it a constitutional coup, and the European Commission opens rule-of-law proceedings."
 ROM_sim_sovereignty_referendum:0 "The Sovereignty Referendum"
 ROM_sim_sovereignty_referendum_desc:0 "The movement asks the country directly: should the Romanian constitution take precedence over every foreign treaty and court? If the President wins, he governs with a mandate no Parliament can match. If he loses, the movement may never recover."
 ROM_sovereign_romania:0 "A Sovereign Romania in Europe"
 ROM_sovereign_romania_desc:0 "Inside the Union and the Alliance, but on Romania's own terms: Simion's moderate wing has shown that a nationalist government can deliver for its voters without isolating the country. The opposition will call it a betrayal of the movement and a disguised takeover, depending on which side of it they stand."
 ROM_sim_third_congress:0 "The Third Congress: Who Comes After"
 ROM_sim_third_congress_desc:0 "Simion will not lead the movement forever. The last congress of the term decides who inherits it and what it will become: a European conservative party, a disciplined party of state, or a crusade that does not stop at the borders."
 ROM_greater_romania:0 "Greater Romania Proclaimed"
 ROM_greater_romania_desc:0 "The President addresses a crowd of half a million in Alba Iulia and declares the borders of 1918 the only legitimate borders of the Romanian nation. Romania's allies will not follow it down this road."
 ROM_sim_party_of_the_nation:0 "The Party of the Nation"
 ROM_sim_party_of_the_nation_desc:0 "The machine has won. AUR is no longer a protest; it is the state's personnel office, with a member in every prefecture and a contract for every loyal county. Elections continue, and the party has made sure it cannot really lose them."
 ROM_sim_movement_endures:0 "A Movement That Outlasts Its Founder"
 ROM_sim_movement_endures_desc:0 "Whatever line it took, the movement that began with unionist marches has governed Romania for a full term. Whether it is remembered as a renewal or a warning depends on how much of its legitimacy survived the journey."
 ROM_victory_for_antonescu:0 "President Crin Antonescu"
 ROM_victory_for_antonescu_desc:0 "The common candidate of the Social Democrats and the Liberals has won. He takes office with the biggest parliamentary base of any president in years, two parties that agree on almost nothing, and a campaign promise that the war next door makes impossible to ignore: a state strong enough to protect its citizens."
 ROM_pact:0 "The Grand Coalition Pact"
 ROM_pact_desc:0 "PSD and PNL must agree a programme, divide the ministries and settle the question of who holds the Prime Minister's office. Antonescu's condition is simple: whatever else they quarrel about, defence and security are decided at Cotroceni."
 ROM_stick_with_socialism:0 "A Social-Democratic Cabinet"
 ROM_stick_with_socialism_desc:0 "PSD has the larger group and the votes of the pensioners, public employees and small towns. Letting it set the economic line means a security state that also protects incomes: the arsenal pays wages, and the deficit waits."
 ROM_ant_csat_doctrine:0 "The President Chairs the CSAT"
 ROM_ant_csat_doctrine_desc:0 "The Supreme Council of National Defence has always met when there was a crisis. Antonescu makes it meet every week, with its own secretariat and a mandate over defence, intelligence, energy security and critical infrastructure. Ministers still govern; the CSAT sets the priorities."
 ROM_liberal_restoration:0 "The Liberal Restoration"
 ROM_liberal_restoration_desc:0 "Antonescu began his career as a National Liberal, and the business community expects him to remember it. A PNL-led cabinet would build the strong state through private contractors, foreign partners and a flat tax that keeps investors coming, and PSD would resent every day of it."
 ROM_strenght:0 "Pensions Before Deficits"
 ROM_strenght_desc:0 "The pension point increase promised before the election will be paid in full. It is expensive, but it keeps a promise to five million pensioners, and it buys the patience the security budget will need."
 ROM_public_housing:0 "Homes for the Young"
 ROM_public_housing_desc:0 "The National Housing Agency will build rental flats for young families in every county capital, with priority for soldiers, doctors and teachers. Construction jobs now, and a reason for young graduates to stay rather than leave for Madrid or Munich."
 ROM_ant_national_strategy:0 "The National Defence Strategy"
 ROM_ant_national_strategy_desc:0 "Every president presents a defence strategy to Parliament and nobody reads it. This one comes with numbers: a spending target, a reserve to rebuild and a list of industries the state will not let fail. Parliament must now decide how much it is willing to pay."
 ROM_lower_the_tax_burden:0 "Keep the Flat Tax"
 ROM_lower_the_tax_burden_desc:0 "Sixteen percent on income and profit has been the one constant of Romanian economic policy since 2005. Defending it against PSD's push for progressive taxation reassures investors and the foreign defence firms the Liberals want to bring in."
 ROM_capital_markets:0 "Upgrade the Bucharest Exchange"
 ROM_capital_markets_desc:0 "FTSE Russell has already moved Romania to secondary emerging market status. Listing more state companies and removing the remaining capital controls would bring pension funds from London and Frankfurt to Bucharest."
 ROM_coalition_rotation:0 "The Rotation Clause"
 ROM_coalition_rotation_desc:0 "The coalition agreement says the Prime Minister's office passes from one party to the other halfway through the term. The time has come, and the party that has to step aside is already looking for reasons not to."
 ROM_invest:0 "The Public Investment Drive"
 ROM_invest_desc:0 "Hospitals in Iasi, Cluj and Craiova, regional water networks and railways that can carry tanks as well as tourists: PSD's plan is to grow out of the deficit by building, and to build what a country under threat needs."
 ROM_ant_rebuild_the_state:0 "Rebuild the State"
 ROM_ant_rebuild_the_state_desc:0 "Thirty years of underfunding have left Romania with a state that writes good strategies and cannot deliver them. Antonescu's answer has three parts: an arsenal that produces, an administration that obeys, and a foreign policy that bargains."
 ROM_free_enterprise_romania:0 "The Entrepreneurs' Republic"
 ROM_free_enterprise_romania_desc:0 "Romania's IT firms, car-parts plants and farm exporters are the country's real success story. Cutting red tape for them, and opening defence supply chains to Romanian subcontractors, could do more for the strong state than any ministry."
 ROM_ant_arsenal_state:0 "Romarm Holding"
 ROM_ant_arsenal_state_desc:0 "Romarm's scattered plants become one state holding with a ten-year order book and managers chosen by competition, not by party. The Liberals want foreign partners inside it; PSD wants the jobs to stay Romanian. Both get something."
 ROM_social_pact:0 "The Social Pact"
 ROM_social_pact_desc:0 "Unions, employers and the government sign a five-year agreement on wages, pensions and investment, including the defence plants. For once Romanian politics produced a deal rather than a quarrel, and the security budget has the public's patience."
 ROM_ant_state_orders:0 "Ten-Year State Orders"
 ROM_ant_state_orders_desc:0 "Factories invest when they know what they will sell. Fixed ten-year orders for shells, powder, vehicles and drones give the Romanian defence industry something it has not had since 1989: certainty."
 ROM_ant_powder_works:0 "The Powder Works at Fagaras"
 ROM_ant_powder_works_desc:0 "Europe ran out of artillery shells in 2023 because it ran out of powder. Reopening the nitrocellulose lines at Fagaras and Victoria makes Romania one of the few European countries that can supply its own guns, and sell the surplus."
 ROM_ant_strategic_stockpile:0 "The Carpathian Stockpile"
 ROM_ant_strategic_stockpile_desc:0 "Fuel, munitions, medicine and grain stored in hardened depots inside the mountain arc, enough for ninety days of war without resupply. Expensive to build and expensive to rotate, and worth every leu on the day it is needed."
 ROM_ant_arms_exports:0 "Arms for Export"
 ROM_ant_arms_exports_desc:0 "Surplus shells and powder can earn the state money and friends. The question is who the buyers are, and how closely the government is willing to look at them."
 ROM_ant_mobilisation_law:0 "The Mobilisation Law"
 ROM_ant_mobilisation_law_desc:0 "A new law defines who can be called up, which factories switch to war production and how civilian vehicles and buildings can be requisitioned in a crisis. Drafting it calmly in peacetime is better than improvising it on the first day of a war."
 ROM_ant_administrative_state:0 "The Prefects Answer to Cotroceni"
 ROM_ant_administrative_state_desc:0 "Prefects have been party appointees who change with every government. Turning them into career officials of a single state administration, reporting to the Prime Minister and the CSAT secretariat, gives the centre eyes and hands in every county."
 ROM_ant_unified_registry:0 "One State Registry"
 ROM_ant_unified_registry_desc:0 "Population, property, vehicles, health and tax: one registry instead of forty incompatible databases. The state will finally know what it owns and who its citizens are. Civil-liberties groups ask who will watch the people who can see everything."
 ROM_ant_emergency_authority:0 "The National Emergency Authority"
 ROM_ant_emergency_authority_desc:0 "Floods, earthquakes, a pandemic and drones crashing on the Danube: the Department for Emergency Situations has handled them all with borrowed resources. A standing authority with its own budget and reserves makes crisis management a profession."
 ROM_ant_services_reform:0 "Reorganise the Services"
 ROM_ant_services_reform_desc:0 "Romania has more intelligence services than it can oversee. Merging the military and foreign services under one director, with a parliamentary committee that can actually read their budgets, makes them stronger and more accountable at the same time, if the second half is kept."
 ROM_ant_civil_defence:0 "Shelters and Sirens"
 ROM_ant_civil_defence_desc:0 "Most of Romania's public shelters date from the 1980s and many are now car parks or bars. Restoring them, installing modern warning systems and training volunteers in every town tells citizens the state takes their safety seriously."
 ROM_ant_state_that_works:0 "A State That Works"
 ROM_ant_state_that_works_desc:0 "Permits issued in weeks, prefects who answer the phone, emergency services that arrive. The administrative state is working, and Romanians notice that the strong state Antonescu promised is also, for the first time, a competent one."
 ROM_ant_strategic_state:0 "The Black Sea Strategy"
 ROM_ant_strategic_state_desc:0 "Romania is the largest NATO country on the Black Sea that does not control the Straits. Its strategy must be to make itself indispensable: to Washington as a base, to Ankara as a partner and to Warsaw as the southern half of the eastern flank."
 ROM_ant_ankara_channel:0 "The Ankara Channel"
 ROM_ant_ankara_channel_desc:0 "Turkey decides which warships enter the Black Sea and builds the drones Romania wants. A standing strategic dialogue, joint exercises and a share of drone production in Romania turn a difficult neighbour into a necessary partner."
 ROM_ant_warsaw_axis:0 "The Warsaw-Bucharest Axis"
 ROM_ant_warsaw_axis_desc:0 "Poland spends more on defence than any European ally and has the same fear of Moscow. Joint procurement, shared training areas and a common voice in NATO give the two flank countries the weight of a great power."
 ROM_ant_american_brigade:0 "A Permanent American Brigade"
 ROM_ant_american_brigade_desc:0 "American rotational troops come and go every nine months. Antonescu offers land, housing and a share of the cost in return for a permanent armoured brigade at Kogalniceanu, the kind of commitment that does not depend on the next election in Washington."
 ROM_ant_littoral_compact:0 "The Littoral Defence Compact"
 ROM_ant_littoral_compact_desc:0 "Romania, Bulgaria and Turkey patrol the western Black Sea together: shared radar pictures, coordinated mine clearance and a plan to keep the shipping lanes open if the war spreads to sea."
 ROM_ant_bucharest_format:0 "The Bucharest Format Summit"
 ROM_ant_bucharest_format_desc:0 "The Bucharest Nine was a Romanian-Polish idea from 2015. Hosting its first summit of heads of government with a permanent secretariat in Bucharest makes Romania the convenor of the eastern flank, not just one of its members."
 ROM_liberal_romania:0 "A Liberal Romania"
 ROM_liberal_romania_desc:0 "Investment-grade rating, a capital market that finances Romanian companies, and defence contractors from three continents competing for Romanian business. The Liberals have shown their model can pay for a strong state; the next election will show whether voters noticed."
 ROM_ant_guns_and_butter:0 "The Budget of 2028"
 ROM_ant_guns_and_butter_desc:0 "Three years of rising defence spending have reached the limit of what the budget and the public will bear. Pensioners, hospitals and the Ministry of Defence all present their bills on the same day."
 ROM_ant_constitutional_strong_state:0 "A Strong State Under the Constitution"
 ROM_ant_constitutional_strong_state_desc:0 "The President rejects every suggestion that the crisis requires extraordinary powers. The strong state will be built through Parliament, under the courts and in public. It is slower. It is also the only kind of strength that survives a change of government."
 ROM_ant_state_of_emergency:0 "Invoke the State of Emergency"
 ROM_ant_state_of_emergency_desc:0 "Drones over the Danube, sabotage at a refinery and a hybrid campaign the services cannot contain: some of the President's advisers argue that only emergency powers will do. The constitution allows thirty days, renewable by Parliament. Everyone knows how easily thirty days become a habit."
 ROM_ant_parliament_oversight:0 "Oversight of the Services"
 ROM_ant_parliament_oversight_desc:0 "A joint committee with cleared staff, the right to audit operations and a whistleblower channel. The services object, as services always do, and the public trusts them more afterwards."
 ROM_ant_defence_social_contract:0 "The Defence Social Contract"
 ROM_ant_defence_social_contract_desc:0 "Reservists keep their jobs and pensions when called up, defence plants pay union wages and every region with a military base receives a share of the investment. The security state is something citizens own, not something done to them."
 ROM_ant_rule_by_ordinance:0 "Government by Emergency Ordinance"
 ROM_ant_rule_by_ordinance_desc:0 "Budgets, procurement and appointments now move by ordinance. The machinery of state runs faster than it ever has, and Parliament discovers it is being informed rather than consulted."
 ROM_ant_total_defence:0 "The Total Defence Doctrine"
 ROM_ant_total_defence_desc:0 "Finland and Sweden taught Europe that defence is the business of the whole society. Romania adopts the model: every ministry with a wartime role, every company with a continuity plan, every citizen knowing where to go."
 ROM_ant_lift_emergency:0 "Lift the State of Emergency"
 ROM_ant_lift_emergency_desc:0 "The threat has been contained, and the President goes before Parliament to hand back the powers he was given. Some of his ministers think it is a mistake. History will probably remember it as the decision that mattered most."
 ROM_ant_permanent_emergency:0 "The Emergency Without End"
 ROM_ant_permanent_emergency_desc:0 "Parliament renews the emergency again, and then again. Each time the vote is easier. Romania keeps its elections, its courts and its newspapers, but the government no longer needs any of them to act."
 ROM_ant_the_strong_state:0 "The Strong State"
 ROM_ant_the_strong_state_desc:0 "Romania now has the state Antonescu promised: an arsenal that supplies its army, an administration that delivers and a voice that the allies listen to. Whether that state is also a free one was decided along the way."
 ROM_foreign_policy_review:0 "Between the Prut and the Black Sea"
 ROM_foreign_policy_review_desc:0 "Romania sits between a war to the north-east, a fragile Moldova and the Black Sea shipping lanes. Every president has to decide what to do with the country's position, and none can afford to ignore it."
 ROM_moldova_question:0 "The Moldovan Question"
 ROM_moldova_question_desc:0 "Chisinau is pro-European, poor and threatened from Transnistria. Its people speak Romanian and a third of them hold Romanian passports. Bucharest can help Moldova into the Union, or ask whether the border on the Prut still needs to exist at all."
 ROM_good_neighbours:0 "Good Neighbours on the Danube"
 ROM_good_neighbours_desc:0 "Hungary, Serbia and Bulgaria share six hundred kilometres of border with Romania and a century of grievances. A president who wants the country to lead its region has to settle with its neighbours first."
 ROM_eu_for_moldova:0 "Moldova's European Path"
 ROM_eu_for_moldova_desc:0 "Romania becomes Moldova's advocate in Brussels: screening chapters, energy interconnectors, Romanian teachers and doctors. Union, if it ever comes, would come inside the European Union rather than against it."
 ROM_moldova_referendum:0 "Propose the Union"
 ROM_moldova_referendum_desc:0 "The 1918 union lasted twenty-two years. Bucharest now offers Chisinau union by referendum on each bank of the Prut. Moldova may say no: many of its citizens fear losing their state, and Moscow will do everything to frighten the rest."
 ROM_budapest_settlement:0 "A Settlement with Budapest"
 ROM_budapest_settlement_desc:0 "Hungarian-language universities, bilingual signs in Szeklerland and a joint commission on minority rights, in return for Budapest's support on Schengen, energy and Moldova. Nationalists on both sides will cry betrayal; the Szeklers mostly want good roads."
 ROM_integrate_the_prut:0 "Bridges over the Prut"
 ROM_integrate_the_prut_desc:0 "New bridges, the Iasi-Ungheni-Chisinau gas pipeline and the Isaccea-Vulcanesti power line tie the two banks together, whatever the politicians decide. Infrastructure is the kind of union that outlasts governments."
 ROM_transnistrian_knot:0 "The Transnistrian Knot"
 ROM_transnistrian_knot_desc:0 "Since Russian gas stopped flowing in January 2025, the breakaway region on the Dniester has been freezing in the dark. A Russian garrison still guards its arsenal at Cobasna. If Moldova is now Romanian, the problem is Bucharest's; if not, Bucharest can help Chisinau carry it."
 ROM_iron_gates_partnership:0 "The Iron Gates Partnership"
 ROM_iron_gates_partnership_desc:0 "The two hydropower dams on the Danube were built jointly with Yugoslavia and are still run jointly with Serbia. Modernising them together, and settling the Timok Vlachs' language rights at the same table, turns an old border into a shared asset."
 ROM_danube_grain_corridor:0 "The Danube Grain Corridor"
 ROM_danube_grain_corridor_desc:0 "With Odesa under fire, Ukrainian grain reached the world through Izmail, Sulina and Constanta. Dredging the Sulina channel and widening the railway gauge interchange keeps that trade moving and earns Romania the gratitude of half the world's grain importers."
 ROM_black_sea_security_pact:0 "Black Sea Mine Countermeasures Group"
 ROM_black_sea_security_pact_desc:0 "Drifting mines from the war have sunk merchant ships off the Romanian coast. With Turkey controlling the Straits, only the three NATO littoral navies can clear them: Romania, Bulgaria and Turkey, working together."
 ROM_guarantee_ukraine:0 "Stand with Ukraine"
 ROM_guarantee_ukraine_desc:0 "Romania has trained Ukrainian F-16 pilots, sent a Patriot battery and hosted thousands of refugees. Committing to the end of the war, whatever it costs, makes Bucharest a front-line ally rather than a nervous neighbour."
 ROM_three_seas_alliance:0 "Host the Three Seas Initiative"
 ROM_three_seas_alliance_desc:0 "Twelve EU states between the Baltic, the Adriatic and the Black Sea fund roads, pipelines and power lines running north to south rather than east to west. Bucharest hosted its 2018 summit and can make Constanta the southern end of the network."
 ROM_guardian_of_the_black_sea:0 "Guardian of the Black Sea"
 ROM_guardian_of_the_black_sea_desc:0 "From the Prut to the Bosphorus approaches, Romania is now the anchor of the region rather than its frontier. Moldova looks to Bucharest, the grain moves, the mines are cleared and the allies have learned to call Romania first."
 ROM_fiscal_emergency:0 "The Nine-Percent Deficit"
 ROM_fiscal_emergency_desc:0 "Romania runs the largest budget deficit in the European Union. Whoever governs has to face the numbers before a ratings downgrade or a missed bond auction makes the decision for them."
 ROM_recovery_and_resilience:0 "Unlock the PNRR Funds"
 ROM_recovery_and_resilience_desc:0 "Romania's National Recovery and Resilience Plan is worth almost thirty billion euros, but the money arrives only against completed reforms. Missing milestones has already cost a billion. The money is there if Parliament passes the reforms tied to it."
 ROM_sovereign_investment_fund:0 "A Sovereign Development Fund"
 ROM_sovereign_investment_fund_desc:0 "If Brussels' money comes with conditions the government will not accept, Romanian money will have to do: dividends from state companies pooled into a national development fund. It is slower and costlier, but nobody else sets the terms."
 ROM_neptun_deep:0 "Neptun Deep"
 ROM_neptun_deep_desc:0 "OMV Petrom and Romgaz are drilling the largest natural gas field ever found in the EU's waters, a hundred and sixty kilometres off Constanta. From 2027 it will make Romania the Union's biggest gas producer."
 ROM_econ_land_registry:0 "Finish the Land Registry"
 ROM_econ_land_registry_desc:0 "Half of Romania's farmland is still not properly registered, thirty-five years after the collective farms were dissolved. Without clear titles nobody can borrow against land, consolidate plots or sell them honestly."
 ROM_a7_motorway:0 "The A7 Motorway"
 ROM_a7_motorway_desc:0 "Moldavia, the north-east of Romania, is the poorest region in the EU and still has no motorway connection to the rest of the country. The A7 from Ploiesti to Siret changes that, and it has military value too, since it runs along the eastern flank."
 ROM_econ_rail_revival:0 "Trains Faster Than Cars"
 ROM_econ_rail_revival_desc:0 "Romanian trains average less than fifty kilometres an hour. Electrifying and straightening the main lines to Constanta, Cluj and Timisoara would move freight and soldiers, as well as passengers who have long since given up on the railway."
 ROM_cluj_tech:0 "Cluj, Romania's Silicon Valley"
 ROM_cluj_tech_desc:0 "Romania has more IT engineers per head than almost anywhere in Europe, and they cluster in Cluj, Iasi and Timisoara. University spin-offs and tax incentives that stay put could keep them working in Romania rather than for remote clients abroad."
 ROM_cernavoda:0 "Cernavoda Units 3 and 4"
 ROM_cernavoda_desc:0 "Romania's only nuclear plant has run on Canadian CANDU reactors since 1996. Finishing the two reactors abandoned in the 1990s would double its output and anchor the region's grid for half a century."
 ROM_constanta_hub:0 "The Constanta Logistics Hub"
 ROM_constanta_hub_desc:0 "Constanta is the largest port on the Black Sea and the natural gateway to Central Europe along the Danube. New container terminals, rail links and Danube barge capacity would let it compete with the northern ports."
 ROM_econ_irrigation:0 "Water for the Baragan"
 ROM_econ_irrigation_desc:0 "The plains of Wallachia had one of the largest irrigation networks in Europe before 1989; most of it was looted for scrap. Droughts now cost farmers a harvest in every three years. Rebuilding the canals is the cheapest climate policy available."
 ROM_national_infrastructure:0 "Close the Infrastructure Gap"
 ROM_national_infrastructure_desc:0 "Railways with average speeds below fifty kilometres an hour and villages without running water are the real legacy of thirty years of waste. Close the gap and the rest of the economy follows."
 ROM_econ_semiconductors:0 "A Chip Design Centre"
 ROM_econ_semiconductors_desc:0 "Romania will not build a chip foundry, but it can design chips: automotive, defence and telecom engineers already do it for foreign firms. A national design centre under the European Chips Act keeps the intellectual property at home."
 ROM_energy_exporter:0 "Energy Exporter of the Balkans"
 ROM_energy_exporter_desc:0 "Gas from the Black Sea, nuclear power from Cernavoda and hydropower from the Iron Gates: Romania can sell energy to Moldova, Hungary, Serbia and Bulgaria and turn its neighbours' dependence into influence."
 ROM_econ_food_industry:0 "Process It Here"
 ROM_econ_food_industry_desc:0 "Romania exports raw wheat and maize and imports the bread, pasta and meat made from them. Mills, abattoirs and canneries near the farms keep the value, and the jobs, in the countryside."
 ROM_econ_consumer_growth:0 "Growth Model: Wages First"
 ROM_econ_consumer_growth_desc:0 "Raise the minimum wage, cut taxes on low incomes and let domestic demand pull the economy. Living standards rise quickly and the government stays popular. Factories and the defence budget will get what is left."
 ROM_econ_investment_growth:0 "Growth Model: Build for the Next Decade"
 ROM_econ_investment_growth_desc:0 "Hold wages and consumption back and pour the savings into factories, roads and research. The next five years will feel tight; the ten after them will be richer for it."
 ROM_econ_military_growth:0 "Growth Model: The Arsenal Economy"
 ROM_econ_military_growth_desc:0 "Defence spending as industrial policy: every leu spent on shells, vehicles and radars is spent in Romanian plants, with Romanian suppliers. It builds an industry; it does not build much else."
 ROM_econ_vocational_schools:0 "Vocational Schools Again"
 ROM_econ_vocational_schools_desc:0 "Employers cannot find welders, electricians or CNC operators, while a fifth of young Romanians neither work nor study. Dual training with real employers, as in Germany, fixes both problems at once."
 ROM_econ_guest_workers:0 "Workers from Asia"
 ROM_econ_guest_workers_desc:0 "Construction sites and hotels already run on workers from Nepal, Sri Lanka and Vietnam. A proper work-permit system, with housing standards and a route to residence, replaces the workers Romania lost to emigration. Not everyone is comfortable with it."
 ROM_econ_foreign_investment:0 "The Investment Agency"
 ROM_econ_foreign_investment_desc:0 "Romania abolished its investment agency in 2016 to save money. A new one, with a single contact person for every investor and a permit deadline enforced by law, brings the car-parts and electronics plants that went to Poland and Hungary instead."
 ROM_econ_strategic_industries:0 "The Strategic Industries Act"
 ROM_econ_strategic_industries_desc:0 "Steel at Galati, aluminium at Slatina, fertilisers, refineries and the defence plants: industries the state will not allow to close or be sold to hostile owners. Protecting them costs money; losing them would cost more in a war."
 ROM_econ_apuseni:0 "The Apuseni Question"
 ROM_econ_apuseni_desc:0 "Under the Apuseni mountains lie Europe's largest gold deposit at Rosia Montana, copper and the critical minerals the energy transition needs. The 2013 protests stopped a cyanide mine; the site is now UNESCO heritage. A modern, closed-loop mine for critical minerals elsewhere in the range would earn billions, and test the government's word on the environment."
 ROM_econ_offshore_wind:0 "Wind on the Black Sea"
 ROM_econ_offshore_wind_desc:0 "The shallow shelf off Dobrogea is one of the windiest sites in south-eastern Europe. Offshore farms connected through Constanta would let Romania keep exporting power after Neptun Deep's gas begins to decline."
 ROM_econ_regional_development:0 "Close the East-West Gap"
 ROM_econ_regional_development_desc:0 "Timisoara and Cluj live like Vienna's suburbs; Vaslui and Botosani like a different continent. Development agencies with real budgets, and universities in the poorer regions, can give young people a reason to stay in Moldavia."
 ROM_danube_tiger:0 "The Danube Tiger"
 ROM_danube_tiger_desc:0 "Poland showed the way; Romania has followed. With its finances repaired, its energy secured and its regions connected, the country is converging on the European average faster than anyone expected in 2025."
 ROM_econ_romania_2035:0 "Romania 2035"
 ROM_econ_romania_2035_desc:0 "A ten-year plan agreed across parties: what the country will build, train and produce until 2035, and how it will pay for it. Plans in Romania have usually been forgotten by the next election. This one has the institutions behind it."
 ROM_econ_convergence:0 "Convergence"
 ROM_econ_convergence_desc:0 "Romanian incomes, adjusted for prices, pass eighty percent of the European average. Thirty-five years after 1989, the country is no longer catching up; it is arriving."
 ROM_increase_our_spending_for_defence:0 "Three and a Half Percent"
 ROM_increase_our_spending_for_defence_desc:0 "At The Hague in 2025 the allies promised to spend 3.5 percent of GDP on core defence. For a country with a nine-percent deficit that pledge is very hard to keep, and failing to keep it costs credibility with the allies."
 ROM_romarm_revival:0 "Revive Romarm"
 ROM_romarm_revival_desc:0 "The state arms group's plants at Cugir, Sadu and Victoria have been decaying since the 1990s. Joint ventures with Rheinmetall and Hanwha can turn them back into factories that produce shells and powder in volume."
 ROM_army_joint_command:0 "A Joint Operational Command"
 ROM_army_joint_command_desc:0 "Romania's services still plan separately and meet at the top. A permanent joint headquarters, able to run land, air and sea operations from one room, is how modern armies fight."
 ROM_land_forces_modernisation:0 "Abrams and K9"
 ROM_land_forces_modernisation_desc:0 "Fifty-four American Abrams tanks and Korean K9 howitzers built partly in Romania will give the Land Forces their first modern armour since the Cold War."
 ROM_voluntary_service:0 "Voluntary Military Service"
 ROM_voluntary_service_desc:0 "Conscription ended in 2007. A paid four-month voluntary service for young Romanians would rebuild a trained reserve without reopening the debate about compulsory service."
 ROM_army_defence_university:0 "The Carol I Defence University"
 ROM_army_defence_university_desc:0 "Officers who learned their trade in Afghanistan and Iraq must now teach a generation that may face a high-intensity war in Europe. A new curriculum, war-gaming centre and exchange programme with Polish and American staff colleges."
 ROM_army_mass_reserve:0 "Force Model: A Nation in Arms"
 ROM_army_mass_reserve_desc:0 "Romania cannot afford an army of professionals large enough to hold its whole border. A large reserve of trained citizens, cheaply equipped and organised by county, can. The Finnish model, adapted to the Carpathians."
 ROM_army_professional_force:0 "Force Model: A Small Army of Professionals"
 ROM_army_professional_force_desc:0 "Fewer soldiers, better paid and better equipped, with the best kit the budget can buy and allies to make up the numbers. A force that wins the first battle, provided the war does not last too long."
 ROM_army_logistics:0 "Rail Gauges and Fuel Depots"
 ROM_army_logistics_desc:0 "Allied tanks arriving in Constanta still have to be unloaded and reloaded where Romanian rail meets the Moldovan gauge, and the army has fuel for days, not weeks. Logistics wins wars long before the shooting starts."
 ROM_army_territorial_defence:0 "Territorial Defence Battalions"
 ROM_army_territorial_defence_desc:0 "One battalion per county, raised from local reservists who know every road and bridge. They will not win a battle on their own, but they make an invasion slow and expensive everywhere at once."
 ROM_army_conscription_return:0 "The Return of Conscription"
 ROM_army_conscription_return_desc:0 "Voluntary service has produced too few reservists. Compulsory service of six months for men, and voluntarily for women, will fill the reserve, and divide the country in a debate nobody has wanted since 2007."
 ROM_army_rapid_reaction:0 "The Rapid Reaction Brigade"
 ROM_army_rapid_reaction_desc:0 "A fully manned, fully equipped brigade that can be anywhere on the border within forty-eight hours. Every other unit is measured against it."
 ROM_army_special_operations:0 "Special Operations Command"
 ROM_army_special_operations_desc:0 "Romania's special forces earned their reputation in Afghanistan. A joint command with its own aviation and intelligence turns a few elite units into a strategic tool."
 ROM_army_engineers:0 "Bridging the Danube"
 ROM_army_engineers_desc:0 "Only two bridges cross the Danube between Romania and Bulgaria, and a handful cross the Prut. Engineer brigades with modern bridging equipment make sure that a destroyed bridge is an inconvenience, not a catastrophe."
 ROM_focsani_line:0 "The Focsani Gate Defences"
 ROM_focsani_line_desc:0 "Every invasion of Wallachia from the north-east has come through the gap between the Carpathians and the Danube delta. Fortifying the Focsani-Namoloasa-Galati line again means making that approach too costly to attempt."
 ROM_army_drones:0 "Drone Battalions"
 ROM_army_drones_desc:0 "Ukraine rewrote the rules of land war with cheap drones. Every Romanian brigade receives a drone company, and Romanian firms are licensed to build the quadcopters and loitering munitions in volume."
 ROM_army_mechanisation:0 "Mechanise the Brigades"
 ROM_army_mechanisation_desc:0 "Half the army still rides to war in TAB armoured carriers designed in the 1970s. Replacing them is the most expensive single programme in the plan."
 ROM_army_massed_fires:0 "Massed Fires"
 ROM_army_massed_fires_desc:0 "Artillery and rockets did most of the killing in Ukraine. More K9 batteries, HIMARS launchers and the shells to keep them firing for months make Romanian artillery the backbone of its defence."
 ROM_army_anti_armour:0 "Anti-Armour Everywhere"
 ROM_army_anti_armour_desc:0 "Javelins, Spike missiles and home-made drones in every infantry platoon. A tank column that crosses the Prut should meet a missile at every turn of the road."
 ROM_army_romanian_ifv:0 "The Romanian Infantry Fighting Vehicle"
 ROM_army_romanian_ifv_desc:0 "The Lynx or the ASCOD, built under licence at Moreni with Romanian steel and Romanian electronics. Whoever wins the contract, the plant stays."
 ROM_army_mountain_troops:0 "The Mountain Hunters"
 ROM_army_mountain_troops_desc:0 "The Vanatori de Munte have defended the Carpathian passes since 1916. Two more brigades, winter equipment and a training centre in the Fagaras range make the mountains the army's strongest ally."
 ROM_army_carpathian_doctrine:0 "The Carpathian Doctrine"
 ROM_army_carpathian_doctrine_desc:0 "Trade space for time in Moldavia, hold the Focsani Gate and the mountain passes, and strike the enemy's flanks with drones, artillery and mobile reserves until the allies arrive. A doctrine written for Romania's own geography."
 ROM_army_tank_line:0 "A Romanian Tank Line"
 ROM_army_tank_line_desc:0 "With the IFV plant running, the next step is a main battle tank assembled in Romania. It will be expensive and slow, and it will make the Romanian army the strongest armoured force in the Balkans."
 ROM_eastern_flank_bastion:0 "Bastion of the Eastern Flank"
 ROM_eastern_flank_bastion_desc:0 "Romania's armed forces are no longer the junior partner on the Black Sea. They can hold the Focsani Gate, defend their own airspace and the Danube Delta, and receive allied reinforcements on bases the country built itself."
 ROM_army_2035:0 "The Army of 2035"
 ROM_army_2035_desc:0 "Networked brigades, a trained reserve, domestic production of almost everything the army fires or drives. The Land Forces Romania has wanted since 1990 finally exist."
 ROM_kogalniceanu:0 "The Kogalniceanu Air Base"
 ROM_kogalniceanu_desc:0 "The airfield near Constanta is becoming NATO's largest base in Europe, with room for ten thousand allied troops and their families. Romania pays for the land and the roads; the Alliance brings the presence that deters attack."
 ROM_air_flight_school:0 "The Fetesti Flight School"
 ROM_air_flight_school_desc:0 "Romania trained Ukrainian F-16 pilots at Fetesti with Lockheed and the Dutch. Making the European F-16 Training Centre permanent, and Romanian-run, gives the air force a pipeline of pilots and instructors."
 ROM_air_maintenance:0 "Keep Them Flying"
 ROM_air_maintenance_desc:0 "An aircraft on the ground waiting for parts is an aircraft the enemy does not have to shoot down. A national maintenance depot for the F-16 fleet at Bacau halves the time jets spend in the hangar."
 ROM_air_industry:0 "Aerostar and IAR"
 ROM_air_industry_desc:0 "Aerostar in Bacau maintains fighters for half of NATO's eastern members; IAR in Brasov built helicopters for forty years. Investment and licences can make them the core of a Romanian aviation industry again."
 ROM_air_doctrine_superiority:0 "Air Doctrine: Own the Sky"
 ROM_air_doctrine_superiority_desc:0 "The air force's first duty is to stop enemy aircraft and missiles reaching Romania. Every leu goes to fighters, pilots and air-to-air missiles."
 ROM_air_doctrine_strike:0 "Air Doctrine: Support the Army"
 ROM_air_doctrine_strike_desc:0 "Allies will provide most of the fighters; Romania's air force should hit the enemy's columns, depots and bridges and fly for the soldiers on the ground."
 ROM_air_doctrine_drones:0 "Air Doctrine: The Unmanned Air Arm"
 ROM_air_doctrine_drones_desc:0 "A fighter jet costs as much as a thousand drones. Romania can bet on what Ukraine and Turkey have shown: long-range drones, loitering munitions and the electronic warfare to protect them."
 ROM_f35_programme:0 "The F-35 Programme"
 ROM_f35_programme_desc:0 "Romania signed for thirty-two F-35s in late 2024 to replace the second-hand F-16s. A fifth-generation fleet would make the Romanian Air Force the most capable on the Black Sea, as long as Washington keeps approving the deliveries."
 ROM_air_radar_network:0 "Radars on the Carpathian Ridges"
 ROM_air_radar_network_desc:0 "Low-flying drones crossed the Danube undetected in 2023 because the radars could not see into the valleys. A network of new long-range and gap-filler radars covers the whole country."
 ROM_air_helicopters:0 "Helicopters from Brasov"
 ROM_air_helicopters_desc:0 "Black Hawks assembled at IAR Brasov for the army, the border police and the emergency services. Every transport and rescue helicopter in the country can be built and serviced at home."
 ROM_integrated_air_defence:0 "A Shield over the Carpathians"
 ROM_integrated_air_defence_desc:0 "Russian drones have already crashed on Romanian soil near the Danube. Patriot batteries, short-range air defence and the new radar network close the sky the country has been leaving open."
 ROM_air_tankers:0 "Tankers and Transports"
 ROM_air_tankers_desc:0 "Romania has no air refuelling and only a few transport aircraft. Joining the multinational tanker fleet and buying more C-390 transports lets the air force reach beyond its own borders."
 ROM_air_jet_trainer:0 "A Romanian Jet Trainer"
 ROM_air_jet_trainer_desc:0 "The IAR-99 Soim trained Romanian pilots for forty years. Its successor, designed with a European partner and built in Craiova, would be the first new Romanian aircraft since the 1980s."
 ROM_air_fighter_wing:0 "The Black Sea Fighter Wing"
 ROM_air_fighter_wing_desc:0 "Two full squadrons of fifth-generation fighters on permanent alert at Kogalniceanu and Campia Turzii. Nothing crosses Romanian airspace unannounced."
 ROM_air_strike_wing:0 "Precision Strike"
 ROM_air_strike_wing_desc:0 "Precision-guided bombs, long-range missiles and the targeting pods to use them. The air force can now destroy bridges and depots far behind any front line."
 ROM_air_loitering_munitions:0 "Loitering Munitions Industry"
 ROM_air_loitering_munitions_desc:0 "Romanian start-ups and Romarm build long-range drones and loitering munitions by the thousand. The cheapest air force in NATO may also turn out to be one of the most dangerous."
 ROM_air_hardened_bases:0 "Dispersed and Hardened Airfields"
 ROM_air_hardened_bases_desc:0 "Aircraft on a few big bases are targets. Hardened shelters, highway strips and dispersal airfields across Transylvania keep the air force alive after the first missile strike."
 ROM_air_next_generation:0 "Partner in a Next-Generation Fighter"
 ROM_air_next_generation_desc:0 "Europe is designing two sixth-generation fighters. A seat at the table, even a small one, gives Romanian industry work for thirty years and its air force a voice in what it will fly in 2045."
 ROM_naval_renewal:0 "Renew the Naval Forces"
 ROM_naval_renewal_desc:0 "The fleet relies on two ageing British frigates and mine hunters bought second hand. New ships from Galati and Mangalia would let Romania patrol its own exclusive economic zone, including Neptun Deep."
 ROM_navy_mangalia:0 "Reopen the Mangalia Yard"
 ROM_navy_mangalia_desc:0 "The Mangalia shipyard once built ships for half the world and spent the last decade in bankruptcy. Bought back by the state with a naval partner, it can build the corvettes and patrol ships Romania needs."
 ROM_navy_academy:0 "The Mircea cel Batran Academy"
 ROM_navy_academy_desc:0 "A navy with few ships still needs good officers. Exchanges with the Turkish and Italian navies and a new simulator centre at the naval academy in Constanta prepare them for ships Romania has not bought yet."
 ROM_navy_danube_flotilla:0 "The Danube Flotilla"
 ROM_navy_danube_flotilla_desc:0 "River monitors and patrol boats from Braila and Tulcea guard the Danube, the delta and the grain barges coming down from Izmail. Cheap, useful and very Romanian."
 ROM_navy_coastal_defence:0 "Naval Strategy: A Coastal Fortress"
 ROM_navy_coastal_defence_desc:0 "Romania will never fight a battle on the open sea. Missiles, mines and fast boats can make its coast impossible to approach, as Ukraine has shown."
 ROM_navy_commerce_protection:0 "Naval Strategy: Guard the Grain Lanes"
 ROM_navy_commerce_protection_desc:0 "Romania's prosperity sails out of Constanta. Corvettes, mine hunters and patrol aircraft that keep the shipping lanes open are worth more than any battleship."
 ROM_navy_submarine_arm:0 "Naval Strategy: Revive the Submarine Arm"
 ROM_navy_submarine_arm_desc:0 "The submarine Delfinul has not sailed since 1995. Three modern diesel submarines would give Romania a weapon that any hostile fleet in the Black Sea would have to respect."
 ROM_navy_surface_fleet:0 "Naval Strategy: A Surface Squadron"
 ROM_navy_surface_fleet_desc:0 "Frigates with real air defence and anti-ship missiles, able to escort convoys, contest the western Black Sea and sail with allied fleets. The most ambitious and most expensive choice."
 ROM_navy_mine_warfare:0 "Mine Countermeasures Squadron"
 ROM_navy_mine_warfare_desc:0 "Drifting mines have already sunk ships off Romania. Modern mine hunters and unmanned underwater drones clear the approaches to Constanta and Sulina."
 ROM_navy_aviation:0 "Naval Helicopters and Patrol Aircraft"
 ROM_navy_aviation_desc:0 "Helicopters on every frigate and maritime patrol aircraft over the sea: a navy that can see beyond the horizon can fight beyond it."
 ROM_navy_logistics:0 "Fuel and Repair at Constanta"
 ROM_navy_logistics_desc:0 "Fuel depots, a floating dock and a repair base at Constanta South let the fleet stay at sea for weeks rather than days, and let allied ships do the same."
 ROM_navy_coastal_missiles:0 "Anti-Ship Missile Batteries"
 ROM_navy_coastal_missiles_desc:0 "Naval Strike Missile batteries on mobile launchers along the Dobrogea coast cover the approaches out to two hundred kilometres. No hostile fleet can sit off Constanta any more."
 ROM_navy_corvettes:0 "Corvettes from Galati"
 ROM_navy_corvettes_desc:0 "Four multi-mission corvettes built at Galati: anti-submarine, anti-mine and escort duties in one hull. Small enough to afford, large enough to matter."
 ROM_navy_submarines:0 "Three Submarines"
 ROM_navy_submarines_desc:0 "Three air-independent submarines, crews trained in Germany and a refurbished base at Constanta. The Black Sea's most effective deterrent is the one nobody can see."
 ROM_navy_frigates:0 "Frigates for the Black Sea"
 ROM_navy_frigates_desc:0 "Four air-defence frigates replace the ageing ex-British ships. With them Romania can escort convoys, protect Neptun Deep and sail with allied task groups."
 ROM_navy_eez_patrol:0 "Guard the Exclusive Economic Zone"
 ROM_navy_eez_patrol_desc:0 "Neptun Deep's platforms, the undersea cables and the offshore wind farms are all targets. Permanent patrols, seabed sensors and drones protect the wealth that now lies under Romanian waters."
 ROM_navy_beyond_the_straits:0 "Beyond the Straits"
 ROM_navy_beyond_the_straits_desc:0 "Under the Montreux Convention Turkey can close the Straits to warships in time of war. With Ankara's goodwill, Romanian frigates could sail with allied fleets in the Mediterranean, the first Romanian warships there in decades."
 ROM_navy_fleet_2035:0 "The Fleet Plan 2035"
 ROM_navy_fleet_2035_desc:0 "A balanced fleet for Romania's sea: the right ships, the bases to keep them and the crews to sail them. Small by world standards, and the strongest the western Black Sea has seen."
 ROM_conservative_social_contract:0 "A Conservative Social Contract"
 ROM_conservative_social_contract_desc:0 "The Civic Compact has given us a foundation, but institutions alone cannot earn the public’s trust. By placing family, community, and responsibility at the heart of government, we can build a durable settlement between the state and its citizens."
 ROM_protect_romanian_energy:0 "Protect Romanian Energy"
 ROM_protect_romanian_energy_desc:0 "Romania's energy resources are a strategic asset. Investment in domestic production, modern infrastructure, and a secure national grid will reduce our vulnerability and support the industries on which prosperity depends."
 ROM_subside_in_practice:0 "Subsidiarity in Practice"
 ROM_subside_in_practice_desc:0 "Bucharest cannot solve every problem from behind a desk. County and local authorities must have the resources to address the needs they understand best, while the national government ensures that no region is left behind."
 ROM_the_crown_debate:0 "The Crown Debate"
 ROM_the_crown_debate_desc:0 "The question of the Crown has returned to public life. Some see the monarchy as a unifying symbol above party politics; others believe Romania’s republican institutions must remain the sole source of democratic legitimacy. The country must decide what place, if any, the Crown should hold."
 ROM_a_new_national_settlement:0 "A New National Settlement"
 ROM_a_new_national_settlement_desc:0 "The debate has ended, but the work of reconciliation is only beginning. Whether Romania renews its republican institutions or gives the Crown a new constitutional role, our political order must rest on public consent and the rule of law."
 ROM_its_not_done:0 "It's not done"
 ROM_its_not_done_desc:0 "There is one more thing missing, hint: Check the decisions tab after completing this focus."

 # ===== romania_uprise: The Second Revolution (generated by tools/gen) =====
 ROM_a_new_era:0 "The Morning After"
 ROM_a_new_era_desc:0 "The election was never held. Strikes in the oil fields and empty shelves in Cluj ended in the streets of Bucharest, and the government fled. Calin Georgescu speaks for the crowds, but crowds do not run ministries, and the people who can run them are already making demands."
 ROM_the_future_of_romania:0 "The Provisional Council"
 ROM_the_future_of_romania_desc:0 "Georgescu chairs a council of generals, bishops, union leaders and a representative of the Royal House. Each of them believes the revolution belongs to them. Each of the coming crises will show whose authority the country actually accepts.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_royal_appeal:0 "A Royal Appeal for Calm"
 ROM_royal_appeal_desc:0 "Margareta, Custodian of the Crown, has never spoken on politics. Tonight she addresses the nation from the Elisabeta Palace and asks Romanians to go home. If they listen, the monarchy will have shown that it still has authority."
 ROM_army_secures_bucharest:0 "The Army Secures Bucharest"
 ROM_army_secures_bucharest_desc:0 "General Gheorghita Vlad, Chief of the Defence Staff, offers to put troops at the ministries, the television centre and the airports. Nobody will be shot, he promises. Nobody will doubt who keeps order either."
 ROM_patriarchs_appeal:0 "The Patriarch's Appeal"
 ROM_patriarchs_appeal_desc:0 "The bells of every church in the country ring at noon, and Patriarch Daniel calls the faithful to prayer rather than to the barricades. In a country where the Church is trusted more than any politician, a call like that carries weight."
 ROM_crisis_treasury:0 "The Empty Treasury"
 ROM_crisis_treasury_desc:0 "Pensions are due on the fifteenth and the treasury cannot pay them. Foreign banks have stopped rolling over Romanian debt. Whoever finds the money will have a strong claim to decide how it is spent.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_crown_credit:0 "Credit on the Crown's Word"
 ROM_crown_credit_desc:0 "The Royal House has friends in London, Madrid and Brussels. A bridging loan guaranteed by its connections would keep the pensions paid, provided the new order looks respectable to the lenders."
 ROM_requisition:0 "Requisition Under Emergency Law"
 ROM_requisition_desc:0 "Fuel, grain and the state companies' cash reserves are placed under military administration. The pensions will be paid. Rights that had seemed permanent were suspended in an afternoon."
 ROM_parish_relief:0 "The Parish Relief Network"
 ROM_parish_relief_desc:0 "Fifteen thousand parishes already run soup kitchens, old people's homes and harvest collections. The Patriarchate offers to distribute state relief through them, which means the priests will decide who receives it."
 ROM_crisis_recognition:0 "The Question of Recognition"
 ROM_crisis_recognition_desc:0 "Embassies are asking whom they should deal with. The answer will decide whether Romania keeps its seat in the Alliance, its access to European markets and its friends in the Orthodox world.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_crown_reassures_europe:0 "The Crown Reassures Europe"
 ROM_crown_reassures_europe_desc:0 "A constitutional monarch is a familiar figure to Europe's governments. A tour of European capitals by the Royal House, with promises of elections and continuity, would make the revolution look like a restoration rather than a coup."
 ROM_assure_the_pentagon:0 "Assure the Pentagon"
 ROM_assure_the_pentagon_desc:0 "The generals call their American counterparts directly: Kogalniceanu stays open, Deveselu stays manned and Romania stays in the Alliance. Washington has accepted military governments before, provided they kept their commitments."
 ROM_orthodox_world:0 "The Orthodox World Takes Note"
 ROM_orthodox_world_desc:0 "Belgrade, Sofia, Athens and Tbilisi watch a revolution in which the Church took a leading part. Recognition from fellow Orthodox nations would give the new order a legitimacy that no Western ministry can grant it."
 ROM_the_settlement:0 "The Settlement of the Revolution"
 ROM_the_settlement_desc:0 "The Provisional Council cannot rule forever. One of the three powers that carried the country through the crisis will now take the state. Only one that has really built up its authority will be able to hold it.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_bring_back_monarchy:0 "Restore the Crown"
 ROM_bring_back_monarchy_desc:0 "Seventy-eight years after King Michael was forced to abdicate, the Council invites the Royal House back to power. Margareta becomes head of state as Custodian of the Crown, Georgescu steps aside, and the country waits to see whether the monarchy can do more than keep the peace."
 ROM_absolutist_restoration:0 "The Royal Proclamation"
 ROM_absolutist_restoration_desc:0 "From the balcony of the Royal Palace on Calea Victoriei the Custodian proclaims the restoration of the Kingdom of Romania. The proclamation leaves the most important question unanswered: whether the Crown will reign or rule."
 ROM_royal_treasury:0 "The Crown Domains"
 ROM_royal_treasury_desc:0 "Peles, Savarsin and the royal forests were returned after long court cases. Placed in a public trust, their revenues and the prestige behind them could secure the bridging loans the Crown arranged."
 ROM_danube_development:0 "The Royal Danube Company"
 ROM_danube_development_desc:0 "King Carol I built the Cernavoda bridge and the port of Constanta. A chartered company under royal patronage, financed by Western capital, would rebuild the Danube ports and the industry along the river."
 ROM_constitutional_reform:0 "Restore the 1923 Constitution"
 ROM_constitutional_reform_desc:0 "The constitution of Greater Romania gave the King the right to appoint governments and Parliament the power to bring them down. Restoring it, with free elections within two years, would make the Crown the guarantor of democracy rather than its replacement."
 ROM_royal_prerogative:0 "The Royal Prerogative"
 ROM_royal_prerogative_desc:0 "The revolution showed what elected politicians are worth. Some of the Custodian's advisers urge her to govern herself through a Crown Council and ministers of her own choosing. Western governments are alarmed, and many Romanians would welcome it."
 ROM_parliament_of_the_realm:0 "A Parliament of the Realm"
 ROM_parliament_of_the_realm_desc:0 "A new two-chamber Parliament is elected under the 1923 rules. The Crown keeps the right to dissolve it, but no longer the will to use that right lightly."
 ROM_free_press_act:0 "The Free Press Act"
 ROM_free_press_act_desc:0 "Newspapers and channels shut during the revolution reopen, and the Crown pledges never to license or censor them. Some will attack the monarchy, and that is the point: a Crown that tolerates criticism is harder to accuse of being a coup in fancy dress."
 ROM_reconciliation_commission:0 "The Reconciliation Commission"
 ROM_reconciliation_commission_desc:0 "Georgescu's supporters, the parties of the old republic and the officers who hesitated during the revolution all have reasons to fear the new order. A royal commission offers amnesty in return for testimony, and gives everyone a way back into public life."
 ROM_crown_council:0 "The Crown Council"
 ROM_crown_council_desc:0 "Generals, bishops, academics and industrialists chosen by the Custodian replace Parliament as the body that reviews laws. It works faster than the old Parliament ever did, and answers to nobody but the Crown."
 ROM_rule_by_decree:0 "Government by Royal Decree"
 ROM_rule_by_decree_desc:0 "Ordinances signed by the Crown and countersigned by a minister now have the force of law. Taxes, appointments and budgets no longer wait for anyone's approval."
 ROM_royal_guard:0 "The Royal Guard"
 ROM_royal_guard_desc:0 "A ceremonial regiment becomes the Crown's own force, recruited from loyal officers and the gendarmerie. If the generals ever change their minds about the restoration, the palace will not be defenceless."
 ROM_royal_diplomacy:0 "The Royal Houses of Europe"
 ROM_royal_diplomacy_desc:0 "Romania's royal family is related to most of the reigning houses of Europe. Royal visits to London, Madrid, The Hague and Stockholm can open doors that would stay closed to a provisional government."
 ROM_prut_union:0 "A Crown for Both Banks"
 ROM_prut_union_desc:0 "In 1918 Bessarabia chose union with the Kingdom of Romania, not with any republic. The Crown can offer Moldova a personal union with wide autonomy, its own parliament and the Prut as an internal boundary. Chisinau may still refuse."
 ROM_army_of_the_crown:0 "The King's Commission"
 ROM_army_of_the_crown_desc:0 "Officers will once again swear loyalty to the Crown as well as to the country. The generals who backed the restoration will be rewarded, and a few who did not will be retired."
 ROM_carpathian_line:0 "The Carpathian Line"
 ROM_carpathian_line_desc:0 "The mountains have defended Romania for centuries. Fortified passes, mountain brigades and supply depots in the inner arc would turn Transylvania into a fortress if the outer provinces ever fell."
 ROM_a_kingdom_reborn:0 "The Coronation at Alba Iulia"
 ROM_a_kingdom_reborn_desc:0 "King Ferdinand and Queen Marie were crowned at Alba Iulia in 1922 to mark the union of all Romanians. A coronation in the same cathedral would close the circle the Crown opened when it returned."
 ROM_one_crown_one_nation:0 "One Crown, One Nation"
 ROM_one_crown_one_nation_desc:0 "The Kingdom of Romania has been restored. The monarchy is no longer a relic of the past, and the restoration is no longer an experiment. Whether it reigns as a constitutional crown or rules as the nation's guardian, it is accepted by the country."
 ROM_a_military_rule:0 "The Generals Take Power"
 ROM_a_military_rule_desc:0 "The officers who kept the streets quiet decide that only they can keep them that way. General Gheorghita Vlad heads a National Defence Committee. Georgescu is thanked for his services and placed under guard at his villa."
 ROM_autocratic_regime:0 "Decree No. 1: State of Emergency"
 ROM_autocratic_regime_desc:0 "Curfew from ten at night, parties suspended, the press under review. The Committee promises that the emergency is temporary, as every military government does, and it will have to keep that promise before the country trusts it."
 ROM_supreme_defence_council:0 "Rule by the CSAT"
 ROM_supreme_defence_council_desc:0 "The Supreme Council of National Defence was designed to coordinate the services in wartime. The junta turns it into the government itself, with ministers reduced to administrators who carry out its decisions."
 ROM_reorganise_secret_police:0 "Bring the SRI to Heel"
 ROM_reorganise_secret_police_desc:0 "The Romanian Intelligence Service knows every politician's secrets. Placing it under military command removes the one institution that could plot against the junta, and gives the junta the means to plot against everyone else."
 ROM_restore_civil_order:0 "Lift the Curfew"
 ROM_restore_civil_order_desc:0 "The streets are quiet and the factories are working. Lifting the state of emergency would show that the junta is a government rather than an occupation, and the officers who enjoy their new powers will not thank the Committee for it."
 ROM_return_to_the_barracks:0 "Return to the Barracks"
 ROM_return_to_the_barracks_desc:0 "Greek, Turkish and Portuguese generals all handed power back eventually, some with honour and some without. Vlad can announce elections, a new constitution and the army's return to its proper role, on condition that the next government leaves the officers alone."
 ROM_the_iron_government:0 "The Iron Government"
 ROM_the_iron_government_desc:0 "There will be no elections. The Committee becomes a permanent Directorate, the emergency laws become ordinary statutes, and Romania gets the kind of government it last had in the 1940s."
 ROM_war_economy:0 "The Defence Production Act"
 ROM_war_economy_desc:0 "Every factory that can make shells, vehicles or uniforms receives an order and an officer to make sure it is fulfilled. Civilian production will have to wait."
 ROM_heavy_industry_drive:0 "Romarm Under Military Command"
 ROM_heavy_industry_drive_desc:0 "The arsenal at Cugir and the powder works at Fagaras and Victoria come under army management. Contracts that took years to sign under civilian governments are now settled in days."
 ROM_labour_conscription:0 "Labour Battalions"
 ROM_labour_conscription_desc:0 "Young men who fail the medical are not sent home. They are drafted into construction battalions to build the roads, depots and airfields the army needs."
 ROM_strategic_reserves:0 "Strategic Reserves"
 ROM_strategic_reserves_desc:0 "Fuel, munitions and grain are stockpiled in Carpathian depots for a war that may never come. The army plans to be ready if it does."
 ROM_greater_romania_war_plans:0 "Plan Prut"
 ROM_greater_romania_war_plans_desc:0 "Staff officers have spent their careers planning for an attack from the east. The junta asks them a different question: what would it take to move east instead?"
 ROM_moldovan_campaign:0 "The Chisinau Ultimatum"
 ROM_moldovan_campaign_desc:0 "The Committee offers Moldova union with guarantees for its institutions and officers. The offer is polite, but the divisions massing on the Prut make the alternative clear."
 ROM_dniester_operation:0 "Operation Dniester"
 ROM_dniester_operation_desc:0 "Fifteen hundred Russian soldiers guard the largest ammunition dump in Europe at Cobasna, in a breakaway region that has been without gas since January. The generals believe a short, sharp operation could end the Transnistrian problem for good."
 ROM_crossing_the_prut:0 "The Army of the Prut"
 ROM_crossing_the_prut_desc:0 "The Second and Fourth Army Corps are reorganised into a single eastern command with its own logistics, air cover and bridging units. Whatever happens on the Prut, Romania will no longer have to improvise."
 ROM_the_iron_marshals:0 "The Marshals' Legacy"
 ROM_the_iron_marshals_desc:0 "Whether the generals hand power back or keep it, Romania now has the army they promised. The army can mobilise in days, supply itself and fight on the Prut. The question of who governs Romania has been settled, for this generation at least."
 ROM_the_orthodox_state:0 "The Patriarchal Regency"
 ROM_the_orthodox_state_desc:0 "The Church kept the country fed and calm during the revolution, and the Council turns to it for leadership. Patriarch Daniel accepts the regency reluctantly, and Georgescu, whose speeches were full of faith and soil, becomes its lay spokesman."
 ROM_fundamentalist_state:0 "Proclaim the Symphonia"
 ROM_fundamentalist_state_desc:0 "In Byzantine tradition the Church and the Emperor were two hands of one body. The regency proclaims that the Romanian state and the Romanian Church will work in the same harmony. The proclamation does not yet say which of them will lead."
 ROM_the_peasant_state:0 "The Village Restored"
 ROM_the_peasant_state_desc:0 "Georgescu always said that Romania's future lay in its villages, its soil and its smallholders. The regency makes it policy: land for young farmers, protected local markets and a priest, a teacher and a doctor in every commune."
 ROM_parish_cooperatives:0 "Parish Cooperatives"
 ROM_parish_cooperatives_desc:0 "Dairies, mills and canneries owned by parish cooperatives give villages something to sell and a reason for young people to stay. They also give the Church an economic network that reaches every county."
 ROM_monastic_revival:0 "The Monasteries of Moldavia"
 ROM_monastic_revival_desc:0 "The painted monasteries of Bukovina and the hermitages of the Carpathians are already pilgrimage sites. Funding them as centres of learning, healing and tourism turns heritage into something the whole country can share."
 ROM_rebuild_the_cathedrals:0 "The People's Salvation Cathedral"
 ROM_rebuild_the_cathedrals_desc:0 "The largest Orthodox cathedral in the world stands next to Ceausescu's palace, its interior still unfinished. Completing it would give the regency a symbol to match the old regime's monument next door."
 ROM_church_and_state:0 "Byzantine Symphonia"
 ROM_church_and_state_desc:0 "The Church guides and the state governs. Civil laws stay civil, minorities keep their schools, and the regency promises to give way to an elected government once the nation has recovered morally. Bishops become advisers rather than rulers."
 ROM_against_the_heterodox:0 "The Guardians of Orthodoxy"
 ROM_against_the_heterodox_desc:0 "The hardliners in the Holy Synod want more than harmony. Neo-Protestant sects, secular schools and foreign NGOs would all be brought under control, and the Hungarian Catholic and Reformed churches of Transylvania would become a source of suspicion."
 ROM_ecumenical_ties:0 "Friends at the Phanar"
 ROM_ecumenical_ties_desc:0 "Bucharest's relations with the Ecumenical Patriarchate in Istanbul have long been a quiet counterweight to Moscow's claims over Orthodox Christendom. Strengthening them gives the regency allies in Constantinople, Athens and Kyiv."
 ROM_religious_education:0 "Catechism in Every Classroom"
 ROM_religious_education_desc:0 "Religion classes stop being optional and the curriculum is rewritten by the Synod. Teachers who object are moved to other work."
 ROM_national_awakening:0 "The National Awakening"
 ROM_national_awakening_desc:0 "The regency has begun to change the country it governs. Churches are full, the villages are busier than they have been in decades, and politics is conducted in the language of duty rather than interest. Not everyone welcomes it, but very few can ignore it."
 ROM_orthodox_brotherhood:0 "The Orthodox Concord"
 ROM_orthodox_brotherhood_desc:0 "The regency proposes a standing council of Orthodox nations from Belgrade to Tbilisi, covering culture, education and mutual help. It is not an alliance, at least not yet, but it gives Bucharest influence in every Orthodox capital."
 ROM_gathering_of_moldova:0 "The Metropolis of Bessarabia"
 ROM_gathering_of_moldova_desc:0 "Moldova's churches are split between a Moscow-led Metropolis and the Romanian Metropolis of Bessarabia, and parishes have been changing sides since 2022. Backing the Romanian Metropolis with money and priests prepares the ground for a union the Church believes was always meant to be."
 ROM_serbian_brethren:0 "Brothers in Belgrade and Sofia"
 ROM_serbian_brethren_desc:0 "Serbs and Bulgarians are Orthodox neighbours, not enemies. Guaranteeing their independence and settling the Timok and Dobruja minority questions by agreement turns old border quarrels into goodwill."
 ROM_territorial_militia:0 "Brotherhoods of the Parish"
 ROM_territorial_militia_desc:0 "Every parish keeps a roll of men who will defend their village if called. They are trained by reservists, blessed by their priests and armed from army stocks."
 ROM_holy_romania:0 "Holy Romania"
 ROM_holy_romania_desc:0 "The Church took over a country in revolution and has given it a new direction. Whether that becomes a lasting harmony or a narrow fortress of faith depends on choices already made, but nobody now doubts that the Church shapes Romania's public life."
 ROM_crown_royal_carpathians:0 "The Royal Carpathians"
 ROM_crown_royal_carpathians_desc:0 "Peles, Pelisor, the hunting lodges of Sinaia and the royal estates of the Apuseni: the monarchy's heritage becomes the core of a tourism and conservation trust that employs whole valleys."
 ROM_crown_investment_bank:0 "The Royal Investment Bank"
 ROM_crown_investment_bank_desc:0 "Capital raised in London and Madrid on the strength of the Crown's name, lent to Romanian industry at long maturities. The bank answers to a board of bankers, not to the palace, which is precisely why foreign money trusts it."
 ROM_crown_royal_academies:0 "The Royal Academies"
 ROM_crown_royal_academies_desc:0 "The Royal Foundation of Carol I once ran the best libraries and scholarships in the Balkans. Reviving its endowments for universities, music and science gives the restoration a cultural purpose beyond ceremony."
 ROM_crown_order_of_the_star:0 "The Order of the Star of Romania"
 ROM_crown_order_of_the_star_desc:0 "Honours, titles and the right to wear the Star in public: the Crown rewards loyalty without spending money. A court forms around the palace, and with it the oldest temptations of monarchy."
 ROM_crown_royal_air_arm:0 "The Royal Air Arm"
 ROM_crown_royal_air_arm_desc:0 "King Carol II founded an air force and an aircraft industry in the 1930s. The restored Crown gives its pilots royal colours, a new training wing at Bacau and the first priority in the defence budget after the mountain troops."
 ROM_crown_danube_squadron:0 "The King Ferdinand Squadron"
 ROM_crown_danube_squadron_desc:0 "The frigate Regele Ferdinand gives its name to a squadron that patrols the Danube delta and the coast of Dobrogea. Small, but royal, and seen by every tourist in Constanta."
 ROM_crown_royal_army_reform:0 "The Royal Army of 2030"
 ROM_crown_royal_army_reform_desc:0 "Mountain brigades on the passes, an air arm over the plains and a squadron on the coast, all under officers sworn to the Crown. The Kingdom can defend itself again."
 ROM_crown_heir:0 "The Question of the Heir"
 ROM_crown_heir_desc:0 "Every restoration eventually faces the question that destroyed the last one: who comes next. The Custodian has no children, and the Royal House has quarrelled publicly over the succession before. It must be settled while the Crown is still strong."
 ROM_crown_jubilee:0 "A Jubilee of the Constitution"
 ROM_crown_jubilee_desc:0 "On the anniversary of the restored constitution the Crown opens Parliament in person and promises that the monarchy will never again rule where it should reign. Free elections, a free press and a King or Queen above politics: Romania has become a modern constitutional monarchy."
 ROM_crown_guardian_monarchy:0 "The Guardian Crown"
 ROM_crown_guardian_monarchy_desc:0 "The Crown has governed through its council for years and the country has grown used to it. The prerogative becomes permanent, with the Crown Council as the true government of the Kingdom. Western governments call it what it is."
 ROM_crown_both_banks:0 "King of Both Banks"
 ROM_crown_both_banks_desc:0 "With Moldova united to the Kingdom, the monarch is crowned a second time in Chisinau's cathedral as sovereign of Bessarabia, as the union of 1918 intended."
 ROM_crown_kingdom_2035:0 "The Kingdom of 2035"
 ROM_crown_kingdom_2035_desc:0 "Ten years after the revolution, the restored Kingdom has its own bank, its own army and an heir. Whether it reigns or rules, the monarchy is once again the oldest living institution of the Romanian state."
 ROM_junta_arms_exports:0 "Arms for Hard Currency"
 ROM_junta_arms_exports_desc:0 "The depots are full and the treasury is not. Shells and rifles from Cugir sell well in a world at war, and the generals are not inclined to ask too many questions about the buyers."
 ROM_junta_drone_corps:0 "The Drone Corps"
 ROM_junta_drone_corps_desc:0 "Officers back from observing the Ukrainian front say the next war will be fought by drones. The junta creates a separate corps for them, with its own factories and its own budget."
 ROM_junta_air_mobility:0 "Air Mobility Command"
 ROM_junta_air_mobility_desc:0 "Helicopters and transport aircraft that can move a brigade from Bucharest to the Prut in a night. The generals have learned that whoever arrives first decides what happens next."
 ROM_junta_army_charter:0 "The Army's Charter"
 ROM_junta_army_charter_desc:0 "The price of handing back power: a constitutional charter that guarantees the army's budget, forbids prosecutions for the revolution and gives the Chief of the Defence Staff a seat on every security body."
 ROM_junta_directorate:0 "The Permanent Directorate"
 ROM_junta_directorate_desc:0 "Five generals, one civilian secretary and no expiry date. The Directorate replaces the Committee and adopts the language of permanence: five-year plans, a national anthem for the armed forces and a portrait in every office."
 ROM_junta_civilian_handover:0 "The First Civilian Budget"
 ROM_junta_civilian_handover_desc:0 "For the first time since the revolution an elected Finance Minister writes the defence budget. The generals grumble, then accept it. That acceptance is worth more than any victory the army could have won."
 ROM_junta_national_service:0 "Universal National Service"
 ROM_junta_national_service_desc:0 "Every young Romanian, man or woman, serves a year: in the army, the gendarmerie or the labour battalions. The Directorate calls it the school of the nation."
 ROM_junta_succession:0 "Who Commands the Committee?"
 ROM_junta_succession_desc:0 "General Vlad is tired and his colleagues know it. The army must decide how its leadership is renewed without the coups and counter-coups that ended every junta before it."
 ROM_junta_modern_army:0 "The 2030 Army Plan"
 ROM_junta_modern_army_desc:0 "Drones, air mobility, a trained reserve and the factories to supply them. Whatever kind of government Romania now has, its army is the most capable in the Balkans."
 ROM_junta_black_sea_command:0 "Black Sea Joint Command"
 ROM_junta_black_sea_command_desc:0 "Under a civilian government the army's new prestige finds a useful outlet: a joint command for the coast, the delta and the shipping lanes, open to allied officers."
 ROM_junta_regional_power:0 "The Balkan Arbiter"
 ROM_junta_regional_power_desc:0 "The Directorate offers its neighbours security guarantees, arms on credit and mediation in their quarrels, always on Bucharest's terms. Nobody in the region can now ignore what the Romanian generals think."
 ROM_junta_nation_under_arms:0 "A Nation Under Arms"
 ROM_junta_nation_under_arms_desc:0 "A decade after the revolution, the Romanian army has either given the country back to its citizens with honour, or kept it and made it a fortress. Either way, every Romanian now knows the soldier's trade."
 ROM_church_parish_schools:0 "Parish Schools"
 ROM_church_parish_schools_desc:0 "Village schools closed for lack of pupils reopen as parish schools, with state teachers and the priest as caretaker. They keep children in the countryside; secular parents worry about what else they teach."
 ROM_church_pilgrim_roads:0 "The Pilgrim Roads"
 ROM_church_pilgrim_roads_desc:0 "Roads, guesthouses and trains linking the painted monasteries, the Carpathian hermitages and the Cathedral of the Nation bring pilgrims and tourists from across the Orthodox world."
 ROM_church_cooperative_bank:0 "The Cooperative Bank"
 ROM_church_cooperative_bank_desc:0 "The parish cooperatives pool their savings into a bank that lends to farmers and small workshops the commercial banks ignore. It is audited by laymen, at the Synod's own insistence."
 ROM_church_minority_charter:0 "The Charter of Historic Churches"
 ROM_church_minority_charter_desc:0 "Catholics, Reformed, Lutherans, Jews and Muslims receive a charter guaranteeing their schools, property and worship. Symphonia, the regency declares, is a harmony and not a monopoly."
 ROM_church_morality_code:0 "The Code of Public Morals"
 ROM_church_morality_code_desc:0 "The hardliners write a code for broadcasters, schools and public life. It is popular in the villages and resented in the cities; universities lose staff to Vienna and Berlin, and the minorities feel watched."
 ROM_church_bessarabian_synod:0 "The Synod of Both Banks"
 ROM_church_bessarabian_synod_desc:0 "If Moldova has joined Romania, the two Orthodox jurisdictions on the Prut can finally become one. If it has not, the Romanian Metropolis of Bessarabia receives every resource the regency can spare."
 ROM_church_relief_corps:0 "The Orthodox Relief Corps"
 ROM_church_relief_corps_desc:0 "Volunteers from the parish brotherhoods carry food, medicine and generators to war zones and disaster areas across the Orthodox world. Gratitude travels further than any embassy."
 ROM_church_orthodox_league:0 "The Orthodox League"
 ROM_church_orthodox_league_desc:0 "The Concord becomes a league: consultations before every major decision, joint relief and a promise that no member will stand idle if another is attacked."
 ROM_church_succession:0 "The Patriarchal Succession"
 ROM_church_succession_desc:0 "Patriarch Daniel has governed Church and state for years, and his health is failing. The Holy Synod meets to elect his successor, and with him the future of the regency."
 ROM_church_return_to_laymen:0 "Return the State to Laymen"
 ROM_church_return_to_laymen_desc:0 "The new Patriarch keeps the regency's promise: elections, a civilian government and a Church that advises rather than rules. Romania remains devout; it is no longer governed from the Patriarchate."
 ROM_church_holy_synod_governs:0 "The Holy Synod Governs"
 ROM_church_holy_synod_governs_desc:0 "The new Patriarch sees no reason to hand back what the Church has built. The Synod becomes a permanent council of state, and bishops sit in every ministry. Many Romanians welcome it; many others start looking for jobs abroad."
 ROM_church_covenant_nation:0 "A Covenant Nation"
 ROM_church_covenant_nation_desc:0 "A decade after the revolution the Church has shaped a generation: its schools, its banks, its league of nations. Whether it now rules or merely blesses, Romania's public life will carry its mark for a century."

 # ===== romania_dracula: The Snagov Files (generated by tools/gen) =====
 ROM_drac_the_snagov_files:0 "The Snagov Files"
 ROM_drac_the_snagov_files_desc:0 "Nobody voted for this. A caretaker president, a handful of SRI officers and three archaeologists sworn to secrecy have postponed an election to find out what was walled up under an island monastery in 1476. Officially, Snagov is closed for structural repairs."
 ROM_drac_the_crypt:0 "What Lay Under the Altar"
 ROM_drac_the_crypt_desc:0 "Behind a wall of Wallachian brick the team finds a stone coffin, empty, its lid carved on the inside. The inscription is in Church Slavonic and reads, in the translation the archaeologists are not supposed to discuss: 'Not dead. Waiting.'"
 ROM_drac_national_archives:0 "The Sealed Fonds"
 ROM_drac_national_archives_desc:0 "The National Archives hold collections sealed by the communist state and never reopened. One of them, catalogued only as 'Fond V', has a reading register with exactly four signatures since 1948."
 ROM_drac_ottoman_registers:0 "The Ottoman Registers"
 ROM_drac_ottoman_registers_desc:0 "Vlad spent his youth as a hostage at the Ottoman court. Istanbul's archives record who visited him, what he was taught, and one entry nobody has ever explained: a payment to a Persian physician 'for the prince's long sleep'."
 ROM_drac_securitate_file:0 "Securitate File 'Dragonul'"
 ROM_drac_securitate_file_desc:0 "In 1976, for the five-hundredth anniversary of Vlad's death, Ceausescu's secret police opened an investigation of their own. The file stops abruptly in 1977 with a single page: the order to seal the island and transfer every officer involved."
 ROM_drac_monk_chronicle:0 "The Chronicle of Brother Paisie"
 ROM_drac_monk_chronicle_desc:0 "A sixteenth-century monk of Snagov kept a private chronicle, written in a cipher the Securitate never broke. Romanian cryptographers, working with a borrowed supercomputer, break it in six weeks. Brother Paisie describes the burial in detail, and what the monks did to make sure the grave stayed closed."
 ROM_drac_heritage_commission:0 "A Commission of Heritage"
 ROM_drac_heritage_commission_desc:0 "A legal cover for everything that follows: a national heritage commission with emergency powers to close sites, requisition laboratories and classify finds. Its chairman is an SRI general who has never studied history."
 ROM_drac_poenari_survey:0 "The Survey at Poenari"
 ROM_drac_poenari_survey_desc:0 "The ruined fortress above the Arges gorge was Vlad's own stronghold. Under its foundations, ground radar shows a second set of walls, older and deeper, and a shaft going down into the mountain."
 ROM_drac_comana_survey:0 "The Graves of Comana"
 ROM_drac_comana_survey_desc:0 "Comana monastery was founded by Vlad in 1461, and some historians always believed he was buried there rather than at Snagov. They were half right: the grave at Comana is real, and it was opened from the inside."
 ROM_drac_magurele_lab:0 "The Laboratory at Magurele"
 ROM_drac_magurele_lab_desc:0 "Samples from Snagov and Comana go to the national physics laboratories at Magurele, where Europe's most powerful laser was built. The bone fragments are five hundred years old. The cells inside them are not dead."
 ROM_drac_the_brotherhood:0 "The Brotherhood of the Dragon"
 ROM_drac_the_brotherhood_desc:0 "The Order of the Dragon was founded in 1408 and supposedly dissolved within a century. Its Romanian branch never was. Its members are judges, bankers and a retired metropolitan bishop, and they have been expecting this call for five hundred years."
 ROM_drac_unit_zero:0 "SRI Unit Zero"
 ROM_drac_unit_zero_desc:0 "A unit that does not appear in any budget, staffed by officers chosen for their discretion and their lack of family. It guards the sites, watches the Brotherhood and reports only to the interim president."
 ROM_drac_the_old_families:0 "The Old Boyar Families"
 ROM_drac_the_old_families_desc:0 "The Craiovesti, the Basarabs' distant cousins, a dozen families who kept their land through the Ottomans, the Habsburgs and even the communists. Their grandparents swore an oath their grandchildren still remember."
 ROM_drac_trust_the_brotherhood:0 "Trust the Brotherhood?"
 ROM_drac_trust_the_brotherhood_desc:0 "The Brotherhood offers everything: its archives, its money and its knowledge of the rites. In return it asks for a seat in every decision that follows. Unit Zero advises against it. Unit Zero does not know what the Brotherhood knows."
 ROM_drac_legacy_revealed:0 "The Legacy Revealed"
 ROM_drac_legacy_revealed_desc:0 "The archives, the laboratory and the Brotherhood all say the same impossible thing. Vlad III of Wallachia did not die in 1476. He was put to sleep by people who feared him, in a place built to keep him there, and the seal has been failing for fifty years."
 ROM_drac_theory_science:0 "The Scientific Hypothesis"
 ROM_drac_theory_science_desc:0 "The cells from Magurele are alive, dormant and different. The scientists believe the Voivode's condition is biological: an unknown mechanism of preservation that medicine could reverse, and perhaps one day reproduce."
 ROM_drac_the_parties_ask:0 "The Parties Ask Questions"
 ROM_drac_the_parties_ask_desc:0 "The rerun has been postponed for a year 'on grounds of national security'. Every party leader in Parliament now demands to know what those grounds are."
 ROM_drac_theory_occult:0 "The Occult Hypothesis"
 ROM_drac_theory_occult_desc:0 "The Brotherhood says the scientists are looking at shadows. The Voivode was bound by a rite and only a rite can unbind him: the old words, the seven relics and forty nights of vigil. Nobody in the room laughs."
 ROM_drac_expedition_istanbul:0 "The Topkapi Expedition"
 ROM_drac_expedition_istanbul_desc:0 "A Romanian 'cultural delegation' spends a month in the Topkapi archives. It brings home photographs of a sealed Ottoman report, written in 1477, explaining why the Sultan's men never brought Vlad's body to Constantinople."
 ROM_drac_expedition_naples:0 "The Tomb in Naples"
 ROM_drac_expedition_naples_desc:0 "A legend says Vlad's daughter took him to Naples and buried him in Santa Maria la Nova. The legend is wrong about the body. It is right about the daughter, whose letters are still in a Neapolitan family's attic."
 ROM_drac_chindia_tower:0 "The Chindia Tower"
 ROM_drac_chindia_tower_desc:0 "Under the watchtower of Vlad's court at Targoviste the excavators find a reliquary built into the foundations, and inside it something that was once a heart and is beating very slowly."
 ROM_drac_postpone_indefinitely:0 "Postpone the Rerun Indefinitely"
 ROM_drac_postpone_indefinitely_desc:0 "The Constitutional Court has been told enough to agree. The rerun is postponed until the 'security emergency' ends, and the interim government becomes, for practical purposes, the only government Romania has."
 ROM_drac_sighisoara:0 "The House in Sighisoara"
 ROM_drac_sighisoara_desc:0 "The house where Vlad was born is a restaurant for tourists. Its cellar is not. The Brotherhood has known about the cellar since 1700 and kept a lamp burning there ever since."
 ROM_drac_the_cave:0 "The Cave Below Poenari"
 ROM_drac_the_cave_desc:0 "The shaft under Poenari opens into a cave system that does not appear on any geological survey. The air in it is warm. The geologists who mapped the first kilometre refuse to go further."
 ROM_drac_the_heart:0 "The Heart in the Reliquary"
 ROM_drac_the_heart_desc:0 "With the heart from Targoviste and the letters from Naples, the picture is complete: the body was hidden in the mountain, the heart was kept apart so that he could not wake. Bring them together and the sleep ends."
 ROM_drac_vanishings:0 "The Arges Vanishings"
 ROM_drac_vanishings_desc:0 "Shepherds below Poenari stop coming down for market. A team of geologists does not come back from the cave. The army seals the valley, and the foreign press finds out within a week."
 ROM_drac_the_dragon_seal:0 "The Dragon Seal"
 ROM_drac_the_dragon_seal_desc:0 "In the cellar at Sighisoara and the deepest chamber of the cave the Brotherhood finds the two halves of a bronze seal: the dragon of the Order, coiled around a cross. The seal is the key to the place where he sleeps."
 ROM_drac_where_he_sleeps:0 "Where He Sleeps"
 ROM_drac_where_he_sleeps_desc:0 "Four hundred metres inside the mountain under Poenari, behind a door that answers to the Dragon Seal, lies a chamber of black stone. In it lies a man of perhaps forty-five, uncorrupted, with his hands folded on a sword. The search is over."
 ROM_drac_project_voievod:0 "Project Voievod"
 ROM_drac_project_voievod_desc:0 "The decision is taken in a room with no windows: Romania will attempt to wake him. The project gets a name, a budget nobody will audit and a deadline nobody dares to set. From here on, the preparation of the rite is the only thing that matters."
 ROM_drac_facility_poenari:0 "The Facility Under Poenari"
 ROM_drac_facility_poenari_desc:0 "A concrete complex grows inside the mountain: generators, laboratories, barracks for the guards and a single sealed chamber at its centre. The construction workers are told it is a nuclear shelter."
 ROM_drac_black_budget:0 "The Black Budget"
 ROM_drac_black_budget_desc:0 "Billions disappear from the defence, health and infrastructure budgets into accounts controlled by Unit Zero. The Court of Accounts is told not to look. It does not need to be told twice."
 ROM_drac_native_earth:0 "Earth from Wallachia"
 ROM_drac_native_earth_desc:0 "Every account agrees on one detail: he must lie in his own soil. Lorries carry earth from Targoviste, from the field of Valea Alba and from the walls of Poenari into the mountain at night."
 ROM_drac_sci_genome:0 "The Genome That Should Not Exist"
 ROM_drac_sci_genome_desc:0 "Sequencing at Magurele shows a human genome with forty genes nobody has ever seen. Some resemble those of hibernating animals. Others resemble nothing at all."
 ROM_drac_sci_revival_medicine:0 "Revival Medicine"
 ROM_drac_sci_revival_medicine_desc:0 "The scientists believe they can restart the cells with blood, oxygen and a sequence of electrical stimuli derived from the genome. They need donors, and they need a great deal of blood."
 ROM_drac_bolojans_choice:0 "The Interim President's Choice"
 ROM_drac_bolojans_choice_desc:0 "The caretaker president has signed every order so far. Now he is told what the orders are for. His answer will decide whether the project keeps a constitutional face or becomes the government itself."
 ROM_drac_occ_rite:0 "The Rite of the Brotherhood"
 ROM_drac_occ_rite_desc:0 "The Brotherhood's rite is written in a book that has never left its keeper's house. It requires a priest, a sword and words in a language older than Church Slavonic. The retired metropolitan agrees to speak them."
 ROM_drac_occ_relics:0 "The Seven Relics"
 ROM_drac_occ_relics_desc:0 "A ring, a sword, a book, a crown, a cup, a cloak and the Dragon Seal. Four are in Romanian museums, one is in Vienna, one in Budapest and one in a private collection in Geneva. Not all of their owners will sell."
 ROM_drac_accidents:0 "Accidents in the Valley"
 ROM_drac_accidents_desc:0 "A guard is found drained and alive, smiling, unable to say what happened. Two technicians walk out of the mountain one night and are never seen again. Something in the chamber is already awake enough to be hungry."
 ROM_drac_sci_first_trial:0 "The First Trial"
 ROM_drac_sci_first_trial_desc:0 "The stimulation sequence is tested on the heart from Targoviste. It beats normally for eleven seconds, and every light in the facility flickers in time with it."
 ROM_drac_occ_vigil:0 "The Forty Nights"
 ROM_drac_occ_vigil_desc:0 "For forty nights twelve members of the Brotherhood keep vigil in the chamber in shifts, reading the rite aloud. On the thirty-first night the body's hands are found in a different position."
 ROM_drac_all_prepared:0 "All Is Prepared"
 ROM_drac_all_prepared_desc:0 "The chamber is ready, the heart is in its place, the earth is laid and the words, or the sequence, are known. Nothing is left to prepare except the courage to begin."
 ROM_drac_the_night_chosen:0 "The Night Is Chosen"
 ROM_drac_the_night_chosen_desc:0 "The scientists want a date when the grid can be isolated; the Brotherhood wants the night of Saint Andrew, when the old calendar says the dead walk. For once they agree."
 ROM_drac_resurrection:0 "The Night at Poenari"
 ROM_drac_resurrection_desc:0 "At eleven minutes past midnight every light in Wallachia goes out. In the chamber under Poenari a man sits up, looks at the people around him and asks, in fifteenth-century Romanian, how long he has slept. Then he asks who rules his country now."
 ROM_drac_first_audience:0 "The First Audience"
 ROM_drac_first_audience_desc:0 "The ministers of the interim government are brought to the mountain one at a time. Each is offered a chair. The Voivode remains standing. He wants to know what they are willing to do for him, and he can tell when they are lying."
 ROM_drac_envoys:0 "The Voivode Receives the Ambassadors"
 ROM_drac_envoys_desc:0 "Ambassadors are invited to Cotroceni after dark. He receives them in courtly Latin, asks after their sovereigns and lets them leave. Most send reports home recommending caution; one asks to be recalled."
 ROM_drac_dissolve_interim:0 "The Interim Government Dissolves"
 ROM_drac_dissolve_interim_desc:0 "The caretaker cabinet resigns in a body and transfers its powers to 'the Voivode of Wallachia and of all the Romanian lands'. Parliament is not consulted. Nobody in it volunteers to object."
 ROM_drac_night_economy:0 "An Economy That Works by Night"
 ROM_drac_night_economy_desc:0 "The Voivode does not keep office hours. Neither, increasingly, does Romania: ministries, factories and courts move their main shifts to the evening, when he can attend."
 ROM_drac_eyes_in_the_dark:0 "Eyes in the Dark"
 ROM_drac_eyes_in_the_dark_desc:0 "Unit Zero becomes the Voivode's own service. Its officers no longer need wiretaps: those who have drunk from the Voivode see what he wishes them to see, wherever they are."
 ROM_drac_daylight_resistance:0 "The Resistance of the Daylight"
 ROM_drac_daylight_resistance_desc:0 "Students in Cluj, priests in Moldavia and officers who refused the oath begin to organise. They call themselves the Daylight. They meet at noon, because he cannot."
 ROM_drac_old_debts:0 "Old Debts in Istanbul"
 ROM_drac_old_debts_desc:0 "The Voivode remembers the Sultan's court as if it were yesterday, because for him it was. Ankara receives a letter in Ottoman Turkish demanding an apology for 1442. The Turkish government does not know whether to laugh."
 ROM_drac_eastern_approaches:0 "Approaches from the East"
 ROM_drac_eastern_approaches_desc:0 "Moscow, alone among the great powers, sends a delegation with an offer: recognition, gas and grain, in return for neutrality on the northern front. The Voivode has dealt with empires before."
 ROM_drac_voivodal_order:0 "The Voivodal Order"
 ROM_drac_voivodal_order_desc:0 "The Brotherhood becomes the state party: a hierarchy of vassals bound by personal oath, each answerable for a county, a ministry or a regiment. Membership is by invitation, and refusing an invitation is unwise."
 ROM_drac_voivodes_justice:0 "The Voivode's Justice"
 ROM_drac_voivodes_justice_desc:0 "His justice is the stuff of legend: a golden cup left at a well in Targoviste that nobody dared steal. Thieves, bribe-takers and traitors are now judged at night, in public, by a ruler who cannot be bribed."
 ROM_drac_boyar_estates:0 "The Boyar Estates Restored"
 ROM_drac_boyar_estates_desc:0 "The old families receive back the land the communists took, and a great deal of land they never owned. In return they feed the cities and garrison the countryside."
 ROM_drac_apuseni_mines:0 "The Old Mines of the Apuseni"
 ROM_drac_apuseni_mines_desc:0 "The Voivode remembers where the Saxons mined silver and the Dacians gold. Old shafts are reopened with new machinery, and some of the miners return with stories about what lives in the deepest galleries."
 ROM_drac_night_messengers:0 "The Night Messengers"
 ROM_drac_night_messengers_desc:0 "Bats in their thousands roost under the eaves of every barracks and ministry. Messages that once needed encryption now arrive by wing."
 ROM_drac_carpathian_wolves:0 "The Wolves of the Carpathians"
 ROM_drac_carpathian_wolves_desc:0 "Wolf packs follow army patrols in the mountains and guard the passes at night. Shepherds who lose sheep are compensated, generously and without questions."
 ROM_drac_church_question:0 "The Church and the Voivode"
 ROM_drac_church_question_desc:0 "Vlad was a pious founder of monasteries. The Church he finds is uncertain whether to bless him or exorcise him. The Holy Synod is divided, and the Patriarch has asked for an audience."
 ROM_drac_partisans_of_dawn:0 "The Partisans of Dawn"
 ROM_drac_partisans_of_dawn_desc:0 "The Daylight takes up arms: sabotage at depots, attacks on members of the Order, radio broadcasts at noon. The Voivode must decide how he answers, and Romania will remember the answer."
 ROM_drac_neighbours_take_fright:0 "The Neighbours Take Fright"
 ROM_drac_neighbours_take_fright_desc:0 "Hungary, Bulgaria, Serbia and Ukraine reinforce their borders with Romania. Their soldiers are issued silver-tipped ammunition, officially as a joke."
 ROM_drac_oath_of_fealty:0 "The Oath of Fealty"
 ROM_drac_oath_of_fealty_desc:0 "Every official, officer and judge is summoned to swear fealty in person. The Voivode looks each of them in the eye. Some do not come out of the audience the same."
 ROM_drac_forges_of_targoviste:0 "The Forges of Targoviste"
 ROM_drac_forges_of_targoviste_desc:0 "The arsenal towns of Wallachia work through the night. The Voivode inspects the production lines himself and has firm views about pikes, which his engineers translate into firm views about bayonets and drones."
 ROM_drac_thralls_abroad:0 "Thralls Abroad"
 ROM_drac_thralls_abroad_desc:0 "Diplomats, journalists and businessmen who visited Bucharest return home changed, loyal to a man they cannot describe. They make excellent sources."
 ROM_drac_last_daylight_party:0 "The Last Daylight Party"
 ROM_drac_last_daylight_party_desc:0 "Whether by mercy or by terror, the open resistance is over. A few thousand Romanians are in exile, a few hundred in hiding. The rest have made their peace with the night."
 ROM_drac_the_dominion:0 "The Dominion Proclaimed"
 ROM_drac_the_dominion_desc:0 "From the balcony of the Royal Palace the Voivode proclaims the Dominion of Wallachia, Moldavia and Transylvania, the three lands Michael the Brave united for a single year in 1600. This time, he says, the union will last as long as he does."
 ROM_drac_the_host:0 "The Voivode's Host"
 ROM_drac_the_host_desc:0 "The Voivode reviews the Romanian army and is unimpressed by everything except the artillery. He will keep the army, he decides, and build another beside it."
 ROM_drac_strigoi_companies:0 "The Strigoi Companies"
 ROM_drac_strigoi_companies_desc:0 "Volunteers from Unit Zero drink from the Voivode and become something else: faster, stronger, untiring after dark and badly burned by the sun. There are only a few hundred of them, and they are kept for the night."
 ROM_drac_laboratory_nine:0 "Laboratory Nine Militarised"
 ROM_drac_laboratory_nine_desc:0 "What Magurele learned while waking him, it now learns to use. The laboratory under Poenari becomes a military research centre with a budget larger than the universities'."
 ROM_drac_the_swarms:0 "The Swarms"
 ROM_drac_the_swarms_desc:0 "Clouds of bats, guided by the Voivode's will, blind enemy radars and foul drone propellers. Air force officers find them more reliable than the electronic warfare pods they replaced."
 ROM_drac_night_legion:0 "The Night Legion"
 ROM_drac_night_legion_desc:0 "Ordinary soldiers who swear the blood oath gain some of the strigoi's gifts and fewer of their weaknesses. Whole divisions now march only after sunset and arrive before dawn."
 ROM_drac_flesh_like_iron:0 "Flesh Like Iron"
 ROM_drac_flesh_like_iron_desc:0 "Wounds that would kill a man close in an hour. Field hospitals of the Host treat their patients with a transfusion and a night's rest."
 ROM_drac_regeneration_serum:0 "The Regeneration Serum"
 ROM_drac_regeneration_serum_desc:0 "A diluted version of what runs in the Voivode's veins, stable for a week outside the body. Enough to bring a wounded soldier back to the line, and enough to make him crave more."
 ROM_drac_darksight:0 "Eyes That See in Darkness"
 ROM_drac_darksight_desc:0 "Soldiers of the Host see at night as others see at noon, and the Voivode's commanders plan every operation for the dark hours."
 ROM_drac_night_operations:0 "Operations by Night"
 ROM_drac_night_operations_desc:0 "Raids across borders, enemy officers who wake to find a message on their pillow, depots that burn without anyone seeing the arsonist. The Host's special operations have no equal anywhere."
 ROM_drac_crewless_ships:0 "Ships Without Crews"
 ROM_drac_crewless_ships_desc:0 "Old hulls in Mangalia are recommissioned and put to sea with skeleton crews who never seem to sleep. Fishermen report ships on the Black Sea at night with no lights and no one visible on deck."
 ROM_drac_vanguard_of_poenari:0 "The Vanguard of Poenari"
 ROM_drac_vanguard_of_poenari_desc:0 "The strigoi companies and the Night Legion are combined into a single striking force under the Voivode's personal command. He has not led an army into battle for five hundred and fifty years. He has forgotten nothing."
 ROM_drac_the_mist:0 "The Mist over the Danube"
 ROM_drac_the_mist_desc:0 "On the Voivode's command a fog rises from the Danube and the Prut and lies over the borders for days. Enemy reconnaissance sees nothing; Romanian soldiers see everything."
 ROM_drac_black_sea_storm:0 "The Black Sea Storm"
 ROM_drac_black_sea_storm_desc:0 "Storms rise from a calm sea when hostile ships approach the Romanian coast, and subside when they turn away. Insurers in London have stopped covering voyages to Constanta."
 ROM_drac_the_price:0 "The Price of the Host"
 ROM_drac_the_price_desc:0 "The Host is fed by Romania: its young men, its blood banks and its fear. Villages near the barracks are emptying. The Voivode's advisers present him with the bill, and with the reports from abroad."
 ROM_drac_host_ready:0 "The Host Is Ready"
 ROM_drac_host_ready_desc:0 "The Voivode's Host is complete: an army that fights by night, heals by morning and fears nothing that the modern world has made. Whatever he decides to do with it, Romania is now the most dangerous country in Europe."
 ROM_drac_the_world_notices:0 "The World Notices"
 ROM_drac_the_world_notices_desc:0 "A conference of the great powers meets behind closed doors to discuss 'the Romanian situation'. Sanctions are agreed in an afternoon; a common answer to what Romania has become is not agreed at all."
 ROM_drac_answer_the_conference:0 "Answer the Conference"
 ROM_drac_answer_the_conference_desc:0 "The Voivode writes to every head of state personally, by hand, in their own language. He wants nothing from them, he says, but the lands that were his. Some of them believe it."
 ROM_drac_spy_war:0 "The Spy War"
 ROM_drac_spy_war_desc:0 "Foreign services pour officers into Romania. Few come back, and those who do report to their governments in a strangely soothing tone."
 ROM_drac_ultimatums:0 "The Ultimatums"
 ROM_drac_ultimatums_desc:0 "Letters go to Chisinau, Sofia and Budapest, written in the style of the fifteenth century and delivered at midnight. Each lists the lands the Voivode once held or claimed, and the date by which they are to be returned."
 ROM_drac_pacts_at_midnight:0 "Pacts Signed at Midnight"
 ROM_drac_pacts_at_midnight_desc:0 "Non-aggression treaties with the countries that would rather not find out what the Host can do. They are signed at midnight, in Cotroceni, and the ink is not quite red."
 ROM_drac_balkan_sphere:0 "A Sphere in the Balkans"
 ROM_drac_balkan_sphere_desc:0 "Belgrade and Sofia are offered protection, grain and electricity. In exchange their governments are expected to consult Bucharest. Neither has the strength to refuse openly."
 ROM_drac_turned_agents:0 "Turned Agents"
 ROM_drac_turned_agents_desc:0 "The foreign officers who came to watch now report to Bucharest. The conference's plans arrive at Cotroceni before they reach the governments that wrote them."
 ROM_drac_break_the_cordon:0 "Break the Cordon"
 ROM_drac_break_the_cordon_desc:0 "Sanctions leak through Moscow, the Gulf and a dozen shell companies in Cyprus. The cordon around Romania remains on paper; in practice the trucks keep coming."
 ROM_drac_bessarabia_first:0 "Bessarabia First"
 ROM_drac_bessarabia_first_desc:0 "Moldova was his cousin Stephen's land, and the Voivode considers it family business. The Host gathers on the Prut."
 ROM_drac_across_the_danube:0 "Across the Danube"
 ROM_drac_across_the_danube_desc:0 "Vlad crossed the frozen Danube in the winter of 1462 and burned the Ottoman garrisons from Silistra to the sea. Bulgaria now holds those banks."
 ROM_drac_coalition_of_daylight:0 "The Coalition of Daylight"
 ROM_drac_coalition_of_daylight_desc:0 "The governments that met in conference now meet as a coalition. Their communique promises to 'contain and, if necessary, end' the Dominion. Some of their armies are already moving."
 ROM_drac_what_he_wants:0 "What Does the Voivode Want?"
 ROM_drac_what_he_wants_desc:0 "He has his country, his Host and the world's attention. His advisers ask him, carefully, what comes next. For a long time he does not answer."
 ROM_drac_end_empire:0 "Endgame: The Empire of the Night"
 ROM_drac_end_empire_desc:0 "He will take back everything that was his and some things that were not. The Dominion becomes an empire, and the empire will be defended by night against everyone who comes by day."
 ROM_drac_end_transfiguration:0 "Endgame: The Transfigured Nation"
 ROM_drac_end_transfiguration_desc:0 "Why rule a nation of mortals? With Laboratory Nine's serum and the blood oath, the Voivode offers Romanians long life, health and the night. Not all of them accept. Those who do will outlive everyone who refused."
 ROM_drac_end_long_night:0 "Endgame: The Long Night Abroad"
 ROM_drac_end_long_night_desc:0 "Conquest is crude. The thralls abroad, the turned agents and the grateful ministers of half a dozen governments give him what armies could not: a quiet hand on the decisions of Europe."
 ROM_drac_end_dawn_accord:0 "Endgame: The Dawn Accord"
 ROM_drac_end_dawn_accord_desc:0 "The Voivode has seen enough of war for several lifetimes. He offers the coalition a treaty: his dominion kept within its borders, his Host kept at home, and a guarantee sworn in blood. It is signed at Bran, at sunrise, which he attends from behind a curtain."
 ROM_drac_crown_of_the_dragon:0 "The Crown of the Dragon"
 ROM_drac_crown_of_the_dragon_desc:0 "A crown forged from the iron of Poenari's gate is placed on his head in Targoviste. Every land that ever paid him tribute is declared part of the empire, and every army that wants it back will have to come and take it."
 ROM_drac_the_long_life:0 "The Long Life"
 ROM_drac_the_long_life_desc:0 "A generation of Romanians who have taken the oath will not age. The country's demographic collapse is reversed in a decade, and its people no longer go out by day."
 ROM_drac_courts_everywhere:0 "A Court in Every Capital"
 ROM_drac_courts_everywhere_desc:0 "In Vienna, Belgrade and Athens there are now salons where ministers meet after midnight and leave with new opinions. The Voivode rules one country and advises a dozen."
 ROM_drac_warden_of_the_carpathians:0 "Warden of the Carpathians"
 ROM_drac_warden_of_the_carpathians_desc:0 "Under the accord the Host guards the mountains and nothing more, and the world, slowly, gets used to a neighbour it cannot understand. Romania trades again, its students travel again, and the nights are quiet."
 ROM_drac_the_last_door:0 "The Last Door Under Snagov"
 ROM_drac_the_last_door_desc:0 "There was a second chamber under the island, the one the archaeologists never opened, because the Brotherhood told them not to. The Voivode has been visiting it alone, every night, for a year. Tonight he invites his councillors to come with him."
 romania_elections:0 "The Republic Decides"
 romania_uprise:0 "The Romanian Uprise Focus Tree"
 romania_dracula:0 "The Snagov Files"

 # ===== National spirits =====
 ROM_austerity_idea:0 "The Fiscal Package"
 ROM_austerity_idea_desc:0 "VAT up, wages frozen, hiring stopped. The numbers will improve before the mood does."
 ROM_austerity_softened_idea:0 "A Negotiated Package"
 ROM_austerity_softened_idea_desc:0 "The unions won some concessions and the budget lost some savings."
 ROM_fiscal_discipline_idea:0 "Fiscal Discipline"
 ROM_fiscal_discipline_idea_desc:0 "The deficit procedure is suspended and Romania can borrow cheaply again."
 ROM_reformed_government_idea:0 "A Leaner State"
 ROM_reformed_government_idea_desc:0 "Fewer ministries, fewer agencies, fewer sinecures."
 ROM_reconciliation_idea:0 "Turning the Page"
 ROM_reconciliation_idea_desc:0 "The government has chosen not to reopen the wounds of 2024."
 ROM_interference_exposed_idea:0 "Hardened Against Interference"
 ROM_interference_exposed_idea_desc:0 "The networks behind 2024 have been exposed and the services know what to look for."
 ROM_anti_corruption_idea:0 "The DNA Restored"
 ROM_anti_corruption_idea_desc:0 "Prosecutors are independent again and public contracts are scrutinised."
 ROM_civic_compact_idea:0 "The Civic Compact"
 ROM_civic_compact_idea_desc:0 "A cross-party agreement on schools, hospitals and digital public services."
 ROM_presidential_movement_idea:0 "The President's Movement"
 ROM_presidential_movement_idea_desc:0 "Independent mayors and civic groups now organise around the presidency."
 ROM_republic_of_merit_idea:0 "The Republic of Merit"
 ROM_republic_of_merit_idea_desc:0 "Competence, not the party card, now decides careers in the Romanian state."
 ROM_digital_state_idea:0 "The Digital State"
 ROM_digital_state_idea_desc:0 "Most dealings with the state now take minutes and a phone."
 ROM_cyber_shield_idea:0 "The Cyber Shield"
 ROM_cyber_shield_idea_desc:0 "A civilian directorate protects the grid, the hospitals and the vote."
 ROM_prosecutors_charter_idea:0 "The Prosecutors' Charter"
 ROM_prosecutors_charter_idea_desc:0 "Prosecutors answer to the law, not to the Justice Minister."
 ROM_oecd_member_idea:0 "OECD Member"
 ROM_oecd_member_idea_desc:0 "Romania has joined the club of the advanced economies."
 ROM_erm_discipline_idea:0 "Waiting Room of the Euro"
 ROM_erm_discipline_idea_desc:0 "Two years of discipline in the exchange-rate mechanism."
 ROM_eurozone_idea:0 "Member of the Eurozone"
 ROM_eurozone_idea_desc:0 "The leu has been retired. Romania borrows at German rates."
 ROM_rural_doctors_idea:0 "Doctors for the Villages"
 ROM_rural_doctors_idea_desc:0 "Every commune has a family doctor again."
 ROM_europe_core_idea:0 "At Europe's Core"
 ROM_europe_core_idea_desc:0 "Romania helps decide where Europe goes."
 ROM_eu_funds_frozen_idea:0 "EU Funds Suspended"
 ROM_eu_funds_frozen_idea_desc:0 "The Commission has frozen cohesion and recovery money under the rule-of-law conditionality mechanism."
 ROM_romania_first_idea:0 "Romania First"
 ROM_romania_first_idea_desc:0 "Cheaper food, protected farmers and farmland in Romanian hands."
 ROM_diaspora_return_idea:0 "The Homecoming"
 ROM_diaspora_return_idea_desc:0 "Romanians who left in the 2000s are beginning to return."
 ROM_purged_institutions_idea:0 "A Captured State"
 ROM_purged_institutions_idea_desc:0 "The courts and services answer to the President's men now. Nobody is sure who answers to the law."
 ROM_flank_leverage_idea:0 "Leverage on the Flank"
 ROM_flank_leverage_idea_desc:0 "Romania hosts the allies and makes sure it is paid for it."
 ROM_alliance_pariah_idea:0 "Pariah of the Alliance"
 ROM_alliance_pariah_idea_desc:0 "Romania has made territorial demands on an ally at war. Its partners no longer trust it."
 ROM_sovereign_romania_idea:0 "A Sovereign Romania"
 ROM_sovereign_romania_idea_desc:0 "A nationalist government that stayed inside the West and still delivered."
 ROM_greater_romania_idea:0 "Greater Romania"
 ROM_greater_romania_idea_desc:0 "The borders of 1918 are now state doctrine. The neighbours are arming."
 ROM_farmers_charter_idea:0 "The Farmers' Charter"
 ROM_farmers_charter_idea_desc:0 "Simple rules and a fair price for the smallholder."
 ROM_national_curriculum_idea:0 "The National Curriculum"
 ROM_national_curriculum_idea_desc:0 "Union, poets and resistance at the centre of every school day."
 ROM_sim_line_moderate_idea:0 "The Strasbourg Line"
 ROM_sim_line_moderate_idea_desc:0 "The moderates write the programme: sovereignty inside the West."
 ROM_sim_line_radical_idea:0 "The Line of the Squares"
 ROM_sim_line_radical_idea_desc:0 "The radicals write the programme: the revolution of 2024 completed."
 ROM_sim_line_machine_idea:0 "The Line of the Counties"
 ROM_sim_line_machine_idea_desc:0 "The organisers write the programme: jobs, posts and order."
 ROM_sovereignty_mandate_idea:0 "The Sovereignty Mandate"
 ROM_sovereignty_mandate_idea_desc:0 "The people have spoken, and the President governs in their name."
 ROM_referendum_defeat_idea:0 "The Referendum Defeat"
 ROM_referendum_defeat_idea_desc:0 "The movement asked the country for everything and was refused."
 ROM_party_state_idea:0 "The Party of the Nation"
 ROM_party_state_idea_desc:0 "A party card opens every door in Romania."
 ROM_movement_endures_idea:0 "The Movement Endures"
 ROM_movement_endures_idea_desc:0 "It has outlived the slogans that built it."
 ROM_union_pact_idea:0 "The Grand Coalition"
 ROM_union_pact_idea_desc:0 "Two old rivals sharing one government, for now."
 ROM_welfare_state_idea:0 "Pensions Before Deficits"
 ROM_welfare_state_idea_desc:0 "The pension increase was paid in full. So was the bill."
 ROM_public_housing_idea:0 "Homes for the Young"
 ROM_public_housing_idea_desc:0 "Rental flats for young families in every county capital."
 ROM_low_taxes_idea:0 "The Flat Tax"
 ROM_low_taxes_idea_desc:0 "Sixteen percent and nothing more."
 ROM_recovery_funds_idea:0 "Recovery Money"
 ROM_recovery_funds_idea_desc:0 "Billions in grants and cheap loans, released milestone by milestone."
 ROM_free_market_boom_idea:0 "The Entrepreneurs' Republic"
 ROM_free_market_boom_idea_desc:0 "Less paperwork, faster permits and investors who stay."
 ROM_social_pact_idea:0 "The Social Pact"
 ROM_social_pact_idea_desc:0 "Unions, employers and the state, bound by one agreement."
 ROM_liberal_romania_idea:0 "Investment Grade"
 ROM_liberal_romania_idea_desc:0 "Romania is now an investment destination."
 ROM_romarm_holding_idea:0 "Romarm Holding"
 ROM_romarm_holding_idea_desc:0 "One state arms group with a ten-year order book."
 ROM_powder_works_idea:0 "The Powder Works"
 ROM_powder_works_idea_desc:0 "Romania makes its own propellant again."
 ROM_mobilisation_law_idea:0 "The Mobilisation Law"
 ROM_mobilisation_law_idea_desc:0 "Who is called, what is requisitioned, and how: written down in peacetime."
 ROM_central_administration_idea:0 "One State Administration"
 ROM_central_administration_idea_desc:0 "Career prefects in every county, answering to the centre."
 ROM_services_reform_idea:0 "Reformed Services"
 ROM_services_reform_idea_desc:0 "Fewer services, clearer orders, a committee that reads the budgets."
 ROM_state_capacity_idea:0 "A State That Works"
 ROM_state_capacity_idea_desc:0 "Competent, fast and present in every county."
 ROM_american_brigade_idea:0 "The American Brigade"
 ROM_american_brigade_idea_desc:0 "A permanent armoured brigade at Kogalniceanu."
 ROM_bucharest_format_idea:0 "Convenor of the Flank"
 ROM_bucharest_format_idea_desc:0 "The eastern flank meets in Bucharest."
 ROM_state_of_emergency_idea:0 "State of Emergency"
 ROM_state_of_emergency_idea_desc:0 "Powers granted for thirty days at a time."
 ROM_permanent_emergency_idea:0 "The Permanent Emergency"
 ROM_permanent_emergency_idea_desc:0 "The exception has become the rule."
 ROM_total_defence_idea:0 "Total Defence"
 ROM_total_defence_idea_desc:0 "Every ministry, company and citizen knows their role."
 ROM_strong_state_idea:0 "The Strong State"
 ROM_strong_state_idea_desc:0 "Strong, competent and accountable."
 ROM_strong_state_authoritarian_idea:0 "The Security State"
 ROM_strong_state_authoritarian_idea_desc:0 "Strong and efficient, and answerable to nobody."
 ROM_one_nation_idea:0 "One Nation, Two Banks"
 ROM_one_nation_idea_desc:0 "The Prut is a river again, not a border."
 ROM_union_integration_idea:0 "Integrating Bessarabia"
 ROM_union_integration_idea_desc:0 "Pensions, roads, courts and schools for three million new citizens. Union has a cost."
 ROM_grain_corridor_idea:0 "The Grain Corridor"
 ROM_grain_corridor_idea_desc:0 "Half of Ukraine's exports pass through Romanian ports."
 ROM_ukraine_support_idea:0 "Front-Line Ally"
 ROM_ukraine_support_idea_desc:0 "Romanian trainers, depots and airfields support Ukraine."
 ROM_three_seas_idea:0 "Three Seas Corridor"
 ROM_three_seas_idea_desc:0 "Roads, pipelines and power lines running north to south through Romania."
 ROM_iron_gates_idea:0 "The Iron Gates"
 ROM_iron_gates_idea_desc:0 "Two dams, two countries, one grid."
 ROM_guardian_idea:0 "Guardian of the Black Sea"
 ROM_guardian_idea_desc:0 "Romania is the anchor of its region."
 ROM_sovereign_fund_idea:0 "The Development Fund"
 ROM_sovereign_fund_idea_desc:0 "Romanian money for Romanian projects, slowly."
 ROM_neptun_deep_idea:0 "Neptun Deep Gas"
 ROM_neptun_deep_idea_desc:0 "The EU's largest gas producer."
 ROM_tech_sector_idea:0 "The Cluj Tech Cluster"
 ROM_tech_sector_idea_desc:0 "Engineers, start-ups and a chip design centre."
 ROM_nuclear_power_idea:0 "Cernavoda Expanded"
 ROM_nuclear_power_idea_desc:0 "Four CANDU reactors on the Danube."
 ROM_infrastructure_push_idea:0 "Closing the Gap"
 ROM_infrastructure_push_idea_desc:0 "Trains that run on time and villages with running water."
 ROM_energy_exporter_idea:0 "Energy Exporter"
 ROM_energy_exporter_idea_desc:0 "The neighbours' lights depend on Romania."
 ROM_rail_revival_idea:0 "Trains Faster Than Cars"
 ROM_rail_revival_idea_desc:0 "Electrified main lines to every corner of the country."
 ROM_irrigation_idea:0 "Water for the Baragan"
 ROM_irrigation_idea_desc:0 "Droughts no longer cost a harvest."
 ROM_growth_consumer_idea:0 "Wages First"
 ROM_growth_consumer_idea_desc:0 "Rising pay, rising consumption, and not much left for factories."
 ROM_growth_investment_idea:0 "Building for the Next Decade"
 ROM_growth_investment_idea_desc:0 "Tight belts now, a richer country later."
 ROM_growth_military_idea:0 "The Arsenal Economy"
 ROM_growth_military_idea_desc:0 "Defence spending as industrial policy."
 ROM_vocational_idea:0 "Dual Vocational Training"
 ROM_vocational_idea_desc:0 "Apprentices learning on real factory floors."
 ROM_guest_workers_idea:0 "Guest Workers"
 ROM_guest_workers_idea_desc:0 "Workers from Asia fill the jobs emigrants left behind."
 ROM_strategic_industries_idea:0 "Strategic Industries"
 ROM_strategic_industries_idea_desc:0 "Steel, aluminium and powder the state will not let die."
 ROM_offshore_wind_idea:0 "Black Sea Wind"
 ROM_offshore_wind_idea_desc:0 "Power for the region after the gas runs low."
 ROM_plan_2035_idea:0 "Romania 2035"
 ROM_plan_2035_idea_desc:0 "A ten-year plan with institutions behind it."
 ROM_convergence_idea:0 "Convergence"
 ROM_convergence_idea_desc:0 "No longer catching up."
 ROM_defence_spending_idea:0 "Defence Budget at 3.5%"
 ROM_defence_spending_idea_desc:0 "The Hague pledge, written into the budget."
 ROM_voluntary_service_idea:0 "Voluntary Service"
 ROM_voluntary_service_idea_desc:0 "Four months of paid training for young volunteers."
 ROM_officer_corps_idea:0 "A Modern Officer Corps"
 ROM_officer_corps_idea_desc:0 "Trained for the war Europe may have to fight."
 ROM_nation_in_arms_idea:0 "A Nation in Arms"
 ROM_nation_in_arms_idea_desc:0 "A large, cheap and trained reserve."
 ROM_professional_force_idea:0 "A Professional Army"
 ROM_professional_force_idea_desc:0 "Fewer soldiers, better soldiers."
 ROM_army_logistics_idea:0 "Army Logistics"
 ROM_army_logistics_idea_desc:0 "Fuel for weeks, not days."
 ROM_territorial_defence_idea:0 "Territorial Defence"
 ROM_territorial_defence_idea_desc:0 "A battalion in every county."
 ROM_conscription_idea:0 "Compulsory Service"
 ROM_conscription_idea_desc:0 "Six months in uniform for every young man."
 ROM_special_operations_idea:0 "Special Operations Command"
 ROM_special_operations_idea_desc:0 "Elite units with their own aviation and intelligence."
 ROM_focsani_line_idea:0 "The Focsani Gate"
 ROM_focsani_line_idea_desc:0 "Fortified again, eighty years later."
 ROM_drone_battalions_idea:0 "Drone Battalions"
 ROM_drone_battalions_idea_desc:0 "Every brigade has eyes in the sky."
 ROM_mountain_hunters_idea:0 "The Mountain Hunters"
 ROM_mountain_hunters_idea_desc:0 "Masters of the Carpathian passes."
 ROM_carpathian_doctrine_idea:0 "The Carpathian Doctrine"
 ROM_carpathian_doctrine_idea_desc:0 "Trade space for time, then strike the flanks."
 ROM_tank_line_idea:0 "A Romanian Tank"
 ROM_tank_line_idea_desc:0 "Armour assembled at home."
 ROM_bastion_idea:0 "Bastion of the Eastern Flank"
 ROM_bastion_idea_desc:0 "An army that can hold the line until the allies arrive."
 ROM_army_2035_idea:0 "The Army of 2035"
 ROM_army_2035_idea_desc:0 "Networked, trained and supplied from home."
 ROM_flight_school_idea:0 "The Fetesti Flight School"
 ROM_flight_school_idea_desc:0 "Pilots and instructors trained at home."
 ROM_air_maintenance_idea:0 "Keep Them Flying"
 ROM_air_maintenance_idea_desc:0 "Less time in the hangar."
 ROM_aviation_industry_idea:0 "Aerostar and IAR"
 ROM_aviation_industry_idea_desc:0 "A Romanian aviation industry again."
 ROM_air_doctrine_superiority_idea:0 "Own the Sky"
 ROM_air_doctrine_superiority_idea_desc:0 "Fighters first."
 ROM_air_doctrine_strike_idea:0 "Support the Army"
 ROM_air_doctrine_strike_idea_desc:0 "Fly for the soldiers on the ground."
 ROM_air_doctrine_drones_idea:0 "The Unmanned Air Arm"
 ROM_air_doctrine_drones_idea_desc:0 "A thousand drones for the price of one jet."
 ROM_integrated_air_defence_idea:0 "A Closed Sky"
 ROM_integrated_air_defence_idea_desc:0 "Patriots, SHORAD and radars from the Danube to the Prut."
 ROM_air_tankers_idea:0 "Tankers and Transports"
 ROM_air_tankers_idea_desc:0 "The air force can reach beyond its borders."
 ROM_fighter_wing_idea:0 "The Black Sea Fighter Wing"
 ROM_fighter_wing_idea_desc:0 "Nothing crosses unannounced."
 ROM_strike_wing_idea:0 "Precision Strike"
 ROM_strike_wing_idea_desc:0 "Bridges and depots far behind the front."
 ROM_loitering_munitions_idea:0 "Loitering Munitions"
 ROM_loitering_munitions_idea_desc:0 "Cheap, numerous and deadly."
 ROM_next_gen_fighter_idea:0 "Next-Generation Partner"
 ROM_next_gen_fighter_idea_desc:0 "A voice in what Romania will fly in 2045."
 ROM_naval_academy_idea:0 "The Naval Academy"
 ROM_naval_academy_idea_desc:0 "Officers ready for ships not yet built."
 ROM_danube_flotilla_idea:0 "The Danube Flotilla"
 ROM_danube_flotilla_idea_desc:0 "Monitors and patrol boats from Braila to Sulina."
 ROM_navy_coastal_idea:0 "A Coastal Fortress"
 ROM_navy_coastal_idea_desc:0 "Missiles, mines and fast boats."
