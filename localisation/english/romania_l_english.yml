 ROM_harsher_punishments_for_corruption_desc:0 "Those who steal from the people must answer for it. Stricter penalties will show that no one is above the law."
 ROM_build_religious_schools:0 "Build Religious Schools"
 ROM_build_religious_schools_desc:0 "Education should nurture both the mind and the soul. We will fund religious schools so that our children grow up rooted in faith and virtue."
 ROM_moral_values_in_law:0 "Moral Values in Law"
 ROM_moral_values_in_law_desc:0 "The law should reflect the values of the people it serves. Our legal system will be grounded in morality and tradition."
 ROM_focus_1:0 "Nationalise Key Industries"
 ROM_focus_1_desc:0 "Energy, rail and the big industrial plants have spent decades in private or foreign hands. Bringing the commanding heights of the economy back under state control will give the government the tools to steer the country's future."
 ROM_start:0 "Romania 2025 Elections - Start"
 ROM_pnl_victory:0 "Nicusor Victory"
 ROM_pnl_victory_desc:0 "Nicușor Dan has won the presidency. The people have spoken in favor of democracy, liberty and a Romania firmly anchored in the West."
 ROM_request_eu_funds:0 "Request EU Funds"
 ROM_request_eu_funds_desc:0 "Our coffers are running dry. Brussels holds the funds we need, and it is time to knock on its door."
 ROM_economic_concentration:0 "Economic Concentration"
 ROM_economic_concentration_desc:0 "Romania teeters on the edge of bankruptcy. We must concentrate our efforts on rebuilding the economy before it is too late."
 ROM_the_goverment_of_romania:0 "Increase our Spending for Defence"
 ROM_the_goverment_of_romania_desc:0 "With war still raging across the border in Ukraine, Romania can no longer treat defence as an afterthought. Our borders must be secured, and our armed forces must be ready."
