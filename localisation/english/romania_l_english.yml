 ROM_fleet_2035_idea:0 "The Fleet of 2035"
 ROM_fleet_2035_idea_desc:0 "The strongest navy in the western Black Sea."
 ROM_technocrats_idea:0 "A Cabinet of Technocrats"
 ROM_technocrats_idea_desc:0 "Ministers chosen for their competence rather than their party."
 ROM_revolutionary_turmoil_idea:0 "Revolutionary Turmoil"
 ROM_revolutionary_turmoil_idea_desc:0 "The old order has collapsed and nothing has yet replaced it."
 ROM_western_credit_idea:0 "Credit on the Crown's Word"
 ROM_western_credit_idea_desc:0 "A bridging loan arranged through royal connections."
 ROM_requisition_idea:0 "Military Requisition"
 ROM_requisition_idea_desc:0 "Fuel, grain and cash under army administration."
 ROM_parish_relief_idea:0 "Parish Relief"
 ROM_parish_relief_idea_desc:0 "State aid distributed by the Church's parishes."
 ROM_crown_restored_idea:0 "The Crown Restored"
 ROM_crown_restored_idea_desc:0 "The Royal House is back at the head of the state, for now as a guarantor of order."
 ROM_royal_prestige_idea:0 "Royal Prestige"
 ROM_royal_prestige_idea_desc:0 "A monarchy that Europe can recognise."
 ROM_constitutional_monarchy_idea:0 "The 1923 Constitution"
 ROM_constitutional_monarchy_idea_desc:0 "The Crown reigns. Parliament governs."
 ROM_royal_prerogative_idea:0 "The Royal Prerogative"
 ROM_royal_prerogative_idea_desc:0 "The Crown rules through ministers of its own choosing."
 ROM_free_press_idea:0 "A Free Press"
 ROM_free_press_idea_desc:0 "Licensed by nobody, censored by nobody."
 ROM_reconciliation_tension_idea:0 "Truth and Amnesty"
 ROM_reconciliation_tension_idea_desc:0 "Old enemies testifying in public. It is painful to watch."
 ROM_crown_council_idea:0 "The Crown Council"
 ROM_crown_council_idea_desc:0 "Advisers chosen by the Crown, answerable only to it."
 ROM_royal_treasury_idea:0 "The Crown Domains"
 ROM_royal_treasury_idea_desc:0 "Royal estates working for the nation's finances."
 ROM_royal_guard_idea:0 "The Royal Guard"
 ROM_royal_guard_idea_desc:0 "The palace's own regiment."
 ROM_royal_diplomacy_idea:0 "Royal Diplomacy"
 ROM_royal_diplomacy_idea_desc:0 "Kinship opens doors that ministries cannot."
 ROM_army_of_the_crown_idea:0 "The King's Commission"
 ROM_army_of_the_crown_idea_desc:0 "Officers sworn to the Crown as well as the country."
 ROM_carpathian_line_idea:0 "The Carpathian Line"
 ROM_carpathian_line_idea_desc:0 "Fortified passes and mountain brigades."
 ROM_united_crown_idea:0 "One Crown, One Nation"
 ROM_united_crown_idea_desc:0 "The restoration is no longer in question."
 ROM_military_junta_idea:0 "National Defence Committee"
 ROM_military_junta_idea_desc:0 "Romania is governed by its general staff."
 ROM_martial_law_idea:0 "Martial Law"
 ROM_martial_law_idea_desc:0 "Curfew, checkpoints and military courts."
 ROM_defence_council_idea:0 "Rule by the CSAT"
 ROM_defence_council_idea_desc:0 "The Supreme Council of National Defence is the government."
 ROM_secret_police_idea:0 "The SRI Under Command"
 ROM_secret_police_idea_desc:0 "Romania has a secret police again."
 ROM_guarded_democracy_idea:0 "A Guarded Democracy"
 ROM_guarded_democracy_idea_desc:0 "Elected civilians govern. The generals watch."
 ROM_iron_government_idea:0 "The Iron Government"
 ROM_iron_government_idea_desc:0 "Emergency laws have become ordinary statutes."
 ROM_war_economy_idea:0 "Defence Production Act"
 ROM_war_economy_idea_desc:0 "Every factory has a military quota."
 ROM_labour_conscription_idea:0 "Labour Battalions"
 ROM_labour_conscription_idea_desc:0 "Drafted workers building roads and depots."
 ROM_war_plans_idea:0 "Plan Prut"
 ROM_war_plans_idea_desc:0 "The general staff has its orders."
 ROM_army_of_the_prut_idea:0 "The Army of the Prut"
 ROM_army_of_the_prut_idea_desc:0 "A single eastern command, ready to move."
 ROM_iron_marshals_idea:0 "The Marshals' Army"
 ROM_iron_marshals_idea_desc:0 "An army that can mobilise in days."
 ROM_orthodox_state_idea:0 "The Patriarchal Regency"
 ROM_orthodox_state_idea_desc:0 "The Church holds the state in trust."
 ROM_patriarchate_idea:0 "Symphonia Proclaimed"
 ROM_patriarchate_idea_desc:0 "Church and state, two hands of one body."
 ROM_symphonia_idea:0 "Byzantine Symphonia"
 ROM_symphonia_idea_desc:0 "The Church advises. The state governs."
 ROM_anti_heresy_idea:0 "Guardians of Orthodoxy"
 ROM_anti_heresy_idea_desc:0 "Suspicion of every faith but one."
 ROM_peasant_state_idea:0 "The Village Restored"
 ROM_peasant_state_idea_desc:0 "Land, a market and a future in every commune."
 ROM_cooperatives_idea:0 "Parish Cooperatives"
 ROM_cooperatives_idea_desc:0 "Dairies, mills and canneries owned by the villages."
 ROM_monastic_idea:0 "The Monasteries Revived"
 ROM_monastic_idea_desc:0 "Learning, healing and pilgrims."
 ROM_cathedral_idea:0 "The Nation's Cathedral"
 ROM_cathedral_idea_desc:0 "Finished at last."
 ROM_religious_education_idea:0 "Catechism in Every Classroom"
 ROM_religious_education_idea_desc:0 "The Synod writes the curriculum."
 ROM_orthodox_brotherhood_idea:0 "The Orthodox Concord"
 ROM_orthodox_brotherhood_idea_desc:0 "A council of Orthodox nations from Belgrade to Tbilisi."
 ROM_militia_idea:0 "Parish Brotherhoods"
 ROM_militia_idea_desc:0 "Every village keeps its defenders on a roll."
 ROM_holy_romania_idea:0 "Holy Romania"
 ROM_holy_romania_idea_desc:0 "The faith now shapes the life of the nation."
 ROM_royal_heritage_idea:0 "The Royal Carpathians"
 ROM_royal_heritage_idea_desc:0 "Heritage that pays its own way."
 ROM_royal_army_idea:0 "The Royal Army"
 ROM_royal_army_idea_desc:0 "Mountains, air and coast, under the Crown."
 ROM_kingdom_2035_idea:0 "The Kingdom of 2035"
 ROM_kingdom_2035_idea_desc:0 "The oldest institution of the state, renewed."
 ROM_air_mobility_idea:0 "Air Mobility Command"
 ROM_air_mobility_idea_desc:0 "A brigade to the Prut in one night."
 ROM_national_service_idea:0 "National Service"
 ROM_national_service_idea_desc:0 "A year in uniform for every young Romanian."
 ROM_nation_under_arms_idea:0 "A Nation Under Arms"
 ROM_nation_under_arms_idea_desc:0 "Every Romanian knows the soldier's trade."
 ROM_morality_code_idea:0 "The Code of Public Morals"
 ROM_morality_code_idea_desc:0 "Popular in the villages, resented in the cities."
 ROM_covenant_nation_idea:0 "A Covenant Nation"
 ROM_covenant_nation_idea_desc:0 "The Church's mark on a generation."
 ROM_corruption_1:0 "Corruption: Controlled"
 ROM_corruption_1_desc:0 "Contracts are audited, appointments are contested in public and most officials expect to be caught. Clean government is also slower to bend to the government's own wishes."
 ROM_corruption_2:0 "Corruption: Noticeable"
 ROM_corruption_2_desc:0 "A consultancy fee here, an inflated invoice there. Nothing that brings a government down, but every project costs a little more than it should."
 ROM_corruption_3:0 "Corruption: Widespread"
 ROM_corruption_3_desc:0 "Public tenders are won before they are published, and Romanians assume, usually correctly, that every permit has a price."
 ROM_corruption_4:0 "Corruption: Severe"
 ROM_corruption_4_desc:0 "Networks inside ministries and state companies divert money openly. Patronage buys the government loyalty, but scandals are now a matter of when, not if."
 ROM_corruption_5:0 "Corruption: Systemic"
 ROM_corruption_5_desc:0 "The state has become a business run for those inside it. Equipment disappears from depots, budgets vanish into front companies and nobody believes the government can reform itself."
 ROM_contracts_frozen_idea:0 "Contracts Frozen for Audit"
 ROM_contracts_frozen_idea_desc:0 "Every open public contract is on hold until the auditors have finished with it."
 ROM_friendly_contractors_idea:0 "Friendly Contractors"
 ROM_friendly_contractors_idea_desc:0 "Firms close to the government win the tenders and finish the work quickly. Nobody asks what it cost."
 ROM_civil_service_transition_idea:0 "Civil Service Transition"
 ROM_civil_service_transition_idea_desc:0 "Every senior post is being re-advertised through open competition. The ministries are half-staffed in the meantime."
 ROM_procurement_frozen_idea:0 "Procurement Under Review"
 ROM_procurement_frozen_idea_desc:0 "The CSAT has frozen new defence contracts until every offset clause has been checked."
 ROM_scandal_paralysis_idea:0 "Government in Crisis"
 ROM_scandal_paralysis_idea_desc:0 "Ministers spend their days with lawyers and journalists instead of governing."
 ROM_drac_snagov_files_idea:0 "The Snagov Files"
 ROM_drac_snagov_files_idea_desc:0 "An election postponed, a monastery closed and a secret nobody may name."
 ROM_drac_project_idea:0 "Project Voievod"
 ROM_drac_project_idea_desc:0 "Everything the state can spare goes into the mountain."
 ROM_drac_black_budget_idea:0 "The Black Budget"
 ROM_drac_black_budget_idea_desc:0 "Money that vanishes into the mountain."
 ROM_drac_voivode_returned_idea:0 "The Voivode Has Returned"
 ROM_drac_voivode_returned_idea_desc:0 "Nobody quite believes it. Nobody dares to doubt it."
 ROM_drac_night_economy_idea:0 "The Night Economy"
 ROM_drac_night_economy_idea_desc:0 "Romania works the evening shift."
 ROM_drac_eyes_idea:0 "Eyes in the Dark"
 ROM_drac_eyes_idea_desc:0 "He sees what his servants see."
 ROM_drac_order_idea:0 "The Voivodal Order"
 ROM_drac_order_idea_desc:0 "Vassals bound by personal oath."
 ROM_drac_messengers_idea:0 "The Night Messengers"
 ROM_drac_messengers_idea_desc:0 "Messages that arrive by wing."
 ROM_drac_wolves_idea:0 "The Wolves of the Carpathians"
 ROM_drac_wolves_idea_desc:0 "The passes are watched by more than soldiers."
 ROM_drac_thralls_idea:0 "Thralls Abroad"
 ROM_drac_thralls_idea_desc:0 "Friends in every capital, whether they know it or not."
 ROM_drac_dominion_idea:0 "The Dominion"
 ROM_drac_dominion_idea_desc:0 "Wallachia, Moldavia and Transylvania under one ruler, for as long as he lives."
 ROM_drac_strigoi_idea:0 "The Strigoi Companies"
 ROM_drac_strigoi_idea_desc:0 "A few hundred soldiers who do not die easily."
 ROM_drac_night_legion_idea:0 "The Night Legion"
 ROM_drac_night_legion_idea_desc:0 "Divisions that march only in the dark."
 ROM_drac_iron_flesh_idea:0 "Flesh Like Iron"
 ROM_drac_iron_flesh_idea_desc:0 "Wounds that close in an hour."
 ROM_drac_serum_idea:0 "The Regeneration Serum"
 ROM_drac_serum_idea_desc:0 "Back to the line by morning."
 ROM_drac_darksight_idea:0 "Darksight"
 ROM_drac_darksight_idea_desc:0 "The night belongs to Romania."
 ROM_drac_night_ops_idea:0 "Operations by Night"
 ROM_drac_night_ops_idea_desc:0 "Depots that burn without an arsonist."
 ROM_drac_swarms_idea:0 "The Swarms"
 ROM_drac_swarms_idea_desc:0 "Radar screens full of wings."
 ROM_drac_mist_idea:0 "The Mist"
 ROM_drac_mist_idea_desc:0 "Fog lies on the borders for days."
 ROM_drac_storm_idea:0 "The Black Sea Storm"
 ROM_drac_storm_idea_desc:0 "The sea itself defends the coast."
 ROM_drac_host_idea:0 "The Voivode's Host"
 ROM_drac_host_idea_desc:0 "The most dangerous army in Europe."
 ROM_drac_containment_idea:0 "Under Containment"
 ROM_drac_containment_idea_desc:0 "Sanctions, travel bans and a cordon around the Carpathians."
 ROM_drac_spy_war_idea:0 "The Spy War"
 ROM_drac_spy_war_idea_desc:0 "Few foreign agents come back."
 ROM_drac_turned_agents_idea:0 "Turned Agents"
 ROM_drac_turned_agents_idea_desc:0 "The enemy's plans arrive first in Bucharest."
 ROM_drac_empire_idea:0 "The Empire of the Night"
 ROM_drac_empire_idea_desc:0 "Everything that was his, and more."
 ROM_drac_transfiguration_idea:0 "The Transfigured Nation"
 ROM_drac_transfiguration_idea_desc:0 "Long life, for those who accept the night."
 ROM_drac_long_night_idea:0 "The Long Night Abroad"
 ROM_drac_long_night_idea_desc:0 "A quiet hand on the decisions of Europe."
 ROM_drac_dawn_accord_idea:0 "The Dawn Accord"
 ROM_drac_dawn_accord_idea_desc:0 "An uneasy peace, sworn in blood."
 ROM_drac_long_life_idea:0 "The Long Life"
 ROM_drac_long_life_idea_desc:0 "A generation that does not age."
 ROM_drac_courts_idea:0 "A Court in Every Capital"
 ROM_drac_courts_idea_desc:0 "Ministers who meet after midnight."
 ROM_drac_warden_idea:0 "Warden of the Carpathians"
 ROM_drac_warden_idea_desc:0 "The mountains are guarded, and the nights are quiet."
 ROM_drac_door_closed_idea:0 "The Door Stays Closed"
 ROM_drac_door_closed_idea_desc:0 "Whatever waits beneath Snagov will wait a while longer."
 ROM_drac_door_opened_idea:0 "The Door Is Open"
 ROM_drac_door_opened_idea_desc:0 "Something older than the Voivode walks in Romania now."

 # ===== Events =====
 ROM_elect.1.t:0 "The Bolojan Cabinet"
 ROM_elect.1.d:0 "Ilie Bolojan arrives at Cotroceni with two lists. The first is a four-party coalition of the Liberals, the Social Democrats, USR and the Hungarian UDMR, with a comfortable majority and a cabinet in which every minister answers to a different party leader. The second is a lean Liberal-USR minority government of technocrats who will have to win every vote one deputy at a time."
 ROM_elect.1.a:0 "A broad coalition. Stability first."
 ROM_elect.1.b:0 "A lean cabinet of technocrats."
 ROM_elect.2.t:0 "The Interference Files"
 ROM_elect.2.d:0 "Prosecutors present their case: a network of thousands of accounts, paid influencers and money routed through intermediaries, all coordinated to push one candidate in November 2024. Defence lawyers call it a show trial. The President must decide how far the government stands behind the prosecution."
 ROM_elect.2.a:0 "Publish everything. Romanians deserve the truth."
 ROM_elect.2.b:0 "Keep it to the campaign-finance charges."
 ROM_elect.3.t:0 "The Unions March on Victoria Square"
 ROM_elect.3.d:0 "Teachers, railway workers and public employees are on strike against the wage freeze. Fifty thousand people fill Victoria Square, and the Social Democrats in the coalition are wavering. Bolojan wants to hold the line; the President's advisers want a deal before the strike spreads to the hospitals."
 ROM_elect.3.a:0 "Concede on wages for teachers and doctors."
 ROM_elect.3.b:0 "Hold the line. The numbers do not lie."
 ROM_elect.4.t:0 "Counting to Fifty-One"
 ROM_elect.4.d:0 "Twenty Liberal deputies from the party's conservative wing have told the President's office they could be persuaded to join a new parliamentary group. Their price is ministries, a share of the county councils and a promise to leave the European treaties alone. The alternative is to govern by emergency ordinance and let the Constitutional Court object."
 ROM_elect.4.a:0 "Bring the Liberal dissidents in."
 ROM_elect.4.b:0 "Rule by ordinance and let them try to stop us."
 ROM_elect.5.t:0 "The Rotation Clause"
 ROM_elect.5.d:0 "The coalition agreement is explicit: halfway through the term the Prime Minister's office changes hands. The party that holds it now has found a dozen reasons why this is the wrong moment. The President can enforce the deal or let the stronger party keep the office and absorb the anger of the weaker one."
 ROM_elect.5.a:0 "A deal is a deal. The office rotates."
 ROM_elect.5.b:0 "Keep the current Prime Minister."
 ROM_elect.6.t:0 "Brussels Freezes Romanian Funds"
 ROM_elect.6.d:0 "Within days of President Simion's pardon of Calin Georgescu, the European Commission has triggered the rule-of-law conditionality mechanism, suspending cohesion and recovery payments to Romania. In Bucharest, crowds outside the Commission's representation chant 'Sovereignty!'; in Cluj and Timisoara, crowds of a different kind chant 'Europe!'."
 ROM_elect.6.a:0 "Romania will not be blackmailed."
 ROM_uprise.1.t:0 "The Provisional Council Meets"
 ROM_uprise.1.d:0 "They meet in the Senate chamber because the Parliament Palace is still surrounded by crowds. Calin Georgescu takes the chair. General Gheorghita Vlad sits to his right, a bishop of the Holy Synod to his left, and at the far end of the table a quiet representative of the Royal House takes careful notes. Each of them has already decided who should lead Romania after Georgescu."
 ROM_uprise.1.a:0 "Let the Council govern, for now."
 ROM_uprise.2.t:0 "The Romanian Revolution Settles"
 ROM_uprise.2.d:0 "Weeks of uncertainty in Bucharest have ended. The Provisional Council has handed power to [ROM.GetRulingParty], and the new leadership has promised order, sovereignty and an end to the crisis. Foreign ministries are now deciding what that promise is worth."
 ROM_uprise.2.a:0 "A new chapter for Romania."
 ROM_uprise.3.t:0 "A Coronation at Alba Iulia"
 ROM_uprise.3.d:0 "For the first time since 1922, a Romanian monarch has been crowned in the Coronation Cathedral at Alba Iulia. Royal guests from across Europe watched as the steel crown, forged from a cannon captured at Plevna, was placed on the head of Queen Margareta."
 ROM_uprise.3.a:0 "Long live the Queen!"
 ROM_uprise.4.t:0 "Protests in Szeklerland"
 ROM_uprise.4.d:0 "The new curriculum and the Synod's campaign against 'foreign churches' have brought tens of thousands of Hungarian Romanians into the streets of Miercurea Ciuc and Sfantu Gheorghe. Budapest has summoned the Romanian ambassador. The hardliners want the gendarmerie sent in; the regency's moderates want a quiet compromise."
 ROM_uprise.4.a:0 "Exempt the historic minority churches."
 ROM_uprise.4.b:0 "Order must be kept. Send the gendarmes."
 ROM_union.1.t:0 "Bucharest Proposes Union"
 ROM_union.1.d:0 "Romania has formally proposed the union of our two states, to be confirmed by referendum on both banks of the Prut. Many of our citizens already carry Romanian passports, and union would bring us into the European Union at once. Many others fear the end of a Moldovan state they have defended for thirty years, and Moscow is already warning of consequences."
 ROM_union.1.a:0 "Put union to the people. We accept."
 ROM_union.1.b:0 "Moldova will remain Moldova."
 ROM_union.2.t:0 "Moldova Says Yes"
 ROM_union.2.d:0 "Moldovans have voted for union. Flags of the same colours fly on both banks of the Prut, and church bells ring from Iasi to Chisinau. Now comes the hard part: three million new citizens, a different pension system, two currencies and an army that must become part of ours."
 ROM_union.2.a:0 "The Union is complete!"
 ROM_union.3.t:0 "Chisinau Refuses"
 ROM_union.3.d:0 "The Moldovan government has rejected our proposal. Moldova, it says, will join Europe as a sovereign state or not at all. Unionists on both banks are bitterly disappointed."
 ROM_union.3.a:0 "We respect Moldova's choice."
 ROM_union.3.b:0 "Then it will be settled another way."
 ROM_sim.1.t:0 "The First Congress in Power"
 ROM_sim.1.d:0 "The delegates cheer every speaker and vote for every motion; the real fight is over the party's executive bureau. The moderates offer competent ministers and allies in Strasbourg. The radicals offer the energy of the squares and Georgescu's blessing. The county organisers offer what neither of them has: people who know how to run a town hall."
 ROM_sim.1.a:0 "Give the bureau to the moderates."
 ROM_sim.1.b:0 "Give the bureau to the radicals."
 ROM_sim.1.c:0 "Give the bureau to the organisers."
 ROM_sim.2.t:0 "The Second Congress"
 ROM_sim.2.d:0 "Two years of government have changed the balance inside the movement. The strongest wing now has the delegates to write the programme for the rest of the term. Overruling them is possible, but it would cost the President dearly."
 ROM_sim.2.a:0 "The moderates carry the congress."
 ROM_sim.2.b:0 "The radicals carry the congress."
 ROM_sim.2.c:0 "The organisers carry the congress."
 ROM_sim.2.e:0 "The President imposes a compromise."
 ROM_sim.3.t:0 "The Third Congress: Who Comes After"
 ROM_sim.3.d:0 "The succession is the only question in the hall. Whoever the strongest wing names as Simion's heir will define the movement long after he has left Cotroceni. The President can still tip the balance, at a price."
 ROM_sim.3.a:0 "The moderates name the heir."
 ROM_sim.3.b:0 "The radicals name the heir."
 ROM_sim.3.c:0 "The organisers name the heir."
 ROM_sim.3.e:0 "Back the moderates against the hall."
 ROM_sim.3.f:0 "Back the radicals against the hall."
 ROM_sim.3.g:0 "Back the organisers against the hall."
 ROM_sim.4.t:0 "Europe in the Squares"
 ROM_sim.4.d:0 "The movement's legitimacy is collapsing. Students, doctors and IT workers fill Victoria Square every evening with EU flags, and AUR's own deputies are asking whether the President is a liability. The movement must win back the country or risk losing Parliament."
 ROM_sim.4.a:0 "Call a counter-rally. The real Romania will answer."
 ROM_sim.4.b:0 "Make concessions to the protesters."
 ROM_sim.4.c:0 "Sacrifice the Prime Minister."
 ROM_sim.5.t:0 "The Referendum Succeeds"
 ROM_sim.5.d:0 "Fifty-eight percent voted yes on a turnout high enough to make the result binding. The President's opponents call it a plebiscite on a slogan; the President calls it a mandate. For the rest of the term, he has the stronger argument."
 ROM_sim.5.a:0 "The people have spoken."
 ROM_sim.6.t:0 "The Referendum Fails"
 ROM_sim.6.d:0 "The turnout fell short and most of those who voted said no. The movement asked the country for everything and was refused. The opposition demands early elections, and the factions inside AUR start blaming each other."
 ROM_sim.6.a:0 "We accept the result."
 ROM_sim.6.b:0 "The vote was sabotaged by the system."
 ROM_ant.1.t:0 "The National Defence Strategy"
 ROM_ant.1.d:0 "The strategy reaches Parliament with three options for the defence budget. The Hague target of 3.5 percent of GDP keeps faith with the allies. Five percent would build the army Antonescu thinks the country needs, and would be paid for by everyone else in the budget. The finance ministry wants to stay at 2.5 percent and keep the pensions safe."
 ROM_ant.1.a:0 "Three and a half percent, as promised."
 ROM_ant.1.b:0 "Five percent. The threat will not wait."
 ROM_ant.1.c:0 "Two and a half percent, and the pensions are safe."
 ROM_ant.2.t:0 "The Budget of 2028"
 ROM_ant.2.d:0 "The Ministry of Defence wants the next tranche of armour and air defence. The Ministry of Health wants the regional hospitals finished. The Ministry of Labour reminds everyone that pensions are indexed by law. The money exists for two of the three."
 ROM_ant.2.a:0 "Guns: the army comes first."
 ROM_ant.2.b:0 "Butter: citizens come first."
 ROM_ant.2.c:0 "Both: borrow the difference."
 ROM_ant.3.t:0 "The Price of Security"
 ROM_ant.3.d:0 "Public consent has run out. Unions, pensioners and students march together against a state that asks for sacrifice and explains nothing. The coalition partners are discussing whether the President has become a burden."
 ROM_ant.3.a:0 "Explain, listen and slow down."
 ROM_ant.3.b:0 "Hold firm. Security is not a popularity contest."
 ROM_ant.3.c:0 "Offer the unions a wage deal in the defence plants."
 ROM_ant.7.t:0 "The Export Licence"
 ROM_ant.7.d:0 "A Gulf intermediary wants fifty thousand shells and will pay above market price. The end-user certificate is in order. Romanian intelligence believes most of the shells would end up in a civil war the government has publicly condemned."
 ROM_ant.7.a:0 "Refuse the licence."
 ROM_ant.7.b:0 "Approve it. The plants need the order."
 ROM_ant.7.c:0 "Sell only to allies, at cost."
 ROM_elect.7.t:0 "The 2030 Presidential Election"
 ROM_elect.7.d:0 "Election night at Cotroceni. Five years of reforms are on the ballot: the counters that closed, the hospitals that opened, the deputies who lost their immunity. Whether the country rewards them depends on how stable it feels tonight."
 ROM_elect.7.a:0 "Victory: a second mandate."
 ROM_elect.7.b:0 "A narrow defeat. The reforms will have to survive without us."
 ROM_regime.1.t:0 "The Question of the Heir"
 ROM_regime.1.d:0 "The Crown Council meets behind closed doors at Elisabeta Palace. One faction wants a dynastic heir from within the Royal House, trained from youth for the throne. Another proposes that Parliament and the Council jointly confirm each new monarch, as some argued in 1866 when Romania first chose a foreign prince. A third simply wants the matter postponed."
 ROM_regime.1.a:0 "A dynastic heir, trained for the throne."
 ROM_regime.1.b:0 "Parliament confirms every monarch."
 ROM_regime.1.c:0 "Postpone it. The Custodian is in good health."
 ROM_regime.2.t:0 "Who Commands the Committee?"
 ROM_regime.2.d:0 "General Vlad has offered his resignation. The senior officers can elect his successor from among themselves, rotate the chairmanship between the services every two years, or, if the army has already stepped back, let the civilian government appoint the Chief of the Defence Staff like any other official."
 ROM_regime.2.a:0 "The generals elect one of their own."
 ROM_regime.2.b:0 "Rotate the chair between the services."
 ROM_regime.2.c:0 "The government appoints him. The army serves."
 ROM_regime.3.t:0 "The Patriarchal Succession"
 ROM_regime.3.d:0 "The Holy Synod has met in the Patriarchal Palace for three days. The reformers have a candidate who promises to give the state back to laymen once the regency's work is done. The hardliners have one who believes the regency is the work. The vote is close, and the regency can still tip it."
 ROM_regime.3.a:0 "The reformer is elected."
 ROM_regime.3.b:0 "The hardliner is elected."
 ROM_corrupt.1.t:0 "The Leaked Contract"
 ROM_corrupt.1.d:0 "An investigative site has published a contract for a regional hospital wing, priced at three times the going rate and awarded to a company registered six weeks before the tender. Its founder is a former adviser in the ministry that signed it."
 ROM_corrupt.1.a:0 "Open a full inquiry, whoever it reaches."
 ROM_corrupt.1.b:0 "Deny everything. The site is a political tool."
 ROM_corrupt.1.c:0 "Sacrifice the deputy minister who signed it."
 ROM_corrupt.2.t:0 "Embezzlement at a State Company"
 ROM_corrupt.2.d:0 "Auditors at one of the state energy companies have found that a maintenance budget of several hundred million lei was paid, year after year, to contractors who did no maintenance. The directors were all appointed by the parties of the governing coalition."
 ROM_corrupt.2.a:0 "Dismiss the board and list the company on the exchange."
 ROM_corrupt.2.b:0 "Replace the board with our own people."
 ROM_corrupt.2.c:0 "Let the courts handle it, slowly."
 ROM_corrupt.3.t:0 "The Diluted Disinfectant"
 ROM_corrupt.3.d:0 "Hospitals across the country have been buying disinfectant from a single supplier for a decade. A university laboratory has tested it: it was diluted up to ten times. Patients' families are gathering outside the Ministry of Health."
 ROM_corrupt.3.a:0 "Arrest the suppliers and the officials who protected them."
 ROM_corrupt.3.b:0 "Close the supplier quietly and change the subject."
 ROM_corrupt.3.c:0 "The Minister of Health resigns."
 ROM_corrupt.4.t:0 "A Whistleblower Comes Forward"
 ROM_corrupt.4.d:0 "A mid-level official in the Ministry of Development has handed prosecutors three years of emails showing how European funds were divided between county barons before the competitions were even announced. She has asked for protection."
 ROM_corrupt.4.a:0 "Protect her and let the case run."
 ROM_corrupt.4.b:0 "Thank her publicly; manage the case privately."
 ROM_corrupt.4.c:0 "Discredit her. Leak her own file."
 ROM_corrupt.5.t:0 "The Network Unravels"
 ROM_corrupt.5.d:0 "The investigation has followed the money further than anyone expected: through consultancy firms in Cyprus, a football club and two county councils, to a former minister and a sitting senator of the governing majority. The prosecutors want to press charges."
 ROM_corrupt.5.a:0 "Let it run to the end."
 ROM_corrupt.5.b:0 "Charge the businessmen, spare the politicians."
 ROM_corrupt.5.c:0 "Close the file in the national interest."
 ROM_corrupt.6.t:0 "Scandal at the Heart of Government"
 ROM_corrupt.6.d:0 "Prosecutors have asked Parliament to lift the immunity of the Prime Minister himself, over contracts awarded while he ran a ministry. Tens of thousands are in Victoria Square with phone torches raised, as they were in 2017. The coalition partners are already discussing his replacement."
 ROM_corrupt.6.a:0 "The Prime Minister resigns. A new cabinet takes over."
 ROM_corrupt.6.b:0 "Reshuffle the cabinet and keep the Prime Minister."
 ROM_corrupt.6.c:0 "Ride it out. Parliament will not lift his immunity."
 ROM_corrupt.7.t:0 "The Buried File Resurfaces"
 ROM_corrupt.7.d:0 "The case the government thought it had buried has reappeared on the front page, complete with the names of the officials who made it disappear. The protected whistleblower who leaked it is untouchable under the government's own law."
 ROM_corrupt.7.a:0 "Accept responsibility and reopen the case."
 ROM_corrupt.7.b:0 "Deny it and attack the press."
 ROM_corrupt.8.t:0 "The Missing Billions"
 ROM_corrupt.8.d:0 "The Court of Accounts, using its new binding powers for the first time, has found the government's discretionary fund. Billions of lei were spent with no contracts, no receipts and no record of who approved them."
 ROM_corrupt.8.a:0 "Publish the audit and prosecute."
 ROM_corrupt.8.b:0 "Classify the audit as a matter of national security."
 ROM_corrupt.9.t:0 "The Offset Contract"
 ROM_corrupt.9.d:0 "A defence procurement contract promised that a share of the armoured vehicles would be built in Romania. None were. Instead the offset money went to a logistics firm owned by a retired general who now advises the Ministry of Defence. Officers who raised it internally were transferred."
 ROM_corrupt.9.a:0 "Military prosecutors take the case, whatever it costs the army."
 ROM_corrupt.9.b:0 "Renegotiate the contract quietly. The state must not look weak."
 ROM_corrupt.9.c:0 "Blame the foreign supplier and cancel the contract."
 ROM_corrupt.10.t:0 "The County Baron"
 ROM_corrupt.10.d:0 "The AUR president of a county council, who joined the party only after the election, has been filmed explaining to a businessman how much each public contract in his county costs. The movement's own activists are demanding his expulsion; the party machine says he delivers the county."
 ROM_corrupt.10.a:0 "Expel him. The movement must stay clean."
 ROM_corrupt.10.b:0 "Protect him. We do not hand our people to the system."
 ROM_corrupt.11.t:0 "Colonels in Business"
 ROM_corrupt.11.d:0 "A colonel's construction firm has won every barracks contract in Moldavia for two years. His brother-in-law signs the acceptance reports. Junior officers have started asking, in writing, why their own pay arrives late."
 ROM_corrupt.11.a:0 "Court-martial him as an example."
 ROM_corrupt.11.b:0 "Promote him away and look after the junior officers' pay."
 ROM_corrupt.11.c:0 "The army looks after its own."
 ROM_corrupt.12.t:0 "The Bishop's Accounts"
 ROM_corrupt.12.d:0 "Relief money meant for parish soup kitchens in one diocese paid instead for a bishop's residence and several cars. The faithful who queued at the kitchens are the ones who noticed."
 ROM_corrupt.12.a:0 "The Synod disciplines the bishop publicly."
 ROM_corrupt.12.b:0 "Settle it inside the Church."
 ROM_corrupt.13.t:0 "A Courtier's Commissions"
 ROM_corrupt.13.d:0 "A favourite of the court has been collecting commissions from companies seeking royal patronage for their projects. The palace's critics call it the oldest corruption in the world."
 ROM_corrupt.13.a:0 "Banish him from court and repay the money."
 ROM_corrupt.13.b:0 "A misunderstanding. The palace stands by its friends."
 ROM_corrupt.14.t:0 "A Government of Thieves"
 ROM_corrupt.14.d:0 "Corruption has stopped being a scandal and become the system. Depots report equipment that does not exist, budgets vanish into front companies, and the crowds in the squares no longer demand reforms: they demand that the government go. Foreign lenders have suspended talks. Unless the state cleans itself up now, it may not survive the year."
 ROM_corrupt.14.a:0 "Emergency clean-up: dismiss half the government."
 ROM_corrupt.14.b:0 "Promise reform and play for time."
 ROM_corrupt.14.c:0 "Crush the protests."
 ROM_corrupt.15.t:0 "Names in the Ledger"
 ROM_corrupt.15.d:0 "Even the new order has its thieves. A councillor of the Voivode's own Order has been selling exemptions from the oath. The old families are watching to see whether the Voivode's justice applies to his own."
 ROM_corrupt.15.a:0 "Make an example of him before the Order."
 ROM_corrupt.15.b:0 "He is useful. Let him keep his secret, for a price."
 ROM_corrupt.16.t:0 "The Investigation Stalls"
 ROM_corrupt.16.d:0 "Witnesses have changed their statements, key documents were 'lost in a flood' at a county archive and the lead prosecutor has accepted a post in Brussels. The investigation produced some convictions of minor figures, and nothing more."
 ROM_corrupt.16.a:0 "We tried."
 ROM_corrupt.30.t:0 "The Rot Spreads"
 ROM_corrupt.30.d:0 "Corruption in Romania is now severe. Foreign investors have started pricing in bribes, and the government's own auditors no longer bother to report what they find. From now on scandals will come regularly unless the state finds the will to clean itself up."
 ROM_corrupt.30.a:0 "We will deal with it."
 ROM_corrupt.30.b:0 "Everyone does it."
 ROM_corrupt.31.t:0 "A Captured State"
 ROM_corrupt.31.d:0 "Corruption in Romania is systemic. The state's institutions now serve the networks that have captured them. If nothing changes within a few months, the government will face a crisis it may not survive."
 ROM_corrupt.31.a:0 "Then something must change."
 ROM_news.1.t:0 "A New President at Cotroceni"
 ROM_news.1.d:0 "Romania has sworn in a new president. [ROM.GetLeader] takes office after one of the most turbulent campaigns in the country's history, with a deficit near nine percent, a war across the northern border and voters who no longer trust easily. Allies in Brussels and Washington say they look forward to working with the new administration."
 ROM_news.1.a:0 "We will see what kind of president Romania has chosen."
 ROM_news.2.t:0 "Romania and Moldova Unite"
 ROM_news.2.d:0 "Voters on both banks of the Prut have approved the union of Romania and Moldova. Flags in the same three colours fly from Iasi to Chisinau, and the European Union has gained three million citizens overnight. Moscow has called the referendum illegitimate; Kyiv and most European capitals have congratulated both governments."
 ROM_news.2.a:0 "A border in Europe has disappeared."
 ROM_news.3.t:0 "Chisinau Says No to Union"
 ROM_news.3.d:0 "The Moldovan government has rejected Bucharest's proposal of union. Moldova, its prime minister said, will join Europe as a sovereign state. Unionists on both banks are bitterly disappointed, and observers are watching how Bucharest will respond."
 ROM_news.3.a:0 "Moldova remains Moldova, for now."
 ROM_news.4.t:0 "Greater Romania Proclaimed at Alba Iulia"
 ROM_news.4.d:0 "Before a crowd of half a million in Alba Iulia, the President of Romania has declared the borders of 1918 the only legitimate borders of the Romanian nation and announced that Romania is leaving its military alliances. Ukraine, Moldova and Bulgaria have recalled their ambassadors; NATO has called an emergency meeting."
 ROM_news.4.a:0 "Europe has a new problem."
 ROM_news.5.t:0 "Bucharest Lays Claim to Northern Bukovina"
 ROM_news.5.d:0 "Romania has formally demanded the return of Northern Bukovina, part of Ukraine since 1940, while Ukraine is still fighting for its survival. Kyiv called the claim 'a knife in the back'; Romania's allies have condemned it in unusually blunt terms."
 ROM_news.5.a:0 "An ally has become a claimant."
 ROM_news.12.t:0 "Romania Declares a State of Emergency"
 ROM_news.12.d:0 "Citing drone incursions, sabotage and a hybrid campaign against its infrastructure, the Romanian government has declared a nationwide state of emergency and assumed powers to govern by decree. Opposition parties and civil-liberties groups warn that thirty days can easily become a habit."
 ROM_news.12.a:0 "Extraordinary times, extraordinary powers."
 ROM_news.13.t:0 "Romania Lifts Its State of Emergency"
 ROM_news.13.d:0 "President Antonescu has gone before Parliament to hand back the emergency powers granted to his government. Bucharest's markets rose on the news, and European governments praised what one foreign minister called 'a lesson in how to step back from the brink'."
 ROM_news.13.a:0 "Normal politics resumes in Bucharest."
 ROM_news.14.t:0 "A Permanent American Brigade for Romania"
 ROM_news.14.d:0 "Washington and Bucharest have signed an agreement stationing a permanent US armoured brigade at Mihail Kogalniceanu, near Constanta. It is the largest permanent American deployment in south-eastern Europe since the Cold War, and a clear signal about who guards NATO's Black Sea flank."
 ROM_news.14.a:0 "The Black Sea flank is no longer temporary."
 ROM_news.15.t:0 "Romanians Back the Sovereignty Referendum"
 ROM_news.15.d:0 "Fifty-eight percent of Romanian voters have approved the government's referendum on the primacy of the Romanian constitution over foreign treaties and courts. The European Commission says it is studying the consequences; the President calls it the clearest mandate any Romanian government has received since 1989."
 ROM_news.15.a:0 "Bucharest has a mandate. Brussels has a headache."
 ROM_news.16.t:0 "Sovereignty Referendum Fails in Romania"
 ROM_news.16.d:0 "Romania's sovereignty referendum has failed: turnout fell short and a majority of those who voted said no. Opposition leaders are demanding early elections, and the governing movement is divided over who is to blame."
 ROM_news.16.a:0 "The movement asked for everything and got nothing."
 ROM_news.17.t:0 "Romania Adopts the Euro"
 ROM_news.17.d:0 "After two years in the exchange-rate mechanism and a deficit brought below three percent, Romania has adopted the euro. Its leu, introduced in 1867, has been retired. Analysts called the transition one of the most disciplined in the eurozone's history."
 ROM_news.17.a:0 "Another star for the euro."
 ROM_news.18.t:0 "Nicusor Dan Re-elected"
 ROM_news.18.d:0 "Romanian voters have given President Nicusor Dan a second term, rewarding five years of fiscal repair, digital government and anti-corruption reform. European leaders called the result proof that reform can win elections in the region."
 ROM_news.18.a:0 "Reform survives the ballot box."
 ROM_news.19.t:0 "The Bucharest Format Summit"
 ROM_news.19.d:0 "Heads of government from NATO's eastern flank have met in Bucharest and agreed a permanent secretariat for the group in the Romanian capital. Romania, long seen as the quiet member of the eastern flank, is now its convenor."
 ROM_news.19.a:0 "The eastern flank meets in Bucharest."
 ROM_news.20.t:0 "Scandal Shakes the Romanian Government"
 ROM_news.20.d:0 "Prosecutors have asked Parliament to lift the immunity of Romania's Prime Minister over contracts awarded while he ran a ministry. Tens of thousands of protesters have filled Victoria Square, and the governing coalition is discussing his replacement."
 ROM_news.20.a:0 "Romania and corruption: again."
 ROM_news.21.t:0 "'Thieves!': Romania's Corruption Crisis"
 ROM_news.21.d:0 "Corruption in Romania has reached a level that observers now describe as systemic. Crowds outside the government building chant 'Thieves!', foreign lenders have suspended talks and the European Commission has warned of consequences. Few believe the government can reform itself."
 ROM_news.21.a:0 "A state captured from within."
 ROM_news.22.t:0 "Romanian Generals Return to the Barracks"
 ROM_news.22.d:0 "Romania's National Defence Committee has announced elections and a new constitution, and the army will return to its constitutional role. Diplomats have welcomed the decision, while noting that the officers have kept a guaranteed say over defence and security."
 ROM_news.22.a:0 "The soldiers step back."
 ROM_news.23.t:0 "Romania Gets an Iron Government"
 ROM_news.23.d:0 "The military committee that took power in Bucharest during the revolution has made itself permanent. There will be no elections, emergency laws have become ordinary statutes and Romania is now governed by a Directorate of generals."
 ROM_news.23.a:0 "The emergency becomes the regime."
 ROM_news.24.t:0 "Romania's Church Regency Consolidates"
 ROM_news.24.d:0 "The patriarchal regency that has governed Romania since the revolution has declared the national awakening complete. Churches are full and the villages busier than in decades. Minority communities and secular groups are watching anxiously to see what comes next."
 ROM_news.24.a:0 "Faith and state, bound together in Bucharest."
 ROM_news.26.t:0 "A Sovereign Romania in Europe"
 ROM_news.26.d:0 "Romania's nationalist government has completed its term inside both the European Union and NATO, and on its own terms. Critics who predicted isolation have had to revise their forecasts; supporters call it proof that sovereignty and partnership are compatible."
 ROM_news.26.a:0 "Sovereign, and still at the table."
 ROM_news.30.t:0 "Mystery at Snagov"
 ROM_news.30.d:0 "Romanian authorities have closed the island monastery of Snagov, near Bucharest, to visitors and archaeologists 'for structural reasons'. Local villagers report military vehicles on the lake shore at night, and the long-promised presidential election has been postponed again on grounds of national security."
 ROM_news.30.a:0 "What is Bucharest hiding at Snagov?"
 ROM_news.31.t:0 "Disappearances in the Carpathians"
 ROM_news.31.d:0 "Shepherds, hikers and a team of geologists have vanished in the Arges valley below the ruins of Poenari. Romanian police have sealed the area. Several foreign journalists who tried to reach it were turned back at checkpoints manned by soldiers without unit insignia."
 ROM_news.31.a:0 "Something is happening in the mountains."
 ROM_news.32.t:0 "The Night at Poenari"
 ROM_news.32.d:0 "Every light in Wallachia went out for eleven minutes last night. Seismographs in Sofia and Budapest recorded a tremor with no epicentre. In the morning the Romanian government announced, without explanation, that 'the Voivode has returned'. Foreign intelligence services are still arguing about what that means."
 ROM_news.32.a:0 "This is not possible."
 ROM_news.33.t:0 "A Voivode Rules in Bucharest"
 ROM_news.33.d:0 "The interim government of Romania has dissolved itself and transferred its powers to a figure its decrees call only 'the Voivode'. Diplomats who have met him describe a man of great courtesy and no reflection in any mirror of the Cotroceni Palace. Several embassies have quietly begun evacuating their families."
 ROM_news.33.a:0 "Romania has a new master."
 ROM_news.34.t:0 "The Containment Conference"
 ROM_news.34.d:0 "Heads of government have met in emergency session to discuss 'the Romanian situation'. The communique speaks of sanctions, travel bans and 'unconventional threats'. Off the record, several delegations admit they do not know what weapons would work."
 ROM_news.34.a:0 "The world draws a line around Romania."
 ROM_news.35.t:0 "The Night Legions"
 ROM_news.35.d:0 "Satellite images show Romanian units moving only after sunset, without lights, at speeds no armoured column should reach. Soldiers who have faced them describe men who do not fall when shot. Military attaches in Bucharest have stopped sending routine reports."
 ROM_news.35.a:0 "Armies that march only in the dark."
 ROM_news.36.t:0 "The Empire of the Night"
 ROM_news.36.d:0 "From the Carpathians to the Black Sea, the Voivode's dominion no longer pretends to be a republic. His banners fly over every county seat, his Order governs in the old palaces, and the nights belong to his legions. Whatever Romania was in 2025, it is something else now."
 ROM_news.36.a:0 "The night has an empire."
 ROM_news.37.t:0 "The Dawn Accord"
 ROM_news.37.d:0 "In a ceremony at Bran held, by agreement, at sunrise, Romania and the powers that once sought to contain it have signed an accord. The Voivode retains his dominion; in return he has sworn to keep his legions within its borders. Nobody pretends the peace is comfortable, but for the first time in years it seems possible."
 ROM_news.37.a:0 "An uneasy dawn over the Carpathians."
 ROM_drac.1.t:0 "Not Dead. Waiting."
 ROM_drac.1.d:0 "The head of the excavation reports in person, at night, to the interim president. The coffin is empty. The inscription is genuine. The SRI wants the find classified at the highest level and the archaeologists kept under watch; the scientists want to publish, quietly, in a journal nobody reads."
 ROM_drac.1.a:0 "Classify everything. Nobody leaves the island."
 ROM_drac.1.b:0 "Let the scientists work, under supervision."
 ROM_drac.2.t:0 "The Parties Demand an Election"
 ROM_drac.2.d:0 "Every party leader has signed a joint letter: the rerun must be held within ninety days or Parliament will suspend the interim president. The SRI suggests briefing a few of them, carefully; the interim president's lawyers suggest a state of emergency."
 ROM_drac.2.a:0 "Brief the party leaders and make them accomplices."
 ROM_drac.2.b:0 "Declare a security emergency and postpone the vote."
 ROM_drac.3.t:0 "The Arges Vanishings"
 ROM_drac.3.d:0 "Seven people are missing in the Arges valley. The families want answers, the press wants pictures and the army wants to know what it is guarding. The cave entrance has been sealed with concrete, and the concrete is cracked from the inside."
 ROM_drac.3.a:0 "A chemical leak. Evacuate the valley."
 ROM_drac.3.b:0 "Say nothing. Seal the area and wait."
 ROM_drac.3.c:0 "Send Unit Zero into the cave."
 ROM_drac.4.t:0 "The Interim President's Choice"
 ROM_drac.4.d:0 "Ilie Bolojan has listened to the briefing without interrupting. When it ends he asks one question: whether anyone in the room has considered that the thing in the mountain should stay asleep. Nobody answers. He can stay and give the project his signature, or he can resign and let the Brotherhood's men take his place."
 ROM_drac.4.a:0 "He stays. The project keeps a constitutional face."
 ROM_drac.4.b:0 "He resigns. The Brotherhood takes the government."
 ROM_drac.5.t:0 "Accidents in the Valley"
 ROM_drac.5.d:0 "Something in the chamber is feeding. The guards are rotated every week now and the medical officer has stopped writing reports. The project's leaders must decide how much risk they will accept to finish the work."
 ROM_drac.5.a:0 "Double the guard and slow the work."
 ROM_drac.5.b:0 "Accept the losses. Finish it."
 ROM_drac.5.c:0 "Bring him blood from the hospital banks."
 ROM_drac.8.t:0 "The First Audience"
 ROM_drac.8.d:0 "He asks the ministers what Romania is now. They tell him about Parliament, the constitution, NATO and the European Union. He listens with great courtesy and then asks which of them commands the army. The answer he receives will shape everything that follows."
 ROM_drac.8.a:0 "Kneel. Romania is his."
 ROM_drac.8.b:0 "Offer him the throne within limits he swears to keep."
 ROM_drac.9.t:0 "The Church and the Voivode"
 ROM_drac.9.d:0 "The Patriarch arrives at Cotroceni carrying a cross and leaves carrying a decision. The Voivode reminds him that he founded more monasteries than any prince of his age. He asks only for the Church's blessing, or its silence."
 ROM_drac.9.a:0 "The Church blesses him."
 ROM_drac.9.b:0 "The Church resists. Close the seminaries."
 ROM_drac.10.t:0 "The Partisans of Dawn"
 ROM_drac.10.d:0 "A convoy of the Order has been ambushed at noon on the road to Pitesti. The partisans left a message: they will fight until the Voivode goes back to his grave. His councillors await his answer."
 ROM_drac.10.a:0 "Mercy: amnesty for those who lay down their arms."
 ROM_drac.10.b:0 "Fear: hunt them down, by night."
 ROM_drac.11.t:0 "The Price of the Host"
 ROM_drac.11.d:0 "The Host costs Romania more than money. Blood banks are empty, the countryside is losing its young men and the neighbours are buying silver ammunition by the ton. His advisers suggest the Host could be smaller; his generals suggest it could be larger."
 ROM_drac.11.a:0 "Larger. The world is coming."
 ROM_drac.11.b:0 "Smaller, but better."
 ROM_drac.11.c:0 "Let the Host feed on the enemy, not on Romania."
 ROM_drac.12.t:0 "The Coalition of Daylight"
 ROM_drac.12.d:0 "The coalition's governments have sent the Voivode a joint note. They demand that the Host be disbanded, the Order dissolved and elections held under international supervision. They have not said what they will do if he refuses, and they have not needed to."
 ROM_drac.12.a:0 "Refuse. Let them come by day; we will answer by night."
 ROM_drac.12.b:0 "Negotiate. Time is on our side."
 ROM_drac.13.t:0 "The Daylight Rises"
 ROM_drac.13.d:0 "Fear has gone too far. Across Moldavia and Transylvania the population is rising at noon, when the Host is weakest: barracks burned, roads blocked, members of the Order dragged from their offices. If the Voivode wants to keep his country, he must decide how."
 ROM_drac.13.a:0 "Concessions and amnesty."
 ROM_drac.13.b:0 "Crush the rising."
 ROM_drac.14.t:0 "The World Starts to Ask"
 ROM_drac.14.d:0 "Too many lights have gone out, too many people have vanished and too many foreign agents have filed reports that their superiors could not believe. Embassies are asking questions that cover stories no longer answer. Romania's neighbours have started to watch it very closely."
 ROM_drac.14.a:0 "Let them ask."
 ROM_drac.15.t:0 "The Last Door"
 ROM_drac.15.d:0 "The second chamber under Snagov is small and bare. On its far wall is a door of black stone with no handle, carved with the same dragon as the seal, and behind it the Voivode's councillors can hear something breathing. He tells them he has been listening to it for a year. He tells them it is older than he is, and that it was the one who made him what he is. He asks them whether he should open it."
 ROM_drac.15.a:0 "Leave it closed. Some things should sleep."
 ROM_drac.15.b:0 "Open the door."
 dve_rom.5.a:0 "Nicusor Dan wins the presidency."
 dve_rom.5.b:0 "Crin Antonescu wins the presidency."
 dve_rom.5.c:0 "George Simion wins the presidency."
 dve_rom.5.e:0 "No candidate wins a clear mandate."
 dve_rom.6.a:0 "We shall fight!"
 dve_rom.7.a:0 "An interesting choice."
 ROM_the_january_strikes:0 "The January Strikes"
 ROM_the_january_strikes_desc:0 "Police, railway workers, miners and public employees are striking against frozen wages and the austerity ordinance."
 ROM_stagnated_economy:0 "A Stagnant Economy"
 ROM_stagnated_economy_desc:0 "The government has chosen caution over reform. Growth has stalled, but nothing new has broken."

