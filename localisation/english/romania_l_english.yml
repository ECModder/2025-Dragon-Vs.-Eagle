 ROM_coastal_missiles_idea:0 "Coastal Missile Batteries"
 ROM_coastal_missiles_idea_desc:0 "No hostile fleet sits off Constanta."
 ROM_eez_patrol_idea:0 "The Guarded Zone"
 ROM_eez_patrol_idea_desc:0 "Platforms, cables and wind farms under watch."
