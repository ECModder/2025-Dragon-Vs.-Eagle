 ROM_parliament_category:0 "The Parliamentary Majority"
 ROM_parliament_category_desc:0 "The government currently counts on §Y[?ROM_majority|0]§! of 100 seats. Above 50, every seat adds political power and stability; below 50, every missing seat costs them."
 ROM_court_independent_deputies:0 "Court Independent Deputies"
 ROM_court_independent_deputies_desc:0 "A county council chair here, an embassy there: the old arithmetic of Romanian coalitions."
 ROM_reshuffle_the_cabinet:0 "Reshuffle the Cabinet"
 ROM_reshuffle_the_cabinet_desc:0 "New ministers from the parties whose votes the government needs. The ones who lose their jobs will not forget it."
 ROM_address_the_nation:0 "Address the Nation"
 ROM_address_the_nation_desc:0 "A televised address from Cotroceni to put pressure on Parliament from outside."
 ROM_margareta:0 "Margareta of Romania"
 ROM_margareta_desc:0 "Eldest daughter of King Michael I and Custodian of the Crown since 2017. For decades she has represented the Royal House through charity and quiet diplomacy, never through politics. That has now changed."
 ROM_gheorghita_vlad:0 "Gheorghita Vlad"
 ROM_gheorghita_vlad_desc:0 "Chief of the Defence Staff, a career officer who commanded Romanian contingents abroad and oversaw the army's rearmament after 2022. He never sought political power and has now taken it."
 ROM_patriarch_daniel:0 "Patriarch Daniel"
 ROM_patriarch_daniel_desc:0 "Head of the Romanian Orthodox Church since 2007, a theologian and a skilled administrator who built the People's Salvation Cathedral. He accepted the regency, he says, only because nobody else could be trusted with it."

 # ===== Corruption, path mechanics and the Snagov Files =====
 ROM_corr_tier_1:0 "§GControlled§!"
 ROM_corr_tier_2:0 "§YNoticeable§!"
 ROM_corr_tier_3:0 "§OWidespread§!"
 ROM_corr_tier_4:0 "§RSevere§!"
 ROM_corr_tier_5:0 "§RSystemic§!"
 ROM_corr_label:0 "Corruption"
 ROM_corr_label_drac:0 "Rot in the Old Institutions"
 ROM_corr_reforms_full:0 "Audits, open procurement and a professional civil service are in place."
 ROM_corr_reforms_some:0 "Binding audits are in place; the rest of the reform agenda is unfinished."
 ROM_corr_reforms_none:0 "No lasting integrity reforms have been passed yet."
 ROM_corruption_category:0 "[ROM_GetCorruptionLabel]: [?ROM_corruption|0] / 100"
 ROM_corruption_category_desc:0 "[ROM_GetCorruptionLabel] is currently [ROM_GetCorruptionTier] (§Y[?ROM_corruption|0]§! of 100).\n\n§Y0-19§! Controlled  §Y20-39§! Noticeable  §Y40-59§! Widespread  §Y60-79§! Severe  §Y80-100§! Systemic\n\nPatronage creeps upward on its own every month unless institutions push back. Above §Y40§! scandals can break at any time, and they come more often in every higher band and for every investigation you have buried. Above §Y60§! entrenched networks blunt every clean-up unless whistleblowers are protected. Three months above §Y80§! put the government itself in danger.\n\n[ROM_GetCorruptionReforms]"
 ROM_corr_audit_contracts:0 "Audit the Public Contracts"
 ROM_corr_audit_contracts_desc:0 "Freeze every open public contract until the auditors have read it. The dishonest ones will be cancelled; the honest ones will simply be late."
 ROM_corr_replace_officials:0 "Replace Compromised Officials"
 ROM_corr_replace_officials_desc:0 "Prefects, agency heads and state-company directors named in prosecutors' files are dismissed. Their patrons in Parliament will remember."
 ROM_corr_investigate_network:0 "Investigate a Political Network"
 ROM_corr_investigate_network_desc:0 "Give prosecutors three months, wiretap warrants and political cover to follow the money behind one of the great patronage networks. Nobody knows in advance whose names they will find."
 ROM_corr_donations:0 "Scrutinise Party Donations"
 ROM_corr_donations_desc:0 "Every donation above a modest threshold published within a week, and the electoral authority given the power to check where it came from. Every party treasurer in Bucharest is unhappy."
 ROM_corr_reform_audit:0 "Binding Powers for the Court of Accounts"
 ROM_corr_reform_audit_desc:0 "The Court of Accounts finds hundreds of irregularities every year and can do almost nothing about them. Making its findings binding would turn reports into consequences.\n\n§YEffect:§! every future increase in corruption is §G25%§! smaller."
 ROM_corr_reform_eproc:0 "Open e-Procurement"
 ROM_corr_reform_eproc_desc:0 "Every tender, bid and contract published online in a format anyone can search. Journalists and rival bidders become the cheapest auditors the state has ever had.\n\n§YEffect:§! every future clean-up is §G20%§! more effective and procurement scandals are rarer."
 ROM_corr_reform_whistle:0 "Whistleblower Protection Act"
 ROM_corr_reform_whistle_desc:0 "Officials who report wrongdoing keep their jobs, their pensions and their anonymity. More scandals will surface, and fewer of them will be the government's choice.\n\n§YEffect:§! high corruption no longer blunts clean-ups; whistleblower disclosures become more frequent; burying investigations becomes risky."
 ROM_corr_reform_civil:0 "Statute of the Professional Civil Service"
 ROM_corr_reform_civil_desc:0 "Every senior post filled by open competition and protected from dismissal after an election. The ministries will be half-empty for months, and the party machines will lose their most valuable currency.\n\n§YEffect:§! corruption drifts down on its own and new graft is §G20%§! smaller."
 ROM_corr_reform_agency:0 "An Independent Integrity Agency"
 ROM_corr_reform_agency_desc:0 "A single agency with its own prosecutors, a budget Parliament cannot cut and a director who cannot be dismissed by the government that appointed her.\n\n§YEffect:§! corruption drifts down every month."
 ROM_corr_reward_supporters:0 "Reward Loyal Supporters"
 ROM_corr_reward_supporters_desc:0 "Board seats, consultancies and county posts for the people who delivered the vote. Loyalty is cheap when the state pays for it."
 ROM_corr_steer_contracts:0 "Steer Contracts to Friendly Firms"
 ROM_corr_steer_contracts_desc:0 "The tenders will go to companies the government knows and trusts. Projects will be finished on time, and some of the money will find its way back to the people who arranged it."
 ROM_corr_bury_investigation:0 "Bury an Investigation"
 ROM_corr_bury_investigation_desc:0 "A file goes missing, a prosecutor is promoted to somewhere far away, and a case that threatened the government quietly expires. It will not stay buried forever."
 ROM_corr_discretionary_fund:0 "The Discretionary Fund"
 ROM_corr_discretionary_fund_desc:0 "An off-budget reserve, administered by people the government trusts, for the things that cannot wait for Parliament. It works beautifully until somebody audits it."
 ROM_corr_media_spin:0 "A Friendly Media Campaign"
 ROM_corr_media_spin_desc:0 "Advertising contracts for the channels that report the government kindly, and none for the ones that do not. The scandals do not go away, but fewer people hear about them."
 ROM_corr_dan_asset_registry:0 "Open Asset Declarations"
 ROM_corr_dan_asset_registry_desc:0 "Every deputy, minister and senior official publishes what they own, searchable by anyone. Dan's voters cheer; Parliament votes for it through gritted teeth."
 ROM_corr_dan_lift_immunity:0 "Lift Parliamentary Immunity"
 ROM_corr_dan_lift_immunity_desc:0 "Deputies under investigation will no longer hide behind a vote of their colleagues. It is the reform Romanians have demanded for twenty years, and the one most likely to break the government's majority."
 ROM_corr_ant_state_control:0 "The Corps of State Control"
 ROM_corr_ant_state_control_desc:0 "A presidential inspectorate with the right to enter any ministry, county council or state company unannounced. Graft falls; so does the independence of everyone it inspects.\n\n§YEffect:§! corruption drifts down every month; public consent falls."
 ROM_corr_ant_procurement_review:0 "CSAT Procurement Review"
 ROM_corr_ant_procurement_review_desc:0 "The Supreme Defence Council reopens every arms contract signed since 2022 and checks each offset clause line by line. The factories will wait."
 ROM_corr_ant_offsets:0 "Generous Offset Deals"
 ROM_corr_ant_offsets_desc:0 "Foreign arms makers promise Romanian jobs and deliver early, provided the contracts are not read too closely by anyone outside the ministry."
 ROM_corr_sim_loyalty_commission:0 "The Party Integrity Commission"
 ROM_corr_sim_loyalty_commission_desc:0 "AUR expels the county organisers caught selling posts and contracts. The movement looks cleaner, and its own machine starts counting enemies."
 ROM_corr_sim_county_barons:0 "Lean on the County Barons"
 ROM_corr_sim_county_barons_desc:0 "The local bosses who switched to AUR after the election bring their networks, their mayors and their habits. The party machine grows stronger every time the government asks them for a favour."
 ROM_corr_sim_citizens_audit:0 "The Citizens' Audit"
 ROM_corr_sim_citizens_audit_desc:0 "Public hearings, televised from the regions, into thirty years of privatisations and contracts. Some of what they uncover is real; some is political theatre. Both keep the movement in the streets."
 ROM_corr_crown_audit_chamber:0 "The Royal Audit Chamber"
 ROM_corr_crown_audit_chamber_desc:0 "A chamber of auditors sworn to the Crown, independent of the ministries. It counts as binding audit powers."
 ROM_corr_crown_court_favours:0 "Favours of the Court"
 ROM_corr_crown_court_favours_desc:0 "Titles, honours and royal patronage for the families who backed the restoration. The court grows, and so does the queue of those who expect something from it."
 ROM_corr_junta_tribunals:0 "Military Tribunals for Embezzlement"
 ROM_corr_junta_tribunals_desc:0 "Embezzlement of public money is tried by court martial, in weeks rather than years. Convictions are fast; so is the fear spreading through every office in Bucharest."
 ROM_corr_junta_enterprises:0 "The Officers' Enterprises"
 ROM_corr_junta_enterprises_desc:0 "Army-owned construction firms, hotels and import companies, run by colonels and exempt from inspection. They pay for the army's loyalty, and for a great deal else."
 ROM_corr_church_synod_ethics:0 "The Synodal Ethics Commission"
 ROM_corr_church_synod_ethics_desc:0 "Bishops, lay auditors and a retired judge review the finances of every diocese, ministry and cooperative the regency controls.\n\n§YEffect:§! corruption drifts down every month."
 ROM_corr_church_parish_funds:0 "Parish Fund Patronage"
 ROM_corr_church_parish_funds_desc:0 "State relief flows through the parishes that preach most loudly for the regency. Loyalty is rewarded; so is a certain looseness in the accounts."
 ROM_corr_crt_integrity_pledge:0 "The Interim Integrity Pledge"
 ROM_corr_crt_integrity_pledge_desc:0 "A caretaker government cannot pass great reforms, but it can freeze appointments, publish its contracts and refuse to hand out favours before the rerun."
 ROM_corr_drac_ledger:0 "Open the Count's Ledger"
 ROM_corr_drac_ledger_desc:0 "Every official's debts, bribes and secrets, written in a hand five centuries old. Those whose names appear are given one chance to confess. Few need a second warning."
 ROM_corr_drac_old_families:0 "Feed the Old Families"
 ROM_corr_drac_old_families_desc:0 "The boyar families who kept the secret for generations expect their reward: estates, contracts and seats in the new councils."
 ROM_corr_drac_blood_oath:0 "The Oath of Office in Blood"
 ROM_corr_drac_blood_oath_desc:0 "Every prefect, judge and officer swears personal fealty to the Voivode. An oath like that leaves little room for private enterprise.\n\n§YEffect:§! corruption drifts down every month."
 ROM_movement_legitimacy:0 "Movement Legitimacy: [?ROM_legitimacy|0] / 100"
 ROM_movement_legitimacy_desc:0 "Above 50 the movement strengthens the government; below 50 it weakens it."
 ROM_public_consent:0 "Public Consent: [?ROM_consent|0] / 100"
 ROM_public_consent_desc:0 "How much Romanians accept what the strong state asks of them. Above 50 it adds stability and war support; below 50 it costs them."
 ROM_defence_effort_modifier:0 "Defence Effort: level [?ROM_defence_effort|0] of 5"
 ROM_defence_effort_modifier_desc:0 "The share of the national effort devoted to defence."
 ROM_movement_category:0 "The Movement"
 ROM_movement_category_desc:0 "Legitimacy: §Y[?ROM_legitimacy|0]§! / 100\n\nFaction influence: moderates §Y[?ROM_faction_moderates|0]§!, party machine §Y[?ROM_faction_machine|0]§!, radicals §Y[?ROM_faction_radicals|0]§!.\n\nThe strongest faction carries the party congresses and decides which ending the movement can reach. Below §Y25§! legitimacy the country turns against the government."
 ROM_defence_planning_category:0 "National Defence Planning"
 ROM_defence_planning_category_desc:0 "Defence Effort: level §Y[?ROM_defence_effort|0]§! of 5   Public Consent: §Y[?ROM_consent|0]§! / 100\n\nEvery level of effort above 2 wears down public consent each month; below 30 consent turns into open protest. A strong state needs both an arsenal and citizens willing to pay for it."
 ROM_sim_rally:0 "Mobilise the Squares"
 ROM_sim_rally_desc:0 "A national day of rallies in every county capital, with the President speaking in Alba Iulia and the radicals running the stage."
 ROM_sim_diaspora_tour:0 "Tour the Diaspora"
 ROM_sim_diaspora_tour_desc:0 "Madrid, Turin, London and Munich: the President meets the Romanians who left, and who voted for him."
 ROM_sim_promote_moderates:0 "Promote the Moderates"
 ROM_sim_promote_moderates_desc:0 "Ministries and party posts for the Strasbourg wing: competent, respectable and suspicious of the street."
 ROM_sim_promote_radicals:0 "Promote the Radicals"
 ROM_sim_promote_radicals_desc:0 "The organisers of the 2024 protests take over the party's youth wing and its media."
 ROM_sim_train_cadres:0 "Graduate a Cadre Class"
 ROM_sim_train_cadres_desc:0 "A new class of the Party Academy is placed in prefectures, agencies and state companies."
 ROM_sim_open_party:0 "Open the Party to Its Critics"
 ROM_sim_open_party_desc:0 "Televised debates with the opposition and an amnesty for members expelled for disagreeing. The radicals call it surrender."
 ROM_sim_media_offensive:0 "Media Offensive"
 ROM_sim_media_offensive_desc:0 "Friendly channels, influencers and state advertising push the movement's message for a month."
 ROM_ant_raise_effort:0 "Raise the Defence Effort"
 ROM_ant_raise_effort_desc:0 "More money, more contracts and more conscripts for the armed forces. The rest of the budget will feel it."
 ROM_ant_ease_effort:0 "Ease the Defence Effort"
 ROM_ant_ease_effort_desc:0 "Some contracts are postponed and the money returns to schools and hospitals."
 ROM_ant_readiness_exercise:0 "National Readiness Exercise"
 ROM_ant_readiness_exercise_desc:0 "Reservists called up for a week, roads closed for convoys and air-raid sirens tested in every city."
 ROM_ant_explain_budget:0 "Explain the Budget to the Nation"
 ROM_ant_explain_budget_desc:0 "The President, the Chief of the Defence Staff and the Finance Minister answer questions on live television for three hours."
 ROM_ant_call_reserves:0 "Call Up the Reserves"
 ROM_ant_call_reserves_desc:0 "The Mobilisation Law allows the government to call reservists for training at short notice."
 ROM_ant_emergency_requisition:0 "Emergency Requisition Decree"
 ROM_ant_emergency_requisition_desc:0 "Under the state of emergency, fuel, vehicles and factory capacity can be requisitioned by decree."
 ROM_drac_dread_modifier:0 "Dread: [?ROM_dread|0] / 100"
 ROM_drac_dread_modifier_desc:0 "Fear keeps Romania obedient and its rulers powerful. It also empties the universities and frightens every trading partner."
 ROM_snagov_category:0 "The Snagov Files"
 ROM_snagov_category_desc:0 "Veil of Secrecy: §Y[?ROM_veil|0]§! / 100   Preparation of the Rite: §Y[?ROM_ritual|0]§! / 100   Dread: §Y[?ROM_dread|0]§! / 100\n\nEvery step towards the resurrection thins the veil. Below §Y30§! the world will start to ask questions Romania cannot answer. After the resurrection, Dread gives power and obedience, but above §Y70§! it breeds rebellion."
 ROM_vlad_voivode:0 "Vlad III, Voivode of Wallachia"
 ROM_vlad_voivode_desc:0 "Born in Sighisoara around 1431, hostage of the Sultan, three times Voivode of Wallachia, crusader, tyrant and legend. He was supposed to have died in 1476. He did not. He has woken into a country he does not recognise and intends to make it recognise him."
 ROM_drac_dig_targoviste:0 "Excavate the Princely Court at Targoviste"
 ROM_drac_dig_targoviste_desc:0 "The ruins of the court where he ruled hide cellars that were filled in on the Sultan's orders."
 ROM_drac_dig_bran:0 "Search the Crypts of Bran"
 ROM_drac_dig_bran_desc:0 "Bran was never his castle, whatever the tourists are told. Its crypts, though, were used by people who served him."
 ROM_drac_dig_valea_alba:0 "Dig at Valea Alba"
 ROM_drac_dig_valea_alba_desc:0 "On the battlefield where Stephen the Great was beaten in 1476, a mass grave holds more than soldiers."
 ROM_drac_dig_tismana:0 "The Monastery at Tismana"
 ROM_drac_dig_tismana_desc:0 "The oldest monastery in Wallachia kept relics that were never catalogued, and a library that was never burned."
 ROM_drac_buy_silence:0 "Buy the Silence of the Press"
 ROM_drac_buy_silence_desc:0 "Advertising contracts, generous consultancies and a quiet word with the owners of the main channels."
 ROM_drac_cover_story:0 "A Cover Story"
 ROM_drac_cover_story_desc:0 "An earthquake fault, a chemical spill, a smuggling ring: every incident needs an explanation, and the services are getting good at writing them."
 ROM_drac_rare_materials:0 "Acquire Rare Materials"
 ROM_drac_rare_materials_desc:0 "Silver from Baia Mare, salt from Slanic, iron from a gate at Poenari, and other things that are harder to buy."
 ROM_drac_night_rites:0 "The Brotherhood's Night Rites"
 ROM_drac_night_rites_desc:0 "The Brotherhood performs its rites at the sites he knew. Villagers report lights and singing in ruins that have been empty for centuries."
 ROM_drac_lab_trials:0 "Accelerated Laboratory Trials"
 ROM_drac_lab_trials_desc:0 "Laboratory Nine runs its experiments around the clock. The results are remarkable. So are the injuries."
 ROM_drac_hold_court:0 "Hold Court at Poenari"
 ROM_drac_hold_court_desc:0 "Petitioners, vassals and frightened officials climb the fourteen hundred steps to the fortress by torchlight."
 ROM_drac_show_mercy:0 "Show Mercy to the Daylight"
 ROM_drac_show_mercy_desc:0 "Amnesties, released prisoners and a public promise that those who keep the law have nothing to fear. Some even believe it."
 ROM_drac_feast_of_the_order:0 "The Feast of the Order"
 ROM_drac_feast_of_the_order_desc:0 "The vassals of the Order gather at Targoviste for a feast that lasts until dawn. Loyalties are renewed and rewarded."
 ROM_drac_blood_levy:0 "The Levy of the Night"
 ROM_drac_blood_levy_desc:0 "Every county sends its quota of young volunteers to the Host. The quotas are always met."
 ROM_dacia_category:0 "The Dacian Kingdom"
 ROM_form_dacia:0 "Reform Dacia"
 ROM_form_dacia_desc:0 "The lands of the ancient Dacian kingdom are under our control once more. Proclaim the restored Dacia and make every one of its provinces a core of the new state."
 ROM_dacia_decision_unlocked_tt:0 "By completing this focus you will unlock the option to §YReform Dacia§!"

 # ===== romania_uprise: standalone Economy / Army / Air / Navy branches (added in audit) =====
 ROM_upr_eco_stabilise_the_leu:0 "Stabilise the Economy"
 ROM_upr_eco_stabilise_the_leu_desc:0 "The leu lost a fifth of its value in the week of the uprising and the banks have been closed for three days. An emergency currency board, backed by the National Bank's gold, must convince Romanians that the money in their pockets is still worth something."
 ROM_upr_eco_restart_the_refineries:0 "Restart the Refineries"
 ROM_upr_eco_restart_the_refineries_desc:0 "Petrobrazi and the Ploiesti refineries stopped when the workers walked out. Getting crude flowing again is the first condition for everything else: fuel for the army, diesel for the farms, exports for the treasury."
 ROM_upr_eco_public_works:0 "A Programme of Public Works"
 ROM_upr_eco_public_works_desc:0 "Half-finished motorways have crossed Moldavia and Transylvania for twenty years. Finishing the A7 and A8 puts tens of thousands of men to work and ties the regions to the new regime."
 ROM_upr_eco_crown_estates:0 "Return the Crown Estates"
 ROM_upr_eco_crown_estates_desc:0 "The forests of Sinaia, the vineyards of Segarcea and the lands confiscated in 1948 return to the Crown, which pledges their income to a royal development fund. A monarchy with its own revenues need not beg parliament for every leu."
 ROM_upr_eco_command_economy:0 "The Directorate of Production"
 ROM_upr_eco_command_economy_desc:0 "The junta puts colonels in charge of the strategic companies. Romarm, Hidroelectrica and the ports answer to the General Staff now, and their output targets are set in barracks, not in boardrooms."
 ROM_upr_eco_christian_economy:0 "The Economy of the Parish"
 ROM_upr_eco_christian_economy_desc:0 "Every parish keeps a granary and a credit fund; every monastery runs a workshop. The Church promises an economy that serves families before markets, and the countryside, for once, is listening."
 ROM_upr_eco_danube_ports:0 "Constanta and the Danube Ports"
 ROM_upr_eco_danube_ports_desc:0 "Constanta is the largest port on the Black Sea and Galati and Braila sit where the Danube becomes navigable for sea ships. Dredging, new cranes and rail links turn them back into the gateway of the region."
 ROM_upr_eco_energy_independence:0 "Energy Independence"
 ROM_upr_eco_energy_independence_desc:0 "Neptun Deep gas offshore, Cernavoda's reactors on the Danube and the hydro dams of the Carpathians: Romania can be the one country in the region that does not need anyone's pipeline. The new regime intends to prove it."
 ROM_upr_eco_industrial_corridor:0 "The Brasov-Craiova Corridor"
 ROM_upr_eco_industrial_corridor_desc:0 "Brasov's machine works, Pitesti's car plants and the Craiova aircraft factory form a natural industrial belt across the south of the Carpathians. Tax breaks and state orders will fill it."
 ROM_upr_eco_agrarian_reform:0 "The Land Consolidation Act"
 ROM_upr_eco_agrarian_reform_desc:0 "Four million small plots, most too small to feed a family, are the legacy of 1991. The regime offers cheap credit and machinery to villages that pool their land into modern farms."
 ROM_upr_eco_tech_parks:0 "Cluj and Iasi Technology Parks"
 ROM_upr_eco_tech_parks_desc:0 "Romanian programmers already write software for half of Europe from offices in Cluj and Iasi. State-backed technology parks will keep them at home and put some of that talent to work for the nation."
 ROM_upr_eco_romania_2030:0 "The Economy of 2030"
 ROM_upr_eco_romania_2030_desc:0 "Five years after the uprising the shops are full, the ports are busy and the factories are working. Whatever its politics, the new Romania pays its own way."
 ROM_upr_army_purge_and_reform:0 "Purge and Reform the Officer Corps"
 ROM_upr_army_purge_and_reform_desc:0 "Some officers marched with the crowds, some stayed in their barracks and a few fired on them. The new regime needs to know which is which before it can trust the army with anything."
 ROM_upr_army_new_general_staff:0 "A New General Staff"
 ROM_upr_army_new_general_staff_desc:0 "Younger officers who served in Afghanistan, Iraq and on NATO's eastern flank take over from the generation trained in the 1980s. They know how a modern war is fought, and they are in a hurry."
 ROM_upr_army_reservist_call:0 "Call Up the Reservists"
 ROM_upr_army_reservist_call_desc:0 "Thousands of men who did their service before 2007 still have their papers. Calling them back fills the gaps left by desertions during the uprising and puts the regime's supporters into uniform."
 ROM_upr_army_training_grounds:0 "Cincu and Smardan Training Grounds"
 ROM_upr_army_training_grounds_desc:0 "The ranges at Cincu and Smardan were built up for NATO exercises. Now they train Romanian brigades in rotation, live-fire, around the clock."
 ROM_upr_army_logistics_command:0 "A Joint Logistics Command"
 ROM_upr_army_logistics_command_desc:0 "The uprising showed that the army could not feed or fuel a brigade outside its garrison for more than three days. A single logistics command, with its own depots and rolling stock, fixes that."
 ROM_upr_army_royal_army_tradition:0 "The Royal Army Tradition"
 ROM_upr_army_royal_army_tradition_desc:0 "The regiments get back the names and colours they carried in 1877 and 1918. An army that swears an oath to the Crown, not to a party, is the best guarantee that the Kingdom will last."
 ROM_upr_army_shock_brigades:0 "The Shock Brigades"
 ROM_upr_army_shock_brigades_desc:0 "The junta concentrates its best men, newest vehicles and most loyal officers in a handful of shock brigades. They are the regime's sword abroad and its insurance at home."
 ROM_upr_army_faith_militia:0 "Defenders of the Hearth"
 ROM_upr_army_faith_militia_desc:0 "Every parish raises a company of volunteers, blessed by its priest and trained by the army on Sundays. They will not win a battle on their own, but no enemy will hold a Romanian village for long."
 ROM_upr_army_mountain_hunters:0 "Raise the Reserve Mountain Brigades"
 ROM_upr_army_mountain_hunters_desc:0 "The Vanatori de Munte are the pride of the Romanian army. Two new reserve brigades, raised in Brasov and Sibiu, will hold the Carpathian passes whatever happens on the plains."
 ROM_upr_army_mechanised_brigades:0 "Mechanise the Brigades"
 ROM_upr_army_mechanised_brigades_desc:0 "Piranha carriers built in Bucharest and new tanks bought abroad replace the last vehicles designed in the Soviet era. The mechanised brigades become the core of the field army."
 ROM_upr_army_field_marshal:0 "A Marshal for Romania"
 ROM_upr_army_field_marshal_desc:0 "The army has not had a field marshal since 1944. The regime gives the baton to the general who rebuilt it, and with it command of everything that wears a Romanian uniform."
 ROM_upr_army_army_2030:0 "The Army of 2030"
 ROM_upr_army_army_2030_desc:0 "Mobile, mechanised and trained in the mountains, the new army can defend every pass and every river crossing in the country. It is the strongest force between the Carpathians and the Black Sea."
 ROM_upr_air_secure_the_airbases:0 "Secure the Airbases"
 ROM_upr_air_secure_the_airbases_desc:0 "Borcea, Campia Turzii and Fetesti were locked down during the uprising with their F-16s still on the flight line. The air force must declare for the new order, and its bases must be secured before anyone else tries."
 ROM_upr_air_pilot_retention:0 "Keep the Pilots"
 ROM_upr_air_pilot_retention_desc:0 "Airlines in the Gulf pay a fighter pilot five times his military salary. Bonuses, housing and early pensions are cheaper than training a new one."
 ROM_upr_air_kogalniceanu:0 "Expand Mihail Kogalniceanu"
 ROM_upr_air_kogalniceanu_desc:0 "Built up for NATO as one of the largest air bases in Europe, Kogalniceanu can host far more aircraft than Romania owns. The new regime finishes the expansion and makes it the home of its air force."
 ROM_upr_air_air_defence_network:0 "An Integrated Air Defence"
 ROM_upr_air_air_defence_network_desc:0 "Patriot batteries around Bucharest, short-range systems at the bridges and radars along the coast are wired into one picture of the sky."
 ROM_upr_air_aerostar_bacau:0 "Aerostar and IAR Brasov"
 ROM_upr_air_aerostar_bacau_desc:0 "Aerostar in Bacau already maintains F-16s and IAR at Ghimbav assembles helicopters. State orders turn them from repair shops into real aircraft manufacturers."
 ROM_upr_air_royal_air_corps:0 "The Royal Air Corps"
 ROM_upr_air_royal_air_corps_desc:0 "King Carol II built Romania's first real air force and Prince Bibescu flew over the Carpathians before most countries had aircraft. The Royal Air Corps revives the name and a doctrine of defending Romanian skies."
 ROM_upr_air_strike_command:0 "The Strike Command"
 ROM_upr_air_strike_command_desc:0 "The junta wants an air force that hits first: strike aircraft, loitering munitions and long-range drones under one command that answers directly to the General Staff."
 ROM_upr_air_guardians_of_the_sky:0 "Guardians of the Sky"
 ROM_upr_air_guardians_of_the_sky_desc:0 "The Church blesses the interceptors and the radar crews as the guardians of a Christian land. The air force exists to protect villages and churches from bombs, not to carry war abroad."
 ROM_upr_air_drone_programme:0 "A National Drone Programme"
 ROM_upr_air_drone_programme_desc:0 "The war next door showed what cheap drones can do. Romanian start-ups and the military research institutes are given contracts, test ranges and a deadline."
 ROM_upr_air_fighter_procurement:0 "The Next Fighter"
 ROM_upr_air_fighter_procurement_desc:0 "The second-hand F-16s will not last past the end of the decade. A new fighter must be chosen, bought and flown by Romanian pilots before the old ones are grounded."
 ROM_upr_air_air_2030:0 "The Air Force of 2030"
 ROM_upr_air_air_2030_desc:0 "Modern fighters, a dense air defence and drones by the thousand: for the first time since 1944, Romania controls its own sky."
 ROM_upr_navy_secure_constanta:0 "Secure the Naval Base at Constanta"
 ROM_upr_navy_secure_constanta_desc:0 "The frigates sat at their moorings through the uprising while their crews argued about whom to obey. The fleet must be brought over to the new order before its officers sail for Varna or Istanbul."
 ROM_upr_navy_mangalia_yards:0 "Nationalise the Mangalia Yards"
 ROM_upr_navy_mangalia_yards_desc:0 "The Mangalia shipyard built warships before it built ferries for foreign owners. Brought back under state control, it can build them again."
 ROM_upr_navy_danube_flotilla:0 "Rebuild the Danube Flotilla"
 ROM_upr_navy_danube_flotilla_desc:0 "The river monitors at Braila once guarded the Danube from Turnu Severin to the delta. A new flotilla of patrol boats and landing craft will do it again."
 ROM_upr_navy_mine_countermeasures:0 "Clear the Sea Lanes"
 ROM_upr_navy_mine_countermeasures_desc:0 "Drifting mines from the war in the north still wash up on Romanian beaches. Minehunters and a joint clearance group with Bulgaria and Turkey keep the grain corridor to the Bosporus open."
 ROM_upr_navy_coastal_missiles:0 "Coastal Missile Batteries"
 ROM_upr_navy_coastal_missiles_desc:0 "Mobile anti-ship missile batteries along the Dobruja coast make the approaches to Constanta the most dangerous water in the western Black Sea."
 ROM_upr_navy_royal_navy:0 "The Royal Romanian Navy"
 ROM_upr_navy_royal_navy_desc:0 "The fleet takes back its royal prefix and the training ship Mircea flies the royal standard again. A navy that shows the flag in Varna, Istanbul and Batumi is a navy that wins friends for the Crown."
 ROM_upr_navy_sea_denial:0 "Sea Denial Doctrine"
 ROM_upr_navy_sea_denial_desc:0 "The junta does not want to rule the waves, only to make sure nobody else does near Romania. Missile boats, mines and submarines will make any landing on the Dobruja coast a disaster."
 ROM_upr_navy_saint_andrew_flotilla:0 "The Flotilla of Saint Andrew"
 ROM_upr_navy_saint_andrew_flotilla_desc:0 "Saint Andrew preached on the shores of Dobruja and is the patron of Romania. The fleet is placed under his protection, and its first duty is to keep the sea lanes open for Orthodox neighbours."
 ROM_upr_navy_corvette_programme:0 "The Corvette Programme"
 ROM_upr_navy_corvette_programme_desc:0 "Four multi-role corvettes, built at Mangalia, give Romania a fleet that is small, modern and its own."
 ROM_upr_navy_submarine_return:0 "The Return of the Submarine Arm"
 ROM_upr_navy_submarine_return_desc:0 "The submarine Delfinul has not sailed since 1995. Its successors will make the Black Sea a much less comfortable place for anyone else's fleet."
 ROM_upr_navy_navy_2030:0 "The Fleet of 2030"
 ROM_upr_navy_navy_2030_desc:0 "Corvettes from Mangalia, submarines in the water and missiles on the coast: the western Black Sea belongs to Romania once more."
 ROM_upr_emergency_currency_board_idea:0 "Emergency Currency Board"
 ROM_upr_emergency_currency_board_idea_desc:0 "The leu is pegged and backed by gold. Stability, at a price."
 ROM_upr_crown_estates_idea:0 "The Crown Estates"
 ROM_upr_crown_estates_idea_desc:0 "The Crown pays its own way and funds development from its own lands."
 ROM_upr_command_economy_idea:0 "The Directorate of Production"
 ROM_upr_command_economy_idea_desc:0 "Colonels run the strategic companies."
 ROM_upr_christian_economy_idea:0 "The Economy of the Parish"
 ROM_upr_christian_economy_idea_desc:0 "Granaries, credit funds and monastery workshops in every county."
 ROM_upr_energy_independence_idea:0 "Energy Independence"
 ROM_upr_energy_independence_idea_desc:0 "Gas from the sea, power from the Danube and the mountains."
 ROM_upr_agrarian_reform_idea:0 "Land Consolidation"
 ROM_upr_agrarian_reform_idea_desc:0 "Modern farms where there were once a million strips of land."
 ROM_upr_tech_parks_idea:0 "Technology Parks"
 ROM_upr_tech_parks_idea_desc:0 "Romanian talent working at home."
 ROM_upr_economy_2030_idea:0 "The Economy of 2030"
 ROM_upr_economy_2030_idea_desc:0 "A country that pays its own way."
 ROM_upr_army_reorganisation_idea:0 "Army Reorganisation"
 ROM_upr_army_reorganisation_idea_desc:0 "The officer corps is being purged and rebuilt. For now, it is in disorder."
 ROM_upr_training_grounds_idea:0 "Cincu and Smardan"
 ROM_upr_training_grounds_idea_desc:0 "Brigades train in rotation on the NATO-built ranges."
 ROM_upr_logistics_command_idea:0 "Joint Logistics Command"
 ROM_upr_logistics_command_idea_desc:0 "One command feeds, fuels and repairs the whole army."
 ROM_upr_royal_army_tradition_idea:0 "The Royal Army Tradition"
 ROM_upr_royal_army_tradition_idea_desc:0 "Regiments that swear their oath to the Crown."
 ROM_upr_shock_brigades_idea:0 "The Shock Brigades"
 ROM_upr_shock_brigades_idea_desc:0 "The best men and the newest vehicles, concentrated."
 ROM_upr_faith_militia_idea:0 "Defenders of the Hearth"
 ROM_upr_faith_militia_idea_desc:0 "A company of volunteers in every parish."
 ROM_upr_army_2030_idea:0 "The Army of 2030"
 ROM_upr_army_2030_idea_desc:0 "The strongest force between the Carpathians and the sea."
 ROM_upr_pilot_retention_idea:0 "Pilot Retention Programme"
 ROM_upr_pilot_retention_idea_desc:0 "Bonuses and housing keep the pilots in uniform."
 ROM_upr_royal_air_corps_idea:0 "The Royal Air Corps"
 ROM_upr_royal_air_corps_idea_desc:0 "Defending Romanian skies in the name of the Crown."
 ROM_upr_strike_command_idea:0 "The Strike Command"
 ROM_upr_strike_command_idea_desc:0 "An air force built to hit first."
 ROM_upr_guardians_of_the_sky_idea:0 "Guardians of the Sky"
 ROM_upr_guardians_of_the_sky_idea_desc:0 "Interceptors and radars blessed to protect a Christian land."
 ROM_upr_air_2030_idea:0 "The Air Force of 2030"
 ROM_upr_air_2030_idea_desc:0 "Romania controls its own sky."
 ROM_upr_danube_flotilla_idea:0 "The Danube Flotilla"
 ROM_upr_danube_flotilla_idea_desc:0 "River monitors from Turnu Severin to the delta."
 ROM_upr_mine_countermeasures_idea:0 "Clear Sea Lanes"
 ROM_upr_mine_countermeasures_idea_desc:0 "Minehunters keep the corridor to the Bosporus open."
 ROM_upr_coastal_missiles_idea:0 "Coastal Missile Batteries"
 ROM_upr_coastal_missiles_idea_desc:0 "The approaches to Constanta are deadly."
 ROM_upr_royal_navy_idea:0 "The Royal Romanian Navy"
 ROM_upr_royal_navy_idea_desc:0 "A navy that shows the flag for the Crown."
 ROM_upr_sea_denial_idea:0 "Sea Denial"
 ROM_upr_sea_denial_idea_desc:0 "Nobody rules the sea near Romania."
 ROM_upr_saint_andrew_flotilla_idea:0 "The Flotilla of Saint Andrew"
 ROM_upr_saint_andrew_flotilla_idea_desc:0 "Under the protection of the patron of Romania."
 ROM_upr_navy_2030_idea:0 "The Fleet of 2030"
 ROM_upr_navy_2030_idea_desc:0 "The western Black Sea belongs to Romania once more."
 ROM_upr_is_monarchy_tt:0 "The §YCrown§! has been restored."
 ROM_upr_is_junta_tt:0 "The §YArmy§! rules the country."
 ROM_upr_is_church_tt:0 "The §YChurch§! governs the country."
 ROM_upr_gen_mircea_ionescu:0 "Mircea Ionescu"
 ROM_upr_gen_ana_stoica:0 "Ana Stoica"
 ROM_upr_gen_victor_dobre:0 "Victor Dobre"
 ROM_uprise.30.t:0 "The Settlement of the Revolution"
 ROM_uprise.30.d_none:0 "The Provisional Council meets in the Senate chamber for what was meant to be its last session. It is not. The Royal House, the General Staff and the Holy Synod each claim the right to lead Romania, but none of them can show that the country stands behind it. After eleven hours the Council adjourns without a vote. Bucharest will have to wait a little longer.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_uprise.30.d_crown:0 "The Provisional Council meets in the Senate chamber for its last session. The generals and the bishops arrive with their demands, but the vote has already been decided in the streets of Bucharest, Cluj and Alba Iulia, where crowds have been waving the royal standard for weeks. Only the representative of the Royal House rises when the chairman asks who will take responsibility for the state.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_uprise.30.d_army:0 "The Provisional Council meets in the Senate chamber for its last session. Armoured vehicles have guarded the Parliament Palace since the uprising, and nobody in the room forgets it. When the chairman asks who will take responsibility for the state, General Gheorghita Vlad stands up. Nobody stands up against him.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_uprise.30.d_church:0 "The Provisional Council meets in the Senate chamber for its last session. For months the parishes have fed the hungry, sheltered the displaced and kept the villages calm while the capital argued. When the chairman asks who will take responsibility for the state, every eye in the room turns to the delegate of the Holy Synod.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_uprise.30.d_contested:0 "The Provisional Council meets in the Senate chamber for its last session, and for the first time since the uprising the outcome is not certain. More than one of the three powers has the support it needs to take the state, and each has made sure the others know it. The chairman calls the vote. Whatever the Council decides tonight, the losers will remember it.\n\nCrown: [?ROM_crown_support|0]  Army: [?ROM_army_support|0]  Church: [?ROM_church_support|0]"
 ROM_uprise.30.a:0 "The Crown will unite the nation."
 ROM_uprise.30.b:0 "The Army will keep the peace."
 ROM_uprise.30.c:0 "The Church will guide the people."
 ROM_uprise.30.e:0 "The Council is not ready to decide."
 ROM_pillar_crown_p5_tt:0 "Support for the Crown in the Provisional Council: §G+5§!"
 ROM_pillar_army_p5_tt:0 "Support for the Army in the Provisional Council: §G+5§!"
 ROM_pillar_church_p5_tt:0 "Support for the Church in the Provisional Council: §G+5§!"
 ROM_pillar_crown_p10_tt:0 "The strongest power, the §YCrown§!, gains ground. Support for the Crown in the Provisional Council: §G+10§!"
 ROM_pillar_army_p10_tt:0 "The strongest power, the §YArmy§!, gains ground. Support for the Army in the Provisional Council: §G+10§!"
 ROM_pillar_church_p10_tt:0 "The strongest power, the §YChurch§!, gains ground. Support for the Church in the Provisional Council: §G+10§!"
 ROM_settlement_opens_crown_tt:0 "Opens the path of the §YCrown§!: the focus §YRestore the Crown§! can be taken once this is true:\n$ROM_pillar_crown_req_40_tt$\nThe paths of the Army and the Church will stay closed."
 ROM_settlement_opens_army_tt:0 "Opens the path of the §YArmy§!: the focus §YThe Generals Take Power§! can be taken once this is true:\n$ROM_pillar_army_req_40_tt$\nThe paths of the Crown and the Church will stay closed."
 ROM_settlement_opens_church_tt:0 "Opens the path of the §YChurch§!: the focus §YThe Patriarchal Regency§! can be taken once this is true:\n$ROM_pillar_church_req_40_tt$\nThe paths of the Crown and the Army will stay closed."
 ROM_settlement_deferred_tt:0 "No path opens yet. The Provisional Council will meet again in §Y30§! days."
 ROM_settlement_chose_crown_tt:0 "The Provisional Council has handed the state to the §YCrown§!"
 ROM_settlement_chose_army_tt:0 "The Provisional Council has handed the state to the §YArmy§!"
 ROM_settlement_chose_church_tt:0 "The Provisional Council has handed the state to the §YChurch§!"
 ROM_uprise.20.t:0 "The Economy of 2030"
 ROM_uprise.20.d:0 "Five years ago the banks were closed and the refineries were silent. Today Constanta handles more cargo than at any time in its history, the motorways cross the Carpathians and the leu is stable. The economists who predicted ruin after the uprising have quietly revised their forecasts."
 ROM_uprise.20.a:0 "Romania pays its own way."
 ROM_uprise.21.t:0 "The Army of 2030"
 ROM_uprise.21.d:0 "On the anniversary of the uprising the new army parades through the Arch of Triumph: mechanised brigades, mountain troops and the reserve formations raised since the revolution. Foreign attaches in the stands take careful notes."
 ROM_uprise.21.a:0 "Let them take notes."
 ROM_uprise.22.t:0 "The Fleet of 2030"
 ROM_uprise.22.d:0 "The new corvettes from Mangalia sail past the Casino in Constanta in line ahead, followed by the first Romanian submarine in thirty years. For the first time since the end of the Cold War, the western Black Sea has a navy that every neighbour has to take into account."
 ROM_uprise.22.a:0 "The sea is ours again."

 # ===== romania_uprise: Crown / Junta / Church path extensions 2026-2030 (added in audit) =====
 ROM_crown_royal_household:0 "The Royal Household Act"
 ROM_crown_royal_household_desc:0 "A law defines the Royal Household for the first time since 1947: its budget, its staff, its palaces and its duties. The Crown becomes an institution with a payroll rather than a family with a title."
 ROM_crown_city_charters:0 "Royal Charters for the Cities"
 ROM_crown_city_charters_desc:0 "Cluj, Iasi and Timisoara receive royal charters with their own budgets and planning powers. The great cities, which voted against every government in Bucharest, now have a reason to like the King."
 ROM_crown_kings_envoys:0 "The King's Envoys"
 ROM_crown_kings_envoys_desc:0 "Europe's reigning houses are cousins of the Romanian one. Royal envoys to London, Madrid, The Hague, Brussels and the Nordic courts open doors that the foreign ministry could not."
 ROM_crown_boyar_titles:0 "Restore the Old Titles"
 ROM_crown_boyar_titles_desc:0 "The great families of the old Principalities get back their titles and a seat in a new Senate of the Realm. They bring money, land and loyalty; the rest of the country brings its suspicion."
 ROM_crown_crown_of_citizens:0 "A Crown of Citizens"
 ROM_crown_crown_of_citizens_desc:0 "No titles, no privileges, no court nobility: the King is the first citizen of a republic of equals in all but name. The Crown wins the towns and the young, if not the old families."
 ROM_crown_balkan_mediation:0 "Royal Mediation in the Balkans"
 ROM_crown_balkan_mediation_desc:0 "The Romanian Crown is the only one in the region with no old quarrel to settle. Offering its good offices between Sofia, Belgrade and Athens makes Bucharest the natural meeting place of the Balkans."
 ROM_crown_regency_act:0 "The Regency Act"
 ROM_crown_regency_act_desc:0 "Who rules if the monarch dies while the heir is a child? A Regency Council of the Patriarch, the Chief Justice and the Speaker answers the question before anyone can ask it with tanks."
 ROM_crown_order_of_carol:0 "The Order of Carol I"
 ROM_crown_order_of_carol_desc:0 "The highest royal order returns, awarded to officers, scientists and public servants. A ribbon costs the treasury nothing and buys a great deal of loyalty."
 ROM_crown_realm_2030:0 "The Realm at Five Years"
 ROM_crown_realm_2030_desc:0 "Five years after the uprising, the Kingdom has a household, a regency law, friends in every royal court in Europe and a place at every Balkan table. The monarchy is no longer an experiment."
 ROM_junta_officers_in_ministries:0 "Officers in the Ministries"
 ROM_junta_officers_in_ministries_desc:0 "Colonels with staff college degrees replace the political appointees in every ministry. They answer the telephone, they keep schedules and they do not take envelopes, at least at first."
 ROM_junta_corruption_courts:0 "Courts-Martial for Corruption"
 ROM_junta_corruption_courts_desc:0 "Bribery of a public official is declared an offence against national security and tried by military courts. The first verdicts are harsh and very public."
 ROM_junta_army_builds_roads:0 "The Army Builds the Roads"
 ROM_junta_army_builds_roads_desc:0 "Engineer battalions finish in two years the Moldavian motorway that civilian contractors failed to build in twenty. The junta makes sure everyone notices."
 ROM_junta_turkish_model:0 "The Turkish Model"
 ROM_junta_turkish_model_desc:0 "Turkey built a defence industry that exports drones and frigates in twenty years. Its officers know how an army can run a state, and Ankara is happy to share both lessons."
 ROM_junta_polish_partnership:0 "The Polish Partnership"
 ROM_junta_polish_partnership_desc:0 "Warsaw is rearming faster than anyone in Europe and shares Bucharest's view of the threat from the east. Joint exercises and shared procurement tie the two eastern-flank armies together."
 ROM_junta_military_intelligence:0 "Revive Military Intelligence"
 ROM_junta_military_intelligence_desc:0 "The army's own intelligence directorate, long overshadowed by the civilian services, gets the budget, the satellites and the agents it always wanted."
 ROM_junta_veterans_league:0 "The Veterans' League"
 ROM_junta_veterans_league_desc:0 "Every man who has served gets a card, a pension supplement and a local chapter. The League becomes the junta's party in all but name."
 ROM_junta_northern_border:0 "Fortify the Northern Border"
 ROM_junta_northern_border_desc:0 "Bunkers, anti-tank ditches and minefields along the northern border and the Prut crossings. Nobody will drive into Moldavia the way they drove into Ukraine."
 ROM_junta_plebiscite:0 "The 2028 Plebiscite"
 ROM_junta_plebiscite_desc:0 "One question, one answer: does the nation approve the Supreme Defence Council? The count is supervised by officers. The answer is never in doubt."
 ROM_junta_officers_state_2030:0 "The Officers' State at Five Years"
 ROM_junta_officers_state_2030_desc:0 "Five years after the generals took power, the ministries run on military time, the borders are fortified and the plebiscite has given the Council a mandate. Whether it ever hands power back is another question."
 ROM_church_synod_in_senate:0 "The Synod in the Senate"
 ROM_church_synod_in_senate_desc:0 "Every bishop of the Holy Synod takes a seat in the Senate by right. Laws that touch the family, the schools or the faith cannot pass without the Church's consent."
 ROM_church_saint_stephen_year:0 "The Year of Saint Stephen"
 ROM_church_saint_stephen_year_desc:0 "Stephen the Great, prince of Moldavia, defender of Christendom and a saint of the Church, is the model the regime offers the nation. His year fills the monasteries of Putna and Voronet with pilgrims."
 ROM_church_diaspora_parishes:0 "The Diaspora Parishes"
 ROM_church_diaspora_parishes_desc:0 "Millions of Romanians live in Italy and Spain, and the Romanian parish is often the centre of their lives. The Church invites them home, and offers land, work and a place in the community to those who come."
 ROM_church_church_provides:0 "The Church Provides"
 ROM_church_church_provides_desc:0 "Hospitals, orphanages and soup kitchens are handed to the Church and funded by the state. The poor are cared for, and they know whom to thank."
 ROM_church_charity_not_taxes:0 "Charity, Not Taxes"
 ROM_church_charity_not_taxes_desc:0 "The state shrinks, taxes fall, and the faithful are asked to give to their parish instead. The economy breathes; the very poor depend on the generosity of their neighbours."
 ROM_church_athos_skete:0 "The Romanian Skete on Athos"
 ROM_church_athos_skete_desc:0 "The Prodromou skete on Mount Athos has been Romanian since the nineteenth century. Restoring it, with Greek blessing, binds the two Orthodox nations closer together."
 ROM_church_theological_academies:0 "The Theological Academies"
 ROM_church_theological_academies_desc:0 "The faculties of theology in Bucharest, Iasi and Cluj become full academies, teaching history, philosophy, languages and the sciences under the eye of the Church."
 ROM_church_monastery_guard:0 "Guardians of the Monasteries"
 ROM_church_monastery_guard_desc:0 "The great monasteries of Moldavia and Oltenia stand on the old invasion routes. Volunteer companies trained to defend them turn every one into a fortress again."
 ROM_church_family_support:0 "The Family Support Law"
 ROM_church_family_support_desc:0 "Generous child allowances, cheap housing for young couples and maternity clinics in every county. The Church's answer to an emptying country is to make it easier to raise a family in it."
 ROM_church_covenant_2030:0 "The Covenant at Five Years"
 ROM_church_covenant_2030_desc:0 "Five years after the Patriarch accepted the regency, the bishops sit in the Senate, the diaspora is coming home and the monasteries are full. The Orthodox state has outlived every prediction of its collapse."
 ROM_crown_royal_household_idea:0 "The Royal Household"
 ROM_crown_royal_household_idea_desc:0 "The Crown as an institution, with a budget and a payroll."
 ROM_crown_boyar_titles_idea:0 "The Old Titles"
 ROM_crown_boyar_titles_idea_desc:0 "The great families back in the Senate of the Realm."
 ROM_crown_crown_of_citizens_idea:0 "A Crown of Citizens"
 ROM_crown_crown_of_citizens_idea_desc:0 "The King is the first citizen among equals."
 ROM_crown_order_of_carol_idea:0 "The Order of Carol I"
 ROM_crown_order_of_carol_idea_desc:0 "Ribbons that buy loyalty."
 ROM_crown_realm_2030_idea:0 "The Realm at Five Years"
 ROM_crown_realm_2030_idea_desc:0 "The monarchy is no longer an experiment."
 ROM_junta_officers_ministries_idea:0 "Officers in the Ministries"
 ROM_junta_officers_ministries_idea_desc:0 "Military discipline in the civil service."
 ROM_junta_turkish_model_idea:0 "The Turkish Model"
 ROM_junta_turkish_model_idea_desc:0 "A defence industry built in a decade."
 ROM_junta_polish_partnership_idea:0 "The Polish Partnership"
 ROM_junta_polish_partnership_idea_desc:0 "Two eastern-flank armies training together."
 ROM_junta_military_intelligence_idea:0 "Military Intelligence"
 ROM_junta_military_intelligence_idea_desc:0 "The army sees what is coming."
 ROM_junta_veterans_league_idea:0 "The Veterans' League"
 ROM_junta_veterans_league_idea_desc:0 "The junta's party in all but name."
 ROM_junta_officers_state_2030_idea:0 "The Officers' State"
 ROM_junta_officers_state_2030_idea_desc:0 "The ministries run on military time."
 ROM_church_synod_senate_idea:0 "The Synod in the Senate"
 ROM_church_synod_senate_idea_desc:0 "No law passes without the Church's consent."
 ROM_church_saint_stephen_idea:0 "The Year of Saint Stephen"
 ROM_church_saint_stephen_idea_desc:0 "The defender of Christendom as the model for the nation."
 ROM_church_diaspora_idea:0 "The Diaspora Returns"
 ROM_church_diaspora_idea_desc:0 "Parish by parish, the emigrants come home."
 ROM_church_church_provides_idea:0 "The Church Provides"
 ROM_church_church_provides_idea_desc:0 "Hospitals and orphanages run by the Church, paid for by the state."
 ROM_church_charity_idea:0 "Charity, Not Taxes"
 ROM_church_charity_idea_desc:0 "A smaller state and a generous parish."
 ROM_church_academies_idea:0 "The Theological Academies"
 ROM_church_academies_idea_desc:0 "Learning under the eye of the Church."
 ROM_church_monastery_guard_idea:0 "Guardians of the Monasteries"
 ROM_church_monastery_guard_idea_desc:0 "Every monastery a fortress again."
 ROM_church_family_support_idea:0 "The Family Support Law"
 ROM_church_family_support_idea_desc:0 "Easier to raise a family in Romania."
 ROM_church_covenant_2030_idea:0 "The Covenant at Five Years"
 ROM_church_covenant_2030_idea_desc:0 "The Orthodox state has outlived every prediction."

 # ===== romania_elections: Simion tracks and socialist branch (added in audit) =====
 ROM_sim_economic_patriotism:0 "The Economic Patriotism Act"
 ROM_sim_economic_patriotism_desc:0 "Foreign supermarket chains, foreign banks, foreign energy companies: AUR has spent years telling voters who owns Romania. Now it has the votes to change the answer, one law at a time."
 ROM_sim_protect_industry:0 "Protect Romanian Industry"
 ROM_sim_protect_industry_desc:0 "Public contracts go to Romanian firms first, and imports that compete with Romanian factories meet every tariff and inspection the EU rules still allow."
 ROM_sim_national_champions:0 "National Champions"
 ROM_sim_national_champions_desc:0 "Hidroelectrica, Romgaz and Petrom are already among the largest companies in the region. The state builds them up into national champions that buy, invest and expand on Romania's behalf."
 ROM_sim_our_gold_our_forests:0 "Our Gold, Our Forests"
 ROM_sim_our_gold_our_forests_desc:0 "Rosia Montana's gold, the Carpathian forests and the mines of the Apuseni have been fought over by foreign companies for decades. The new government declares them national patrimony, to be worked by Romanians for Romania."
 ROM_sim_romanian_bank:0 "A Romanian Bank for Romanians"
 ROM_sim_romanian_bank_desc:0 "Almost every large bank in Romania is foreign-owned. The state-owned CEC Bank is recapitalised and told to lend to Romanian farmers and small businesses first."
 ROM_sim_motorways_of_unity:0 "The Motorways of Unity"
 ROM_sim_motorways_of_unity_desc:0 "The motorway across the Carpathians to Moldavia becomes a national cause, built by Romanian companies and named, at every opportunity, the road of unity."
 ROM_sim_sovereign_economy:0 "The Sovereign Economy"
 ROM_sim_sovereign_economy_desc:0 "Romanian banks lend to Romanian companies that build Romanian roads with Romanian steel. Brussels grumbles, the economists argue, and the voters like what they see."
 ROM_sim_food_sovereignty:0 "Food Sovereignty"
 ROM_sim_food_sovereignty_desc:0 "Romania has some of the best farmland in Europe and imports its tomatoes. Subsidies for local produce and a cap on farmland sold to foreigners are meant to change both."
 ROM_sim_brussels_renegotiation:0 "Renegotiate with Brussels"
 ROM_sim_brussels_renegotiation_desc:0 "Not Roexit, a renegotiation: more say over farm subsidies, a veto on migration quotas, a slower path to the green targets. Romania stays in the Union, and wants the Union to know who is talking."
 ROM_sim_village_tour:0 "The Village Tour"
 ROM_sim_village_tour_desc:0 "The President goes where no Romanian president has bothered to go: the villages of Teleorman, Vaslui and Maramures, a church square at a time. The crowds are small, loyal and growing."
 ROM_sim_youth_wing:0 "The Youth Wing"
 ROM_sim_youth_wing_desc:0 "Students and young workers who found the movement on TikTok are organised into a youth wing with its own camps, its own songs and its own impatience."
 ROM_sim_own_television:0 "Our Own Television"
 ROM_sim_own_television_desc:0 "The movement was built on social media and ignored by the big channels. Now it has a channel of its own, and the old networks find their licences reviewed rather more carefully than before."
 ROM_sim_million_members:0 "A Million Members"
 ROM_sim_million_members_desc:0 "AUR passes a million card-carrying members, more than any party since the National Salvation Front in 1990. A movement that large no longer needs a founder; it needs a structure."
 ROM_soc_labour_code:0 "A New Labour Code"
 ROM_soc_labour_code_desc:0 "The 2011 labour code broke the unions and froze collective bargaining. A social-democratic cabinet writes a new one with the unions in the room."
 ROM_soc_party_left:0 "The Left Platform"
 ROM_soc_party_left_desc:0 "For the first time in thirty years the PSD congress argues about ideas rather than county barons. A left platform demands that the party remember what the S in its name stands for."
 ROM_soc_free_healthcare:0 "Care Without Envelopes"
 ROM_soc_free_healthcare_desc:0 "Every Romanian knows the envelope you slip the doctor so that the free hospital actually treats you. Proper salaries for doctors and nurses, and prison for those who still take envelopes, are meant to end it."
 ROM_soc_minimum_wage:0 "A Living Minimum Wage"
 ROM_soc_minimum_wage_desc:0 "The minimum wage is indexed to half the average wage and rises every January. Employers complain; two million workers notice."
 ROM_soc_union_rights:0 "Collective Bargaining Restored"
 ROM_soc_union_rights_desc:0 "National and sectoral collective agreements come back. The unions have a seat at the table again, and the employers' associations walk out of the first meeting."
 ROM_soc_third_way:0 "The Third Way"
 ROM_soc_third_way_desc:0 "Markets where they work, the state where they do not, and Brussels money for everything in between. The cautious wing of the party wins the argument, and the coalition partners breathe again."
 ROM_soc_democratic_socialism:0 "Democratic Socialism"
 ROM_soc_democratic_socialism_desc:0 "The left platform wins: public ownership of the strategic sectors, a planned investment programme and an end to the flat tax. The liberals in the coalition start counting their votes."
 ROM_soc_tripartite_council:0 "The Tripartite Council"
 ROM_soc_tripartite_council_desc:0 "Government, unions and employers meet every month in a council with real powers over wages, pensions and working conditions. Strikes become negotiations."
 ROM_soc_social_market:0 "The Social Market Economy"
 ROM_soc_social_market_desc:0 "Germany's model, adapted for Romania: private companies, strong unions, public banks for development and a welfare state paid for by growth."
 ROM_soc_nationalise_energy:0 "Energy Back in Public Hands"
 ROM_soc_nationalise_energy_desc:0 "The state buys back control of the gas, oil and electricity companies sold in the 2000s. Energy bills become a political decision again, for better and for worse."
 ROM_soc_hospital_programme:0 "A Hospital in Every County"
 ROM_soc_hospital_programme_desc:0 "Romania still treats patients in hospitals built before 1989. Eight new regional hospitals, funded from the recovery plan, are the government's promise to the provinces."
 ROM_soc_eu_cohesion:0 "Spend Every Euro"
 ROM_soc_eu_cohesion_desc:0 "Romania has left billions of euros of cohesion funds unspent. A special agency with the power to cut red tape is told to spend every one of them on roads, water and schools."
 ROM_soc_workers_on_boards:0 "Workers on the Boards"
 ROM_soc_workers_on_boards_desc:0 "One third of the board seats in every public company and every large private one go to elected employee representatives. The managers learn to explain themselves."
 ROM_soc_progressive_tax:0 "End the Flat Tax"
 ROM_soc_progressive_tax_desc:0 "The flat tax of 2005 was the one reform every government kept. A progressive income tax replaces it, with the highest earners paying the most and the lowest paying nothing at all."
 ROM_soc_social_romania:0 "A Social Romania"
 ROM_soc_social_romania_desc:0 "Wages bargained collectively, care without envelopes, a hospital in every county and taxes that rise with income: the social democrats have built the Romania they promised in 1990 and never delivered."
 ROM_sim_economic_patriotism_idea:0 "Economic Patriotism"
 ROM_sim_economic_patriotism_idea_desc:0 "Romanian companies first."
 ROM_sim_protectionism_idea:0 "Protected Industry"
 ROM_sim_protectionism_idea_desc:0 "Tariffs and inspections for the competition."
 ROM_sim_romanian_bank_idea:0 "A Romanian Bank"
 ROM_sim_romanian_bank_idea_desc:0 "CEC Bank lends at home first."
 ROM_sim_sovereign_economy_idea:0 "The Sovereign Economy"
 ROM_sim_sovereign_economy_idea_desc:0 "Romanian money, Romanian steel, Romanian roads."
 ROM_sim_food_sovereignty_idea:0 "Food Sovereignty"
 ROM_sim_food_sovereignty_idea_desc:0 "Romanian land feeds Romanians."
 ROM_sim_own_television_idea:0 "Our Own Television"
 ROM_sim_own_television_idea_desc:0 "The movement tells its own story."
 ROM_soc_labour_code_idea:0 "The New Labour Code"
 ROM_soc_labour_code_idea_desc:0 "The unions are back in the room."
 ROM_soc_free_healthcare_idea:0 "Care Without Envelopes"
 ROM_soc_free_healthcare_idea_desc:0 "Free care that is actually free."
 ROM_soc_minimum_wage_idea:0 "A Living Minimum Wage"
 ROM_soc_minimum_wage_idea_desc:0 "Indexed to half the average wage."
 ROM_soc_social_market_idea:0 "The Social Market Economy"
 ROM_soc_social_market_idea_desc:0 "Markets with a conscience."
 ROM_soc_public_energy_idea:0 "Public Energy"
 ROM_soc_public_energy_idea_desc:0 "Energy bills are a political decision again."
 ROM_soc_workers_boards_idea:0 "Workers on the Boards"
 ROM_soc_workers_boards_idea_desc:0 "Managers who have to explain themselves."
 ROM_soc_progressive_tax_idea:0 "Progressive Taxation"
 ROM_soc_progressive_tax_idea_desc:0 "Those who earn the most pay the most."
 ROM_soc_social_romania_idea:0 "A Social Romania"
 ROM_soc_social_romania_idea_desc:0 "The promise of 1990, delivered."

 # ===== romania_uprise: foreign policy branch (added in audit) =====
 ROM_upr_fp_foreign_council:0 "The Council for Foreign Affairs"
 ROM_upr_fp_foreign_council_desc:0 "The revolution has settled at home. Abroad, nobody yet knows what the new Romania is. A council of diplomats, officers and clergy is set up to decide what it will tell the world."
 ROM_upr_fp_recall_ambassadors:0 "Recall the Ambassadors"
 ROM_upr_fp_recall_ambassadors_desc:0 "Half the ambassadors abroad were appointed by the old parties and some have refused to recognise the new order. They are recalled, and replaced by people the new regime can trust."
 ROM_upr_fp_nato_question:0 "The NATO Question"
 ROM_upr_fp_nato_question_desc:0 "Romania hosts American troops, a missile-defence base and NATO's eastern flank headquarters. Whatever else changes, Washington needs to hear quickly that the bases stay."
 ROM_upr_fp_neighbourhood_policy:0 "A Policy for the Neighbourhood"
 ROM_upr_fp_neighbourhood_policy_desc:0 "Bulgaria, Serbia, Moldova, Ukraine and Hungary all watched the uprising with alarm. A new policy for the neighbourhood promises them predictability, and asks the same in return."
 ROM_upr_fp_crown_kings_diplomacy:0 "The King's Diplomacy"
 ROM_upr_fp_crown_kings_diplomacy_desc:0 "A monarch can do what no elected president can: visit, charm and stay above politics. The Crown takes personal charge of Romania's image abroad."
 ROM_upr_fp_crown_crowned_member:0 "A Crowned Member of the Union"
 ROM_upr_fp_crown_crowned_member_desc:0 "Brussels was horrified by the revolution. The Crown reassures it that Romania remains in the Union, honours its treaties and is, if anything, more stable than before."
 ROM_upr_fp_crown_washington:0 "The King Goes to Washington"
 ROM_upr_fp_crown_washington_desc:0 "A state visit to Washington, a speech to Congress and a photograph in the Oval Office. America likes reliable allies, and it likes royalty even more."
 ROM_upr_fp_crown_balkan_dynasties:0 "Dynastic Ties in the Balkans"
 ROM_upr_fp_crown_balkan_dynasties_desc:0 "The royal houses of Serbia, Bulgaria and Greece are related to the Romanian one, and their heirs still carry weight at home. Family visits become diplomacy by other means."
 ROM_upr_fp_crown_paris:0 "The French Connection"
 ROM_upr_fp_crown_paris_desc:0 "French officers rebuilt the Romanian army in 1917 and French troops are stationed at Cincu today. Paris is the oldest friend the Romanian Crown has."
 ROM_upr_fp_crown_berlin:0 "German Investment"
 ROM_upr_fp_crown_berlin_desc:0 "German companies employ a quarter of a million Romanians. A royal visit to Berlin and the Transylvanian Saxon heritage open the door to more."
 ROM_upr_fp_crown_american_troops:0 "American Troops on Romanian Soil"
 ROM_upr_fp_crown_american_troops_desc:0 "The American brigade becomes a permanent garrison, with families, schools and a lease for twenty-five years. No one invades a country with an American division in it."
 ROM_upr_fp_crown_bulgarian_accord:0 "The Bulgarian Accord"
 ROM_upr_fp_crown_bulgarian_accord_desc:0 "Two countries that joined NATO, the EU and Schengen together, and still have only two bridges over the Danube between them. A royal accord promises five more."
 ROM_upr_fp_crown_serbian_kinship:0 "Serbian Kinship"
 ROM_upr_fp_crown_serbian_kinship_desc:0 "Romania and Serbia have never fought each other and share a long Danube border. The Karadjordjevic heir is a welcome guest in Bucharest."
 ROM_upr_fp_crown_atlantic_crown:0 "The Atlantic Crown"
 ROM_upr_fp_crown_atlantic_crown_desc:0 "The Crown binds Romania to the West for a generation: NATO first, the Union second and Washington above all."
 ROM_upr_fp_crown_danubian_confederation:0 "The Danubian Idea"
 ROM_upr_fp_crown_danubian_confederation_desc:0 "An old royal dream: the states of the lower Danube acting together, under the patronage of the oldest crown in the region."
 ROM_upr_fp_crown_nato_command:0 "A NATO Command in Bucharest"
 ROM_upr_fp_crown_nato_command_desc:0 "NATO's south-eastern headquarters moves from paper to reality, with a staff of two thousand in Bucharest. Romania becomes the anchor of the Black Sea flank."
 ROM_upr_fp_crown_polish_pact:0 "The Warsaw Compact"
 ROM_upr_fp_crown_polish_pact_desc:0 "Poland and Romania hold the northern and southern ends of the eastern flank. A royal visit to Warsaw seals a defence compact between them."
 ROM_upr_fp_crown_danube_commission:0 "The Danube Commission Revived"
 ROM_upr_fp_crown_danube_commission_desc:0 "The European Commission of the Danube sat in Galati from 1856 to 1948. Revived, with its seat once again in Romania, it regulates the river and gives Bucharest a voice in every capital along it."
 ROM_upr_fp_crown_lower_danube_customs:0 "The Lower Danube Accords"
 ROM_upr_fp_crown_lower_danube_customs_desc:0 "Joint ports, joint bridges and shared customs posts along the lower Danube make Romania, Bulgaria and Serbia a single market in all but name."
 ROM_upr_fp_crown_final:0 "The Crown Among Nations"
 ROM_upr_fp_crown_final_desc:0 "The restored monarchy is no longer a curiosity. It is received in every European capital, and in more of them than the old republic ever was."
 ROM_upr_fp_junta_generals_diplomacy:0 "The Generals' Diplomacy"
 ROM_upr_fp_junta_generals_diplomacy_desc:0 "The Supreme Defence Council does not trust diplomats. Foreign policy is now made by the General Staff, and it is made in terms of threats, allies and weapons."
 ROM_upr_fp_junta_arms_for_influence:0 "Arms for Influence"
 ROM_upr_fp_junta_arms_for_influence_desc:0 "Romarm's rifles, shells and armoured vehicles become instruments of foreign policy, sold cheaply to friends and not at all to anyone else."
 ROM_upr_fp_junta_ankara_line:0 "The Ankara Line"
 ROM_upr_fp_junta_ankara_line_desc:0 "Turkey controls the Straits, builds drones and frigates and has seen more coups than any NATO member. Its generals understand the junta better than anyone in Brussels."
 ROM_upr_fp_junta_pressure_chisinau:0 "Pressure on Chisinau"
 ROM_upr_fp_junta_pressure_chisinau_desc:0 "The junta does not hide what it wants from Moldova. Troops exercise on the Prut, and Chisinau is reminded every week who protects it."
 ROM_upr_fp_junta_bucharest_arms_fair:0 "The Bucharest Arms Fair"
 ROM_upr_fp_junta_bucharest_arms_fair_desc:0 "Every second year, the junta hosts the largest arms fair in south-eastern Europe. Contracts are signed, factories expand and generals from three continents come to watch."
 ROM_upr_fp_junta_peacekeepers:0 "Peacekeepers for Hire"
 ROM_upr_fp_junta_peacekeepers_desc:0 "Romanian battalions serve under UN and EU flags in Africa and the Balkans. The missions pay, the troops gain experience and the junta gains a respectability it badly needs."
 ROM_upr_fp_junta_black_sea_exercises:0 "Joint Black Sea Exercises"
 ROM_upr_fp_junta_black_sea_exercises_desc:0 "Romanian, Turkish and Bulgarian ships exercise together off Constanta. The message to anyone watching from Sevastopol is clear."
 ROM_upr_fp_junta_transnistria:0 "The Transnistria Question"
 ROM_upr_fp_junta_transnistria_desc:0 "A Russian garrison still sits on the Dniester, eighty kilometres from the Romanian border. The General Staff draws up plans for every contingency."
 ROM_upr_fp_junta_advisers_moldova:0 "Military Advisers for Moldova"
 ROM_upr_fp_junta_advisers_moldova_desc:0 "Pressure and help go together. Romanian officers train the Moldovan army, equip it and quietly make it dependent on Bucharest."
 ROM_upr_fp_junta_western_bulwark:0 "The Western Bulwark"
 ROM_upr_fp_junta_western_bulwark_desc:0 "Washington does not love the junta, but it needs Romania. The generals offer a simple deal: they hold the flank, and the West stops asking about elections."
 ROM_upr_fp_junta_armed_neutrality:0 "Armed Neutrality"
 ROM_upr_fp_junta_armed_neutrality_desc:0 "Romania will be nobody's battlefield and nobody's client. It stays in the alliances on paper and arms itself to fight alone if it has to."
 ROM_upr_fp_junta_three_seas:0 "The Three Seas Defence Pact"
 ROM_upr_fp_junta_three_seas_desc:0 "From the Baltic to the Black Sea, the eastern-flank states pool their planning, their air defence and their stockpiles. Bucharest hosts the southern headquarters."
 ROM_upr_fp_junta_us_base:0 "A Permanent US Base"
 ROM_upr_fp_junta_us_base_desc:0 "Mihail Kogalniceanu becomes a permanent American base with a full fighter wing. The generals get security, and the Americans get the best airfield on the Black Sea."
 ROM_upr_fp_junta_fortress_romania:0 "Fortress Romania"
 ROM_upr_fp_junta_fortress_romania_desc:0 "The Carpathian passes and the approaches to Bucharest are fortified. A neutral Romania must be too expensive for anyone to attack."
 ROM_upr_fp_junta_arms_from_everyone:0 "Arms from Everyone"
 ROM_upr_fp_junta_arms_from_everyone_desc:0 "Korean tanks, Turkish drones, Israeli missiles and French helicopters: a neutral junta buys from whoever will sell, and copies what it buys."
 ROM_upr_fp_junta_final:0 "The Officers' Foreign Policy"
 ROM_upr_fp_junta_final_desc:0 "The junta has made Romania a military power that its neighbours have to take seriously. Whether they like it is a different question, and not one the generals ask."
 ROM_upr_fp_church_diplomacy_of_faith:0 "The Diplomacy of the Faith"
 ROM_upr_fp_church_diplomacy_of_faith_desc:0 "Romania is the second-largest Orthodox nation in the world, and now it is governed by its Church. Its foreign policy will be made from the Patriarchate as much as from the ministry."
 ROM_upr_fp_church_phanar:0 "The Phanar"
 ROM_upr_fp_church_phanar_desc:0 "The Ecumenical Patriarch in Istanbul is first among equals in Orthodoxy. The Romanian Patriarch's first journey abroad is to the Phanar, and Ankara takes note."
 ROM_upr_fp_church_orthodox_commonwealth:0 "An Orthodox Commonwealth"
 ROM_upr_fp_church_orthodox_commonwealth_desc:0 "Orthodox states share a faith, a calendar and a suspicion of being told what to do by Brussels. The Patriarchate proposes they meet regularly, and listen to Bucharest."
 ROM_upr_fp_church_romanians_abroad:0 "Romanians Beyond the Borders"
 ROM_upr_fp_church_romanians_abroad_desc:0 "Romanian-speaking Orthodox communities live in Ukraine, Serbia, Hungary and Bulgaria. Their parishes look to Bucharest for priests, books and protection."
 ROM_upr_fp_church_athens:0 "Athens and the Holy Mountain"
 ROM_upr_fp_church_athens_desc:0 "Greece is the Orthodox nation closest to Romania in the European Union. A shared stance in Brussels on faith, family and the Balkans makes Athens a natural partner."
 ROM_upr_fp_church_georgia:0 "The Georgian Brethren"
 ROM_upr_fp_church_georgia_desc:0 "Georgia, across the Black Sea, is Orthodox, threatened and looking for friends. A ferry line, a church accord and a defence dialogue tie it to Romania."
 ROM_upr_fp_church_bulgarian_synod:0 "The Bulgarian Synod"
 ROM_upr_fp_church_bulgarian_synod_desc:0 "The Romanian and Bulgarian Churches settle old disputes over parishes on each other's soil. The two governments follow where their bishops lead."
 ROM_upr_fp_church_bukovina_romanians:0 "The Romanians of Bukovina"
 ROM_upr_fp_church_bukovina_romanians_desc:0 "Half a million Romanians live in Ukraine. The Church asks Kyiv for Romanian schools and Romanian-language liturgy, and offers help with Ukraine's refugees in return."
 ROM_upr_fp_church_timok_vlachs:0 "The Vlachs of the Timok"
 ROM_upr_fp_church_timok_vlachs_desc:0 "The Vlachs of eastern Serbia have long asked for services in their own language. Belgrade, courted by Bucharest, finally agrees."
 ROM_upr_fp_church_loyal_constantinople:0 "Loyal to Constantinople"
 ROM_upr_fp_church_loyal_constantinople_desc:0 "The Romanian Church stands with the Ecumenical Patriarch in the great schism of the Orthodox world. That also means standing with the West."
 ROM_upr_fp_church_overtures_moscow:0 "Overtures to Moscow"
 ROM_upr_fp_church_overtures_moscow_desc:0 "Some bishops have always looked east to the largest Orthodox Church in the world. Opening a channel to the Moscow Patriarchate alarms Kyiv, Washington and half the Romanian army."
 ROM_upr_fp_church_pan_orthodox_council:0 "The Pan-Orthodox Council at Iasi"
 ROM_upr_fp_church_pan_orthodox_council_desc:0 "For the first time since 2016, the Orthodox Churches gather in council, and they gather in Romania. Iasi becomes, for a week, the capital of the Orthodox world."
 ROM_upr_fp_church_refugee_relief:0 "Relief for the Refugees"
 ROM_upr_fp_church_refugee_relief_desc:0 "Parishes across Romania take in refugees from the war to the north. Charity becomes the regime's most effective diplomacy."
 ROM_upr_fp_church_patriarch_visit:0 "A Visit from Moscow"
 ROM_upr_fp_church_patriarch_visit_desc:0 "The Patriarch of Moscow celebrates the liturgy in Bucharest. The crowds are large, the protests outside are larger and the NATO ambassadors stay at home."
 ROM_upr_fp_church_gas_deal:0 "Gas at Brotherly Prices"
 ROM_upr_fp_church_gas_deal_desc:0 "Cheap gas, offered between fellow Orthodox nations, keeps Romanian factories running. Everyone understands that it comes with a price that is not written down."
 ROM_upr_fp_church_final:0 "The Covenant Abroad"
 ROM_upr_fp_church_final_desc:0 "The Patriarchal Regency has made Romania the voice of Orthodoxy in Europe. Whether that voice speaks for Constantinople or for Moscow has decided the country's place in the world."
 ROM_upr_fp_romania_in_the_world:0 "Romania in the World"
 ROM_upr_fp_romania_in_the_world_desc:0 "Five years after the uprising, the world has made up its mind about the new Romania. Bucharest is courted, feared or trusted, but it is no longer ignored."
 ROM_upr_fp_new_diplomacy_idea:0 "The New Diplomacy"
 ROM_upr_fp_new_diplomacy_idea_desc:0 "Predictability for the neighbours."
 ROM_upr_fp_royal_diplomacy_idea:0 "The King's Diplomacy"
 ROM_upr_fp_royal_diplomacy_idea_desc:0 "The Crown represents Romania abroad."
 ROM_upr_fp_german_investment_idea:0 "German Investment"
 ROM_upr_fp_german_investment_idea_desc:0 "German factories in Transylvania and Banat."
 ROM_upr_fp_us_garrison_idea:0 "The American Garrison"
 ROM_upr_fp_us_garrison_idea_desc:0 "An American division on Romanian soil."
 ROM_upr_fp_nato_hub_idea:0 "NATO South-East Command"
 ROM_upr_fp_nato_hub_idea_desc:0 "The anchor of the Black Sea flank."
 ROM_upr_fp_danube_customs_idea:0 "The Lower Danube Accords"
 ROM_upr_fp_danube_customs_idea_desc:0 "One market along the river."
 ROM_upr_fp_crown_among_nations_idea:0 "The Crown Among Nations"
 ROM_upr_fp_crown_among_nations_idea_desc:0 "Received in every European capital."
 ROM_upr_fp_arms_diplomacy_idea:0 "Arms for Influence"
 ROM_upr_fp_arms_diplomacy_idea_desc:0 "Rifles and shells as instruments of policy."
 ROM_upr_fp_western_bulwark_idea:0 "The Western Bulwark"
 ROM_upr_fp_western_bulwark_idea_desc:0 "The junta holds the flank."
 ROM_upr_fp_armed_neutrality_idea:0 "Armed Neutrality"
 ROM_upr_fp_armed_neutrality_idea_desc:0 "Nobody's battlefield and nobody's client."
 ROM_upr_fp_junta_final_idea:0 "The Officers' Foreign Policy"
 ROM_upr_fp_junta_final_idea_desc:0 "A military power the neighbours take seriously."
 ROM_upr_fp_faith_diplomacy_idea:0 "The Diplomacy of the Faith"
 ROM_upr_fp_faith_diplomacy_idea_desc:0 "Foreign policy made at the Patriarchate."
 ROM_upr_fp_constantinople_idea:0 "Loyal to Constantinople"
 ROM_upr_fp_constantinople_idea_desc:0 "With the Ecumenical Patriarch and with the West."
 ROM_upr_fp_moscow_overture_idea:0 "The Moscow Channel"
 ROM_upr_fp_moscow_overture_idea_desc:0 "A door opened to the east."
 ROM_upr_fp_gas_deal_idea:0 "Gas at Brotherly Prices"
 ROM_upr_fp_gas_deal_idea_desc:0 "Cheap energy, unwritten conditions."
 ROM_upr_fp_church_final_idea:0 "The Covenant Abroad"
 ROM_upr_fp_church_final_idea_desc:0 "The voice of Orthodoxy in Europe."
 ROM_upr_fp_world_idea:0 "Romania in the World"
 ROM_upr_fp_world_idea_desc:0 "Courted, feared or trusted, but never ignored."
 ROM_fp_partner:0 "Romanian Partnership"
 ROM_fp_strategic_partner:0 "Romanian Strategic Partnership"
 ROM_fp_suspicion:0 "Suspicious of Romania"

 # ===== romania_elections: rework of the shared branches and the communist route (added in audit) =====
 ROM_econ_brain_regain:0 "Bring Back the Engineers"
 ROM_econ_brain_regain_desc:0 "Tens of thousands of Romanian engineers and doctors work in Germany, Britain and Italy. Tax holidays, housing and real salaries are offered to bring them home."
 ROM_econ_tourism:0 "The Carpathians and the Coast"
 ROM_econ_tourism_desc:0 "Transylvanian citadels, painted monasteries, the Danube Delta and the Black Sea coast: Romania has some of the most beautiful country in Europe and almost no tourists. Airports and roads change that."
 ROM_econ_join_the_euro:0 "Join the Euro"
 ROM_econ_join_the_euro_desc:0 "Convergence achieved, Romania applies to join the eurozone. Cheaper credit and the end of currency risk, at the price of the National Bank's independence."
 ROM_econ_keep_the_leu:0 "Keep the Leu"
 ROM_econ_keep_the_leu_desc:0 "Poland and Czechia grew rich without the euro. Romania keeps its own currency, its own interest rates and the freedom to devalue when it must."
 ROM_army_rocket_artillery:0 "Long-Range Rocket Artillery"
 ROM_army_rocket_artillery_desc:0 "HIMARS launchers from America and a licensed rocket line at Cugir give the army the reach to hit an enemy before he reaches the border."
 ROM_army_forward_defence:0 "Forward Defence on the Prut"
 ROM_army_forward_defence_desc:0 "The army will fight on the Prut and in Moldova, not in Romania. Brigades are stationed in the north-east, ready to move the moment the border is crossed."
 ROM_army_defence_in_depth:0 "Defence in Depth"
 ROM_army_defence_in_depth_desc:0 "The Siret, the Focsani Gate and the Carpathians are three lines no army has broken quickly. Romania will trade space for time and let the mountains do the work."
 ROM_air_romanian_light_fighter:0 "A Romanian Light Fighter"
 ROM_air_romanian_light_fighter_desc:0 "IAR built its own jets in the 1970s. Rather than wait years for a share of a foreign programme, Romania designs a light fighter of its own at Craiova and Bacau."
 ROM_navy_naval_drones:0 "Naval Drones"
 ROM_navy_naval_drones_desc:0 "The war in the north showed that cheap sea drones can sink a flagship. Romania builds its own at Mangalia and trains crews to use them."
 ROM_fp_washington_partnership:0 "The Strategic Partnership with Washington"
 ROM_fp_washington_partnership_desc:0 "The 1997 strategic partnership with the United States is renewed and widened: more troops, more investment and a regular dialogue at the highest level."
 ROM_fp_deveselu:0 "The Shield at Deveselu"
 ROM_fp_deveselu_desc:0 "The Aegis Ashore site at Deveselu is the heart of NATO's missile shield in Europe. Romania offers to expand it, and to host a second site on the coast."
 ROM_fp_visa_waiver:0 "Visa-Free to America"
 ROM_fp_visa_waiver_desc:0 "After years of waiting, Romanians can travel to the United States without a visa. It is a small thing, and everyone notices it."
 ROM_fp_ukraine_reconstruction:0 "Rebuilding Ukraine"
 ROM_fp_ukraine_reconstruction_desc:0 "Romanian ports, railways and construction firms are the closest in the EU to southern Ukraine. Reconstruction contracts flow through Constanta and Galati."
 ROM_fp_bucharest_nine:0 "The Bucharest Nine"
 ROM_fp_bucharest_nine_desc:0 "Romania and Poland founded the Bucharest Nine in 2015 to speak for NATO's eastern flank. Bucharest makes it the strongest voice in the alliance."
 ROM_fp_regional_power:0 "A Power on the Danube"
 ROM_fp_regional_power_desc:0 "Between Washington, Kyiv and the eastern flank, Romania has become the country the region turns to first. For the first time in a century it is a power, not a battlefield."
 ROM_soc_red_turn:0 "The Red Turn"
 ROM_soc_red_turn_desc:0 "Workers on the boards and energy in public hands were not enough for the radical wing. They want more than a social democracy, and they have stopped pretending otherwise."
 ROM_soc_refound_pcr:0 "Refound the Communist Party"
 ROM_soc_refound_pcr_desc:0 "The Romanian Communist Party was banned in December 1989. Thirty-five years later its name, its symbols and a surprising number of its old members return."
 ROM_soc_patriotic_guards:0 "The Patriotic Guards"
 ROM_soc_patriotic_guards_desc:0 "Factory militias, once the regime's armed reserve, are raised again in the steelworks of Galati and the shipyards of Constanta. They march under red banners."
 ROM_soc_golden_epoch_nostalgia:0 "Nostalgia for the Old Certainties"
 ROM_soc_golden_epoch_nostalgia_desc:0 "A third of Romanians tell pollsters life was better before 1989: a job for life, a flat from the state, no emigration. The party speaks to them, and they listen."
 ROM_soc_break_the_coalition:0 "Break the Grand Coalition"
 ROM_soc_break_the_coalition_desc:0 "The liberals walk out, the cabinet collapses and the president refuses to appoint anyone else. The streets of Bucharest fill with people for and against."
 ROM_soc_communist_romania:0 "Bring Back Communism"
 ROM_soc_communist_romania_desc:0 "Thirty-six years after Ceausescu fell, the hammer and sickle returns to the flag in Bucharest. President Antonescu, of all people, leads the way."
 ROM_soc_market_socialism:0 "Market Socialism"
 ROM_soc_market_socialism_desc:0 "China and Vietnam showed that a communist party can run a market economy. Romania keeps the private sector, the foreign investors and the EU market, under the party's firm guidance."
 ROM_soc_socialist_republic_restored:0 "The Socialist Republic Restored"
 ROM_soc_socialist_republic_restored_desc:0 "Not a new communism but the old one: the Socialist Republic of Romania, its institutions, its five-year plans and its watchful state, revived in full."
 ROM_soc_five_year_plan:0 "The First Five-Year Plan"
 ROM_soc_five_year_plan_desc:0 "Targets for steel, cement, tractors and housing, set in Bucharest and posted in every factory. The plan is ambitious, and this time the cranes really are going up."
 ROM_soc_state_farms:0 "The Agricultural Cooperatives"
 ROM_soc_state_farms_desc:0 "Small plots are pooled into state-backed cooperatives with tractors, credit and guaranteed prices. Some villages welcome it; others remember 1962."
 ROM_soc_non_aligned:0 "Non-Aligned Again"
 ROM_soc_non_aligned_desc:0 "Ceausescu's Romania was the communist state that defied Moscow. The new one defies Washington instead: it leaves the Western alliance and courts Beijing, Hanoi and Havana."
 ROM_soc_peoples_romania:0 "The People's Romania"
 ROM_soc_peoples_romania_desc:0 "A planned economy, a party state and a foreign policy of its own. Whatever the West thinks of it, the red Romania of the 2020s is here to stay."
 ROM_econ_brain_regain_idea:0 "Bring Back the Engineers"
 ROM_econ_brain_regain_idea_desc:0 "The diaspora comes home with its skills."
 ROM_econ_tourism_idea:0 "Tourism"
 ROM_econ_tourism_idea_desc:0 "Citadels, monasteries and the Delta."
 ROM_econ_euro_idea:0 "Member of the Eurozone"
 ROM_econ_euro_idea_desc:0 "Cheaper credit, no currency risk."
 ROM_econ_leu_idea:0 "The Sovereign Leu"
 ROM_econ_leu_idea_desc:0 "Romania sets its own interest rates."
 ROM_army_forward_defence_idea:0 "Forward Defence"
 ROM_army_forward_defence_idea_desc:0 "Fight on the Prut, not in Romania."
 ROM_army_defence_in_depth_idea:0 "Defence in Depth"
 ROM_army_defence_in_depth_idea_desc:0 "Let the mountains do the work."
 ROM_fp_deveselu_idea:0 "The Missile Shield"
 ROM_fp_deveselu_idea_desc:0 "Deveselu at the heart of NATO air defence."
 ROM_fp_regional_power_idea:0 "A Power on the Danube"
 ROM_fp_regional_power_idea_desc:0 "The country the region turns to first."
 ROM_soc_peoples_republic_idea:0 "The People's Republic"
 ROM_soc_peoples_republic_idea_desc:0 "The red flag flies over Bucharest again."
 ROM_soc_market_socialism_idea:0 "Market Socialism"
 ROM_soc_market_socialism_idea_desc:0 "Private enterprise under the party."
 ROM_soc_hardline_idea:0 "The Socialist Republic"
 ROM_soc_hardline_idea_desc:0 "The old institutions, revived in full."
 ROM_soc_state_farms_idea:0 "Agricultural Cooperatives"
 ROM_soc_state_farms_idea_desc:0 "Pooled land, guaranteed prices."
 ROM_soc_peoples_romania_idea:0 "The People's Romania"
 ROM_soc_peoples_romania_idea_desc:0 "A party state with a foreign policy of its own."
 ROM_soc_communist_support_tt:0 "§YCommunist§! popularity is at least §Y30%§!."
 ROM_elect.40.t:0 "Communism Returns to Romania"
 ROM_elect.40.d:0 "Thirty-six years after the revolution of December 1989, Romania is once again ruled by a communist party. President Crin Antonescu, a liberal for most of his career, has led the turn himself. Bucharest's allies in Brussels and Washington are stunned; its new friends are quietly pleased."
 ROM_elect.40.a:0 "History does not end after all."
