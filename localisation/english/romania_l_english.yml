 l_english:
 dve_rom.1.t:0 "Romania and Bulgaria in Schengen"
 dve_rom.1.d:0 "After years of waiting, Romania and Bulgaria are officially in the Schengen Area. Border checkpoints are shutting down. Passports are no longer needed to travel to the rest of the bloc.\n\nThis ends a long diplomatic fight. It brings both countries closer to the rest of Europe. Trade will move faster without the long lines of trucks at the border. Their economies will get a boost. For the citizens, it means true freedom of movement at last."
 dve_rom.1.a:0 "What a step for both nations."
 dve_rom.2.t:0 "The January Strikes"
 dve_rom.2.d:0 "In January 2025, a wave of strikes and industrial actions swept across Romania as workers confronted worsening economic conditions and government austerity measures.\n\nPolice officers, railway workers, miners, forestry workers, steelworkers, public-sector employees and other organized labor groups took collective action over frozen wages, pension concerns, reduced benefits and measures introduced through the government's so-called 'austerity ordinance'.\n\nThe strikes represented a growing confrontation between organized labor and the Romanian government, with unions demanding that workers' rights and incomes be protected.\n\nDemonstrations organized specifically around political issues and the annulled presidential election remained a separate movement, distinct from the labor actions.\n\nThe January Strikes became a defining moment of labor unrest in Romania - a month when workers organized, withdrew their labor and demanded to be heard."
 dve_rom.2.a:0 "Hope the people get what they want."
 dve_rom.3.t:0 "Klaus Iohannis Resigns"
 dve_rom.3.d:0 "After more than a decade at the helm of Romania, President Klaus Iohannis announced his resignation on February 10, 2025, amid mounting political pressure and a parliamentary procedure seeking his suspension.\n\nIn his address from Cotroceni Palace, Iohannis stated that he was resigning to spare Romania from what he described as an unnecessary and damaging political crisis. His announcement immediately changed the political landscape, ending the planned parliamentary suspension proceedings.\n\nTwo days later, on February 12, Iohannis formally left Cotroceni Palace. Senate President Ilie Bolojan assumed the role of interim president, beginning a transitional period ahead of the rescheduled presidential election."
 dve_rom.3.a:0 "Good luck for him."
 dve_rom.4.t:0 "The Detention of Calin Georgescu"
 dve_rom.4.d:0 "On February 26, 2025, Calin Georgescu was stopped by police in Bucharest while traveling to submit his candidacy for the upcoming presidential election. He was taken to the Prosecutor General's Office for questioning as prosecutors opened a criminal investigation into several alleged offenses.\n\nGeorgescu was questioned for approximately five hours.\n\nProsecutors announced accusations including alleged incitement to actions against the constitutional order, communicating false information, false declarations concerning campaign financing, and promoting extremist organizations and ideologies. Georgescu denied wrongdoing and characterized the investigation as an attempt to prevent his candidacy.\n\nAfter the questioning, Georgescu was released under judicial control for 60 days, including a prohibition on leaving Romania.\n\nHis detention triggered demonstrations outside the prosecutor's office, where supporters gathered demanding his release.\n\nA presidential candidate was taken in for questioning. A political crisis deepened."
 dve_rom.4.a:0 "Welp, there goes a hero."
 dve_rom.5.t:0 "The Presidential Election"
 dve_rom.5.d:0 "The presidential election was held on May 18 2025, it was between Nicusor Dan, Gheorghe Simion and Crin Antonescu. All three of them appear to be really trusted by the people but only one of them can win. Who will the people choose?"
 dve_rom.6.t:0 "A Secret Coming."
 dve_rom.6.d:0 "The people didn't choose any of those candidates listed and instead choosed to delay the elections, out of nowhere, a figure emerges from the Bran Casle, but it's not just a random figure, it looks like an ancient ruler, and from his stand he seems hungry for blood, but who is he?"
 # ===== Prelude tree (romania.txt, Romania_Focus_Tree) =====
 ROM_the_new_year:0 "The New Year"
 ROM_the_new_year_desc:0 "The year is 2025. Let us hope it brings stability rather than chaos."
 ROM_remove_the_strikes:0 "Remove the Strikes"
 ROM_remove_the_strikes_desc:0 "Ever since the Constitutional Court annulled the presidential election in December 2024, protests have kept flaring up across the country. The streets must be calmed before the unrest spreads any further."
 ROM_announce_the_new_candidates:0 "Announce the New Candidates"
 ROM_announce_the_new_candidates_desc:0 "The nation awaits a fresh start. It is time to announce the candidates who will compete for the presidency in this year's elections."
 ROM_stagnate_the_economy:0 "Stagnate the Economy"
 ROM_stagnate_the_economy_desc:0 "The economy is struggling and every bold reform risks making matters worse. For now, the wisest course may be to hold steady and avoid further decline."
 ROM_the_2025_elections:0 "The 2025 Elections"
 ROM_the_2025_elections_desc:0 "The day has finally come. The Romanian people will go to the polls and choose their next president."
 ROM_screw_the_elections:0 "Screw the Elections"
 ROM_screw_the_elections_desc:0 "Weary of endless elections and broken promises, the people have lost their patience. They will no longer wait for the ballot box and have decided to take matters into their own hands."

 # ===== Election tree - Path A: Nicusor Dan (liberal and conservative variants) =====
 ROM_nicusor_victory:0 "Nicusor Victory"
 ROM_nicusor_victory_desc:0 "Nicușor Dan has won the presidency. The people have spoken in favor of democracy, liberty and a Romania firmly anchored in the West."
 ROM_a_nation_of_tradition:0 "A Nation of Tradition"
 ROM_a_nation_of_tradition_desc:0 "Our customs and heritage are what make us Romanian. We must preserve them and pass them on to the generations to come."
 ROM_reform_the_goverment:0 "Reform the Government"
 ROM_reform_the_goverment_desc:0 "Since Iohannis left office in February, the government has been left in disarray. The time has come to rebuild it on firmer foundations."
 ROM_restore_social_order:0 "Restore Social Order"
 ROM_restore_social_order_desc:0 "Order is the foundation of every free society. We will restore stability and security across our democratic nation."
 ROM_promote_the_family:0 "Promote the Family"
 ROM_promote_the_family_desc:0 "The family is the cornerstone of society. By supporting it, we strengthen the future of the nation itself."
 ROM_fix_the_atheism_in_our_nation:0 "Fix the Atheism in our Nation."
 ROM_fix_the_atheism_in_our_nation_desc:0 "Faith has been a pillar of Romanian life for centuries. We will work to bring the Church back to the heart of our national identity."
 ROM_lower_the_tax_burden:0 "Lower the Tax Burden"
 ROM_lower_the_tax_burden_desc:0 "Hard-working families and businesses are weighed down by taxes. Whatever it takes, that burden must be lifted."
 ROM_protect_private_properties:0 "Protect Private Property"
 ROM_protect_private_properties_desc:0 "The right to own property is sacred. It shall be protected at all costs."
 ROM_romania_first_policy:0 "Romania First Policy"
 ROM_romania_first_policy_desc:0 "Romania's interests come before all others. Our foreign policy will serve our nation first, and our nation will stand tall."
 ROM_remain_in_nato_but_in_our_terms:0 "Remain in NATO, but on our terms"
 ROM_remain_in_nato_but_in_our_terms_desc:0 "NATO remains a vital shield, but our membership will no longer be unconditional. Our allies must agree to terms that respect Romanian sovereignty."
 ROM_the_conservative_state_of_romania:0 "The Conservative State of Romania"
 ROM_the_conservative_state_of_romania_desc:0 "Faith, family and tradition will guide our nation. We proclaim Romania a proud and steadfast conservative state."
 ROM_the_investiture_of_prime_minister_bolojan:0 "The Investiture of Prime Minister Bolojan"
 ROM_the_investiture_of_prime_minister_bolojan_desc:0 "To bring stability to the government, a coalition of PSD, PNL, USR and UDMR will be formed under Prime Minister Ilie Bolojan."
 ROM_cut_everything:0 "Cut Everything"
 ROM_cut_everything_desc:0 "With a new government in power, the deficit can no longer be ignored. Painful as it may be, every budget line must be cut to restore order to the public finances."
 ROM_the_trial_of_georgescu:0 "The Trial of Georgescu"
 ROM_the_trial_of_georgescu_desc:0 "Călin Georgescu now faces criminal charges. The courts must decide his fate, and the whole nation will be watching."
 ROM_national_reconciliation:0 "National Reconciliation"
 ROM_national_reconciliation_desc:0 "The wounds of the past months must heal. By granting amnesty to the protesters and reaching out to disillusioned populist voters, we can avert a deeper crisis and reunite the nation."
 ROM_address_corruption:0 "Address Corruption"
 ROM_address_corruption_desc:0 "Since the Revolution of 1989, corruption has taken root in every corner of our nation. It is time to find a lasting solution and root it out."
 ROM_focus:0 "Invest in DNA"
 ROM_focus_desc:0 "For years, the National Anticorruption Directorate has been held back by a lack of funding. With those who stood in its way now gone, we can finally give it the resources it needs to do its job."
 ROM_improve_the_infastructure:0 "Improve the Infrastructure"
 ROM_improve_the_infastructure_desc:0 "Our cities are crumbling and our roads are neglected. By investing in modern infrastructure, we can build a Romania worthy of the 21st century."
 ROM_everything_was_a_lie:0 "Everything was a Lie."
 ROM_everything_was_a_lie_desc:0 "It was all a deception. Corruption was never tackled and infrastructure was never improved. All that was truly done was cut spending, and the savings promised to the national debt never arrived."
 ROM_euro_atlantic_anchor:0 "Euro-Atlantic Anchor"
 ROM_euro_atlantic_anchor_desc:0 "Romania's security and prosperity are tied to NATO and the European Union. The new government will make that clear in every capital, in Brussels, Washington and Chisinau alike."
 ROM_increase_our_spending_for_defence:0 "Increase our Spending for Defence"
 ROM_increase_our_spending_for_defence_desc:0 "With war still raging across the border in Ukraine, Romania can no longer treat defence as an afterthought. Our borders must be secured, and our armed forces must be ready."
 ROM_dan_recovery_plan:0 "National Recovery Plan"
 ROM_dan_recovery_plan_desc:0 "Billions in European recovery money are still waiting to be spent. A single recovery plan will put them into railways, power grids and hospitals before the deadline passes."
 ROM_guarantee_moldova:0 "Guarantee Moldova's Independence"
 ROM_guarantee_moldova_desc:0 "Moldova is a sovereign state, and Romania will say so to anyone who doubts it. A guarantee from Bucharest will make clear that its borders are not up for negotiation."
 ROM_moldova_referendum:0 "A Referendum on Union"
 ROM_moldova_referendum_desc:0 "Voters in both countries will be asked whether the Prut should still divide them. Nobody will be forced, and the result will be accepted by both capitals."
 ROM_eu_for_moldova:0 "Champion of Moldova's EU Bid"
 ROM_eu_for_moldova_desc:0 "Romanian diplomats, experts and civil servants will help Chisinau through the long accession process, chapter by chapter."
 ROM_integrate_the_prut:0 "Integrate the Prut"
 ROM_integrate_the_prut_desc:0 "Two administrations, two armies and two pension systems have to become one. The work will be slow, but the border on the Prut has stopped being a border."
 ROM_guarantee_ukraine:0 "Stand with Ukraine"
 ROM_guarantee_ukraine_desc:0 "The war across the Danube is a war at our door. Romania will guarantee Ukraine's borders, open its ports and its rail links, and say clearly where it stands."
 ROM_three_seas_alliance:0 "Three Seas Alliance"
 ROM_three_seas_alliance_desc:0 "Poland, the Baltic states, Slovakia, Bulgaria and Romania already trade pipelines and rail links. It is time to turn the Three Seas Initiative into a real alliance."
 ROM_black_sea_security_pact:0 "Black Sea Security Pact"
 ROM_black_sea_security_pact_desc:0 "Bulgaria and Romania share one coast and one threat. A joint pact on mine clearing, air policing and naval cooperation will make the western Black Sea much harder to bully."
 ROM_guardian_of_the_black_sea:0 "Guardian of the Black Sea"
 ROM_guardian_of_the_black_sea_desc:0 "Romania has become the steady anchor of the whole region, with a government that works, an army that is respected and neighbours who trust it. The country is no longer an afterthought in Europe."

 # ===== Election tree - Path B: George Simion (nationalist and fascist variants) =====
 ROM_simion_victory:0 "Simion's Victory"
 ROM_simion_victory_desc:0 "George Simion has won the presidency. The people have demanded a proudly nationalist Romania, and their will shall be done."
 ROM_release_calin_georgecu:0 "Release Calin Georgescu"
 ROM_release_calin_georgecu_desc:0 "To his supporters, Călin Georgescu is a political prisoner. The man who gave voice to millions will no longer sit behind bars."
 ROM_implement_a_nationalist_idea:0 "Implement a Nationalist Idea"
 ROM_implement_a_nationalist_idea_desc:0 "Glory to our beautiful nation. Let its ideals guide every decision we make."
 ROM_fix_corruption:0 "Fix Corruption"
 ROM_fix_corruption_desc:0 "Where others have only made promises, we will deliver. Corruption will be rooted out of Romania once and for all."
 ROM_increse_military_production:0 "Increase Military Production"
 ROM_increse_military_production_desc:0 "A strong army needs a strong industry behind it. More military factories will arm the nation for whatever lies ahead."
 ROM_promise_for_a_new_romania:0 "Promise for a New Romania"
 ROM_promise_for_a_new_romania_desc:0 "We pledge to build a Romania that is stronger, fairer and more prosperous than it has ever been."
 ROM_focus_on_brining_back_our_people:0 "Focus on Bringing Back our People"
 ROM_focus_on_brining_back_our_people_desc:0 "Millions of Romanians have left in search of a better life. Let them return home and witness what we have built for our country."
 ROM_promote_nationalism:0 "Promote Nationalism"
 ROM_promote_nationalism_desc:0 "From the Carpathians to the Black Sea, our nationalist ideals will be spread to every corner of Romania."
 ROM_go_full_fascism:0 "Go Full Fascism"
 ROM_go_full_fascism_desc:0 "The people have chosen nationalism, and there is no reason to stop halfway. It is time to embrace a harder, more authoritarian vision for Romania."
 ROM_the_idea_of_a_greater_romania:0 "The Idea of a Greater Romania"
 ROM_the_idea_of_a_greater_romania_desc:0 "A dream that has been passed down through generations, one that many have wished to see made real."
 ROM_remember_the_great_fascist_leaders:0 "Remember the Great Fascist Leaders"
 ROM_remember_the_great_fascist_leaders_desc:0 "History remembers the leaders who forged disciplined, unified nations out of chaos. We will learn from their example and follow the path they laid."
 ROM_the_country_of_nationalism:0 "The Country of Nationalism"
 ROM_the_country_of_nationalism_desc:0 "Romania will stand as a shining example of what a nation can achieve when it is united by pride in its heritage."
 ROM_praise_codreanu:0 "Praise Codreanu"
 ROM_praise_codreanu_desc:0 "Corneliu Zelea Codreanu still lives in the hearts of his followers. His memory endures, and we honor him as our true leader."
 ROM_sovereign_bloc:0 "Pact of Sovereign Nations"
 ROM_sovereign_bloc_desc:0 "Hungary, Poland and Slovakia also want Brussels to leave them alone. Romania will offer them guarantees and ask for the same in return, a bloc of nations that decide for themselves."
 ROM_claim_the_lost_lands:0 "Claim the Lost Lands"
 ROM_claim_the_lost_lands_desc:0 "Bessarabia, Northern Bukovina, the Budjak and the Dobruja were Romanian before the great powers redrew the map. The government will now say so, in public and in writing."
 ROM_demand_moldovan_union:0 "Demand Union with Moldova"
 ROM_demand_moldovan_union_desc:0 "Chisinau has a choice: a union on honourable terms, or isolation. Bucharest is no longer willing to wait."
 ROM_moldovan_brotherhood:0 "Brothers, Not Subjects"
 ROM_moldovan_brotherhood_desc:0 "Moldovans are Romanians in every way that matters. Romania will guarantee their sovereignty and let the union come about when they decide they are ready."
 ROM_reclaim_northern_bukovina:0 "Reclaim Northern Bukovina"
 ROM_reclaim_northern_bukovina_desc:0 "Cernauti and the northern half of Bukovina were taken in 1940 by a pact that most of the world has long since condemned. The time has come to ask for them back."
 ROM_reclaim_budjak:0 "Reclaim the Budjak"
 ROM_reclaim_budjak_desc:0 "Southern Bessarabia gives access to the mouths of the Danube. Romania will demand it, and will not forget it."
 ROM_reclaim_dobruja:0 "Reclaim Southern Dobruja"
 ROM_reclaim_dobruja_desc:0 "The Cadrilater went to Bulgaria in 1940 and has stayed there ever since. Sofia can give it up, or Romania will take the matter to a different table."
 ROM_black_sea_brotherhood:0 "Orthodox Brotherhood with Bulgaria"
 ROM_black_sea_brotherhood_desc:0 "Bulgaria and Romania share a faith, a coast and a long list of grievances against bigger neighbours. Romania will drop its claim on Dobruja and guarantee Bulgaria's borders instead."
 ROM_greater_romania:0 "Greater Romania"
 ROM_greater_romania_desc:0 "The dream is finally within reach. The Great State of Romania shall be restored in all its glory."

 # ===== Election tree - Path C: Crin Antonescu (socialist and communist variants) =====
 ROM_victory_for_antonescu:0 "Victory for Antonescu"
 ROM_victory_for_antonescu_desc:0 "Crin Antonescu has won the presidency. The voters have chosen an experienced party veteran who promises steady government and a stronger state that looks after its citizens."
 ROM_stick_with_socialism:0 "Stick With Socialism"
 ROM_stick_with_socialism_desc:0 "The people have placed their trust in a fairer society, and they intend to keep it that way until the end of time."
 ROM_turn_back_to_communism:0 "Turn Back to Communism."
 ROM_turn_back_to_communism_desc:0 "Or perhaps not... Some roads, once left behind, are better never walked again."
 ROM_pact:0 "Pact With the Trade Unions"
 ROM_pact_desc:0 "The unions can paralyse the country or help to run it. In return for wage guarantees and a seat at the table, they will back the government and keep the factories working."
 ROM_strenght:0 "Strengthen the Welfare State"
 ROM_strenght_desc:0 "Pensions, hospitals and schools have been starved of funds for years. A stronger welfare state will give every citizen something to stand on, and the government the loyalty that comes with it."
 ROM_invest:0 "Invest the Recovery Funds"
 ROM_invest_desc:0 "Billions in European recovery money are still waiting to be spent. Investing them quickly in rail, energy and hospitals will modernise the country and prove that the Western anchor pays off."
 ROM_public_housing:0 "Public Housing Programme"
 ROM_public_housing_desc:0 "Young families cannot afford to rent in the cities and cannot afford to leave them. The state will build apartment blocks, with rents that people can actually pay."
 ROM_focus_3:0 "Stay Anchored in the West"
 ROM_focus_3_desc:0 "Romania's security and prosperity depend on NATO and the European Union. Whatever the pressure from the East or from populists at home, our place remains in the Western alliance."
 ROM_focus_4:0 "Strategic Autonomy"
 ROM_focus_4_desc:0 "Romania will rely on its own strength where it can and on partners where it must. Building up domestic industry and a more independent foreign policy will keep us from being at anyone's mercy."
 ROM_focus_5:0 "Modernise the Armed Forces"
 ROM_focus_5_desc:0 "The army still leans on ageing Soviet-era equipment. New weapons, better training and a modern command structure will turn it into a force fit for the 21st century."
 ROM_focus_6:0 "The Socialist State of Romania"
 ROM_focus_6_desc:0 "The country will be reorganised around public ownership, public services and the working class. This socialism will answer to the voters and the unions, not to a single party."
 ROM_nationalise:0 "Nationalise Key Industries"
 ROM_nationalise_desc:0 "Private owners have run the pipelines, refineries and railways for profit long enough. The state will take them back, and the revenue will serve the people instead of the shareholders."
 ROM_dissolve:0 "Dissolve the Opposition"
 ROM_dissolve_desc:0 "The government has run out of patience with the endless squabbling in parliament. Opposition parties will be banned or absorbed, and from now on the state speaks with one voice."
 ROM_focus_2:0 "A New Five-Year Plan"
 ROM_focus_2_desc:0 "Planners in Bucharest are dusting off an old tool for a new age. A five-year plan will set output targets for industry, farms and energy, and give every ministry a clear goal to meet."
 ROM_peoples_militia:0 "The People's Militia"
 ROM_peoples_militia_desc:0 "Factory guards, trade union brigades and reserve units will be merged into one armed force that answers to the Party and nobody else."
 ROM_focus_7:0 "Collective Agriculture"
 ROM_focus_7_desc:0 "Small private plots are to be merged into large cooperative farms. Critics remember how this went the last time, but the planners promise that this time the harvest will be bigger."
 ROM_focus_8:0 "Rebuild the Securitatea"
 ROM_focus_8_desc:0 "The old secret police may be hated, but the new leadership sees its uses. A reborn Securitatea will watch for the enemies of the state, both real and imagined."
 ROM_focus_9:0 "Join The East"
 ROM_focus_9_desc:0 "The West has offered us lectures and little else. It is time to look to Moscow and Beijing for partners who will not ask awkward questions."
 ROM_focus_10:0 "National Communism"
 ROM_focus_10_desc:0 "Romania will build socialism in its own way, answerable to no foreign master. Ceausescu showed that there is a road between Moscow and the West, and we intend to walk it."
 ROM_focus_11:0 "The Socialist State of Romania"
 ROM_focus_11_desc:0 "The revolution is complete. The Party leads the state, the economy is planned from above and the working class holds power, at least on paper."
 ROM_fraternal_ties:0 "Fraternal Ties with Chisinau"
 ROM_fraternal_ties_desc:0 "Moldovan workers and Romanian workers share a language, a history and the same bosses. The government will reach out to the left in Chisinau and offer practical help."
 ROM_guarantee_moldova_left:0 "Guarantee the Moldovan Workers"
 ROM_guarantee_moldova_left_desc:0 "An independent, friendly and socially minded Moldova is worth more than a reluctant satellite. Romania will guarantee its borders and its right to choose."
 ROM_peoples_union_moldova:0 "Union of the Working Peoples"
 ROM_peoples_union_moldova_desc:0 "The workers of the Prut have been divided by borders that were drawn for other people's convenience. A union of the working peoples will erase that line."
 ROM_balkan_solidarity:0 "Balkan Solidarity"
 ROM_balkan_solidarity_desc:0 "The Balkans have been carved up by empires for centuries. Romania will offer Bulgaria and Serbia guarantees, trade and a common front against outside pressure."
 ROM_balkan_socialist_union:0 "Balkan Socialist Union"
 ROM_balkan_socialist_union_desc:0 "A bloc of friendly governments from the Danube to the Aegean will have a larger voice than any of its members could have alone."
 ROM_socialist_beacon:0 "Beacon of the Balkans"
 ROM_socialist_beacon_desc:0 "The country is prosperous, the workers are secure and the neighbours look at Romania with respect. The experiment has worked, and the whole region knows it."

 # ===== Election tree - Army reform branch =====
 ROM_army_hub:0 "Army Reform Command"
 ROM_army_hub_desc:0 "The Land Forces need one plan instead of a dozen competing ones. A reform command will coordinate recruitment, training, equipment and doctrine."
 ROM_army_conscription:0 "Modern Conscription"
 ROM_army_conscription_desc:0 "Voluntary service has not filled the ranks. A modernised system with shorter terms and better pay will give the army manpower without the old resentment."
 ROM_army_training:0 "Reformed Training"
 ROM_army_training_desc:0 "Training grounds such as Cincu and Smardan are being rebuilt around combined-arms drills, so that recruits learn to fight alongside tanks, guns and air support."
 ROM_army_procurement:0 "Clean Procurement"
 ROM_army_procurement_desc:0 "Past arms deals vanished into the pockets of middlemen. Open tenders and independent audits will make sure the money buys weapons instead of commissions."
 ROM_army_infantry:0 "Modern Infantry Equipment"
 ROM_army_infantry_desc:0 "Rifles, body armour, night optics and radios will be issued in quantity to every infantry battalion, replacing kit that is older than the soldiers carrying it."
 ROM_army_armour:0 "Armoured Renewal"
 ROM_army_armour_desc:0 "New tanks and armoured vehicles will replace the ageing TR-85 and TR-125. A modern armoured force is the best answer to any thrust across the plains."
 ROM_army_artillery:0 "Artillery and Anti-Tank"
 ROM_army_artillery_desc:0 "Self-propelled guns, rocket launchers and long-range anti-tank missiles will give the army the firepower to stop a mechanised attack."
 ROM_army_carpathian:0 "The Carpathian Line"
 ROM_army_carpathian_desc:0 "The mountains are a natural fortress. Prepared positions, minefields and fire bases in the passes will make any invasion of Transylvania a costly affair."
 ROM_army_mobile:0 "Mobile Corps"
 ROM_army_mobile_desc:0 "A fast reaction force with its own trucks, armoured carriers and supplies will reach any threatened sector in days rather than weeks."
 ROM_army_mobilisation:0 "National Mobilisation Plan"
 ROM_army_mobilisation_desc:0 "Reserve rolls, depots and transport schedules are being rewritten so that Romania can put hundreds of thousands of soldiers in the field at short notice."
 ROM_army_nato:0 "NATO Interoperability"
 ROM_army_nato_desc:0 "Our units will train, communicate and fight alongside our allies. The same radios, procedures and ammunition mean allied brigades can plug straight into our line."
 ROM_army_doctrine:0 "Defence in Depth"
 ROM_army_doctrine_desc:0 "Allied reinforcements are never guaranteed. A doctrine of layered, flexible defence will let a smaller force hold out on its own."
 ROM_army_officers:0 "Professional Officer Corps"
 ROM_army_officers_desc:0 "Promotion by merit, staff colleges abroad and decent pay will build a leadership that the soldiers can respect."
 ROM_army_industry:0 "Arms Industry Revival"
 ROM_army_industry_desc:0 "Plants at Cugir, Sadu and Mioveni will be modernised, and joint ventures with Western firms will bring new lines of ammunition, vehicles and weapons."
 ROM_army_cyber:0 "Cyber and Electronic Warfare"
 ROM_army_cyber_desc:0 "Wars are fought in the spectrum and on the network as much as in the field. A cyber command will defend our systems and blind the enemy's."
 ROM_army_territorial:0 "Territorial Defence Force"
 ROM_army_territorial_desc:0 "Trained volunteers organised by county will defend their own towns and valleys. Every village becomes a strongpoint."
 ROM_army_superpower:0 "Land Power of the Black Sea"
 ROM_army_superpower_desc:0 "A modern, well-equipped and well-led army now guards the eastern flank. Few neighbours would care to test it."

 # ===== Election tree - Air force branch =====
 ROM_air_hub:0 "Air Force Modernisation"
 ROM_air_hub_desc:0 "The Air Force flies a mix of old designs and a few new aircraft. A coherent programme will bring it up to the standard of its allies."
 ROM_air_bases:0 "Modernised Air Bases"
 ROM_air_bases_desc:0 "Runways, hangars, hardened shelters and fuel depots at Fetesti, Campia Turzii and Mihail Kogalniceanu will be brought up to a modern standard."
 ROM_air_pilots:0 "Pilot Pipeline"
 ROM_air_pilots_desc:0 "Pilots are costly to train and easy to lose to foreign airlines. A new flight academy and better contracts will keep a steady stream of aviators coming."
 ROM_air_procurement:0 "Transparent Air Contracts"
 ROM_air_procurement_desc:0 "Aircraft deals will go through open competition, with the offsets and training packages on the table for everyone to see."
 ROM_air_fighters:0 "F-16 and F-35 Fleet"
 ROM_air_fighters_desc:0 "More Fighting Falcons and eventually the F-35 will fill the gap left by the retired MiG-21 LanceRs and give us a fighter fleet that matches our allies'."
 ROM_air_cas:0 "Close Air Support"
 ROM_air_cas_desc:0 "Attack helicopters and ground-attack aircraft will work hand in hand with the army, striking columns that try to break through our lines."
 ROM_air_defence:0 "Integrated Air Defence"
 ROM_air_defence_desc:0 "Patriot batteries, mobile launchers and fighters will be tied into a single network that covers the whole country from the Danube delta to Maramures."
 ROM_air_radar:0 "National Radar Network"
 ROM_air_radar_desc:0 "Long-range radars on every border and mountain top will give early warning of anything approaching, from fighters to drones and missiles."
 ROM_air_logistics:0 "Air Logistics"
 ROM_air_logistics_desc:0 "Spare parts, munitions and fuel will reach every squadron on time. An air force is only as good as its supply chain."
 ROM_air_centre:0 "Air Operations Centre"
 ROM_air_centre_desc:0 "A modern command centre will plan and direct every air mission, and talk directly to NATO's air command."
 ROM_air_superiority:0 "Air Superiority Doctrine"
 ROM_air_superiority_desc:0 "Control of the sky decides every other battle. Our pilots will train to win it first and to hold it for as long as it takes."
 ROM_air_strike:0 "Deep Strike Doctrine"
 ROM_air_strike_desc:0 "Missiles and strike aircraft will hit the enemy's bridges, depots and headquarters far behind the front line."
 ROM_air_industry:0 "Aerospace Industry"
 ROM_air_industry_desc:0 "The old IAR works at Brasov will build aircraft parts again, and partnerships with foreign manufacturers will bring maintenance, assembly and engineering work home."
 ROM_air_drones:0 "Drone Programme"
 ROM_air_drones_desc:0 "The war next door has shown that cheap drones change everything. Reconnaissance, strike and interceptor drones will be built at home."
 ROM_air_transport:0 "Transport and Airlift"
 ROM_air_transport_desc:0 "Modern transport aircraft will move troops and cargo across the country and beyond, and get help to our allies quickly when it is needed."
 ROM_air_policing:0 "NATO Air Policing"
 ROM_air_policing_desc:0 "Romanian fighters will join the alliance's air policing missions, protecting our own sky and that of our neighbours."
 ROM_air_superpower:0 "Masters of the Carpathian Skies"
 ROM_air_superpower_desc:0 "Fighters, drones and radars now guard the east. The Black Sea region has an air power that cannot be ignored."

 # ===== Election tree - Navy branch =====
 ROM_navy_hub:0 "Naval Modernisation"
 ROM_navy_hub_desc:0 "The Navy has a long coast, a busy port and only a handful of ships. A modernisation plan will build a fleet suited to the Black Sea of this decade."
 ROM_navy_constanta:0 "Constanta Naval Base"
 ROM_navy_constanta_desc:0 "The base at Constanta will be expanded with new piers, repair yards and air-defence cover, turning it into a proper home for the fleet."
 ROM_navy_academy:0 "Mircea cel Batran Academy"
 ROM_navy_academy_desc:0 "The Naval Academy will be modernised, and our officers will train on allied ships as well as our own."
 ROM_navy_procurement:0 "Clean Shipyard Contracts"
 ROM_navy_procurement_desc:0 "Shipbuilding deals will be tendered openly and monitored closely, so that the money buys ships and not the yachts of middlemen."
 ROM_navy_frigates:0 "New Frigates and Corvettes"
 ROM_navy_frigates_desc:0 "Modern multi-role frigates and corvettes will replace the old Type 22s and Soviet-era hulls, bringing real power to the Black Sea Fleet."
 ROM_navy_submarines:0 "Submarine Programme"
 ROM_navy_submarines_desc:0 "A small force of modern submarines would make the Black Sea an uncomfortable place for any invasion fleet. We have not had a working one for years."
 ROM_navy_coastal:0 "Coastal Defence Batteries"
 ROM_navy_coastal_desc:0 "Anti-ship missile batteries along the coast will make our shoreline a risky place for any enemy warship."
 ROM_navy_shipyards:0 "Mangalia and Galati Shipyards"
 ROM_navy_shipyards_desc:0 "The shipyards at Mangalia and Galati will be revived, so that the Navy's ships can be built, repaired and upgraded at home."
 ROM_navy_danube:0 "Danube Flotilla"
 ROM_navy_danube_desc:0 "River monitors and patrol boats will secure the Danube, one of Europe's busiest waterways and our frontier with Ukraine."
 ROM_navy_command:0 "Black Sea Command"
 ROM_navy_command_desc:0 "A unified command will coordinate the fleet, the coastal batteries and the air force across the western Black Sea."
 ROM_navy_control:0 "Sea Control Doctrine"
 ROM_navy_control_desc:0 "We will plan to win and hold the sea lanes by escorting convoys, clearing mines and controlling the waters around our coast."
 ROM_navy_denial:0 "Sea Denial Doctrine"
 ROM_navy_denial_desc:0 "We do not need to win everywhere. Missiles, mines and submarines will make it far too costly for any hostile fleet to enter our waters."
 ROM_navy_ports:0 "Modern Ports"
 ROM_navy_ports_desc:0 "Constanta will become the largest and best-equipped port on the Black Sea, serving trade in peace and allied logistics in war."
 ROM_navy_missiles:0 "Naval Missiles"
 ROM_navy_missiles_desc:0 "Anti-ship and land-attack missiles on every hull will give the fleet a reach far longer than its size would suggest."
 ROM_navy_bluewater:0 "Beyond the Black Sea"
 ROM_navy_bluewater_desc:0 "Romanian ships will sail through the Straits to join allied patrols in the Mediterranean and beyond."
 ROM_navy_navalair:0 "Naval Aviation"
 ROM_navy_navalair_desc:0 "Maritime patrol aircraft and helicopters will extend the fleet's eyes over the sea and give its ships air cover."
 ROM_navy_superpower:0 "Pride of the Black Sea"
 ROM_navy_superpower_desc:0 "The Romanian Navy has grown from a coastal service into a respected fleet. The Black Sea has a new naval power, and it flies the tricolour."

 # ===== Election tree - Economy branch and finale =====
 ROM_eco_hub:0 "Economic Council"
 ROM_eco_hub_desc:0 "A single council will draw up the national economic plan, bringing together the finance ministry, industry and the regions."
 ROM_eco_tax:0 "Simpler Taxes"
 ROM_eco_tax_desc:0 "A shorter tax code and a digital filing system will make paying taxes easy and evading them awkward."
 ROM_eco_infra:0 "National Infrastructure Programme"
 ROM_eco_infra_desc:0 "Motorways, rail lines and bridges will finally connect every corner of the country, from Maramures to the Danube delta."
 ROM_eco_corruption:0 "Clean Public Contracts"
 ROM_eco_corruption_desc:0 "Public contracts will be tendered openly and published online, so that every leu can be traced to a project and every project to a name."
 ROM_eco_energy:0 "Energy Independence"
 ROM_eco_energy_desc:0 "Nuclear, gas, hydro and renewables will be developed together, so that Romania never has to rely on anyone else's pipeline."
 ROM_eco_industry:0 "Industrial Revival"
 ROM_eco_industry_desc:0 "New factories and industrial parks, especially in the neglected regions, will give those regions something to build on."
 ROM_eco_tech:0 "Technology Sector"
 ROM_eco_tech_desc:0 "Romania already supplies the world with software developers. Tax breaks and research funds will encourage them to build products here and not just services."
 ROM_eco_neptun:0 "Neptun Deep"
 ROM_eco_neptun_desc:0 "Black Sea gas will make Romania the largest gas producer in the European Union and a net energy exporter."
 ROM_eco_agri:0 "Agricultural Powerhouse"
 ROM_eco_agri_desc:0 "Irrigation, silos and rail lines to the ports will turn the plains of the south and east into one of the continent's great food producers."
 ROM_eco_planning:0 "National Planning Council"
 ROM_eco_planning_desc:0 "Planners, economists and ministers will chart the next decade of development and decide where the country's money does the most good."
 ROM_eco_market:0 "The Free-Market Boom"
 ROM_eco_market_desc:0 "Deregulation, privatisation and foreign investment will let the market decide. Growth will be quick and uneven."
 ROM_eco_capitalism:0 "State Capitalism"
 ROM_eco_capitalism_desc:0 "Strategic industries stay in state hands but are run on commercial lines. The government steers and the market rows."
 ROM_eco_exports:0 "Export Champion"
 ROM_eco_exports_desc:0 "Romanian cars, machinery, software and food will compete in every market, and new trade deals will open the doors."
 ROM_eco_digital:0 "Digital Economy"
 ROM_eco_digital_desc:0 "Fibre, cloud services and e-government will make Romania one of the most connected countries in Europe."
 ROM_eco_finance:0 "Bucharest Financial Centre"
 ROM_eco_finance_desc:0 "A well-regulated stock exchange and banking sector will make Bucharest the financial hub of south-eastern Europe."
 ROM_eco_logistics:0 "Logistics Hub"
 ROM_eco_logistics_desc:0 "Ports, rail, motorways and the Danube will make Romania the natural gateway between the Black Sea and central Europe."
 ROM_eco_superpower:0 "Tiger of the Carpathians"
 ROM_eco_superpower_desc:0 "A modern, diversified, fast-growing economy has made Romania a power in its own right, rich in energy, talent and ambition."
 ROM_superpower_final:0 "The Romanian Great Power"
 ROM_superpower_final_desc:0 "The army, the air force, the navy and the economy have all been rebuilt. Romania is a great power on the Black Sea and a leading voice in Europe."

 # ===== Keys not used by any focus in the two trees (kept in case an event or old file uses them) =====
