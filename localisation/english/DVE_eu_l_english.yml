 DVE_EU_BANNER_QMV_STATUS:0 "QMV Vote Status: [GetEUCouncilQMVStatus]"
 DVE_EU_OPEN_PARLIAMENT_BTN:0 "European Parliament"
 DVE_EU_OPEN_PARLIAMENT_TT:0 "§HClick to open the European Parliament window.§!\n\nView the 705-seat Hemicycle, political group alignments, coalition status, and national MEP delegations under the Treaty of Lisbon."
 DVE_EU_BANNER_BOTTOM_MEMBER:0 "§WOrdinary Legislative Procedure (Co-decision) & Single Market§!"

 DVE_EU_CANDIDATE_BANNER_TITLE:0 "§YEU CANDIDATE - COPENHAGEN CRITERIA§!"
