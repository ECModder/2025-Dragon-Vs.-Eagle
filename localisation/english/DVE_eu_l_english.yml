 DVE_EU_COALITION_DESC:0 "Current Coalition (EPP + S&D + Renew): §G[?global.DVE_eu_ep_coalition_seats|0] seats§! ([GetEUCoalitionStatus]).\nThis pro-European grand coalition guarantees legislative stability and ensures the election and confirmation of the European Commission President and College."
 DVE_EU_POWERS_TITLE:0 "§YParliamentary Powers (Treaty of Lisbon)§!"
 DVE_EU_POWERS_DESC:0 "- §HOrdinary Legislative Procedure§!: Equal co-decision with the Council on regulations and directives.\n- §HBudgetary Authority§!: Final say on the Annual EU Budget and consent on the Multiannual Financial Framework (MFF).\n- §HEnlargement Veto§!: Mandatory assent required for any new Accession Treaty."
