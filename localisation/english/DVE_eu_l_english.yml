 # ============================================================
 # Decisions Localisation
 # ============================================================
 DVE_eu_open_parliament:0 "Convene the European Parliament"
 DVE_eu_open_parliament_desc:0 "Open the European Parliament hemicycle window to view political group seat allocations and national delegations."
 DVE_eu_vote_council_for:0 "Cast Vote: IN FAVOR (Council of the EU)"
 DVE_eu_vote_council_for_desc:0 "Direct our Minister in the Council of the European Union to vote in favor of the current Commission proposal."
 DVE_eu_vote_council_against:0 "Cast Vote: AGAINST (Council of the EU)"
 DVE_eu_vote_council_against_desc:0 "Instruct our delegation in the Council to oppose the current proposal and seek coalition partners to form a blocking minority (requiring at least 4 Member States representing over 35% of the EU population)."
 DVE_eu_vote_council_abstain:0 "Cast Vote: ABSTAIN (Council of the EU)"
 DVE_eu_vote_council_abstain_desc:0 "Abstain from voting on the Council measure. In qualified majority voting, abstentions count against the adoption of the proposal."
 DVE_eu_single_market_directive:0 "Advance Single Market Harmonization"
 DVE_eu_single_market_directive_desc:0 "Implement new European regulations deepening the four fundamental freedoms: free movement of goods, capital, services, and persons."
 DVE_eu_green_transition:0 "European Green Deal & Energy Union"
 DVE_eu_green_transition_desc:0 "Channel European infrastructure and energy transition funds into modernizing national clean energy grids and reducing carbon reliance."
 DVE_eu_digital_framework:0 "Digital Markets Act & AI Regulation"
 DVE_eu_digital_framework_desc:0 "Adopt cutting-edge European technological regulations to promote secure digital sovereignty, research initiatives, and cyber resilience."
 DVE_eu_pesco_defense:0 "PESCO & European Defense Autonomy"
 DVE_eu_pesco_defense_desc:0 "Deepen participation in the Permanent Structured Cooperation (PESCO) and European Defence Fund to harmonize joint military procurement and industrial production."
 DVE_eu_cohesion_fund:0 "Draw from EU Cohesion & Recovery Funds"
 DVE_eu_cohesion_fund_desc:0 "Utilize allocations from the Multiannual Financial Framework (MFF) and NextGenerationEU to boost domestic regional infrastructure and industrial recovery."
 DVE_eu_subsidiarity_check:0 "Invoke National Subsidiarity Review"
 DVE_eu_subsidiarity_check_desc:0 "Exercise our National Parliament's right under Protocol No. 2 to scrutinize whether a draft legislative act complies with the principle of subsidiarity (Yellow Card mechanism)."

 DVE_eu_cand_open_parliament:0 "View European Parliament Projection"
 DVE_eu_cand_open_parliament_desc:0 "Examine the European Parliament hemicycle to see where our country's projected MEP delegation would sit once full accession is achieved."
 DVE_eu_copenhagen_rule_of_law:0 "Judicial Reforms & Anti-Corruption Overhaul"
 DVE_eu_copenhagen_rule_of_law_desc:0 "Fulfill the Copenhagen Political Criterion by reinforcing judicial independence, guaranteeing human rights, and instituting specialized anti-corruption courts."
 DVE_eu_copenhagen_market_economy:0 "Market Economy & Financial Transparency"
 DVE_eu_copenhagen_market_economy_desc:0 "Fulfill the Copenhagen Economic Criterion by liberalizing market access, eliminating monopolistic distortions, and stabilizing macroeconomic fundamentals."
 DVE_eu_copenhagen_acquis:0 "Transposition of the Acquis Communautaire"
 DVE_eu_copenhagen_acquis_desc:0 "Transpose key chapters of European Union legislation into domestic statutory law, aligning standards in consumer protection, trade, and environment."
 DVE_eu_copenhagen_pesc:0 "Align with the Common Foreign & Security Policy (CFSP)"
 DVE_eu_copenhagen_pesc_desc:0 "Demonstrate strategic alignment with European Union diplomatic declarations, sanctions regimes, and joint foreign policy frameworks."
 DVE_eu_open_negotiation_chapters:0 "Formal Opening of Accession Chapters"
 DVE_eu_open_negotiation_chapters_desc:0 "With baseline democratic criteria validated by the European Commission, the European Council unanimously agrees to open formal negotiation clusters."
 DVE_eu_sign_accession_treaty:0 "Sign European Union Accession Treaty"
 DVE_eu_sign_accession_treaty_desc:0 "Having successfully completed all Copenhagen Criteria and Acquis chapters, with unanimous Council assent and consent of the European Parliament, our nation officially accedes to the European Union as a full Member State."

 # ============================================================
 # National Spirits Localisation
 # ============================================================
 DVE_eu_member_spirit:0 "European Union Member State"
 DVE_eu_member_spirit_desc:0 "Full membership in the European Union provides access to the world's largest single market, guaranteed freedom of movement, joint research frameworks, and shared regulatory solidarity."
 DVE_eu_candidate_spirit:0 "EU Candidate Status"
 DVE_eu_candidate_spirit_desc:0 "Official candidate status unlocks Pre-Accession Assistance (IPA) funds and provides strong domestic impetus for institutional, democratic, and economic reforms."
 DVE_eu_eurozone_spirit:0 "Eurozone Member"
 DVE_eu_eurozone_spirit_desc:0 "Participation in the European Economic and Monetary Union eliminates exchange-rate risks and anchors price stability under the European Central Bank (ECB)."
