 # ============================================================
 # European Union Categories & Banners (ONU Model)
 # ============================================================
 DVE_eu_member_category:0 "European Union"
 DVE_eu_member_category_desc:0 "The European Union is a unique economic and political union between 27 European countries that together cover much of the continent. Through the Council of the European Union, Member States vote by Qualified Majority Voting (QMV), while the directly-elected European Parliament exercises legislative co-decision and democratic scrutiny."
 DVE_eu_candidate_category:0 "European Union - Accession Process"
 DVE_eu_candidate_category_desc:0 "Integration into the European Union requires fulfillment of the Copenhagen Criteria: stable democratic institutions, rule of law, respect for human rights, a functioning market economy, and the capacity to transpose and effectively implement the EU Acquis Communautaire."

 DVE_EU_BANNER_TITLE_MEMBER:0 "§YEUROPEAN UNION - MEMBER STATE§!"
 DVE_EU_BANNER_PRESIDENCY:0 "Council of the EU: [GetEUCouncilPresidency]"
