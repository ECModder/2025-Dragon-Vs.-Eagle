 DVE_EU_CANDIDATE_COPENHAGEN_INFO:0 "Progress towards EU Accession (Acquis & Democratic Reforms).\nAt 50% negotiations open; at 100% the Accession Treaty may be signed."
 DVE_EU_CANDIDATE_BOTTOM_TIP:0 "§WComplete Copenhagen Criteria decisions below to advance accession.§!"

