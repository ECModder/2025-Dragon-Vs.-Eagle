USA_influence_decisions_cat:0 "Balancing Act"
USA_influence_decisions_cat_desc:0 "The nation has been divided into only 2 parties, the §BDemocrats§! and the §RRepublicans§!. The §BDemocrats§! encompass the left-wing and the §RRepublicans§! the right-wing. Naturally, this has lead to some internal party debate between more centre and radical elemants. The 2 party spilt has also lead to increaseing levels of policatial violence in the country.                                                                   The factions in the §RRepublican§! include §YLibertarian§!, §RMAGA§!, §tCentre-right§!, §gmonarchists§!, §8fascists§!, and §Lpro-military groups§!. The §YLibertarians§! call for increased freedom of all aspects, espically buisness. Although there would be large economic growth, it might come at the cost of averge living standards. §RMAGA§!, Make America Great Again, is a movement started by §ODonald Trump§! that is §gAmerica-first§!. It seeks to distance itself from NATO and any other organizations. The §tCentre-Right Republicans§! are those that didn't folllow Trump. This wing of the party has slowly decreased in size since Trump's victory in 2016. §gMonarchists§! are a the smallest movement, seen as outcasts. Rumors say they want §ODonald Trump§! to be "king" of America. Due to this they have been sidelined by Trump, who pretends they don't exist. The §8fascists§! are an increasing movement that have racist and Neo-Nazi beliefs. Social media has lead to their second rise as they benefit from lonely men online. The §LUS army§! isn't considered much of a faction to most. Although the army is meant to be apolitical, the highest ranking do support Trump and may get their own ideas.                                                                                                                                                                 §YLibertarian infleunce is [?libertarian_influence|]§!                                                                                        §RMAGA influence is [?maga_influence|]§!                                                                                                        §tCentre-right republican influence is [?centre_republicans_influence|]§!                                                                      §gMonarchist influence is [?monarchist_influence|]§!                                                                                              §8Fascist influence is [?USA.fascist_influence|]§!                                                                                                          §LUS Army influence is [?us_army_influence|]§!                                                                                                                                                                                                                                                                 The factions in the §BDemocrat§! party include §9Neo-Liberal§!, §7Progressive§!, §tSocialist§!, §RCommunist§!, and §1Anarchist§!. The §8Neo-Liberals§! are the dominant part of the party. They call for more govenrment spending and free trade. The §7Progressives§! are a growing part of the party. They want increased social spending and more equality. The §tSocialists§! are a small part of the party. Most are divided onto smaller parties that aren't aligned with the main party. The §RCommunists§! are not part of the Democrat party, but have their own §RCommunist Party§!. If they want any chance of winning they would have to ally with the §BDemocrats§!. The last group are the §1Anarchists§!. They want to completely abolish any sence of government but they may want to ally the §BDemocratic Party§! if they want to win.                                                                                                                                                                                                                                                                                                          §9Neo-Liberal infleunce is [?neo_liberal_influence|]§!                                                                                        §7Progressive influence is [?progressive_influence|]§!                                                                                              §RCommunist influence is [?communist_influence|]§!                                                                                       §tSocialist influence is [?socialist_influence|]§!                                                                                                  §1Anarchist influence is [?USA.anarchist_influence|]§!"                                                                                                               
