l_english:
 generic_2025_focus:0 "Generic Focus Tree"

 # INDUSTRIAL EFFORT
 GEN_industrial_effort:0 "Industrial Effort"
 GEN_industrial_effort_desc:0 "Before it can defend itself or count for anything abroad, the country must be able to produce. A national industrial programme is drawn up."
 GEN_construction_effort:0 "Construction Effort"
 GEN_construction_effort_desc:0 "Public credit for new plants and warehouses. Civilian industry is the foundation everything else rests on."
 GEN_production_effort:0 "Production Effort"
 GEN_production_effort_desc:0 "State contracts guarantee orders for a new generation of arms plants."
 GEN_infrastructure_effort:0 "Infrastructure Effort"
 GEN_infrastructure_effort_desc:0 "Motorways, railways and power lines tie the regions to the capital and the ports. Construction crews are given priority on every site."
 GEN_construction_effort_2:0 "Construction Effort II"
 GEN_construction_effort_2_desc:0 "A second round of investment extends the industrial districts beyond the capital."
 GEN_production_effort_2:0 "Production Effort II"
 GEN_production_effort_2_desc:0 "Arms plants are expanded and licensed to produce modern designs."
 GEN_infrastructure_effort_2:0 "Infrastructure Effort II"
 GEN_infrastructure_effort_2_desc:0 "The backlog of half-finished roads and rail links is finally cleared."
 GEN_geological_survey:0 "Geological Survey"
 GEN_geological_survey_desc:0 "Modern surveying finds what earlier generations missed: ore deposits worth exploiting under the country's own soil."
 GEN_construction_effort_3:0 "Construction Effort III"
 GEN_construction_effort_3_desc:0 "With the basics in place, the country can afford large industrial complexes of its own."
 GEN_production_effort_3:0 "Production Effort III"
 GEN_production_effort_3_desc:0 "A national arms industry, able to equip the army without depending on foreign suppliers."
 GEN_oil_exploration:0 "Oil and Gas Exploration"
 GEN_oil_exploration_desc:0 "Licences are granted for exploratory drilling. Even a modest field reduces the country's dependence on imported fuel."
 GEN_industrial_modernisation:0 "Industrial Modernisation"
 GEN_industrial_modernisation_desc:0 "Automation, new machine tools and better management raise the output of every plant in the country."
 GEN_national_research_council:0 "National Research Council"
 GEN_national_research_council_desc:0 "Universities, laboratories and industry are coordinated by a single council with its own budget."
 GEN_resource_exploitation:0 "Resource Exploitation"
 GEN_resource_exploitation_desc:0 "Mines and wells are equipped with modern extraction technology and connected to the rail network."
 GEN_advanced_research_programme:0 "Advanced Research Programme"
 GEN_advanced_research_programme_desc:0 "With a broad enough industrial base, the country can fund research at the level of the major powers."
 GEN_digital_economy:0 "Digital Economy"
 GEN_digital_economy_desc:0 "Data centres, fibre networks and a domestic software industry: the economy of the twenty-first century."
 # ARMY EFFORT
 GEN_army_effort:0 "Army Effort"
 GEN_army_effort_desc:0 "The armed forces need more than money: they need a clear doctrine, modern equipment and officers who know how to use both."
 GEN_equipment_effort:0 "Equipment Effort"
 GEN_equipment_effort_desc:0 "Rifles, machine guns and artillery pieces are standardised and ordered in quantity."
 GEN_doctrine_effort:0 "Doctrine Effort"
 GEN_doctrine_effort_desc:0 "The general staff studies the wars of the last twenty years and rewrites the field manuals."
 GEN_national_service:0 "National Service"
 GEN_national_service_desc:0 "Every young citizen owes the country a period of service. A larger share of the population is trained and registered as reservists."
 GEN_equipment_effort_2:0 "Equipment Effort II"
 GEN_equipment_effort_2_desc:0 "Second-generation weapons replace the stocks inherited from the last century."
 GEN_doctrine_effort_2:0 "Doctrine Effort II"
 GEN_doctrine_effort_2_desc:0 "Large exercises test the new doctrine and expose what still does not work."
 GEN_conscription_reform:0 "Conscription Reform"
 GEN_conscription_reform_desc:0 "The recruitment law is rewritten to allow a wider call-up in an emergency."
 GEN_support_companies:0 "Support Companies"
 GEN_support_companies_desc:0 "Engineers, signals, reconnaissance and logistics: the units that let the infantry fight."
 GEN_doctrine_effort_3:0 "Doctrine Effort III"
 GEN_doctrine_effort_3_desc:0 "A modern staff college trains officers in the doctrine the army has chosen."
 GEN_reserve_army:0 "A Reserve Army"
 GEN_reserve_army_desc:0 "Reservists keep their equipment at home and train every year. In a crisis, the army can double its size in days."
 GEN_motorization_effort:0 "Motorization Effort"
 GEN_motorization_effort_desc:0 "Trucks and armoured personnel carriers give the infantry the mobility of a modern army."
 GEN_special_forces:0 "Special Forces"
 GEN_special_forces_desc:0 "Small, elite units for mountains, coasts and operations behind enemy lines."
 GEN_why_we_fight:0 "Why We Fight"
 GEN_why_we_fight_desc:0 "When the country is threatened, the reasons to defend it no longer need explaining."
 GEN_armor_effort:0 "Armour Effort"
 GEN_armor_effort_desc:0 "Main battle tanks and infantry fighting vehicles, the hard core of a modern ground force."
 GEN_professional_army:0 "A Professional Army"
 GEN_professional_army_desc:0 "Long-service volunteers, constant training and an officer corps chosen by merit."
 # NAVAL EFFORT
 GEN_naval_effort:0 "Naval Effort"
 GEN_naval_effort_desc:0 "A coastline is a frontier like any other. The country invests in shipyards able to build and repair its own fleet."
 GEN_flexible_navy:0 "Flexible Navy"
 GEN_flexible_navy_desc:0 "A fleet of submarines and escorts to deny the sea to a stronger enemy."
 GEN_large_navy:0 "Large Navy"
 GEN_large_navy_desc:0 "A balanced fleet built around capital ships, able to fight for control of the sea."
 GEN_submarine_effort:0 "Submarine Effort"
 GEN_submarine_effort_desc:0 "Quiet, long-range submarines are the cheapest way to make an enemy fleet cautious."
 GEN_cruiser_effort:0 "Cruiser Effort"
 GEN_cruiser_effort_desc:0 "Cruisers and frigates give the fleet range, firepower and air defence."
 GEN_destroyer_effort:0 "Destroyer Effort"
 GEN_destroyer_effort_desc:0 "Destroyers escort convoys, hunt submarines and protect the coast."
 GEN_capital_ships_effort:0 "Capital Ships Effort"
 GEN_capital_ships_effort_desc:0 "Carriers and heavy surface ships, the symbols of a true naval power."
 GEN_dockyard_expansion:0 "Dockyard Expansion"
 GEN_dockyard_expansion_desc:0 "New dry docks and slipways allow the yards to work on several hulls at once."
 # AIR EFFORT
 GEN_aviation_effort:0 "Aviation Effort"
 GEN_aviation_effort_desc:0 "Control of the air decides modern wars. The air force receives new bases and a doctrine of its own."
 GEN_air_base_programme:0 "Air Base Programme"
 GEN_air_base_programme_desc:0 "Hardened shelters and long runways across the country, built at speed."
 GEN_fighter_focus:0 "Fighter Focus"
 GEN_fighter_focus_desc:0 "Light and heavy fighters to defend the national airspace."
 GEN_bomber_focus:0 "Bomber Focus"
 GEN_bomber_focus_desc:0 "Tactical and strategic bombers to strike the enemy far beyond the front."
 GEN_aviation_effort_2:0 "Aviation Effort II"
 GEN_aviation_effort_2_desc:0 "A second generation of air bases and a larger reserve of trained pilots."
 GEN_cas_effort:0 "Close Air Support Effort"
 GEN_cas_effort_desc:0 "Aircraft built to fight alongside the army, over the battlefield itself."
 GEN_naval_aviation_effort:0 "Naval Aviation Effort"
 GEN_naval_aviation_effort_desc:0 "Maritime strike aircraft to defend the coast against any fleet."
 GEN_rocket_effort:0 "Missiles and Jets"
 GEN_rocket_effort_desc:0 "Guided missiles and modern jet engines keep the air force in the twenty-first century."
 # POLITICAL EFFORT
 GEN_political_effort:0 "Political Effort"
 GEN_political_effort_desc:0 "The country stands at a crossroads. Before it can choose its friends abroad, it must decide what kind of state it wants to be."
 GEN_socialist_path:0 "The Socialist Path"
 GEN_socialist_path_desc:0 "Neither the market nor the old elites have delivered. Whatever form it takes, the future of the country will be built on the ownership of the many."
 GEN_democratic_path:0 "The Democratic Path"
 GEN_democratic_path_desc:0 "The future of the country will be decided at the ballot box. The only question is which of the democratic parties will win the argument."
 GEN_order_path:0 "The Path of Order"
 GEN_order_path_desc:0 "Democracy has brought gridlock and weakness. A growing part of the country wants a state that decides, and a leader who makes it decide."
 GEN_nation_and_faith_path:0 "Nation and Faith"
 GEN_nation_and_faith_path_desc:0 "For the radical right, the problem is not the government but the soul of the nation itself, and only a rebirth can save it."
 # POLITICAL EFFORT - The Socialist Path
 GEN_ts_movement_focus:0 "Dictatorship of the Proletariat"
 GEN_ts_movement_focus_desc:0 "The hardliners of the left argue that half-measures have always failed. Only a single party, a single plan and iron discipline can defend a workers' state."
 GEN_ts_take_power:0 "The Party Takes Command"
 GEN_ts_take_power_desc:0 "The Party no longer asks for power; it takes it. Ministries, barracks and broadcasters pass under the control of the Central Committee."
 GEN_ts_congress:0 "The Party Congress"
 GEN_ts_congress_desc:0 "The delegates assemble under the portraits of the founders. The question before them is not whether the Party rules, but how."
 GEN_ts_current_a:0 "The Hardline Majority"
 GEN_ts_current_a_desc:0 "The hardliners of the Central Committee carry the vote. No deviations, no experiments, no 'national characteristics'."
 GEN_ts_current_b:0 "Bureaucracy at the Helm"
 GEN_ts_current_b_desc:0 "Ideology is for congresses. The country will be run by the men who know which form goes to which desk."
 GEN_ts_security_1:0 "The Cheka Model"
 GEN_ts_security_1_desc:0 "An extraordinary commission against sabotage and counter-revolution, answerable only to the Party."
 GEN_ts_spirit_focus:0 "The Single Plan"
 GEN_ts_spirit_focus_desc:0 "Every factory, farm and office now works to the same plan, drawn up in the capital."
 GEN_ts_propaganda_1:0 "Restart Agit-Prop"
 GEN_ts_propaganda_1_desc:0 "Posters, broadcasts and feeds. The Party explains itself every day, everywhere."
 GEN_ts_security_2:0 "The NKVD Model"
 GEN_ts_security_2_desc:0 "The commission becomes a ministry, with its own troops, its own prisons and an informer in every workplace."
 GEN_ts_institution:0 "Recreation of the Politburo"
 GEN_ts_institution_desc:0 "A small circle of the most senior members of the Party takes the decisions that matter. The Central Committee is informed afterwards."
 GEN_ts_propaganda_2:0 "The Ideological Department"
 GEN_ts_propaganda_2_desc:0 "A department of the Central Committee supervises every school, newspaper and broadcaster."
 GEN_ts_abroad:0 "Fund Workers' Clubs Abroad"
 GEN_ts_abroad_desc:0 "Money, literature and organisers for the comrades in the neighbouring countries."
 GEN_ts_final_focus:0 "Purge the Class Enemies"
 GEN_ts_final_focus_desc:0 "Speculators, saboteurs and 'enemies of the people' are rooted out of the administration and the army."
 GEN_ts_bloc:0 "Rebirth of the Cominform"
 GEN_ts_bloc_desc:0 "An information bureau of the communist parties, coordinating the movement under our guidance."
 GEN_ts_capstone:0 "A Party with a State"
 GEN_ts_capstone_desc:0 "It was said of Prussia that it was an army with a country. The same is now true here, with the Party in the army's place."
 GEN_as_movement_focus:0 "Socialism with National Characteristics"
 GEN_as_movement_focus_desc:0 "The pragmatists of the left want a socialism adapted to the country as it is: a strong party, a mixed economy and no illusions about world revolution."
 GEN_as_take_power:0 "The People's Government"
 GEN_as_take_power_desc:0 "The socialist party and the trade unions form a government of national salvation, and have no intention of giving it back."
 GEN_as_congress:0 "The National People's Congress"
 GEN_as_congress_desc:0 "Delegates of the party, the unions and the provinces gather in the capital to approve the new course."
 GEN_as_current_a:0 "The Reformist Majority"
 GEN_as_current_a_desc:0 "The reformers prevail: a socialism that works with what it finds, and prefers full shops to full prisons."
 GEN_as_current_b:0 "The Centralist Majority"
 GEN_as_current_b_desc:0 "The centralists prevail: the plan comes first, and the plan is made in the capital."
 GEN_as_security_1:0 "The KGB Model"
 GEN_as_security_1_desc:0 "A security service that reads, files and waits, quieter and better educated than its predecessors."
 GEN_as_spirit_focus:0 "Market Socialism"
 GEN_as_spirit_focus_desc:0 "State banks, cooperative firms and private shops, all working within a single national plan."
 GEN_as_propaganda_1:0 "Socialist Cultural Hegemony"
 GEN_as_propaganda_1_desc:0 "Cinema, television and the web portals tell the story of the country's socialist renewal."
 GEN_as_security_2:0 "People's Democratic Dictatorship"
 GEN_as_security_2_desc:0 "Democracy for the people, dictatorship over their enemies. The Party decides who belongs to which."
 GEN_as_institution:0 "Anti-Corruption Campaign"
 GEN_as_institution_desc:0 "Officials who confused the property of the state with their own are put on public trial."
 GEN_as_propaganda_2:0 "Ensure People's Support"
 GEN_as_propaganda_2_desc:0 "Neighbourhood committees listen to complaints about buses, hospitals and rents, and some of them are even dealt with."
 GEN_as_abroad:0 "Socialist Solidarity"
 GEN_as_abroad_desc:0 "Credit, advisers and scholarships for the friendly socialist movements of the neighbouring countries."
 GEN_as_final_focus:0 "Planned Modernisation"
 GEN_as_final_focus_desc:0 "Five-year targets for steel, energy and housing, and new factories to meet them."
 GEN_as_bloc:0 "An Economic Community of Socialist States"
 GEN_as_bloc_desc:0 "A common market of socialist states, coordinated by a joint planning council."
 GEN_as_capstone:0 "Socialism for the 21st Century"
 GEN_as_capstone_desc:0 "A modern, prosperous and disciplined socialist state, envied by its neighbours."
 GEN_vs_movement_focus:0 "The Leninist Vanguard"
 GEN_vs_movement_focus_desc:0 "A party of professional revolutionaries, disciplined and internationalist, claims to speak for a working class that no longer listens to anyone else."
 GEN_vs_take_power:0 "The October Road"
 GEN_vs_take_power_desc:0 "Strikes, occupations and a final assault on the institutions. The vanguard does not wait to be elected."
 GEN_vs_congress:0 "The Unified Congress"
 GEN_vs_congress_desc:0 "Every current of the revolutionary left is in the same hall for the first time. Only one of them will leave with a majority."
 GEN_vs_current_a:0 "The Leninist Majority"
 GEN_vs_current_a_desc:0 "The Leninists carry the congress. The revolution will be led by a disciplined party of cadres and organised through the workers' councils."
 GEN_vs_current_b:0 "The Internationalist Majority"
 GEN_vs_current_b_desc:0 "The internationalists win the vote. The revolution belongs to the whole working class, not to one country."
 GEN_vs_security_1:0 "Revolutionary Tribunals"
 GEN_vs_security_1_desc:0 "Tribunals of workers and soldiers try the agents of the old order."
 GEN_vs_spirit_focus:0 "Professional Revolutionaries"
 GEN_vs_spirit_focus_desc:0 "The Party trains its cadres like officers: they go where they are sent and do what they are told."
 GEN_vs_propaganda_1:0 "A New Agit-Prop"
 GEN_vs_propaganda_1_desc:0 "Posters and pamphlets have given way to videos and feeds, but the job is the same: explain the revolution faster than its enemies can slander it."
 GEN_vs_security_2:0 "The Councils' Political Commissariats"
 GEN_vs_security_2_desc:0 "The councils send their own commissars into the army and the ministries, so that no institution drifts away from the people who elected it."
 GEN_vs_institution:0 "True Leninism"
 GEN_vs_institution_desc:0 "Lenin without the embalming: a party of professional revolutionaries, internationalist to the core and suspicious of any state that calls itself socialist."
 GEN_vs_propaganda_2:0 "Democratic Centralism"
 GEN_vs_propaganda_2_desc:0 "Freedom of discussion, unity of action. The debate can last all night, but in the morning the whole party moves as one."
 GEN_vs_abroad:0 "Support the Revolutionaries Abroad"
 GEN_vs_abroad_desc:0 "Money, printing presses and organisers for the comrades across the border."
 GEN_vs_final_focus:0 "Proletarian Internationalism"
 GEN_vs_final_focus_desc:0 "The revolution does not stop at the border. Volunteers and comrades abroad can count on our support."
 GEN_vs_bloc:0 "Long Live the Councils' International"
 GEN_vs_bloc_desc:0 "An international of workers' councils, not of parties or governments. Its sections will be built wherever the working class rises."
 GEN_vs_capstone:0 "Communism or Barbarism"
 GEN_vs_capstone_desc:0 "There is no third way and no return to the old order. Either the working class takes the world, or the world goes back to barbarism."
 GEN_rs_movement_focus:0 "Workers' Councils"
 GEN_rs_movement_focus_desc:0 "In the factories and neighbourhoods, councils elected by the workers start taking the decisions the government no longer can."
 GEN_rs_take_power:0 "All Power to the Councils"
 GEN_rs_take_power_desc:0 "The councils federate, parliament is dissolved, and power passes to delegates who can be recalled at any time."
 GEN_rs_congress:0 "The Congress of the Councils"
 GEN_rs_congress_desc:0 "Delegates of every factory and neighbourhood council meet to decide what the revolution will become."
 GEN_rs_current_a:0 "The Council Majority"
 GEN_rs_current_a_desc:0 "The council communists win: power flows from the bottom up, and every delegate can be recalled at any time."
 GEN_rs_current_b:0 "The Permanent Revolution Majority"
 GEN_rs_current_b_desc:0 "The Trotskyists win the vote. The revolution is permanent, or it is nothing."
 GEN_rs_security_1:0 "Revolutionary Committees"
 GEN_rs_security_1_desc:0 "Committees of the most committed militants watch over the councils, the army and each other."
 GEN_rs_spirit_focus:0 "Workplace Democracy"
 GEN_rs_spirit_focus_desc:0 "Managers are elected by the workers they manage. Productivity, to everyone's surprise, goes up."
 GEN_rs_propaganda_1:0 "A Movement Full of Factions"
 GEN_rs_propaganda_1_desc:0 "Tendencies and platforms organise openly inside the movement. It is noisy, but nobody has to go underground to disagree."
 GEN_rs_security_2:0 "Absolute Loyalty to the Revolution"
 GEN_rs_security_2_desc:0 "Loyalty is owed to the revolution, not to a leader or a faction. Those who confuse the two are reminded of the difference."
 GEN_rs_institution:0 "A Soviet for Every City"
 GEN_rs_institution_desc:0 "Every city elects its soviet from its workplaces and neighbourhoods, and every soviet answers to the congress."
 GEN_rs_propaganda_2:0 "New Communism for a New Age"
 GEN_rs_propaganda_2_desc:0 "The revolution of the twenty-first century will not be a copy of the one in the twentieth. The programme is rewritten for a world of networks and automation."
 GEN_rs_abroad:0 "Export the Revolution"
 GEN_rs_abroad_desc:0 "Money, weapons and volunteers for every revolutionary movement across the border that asks for them."
 GEN_rs_final_focus:0 "The Armed People"
 GEN_rs_final_focus_desc:0 "Instead of a standing army, the workers themselves keep their rifles and train in the militias."
 GEN_rs_bloc:0 "The Revolutionary International"
 GEN_rs_bloc_desc:0 "The Fourth International is reborn, this time with a state, an army and a treasury behind it."
 GEN_rs_capstone:0 "Trotskyism Is Young Once Again"
 GEN_rs_capstone_desc:0 "For eighty years the movement survived in back rooms. Now it has a country."
 # POLITICAL EFFORT - The Democratic Path
 GEN_pr_movement_focus:0 "The Reformist Left"
 GEN_pr_movement_focus_desc:0 "Social democrats and reformist socialists propose to change the system from within: higher wages, public services and a fairer tax code."
 GEN_pr_take_power:0 "A Social Majority"
 GEN_pr_take_power_desc:0 "A broad coalition of the left wins a clear majority and forms a government committed to social reform."
 GEN_pr_congress:0 "The Party Conference"
 GEN_pr_congress_desc:0 "The reformist left meets to turn its election promises into a programme for government."
 GEN_pr_current_a:0 "The Social-Democratic Wing"
 GEN_pr_current_a_desc:0 "The moderates prevail: reform within the market economy, with the unions at the table."
 GEN_pr_current_b:0 "The Reformist-Socialist Wing"
 GEN_pr_current_b_desc:0 "The left wing prevails: public ownership of the key sectors and a planned transition."
 GEN_pr_security_1:0 "Parliamentary Oversight of Intelligence"
 GEN_pr_security_1_desc:0 "For the first time the intelligence services answer to a committee of parliament."
 GEN_pr_spirit_focus:0 "Expand the Welfare State"
 GEN_pr_spirit_focus_desc:0 "Public healthcare, pensions and education are extended to every citizen."
 GEN_pr_propaganda_1:0 "Public Broadcasting Reform"
 GEN_pr_propaganda_1_desc:0 "An independent public broadcaster, funded by everyone and controlled by nobody."
 GEN_pr_security_2:0 "A Democratic Security Doctrine"
 GEN_pr_security_2_desc:0 "Police and services are rebuilt around civil rights and the trust of the communities they protect."
 GEN_pr_institution:0 "Strengthen the Trade Unions"
 GEN_pr_institution_desc:0 "Collective bargaining is extended to every sector of the economy."
 GEN_pr_propaganda_2:0 "The Social Pact"
 GEN_pr_propaganda_2_desc:0 "Government, unions and employers sign a pact on wages, investment and pensions."
 GEN_pr_abroad:0 "Solidarity with the Reformist Left Abroad"
 GEN_pr_abroad_desc:0 "Exchanges, funding and joint campaigns with the reformist parties of the neighbouring countries."
 GEN_pr_final_focus:0 "Workers' Rights"
 GEN_pr_final_focus_desc:0 "A new labour code guarantees collective bargaining, a minimum wage and a shorter working week."
 GEN_pr_bloc:0 "The Socialist International"
 GEN_pr_bloc_desc:0 "An alliance of social-democratic governments, for a fairer world order."
 GEN_pr_capstone:0 "The Social State"
 GEN_pr_capstone_desc:0 "A welfare state built to last, and a society that can afford it."
 GEN_li_movement_focus:0 "The Liberal Alliance"
 GEN_li_movement_focus_desc:0 "Civil-rights campaigners, green activists and the progressive middle class rally behind a common liberal platform."
 GEN_li_take_power:0 "A Liberal Government"
 GEN_li_take_power_desc:0 "The liberal alliance enters government with a mandate for reform: open institutions, independent courts and a modern economy."
 GEN_li_congress:0 "The Liberal Convention"
 GEN_li_congress_desc:0 "Activists, civil-society groups and the new liberal ministers gather to set the course of the reforms."
 GEN_li_current_a:0 "The Social-Liberal Wing"
 GEN_li_current_a_desc:0 "Civil rights, social mobility and a market that serves the many."
 GEN_li_current_b:0 "The Green Wing"
 GEN_li_current_b_desc:0 "The ecological transition becomes the first priority of the government."
 GEN_li_security_1:0 "Independent Courts"
 GEN_li_security_1_desc:0 "Judicial appointments are taken out of the hands of the government."
 GEN_li_spirit_focus:0 "Rights and Freedoms"
 GEN_li_spirit_focus_desc:0 "A charter of rights protects the press, minorities and the opposition from any future government."
 GEN_li_propaganda_1:0 "Freedom of the Press"
 GEN_li_propaganda_1_desc:0 "Media ownership is opened up and journalists are protected by law."
 GEN_li_security_2:0 "An Open Intelligence Service"
 GEN_li_security_2_desc:0 "The services are modernised, audited and placed under strict legal limits."
 GEN_li_institution:0 "An Anti-Corruption Authority"
 GEN_li_institution_desc:0 "An independent authority with the power to investigate anyone, ministers included."
 GEN_li_propaganda_2:0 "Digital Rights"
 GEN_li_propaganda_2_desc:0 "Privacy, open data and net neutrality are written into the constitution."
 GEN_li_abroad:0 "Support Civil Society Abroad"
 GEN_li_abroad_desc:0 "Grants for independent media, human-rights groups and liberal parties in the neighbouring countries."
 GEN_li_final_focus:0 "The Green Transition"
 GEN_li_final_focus_desc:0 "Renewable energy and modern grids reduce the country's dependence on imported fuel."
 GEN_li_bloc:0 "The Alliance of Democracies"
 GEN_li_bloc_desc:0 "Democratic governments coordinate their foreign policy and their defence."
 GEN_li_capstone:0 "An Open Society"
 GEN_li_capstone_desc:0 "A free, plural and prosperous country, confident in its institutions."
 GEN_ce_movement_focus:0 "The Centre Ground"
 GEN_ce_movement_focus_desc:0 "Tired of polarisation, voters look for competent government without ideology. A new centrist movement promises exactly that."
 GEN_ce_take_power:0 "A Government of Experts"
 GEN_ce_take_power_desc:0 "Economists, judges and senior civil servants form a government that answers to the markets and to foreign partners as much as to parliament."
 GEN_ce_congress:0 "The Assembly of the Centre"
 GEN_ce_congress_desc:0 "Mayors, business associations and moderate politicians of every party meet to build a new majority."
 GEN_ce_current_a:0 "The Technocratic Wing"
 GEN_ce_current_a_desc:0 "Ministers are chosen for their competence, not for their party card."
 GEN_ce_current_b:0 "The Populist Centre"
 GEN_ce_current_b_desc:0 "The movement promises to speak for ordinary citizens against the old parties of left and right."
 GEN_ce_security_1:0 "Professional Security Services"
 GEN_ce_security_1_desc:0 "The services are run by career officials and kept out of party politics."
 GEN_ce_spirit_focus:0 "Technocratic Governance"
 GEN_ce_spirit_focus_desc:0 "Decisions are taken on the advice of experts and justified with data rather than slogans."
 GEN_ce_propaganda_1:0 "A Government Communications Office"
 GEN_ce_propaganda_1_desc:0 "A single office explains government policy, clearly and quickly."
 GEN_ce_security_2:0 "Strategic Intelligence Reform"
 GEN_ce_security_2_desc:0 "A modern intelligence community, coordinated from the office of the prime minister."
 GEN_ce_institution:0 "Simplify the Bureaucracy"
 GEN_ce_institution_desc:0 "Thousands of regulations are repealed and the remaining procedures are moved online."
 GEN_ce_propaganda_2:0 "The Politics of Consensus"
 GEN_ce_propaganda_2_desc:0 "Every major reform is negotiated with the opposition before it reaches parliament."
 GEN_ce_abroad:0 "Moderates Across the Border"
 GEN_ce_abroad_desc:0 "Support for the centrist parties and reform movements of the neighbouring countries."
 GEN_ce_final_focus:0 "Fiscal Responsibility"
 GEN_ce_final_focus_desc:0 "A balanced budget restores the confidence of investors and lowers the cost of borrowing."
 GEN_ce_bloc:0 "A Partnership for Stability"
 GEN_ce_bloc_desc:0 "Moderate governments commit to cooperate on trade, security and migration."
 GEN_ce_capstone:0 "The Radical Centre"
 GEN_ce_capstone_desc:0 "Neither left nor right, but effective. The country has found its balance."
 GEN_co_movement_focus:0 "Conservative Renewal"
 GEN_co_movement_focus_desc:0 "The mainstream right regroups around a familiar programme: lower taxes, strong institutions and a firm hand on security."
 GEN_co_take_power:0 "A Conservative Mandate"
 GEN_co_take_power_desc:0 "The conservatives return to government with a comfortable majority and a promise of stability."
 GEN_co_congress:0 "The Conservative Congress"
 GEN_co_congress_desc:0 "Members, donors and ministers of the party gather to renew the conservative programme."
