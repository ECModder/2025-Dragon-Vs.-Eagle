l_english:
 generic_2025_focus:0 "2025: A New World Order"
 GEN_A_WORLD_IN_TRANSITION:0 "A World in Transition"
 GEN_A_WORLD_IN_TRANSITION_desc:0 "The old certainties of the twentieth century are gone. Every government must now decide, for itself, what kind of state it wants to be."
 GEN_THE_END_OF_THE_OLD_ORDER:0 "The End of the Old Order"
 GEN_THE_END_OF_THE_OLD_ORDER_desc:0 "The blocs of the last century are dead. What replaces them is still being written."
 GEN_WESTERN_ALIGNMENT:0 "Western Alignment"
 GEN_WESTERN_ALIGNMENT_desc:0 "A first, informal signal of where this country intends to stand in the new order: western alignment."
 GEN_EURASIAN_ALIGNMENT:0 "Eurasian Alignment"
 GEN_EURASIAN_ALIGNMENT_desc:0 "A first, informal signal of where this country intends to stand in the new order: eurasian alignment."
 GEN_REVOLUTIONARY_ALIGNMENT:0 "Revolutionary Alignment"
 GEN_REVOLUTIONARY_ALIGNMENT_desc:0 "A first, informal signal of where this country intends to stand in the new order: revolutionary alignment."
 GEN_NON_ALIGNED_STRATEGY:0 "Non-Aligned Strategy"
 GEN_NON_ALIGNED_STRATEGY_desc:0 "A first, informal signal of where this country intends to stand in the new order: non-aligned strategy."
 GEN_REGIONAL_STRATEGY:0 "Regional Strategy"
 GEN_REGIONAL_STRATEGY_desc:0 "A first, informal signal of where this country intends to stand in the new order: regional strategy."
 GEN_THE_STATE_UNDER_PRESSURE:0 "The State Under Pressure"
 GEN_THE_STATE_UNDER_PRESSURE_desc:0 "Economic strain, social unrest and institutional distrust converge at once. Something has to give first."
 GEN_ECONOMIC_CRISIS:0 "Economic Crisis"
 GEN_ECONOMIC_CRISIS_desc:0 "Inflation, debt and strained supply chains eat away at the government's authority."
 GEN_SOCIAL_CRISIS:0 "Social Crisis"
 GEN_SOCIAL_CRISIS_desc:0 "Protests, polarization and a widening generational divide test the social fabric."
 GEN_INSTITUTIONAL_CRISIS:0 "Institutional Crisis"
 GEN_INSTITUTIONAL_CRISIS_desc:0 "Corruption scandals and a crisis of trust in government put the constitutional order itself in question."
 GEN_STABILIZE_THE_ECONOMY:0 "Stabilize the Economy"
 GEN_STABILIZE_THE_ECONOMY_desc:0 "Whatever the cause, the immediate crisis is brought under control. The harder question — what comes next — remains."
 GEN_A_NEW_ECONOMIC_MODEL:0 "A New Economic Model"
 GEN_A_NEW_ECONOMIC_MODEL_desc:0 "Crisis management is not a policy. The government must now choose a lasting economic model."
 GEN_SOCIALIST_ECONOMY:0 "Socialist Economy"
 GEN_SOCIALIST_ECONOMY_desc:0 "The government commits, at least for now, to socialist economy as its economic doctrine."
 GEN_SOCIAL_MARKET_ECONOMY:0 "Social Market Economy"
 GEN_SOCIAL_MARKET_ECONOMY_desc:0 "The government commits, at least for now, to social market economy as its economic doctrine."
 GEN_LIBERAL_MARKET:0 "Liberal Market"
