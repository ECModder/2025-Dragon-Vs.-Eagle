l_english:
 generic_2025_focus:0 "Generic Focus Tree"

 GEN_development_plan_spirit:0 "National Development Plan"
 GEN_development_plan_spirit_desc:0 "A single plan ties ministries, banks and local governments to the same construction targets."
 GEN_national_grid_spirit:0 "National Grid"
 GEN_national_grid_spirit_desc:0 "Power lines, rail spurs and roads built to one standard make every later project cheaper."
 GEN_state_directed_spirit:0 "State-Directed Economy"
 GEN_state_directed_spirit_desc:0 "Ministries set output targets and allocate capital. Heavy industry grows fast; the shops stay half empty."
 GEN_developmental_spirit:0 "Developmental State"
 GEN_developmental_spirit_desc:0 "The state picks winners, lends to them and expects exports in return. Technical schools are favoured."
 GEN_market_spirit:0 "Liberalised Markets"
 GEN_market_spirit_desc:0 "Prices are freed and tariffs cut. Capital arrives, and so do inequality and strikes."
 GEN_five_year_spirit:0 "Five-Year Plans"
 GEN_five_year_spirit_desc:0 "Each plant has a quota, each quota a deadline, each deadline a commissar."
 GEN_strategic_sectors_spirit:0 "Strategic Sectors"
 GEN_strategic_sectors_spirit_desc:0 "Credit, land and licences go to a short list of national champions."
 GEN_sez_spirit:0 "Special Economic Zones"
 GEN_sez_spirit_desc:0 "Duty-free enclaves with their own courts attract foreign factories and foreign money."
 GEN_modern_industry_spirit:0 "Modern Industry"
 GEN_modern_industry_spirit_desc:0 "Automation, new machine tools and better management raise the output of every plant."
 GEN_urban_spirit:0 "Urban Development"
 GEN_urban_spirit_desc:0 "Capital and labour move to the cities, where plants, ports and universities already stand."
 GEN_rural_spirit:0 "Rural Development"
 GEN_rural_spirit_desc:0 "Roads, clinics and credit for the countryside keep families on the land and recruits in the villages."
 GEN_hydrocarbon_spirit:0 "Hydrocarbon Push"
 GEN_hydrocarbon_spirit_desc:0 "Every licence round is held on schedule and every pipeline gets a priority permit."
 GEN_green_spirit:0 "Energy Transition"
 GEN_green_spirit_desc:0 "Wind, solar and nuclear plants replace imported fuel and give engineers new work."
 GEN_extraction_spirit:0 "Modern Extraction"
 GEN_extraction_spirit_desc:0 "Mines and wells are equipped with modern machinery and tied to the rail network."
 GEN_education_spirit:0 "Education Drive"
 GEN_education_spirit_desc:0 "Free schooling to sixteen and a university in every province."
 GEN_health_spirit:0 "Public Health System"
 GEN_health_spirit_desc:0 "Clinics, vaccination and clean water raise the survival rate of every age group."
 GEN_development_plan:0 "National Development Plan"
 GEN_development_plan_desc:0 "Before the country can defend itself or count for anything abroad it must be able to produce. A national plan sets the priorities."
 GEN_civilian_construction:0 "Civilian Construction"
 GEN_civilian_construction_desc:0 "Public credit for new plants, warehouses and housing. Civilian industry is the foundation everything else rests on."
 GEN_arms_production:0 "Arms Production"
 GEN_arms_production_desc:0 "State contracts guarantee orders for a new generation of arms plants."
 GEN_national_grid:0 "National Grid"
 GEN_national_grid_desc:0 "Motorways, railways and power lines tie the regions to the capital and the ports."
 GEN_civilian_construction_2:0 "Industrial Districts"
 GEN_civilian_construction_2_desc:0 "A second round of investment extends the industrial districts beyond the capital."
 GEN_arms_production_2:0 "Defence Industrial Base"
 GEN_arms_production_2_desc:0 "Arms plants are expanded and licensed to produce modern designs."
 GEN_resource_survey:0 "Geological Survey"
 GEN_resource_survey_desc:0 "Modern surveying finds what earlier generations missed: ore deposits worth mining under the national soil."
 GEN_urban_development:0 "Urban Development"
 GEN_urban_development_desc:0 "The cities are where the money, the workers and the ports are. Planners follow them."
 GEN_rural_development:0 "Rural Development"
 GEN_rural_development_desc:0 "Most of the electorate lives outside the capital. The budget starts to reflect it."
 GEN_state_directed_economy:0 "State-Directed Economy"
 GEN_state_directed_economy_desc:0 "Ministries set output targets and allocate capital. Heavy industry will grow faster than anything else."
 GEN_developmental_state:0 "Developmental State"
 GEN_developmental_state_desc:0 "The state picks winners, lends to them and expects exports in return."
 GEN_market_liberalisation:0 "Market Liberalisation"
 GEN_market_liberalisation_desc:0 "Prices are freed, tariffs cut and state firms sold. Capital will arrive; so will inequality."
 GEN_five_year_plans:0 "Five-Year Plans"
 GEN_five_year_plans_desc:0 "Every plant receives a quota and a deadline. The arms plants receive the largest quotas."
 GEN_strategic_sectors:0 "Strategic Sectors"
 GEN_strategic_sectors_desc:0 "Credit and licences go to a short list of national champions in electronics, steel and shipbuilding."
 GEN_special_economic_zones:0 "Special Economic Zones"
 GEN_special_economic_zones_desc:0 "Duty-free enclaves with their own courts and customs. Foreign factories are invited, and foreign firms come."
 GEN_industrial_modernisation:0 "Industrial Modernisation"
 GEN_industrial_modernisation_desc:0 "Automation, new machine tools and better management raise the output of every plant in the country."
 GEN_oil_exploration:0 "Oil and Gas Exploration"
 GEN_oil_exploration_desc:0 "Licences are granted for exploratory drilling. Even a modest field reduces dependence on imported fuel."
 GEN_hydrocarbon_push:0 "Hydrocarbon Push"
 GEN_hydrocarbon_push_desc:0 "Every licence round runs on schedule and every pipeline gets a priority permit. The country will pump what it can."
 GEN_energy_transition:0 "Energy Transition"
 GEN_energy_transition_desc:0 "Wind, solar and nuclear plants replace imported fuel and give the engineers new work."
 GEN_resource_exploitation:0 "Resource Exploitation"
 GEN_resource_exploitation_desc:0 "Mines and wells are equipped with modern extraction technology and connected to the rail network."
 GEN_research_council:0 "National Research Council"
 GEN_research_council_desc:0 "Universities, laboratories and industry are coordinated by one council with its own budget."
 GEN_advanced_research:0 "Advanced Research Programme"
 GEN_advanced_research_desc:0 "With a broad enough industrial base the country can fund research at the level of the major powers."
 GEN_education_drive:0 "Education Drive"
 GEN_education_drive_desc:0 "Free schooling to sixteen and a technical university in every region."
 GEN_public_health:0 "Public Health System"
 GEN_public_health_desc:0 "Clinics, vaccination and clean water raise survival rates in every age group."
 GEN_digital_economy:0 "Digital Economy"
 GEN_digital_economy_desc:0 "Data centres, fibre networks and a domestic software industry: the economy of the twenty-first century."
 GEN_territorial_spirit:0 "Territorial Defence Doctrine"
 GEN_territorial_spirit_desc:0 "Every district has its own garrison, depots and defence plan. A small army that knows its ground."
 GEN_professional_spirit:0 "Professional Core"
 GEN_professional_spirit_desc:0 "Long-service volunteers, constant training and an officer corps chosen by merit. Few soldiers, well led."
 GEN_mass_army_spirit:0 "Mass Mobilisation"
 GEN_mass_army_spirit_desc:0 "The nation in arms: registers, depots and call-up plans ready long before a crisis."
 GEN_fortification_spirit:0 "Fortification Belt"
 GEN_fortification_spirit_desc:0 "Bunkers, anti-tank ditches and prepared fire zones along every approach to the capital."
 GEN_militia_spirit:0 "Citizen Militias"
 GEN_militia_spirit_desc:0 "Reservists keep their rifles at home and train every month. Garrisons appear overnight."
 GEN_staff_college_spirit:0 "Staff College"
 GEN_staff_college_spirit_desc:0 "A modern staff college trains officers in the doctrine the army has chosen."
 GEN_elite_units_spirit:0 "Elite Units"
 GEN_elite_units_spirit_desc:0 "A few picked brigades for mountains, coasts and operations behind the lines."
 GEN_conscription_spirit:0 "National Service"
 GEN_conscription_spirit_desc:0 "Every young citizen owes the country a period of service and a place on the reserve rolls."
 GEN_reserve_spirit:0 "A Reserve Army"
 GEN_reserve_spirit_desc:0 "Reservists keep their kit at home and train every year. In a crisis the army can double its size in days."
 GEN_exercises_spirit:0 "Combined-Arms Exercises"
 GEN_exercises_spirit_desc:0 "Large exercises every autumn test the doctrine and expose what still does not work."
 GEN_support_spirit:0 "Support Companies"
 GEN_support_spirit_desc:0 "Engineers, signals, reconnaissance and logistics: the units that let the infantry fight."
 GEN_nation_in_arms_spirit:0 "A Nation in Arms"
 GEN_nation_in_arms_spirit_desc:0 "When the country is threatened the reasons to defend it no longer need explaining."
 GEN_defence_review:0 "Strategic Defence Review"
 GEN_defence_review_desc:0 "The armed forces need more than money: a clear doctrine, modern equipment and officers who know how to use both."
 GEN_territorial_defence:0 "Territorial Defence"
 GEN_territorial_defence_desc:0 "The army is built to hold its own ground district by district, not to march abroad."
 GEN_professional_core:0 "A Professional Core"
 GEN_professional_core_desc:0 "A smaller, better paid army of volunteers, trained to the standard of its richer neighbours."
 GEN_mass_mobilisation:0 "Mass Mobilisation"
 GEN_mass_mobilisation_desc:0 "Numbers decide wars. The country plans to field everyone it can arm."
 GEN_fortification_belt:0 "Fortification Belt"
 GEN_fortification_belt_desc:0 "Bunkers, tank ditches and prepared fire zones along every approach to the capital."
 GEN_citizen_militia:0 "Citizen Militias"
 GEN_citizen_militia_desc:0 "Reservists keep their rifles at home and train every month."
 GEN_staff_college:0 "Staff College"
 GEN_staff_college_desc:0 "The general staff studies the wars of the last twenty years and rewrites the field manuals."
 GEN_elite_units:0 "Elite Units"
 GEN_elite_units_desc:0 "Small, picked units for mountains, coasts and operations behind enemy lines."
 GEN_conscription_reform:0 "National Service"
 GEN_conscription_reform_desc:0 "Every young citizen owes the country a period of service and a place on the reserve rolls."
 GEN_reserve_army:0 "A Reserve Army"
 GEN_reserve_army_desc:0 "Reservists keep their kit at home and train every year. In a crisis the army can double in size within days."
 GEN_nation_in_arms:0 "A Nation in Arms"
 GEN_nation_in_arms_desc:0 "When the country is threatened, the reasons to defend it no longer need explaining."
 GEN_doctrine_review:0 "Doctrine Review"
 GEN_doctrine_review_desc:0 "Officers sent abroad on exchange return with different ideas about how wars are fought."
 GEN_army_exercises:0 "Combined-Arms Exercises"
 GEN_army_exercises_desc:0 "Large exercises every autumn test the doctrine and expose what still does not work."
 GEN_equipment_programme:0 "Equipment Programme"
 GEN_equipment_programme_desc:0 "Rifles, machine guns and artillery pieces are standardised and ordered in quantity."
 GEN_fire_support:0 "Fire Support"
 GEN_fire_support_desc:0 "Guns and rockets that can reach the enemy before the enemy reaches the infantry."
 GEN_support_companies:0 "Support Companies"
 GEN_support_companies_desc:0 "Engineers, signals, reconnaissance and logistics: the units that let the infantry fight."
 GEN_motorisation:0 "Motorisation"
 GEN_motorisation_desc:0 "Trucks and armoured personnel carriers give the infantry the mobility of a modern army."
 GEN_armour_programme:0 "Armour Programme"
 GEN_armour_programme_desc:0 "Main battle tanks and infantry fighting vehicles, the hard core of a modern ground force."
 GEN_coastal_force_spirit:0 "Coastal Defence Force"
 GEN_coastal_force_spirit_desc:0 "Forts, minefields and fast boats keep hostile fleets away from the harbours."
 GEN_blue_water_spirit:0 "Blue-Water Navy"
 GEN_blue_water_spirit_desc:0 "A fleet that can leave the coast and be seen in other people's ports."
 GEN_foreign_yards_spirit:0 "Foreign Shipbuilders"
 GEN_foreign_yards_spirit_desc:0 "Orders go to established yards abroad while the national yards learn the trade."
 GEN_naval_construction_spirit:0 "Naval Construction Programme"
 GEN_naval_construction_spirit_desc:0 "New slipways and a trained workforce for the next generation of hulls."
 GEN_fleet_doctrine_spirit:0 "Fleet Doctrine"
 GEN_fleet_doctrine_spirit_desc:0 "Admirals agree what the fleet is for and train for nothing else."
 GEN_merchant_marine_spirit:0 "Merchant Marine"
 GEN_merchant_marine_spirit_desc:0 "A national merchant fleet with naval reservists and armed escorts."
 GEN_maritime_strategy:0 "Maritime Strategy"
 GEN_maritime_strategy_desc:0 "A coastline is a frontier like any other. The country decides what its navy is for."
 GEN_coastal_defence:0 "Coastal Defence"
 GEN_coastal_defence_desc:0 "Forts, minefields and fast boats keep hostile fleets away from the harbours."
 GEN_blue_water_navy:0 "Blue-Water Navy"
 GEN_blue_water_navy_desc:0 "A fleet that can leave the coast and be seen in other people's ports."
 GEN_foreign_shipbuilders:0 "Foreign Shipbuilders"
 GEN_foreign_shipbuilders_desc:0 "Orders go to established yards abroad while the national yards learn the trade."
 GEN_fast_attack_craft:0 "Fast Attack Craft"
 GEN_fast_attack_craft_desc:0 "Missile boats and patrol craft: cheap, quick and able to sink a cruiser."
 GEN_submarine_force:0 "Submarine Force"
 GEN_submarine_force_desc:0 "A handful of quiet submarines forces any attacker to guard every approach."
 GEN_fleet_doctrine:0 "Fleet Doctrine"
 GEN_fleet_doctrine_desc:0 "Admirals agree what the fleet is for and train for nothing else."
 GEN_surface_fleet:0 "Surface Fleet"
 GEN_surface_fleet_desc:0 "Cruisers and carriers to show the flag and cover the sea lanes."
 GEN_licensed_hulls:0 "Licensed Hulls"
 GEN_licensed_hulls_desc:0 "Proven foreign designs are built under licence at the national yards."
 GEN_dockyard_expansion:0 "Dockyard Expansion"
 GEN_dockyard_expansion_desc:0 "New slipways, graving docks and a trained workforce for the next generation of hulls."
 GEN_merchant_marine:0 "Merchant Marine"
 GEN_merchant_marine_desc:0 "A national merchant fleet with naval reservists and armed escorts."
 GEN_air_defence_spirit:0 "Integrated Air Defence"
 GEN_air_defence_spirit_desc:0 "Radar, guns and missiles are tied into one network covering the whole country."
 GEN_strike_spirit:0 "Strike Aviation"
 GEN_strike_spirit_desc:0 "The air force exists to hit the enemy where he stands, before and during the land battle."
 GEN_unmanned_spirit:0 "Unmanned Systems"
 GEN_unmanned_spirit_desc:0 "Drones are cheap, do not need trained pilots and can be launched by anyone with a workshop."
 GEN_air_base_spirit:0 "Air Base Programme"
 GEN_air_base_spirit_desc:0 "Runways, hangars and fuel depots are spread across the country so that no single strike can ground the air force."
 GEN_jet_programme_spirit:0 "Jet Programme"
 GEN_jet_programme_spirit_desc:0 "A domestic engine programme, even a small one, keeps the air force from falling a generation behind."
 GEN_air_programme:0 "Air Force Programme"
 GEN_air_programme_desc:0 "Control of the air decides the land battle. A small air force must be built with a clear purpose."
 GEN_air_defence_priority:0 "Air Defence First"
 GEN_air_defence_priority_desc:0 "The first duty of the air force is to deny the enemy the sky above the country."
 GEN_strike_aviation:0 "Strike Aviation"
 GEN_strike_aviation_desc:0 "Bombers and ground-attack aircraft give a small army a long arm."
 GEN_unmanned_systems:0 "Unmanned Systems"
 GEN_unmanned_systems_desc:0 "Drones turn a workshop into an air force. The pilot shortage stops mattering."
 GEN_radar_network:0 "Radar Network"
 GEN_radar_network_desc:0 "Early warning stations along the borders and the coast."
 GEN_fighter_force:0 "Fighter Force"
 GEN_fighter_force_desc:0 "Modern interceptors, based close to the cities they protect."
 GEN_bomber_force:0 "Bomber Force"
 GEN_bomber_force_desc:0 "Tactical bombers and attack aircraft, trained to work with the army."
 GEN_naval_strike:0 "Naval Strike Wing"
 GEN_naval_strike_desc:0 "Anti-ship aircraft and long-range patrol planes to contest the sea from the air."
 GEN_missile_forces:0 "Missile Forces"
 GEN_missile_forces_desc:0 "Ballistic and cruise missiles: the long-range option for a country that cannot afford a bomber fleet."
 GEN_jet_programme:0 "Jet Programme"
 GEN_jet_programme_desc:0 "A domestic engine programme, even a small one, keeps the air force from falling a generation behind."
 GEN_security_services_spirit:0 "Security Services"
 GEN_security_services_spirit_desc:0 "A modern state needs a service that watches threats at home and abroad."
 GEN_counter_intel_spirit:0 "Counter-Intelligence Bureau"
 GEN_counter_intel_spirit_desc:0 "Every foreign diplomat is watched, every leak investigated."
 GEN_foreign_intel_spirit:0 "Foreign Intelligence Service"
 GEN_foreign_intel_spirit_desc:0 "Stations in every embassy and a budget nobody asks about."
 GEN_cyber_spirit:0 "Cyber Command"
 GEN_cyber_spirit_desc:0 "A small unit of programmers is worth a battalion of spies."
 GEN_will_to_resist_spirit:0 "Hidden Reserves"
 GEN_will_to_resist_spirit_desc:0 "Arms caches, safe houses and a plan for the day after the capital falls."
 GEN_black_budget_spirit:0 "Black Budget"
 GEN_black_budget_spirit_desc:0 "Money that appears in no ledger buys what the official budget cannot."
 GEN_security_services:0 "Security Services"
 GEN_security_services_desc:0 "A modern state needs a service that watches threats at home and abroad."
 GEN_counter_intelligence:0 "Counter-Intelligence"
 GEN_counter_intelligence_desc:0 "The service is told to find the foreign agents already in the country."
 GEN_foreign_intelligence:0 "Foreign Intelligence"
 GEN_foreign_intelligence_desc:0 "The service is told to find out what the neighbours are planning."
 GEN_cyber_command:0 "Cyber Command"
 GEN_cyber_command_desc:0 "Networks, satellites and signals intelligence under a single military command."
 GEN_hidden_reserves:0 "Hidden Reserves"
 GEN_hidden_reserves_desc:0 "Arms caches, safe houses and a plan for the day after the capital falls."
 GEN_black_budget:0 "Black Budget"
 GEN_black_budget_desc:0 "Money that appears in no ledger buys what the official budget cannot."
 GEN_ideological_kinship:0 "Ideological Kinship"
 GEN_alignment_goodwill:0 "Strategic Partner"
 GEN_alignment_rivalry:0 "Aligned With Our Rival"
 GEN_neutral_goodwill:0 "Open Door Diplomacy"
 GEN_neighbourhood_goodwill:0 "Good Neighbour"
 GEN_foreign_ministry_spirit:0 "Foreign Ministry Reform"
 GEN_foreign_ministry_spirit_desc:0 "A leaner ministry with fewer envoys, better briefed and answerable to the cabinet."
 GEN_atlantic_spirit:0 "Atlantic Partnership"
 GEN_atlantic_spirit_desc:0 "Western capital, Western standards and a seat at the table of Western security."
 GEN_eastern_spirit:0 "Eastern Partnership"
 GEN_eastern_spirit_desc:0 "Eastern banks finance what the West will not, and ask fewer questions about how it is run."
 GEN_nonaligned_spirit:0 "Non-Alignment"
 GEN_nonaligned_spirit_desc:0 "The country takes loans from everyone and signs treaties with no one."
 GEN_regional_lead_spirit:0 "Regional Leadership"
 GEN_regional_lead_spirit_desc:0 "The neighbours expect the country to take the lead, and it intends to."
 GEN_training_missions_spirit:0 "Training Missions"
 GEN_training_missions_spirit_desc:0 "Foreign instructors in every barracks and officers on courses abroad."
 GEN_western_capital_spirit:0 "Western Capital"
 GEN_western_capital_spirit_desc:0 "Banks, funds and technology firms from the West open offices in the capital."
 GEN_belt_road_spirit:0 "Belt and Road Projects"
 GEN_belt_road_spirit_desc:0 "Eastern state banks finance ports, railways and power plants, to be repaid over thirty years."
 GEN_eastern_arms_spirit:0 "Eastern Arms Cooperation"
 GEN_eastern_arms_spirit_desc:0 "Surplus weapons and advisers arrive from the East at prices the West will not match."
 GEN_multivector_spirit:0 "Multi-Vector Diplomacy"
 GEN_multivector_spirit_desc:0 "Embassies in every capital that matters and no commitments to any of them."
 GEN_trade_hub_spirit:0 "Neutral Trade Hub"
 GEN_trade_hub_spirit_desc:0 "Ships, banks and brokers serve every side. A neutral flag is a licence to trade."
 GEN_regional_bloc_spirit:0 "Regional Bloc"
 GEN_regional_bloc_spirit_desc:0 "A permanent secretariat, a common market and a joint command: the neighbours organise."
 GEN_diplomatic_corps_spirit:0 "Diplomatic Corps"
 GEN_diplomatic_corps_spirit_desc:0 "A career diplomatic service recruited by examination and posted for life."
 GEN_arms_exports_spirit:0 "Arms Export Programme"
 GEN_arms_exports_spirit_desc:0 "Export orders keep the production lines busy between the army's own contracts."
 GEN_trade_agreements_spirit:0 "Trade Agreements"
 GEN_trade_agreements_spirit_desc:0 "Tariff-free quotas with a dozen partners, negotiated one commodity at a time."
 GEN_diaspora_spirit:0 "Diaspora Networks"
 GEN_diaspora_spirit_desc:0 "Emigrants send money home, lobby their new governments and bring back skills."
 GEN_war_plans_spirit:0 "Contingency War Plans"
 GEN_war_plans_spirit_desc:0 "Staff officers draw up plans for every neighbour and update them every year."
 GEN_peace_dividend_spirit:0 "Peace Dividend"
 GEN_peace_dividend_spirit_desc:0 "Defence spending is cut and the money goes to schools, clinics and shops."
 GEN_expeditionary_spirit:0 "Expeditionary Support"
 GEN_expeditionary_spirit_desc:0 "A standing offer to send trained volunteers to friendly governments at war."
 GEN_good_neighbour_spirit:0 "Good Neighbour Policy"
 GEN_good_neighbour_spirit_desc:0 "Border commissions, joint markets and a standing promise not to make claims."
 GEN_peacekeeping_spirit:0 "Peacekeeping Contributions"
 GEN_peacekeeping_spirit_desc:0 "Blue-helmet battalions earn the country a reputation it could not buy."
 GEN_regional_europe_spirit:0 "European Integration"
 GEN_regional_europe_spirit_desc:0 "Open borders, common standards and a shared market with the neighbours."
 GEN_regional_north_america_spirit:0 "North American Partnership"
 GEN_regional_north_america_spirit_desc:0 "Trade corridors and joint border commissions tie the neighbours together."
 GEN_regional_south_america_spirit:0 "South American Integration"
 GEN_regional_south_america_spirit_desc:0 "Common tariffs, shared rivers and joint infrastructure across the continent."
 GEN_regional_africa_spirit:0 "African Union Integration"
 GEN_regional_africa_spirit_desc:0 "Regional standby forces, shared power grids and a single customs area."
 GEN_regional_asia_spirit:0 "Asian Regional Cooperation"
 GEN_regional_asia_spirit_desc:0 "Supply chains, summits and a growing network of free-trade agreements."
 GEN_regional_middle_east_spirit:0 "Gulf and Arab Cooperation"
 GEN_regional_middle_east_spirit_desc:0 "Joint investment funds, shared security and a common voice in the region."
 GEN_regional_australia_spirit:0 "Pacific Partnership"
 GEN_regional_australia_spirit_desc:0 "A web of island partnerships built around shipping, fisheries and aid."
 GEN_foreign_review:0 "Foreign Policy Review"
 GEN_foreign_review_desc:0 "The foreign ministry is asked a simple question: who are our friends, and what do they want from us?"
 GEN_fp_atlantic:0 "Atlantic Partnership"
 GEN_fp_atlantic_desc:0 "The country casts its lot with the Western security order and the markets that come with it."
 GEN_fp_atlantic_tt:0 "Relations with [USA.GetNameDef] and its allies improve. Relations with [PRC.GetNameDef] worsen."
 GEN_fp_eastern:0 "Eastern Partnership"
 GEN_fp_eastern_desc:0 "The country turns east, to the capital, the weapons and the diplomatic cover that the other side withholds."
 GEN_fp_eastern_tt:0 "Relations with [PRC.GetNameDef] and [RUS.GetNameDef] improve. Relations with [USA.GetNameDef] worsen."
 GEN_fp_nonaligned:0 "Non-Alignment"
 GEN_fp_nonaligned_desc:0 "The country takes loans from everyone and signs treaties with no one."
 GEN_fp_nonaligned_tt:0 "Relations with [USA.GetNameDef], [PRC.GetNameDef] and [RUS.GetNameDef] improve a little."
 GEN_fp_regional:0 "Regional Leadership"
 GEN_fp_regional_desc:0 "The neighbours look to the country for a lead. It is time to give one."
 GEN_fp_security_partnership:0 "Security Partnership"
 GEN_fp_security_partnership_desc:0 "Training teams, joint exercises and a standing invitation to the Western staff colleges."
 GEN_fp_western_investment:0 "Western Investment"
 GEN_fp_western_investment_desc:0 "Banks, funds and technology firms from the West open offices in the capital."
 GEN_fp_belt_and_road:0 "Belt and Road Projects"
 GEN_fp_belt_and_road_desc:0 "Eastern state banks finance ports, railways and power plants, to be repaid over thirty years."
 GEN_fp_eastern_arms:0 "Eastern Arms Cooperation"
 GEN_fp_eastern_arms_desc:0 "Surplus weapons and advisers arrive from the East at prices the West will not match."
 GEN_fp_multivector:0 "Multi-Vector Diplomacy"
 GEN_fp_multivector_desc:0 "Embassies in every capital that matters and no commitments to any of them."
 GEN_fp_neutral_trade:0 "Neutral Trade Hub"
 GEN_fp_neutral_trade_desc:0 "Ships, banks and brokers serve every side. A neutral flag is a licence to trade."
 GEN_fp_regional_integration:0 "Regional Integration"
 GEN_fp_regional_integration_desc:0 "Customs unions, shared grids and joint commissions with the neighbouring states."
 GEN_fp_neighbour_tt:0 "Our neighbours will view us more favourably."
 GEN_fp_regional_bloc:0 "Regional Bloc"
 GEN_fp_regional_bloc_desc:0 "A permanent secretariat, a common market and a joint command: the neighbours organise."
 GEN_fp_diplomatic_corps:0 "Diplomatic Corps"
 GEN_fp_diplomatic_corps_desc:0 "A career diplomatic service recruited by examination and posted for life."
 GEN_fp_arms_exports:0 "Arms Export Programme"
 GEN_fp_arms_exports_desc:0 "Export orders keep the production lines busy between the army's own contracts."
 GEN_fp_trade_agreements:0 "Trade Agreements"
 GEN_fp_trade_agreements_desc:0 "Tariff-free quotas with a dozen partners, negotiated one commodity at a time."
 GEN_fp_diaspora:0 "Diaspora Networks"
 GEN_fp_diaspora_desc:0 "Emigrants send money home, lobby their new governments and bring back skills."
 GEN_fp_war_planning:0 "Contingency War Plans"
 GEN_fp_war_planning_desc:0 "Staff officers draw up plans for every neighbour and update them every year."
 GEN_fp_peace_dividend:0 "Peace Dividend"
 GEN_fp_peace_dividend_desc:0 "Defence spending is cut and the money goes to schools, clinics and shops."
 GEN_fp_expeditionary:0 "Expeditionary Support"
 GEN_fp_expeditionary_desc:0 "A standing offer to send trained volunteers to friendly governments at war."
 GEN_fp_good_neighbours:0 "Good Neighbour Policy"
 GEN_fp_good_neighbours_desc:0 "Border commissions, joint markets and a standing promise not to make claims."
 GEN_fp_peacekeeping:0 "Peacekeeping Contributions"
 GEN_fp_peacekeeping_desc:0 "Blue-helmet battalions earn the country a reputation it could not buy."
 GEN_agenda_spirit:0 "National Agenda"
 GEN_agenda_spirit_desc:0 "The government has said what it wants the state to be, and civil servants plan accordingly."
 GEN_open_politics_spirit:0 "Open Politics"
 GEN_open_politics_spirit_desc:0 "Parties, papers and pressure groups compete freely. Policy is better argued and harder to enforce."
 GEN_managed_politics_spirit:0 "Managed Politics"
