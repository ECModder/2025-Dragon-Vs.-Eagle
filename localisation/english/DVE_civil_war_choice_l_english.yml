l_english:
 dve_civilwar.1.t:0 "Whose Side Is Moscow On?"
 dve_civilwar.1.d:0 "The armouries in Leningrad, Sverdlovsk and Khabarovsk opened on the same morning, and by evening three governments were claiming to be the real one. The Kremlin holds the centre and is at war with all of them at once - which is a position no army has ever held for long.\n\nThe FSB has laid three folders on the table. Each one is a ceasefire already drafted, waiting only for a signature and for us to become something other than what we are. The fourth option is on the table too, and it is the one nobody has written down: hold the line alone."
 dve_civilwar.1.a:0 "Moscow bends to no one. All three of them, then."
 dve_civilwar.1.b:0 "Sign with Leningrad. The red flag flies over the Kremlin again."
 dve_civilwar.1.c:0 "Sign with Sverdlovsk. Let there be a republic, and let it be ours."
 dve_civilwar.1.d:0 "Sign with Khabarovsk. The Empire returns, and we return with it."
 DVE_FACTION_RUR:0 "Constitutional Coalition"
 DVE_FACTION_NRE:0 "Imperial Restoration Pact"

 dve_civilwar.2.t:0 "Russia Tears Itself Apart"
 dve_civilwar.2.d:0 "The succession has failed and the Federation has broken apart. The communists hold Leningrad, a republican government sits in Sverdlovsk, the imperialists rule from Khabarovsk, and the Caucasus is going its own way.\n\nEvery Russian has to choose a side. So do you: this is where you decide which faction you play."
 dve_civilwar.2.a:0 "Stay with the government in §YMoscow§! (Moscow then decides whom to side with)"
 dve_civilwar.2.b:0 "Join the §Y[SOV.GetName]§! (the communists of Leningrad)"
 dve_civilwar.2.c:0 "Join the §Y[RUR.GetName]§! (the republicans of Sverdlovsk)"
 dve_civilwar.2.d:0 "Join the §Y[NRE.GetName]§! (the imperialists of Khabarovsk)"
 dve_civilwar.2.e:0 "Join the §Y[KUB.GetName]§! (the Kuban)"
 dve_civilwar.2.f:0 "Join §Y[KAL.GetName]§! (the Kalmyks)"
 dve_civilwar.2.g:0 "Join §Y[CIN.GetName]§! (the Chechens and Ingush)"
