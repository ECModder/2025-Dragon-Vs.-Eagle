l_english:
 dve_itacw.1.t:0 "The Guns Fall Silent, the Generals Speak"
 dve_itacw.1.d:0 "Two days into the collapse, whatever remains of the government in Rome finds that the only institution still intact enough to give orders is the Armed Forces Joint Command. It does not ask for the office. It simply takes it."
 dve_itacw.1.a:0 "Let the Command govern"

 dve_itacw.2.t:0 "Italy Tears Itself Apart"
 dve_itacw.2.d:0 "The Republic has broken into pieces. The Internationale holds the industrial north, the Stalinists rule from Naples, the Black Barons have taken Rome, and Padania and South Tyrol want nothing more to do with any of them.\n\nEvery Italian has to choose a side. So do you."
 dve_itacw.2.a:0 "Stay with the government of the §YItalian Republic§!"
 dve_itacw.2.b:0 "Join §YThe Internationale§! (the unions and the revolutionary left)"
 dve_itacw.2.c:0 "Join the §YSocialist Republic of Italy§! (the Stalinists)"
 dve_itacw.2.opt_d:0 "Join the §YItalian Social Republic§! (the fascists)"
 dve_itacw.2.e:0 "Join §YPadania§! (the northern separatists)"
 dve_itacw.2.f:0 "Join §YSouth Tyrol§! (the Tyrolean separatists)"
