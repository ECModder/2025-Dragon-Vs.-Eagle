l_english:
 dve_itacw.1.t:0 "The Guns Fall Silent, the Generals Speak"
 dve_itacw.1.d:0 "Two days into the collapse, whatever remains of the government in Rome finds that the only institution still intact enough to give orders is the Armed Forces Joint Command. It does not ask for the office. It simply takes it."
 dve_itacw.1.a:0 "Let the Command govern"
