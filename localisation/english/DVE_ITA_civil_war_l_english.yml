l_english:
 dve_itacw.1.t:0 "The Guns Fall Silent, the Generals Speak"
 dve_itacw.1.d:0 "Two days into the collapse, whatever remains of the government in Rome finds that the only institution still intact enough to give orders is the Armed Forces Joint Command. It does not ask for the office. It simply takes it."
 dve_itacw.1.a:0 "Let the Command govern"

 dve_itacw.2.t:0 "Italy Tears Itself Apart"
 dve_itacw.2.d:0 "The Republic has broken into pieces. The Internationale holds the industrial north, the Stalinists rule from Naples, the Black Barons have taken Rome, the Trotskyists hold three pockets of their own, and Padania and South Tyrol want nothing more to do with any of them.\n\nEvery Italian has to choose a side. So do you."
 dve_itacw.2.a:0 "Stay with the government of the §YItalian Republic§!"
 dve_itacw.2.b:0 "Join §YThe Internationale§! (the unions and the revolutionary left)"
 dve_itacw.2.c:0 "Join the §YSocialist Republic of Italy§! (the Stalinists)"
 dve_itacw.2.opt_d:0 "Join the §YItalian Social Republic§! (the fascists)"
 dve_itacw.2.e:0 "Join §YPadania§! (the northern separatists)"
 dve_itacw.2.f:0 "Join §YSouth Tyrol§! (the Tyrolean separatists)"
 dve_itacw.2.g:0 "Join §YThe Italian Revolutionary Communist Republic§! (the Trotskyists)"

 dve_itacw.3.t:0 "The Internationale's Ultimatum"
 dve_itacw.3.d:0 "Rome has fallen, and the war against the old state is won. The Councils' Internationale has not forgotten that the Revolutionary Communist Party stood apart from it throughout the fighting, and it now asks for one thing: that the pockets still flying the PCR flag dissolve into the Internationale - their divisions into its guard, their ministries into its councils.\n\nThe note is courteous. The Guardia Internazionalista massed along every border of those pockets is not."
 dve_itacw.3.a:0 "The permanent revolution can wait. We join the Internationale"
 dve_itacw.3.a_tt:0 "The §YItalian Revolutionary Communist Republic§! is annexed by §RThe Internationale§!. If you are playing it, you continue the game as the Internationale."
 dve_itacw.3.b:0 "Never. The Revolutionary Communist Republic stands on its own"
 dve_itacw.3.b_tt:0 "The Republic keeps its independence and moves to its §Ymain focus tree§!. It gains §Y10%§! war support and §Y100§! political power. The Internationale will decide whether to answer with war. The Republic gets the §YDefending the Revolution§! spirit for two years and a wargoal against it."
 dve_itacw.3.c:0 "Never. If the Internationale wants a war, we strike first"
 dve_itacw.3.c_tt:0 "As above, but the Republic itself declares war on §RThe Internationale§!."

 dve_itacw.4.t:0 "The Trotskyists Come Home"
 dve_itacw.4.d:0 "The Revolutionary Communist Republic has accepted the terms of the Internationale. The PCR hands over its territory, its guard and its archives, and its Central Council has been seated, with some ceremony, among the Councils of the Internationale. One revolution, one line - at least until the first congress."
 dve_itacw.4.a:0 "One revolution, one line"

 dve_itacw.5.t:0 "The Heretics Refuse"
 dve_itacw.5.d:0 "The Revolutionary Communist Republic has rejected the ultimatum. Its Central Council calls the Internationale a bureaucracy in a red coat, and the permanent revolution its only law. The pockets lie within our reach, and the Guardia Internazionalista is waiting for the order."
 dve_itacw.5.a:0 "Crush them"
 dve_itacw.5.b:0 "Let them stew a while"

 dve_itacw.6.t:0 "Padania Against All"
 dve_itacw.6.d:0 "Rome has fallen, and with it the last reason Padania had to keep the peace with the other sides. The Sun of the Alps flies over every town hall, the Council has met in the night, and the verdict is unanimous: a North that is not the strongest power of the peninsula will be somebody else's prize. War is declared on the Internationale, the Stalinists, the Black Barons, the Trotskyists and the Tyroleans - all of them, at once."
 dve_itacw.6.a:0 "Padania against all"
 IRC_defending_the_revolution:0 "Defending the Revolution"
 IRC_defending_the_revolution_desc:0 "The Councils of the Internationale want the pockets back, and the PCR means to keep them. Every worker in the Republic knows what is at stake."
