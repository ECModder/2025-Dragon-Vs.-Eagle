l_english:
 INT_focus:0 "The Internationale"

 INT_eco_socialist_economy_question:0 "The Question of the Socialist Economy"
 INT_eco_socialist_economy_question_desc:0 "The war is won, the factories are ours and nobody agrees on what to do with them. The congress will have to decide what kind of economy the revolution is going to build."
 INT_eco_socialization_means:0 "Socialization of the Means of Production"
 INT_eco_socialization_means_desc:0 "Not the state but the workers themselves: every plant is handed to the council that runs it, and the councils answer to each other rather than to a ministry in Rome."
 INT_eco_collectivization_means:0 "Collectivization of the Means of Production"
 INT_eco_collectivization_means_desc:0 "The revolution cannot afford a thousand factories pulling in a thousand directions. Industry passes into collective ownership under a single plan, and the plan answers to the revolution."
 INT_eco_from_each_abilities:0 "From Each According to his Abilities"
 INT_eco_from_each_abilities_desc:0 "Work is reorganized around what people can actually do, not around what a contract says. Engineers go back to the drawing board, and the drawing board goes back to the shop floor."
 INT_eco_workspace_democracy:0 "Workspace Democracy"
 INT_eco_workspace_democracy_desc:0 "Shifts, targets and foremen are now voted on at the factory assembly. The meetings are long, but the absenteeism figures have never been lower."
 INT_eco_socialization_factories:0 "Socialization of Factories"
 INT_eco_socialization_factories_desc:0 "From Mirafiori to the steelworks of Terni, every plant that closed under the old owners reopens under its workers."
 INT_eco_to_each_needs:0 "To Each According to his Needs"
 INT_eco_to_each_needs_desc:0 "Housing, food and healthcare are distributed by need rather than by income. The queues are shorter than anyone expected."
 INT_eco_peer_to_peer_economy:0 "Peer-to-Peer Economy"
 INT_eco_peer_to_peer_economy_desc:0 "Councils trade parts, designs and spare capacity directly with each other over an open network, without a middleman taking a cut."
 INT_eco_agricultural_communes:0 "Agricultural Communes"
 INT_eco_agricultural_communes_desc:0 "The estates of the Po valley are split into communes run by the people who work them. The cities will not go hungry."
 INT_eco_five_year_plans:0 "Five-Year Plans"
 INT_eco_five_year_plans_desc:0 "The councils have their own targets; now they need a common horizon. The first plan is drafted from the bottom up, factory by factory."
 INT_eco_investments_ai:0 "Investments in Artificial Intelligence"
 INT_eco_investments_ai_desc:0 "The models that once optimized advertising and share prices can just as easily optimize a production schedule."
 INT_eco_unified_computer_network:0 "Unified State Network of Computer Centers"
 INT_eco_unified_computer_network_desc:0 "The Soviets dreamed of it in the sixties and never built it. Every council, depot and plant is wired into one planning network."
 INT_eco_green_quotas:0 "Green Quotas"
 INT_eco_green_quotas_desc:0 "Emissions become a target like any other, counted and planned alongside steel and grain."
 INT_eco_smart_production_chains:0 "Smart Production Chains"
 INT_eco_smart_production_chains_desc:0 "Supply chains that reroute themselves around a broken machine or a missing shipment before anyone has to pick up a phone."
 INT_eco_ai_economic_planning:0 "AI Reviewed Economic Planning"
 INT_eco_ai_economic_planning_desc:0 "The councils still write the plan. The machines only check it, and they are very good at finding the mistakes."
 INT_eco_ecodata_monitoring:0 "Eco-Data Monitoring Network"
 INT_eco_ecodata_monitoring_desc:0 "Sensors along every river and chimney feed the planning network in real time."
 INT_eco_decentralize_system:0 "Decentralize the System"
 INT_eco_decentralize_system_desc:0 "With the network in place, decisions can move back down to the councils without losing sight of the whole."
 INT_eco_variable_production_quotas:0 "Variable Production Quotas"
 INT_eco_variable_production_quotas_desc:0 "Quotas that change week by week with demand, instead of a five-year number that is wrong by the second winter."
 INT_eco_clean_energy_grid:0 "Clean Energy Grid"
 INT_eco_clean_energy_grid_desc:0 "Alpine hydro, southern solar and a grid that moves power to wherever the plan needs it."
 INT_eco_supercomputer_each_council:0 "A Supercomputer for Each Council"
 INT_eco_supercomputer_each_council_desc:0 "Every council gets the computing power that once belonged only to banks and intelligence agencies."
 INT_eco_automation_factories:0 "Automation of Factories and Agriculture"
 INT_eco_automation_factories_desc:0 "Under the old owners automation meant layoffs. Under the councils it means a shorter working week."
 INT_eco_full_ecological_transition:0 "Full Ecological Transition"
 INT_eco_full_ecological_transition_desc:0 "The last coal plant closes, and the plan finally balances what the country takes from the land against what it gives back."
 INT_eco_digital_marxism:0 "Full-Blown Digital Marxism"
 INT_eco_digital_marxism_desc:0 "A planned economy that plans itself, run by the councils and computed by the network. Marx never saw a microchip, but he would have recognized the idea."
 INT_eco_nationalize_private:0 "Nationalize Private Enterprises"
 INT_eco_nationalize_private_desc:0 "Banks, utilities and the big industrial groups pass into collective hands by decree. The old boards of directors are invited to explain themselves."
 INT_eco_state_unions_economy:0 "State's Unions Based Economy"
 INT_eco_state_unions_economy_desc:0 "The unions stop negotiating with the state and become the state's economic arm, from the ministry down to the shop steward."
 INT_eco_work_coercion:0 "Work Coercion"
 INT_eco_work_coercion_desc:0 "Rebuilding after a civil war is not a matter of choice. Labour is assigned, and refusing the assignment is sabotage."
 INT_eco_seize_the_wealth:0 "Seize the Wealth"
 INT_eco_seize_the_wealth_desc:0 "Villas on Lake Como, yachts in Portofino, accounts in Lugano. What can be reached is taken; what cannot is put on a list for later."
 INT_eco_militarization_economy:0 "Militarization of the Economy"
 INT_eco_militarization_economy_desc:0 "The revolution has enemies on every border. Production is organized like an army, because it may soon have to supply one."
 INT_eco_labor_mobilization:0 "Labor Mobilization"
 INT_eco_labor_mobilization_desc:0 "Labour brigades are formed in every province and sent wherever the plan needs hands."
 INT_eco_collective_economic_outlook:0 "Collective Economic Outlook"
 INT_eco_collective_economic_outlook_desc:0 "The transition is over. What was expropriated is now organized, and what was organized now produces."
 INT_eco_recreate_sovkhozes:0 "Recreate the Sovkhozes"
 INT_eco_recreate_sovkhozes_desc:0 "State farms, run by agronomists and farmed by salaried workers. Not romantic, but the harvest is predictable."
 INT_eco_restart_five_year_plans:0 "Restart the Five-Year Plans"
 INT_eco_restart_five_year_plans_desc:0 "Gosplan had its faults, but it built an industrial power out of a peasant country in twenty years."
 INT_eco_meritocratic_socialism:0 "Meritocratic Socialism"
 INT_eco_meritocratic_socialism_desc:0 "Posts in the planning apparatus go to whoever passes the exam, not to whoever has the right party card."
 INT_eco_socialist_modernization:0 "Socialist Modernization"
 INT_eco_socialist_modernization_desc:0 "Roads, railways and power lines reach the valleys and villages the old governments forgot."
 INT_eco_centralize_economic_planning:0 "Centralize Economic Planning"
 INT_eco_centralize_economic_planning_desc:0 "One plan, one planning office, one set of figures. Regional committees keep their say, but no longer their veto."
 INT_eco_network_computer_servers:0 "Network of Computer Servers"
 INT_eco_network_computer_servers_desc:0 "The plan outgrows paper. A national server network keeps every figure current and every ministry honest."
 INT_eco_ecological_development:0 "Ecological Development"
 INT_eco_ecological_development_desc:0 "Growth that does not poison the Po. The plan now counts rivers and air as well as tonnes of steel."
 INT_eco_fight_corruption_apparatus:0 "Fight Corruption Within the Apparatus"
 INT_eco_fight_corruption_apparatus_desc:0 "Every planned economy grows its own parasites. A few public trials remind the apparatus who it works for."
 INT_eco_advanced_economic_planning:0 "Advanced Economic Planning"
 INT_eco_advanced_economic_planning_desc:0 "Input-output tables that used to take a ministry a year are now recalculated overnight."
 INT_eco_rewards_heavy_industry:0 "Reward Heavy Industry"
 INT_eco_rewards_heavy_industry_desc:0 "Steel, machine tools and chemicals get first call on investment, workers and prestige."
 INT_eco_radical_redistribution:0 "Radical Redistribution of Wealth"
 INT_eco_radical_redistribution_desc:0 "What the old elite accumulated over a century is spread across the whole working population in a single year."
 INT_eco_integrated_advanced_search:0 "Integrated Advanced Search"
 INT_eco_integrated_advanced_search_desc:0 "Any engineer in any plant can find any design, part or spare machine in the country in seconds."
 INT_eco_true_trotskyist_revolution:0 "A True Trotskyist Revolution"
 INT_eco_true_trotskyist_revolution_desc:0 "An economy built not for one country but as the arsenal and granary of a revolution that does not stop at the border."
 INT_pol_unified_congress:0 "Unified Congress of Internationalist Communists"
 INT_pol_unified_congress_desc:0 "Every current that fought the civil war is in the same hall in Milan for the first time since the fighting ended. Only one of them will leave with a majority."
 INT_pol_lotta_comunista_majority:0 "Lotta Comunista Majority"
 INT_pol_lotta_comunista_majority_desc:0 "The Leninists of Lotta Comunista carry the congress. The revolution will be led by a disciplined party of cadres and organized through the workers' councils."
 INT_pol_pcr_majority:0 "PCR Majority"
 INT_pol_pcr_majority_desc:0 "The Revolutionary Communist Party wins the vote. The revolution will not rest in one country: it is permanent or it is nothing."
 INT_pol_cheka_model:0 "Cheka Model"
 INT_pol_cheka_model_desc:0 "The counter-revolution did not surrender with the army. A commission for the struggle against sabotage is set up, with wide powers and few questions asked."
 INT_pol_new_agit_prop:0 "A New Agit-Prop"
 INT_pol_new_agit_prop_desc:0 "Posters and pamphlets have given way to videos and feeds, but the job is the same: explain the revolution faster than its enemies can slander it."
 INT_pol_repudiate_stalinism:0 "Repudiate Stalinism"
 INT_pol_repudiate_stalinism_desc:0 "The Stalinists in Naples called themselves communists too. The congress states it plainly: what they built was a bureaucracy, not socialism."
 INT_pol_china_is_imperialist:0 "China Is Imperialist"
 INT_pol_china_is_imperialist_desc:0 "A red flag over Beijing does not change what Beijing does abroad: it exports capital, buys ports and collects debts like any other imperial power."
 INT_pol_us_decrepit_wreck:0 "The US Is a Decrepit Wreck"
 INT_pol_us_decrepit_wreck_desc:0 "The empire that bankrolled every counter-revolution of the last century can no longer keep its own bridges standing."
 INT_pol_communism_or_barbarism:0 "Communism or Barbarism"
 INT_pol_communism_or_barbarism_desc:0 "There is no third way and no return to the old order. Either the working class takes the world, or the world goes back to the barbarism it came from."
 INT_pol_state_of_councils:0 "The State of the Councils"
 INT_pol_state_of_councils_desc:0 "Power is organized from the bottom up: factory councils elect city councils, city councils elect the congress. Every delegate can be recalled."
 INT_pol_workers_clubs:0 "Workers' Clubs"
 INT_pol_workers_clubs_desc:0 "The circoli operai that kept the movement alive through the lean decades become the schools of the new state."
 INT_pol_factory_councils:0 "Factory Councils"
 INT_pol_factory_councils_desc:0 "Gramsci wrote about them in Turin a century ago. Now every plant has one, and it does not ask the owners' permission."
 INT_pol_city_councils:0 "City Councils"
 INT_pol_city_councils_desc:0 "Prefects and mayors are replaced by councils elected from the neighbourhoods and workplaces of every city."
 INT_pol_council_based_planning:0 "Economic Planning Based on Councils"
 INT_pol_council_based_planning_desc:0 "The plan is assembled from what each council says it needs and can produce, not handed down from above."
 INT_pol_all_power_to_councils:0 "All Power to the Councils!"
 INT_pol_all_power_to_councils_desc:0 "The old slogan of 1917 is no longer a slogan. There is no power in the country above the councils."
 INT_pol_marx_engels_cervetto:0 "Marx, Engels, Cervetto"
 INT_pol_marx_engels_cervetto_desc:0 "Arrigo Cervetto's analysis of imperialism becomes the party's theoretical backbone, next to the classics it was built on."
 INT_pol_true_leninism:0 "True Leninism"
 INT_pol_true_leninism_desc:0 "Lenin without the embalming: a party of professional revolutionaries, internationalist to the core and suspicious of any state that calls itself socialist."
 INT_pol_democratic_centralism:0 "Democratic Centralism"
 INT_pol_democratic_centralism_desc:0 "Freedom of discussion, unity of action. The debate can last all night, but in the morning the whole party moves as one."
 INT_pol_councils_political_commissariats:0 "Establish the Councils' Political Commissariats"
 INT_pol_councils_political_commissariats_desc:0 "The councils send their own commissars into the army and the ministries, so that no institution drifts away from the people who elected it."
 INT_pol_flexible_tactics:0 "Flexible Tactics"
 INT_pol_flexible_tactics_desc:0 "Firm on principles, flexible on everything else. The party learns to retreat when it must and advance when it can."
 INT_pol_relentless_strategy:0 "Relentless Strategy"
 INT_pol_relentless_strategy_desc:0 "Tactics change; the goal does not. Every step, however small, is measured against the world revolution."
 INT_pol_european_leninism:0 "A True European Leninism"
 INT_pol_european_leninism_desc:0 "Italy was only the beginning. The councils, the party and the theory are ready to be carried across the whole continent."
 INT_pol_trotskyism:0 "Trotskyism"
 INT_pol_trotskyism_desc:0 "The party openly claims the legacy of the Fourth International: workers' democracy at home, permanent revolution abroad."
 INT_pol_united_front_tactic:0 "United Front Tactic"
 INT_pol_united_front_tactic_desc:0 "March separately, strike together. The other currents of the left are brought into the work of government instead of being pushed into opposition."
 INT_pol_concessions_leninists:0 "Concessions to the Leninists"
 INT_pol_concessions_leninists_desc:0 "Lotta Comunista lost the congress but not its cadres. It gets seats on the committees in exchange for its discipline."
 INT_pol_concessions_leftcom:0 "Concessions to the LeftCom"
 INT_pol_concessions_leftcom_desc:0 "The left communists never trusted any party, including this one. Guarantees for the councils keep them on side."
 INT_pol_concessions_socdem:0 "Concessions to the Soc-Dem"
 INT_pol_concessions_socdem_desc:0 "The unions and the old social democrats get a voice on wages and welfare. In return, they stop asking for elections."
 INT_pol_party_full_of_factions:0 "A Party Full of Factions"
 INT_pol_party_full_of_factions_desc:0 "Tendencies, platforms and factions are allowed to organize openly inside the party. It is noisy, but nobody has to go underground to disagree."
 INT_pol_new_communism_new_age:0 "New Communism for a New Age"
 INT_pol_new_communism_new_age_desc:0 "The revolution of the twenty-first century will not be a copy of the one in the twentieth. The party rewrites its program for a world of networks and automation."
 INT_pol_city_soviets:0 "Create the City Soviets"
 INT_pol_city_soviets_desc:0 "Every city gets its soviet, elected by the workplaces and answerable to the party's revolutionary program."
 INT_pol_militarized_labour_unions:0 "Militarized Labour Unions"
 INT_pol_militarized_labour_unions_desc:0 "Trotsky proposed it in 1920 and lost the argument. The unions become production armies, with ranks, discipline and quotas."
 INT_pol_militarization_of_policy:0 "Militarization of the Policy"
 INT_pol_militarization_of_policy_desc:0 "Politics becomes the continuation of war by other means. Every ministry is organized as if the front were one valley away."
 INT_pol_complete_ideological_revolution:0 "A Complete Ideological Revolution"
 INT_pol_complete_ideological_revolution_desc:0 "Schools, newspapers and theatres are turned over to the revolution. A new generation is raised without the old reflexes."
 INT_pol_absolute_loyalty:0 "Absolute Loyalty to the Revolution"
 INT_pol_absolute_loyalty_desc:0 "Loyalty is owed to the revolution, not to a leader or a faction. Those who confuse the two are reminded of the difference."
 INT_pol_stalinism_degeneration:0 "Stalinism Is a Degeneration of Socialism"
 INT_pol_stalinism_degeneration_desc:0 "The Revolution Betrayed is required reading for every cadre. The bureaucracy that strangled the Soviet state will not be allowed to grow here."
 INT_pol_china_deviated_socialism:0 "China, a Deviated Socialism"
 INT_pol_china_deviated_socialism_desc:0 "Billionaires with party cards and workers without unions. Whatever China is building, it is not socialism."
 INT_pol_contacts_vietnam:0 "Contacts with Vietnam"
 INT_pol_contacts_vietnam_desc:0 "Hanoi has its own reasons to distrust Beijing. A delegation is sent to find out how far that distrust goes."
 INT_pol_contacts_african_socialists:0 "Contacts with the African Socialists"
 INT_pol_contacts_african_socialists_desc:0 "From Asmara to the Sahel, there are movements that remember who supported the anti-colonial wars. The party reopens those channels."
 INT_pol_contacts_african_socialists_tt:0 "Every socialist government in §YAfrica§! gains the opinion modifier §Y$INT_revolutionary_contacts$§!, and we gain it toward them."
 INT_pol_alliance_with_cuba:0 "Alliance with Cuba"
 INT_pol_alliance_with_cuba_desc:0 "Havana has survived sixty years of embargo on its own. It will not have to survive the next sixty alone."
 INT_pol_support_comrev_world:0 "Support ComRev Around the World"
 INT_pol_support_comrev_world_desc:0 "Money, weapons and volunteers for every revolutionary movement that asks. The revolution in one country is a contradiction in terms."
 INT_pol_trotskyism_young_again:0 "Trotskyism Is Young Once Again"
 INT_pol_trotskyism_young_again_desc:0 "The old man in Coyoacán was murdered, his followers were scattered and for eighty years the movement survived in back rooms. Now it has a country."
 INT_for_revolution_crosses_alps:0 "Revolution Crosses the Alps"
 INT_for_revolution_crosses_alps_desc:0 "Italy was the first link to break. The question is no longer whether the revolution leaves the peninsula, but how."
 INT_for_councils_international:0 "Long Live the Councils' International"
 INT_for_councils_international_desc:0 "An international of workers' councils, not of parties or governments. Its sections will be built wherever the working class rises."
 INT_for_revolutionary_international:0 "Revolutionary International"
 INT_for_revolutionary_international_desc:0 "The Fourth International is reborn, this time with a state, an army and a treasury behind it."
 INT_for_leninist_france:0 "Leninist France"
 INT_for_leninist_france_desc:0 "The Communards have held Paris before. This time they will not be left to fight alone."
 INT_for_leninist_france_tt:0 "Each of the following joins the §YInternational§! and our §Yfaction§! if it exists, is independent and has a socialist government: §Y[CMU.GetNameDef]§! and §Y[FSR.GetNameDef]§!.\nWe §Rjoin every war§! they are fighting."
 INT_for_leninist_spain:0 "Leninist Spain"
 INT_for_leninist_spain_desc:0 "Madrid and Lisbon rose within weeks of each other. The Internationale offers both republics its protection."
 INT_for_leninist_spain_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[SPA.GetNameDef]§! and §Y[PRS.GetNameDef]§!."
 INT_for_leninist_germany:0 "Leninist Germany"
 INT_for_leninist_germany_desc:0 "Without Germany, Lenin said, the revolution in the West could not hold. The German comrades are brought into the fold."
 INT_for_leninist_germany_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[GDR.GetNameDef]§!."
 INT_for_leninist_brittany:0 "Leninist Britain"
 INT_for_leninist_brittany_desc:0 "The oldest industrial working class in the world has finally settled its account with the City of London."
 INT_for_leninist_brittany_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[SRB.GetNameDef]§! and §Y[ENG.GetNameDef]§!."
 INT_for_yugoslav_revolution:0 "Yugoslav Revolution"
 INT_for_yugoslav_revolution_desc:0 "Trieste is a border town again, and on the other side the partisans' grandchildren have rebuilt the federation."
 INT_for_yugoslav_revolution_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[YUG.GetNameDef]§!."
 INT_for_scandinavian_revolution:0 "Scandinavian Revolution"
 INT_for_scandinavian_revolution_desc:0 "The model welfare states of the North ran out of welfare before they ran out of workers."
 INT_for_scandinavian_revolution_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[SSR.GetNameDef]§!."
 INT_for_world_is_burning:0 "The World Is Burning"
 INT_for_world_is_burning_desc:0 "Athens, once more. The austerity years left a generation with nothing to lose, and they have taken the Acropolis."
 INT_for_world_is_burning_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[GSR.GetNameDef]§!."
 INT_for_domino_effect:0 "Domino Effect"
 INT_for_domino_effect_desc:0 "One revolution makes the next one easier. Warsaw is the proof."
 INT_for_domino_effect_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[PPR.GetNameDef]§!."
 INT_for_internationalist_europe:0 "Internationalist Europe"
 INT_for_internationalist_europe_desc:0 "From the Channel to the Aegean, the councils of Europe answer to one International. The East is next."
 INT_for_leninist_network_ukraine:0 "Create a Leninist Network in Ukraine"
 INT_for_leninist_network_ukraine_desc:0 "Years of war have left Ukraine's industrial cities full of veterans with no love for Kyiv or Moscow. Cells are organized in the factories of the east."
 INT_for_red_ukrainian_resistance:0 "Support a Red Ukrainian Resistance"
 INT_for_red_ukrainian_resistance_desc:0 "The network stops talking and starts organizing strikes, occupations and, where needed, something more."
 INT_for_baltic_resistance:0 "Support the Baltic Resistance"
 INT_for_baltic_resistance_desc:0 "Tallinn, Riga and Vilnius have their own workers' movements, small but stubborn. The Internationale sends money, printers and organizers."
 INT_for_support_russian_leninists:0 "Support the Russian Leninists"
 INT_for_support_russian_leninists_desc:0 "The Russian comrades are few, hunted and badly armed. The first two problems cannot be fixed from Milan; the third can."
 INT_for_leninists_belarus:0 "Support the Leninists in Belarus"
 INT_for_leninists_belarus_desc:0 "Minsk still has its tractor plants and its disciplined workforce, and its workers have not forgotten how to strike."
 INT_for_prepare_soviets_revolution:0 "Prepare the Soviets for a Revolution"
 INT_for_prepare_soviets_revolution_desc:0 "Soviets are forming again in Petersburg and the Urals, in secret for now. When the moment comes, they will know what to do."
 INT_for_permanent_revolution_principle:0 "Principle of Permanent Revolution"
 INT_for_permanent_revolution_principle_desc:0 "A revolution that stops at its own borders dies there. The Internationale commits itself to carrying it further."
 INT_for_exporting_revolution:0 "Exporting the Revolution"
 INT_for_exporting_revolution_desc:0 "Paris, Madrid, Lisbon. The revolutions of the West get what they need from Milan, and Milan gets their loyalty."
 INT_for_exporting_revolution_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[CMU.GetNameDef]§!, §Y[FSR.GetNameDef]§!, §Y[SPA.GetNameDef]§! and §Y[PRS.GetNameDef]§!."
 INT_for_sister_republics:0 "They Are All Sister Republics"
 INT_for_sister_republics_desc:0 "There are no foreign revolutions, only sections of the same one. Berlin and London are brought under a single command."
 INT_for_sister_republics_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[GDR.GetNameDef]§!, §Y[SRB.GetNameDef]§! and §Y[ENG.GetNameDef]§!."
 INT_for_cascade_effect:0 "Cascade Effect"
 INT_for_cascade_effect_desc:0 "Every revolution that holds makes the next one inevitable. The Balkans and the North fall in line."
 INT_for_cascade_effect_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[YUG.GetNameDef]§! and §Y[SSR.GetNameDef]§!."
 INT_for_revolutionary_europe:0 "Revolutionary Europe"
 INT_for_revolutionary_europe_desc:0 "From Lisbon to Warsaw, one continent and one revolution. The last capitals of the old order are in the East."
 INT_for_revolutionary_europe_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[GSR.GetNameDef]§! and §Y[PPR.GetNameDef]§!."
 INT_for_revcom_russia:0 "Revolutionary Communists of Russia"
 INT_for_revcom_russia_desc:0 "Trotsky's heirs in Russia never stopped organizing. Now they have a sponsor."
 INT_for_revcom_ukraine:0 "Revolutionary Communists of Ukraine"
 INT_for_revcom_ukraine_desc:0 "Kharkiv and Dnipro were once red strongholds. The revolutionary communists of Ukraine are given the means to make them so again."
 INT_for_bring_revolution_russia:0 "Bring the Revolution Back to Russia"
 INT_for_bring_revolution_russia_desc:0 "The revolution was born in Petrograd and died in Moscow. It is time to take it home."
 INT_for_bring_leninism_russia:0 "Bring Leninism Back to Russia"
 INT_for_bring_leninism_russia_desc:0 "Ukraine, Belarus and the Baltic are ready, and the soviets are waiting. Lenin's country will have Leninism again, whether its rulers like it or not."
 INT_for_collapse_united_states:0 "Accelerate the Collapse of the United States"
 INT_for_collapse_united_states_desc:0 "The empire is rotting from within: debt, division and a working class that has stopped believing in it. The Internationale only has to help it along."
 INT_for_collapse_united_states_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[RCA.GetNameDef]§!."
 INT_for_revolution_to_us:0 "Exporting the Revolution to the US"
 INT_for_revolution_to_us_desc:0 "The permanent revolution does not stop at the Atlantic. The American comrades get money, organizers and the full backing of the International."
 INT_for_revolution_to_us_tt:0 "Each of the following becomes our §Ypuppet§! and a §Ymember state of the International§! if it exists, is independent and has a socialist government: §Y[RCA.GetNameDef]§!."
 INT_mil_military_decision_center:0 "Military Decision Center"
 INT_mil_military_decision_center_desc:0 "The militias won the civil war. Turning them into an army that can hold a border is a different job."
 INT_mil_red_army:0 "The Red Army"
 INT_mil_red_army_desc:0 "The brigades, the Red Guards and the internationalist volunteers are merged into a single Red Army of the Internationale."
 INT_mil_military_commissars:0 "Military Commissars"
 INT_mil_military_commissars_desc:0 "Many of the new army's officers served the old state. Every one of them gets a commissar at their side."
 INT_mil_reforming_military_corps:0 "Reforming the Military Corps"
 INT_mil_reforming_military_corps_desc:0 "The corps structure of the old army is torn up and rebuilt around what actually worked in the civil war."
 INT_mil_smart_military_manufacturing:0 "Smart Military Manufacturing"
 INT_mil_smart_military_manufacturing_desc:0 "Lines that switch from rifles to drones in a week, designed by the engineers who will use them."
 INT_mil_political_commissars:0 "Political Commissars"
 INT_mil_political_commissars_desc:0 "The commissars stop checking up on the officers and start educating the soldiers. Every unit knows what it is fighting for."
 INT_mil_trial_corrupt_traitors:0 "Trial of the Corrupt and Traitors"
 INT_mil_trial_corrupt_traitors_desc:0 "Quartermasters who sold fuel to the enemy and colonels who kept their old friends informed face a people's tribunal."
 INT_mil_peer_to_peer_production:0 "Peer-to-Peer Production"
 INT_mil_peer_to_peer_production_desc:0 "Open designs shared between every arms plant in the country. A fix found in Brescia is running in Bologna by the next shift."
 INT_mil_loyal_to_revolution:0 "Loyal to the Revolution"
 INT_mil_loyal_to_revolution_desc:0 "Purged, reorganized and politically reliable, the Red Army is ready to be more than a garrison."
 INT_mil_make_way_young:0 "Make Way for the Young"
 INT_mil_make_way_young_desc:0 "The commanders who proved themselves in the civil war are promoted over the heads of the old staff officers."
 INT_mil_workers_army:0 "The Workers' Army"
 INT_mil_workers_army_desc:0 "Every factory trains its own reserve company. The army and the working class become the same thing."
 INT_mil_cult_blitzkrieg:0 "The Cult of the Blitzkrieg"
 INT_mil_cult_blitzkrieg_desc:0 "Speed, concentration and surprise. The next war will be decided in its first weeks."
 INT_mil_red_airforce:0 "The Red Airforce"
 INT_mil_red_airforce_desc:0 "Pilots from the old air force and drone operators from the militias, under one command."
 INT_mil_red_navy:0 "The Red Navy"
 INT_mil_red_navy_desc:0 "The crews at La Spezia and Taranto have to be won over one ship at a time. The ones already on our side form the core of a new fleet."
 INT_mil_mechanized_army:0 "A Mechanized Army"
 INT_mil_mechanized_army_desc:0 "Trucks, armoured carriers and the drivers to go with them. The infantry will not walk to the next war."
 INT_mil_study_new_doctrines:0 "Study New Doctrines"
 INT_mil_study_new_doctrines_desc:0 "The staff college reads everything from Tukhachevsky to the drone war in Ukraine."
 INT_mil_red_academies:0 "The Red Academies"
 INT_mil_red_academies_desc:0 "Officer schools open to the sons and daughters of workers, teaching tactics alongside political economy."
 INT_mil_superiority_of_tanks:0 "Superiority of Tanks"
 INT_mil_superiority_of_tanks_desc:0 "Drones have not made the tank obsolete, only the badly used tank."
 INT_mil_electronic_warfare:0 "Electronic Warfare"
 INT_mil_electronic_warfare_desc:0 "Jammers, spoofers and signals intelligence. Modern battles are won in the spectrum first."
 INT_mil_quality_training:0 "Quality Training Programs"
 INT_mil_quality_training_desc:0 "Fewer parades and more live-fire exercises. Every soldier trains as if the war started tomorrow."
 INT_mil_overwhelming_superiority:0 "Overwhelming Superiority"
 INT_mil_overwhelming_superiority_desc:0 "More tanks, more guns and more shells than the enemy can count, at the exact point where it matters."
 INT_mil_workers_of_world_unite:0 "Workers of the World Unite"
 INT_mil_workers_of_world_unite_desc:0 "The Red Army of the Internationale is no longer an Italian army. It is the army of the working class, wherever it is."
 INT_mil_proletarian_military_industries:0 "Proletarian Military Industries"
 INT_mil_proletarian_military_industries_desc:0 "Beretta, Leonardo, Fincantieri and Iveco now belong to the people who work in them, and the people have a war to prepare for."
 INT_mil_national_academies_sciences:0 "National Academies of Sciences"
 INT_mil_national_academies_sciences_desc:0 "The universities of Milan, Turin and Bologna are organized into academies that work directly for the plan."
 INT_mil_total_industrial_mobilization:0 "Total Industrial Mobilization"
 INT_mil_total_industrial_mobilization_desc:0 "Every plant that can make something useful for the army will make it, starting this month."
 INT_mil_ultra_engineered_equipment:0 "Ultra-Engineered Equipment"
 INT_mil_ultra_engineered_equipment_desc:0 "Italian design was always good at making beautiful machines. The revolution wants them to be unbreakable as well."
 INT_mil_reindustrialization:0 "Reindustrialization"
 INT_mil_reindustrialization_desc:0 "The industrial districts that globalization emptied are filled again, this time with plants that cannot be moved abroad."
 INT_mil_optimize_production_lines:0 "Optimize Production Lines"
 INT_mil_optimize_production_lines_desc:0 "Time-and-motion studies, done by the workers themselves this time."
 INT_mil_tsunami_military_hardware:0 "A Tsunami of Military Hardware"
 INT_mil_tsunami_military_hardware_desc:0 "The first mobilization quotas are met ahead of schedule. The depots are filling faster than the army can empty them."
 INT_mil_centralize_military_structures:0 "Centralize Military Structures"
 INT_mil_centralize_military_structures_desc:0 "Army, navy, air force and war industry answer to one defence council in Milan."
 INT_mil_expand_red_navy:0 "Expand the Red Navy"
 INT_mil_expand_red_navy_desc:0 "The yards of Monfalcone and Livorno are turned over to warships."
 INT_mil_expand_aircraft_industry:0 "Expand the Aircraft Industry"
 INT_mil_expand_aircraft_industry_desc:0 "The aerospace plants around Turin and Varese are given priority on materials and engineers."
 INT_mil_expand_army:0 "Expand the Army"
 INT_mil_expand_army_desc:0 "New divisions need new recruits, new barracks and new depots."
 INT_mil_submarine_warfare:0 "Submarine Warfare"
 INT_mil_submarine_warfare_desc:0 "The Mediterranean is narrow and crowded. A fleet of submarines can close it to anyone we choose."
 INT_mil_increase_aircraft_production:0 "Increase Aircraft Production"
 INT_mil_increase_aircraft_production_desc:0 "Second and third shifts on every assembly line."
 INT_mil_start_motorizing:0 "Start Motorizing"
 INT_mil_start_motorizing_desc:0 "Iveco's lines stop building delivery vans and start building troop carriers."
 INT_mil_offensive_maritime_strategy:0 "Offensive Maritime Strategy"
 INT_mil_offensive_maritime_strategy_desc:0 "The fleet will not wait in port to be sunk. It goes looking for the enemy."
 INT_mil_automatic_aircraft_systems:0 "Automatic Aircraft Systems"
 INT_mil_automatic_aircraft_systems_desc:0 "Drones that fly in swarms and aircraft that fly themselves. Pilots are too valuable to lose."
 INT_mil_adaptable_red_army:0 "An Adaptable Red Army"
 INT_mil_adaptable_red_army_desc:0 "No doctrine survives contact with the enemy. The army trains to change its plans faster than the enemy can change theirs."
 INT_mil_oceangoing_navy:0 "An Oceangoing Navy"
 INT_mil_oceangoing_navy_desc:0 "The revolution has friends in Havana and Asmara. The navy must be able to reach them."
 INT_mil_reds_in_the_sky:0 "The Reds in the Sky"
 INT_mil_reds_in_the_sky_desc:0 "The red star over the Alps is painted on the wings of the Internationale's air force."
 INT_mil_glory_red_army:0 "The Glory of the Red Army"
 INT_mil_glory_red_army_desc:0 "Songs, films and monuments. The army that won the civil war becomes the pride of the new republic."
 INT_mil_red_tsunami:0 "A Red Tsunami"
 INT_mil_red_tsunami_desc:0 "The war industry is running at full capacity. When the Red Army moves, it will not run short of anything."
 INT_mil_revolution_above_all:0 "The Revolution Above All!"
 INT_mil_revolution_above_all_desc:0 "Not the nation, not the party, not the leader: the revolution."

 INT_socialized_economy:0 "Socialized Economy"
 INT_socialized_economy_desc:0 "Every plant is run by its own workers' council."
 INT_socialized_economy_2:0 "Planned Socialized Economy"
 INT_socialized_economy_2_desc:0 "The councils plan together, from the bottom up."
 INT_digital_marxism:0 "Digital Marxism"
 INT_digital_marxism_desc:0 "A planned economy computed in real time by the councils' network."
 INT_collectivized_economy:0 "Collectivized Economy"
 INT_collectivized_economy_desc:0 "Industry is held in common under a single plan."
 INT_collectivized_economy_2:0 "Collective Economic Outlook"
 INT_collectivized_economy_2_desc:0 "Expropriation is over; organized collective production has begun."
 INT_trotskyist_economy:0 "Arsenal of the Revolution"
 INT_trotskyist_economy_desc:0 "An economy built to supply a revolution that does not stop at the border."
 INT_work_coercion:0 "Work Coercion"
 INT_work_coercion_desc:0 "Labour is assigned by the state, and refusing is sabotage."
 INT_centralized_planning:0 "Centralized Economic Planning"
 INT_centralized_planning_desc:0 "One plan, one planning office, one set of figures."
 INT_cheka:0 "The Cheka"
 INT_cheka_desc:0 "The commission for the struggle against counter-revolution and sabotage."
 INT_agit_prop:0 "Agit-Prop"
 INT_agit_prop_desc:0 "Agitation and propaganda for the twenty-first century."
 INT_communism_or_barbarism:0 "Communism or Barbarism"
 INT_communism_or_barbarism_desc:0 "There is no third way."
 INT_council_state:0 "The State of the Councils"
 INT_council_state_desc:0 "Power flows up from the factory councils to the congress."
 INT_council_state_2:0 "All Power to the Councils"
 INT_council_state_2_desc:0 "There is no power in the country above the councils."
 INT_democratic_centralism:0 "Democratic Centralism"
 INT_democratic_centralism_desc:0 "Freedom of discussion, unity of action."
 INT_european_leninism:0 "European Leninism"
 INT_european_leninism_desc:0 "The councils, the party and the theory, carried across the continent."
 INT_party_of_factions:0 "A Party Full of Factions"
 INT_party_of_factions_desc:0 "Every current organizes openly inside the party."
 INT_city_soviets:0 "City Soviets"
 INT_city_soviets_desc:0 "Every city has its soviet, answerable to the revolutionary program."
 INT_militarized_unions:0 "Militarized Labour Unions"
 INT_militarized_unions_desc:0 "The unions are organized as production armies."
 INT_comrev_support:0 "Support for the World Revolution"
 INT_comrev_support_desc:0 "Money, weapons and volunteers for every revolutionary movement that asks."
 INT_trotskyism_young:0 "Trotskyism Is Young Once Again"
 INT_trotskyism_young_desc:0 "After eighty years in the back rooms, the movement has a country."
 INT_councils_international:0 "The Councils' International"
 INT_councils_international_desc:0 "An international of workers' councils, not of parties or governments."
 INT_internationalist_europe:0 "Internationalist Europe"
 INT_internationalist_europe_desc:0 "The councils of Europe answer to one International."
 INT_permanent_revolution:0 "Permanent Revolution"
 INT_permanent_revolution_desc:0 "A revolution that stops at its own borders dies there."
 INT_revolutionary_europe:0 "Revolutionary Europe"
 INT_revolutionary_europe_desc:0 "One continent, one revolution."
 INT_red_army:0 "The Red Army"
 INT_red_army_desc:0 "The militias of the civil war, merged into one army."
 INT_red_army_2:0 "The Red Army"
 INT_red_army_2_desc:0 "Purged, reorganized and loyal to the revolution."
 INT_red_army_3:0 "The Army of the World's Workers"
 INT_red_army_3_desc:0 "The army of the working class, wherever it is."
 INT_academies_of_sciences:0 "National Academies of Sciences"
 INT_academies_of_sciences_desc:0 "The universities work directly for the plan."
 INT_optimized_lines:0 "Optimized Production Lines"
 INT_optimized_lines_desc:0 "Time-and-motion studies, done by the workers themselves."
 INT_centralized_military:0 "Centralized Military Structures"
 INT_centralized_military_desc:0 "Every branch of the armed forces answers to one defence council."
 INT_revolution_above_all:0 "The Revolution Above All"
 INT_revolution_above_all_desc:0 "Not the nation, not the party, not the leader: the revolution."

 INT_revolutionary_contacts:0 "Revolutionary Contacts"
 INT_revolutionary_alliance:0 "Revolutionary Alliance"
 INT_denounced_by_the_internationale:0 "Denounced by the Internationale"
