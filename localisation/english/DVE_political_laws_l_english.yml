l_english:

 press_laws:0 "Press Law"

 # ==== DvE - Better Laws and Policies: economy, intermediate tiers ====
 light_economic_mobilisation:0 "Light Mobilization"
 light_economic_mobilisation_desc:0 "A first step past the peacetime economy: some factories shift to military orders, but daily life is barely disturbed."
 rising_economic_mobilisation:0 "Rising Mobilization"
 rising_economic_mobilisation_desc:0 "The war effort is now a visible part of national life, though still short of a real economic mobilization."
 advancing_economic_mobilisation:0 "Advancing Mobilization"
 advancing_economic_mobilisation_desc:0 "Industry is turning over to military production in earnest, and the population feels the difference."
 near_total_economic_mobilisation:0 "Near-Total Mobilization"
 near_total_economic_mobilisation_desc:0 "Almost every resource the nation has is spoken for. What total mobilization has not yet claimed, this has."

 # ==== DvE - Better Laws and Policies: trade, intermediate tiers ====
 managed_trade:0 "Managed Trade"
 managed_trade_desc:0 "Trade stays largely open, but the state keeps a closer eye on who benefits from it."
 restricted_trade:0 "Restricted Trade"
 restricted_trade_desc:0 "Exports are curtailed and foreign partners are chosen with some care."
 trade_embargo:0 "Trade Embargo"
 trade_embargo_desc:0 "Trade with the outside world has nearly stopped - what little continues is closely controlled."

 # ==== DvE - Better Laws and Policies: press & censorship ====
 free_press:0 "Free Press"
 free_press_desc:0 "Newspapers, broadcasters and now the internet answer to no one but their readers. What they publish is not always convenient - and it is not always kept from the enemy either."
 regulated_press:0 "Regulated Press"
 regulated_press_desc:0 "The press remains independent, but a handful of laws on sedition, incitement and national security draw the lines it may not cross."
 state_media:0 "State-Directed Media"
 state_media_desc:0 "The major outlets take their line from the government, gently but unmistakably. Dissenting voices still exist, on smaller stages."
 press_censorship:0 "Press Censorship"
 press_censorship_desc:0 "Publication requires approval, broadcasters read from an approved script, and awkward questions simply do not reach an audience."
 total_censorship:0 "Total Censorship"
 total_censorship_desc:0 "There is one truth, and it comes from one source. Foreign broadcasts are jammed, foreign journalists are not welcome, and everyone knows it."
