l_english:
 polandos.1.t:0 "A Polish Century"
 polandos.1.d:0 "Since regaining our independence from the USSR in 1989, Poland has never stopped growing! Even the global financial crisis of 2008 failed to slow our nation's remarkable progress. Our economy is experiencing an unprecedented boom, new industries are rising across the country, and millions of citizens are enjoying a higher standard of living than ever before. Strong border security, a well-funded military, and careful national planning have kept our homeland safe while many Western nations struggle with instability, mass migration, and political division. For the past three years, Ukraine has continued to resist the Russian invasion, and much of its endurance has been made possible thanks to Polish military, economic, and humanitarian support. The world is beginning to recognize Poland not only as a regional power, but as one of Europe's strongest defenders of freedom, sovereignty, and stability. Our people have overcome occupation, oppression, and countless hardships throughout history, yet we continue to stand stronger than ever before. Poland has not yet perished, as long as we still live! Long live the Republic, long live our people, and may our white and red banner never fall again!"
 polandos.2.t:0 "Polish Politics"
 polandos.2.d:0 "For more than two decades, Polish politics has remained trapped in a seemingly endless struggle between two dominant political forces. Election after election, power has shifted back and forth, yet the same familiar faces, the same arguments, and the same promises continue to define the country's future. Many citizens have begun to question whether democracy has become a genuine competition of ideas or merely a cycle in which the same political establishment endlessly replaces itself. Public debate has grown increasingly hostile, society has become deeply divided, and compromise has all but disappeared. Every major issue is transformed into another battle between rival camps, leaving little room for meaningful reforms or long-term planning. While supporters argue that their chosen party protects Poland from disaster, critics claim that both sides have become more focused on defeating each other than solving the nation's problems. Confidence in political institutions continues to decline as frustration spreads among voters who feel ignored by an establishment that has dominated Polish politics for years. With another election approaching, many wonder whether the country will once again choose between the same two rivals, or whether a new political force will finally break the cycle that has defined modern Poland for so long. The future of the Republic now hangs in the balance, and the next decision could determine whether Poland remains locked in this familiar political rivalry or begins a completely new chapter in its history."
 polandos.3.t:0 "choosing our side"
 polandos.3.d:0 "For more than two decades, Polish politics has been dominated by two rival parties PiS and PO, with PO later rebranding itself as the KO. Their long-standing political rivalry became so entrenched that many Poles began referring to it simply as "POPiS," symbolizing the endless struggle between the same two political forces. Now, as the presidential election on June 1st approaches, parties from across the political spectrum are preparing for one of the most important elections in modern Polish history. The nation stands at a crossroads, and millions of voters will soon decide the country's future. Perhaps this time, Poland will finally break the cycle of POPiS and choose a completely new political force to lead the nation into a new era."
 starting_poland.1.t:0 "Polish paths"
 starting_poland.1.d:0 "Hello, player! Poland has three playable paths!\n\nPiS Path - You can play the PiS path by selecting the first option in the "Choosing Our Side" event. After this, you will get the PiS focus tree, which will lead you to the presidential election, where you can elect Nawrocki as president and play his focus tree!\n\nKO Path - You can play the KO path by selecting the third option in the "Choosing Our Side" event. After this, you will get the KO focus tree, where you can elect Trzaskowski as president and play his focus tree!\n\nKonfederacja Path - In the "Choosing Our Side" event, select the second option. You will then get the Konfederacja focus tree and can select Mentzen as president!\n\nATTENTION! KONFEDERACJA HAS THE LEAST PLAYABLE CONTENT!"
 elections.1.t:0 "Elections begin!"
 elections.1.d:0 "today presidental elections of Poland..."
 polandos.4.t:0 "A promise"
 polandos.4.d:0 "Karol Nawrocki stepped in front of the cameras and began speaking to the entire Polish nation - Our country is the last strong and independent bastion of Europe! And we cannot lose it! We cannot allow Poland to become another victim of illegal immigration, economic stagnation, and the growing problems that have affected many Western European countries! For years, we have watched as governments across Europe have made decisions that weakened their own economies and societies, while ordinary people were left to deal with the consequences. Poland must choose a different path!\n\nThat is why I - no, every patriot, every Pole, and I must stand together and fight against the authoritarian government of the European Union, which continues to impose its foolish and unnecessary laws upon us! Poland is a sovereign nation, and our future must be decided by Poles themselves! We must defend our independence, our economy, our borders, and our right to determine our own future.\n\nWe have built a strong country through the hard work of generations of Poles, and we cannot simply allow that achievement to be taken away from us. We must strengthen our economy, protect Polish businesses, support our workers, and make sure that Poland remains a country where young people can build their future.\n\nAnd as for the Ukrainians, let them learn to respect us! Poland has provided enormous support, but friendship must work both ways. We expect respect for Poland, our history, and our people. We will not accept being treated as though our support is something that can simply be taken for granted.\n\nPoland has a choice before it. We can remain silent and allow others to decide our future, or we can stand together and defend our national interests. I believe every Polish patriot knows what choice we must make. Poland must stand strong, Poland must remain independent, and Poland must put the interests of its own people first!"
 polandos.5.t:0 "Polish Era"
 polandos.5.d:0 ""Poland, our nation has disappeared from the map many times throughout history, yet every time we have risen again. Our people have survived wars, occupations, hardships, and years in which Poland was erased from the map of Europe. Yet we are still here, and we are stronger because of everything we have endured.\n\nToday, we look toward the West and see countries struggling with illegal immigration, economic problems, and uncertainty about their future. But Poland has a different path ahead of us. We have the opportunity to remain independent, secure, and strong. We must not allow the mistakes of others to become our own.\n\nThat is why we must preserve a Poland that is strong, independent, and capable of deciding its own future. Our borders must be protected, our economy must continue to grow, and Polish families must be able to look toward the future with confidence. We must put Poland and the interests of the Polish people first.\n\nI promise you that I will work to keep Poland safe, independent, and prosperous no matter what challenges we face. We have survived difficult times before, and together we can overcome whatever comes next.\n\nPoland has always found a way to survive. Now it is our responsibility to make sure that the generations after us inherit a Poland that is even stronger than the one we received.\n\nKeep Poland strong. Keep Poland independent. Keep Poland safe.\n\nVote for me!\n\n- Karol Nawrocki""
 polandos.6.t:0 "propaganda on the Internet"
 polandos.6.d:0 "Taking advantage of the situation and what they describe as the foolish decisions of the European Union, PiS and Nawrocki begin creating an extensive propaganda campaign against the EU. However, this campaign does not appear on walls or buildings in the real world. Instead, it spreads across the internet, targeting social media, online communities, and younger generations.\n\nThe main goal of the campaign is to weaken support for the European Union among young people and convince them that Poland should have greater independence from European institutions. Political messages, graphics, videos, and provocative statements begin appearing across the internet, presenting the EU as an increasingly authoritarian organization that interferes with Poland's sovereignty.\n\nThe campaign quickly gains attention. Supporters share the messages across social media, while political activists attempt to reach thousands of young Poles. Every controversial decision made by the European Union becomes another opportunity for the campaign to gain visibility and attract new supporters.\n\nNawrocki and his supporters argue that Poland must not simply accept every decision coming from Brussels. They claim that Poland should defend its national interests while remaining strong, independent, and capable of determining its own future.\n\nThe campaign does not go unnoticed. Supporters of the European Union condemn it as political manipulation, while Nawrocki's supporters argue that they are simply presenting an alternative view of Poland's relationship with Europe. The debate quickly spreads across the internet, dividing public opinion and making the future of Poland's relationship with the European Union increasingly uncertain.\n\nFor PiS and Nawrocki, however, the objective is clear turn growing dissatisfaction with the European Union into political support and convince a new generation that Poland's future should be decided primarily in Warsaw, rather than in Brussels."
 polandos.7.t:0 "Showing truth"
 polandos.7.d:0 "PIS and Nawrocki have decided that an online propaganda campaign is no longer enough. Every scandal and every controversial decision made by the European Union must be brought to the attention of the Polish public. Their goal is clear: undermine support for the European Union across Poland while simultaneously increasing their own support ahead of the elections.\n\nThe campaign will focus heavily on highlighting unpopular EU policies, political controversies, economic disputes, and decisions that can be portrayed as harmful to Polish interests. Social media will be flooded with posts, videos, and commentary criticizing the European Union and its institutions.\n\nFor PIS and Nawrocki, this is more than simply an ideological campaign. Every controversy is another opportunity to convince voters that Poland needs to defend its national interests more aggressively within Europe. If successful, the campaign could significantly weaken public support for further European integration and strengthen their position in the upcoming elections."
 polandos.8.t:0 "The Final Debate"
 polandos.8.d:0 "The second round of the election is now very close, and it is only a matter of time before the results finally decide the future of Poland. These elections have the potential to change the entire Polish nation, and only three candidates remain. Who will emerge victorious? For now, nobody knows...\n\nOne thing, however, is certain: THESE ARE THE MOST IMPORTANT ELECTIONS POLAND HAS FACED IN THE ENTIRE 21ST CENTURY!\n\nThe campaign has reached its final stage. Every speech, every debate, and every decision could determine the direction Poland will take for years to come. Millions of citizens are preparing to cast their votes, while the three remaining candidates fight for every last supporter.\n\nWill Poland choose stability and continue its current path? Will it turn toward a completely new political direction? Or will an unexpected candidate rise to power and reshape the country from the ground up?\n\nThe answer will soon be known. Poland is waiting. The candidates are waiting. And now, the entire nation holds its breath... \n\nIts The Final COUNTDOWN!" 
 
 
 
 
 
 
 
 
 
 
 
 
