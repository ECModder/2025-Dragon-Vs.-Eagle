l_english:
 polandos.1.t:0 "A Polish Century"
 polandos.1.d:0 "Since regaining our independence from the USSR in 1989, Poland has never stopped growing! Even the global financial crisis of 2008 failed to slow our nation's remarkable progress. Our economy is experiencing an unprecedented boom, new industries are rising across the country, and millions of citizens are enjoying a higher standard of living than ever before. Strong border security, a well-funded military, and careful national planning have kept our homeland safe while many Western nations struggle with instability, mass migration, and political division. For the past three years, Ukraine has continued to resist the Russian invasion, and much of its endurance has been made possible thanks to Polish military, economic, and humanitarian support. The world is beginning to recognize Poland not only as a regional power, but as one of Europe's strongest defenders of freedom, sovereignty, and stability. Our people have overcome occupation, oppression, and countless hardships throughout history, yet we continue to stand stronger than ever before. Poland has not yet perished, as long as we still live! Long live the Republic, long live our people, and may our white and red banner never fall again!"
 polandos.2.t:0 "choosing our side"
 polandos.2.d:0 "For more than two decades, Polish politics has been dominated by two rival parties PiS and PO, with PO later rebranding itself as the KO. Their long-standing political rivalry became so entrenched that many Poles began referring to it simply as "POPiS," symbolizing the endless struggle between the same two political forces. Now, as the presidential election on June 1st approaches, parties from across the political spectrum are preparing for one of the most important elections in modern Polish history. The nation stands at a crossroads, and millions of voters will soon decide the country's future. Perhaps this time, Poland will finally break the cycle of POPiS and choose a completely new political force to lead the nation into a new era."
