PAL_partially_recognized_by_the_UN:0 "Partially Recognized by the United Nations"
PAL_partially_recognized_by_the_UN_desc:0 "We are currently an observer state in the United Nations, which makes diplomatic relations with other countries a much more difficult task."

PAL_the_question_of_isreali_settler:0 "The Question of Israeli Settlers"
PAL_the_question_of_isreali_settler_desc:0 "With the influx of illegally settled Israeli people into the West Bank, cases of aggressive and discriminatory practices are skyrocketing in the region."

PAL_not_fully_ours:0 "Not Fully Ours..."
PAL_not_fully_ours_desc:0 "After years of war, crisis and illegal settlement into the West Bank, the IDF controls most of our vast lands."

PAL_the_spirit_of_resistance:0 "The Spirit of the Resistance"
PAL_the_spirit_of_resistance_desc:0 "For decades, we have been fighting to preserve our culture, lands and identity. From the River to the Sea, Palestine will be free!"