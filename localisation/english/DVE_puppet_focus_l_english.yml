 SSR_all_power_committee_desc:0 "The question the Congress was called to settle, settled."
 SSR_statist_end:0 "The Republic as It Stands"
 SSR_statist_end_desc:0 "the Scandinavian Socialist Republic is administered by the people who were administering it last week, which the other three currents agree is the worst possible outcome and cannot agree on anything else."
 YUG_root:0 "Yugoslavia Reassembled"
 YUG_root_desc:0 "Six republics that spent thirty years insisting they were nations are being told, again, that they are one."
 YUG_rebuild_party:0 "Rebuild the Apparatus"
 YUG_rebuild_party_desc:0 "Cards, dues, cells and a membership list. Everything the Predsednistvo SFRJ does afterwards rests on that list existing."
 YUG_commanding_heights:0 "Nationalise the Commanding Heights"
 YUG_commanding_heights_desc:0 "Banks, steel, rail and power. The owners are compensated in a currency the new state prints itself."
 YUG_peoples_army:0 "Raise the People's Army"
 YUG_peoples_army_desc:0 "Conscripts, commissars, and whatever the old army left in its depots."
 YUG_first_congress:0 "The First Congress"
 YUG_first_congress_desc:0 "Delegates from every district of the Socialist Federal Republic of Yugoslavia. Three currents arrive, and by the second morning they have stopped speaking to each other in the corridors."
 YUG_internationalist:0 "KPJ"
 YUG_internationalist_desc:0 "§YKomunisticka Partija Jugoslavije§!\nThe Communist Party as it was before the split with Moscow: centralised, federal only on paper, and unembarrassed about either."
 YUG_democratic_centralism:0 "Democratic Centralism"
 YUG_democratic_centralism_desc:0 "Argue until the vote, then close ranks - and in six republics that is a great deal of arguing."
 YUG_cadre_formation:0 "The Formation of Cadres"
 YUG_cadre_formation_desc:0 "Cadres drawn deliberately from every republic, and posted deliberately to none of their own."
 YUG_all_power_soviets:0 "All Power to The Soviets"
 YUG_all_power_soviets_desc:0 "The question the Congress was called to settle, settled."
 YUG_internationalist_end:0 "The International Is the Party"
 YUG_internationalist_end_desc:0 "Yugoslavia stops being six republics that share a currency and becomes one party that shares six republics."
 YUG_revolutionary:0 "Samoupravljanje"
 YUG_revolutionary_desc:0 "§YPokret Radnickog Samoupravljanja§!\nWorkers' self-management: the one idea this country gave the movement that the movement could not get anywhere else. Its defenders point out that it was working right up until the country was not."
 YUG_factory_councils:0 "The Workers' Councils"
 YUG_factory_councils_desc:0 "The enterprise belongs to the people inside it, and answers to a council they elect."
 YUG_permanent_revolution:0 "Neither East Nor West"
 YUG_permanent_revolution_desc:0 "A road of one's own, taken again by people who remember where the first one ended."
 YUG_all_power_revolution:0 "All Power to The Revolution"
 YUG_all_power_revolution_desc:0 "The question the Congress was called to settle, settled."
 YUG_revolutionary_end:0 "A Revolution Without End"
 YUG_revolutionary_end_desc:0 "The Federation is administered from below, republic by republic and plant by plant, and dares the rest to call it a state."
 YUG_workerist:0 "SKJ"
 YUG_workerist_desc:0 "§YSavez Komunista Jugoslavije§!\nThe League of Communists: the only institution that ever held the six republics together, asking to be allowed to do it once more."
 YUG_cadre_school:0 "The Party School"
 YUG_cadre_school_desc:0 "Two years of theory and a placement in whichever republic is least likely to want you."
 YUG_the_politburo:0 "The Presidency"
 YUG_the_politburo_desc:0 "A rotating chair, and a very short conversation about whose turn it is."
 YUG_all_power_party:0 "All Power to The Party"
 YUG_all_power_party_desc:0 "The question the Congress was called to settle, settled."
 YUG_workerist_end:0 "A Party With a State"
 YUG_workerist_end_desc:0 "The Party does not run the Federation. The Federation is one of the things the Party runs."
 YUG_statist:0 "Predsednistvo"
 YUG_statist_desc:0 "§YPredsednistvo SFRJ§!\nThe current already in power. It did not call this Congress in order to be replaced by it, and it holds every ministry, every archive and every file the other three would need on their first morning."
 YUG_keep_the_files:0 "The Ministries Keep Their Files"
 YUG_keep_the_files_desc:0 "Continuity is not a programme, but it is the only thing in the building that is already working."
 YUG_no_second_congress:0 "No Second Congress"
 YUG_no_second_congress_desc:0 "One was enough. The delegates go home, and the ones who argue about it are helped to go home."
 YUG_all_power_committee:0 "All Power to The Committee"
 YUG_all_power_committee_desc:0 "The question the Congress was called to settle, settled."
 YUG_statist_end:0 "The Republic as It Stands"
 YUG_statist_end_desc:0 "the Socialist Federal Republic of Yugoslavia is administered by the people who were administering it last week, which the other three currents agree is the worst possible outcome and cannot agree on anything else."
