 PPR_revolutionary_desc:0 "§YRewolucyjna Partia Komunistyczna§!\nThe section of the Revolutionary Communist International. Where the internationalists prepare, it intervenes: strikes, campuses, the ranks of the army itself. It holds that a revolution which halts at its own border has already begun to die."
