 PPR_workerist_desc:0 "§YPolska Zjednoczona Partia Robotnicza§!\nThe historic party. It has ministries, archives, pensioners and a name that still means something to people who remember the last time. It would rather the Congress finished quickly and the KPP handed over the files."
