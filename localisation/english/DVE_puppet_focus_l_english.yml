 GSR_workerist_desc:0 "§YEllinikos Laikos Apeleftherotikos Stratos§!\nThe historic party. It has ministries, archives, pensioners and a name that still means something to people who remember the last time. It would rather the Congress finished quickly and the KKE handed over the files."
