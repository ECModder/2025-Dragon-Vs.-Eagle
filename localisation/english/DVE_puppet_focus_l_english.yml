l_english:
 # ==== DvE - alberi provvisori dei puppet socialisti ====
 GDR_root:0 "The German Democratic Republic"
 GDR_root_desc:0 "A German state built on the half of Germany that the other half spent eighty years calling temporary."
 GDR_rebuild_party:0 "Rebuild the Apparatus"
 GDR_rebuild_party_desc:0 "Cards, dues, cells and a membership list. Everything the Deutsche Kommunistische Partei does afterwards rests on that list existing."
 GDR_commanding_heights:0 "Nationalise the Commanding Heights"
 GDR_commanding_heights_desc:0 "Banks, steel, rail and power. The owners are compensated in a currency the new state prints itself."
 GDR_peoples_army:0 "Raise the People's Army"
 GDR_peoples_army_desc:0 "Conscripts, commissars, and whatever the old army left in its depots."
 GDR_first_congress:0 "The First Congress"
 GDR_first_congress_desc:0 "Delegates from every district of the German Democratic Republic. Three currents arrive, and by the second morning they have stopped speaking to each other in the corridors."
 GDR_internationalist:0 "Internationalismus(b)"
 GDR_internationalist_desc:0 "§YInternationalistische Kommunistische Partei (b)§!\nThe internationalist current. It does not contest elections and does not intend to: it runs study circles, prints a paper and builds cadres, on the principle that a party which is not ready is worse than no party at all. It regards the German Democratic Republic as one section of an organisation that is not german."
 GDR_democratic_centralism:0 "Democratic Centralism"
 GDR_democratic_centralism_desc:0 "Argue until the vote, then close ranks. The oldest discipline the current has, and the one it is least willing to relax."
 GDR_cadre_formation:0 "The Formation of Cadres"
 GDR_cadre_formation_desc:0 "Not recruitment - formation. A member who has not read is a member who will improvise, and improvisation is how the last attempt was lost."
 GDR_all_power_soviets:0 "All Power to The Soviets"
 GDR_all_power_soviets_desc:0 "The question the Congress was called to settle, settled."
 GDR_internationalist_end:0 "The International Is the Party"
 GDR_internationalist_end_desc:0 "the German Democratic Republic stops describing itself as a country with an international policy and starts describing itself as a section."
 GDR_revolutionary:0 "RKP"
 GDR_revolutionary_desc:0 "§YRevolutionäre Kommunistische Partei§!\nThe section of the Revolutionary Communist International. Where the internationalists prepare, it intervenes: strikes, campuses, the ranks of the army itself. It holds that a revolution which halts at its own border has already begun to die."
 GDR_factory_councils:0 "The Factory Councils"
 GDR_factory_councils_desc:0 "Power exercised where it was seized, by the people who seized it."
 GDR_permanent_revolution:0 "Permanent Revolution"
 GDR_permanent_revolution_desc:0 "A revolution that settles down has not won. It has been defeated by comfort."
 GDR_all_power_revolution:0 "All Power to The Revolution"
 GDR_all_power_revolution_desc:0 "The question the Congress was called to settle, settled."
 GDR_revolutionary_end:0 "A Revolution Without End"
 GDR_revolutionary_end_desc:0 "Borders, ministries and quiet evenings are all declared provisional, and stay that way."
 GDR_workerist:0 "SED"
 GDR_workerist_desc:0 "§YSozialistische Einheitspartei Deutschlands§!\nThe party that governed the East for forty years, watching the republic be administered by the party that spent those same forty years in opposition in the West. The SED's veterans have a word for this, and it is not reunification."
 GDR_cadre_school:0 "The Party School"
 GDR_cadre_school_desc:0 "Two years of theory and a placement in whichever ministry needs a reliable signature."
 GDR_the_politburo:0 "The Politburo"
 GDR_the_politburo_desc:0 "Eleven people in one room. The minutes are not circulated."
 GDR_all_power_party:0 "All Power to The Party"
 GDR_all_power_party_desc:0 "The question the Congress was called to settle, settled."
 GDR_workerist_end:0 "A Party With a State"
 GDR_workerist_end_desc:0 "The Party does not run the state. The state is one of the things the Party runs."
 GDR_statist:0 "DKP"
 GDR_statist_desc:0 "§YDeutsche Kommunistische Partei§!\nThe current already in power. It did not call this Congress in order to be replaced by it, and it holds every ministry, every archive and every file the other three would need on their first morning."
 GDR_keep_the_files:0 "The Ministries Keep Their Files"
 GDR_keep_the_files_desc:0 "Continuity is not a programme, but it is the only thing in the building that is already working."
 GDR_no_second_congress:0 "No Second Congress"
 GDR_no_second_congress_desc:0 "One was enough. The delegates go home, and the ones who argue about it are helped to go home."
 GDR_all_power_committee:0 "All Power to The Committee"
 GDR_all_power_committee_desc:0 "The question the Congress was called to settle, settled."
 GDR_statist_end:0 "The Republic as It Stands"
 GDR_statist_end_desc:0 "the German Democratic Republic is administered by the people who were administering it last week, which the other three currents agree is the worst possible outcome and cannot agree on anything else."
 PPR_root:0 "The People's Republic Restored"
 PPR_root_desc:0 "Poland has been rebuilt from outside more than once. This time the builders speak Polish, which the apparatus considers the important detail."
 PPR_rebuild_party:0 "Rebuild the Apparatus"
 PPR_rebuild_party_desc:0 "Cards, dues, cells and a membership list. Everything the Komunistyczna Partia Polski does afterwards rests on that list existing."
 PPR_commanding_heights:0 "Nationalise the Commanding Heights"
