 PRS_permanent_revolution:0 "Permanent Revolution"
 PRS_permanent_revolution_desc:0 "A revolution that settles down has not won. It has been defeated by comfort."
 PRS_all_power_revolution:0 "All Power to The Revolution"
 PRS_all_power_revolution_desc:0 "The question the Congress was called to settle, settled."
 PRS_revolutionary_end:0 "A Revolution Without End"
 PRS_revolutionary_end_desc:0 "Borders, ministries and quiet evenings are all declared provisional, and stay that way."
 PRS_workerist:0 "PCP"
 PRS_workerist_desc:0 "§YPartido Comunista Portugues§!\nThe historic party. It has ministries, archives, pensioners and a name that still means something to people who remember the last time. It would rather the Congress finished quickly and the Comite Central handed over the files."
 PRS_cadre_school:0 "The Party School"
 PRS_cadre_school_desc:0 "Two years of theory and a placement in whichever ministry needs a reliable signature."
 PRS_the_politburo:0 "The Politburo"
 PRS_the_politburo_desc:0 "Eleven people in one room. The minutes are not circulated."
 PRS_all_power_party:0 "All Power to The Party"
 PRS_all_power_party_desc:0 "The question the Congress was called to settle, settled."
 PRS_workerist_end:0 "A Party With a State"
 PRS_workerist_end_desc:0 "The Party does not run the state. The state is one of the things the Party runs."
 PRS_statist:0 "Comite Central"
 PRS_statist_desc:0 "§YComite Central do PCP§!\nThe current already in power. It did not call this Congress in order to be replaced by it, and it holds every ministry, every archive and every file the other three would need on their first morning."
 PRS_keep_the_files:0 "The Ministries Keep Their Files"
 PRS_keep_the_files_desc:0 "Continuity is not a programme, but it is the only thing in the building that is already working."
 PRS_no_second_congress:0 "No Second Congress"
 PRS_no_second_congress_desc:0 "One was enough. The delegates go home, and the ones who argue about it are helped to go home."
 PRS_all_power_committee:0 "All Power to The Committee"
 PRS_all_power_committee_desc:0 "The question the Congress was called to settle, settled."
 PRS_statist_end:0 "The Republic as It Stands"
 PRS_statist_end_desc:0 "the Portuguese Socialist Republic is administered by the people who were administering it last week, which the other three currents agree is the worst possible outcome and cannot agree on anything else."
 GSR_root:0 "The Greek Socialist Republic"
 GSR_root_desc:0 "The civil war that ended in 1949 has been reopened, and the side that lost it holds the ministries."
 GSR_rebuild_party:0 "Rebuild the Apparatus"
 GSR_rebuild_party_desc:0 "Cards, dues, cells and a membership list. Everything the Kommounistiko Komma Elladas does afterwards rests on that list existing."
 GSR_commanding_heights:0 "Nationalise the Commanding Heights"
 GSR_commanding_heights_desc:0 "Banks, steel, rail and power. The owners are compensated in a currency the new state prints itself."
 GSR_peoples_army:0 "Raise the People's Army"
 GSR_peoples_army_desc:0 "Conscripts, commissars, and whatever the old army left in its depots."
 GSR_first_congress:0 "The First Congress"
 GSR_first_congress_desc:0 "Delegates from every district of the Greek Socialist Republic. Three currents arrive, and by the second morning they have stopped speaking to each other in the corridors."
 GSR_internationalist:0 "D-KA"
 GSR_internationalist_desc:0 "§YDiethnismós - Kommounistikós Agónas§!\nThe internationalist current. It does not contest elections and does not intend to: it runs study circles, prints a paper and builds cadres, on the principle that a party which is not ready is worse than no party at all. It regards the Greek Socialist Republic as one section of an organisation that is not greek."
 GSR_democratic_centralism:0 "Democratic Centralism"
 GSR_democratic_centralism_desc:0 "Argue until the vote, then close ranks. The oldest discipline the current has, and the one it is least willing to relax."
 GSR_cadre_formation:0 "The Formation of Cadres"
 GSR_cadre_formation_desc:0 "Not recruitment - formation. A member who has not read is a member who will improvise, and improvisation is how the last attempt was lost."
 GSR_all_power_soviets:0 "All Power to The Soviets"
 GSR_all_power_soviets_desc:0 "The question the Congress was called to settle, settled."
 GSR_internationalist_end:0 "The International Is the Party"
 GSR_internationalist_end_desc:0 "the Greek Socialist Republic stops describing itself as a country with an international policy and starts describing itself as a section."
 GSR_revolutionary:0 "EKK"
 GSR_revolutionary_desc:0 "§YEpanastatikó Kommounistikó Kómma§!\nThe section of the Revolutionary Communist International. Where the internationalists prepare, it intervenes: strikes, campuses, the ranks of the army itself. It holds that a revolution which halts at its own border has already begun to die."
 GSR_factory_councils:0 "The Factory Councils"
 GSR_factory_councils_desc:0 "Power exercised where it was seized, by the people who seized it."
 GSR_permanent_revolution:0 "Permanent Revolution"
 GSR_permanent_revolution_desc:0 "A revolution that settles down has not won. It has been defeated by comfort."
 GSR_all_power_revolution:0 "All Power to The Revolution"
 GSR_all_power_revolution_desc:0 "The question the Congress was called to settle, settled."
 GSR_revolutionary_end:0 "A Revolution Without End"
 GSR_revolutionary_end_desc:0 "Borders, ministries and quiet evenings are all declared provisional, and stay that way."
