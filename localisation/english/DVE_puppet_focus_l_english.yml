 GSR_all_power_committee_desc:0 "The question the Congress was called to settle, settled."
 GSR_statist_end:0 "The Republic as It Stands"
 GSR_statist_end_desc:0 "the Greek Socialist Republic is administered by the people who were administering it last week, which the other three currents agree is the worst possible outcome and cannot agree on anything else."
 SSR_root:0 "The Scandinavian Socialist Republic"
 SSR_root_desc:0 "Three kingdoms and a republic have agreed to be one republic. The agreement was not unanimous and is not being revisited."
 SSR_rebuild_party:0 "Rebuild the Apparatus"
 SSR_rebuild_party_desc:0 "Cards, dues, cells and a membership list. Everything the Nordiska Folkkommissariatet does afterwards rests on that list existing."
 SSR_commanding_heights:0 "Nationalise the Commanding Heights"
 SSR_commanding_heights_desc:0 "Banks, steel, rail and power. The owners are compensated in a currency the new state prints itself."
 SSR_peoples_army:0 "Raise the People's Army"
 SSR_peoples_army_desc:0 "Conscripts, commissars, and whatever the old army left in its depots."
 SSR_first_congress:0 "The First Congress"
 SSR_first_congress_desc:0 "Delegates from every district of the Scandinavian Socialist Republic. Three currents arrive, and by the second morning they have stopped speaking to each other in the corridors."
 SSR_internationalist:0 "Nordiska Bolsjeviker"
 SSR_internationalist_desc:0 "§YNordiska Bolsjevikiska Forbundet§!\nThe Nordic Bolsheviks: a small, deliberately unfashionable current that holds the Scandinavian labour movement was ruined by a century of getting most of what it asked for."
 SSR_democratic_centralism:0 "Democratic Centralism"
 SSR_democratic_centralism_desc:0 "Argue until the vote, then close ranks - a habit the Nordic left lost somewhere around 1938."
 SSR_cadre_formation:0 "The Formation of Cadres"
 SSR_cadre_formation_desc:0 "Reading groups in three languages, and an insistence that consensus is not the same thing as agreement."
 SSR_all_power_soviets:0 "All Power to The Soviets"
 SSR_all_power_soviets_desc:0 "The question the Congress was called to settle, settled."
 SSR_internationalist_end:0 "The International Is the Party"
 SSR_internationalist_end_desc:0 "The Republic stops calling itself a model and starts calling itself a section."
 SSR_revolutionary:0 "SAC"
 SSR_revolutionary_desc:0 "§YSveriges Arbetares Centralorganisation§!\nThe syndicalist current, older than every party in the hall. It never accepted that the union should take orders from the party, and the arrangement has not improved its mood."
 SSR_factory_councils:0 "The Factory Councils"
 SSR_factory_councils_desc:0 "Power exercised where it was seized, by the people who seized it."
 SSR_permanent_revolution:0 "One Big Union"
 SSR_permanent_revolution_desc:0 "Not a party with a union attached. A union that has no further use for parties."
 SSR_all_power_revolution:0 "All Power to The Revolution"
 SSR_all_power_revolution_desc:0 "The question the Congress was called to settle, settled."
 SSR_revolutionary_end:0 "A Revolution Without End"
 SSR_revolutionary_end_desc:0 "The Republic is administered by its unions, which is either the point of the whole thing or the end of it, depending who is asked."
 SSR_workerist:0 "SKP"
 SSR_workerist_desc:0 "§YSveriges Kommunistiska Parti§!\nThe historic party, and the only current in the hall with people who have actually run a ministry."
 SSR_cadre_school:0 "The Party School"
 SSR_cadre_school_desc:0 "Two years of theory and a placement wherever a reliable signature is needed."
 SSR_the_politburo:0 "The Politburo"
 SSR_the_politburo_desc:0 "Eleven people in one room. The minutes are not circulated."
 SSR_all_power_party:0 "All Power to The Party"
 SSR_all_power_party_desc:0 "The question the Congress was called to settle, settled."
 SSR_workerist_end:0 "A Party With a State"
 SSR_workerist_end_desc:0 "The Party does not run the state. The state is one of the things the Party runs."
 SSR_statist:0 "Folkkommissariatet"
 SSR_statist_desc:0 "§YNordiska Folkkommissariatet§!\nThe current already in power. It did not call this Congress in order to be replaced by it, and it holds every ministry, every archive and every file the other three would need on their first morning."
 SSR_keep_the_files:0 "The Ministries Keep Their Files"
 SSR_keep_the_files_desc:0 "Continuity is not a programme, but it is the only thing in the building that is already working."
