 leb.30.t:0 "Samir Geagea Wins the Elections!"
 leb.30.d:0 "In a historic political shift, Lebanese Forces leader Samir Geagea has secured the presidency, immediately pledging to fully disarm Hezbollah and restore absolute state sovereignty. This victory cements a staunchly anti-Iran, West-leaning leadership at the Baabda Palace, breaking years of political deadlock and shifting the balance of power in the Levant. Western allies have welcomed the outcome, viewing Geagea's ascension as a critical opportunity to enforce border control and integrate Lebanon into regional stability frameworks. However, the election has triggered immediate, volatile resistance from the Axis of Resistance, pushing the country to the brink of a massive domestic security crisis. As the military begins executing aggressive search-and-arrest operations, the capital prepares for either total institutional reform or an outright civil war."
 leb.30.a:0 "HURRAH!"
 leb.31.t:0 "The Assassination of Samir Geagea"
 leb.31.d:0 "'Your Lebanon is a political knot, a local dilemma that time endeavors to untie. My Lebanon is a chain of mountains rising respectfully and majestically towards the blue sky.' - Gibran Khalil Gibran"
 leb.31.a:0 "Tensions rise even further..."
 leb.40.t:0 "The Holy Land Defiled!"
 leb.40.d:0 "'I am not a man to be bribed by gold... for I hold Jerusalem to be greater than the whole world.' - Saladin, 1187"
 leb.40.a:0 "A new era?..."
