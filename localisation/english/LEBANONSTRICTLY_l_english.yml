 leb.22.t:0 "A Conflict Between Hezbollah and the Army Escalates"
 leb.22.d:0 "Faint gunshots and screaming echoed across Beirut's southern Metropolitan area today, as violent clashes erupted between residents and the military. The chaos broke out when citizens fiercely resisted a sweeping army operation to forcefully search apartment complexes and arrest individuals suspected of Hezbollah affiliation, transforming the residential dragnet into a volatile urban battleground."
 leb.22.a:0 "Could this lead to a civil war..."
