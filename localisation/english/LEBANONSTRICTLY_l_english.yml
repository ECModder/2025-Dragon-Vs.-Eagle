 leb.20.t:0 "The Last Crate"
 leb.20.d:0 "They brought the last of it down from the Bekaa on a Tuesday, in the rain. Eleven army trucks, a list in triplicate, and a young lieutenant from Zahle who kept wiping his glasses because nobody had thought to give him an umbrella.\n\nIn the village square an old man named Abu Hassan watched them load the crates. His eldest son went south with those rifles in 2006 and never came home. He keeps the photograph in his coat pocket, the corners gone soft. When the lieutenant reached him, neither of them knew what to say, so the old man offered him coffee, and the lieutenant, who had been told to accept nothing from anyone, drank it.\n\nFor forty years a second flag flew over these hills. It buried people's children and it fed their neighbours. Half the country will tell you it ruined Lebanon and the other half will tell you it saved it, and often they are sitting at the same table.\n\nTonight the yellow banners are coming down along the airport road. Some people are honking their horns. Some have closed their shutters. In Dahiyeh a woman is folding one and putting it away with the winter blankets, because you don't throw out something that cost you that much.\n\nThe lieutenant signed the last page at ten past nine and the convoy pulled out for Beirut. Abu Hassan stayed in the square a while longer, in the rain, holding the empty cup.\n\n§YGoodbye, Dear Hezbollah.§!"
 leb.20.a:0 "Inshallah, this one lasts."
