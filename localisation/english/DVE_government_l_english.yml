 DVE_gov_confirm:0 "Form the Government"
 DVE_gov_confirm_desc:0 "The coalition currently holds [?DVE_gov_majority|0]% of the vote. It needs more than 50% to govern."
 DVE_gov_abandon:0 "The Talks Collapse: New Elections"
 DVE_gov_abandon_desc:0 "No majority can be found. The mandate is returned and the country votes again."
 DVE_gov_random_election_tt:0 "Every party receives a new, random share of the vote. The Ultranationalists get no more than 4%."
