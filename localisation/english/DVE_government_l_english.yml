 DVE_gov_invite_liberal:0 "Invite the Liberals into the Coalition"
 DVE_gov_invite_liberal_desc:0 "Bring the Liberals and their votes into the new majority. They will not sit in a coalition with the Totalitarian Socialists or the Reactionaries."
