 DVE_gov_new_elections:0 "Call New Elections"
 DVE_gov_new_elections_desc:0 "No party that could lead a government has reached 20% of the vote. The only way out is a new vote."
 DVE_gov_invite_totalitarian_socialism:0 "Invite the Totalitarian Socialists into the Coalition"
 DVE_gov_invite_totalitarian_socialism_desc:0 "Bring the Totalitarian Socialists and their votes into the new majority. They will not sit in a coalition with the Liberals."
