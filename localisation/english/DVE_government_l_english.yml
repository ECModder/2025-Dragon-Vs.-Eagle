l_english:
 DVE_government_category:0 "Government"
 DVE_government_category_desc:0 "Dissolve the government and form a new one. Only a party with at least 20% of the vote can be tasked with it, and it needs more than 50% together with its coalition partners. If nobody reaches 20%, or the coalition falls apart, the country goes back to the polls."
 DVE_gov_dissolve:0 "Dissolve the Government"
 DVE_gov_dissolve_desc:0 "The cabinet resigns and parliament has to find a new majority. The outgoing government stays on as caretaker until then."
 DVE_gov_form_totalitarian_socialism:0 "Task the Totalitarian Socialists with Forming a Government"
 DVE_gov_form_totalitarian_socialism_desc:0 "The Totalitarian Socialists have at least 20% of the vote. Their leader gets the mandate to look for partners and a majority."
 DVE_gov_form_authoritarian_socialism:0 "Task the Authoritarian Socialists with Forming a Government"
 DVE_gov_form_authoritarian_socialism_desc:0 "The Authoritarian Socialists have at least 20% of the vote. Their leader gets the mandate to look for partners and a majority."
