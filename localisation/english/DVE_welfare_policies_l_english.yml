l_english:

 # ==== DvE - Better Laws and Policies: the row and its six groups ====
 welfare_policies:0 "Welfare & Jurisdiction"
 welfare:0 "Welfare"
 corruption:0 "Corruption"
 workers_conditions:0 "Worker's Conditions"
 labour_union:0 "Labour Union"
 civic_jurisdiction:0 "Civic Jurisdiction"
 military_jurisdiction:0 "Military Jurisdiction"

 # ==== Welfare ====
 minimal_welfare:0 "Minimal Welfare"
 minimal_welfare_desc:0 "Whoever falls, falls on their own family, their own savings, or nothing at all. The treasury keeps what it would otherwise have spent."
 basic_welfare:0 "Basic Welfare"
 basic_welfare_desc:0 "A safety net exists, thin as it is, and enough people fall through it that everyone knows someone who has."
 mediocre_welfare:0 "Mediocre Welfare"
 mediocre_welfare_desc:0 "The net is wider now, though nobody would call it comfortable to land in."
 standard_welfare:0 "Standard Welfare"
 standard_welfare_desc:0 "Illness, old age and job loss are cushioned, not solved. Most people call this normal, because for most people's lifetimes, it has been."
 generous_welfare:0 "Generous Welfare"
 generous_welfare_desc:0 "The state absorbs a good deal of what used to be private catastrophe. Somebody, somewhere, is always arguing this costs too much."
 extensive_welfare:0 "Extensive Welfare"
 extensive_welfare_desc:0 "Healthcare, housing, unemployment, old age - the list of things the state has decided are not to be left to chance keeps growing."
 full_welfare_state:0 "Full Welfare State"
 full_welfare_state_desc:0 "From the cradle to the grave, and the state means it literally. Nobody in the country can name a need it does not claim to cover."

 # ==== Corruption ====
 kleptocracy:0 "Kleptocracy"
 kleptocracy_desc:0 "The treasury and the ruling family's accounts stopped being different things some years ago, and nobody in power has any interest in telling them apart again."
 institutionalized_corruption:0 "Institutionalized Corruption"
 institutionalized_corruption_desc:0 "Every ministry has a price, and every price is common knowledge. It isn't hidden - it's simply how the paperwork moves."
 systemic_corruption:0 "Systemic Corruption"
 systemic_corruption_desc:0 "A contract without a favour attached is the unusual case, not the rule, across most of the state's dealings."
 rampant_corruption:0 "Rampant Corruption"
 rampant_corruption_desc:0 "Enough officials take a cut that everyone budgets for it, without it yet being the point of holding office."
 sectoral_corruption:0 "Sectoral Corruption"
 sectoral_corruption_desc:0 "Some ministries are clean, some are not, and everyone in the country could tell you which is which."
 sporadic_corruption:0 "Sporadic Corruption"
 sporadic_corruption_desc:0 "It happens. It gets noticed when it does, and often enough it gets punished."
 absolute_transparency:0 "Absolute Transparency"
 absolute_transparency_desc:0 "Every contract, every expense, every decision a ministry makes is published before it is acted on. Governing this way is slower. It is also very hard to hide anything in."

 # ==== Worker's Conditions ====
 twelve_hour_workday:0 "Twelve-Hour Workday"
 twelve_hour_workday_desc:0 "The shift is long enough that the walk home happens in the dark on both ends of it."
 ten_hour_workday:0 "Ten-Hour Workday"
 ten_hour_workday_desc:0 "Long, but survivable, and the law at least admits there is supposed to be an end to it."
 eight_hour_workday:0 "Eight-Hour Workday"
 eight_hour_workday_desc:0 "Eight hours of labour, eight of rest, eight for whatever a person does with a life outside the factory."
 six_hour_workday:0 "Six-Hour Workday"
 six_hour_workday_desc:0 "Shorter shifts than anyone thought industry could survive, and industry survived them."

 # ==== Labour Union ====
 unions_banned:0 "Unions Banned"
 unions_banned_desc:0 "Organised labour is organised sedition, as far as the law is concerned, and the law says so plainly."
 unions_tolerated:0 "Unions Tolerated"
 unions_tolerated_desc:0 "Unions exist, are watched, and are not encouraged. Nobody promises they will exist next year."
 unions_allowed:0 "Unions Allowed"
 unions_allowed_desc:0 "The union sits across the table from management as a matter of right, not permission."
 state_labour_unions:0 "State Labour Unions"
 state_labour_unions_desc:0 "One union, chartered by the state, speaking for every worker whether they asked it to or not."
 workers_labour_union:0 "Workers' Labour Union"
 workers_labour_union_desc:0 "The union does not sit across the table from management. In most workplaces that now worth mentioning, there is no longer a separate management to sit across from."

 # ==== Civic Jurisdiction ====
 formal_justice:0 "Formal Justice"
 formal_justice_desc:0 "The process is followed to the letter, which is not always the same thing as the outcome being just."
 ordinary_justice:0 "Ordinary Justice"
 ordinary_justice_desc:0 "The law is applied about as evenly as laws ever are, which is to say imperfectly, but recognisably."
 strict_justice:0 "Strict Justice"
 strict_justice_desc:0 "The courts move quickly, the sentences move quicker, and the state's patience for ambiguity is thin."
 equal_justice:0 "Equal Justice"
 equal_justice_desc:0 "The same law reaches the minister's son and the docker's, in the same court, on the same terms. It took a long time to make that true."

 # ==== Military Jurisdiction ====
 forbearing_discipline:0 "Forbearing Discipline"
 forbearing_discipline_desc:0 "Officers are trusted to run their units as they see fit, and mostly they do, and mostly that is fine."
 codified_discipline:0 "Codified Discipline"
 codified_discipline_desc:0 "Regulations exist, are read at least once, and are enforced when someone is watching."
 draconian_discipline:0 "Draconian Discipline"
 draconian_discipline_desc:0 "The code of conduct is not a suggestion, and the officers who forget that find out quickly that it isn't."
 strict_discipline:0 "Strict Discipline"
 strict_discipline_desc:0 "Punishment is swift, uniform, and handed out without much interest in circumstances."
 iron_fist:0 "Iron Fist"
 iron_fist_desc:0 "Discipline enforced by example, and the examples are made publicly. The army that results is very obedient, and not universally loved."
