l_english:

 # ==== DvE - Better Laws and Policies: the row and its six groups ====
 welfare_policies:0 "Welfare & Jurisdiction"
 welfare:0 "Welfare"
 workers_conditions:0 "Worker's Conditions"
 working_hours:0 "Working Hours"
 labour_union:0 "Labour Union"
 civic_jurisdiction:0 "Civic Jurisdiction"
 military_jurisdiction:0 "Military Jurisdiction"

 # ==== Welfare ====
 minimal_welfare:0 "Minimal Welfare"
 minimal_welfare_desc:0 "Whoever falls, falls on their own family, their own savings, or nothing at all. The treasury keeps what it would otherwise have spent."
 basic_welfare:0 "Basic Welfare"
 basic_welfare_desc:0 "A safety net exists, thin as it is, and enough people fall through it that everyone knows someone who has."
 generous_welfare:0 "Generous Welfare"
 generous_welfare_desc:0 "Illness, old age and unemployment stop being private catastrophes. Somebody, somewhere, is always arguing this costs too much."

 # ==== Worker's Conditions ====
 unregulated_conditions:0 "Unregulated Conditions"
 unregulated_conditions_desc:0 "Whatever the factory floor is like, that is between the worker and the foreman. No inspector is coming."
 basic_safety_standards:0 "Basic Safety Standards"
 basic_safety_standards_desc:0 "Somewhere there is a rulebook, and every so often somebody checks that it is being followed."
 strict_safety_standards:0 "Strict Safety Standards"
 strict_safety_standards_desc:0 "Inspectors, quotas, and a paper trail for every accident that does not happen. It is slower. It is also survivable."

 # ==== Working Hours ====
 long_hours:0 "Long Hours"
 long_hours_desc:0 "The shift ends when the work does, and the work rarely does early."
 standard_hours:0 "Standard Hours"
 standard_hours_desc:0 "A working day with an understood beginning and an understood end, honoured more often than not."
 eight_hour_workday:0 "Eight-Hour Workday"
 eight_hour_workday_desc:0 "Eight hours of labour, eight of rest, eight for whatever a person does with a life outside the factory. It took a very long fight to get here."

 # ==== Labour Union ====
 unions_banned:0 "Unions Banned"
 unions_banned_desc:0 "Organised labour is organised sedition, as far as the law is concerned, and the law says so plainly."
 unions_tolerated:0 "Unions Tolerated"
 unions_tolerated_desc:0 "Unions exist, are watched, and are not encouraged. Nobody promises they will exist next year."
 unions_allowed:0 "Unions Allowed"
 unions_allowed_desc:0 "The union sits across the table from management as a matter of right, not permission."

 # ==== Civic Jurisdiction ====
 lenient_justice:0 "Lenient Justice"
 lenient_justice_desc:0 "The courts assume good faith until proven otherwise, and proving otherwise takes some doing."
 standard_justice:0 "Standard Justice"
 standard_justice_desc:0 "The law is applied about as evenly as laws ever are, which is to say imperfectly, but recognisably."
 strict_justice:0 "Strict Justice"
 strict_justice_desc:0 "The courts move quickly, the sentences move quicker, and the state's patience for ambiguity is thin."

 # ==== Military Jurisdiction ====
 lax_discipline:0 "Lax Discipline"
 lax_discipline_desc:0 "Officers are trusted to run their units as they see fit, and mostly they do, and mostly that is fine."
 standard_discipline:0 "Standard Discipline"
 standard_discipline_desc:0 "Regulations exist, are read at least once, and are enforced when someone is watching."
 strict_discipline:0 "Strict Discipline"
 strict_discipline_desc:0 "The code of conduct is not a suggestion, and the officers who forget that find out quickly that it isn't."
