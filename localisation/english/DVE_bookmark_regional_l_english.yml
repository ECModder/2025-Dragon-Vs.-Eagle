l_english:
 DVE_BOOKMARK_2025_REGIONAL_NAME:0 "2025 - The Regional Powers"
 DVE_BOOKMARK_2025_REGIONAL_DESC:0 "The same world, seen from somewhere other than Washington or Beijing. Eight states with the means to decide their own region and the ambition to try, at the moment the old order stops holding."
 DVE_JAP_BOOKMARK_DESC:0 "Eighty years of a constitution written by someone else, and a navy that has quietly become the second best in Asia. Tokyo has begun saying out loud what it used to say only in white papers."
 DVE_RAJ_BOOKMARK_DESC:0 "The largest country on earth, with an economy climbing and a border that has never been agreed. India buys from everyone, promises nothing, and expects to be treated as a pole rather than a partner."
 DVE_TUR_BOOKMARK_DESC:0 "Astride the straits, in NATO and constantly testing what that means. Ankara sells drones to both sides of half the world's wars and has decided the Ottoman map is worth remembering."
 DVE_BRA_BOOKMARK_DESC:0 "The continent's giant, back at the table after years of shouting at itself. The Amazon, the soy and the offshore fields make Brasilia impossible to ignore, whatever it decides to do with them."
 DVE_UKR_BOOKMARK_DESC:0 "Three years of war have made the most experienced army in Europe out of a country that did not want one. What it does not have is the industry to replace what it loses, and the aid is arriving slower every month."
 DVE_KOR_BOOKMARK_DESC:0 "Fifty million people, the world's best shipyards and chip fabs, and an armistice line thirty miles from the capital. Seoul's problem is not capability but the shortness of the warning."
 DVE_SAF_BOOKMARK_DESC:0 "The gateway to a continent everyone is courting, run by a party that has governed since liberation and is running out of the credit that came with it. The minerals under the veld decide who wins this century."
 DVE_SAU_BOOKMARK_DESC:0 "The oil still flows, but the plan is to be relevant after it stops. A young court, an old clergy, and a crown prince spending a sovereign fortune on the bet that the desert can be made into something else."
