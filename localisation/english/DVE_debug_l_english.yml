 DVE_debug_give_pp:0 "[DEBUG] Give 1000 Political Power"
 DVE_debug_give_pp_desc:0 "Adds 1000 political power and 100 command power."
 DVE_debug_max_stability_war_support:0 "[DEBUG] +50% Stability and War Support"
 DVE_debug_max_stability_war_support_desc:0 "Raises stability and war support by 50 points each."
 DVE_debug_drain_stability:0 "[DEBUG] -50% Stability, -30% War Support"
 DVE_debug_drain_stability_desc:0 "Tanks stability and war support, for testing collapse scenarios."
 DVE_debug_give_industry:0 "[DEBUG] Give 10 Civilian + 10 Military Factories"
 DVE_debug_give_industry_desc:0 "Instantly builds ten industrial complexes and ten arms factories."
 DVE_debug_give_army:0 "[DEBUG] Give Manpower, XP and Equipment"
 DVE_debug_give_army_desc:0 "500k manpower, 200 XP in every branch, and 20000 infantry equipment."

