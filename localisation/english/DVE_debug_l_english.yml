 DVE_debug_lost_ukraine:0 "[DEBUG] Lost Ukraine"
 DVE_debug_lost_ukraine_desc:0 "Simulates the defeat or white peace in Ukraine: loads the post-defeat focus tree, wrecks stability and war support, and grants political power to work with."
 DVE_debug_reload_starting_tree:0 "[DEBUG] Back to the Starting Focus Tree"
 DVE_debug_reload_starting_tree_desc:0 "Reloads the normal Russian tree and clears every post-defeat flag, so the scenario can be tested again from scratch."
 DVE_debug_open_succession:0 "[DEBUG] Kill Putin, Open the Succession"
 DVE_debug_open_succession_desc:0 "Sets the assassination and succession flags directly, starting the crisis countdown without going through the focuses."
 DVE_debug_succession_timeout:0 "[DEBUG] Succession Timer Runs Out Now"
 DVE_debug_succession_timeout_desc:0 "Fires the timeout outcome immediately: the Second Russian Civil War breaks out."
 DVE_debug_clean_coup:0 "[DEBUG] Force a Clean Coup"
 DVE_debug_clean_coup_desc:0 "Marks the succession as resolved, closing the crisis without a civil war."
 DVE_debug_peace_settlement:0 "[DEBUG] Apply the Peace Settlement"
 DVE_debug_peace_settlement_desc:0 "Hands Belgorod and the Donbass to Ukraine, Sakhalin and the Kurils to Japan, and Kaliningrad to the U.N. zone - without loading the post-defeat tree."
