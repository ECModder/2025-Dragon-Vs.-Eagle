 DVE_debug_red_germany_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, the rump government falls back to its reserve capital, the Red Guard deploys on the new capital and the civil war opens. Greyed out once GDR already exists."
