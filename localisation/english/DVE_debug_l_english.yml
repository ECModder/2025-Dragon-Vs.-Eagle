 DVE_debug_force_civil_war:0 "[DEBUG] Force a Civil War"
 DVE_debug_force_civil_war_desc:0 "Immediately starts a communist civil war taking 45% of the country."

 DVE_debug_lost_ukraine:0 "[DEBUG] Lost Ukraine"
 DVE_debug_lost_ukraine_desc:0 "Simulates the defeat or white peace in Ukraine: loads the post-defeat focus tree, wrecks stability and war support, and grants political power to work with."
 DVE_debug_reload_starting_tree:0 "[DEBUG] Back to the Starting Focus Tree"
 DVE_debug_reload_starting_tree_desc:0 "Reloads the normal Russian tree and clears every post-defeat flag, so the scenario can be tested again from scratch."
 DVE_debug_open_succession:0 "[DEBUG] Kill Putin, Open the Succession"
 DVE_debug_open_succession_desc:0 "Sets the assassination and succession flags directly, starting the crisis countdown without going through the focuses."
 DVE_debug_succession_timeout:0 "[DEBUG] Succession Timer Runs Out Now"
 DVE_debug_succession_timeout_desc:0 "Fires the timeout outcome immediately: the Second Russian Civil War breaks out."
 DVE_debug_clean_coup:0 "[DEBUG] Force a Clean Coup"
 DVE_debug_clean_coup_desc:0 "Marks the succession as resolved, closing the crisis without a civil war."
 DVE_debug_peace_settlement:0 "[DEBUG] Apply the Peace Settlement"
 DVE_debug_peace_settlement_desc:0 "Hands Belgorod and the Donbass to Ukraine, Sakhalin and the Kurils to Japan, and Kaliningrad to the U.N. zone - without loading the post-defeat tree."
 DVE_debug_open_cw_menu:0 "[DEBUG] Open the Civil War Menu"
 DVE_debug_open_cw_menu_desc:0 "Raises the DVE_civil_war_active flag so the emergency powers menu can be tested without waiting for the civil war."

 DVE_debug_china_category:0 "DVE DEBUG - China"

 DVE_debug_china_civil_war:0 "[DEBUG] Start the Chinese Civil War"
 DVE_debug_china_civil_war_desc:0 "Splits China between the six factions on the developers' borders, lets Russia, Mongolia, Korea and the Chinese Republic take their share, gives every faction an army and declares all the wars. All 76 Chinese states are assigned."
 DVE_debug_china_spawn_ccr:0 "[DEBUG] Spawn CCR - Chinese Communist Republic"
 DVE_debug_china_spawn_ccr_desc:0 "Hands the Maoist north - Beijing, Shanxi, Xian, the Ordos and Yan'an - to the CCR, with cores and capital, and no war. For checking the flag, parties, leader and ideology by tag-switching."
 DVE_debug_china_spawn_csr:0 "[DEBUG] Spawn CSR - Chinese Soviet Republic"
 DVE_debug_china_spawn_csr_desc:0 "Hands the Leninist centre-south - Jiangxi, Wuhan, Chongqing, Chengdu and Zunyi - to the CSR, with cores and capital, and no war."
 DVE_debug_china_spawn_pxa:0 "[DEBUG] Spawn PXA - PLA Xinjiang Administration"
 DVE_debug_china_spawn_pxa_desc:0 "Hands Xinjiang and the Gansu corridor to the PXA, with cores and capital, and no war."
 DVE_debug_china_spawn_pta:0 "[DEBUG] Spawn PTA - PLA Tibet Administration"
 DVE_debug_china_spawn_pta_desc:0 "Hands Tibet and Qinghai to the PTA, with cores and capital, and no war."
 DVE_debug_china_armies:0 "[DEBUG] Give the Four Factions their Armies"
 DVE_debug_china_armies_desc:0 "Creates a division template for each faction that holds territory and deploys it on their capital: 24 divisions for the CCR, 20 for the CSR, 8 for the PXA, 6 for the PTA. Use it after the single spawns, which grant land but no troops."
 DVE_debug_china_reset:0 "[DEBUG] Undo the Chinese Civil War"
 DVE_debug_china_reset_desc:0 "China takes back every state and core from the four factions so the test can be run again. Divisions already created stay with the factions, which are left with no land."

 DVE_debug_sovnarkom_chain:0 "[DEBUG] Convene the Sovnarkom Now"
 DVE_debug_sovnarkom_chain_desc:0 "Fires the Sovnarkom Restored event within the hour instead of waiting three days from the birth of the Soviet Republic. The three faction events still arrive seven, eight and nine days after it."

 DVE_debug_china_spawn_sik:0 "[DEBUG] Spawn SIK - Xinjiang Revolt"
 DVE_debug_china_spawn_sik_desc:0 "Hands Dzungaria and Yarkand to Sinkiang, with cores and capital, and no war."
 DVE_debug_china_spawn_tib:0 "[DEBUG] Spawn TIB - Free Tibet"
 DVE_debug_china_spawn_tib_desc:0 "Hands Shigatse and Ngari to Tibet, with cores and capital, and no war."
 DVE_debug_china_occupations:0 "[DEBUG] Let the Neighbours Help Themselves"
 DVE_debug_china_occupations_desc:0 "Russia takes Sungkiang, Mongolia takes Xilingol, Korea takes Liaoning and all of North Korea, and the Chinese Republic takes the whole south-eastern coast. Territory only, no cores: it stays irredentist land."

 DVE_debug_win_ukraine:0 "[DEBUG] Win the War in Ukraine"
 DVE_debug_win_ukraine_desc:0 "Runs the victory outcome: Russia keeps every state it currently controls, Ukraine becomes a puppet and the campaign mission closes."
 DVE_debug_ukraine_white_peace:0 "[DEBUG] Force the White Peace Now"
 DVE_debug_ukraine_white_peace_desc:0 "Fires the outcome the 278-day timer would produce: white peace with the map as it stands, and both campaign missions close."

 DVE_debug_red_europe_category:0 "DVE DEBUG - Red Europe"
 DVE_debug_red_france:0 "[DEBUG] France Splits - FRA vs FSR"
 DVE_debug_red_france_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, the rump government falls back to its reserve capital, the Red Guard deploys on the new capital and the civil war opens. Greyed out once FSR already exists."
