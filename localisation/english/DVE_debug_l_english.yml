 DVE_debug_red_britain_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, the rump government falls back to its reserve capital, the Red Guard deploys on the new capital and the civil war opens. Greyed out once SRB already exists."
 DVE_debug_red_portugal:0 "[DEBUG] Portugal Splits - POR vs PRS"
 DVE_debug_red_portugal_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, the rump government falls back to its reserve capital, the Red Guard deploys on the new capital and the civil war opens. Greyed out once PRS already exists."
 DVE_debug_red_poland:0 "[DEBUG] Poland Splits - POL vs PPR"
 DVE_debug_red_poland_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, every rump government leaves its faction and falls back to a reserve capital, the Red Guard deploys and the war opens. Greyed out once PPR already exists."
 DVE_debug_red_greece:0 "[DEBUG] Greece Splits - GRE vs GSR"
 DVE_debug_red_greece_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, every rump government leaves its faction and falls back to a reserve capital, the Red Guard deploys and the war opens. Greyed out once GSR already exists."
 DVE_debug_red_scandinavia:0 "[DEBUG] Scandinavia Splits - SWE vs SSR"
 DVE_debug_red_scandinavia_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, every rump government leaves its faction and falls back to a reserve capital, the Red Guard deploys and the war opens. Greyed out once SSR already exists."
 DVE_debug_red_yugoslavia:0 "[DEBUG] Yugoslavia Splits - SER vs YUG"
 DVE_debug_red_yugoslavia_desc:0 "Runs the revolution exactly as the Italian focus would: the socialist tag takes its share of the states with cores, every rump government leaves its faction and falls back to a reserve capital, the Red Guard deploys and the war opens. Greyed out once YUG already exists."

 DVE_debug_italy_category:0 "DVE DEBUG - Italy Civil War"

 DVE_debug_italy_civil_war:0 "[DEBUG] Start the Italian Civil War (6 factions)"
 DVE_debug_italy_civil_war_desc:0 "Splits Italy between INT, SRI, RSI, LOM and TYR on the states agreed with the developers, gives every faction an army, plants an Italian garrison in Rome even though the RSI owns it, garrisons the states Italy keeps outright (Abruzzo, Sicily, Sardinia, Trentino) with 2 divisions each, pulls Italy out of NATO, and declares all the wars."
 DVE_debug_italy_spawn_int:0 "[DEBUG] Spawn INT - The Internationale"
 DVE_debug_italy_spawn_int_desc:0 "Hands Piedmont, Lombardy, Emilia-Romagna, Tuscany and Trieste to the INT, with cores and capital, and no war. For checking the flag, parties, leader and ideology by tag-switching."
 DVE_debug_italy_spawn_sri:0 "[DEBUG] Spawn SRI - Socialist Republic of Italy"
 DVE_debug_italy_spawn_sri_desc:0 "Hands Naples, Calabria and Puglia to the SRI, with cores and capital, and no war."
 DVE_debug_italy_spawn_rsi:0 "[DEBUG] Spawn RSI - Italian Social Republic"
 DVE_debug_italy_spawn_rsi_desc:0 "Hands Lazio (Rome) to the RSI, with core and capital, and no war."
 DVE_debug_italy_spawn_lom:0 "[DEBUG] Spawn LOM - Padania"
 DVE_debug_italy_spawn_lom_desc:0 "Hands Veneto and Bergamo to LOM, with cores and capital, and no war."
 DVE_debug_italy_spawn_tyr:0 "[DEBUG] Spawn TYR - South Tyrol"
 DVE_debug_italy_spawn_tyr_desc:0 "Hands South Tyrol to TYR, with core and capital, and no war."
 DVE_debug_italy_armies:0 "[DEBUG] Give Every Side their Armies"
 DVE_debug_italy_armies_desc:0 "Creates a division template for each of the five factions and deploys it on their capital, plants the Italian garrison in Rome, and adds 2 garrison divisions each to Abruzzo, Sicily, Sardinia and Trentino - the states Italy keeps outright. Use it after the single spawns, which grant land but no troops."
 DVE_debug_italy_reset:0 "[DEBUG] Undo the Italian Civil War"
 DVE_debug_italy_reset_desc:0 "Italy takes back every state and core from the five factions so the test can be run again. Divisions already created stay with the factions, which are left with no land."

 DVE_debug_france_category:0 "DVE DEBUG - French Civil War"

 DVE_debug_france_civil_war:0 "[DEBUG] Start the French Civil War (11 factions)"
 DVE_debug_france_civil_war_desc:0 "Splits France between FSR, CMU, FRS, MOF, BRY, VAF, ANF, FAC, COR and CTL on the agreed states, installs Mélenchon's government in Paris, gives every faction an army, pulls France out of NATO, and declares all the wars."
 DVE_debug_france_spawn_fsr:0 "[DEBUG] Spawn FSR - Socialist France"
 DVE_debug_france_spawn_fsr_desc:0 "Hands Loire and Poitou to the FSR, with cores and capital, and no war. For checking the flag, parties, leader and ideology by tag-switching."
 DVE_debug_france_spawn_cmu:0 "[DEBUG] Spawn CMU - Communard Republic"
 DVE_debug_france_spawn_cmu_desc:0 "Hands Champagne, Champagne 2 and Centre to the CMU, with cores and capital, and no war."
 DVE_debug_france_spawn_frs:0 "[DEBUG] Spawn FRS - The French State"
 DVE_debug_france_spawn_frs_desc:0 "Hands Normandy, Alsace-Lorraine, Alsace, Franche-Comte, Bourgogne, Limousin, Rhone-Alpes, Savoy and Centre Sud to the FRS, with cores and capital, and no war."
 DVE_debug_france_spawn_mof:0 "[DEBUG] Spawn MOF - Monarchist France"
 DVE_debug_france_spawn_mof_desc:0 "Hands Picardy and Pas de Calais to the MOF, with cores and capital, and no war."
 DVE_debug_france_spawn_bry:0 "[DEBUG] Spawn BRY - Brittany"
 DVE_debug_france_spawn_bry_desc:0 "Hands Brittany to the BRY, with core and capital, and no war."
 DVE_debug_france_spawn_vaf:0 "[DEBUG] Spawn VAF - Vanguard France"
 DVE_debug_france_spawn_vaf_desc:0 "Hands Bouches-du-Rhone and Var to the VAF, with cores and capital, and no war."
 DVE_debug_france_spawn_anf:0 "[DEBUG] Spawn ANF - Anarchist France"
 DVE_debug_france_spawn_anf_desc:0 "Hands Aquitaine, the French Basque Country, Midi-Pyrenees and Roussillon/Languedoc to the ANF, with cores and capital, and no war."
 DVE_debug_france_spawn_fac:0 "[DEBUG] Spawn FAC - French Army Command"
 DVE_debug_france_spawn_fac_desc:0 "Hands every French overseas territory to the FAC, with cores and capital, and no war."
 DVE_debug_france_spawn_cor:0 "[DEBUG] Spawn COR - Corsica"
 DVE_debug_france_spawn_cor_desc:0 "Hands Corsica to the COR, with core and capital, and no war."
 DVE_debug_france_spawn_ctl:0 "[DEBUG] Spawn CTL - Northern Catalonia"
 DVE_debug_france_spawn_ctl_desc:0 "Hands Northern Catalonia to the CTL, with core and capital, and no war."
 DVE_debug_france_armies:0 "[DEBUG] Give Every Side their Armies"
 DVE_debug_france_armies_desc:0 "Creates a division template for each of the ten factions and deploys it on their capital. Use it after the single spawns, which grant land but no troops."
 DVE_debug_france_reset:0 "[DEBUG] Undo the French Civil War"
 DVE_debug_france_reset_desc:0 "France takes back every state and core from the ten factions so the test can be run again. Divisions already created stay with the factions, which are left with no land."
