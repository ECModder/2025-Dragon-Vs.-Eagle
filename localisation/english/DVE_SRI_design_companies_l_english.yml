l_english:

 SRI_tank_manufacturer:0 "State Armor Combine"
 SRI_tank_manufacturer_desc:0 "One plan, one quota, one design bureau. The combine builds exactly what the ministry specifies, and the ministry has strong opinions about armor plate."

 SRI_naval_manufacturer:0 "State Shipyard"
 SRI_naval_manufacturer_desc:0 "Nationalized the day the government changed hands, and run the same way ever since: a state shipyard that answers to a ministry, not a market."

 SRI_light_aircraft_manufacturer:0 "State Aviation Combine - Fighters"
 SRI_light_aircraft_manufacturer_desc:0 "The fighter division of the state's aviation combine. Every airframe is approved in triplicate before it is allowed to leave the drawing board."

 SRI_medium_aircraft_manufacturer:0 "State Aviation Combine - Medium Bombers"
 SRI_medium_aircraft_manufacturer_desc:0 "The medium bomber division of the same combine, working from the same ministry's five-year targets and the same ministry's patience for delays."

 SRI_heavy_aircraft_manufacturer:0 "State Aviation Combine - Heavy Bombers"
 SRI_heavy_aircraft_manufacturer_desc:0 "The combine's heaviest project, and the one the ministry watches closest - a state bomber programme is a line item nobody wants to explain a shortfall on."

 SRI_naval_aircraft_manufacturer:0 "State Aviation Combine - Naval Aviation"
 SRI_naval_aircraft_manufacturer_desc:0 "A naval aviation section on permanent loan from the combine to the state shipyards, building whatever the fleet's own plan calls for that year."

 SRI_motorized_equipment_manufacturer:0 "State Transport Combine"
 SRI_motorized_equipment_manufacturer_desc:0 "Every truck built to the same state specification, in the same state factories, to the same state timetable - whether or not the timetable is realistic."

 SRI_infantry_equipment_manufacturer:0 "State Arms Factory"
 SRI_infantry_equipment_manufacturer_desc:0 "A single state factory producing a single approved rifle pattern. Uniformity is the point - the ministry would rather have one design done right than three done differently."

 SRI_artillery_manufacturer:0 "State Artillery Foundry"
 SRI_artillery_manufacturer_desc:0 "The state's own gun foundry, casting barrels to specifications set by people who have never stood behind one."
