 # option names and descriptions
 rf_religion_state_atheism:0 "State Atheism"
 rf_religion_state_atheism_desc:0 "Faith is private superstition at best; clergy and church property answer to the party-state."
 rf_religion_secular_state:0 "Secular State"
 rf_religion_secular_state_desc:0 "Strict separation of church and state; religion is a private matter and stays out of the schools."
 rf_religion_recognised_faiths:0 "Recognised Faiths"
 rf_religion_recognised_faiths_desc:0 "The state funds and consults several recognised faiths, and favours none."
 rf_religion_state_church:0 "State Church"
 rf_religion_state_church_desc:0 "One church is the established one: it blesses the flag, teaches the catechism and sits in the councils."
 rf_religion_theocratic_law:0 "Religious Law"
 rf_religion_theocratic_law_desc:0 "Clerics interpret the law, and the law interprets everything else."
 rf_education_elite_schooling:0 "Elite & Clerical Schooling"
 rf_education_elite_schooling_desc:0 "Schooling is for the sons of the well-off and of the faithful; everyone else learns a trade on the job."
 rf_education_state_curriculum:0 "State Curriculum"
 rf_education_state_curriculum_desc:0 "Every child gets the same school, the same textbook and the same version of history."
 rf_education_public_schooling:0 "Public Schooling"
 rf_education_public_schooling_desc:0 "Free state schools to a basic standard, with private and church schools alongside."
 rf_education_comprehensive:0 "Comprehensive Education"
 rf_education_comprehensive_desc:0 "Compulsory schooling to eighteen, free meals, a university seat for anyone who passes."
 rf_education_open_science:0 "Open Universities"
 rf_education_open_science_desc:0 "Autonomous universities, open research and open curricula; the state pays and does not ask what is taught."
 rf_assembly_banned:0 "Assembly Banned"
 rf_assembly_banned_desc:0 "Public gatherings of more than a handful of people are illegal; the squares belong to parades."
 rf_assembly_licensed:0 "Licensed Assembly"
 rf_assembly_licensed_desc:0 "Every rally needs a permit, and permits are granted to friends of the government."
 rf_assembly_regulated:0 "Regulated Assembly"
 rf_assembly_regulated_desc:0 "Gatherings need only be notified, but groups judged violent or anti-constitutional can be banned."
 rf_assembly_free:0 "Free Assembly"
 rf_assembly_free_desc:0 "Anyone may gather, march and petition; councils and committees form without asking leave."
 rf_courts_independent:0 "Independent Judiciary"
 rf_courts_independent_desc:0 "Judges cannot be removed by the government, juries decide the facts, and the state can lose in its own courts."
 rf_tax_minimal:0 "Minimal Taxation"
 rf_tax_minimal_desc:0 "Flat, token levies; the state lives on tariffs and rents."
 rf_tax_confiscatory:0 "Confiscatory Taxation"
