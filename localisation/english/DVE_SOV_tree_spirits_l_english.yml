l_english:
 # ==== DvE - spiriti dell'albero sovietico principale ====

 idea_SOV_socialization_of_production:0 "Socialization of the Means of Production"
 idea_SOV_socialization_of_production_desc:0 "The factory belongs to the people inside it. Lines find their rhythm astonishingly fast; breaking ground on a new one takes three meetings and a vote."

 idea_SOV_collectivization_of_production:0 "Collectivization of the Means of Production"
 idea_SOV_collectivization_of_production_desc:0 "Everything held in common, which means everything claimed by everyone. Output climbs, and so does the bill the Union settles every month in grain and cloth."

 idea_SOV_state_capitalism:0 "State Capitalism"
 idea_SOV_state_capitalism_desc:0 "The commanding heights belong to one owner, and that owner does not negotiate with its workforce. The results are undeniable. So is what they cost."

 idea_SOV_market_socialism:0 "Market Socialism"
 idea_SOV_market_socialism_desc:0 "Prices are allowed to say what they have always meant. Shelves fill, quotas are met, and every year a few more comrades wonder aloud what else might be allowed."

 idea_SOV_continue_five_year_plans:0 "Continue with the Five-Year Plans"
 idea_SOV_continue_five_year_plans_desc:0 "What worked in 1931 is asked to work again, on the grounds that it worked in 1931. Concrete is poured on schedule and nothing unexpected is permitted to happen."

 idea_SOV_a_digital_trotsky:0 "Really? A Digital Trotsky?"
 idea_SOV_a_digital_trotsky_desc:0 "The plan is computed rather than decreed, and the machine occasionally returns an answer the Central Committee finds politically impossible. It is right anyway."

 idea_SOV_restore_the_red_army:0 "The Red Army Restored"
 idea_SOV_restore_the_red_army_desc:0 "Volunteers, with commissars beside the officers rather than above them. It learns quickly, because nobody has been shot for suggesting an improvement."

 idea_SOV_restore_the_soviet_army:0 "The Soviet Army Restored"
 idea_SOV_restore_the_soviet_army_desc:0 "Mass, discipline and a very short conversation about individual initiative. It will be enormous long before it is good."

 idea_SOV_sino_soviet_agreement:0 "Sino-Soviet Agreement"
 idea_SOV_sino_soviet_agreement_desc:0 "Two revolutions signing as equals - the phrasing both delegations insisted on, and neither entirely believes."

 idea_SOV_soviet_chinese_alliance:0 "Soviet-Chinese Alliance"
 idea_SOV_soviet_chinese_alliance_desc:0 "Not a treaty between equals but a common command, and everyone knows which capital it sits in. What it lacks in dignity it makes up for in divisions."

 idea_SOV_to_each_needs:0 "To Each According to his Needs"
 idea_SOV_to_each_needs_desc:0 "The second half of the sentence, the one that was always postponed until conditions allowed. Conditions have been declared to allow it."

 idea_SOV_agricultural_communes:0 "Agricultural Communes"
 idea_SOV_agricultural_communes_desc:0 "The village feeds itself, argues with itself and sends its sons to the army on time. Industry would prefer to have them."

 idea_SOV_full_blown_digital_marxism:0 "Full-Blown Digital Marxism"
 idea_SOV_full_blown_digital_marxism_desc:0 "What the planners of the last century lacked was not will but arithmetic. The arithmetic has arrived, and it fits in a building outside Novosibirsk."

 idea_SOV_true_trotskyist_revolution:0 "A True Trotskyist Revolution"
 idea_SOV_true_trotskyist_revolution_desc:0 "The economy is put on the same footing as the revolution: permanent, expanding, and never allowed to settle into anything comfortable."

 idea_SOV_socialist_economy_as_god_teaches:0 "A Socialist Economy as God Teaches"
 idea_SOV_socialist_economy_as_god_teaches_desc:0 "Steel, concrete and five-year plans, exactly as written. There is no cleverness in it anywhere, and it produces more than any of the clever versions."

 idea_SOV_new_factory_of_the_world:0 "The New Factory of the World"
 idea_SOV_new_factory_of_the_world_desc:0 "Everything the world buys is stamped somewhere between Minsk and Vladivostok. Almost nothing the world buys was designed there."

 idea_SOV_the_spectre_of_communism:0 "The Spectre of Communism"
 idea_SOV_the_spectre_of_communism_desc:0 "It was a figure of speech for a century and a half. It is now a foreign policy with a budget."

 idea_SOV_trotsky_young_once_again:0 "Trotsky Is Young Once Again"
 idea_SOV_trotsky_young_once_again_desc:0 "The old man was right and was murdered for it, which the Union now considers proof rather than coincidence. The revolution does not stop at the border, or anywhere else."

 idea_SOV_a_party_with_a_state:0 "A Party With a State"
 idea_SOV_a_party_with_a_state_desc:0 "Other countries have a state that contains a party. Here the Party has acquired a state, the way a man acquires a coat."

 idea_SOV_workers_of_the_world_unite:0 "Workers of the World Unite"
 idea_SOV_workers_of_the_world_unite_desc:0 "An army that reads. Slower to form than a conscript mass and considerably harder to break, because it knows precisely what it would be surrendering."

 idea_SOV_ura_ura_uraaa:0 "Ura! Ura! Uraaa!!!"
 idea_SOV_ura_ura_uraaa_desc:0 "There is no translation. There has never needed to be one."
