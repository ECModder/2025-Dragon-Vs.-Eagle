finlandos.1.t:0 "Question of Karelia"
finlandos.1.d:0 "For generations, Karelia has remained one of the greatest national questions facing Finland.\n\nThe forests, lakes and villages of this historic land have long been tied to the Finnish nation through culture, language and shared history. Yet the tragedies of the twentieth century divided Karelia from Finland, forcing thousands of families to abandon their homes and leaving behind memories that still shape our people today.\n\nNow history has given us a second chance. With Karelia under Finnish control once again, our government must choose how this land will be governed. Many politicians argue that the time for compromise has passed. They believe Karelia should be fully integrated into Finland, becoming an equal part of our republic with complete citizenship, Finnish administration and the same rights enjoyed by every other region.\n\nOthers warn that Karelia possesses its own identity which deserves recognition. Rather than direct annexation, they propose creating a sovereign Republic of Karelia under Finnish protection. The new state would govern its own domestic affairs while remaining loyal to Helsinki through military, economic and diplomatic cooperation.\n\nThe nation watches Parliament with anticipation. Veterans remember the Winter War, refugees dream of returning home, and younger generations hope for a peaceful future beyond old conflicts. Whatever choice we make today will become one of the defining moments of modern Finnish history.\n\nWill Karelia return as an inseparable province of Finland, or will it rise as an autonomous ally protected by the Finnish nation? The future of Karelia is now in our hands."