l_english:

 dve_itapeace.1.t:0 "An Uneasy Peace"
 dve_itapeace.1.d:0 "Neither side has the strength - or the will - to keep fighting over land the revolution has already settled. Both governments quietly agree to a white peace, leaving the new border where the uprising drew it."
 dve_itapeace.1.a:0 "So be it."

