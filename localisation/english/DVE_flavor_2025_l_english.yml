 dve_frapro.1.t:0 "Protests Across France"
 dve_frapro.1.d:0 "More than 250,000 protesters took to the streets across France, according to the country's interior ministry, as students demanded greater investment in their schools. The unrest included a barricade being set on fire in Lyon, with police using tear gas on people in Paris and Marseille as well as water cannon in Rennes. One officer was charged after a boy was hit by a projectile that led to 'a double jaw fracture' during protests near Paris last week.\n\nDemands from protesters have included more places in higher education and funding for the emergency reconstruction of schools. The French Prime Minister has labelled claims of repression from the government towards the protests as 'false' after the Socialists and the Communists said the prime minister had youth 'tear-gassed and clubbed to create chaos and violence'.\n\nAs demonstrations continue, French students' union spokesperson Alice Cohen-Morzadec says that the movement will 'amplify even more until we get our demands'."
 dve_frapro.1.a:0 "A new revolution in France?"
 dve_frapro.2.t:0 "Occupied Schools in France"
 dve_frapro.2.d:0 "Nearly 900 high schools (lycées), accounting for nearly a quarter of all high schools in France, experienced severe disruptions, barricades, or total shutdowns. Prime Minister Sébastien Lecornu has ordered high school classes suspended for the remainder of the week, with many switching to remote learning.\n\nHigher education has also been heavily impacted. Around 40% of public higher education institutions have faced closures, blockades, or occupations by students, including major campuses in Paris and Marseille."
 dve_frapro.2.a:0 "Vive la Commune!"
 dve_frapro.3.t:0 "Expansion of Protests in France"
 dve_frapro.3.d:0 "Labour unions (CGT, CNT, FO) have also taken to the streets. According to the French Ministry of the Interior, over 950,000 demonstrators turned out across France to demand better working conditions, while the unions put the figure at more than 1.5 million. The protests saw barricades erected to halt demonstrators in Bordeaux and Reims, as well as police charges in Paris, Strasbourg, and Marseille.\n\nDemands included more public-sector jobs, greater state intervention in the economy, and funding for the urgent reconstruction of public buildings and social housing. As the demonstrations continue, radical groups are gaining support and increasing their membership; the country is becoming increasingly polarized between the radical Left and the far Right."
 dve_frapro.3.a:0 "Finally, the CGT joined the protests."
