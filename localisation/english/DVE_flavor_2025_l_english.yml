 dve_itapro.1.t:0 "March Against All Wars"
 dve_itapro.1.d:0 "Genoa. On a mild, sunny Saturday, Via San Lorenzo and the entire city center, teeming with the red flags of 'Lotta Comunista', were once again on strike. Thousands and thousands of people marched in an orderly fashion along the route, from Piazza Caricamento and Piazza De Ferrari, through Piazza Dante and Via XX Settembre, accompanied by car sound systems broadcasting the strains of 'The Internationale' and 'Bandiera Rossa'.\n\nThis was not May Day, the date traditionally dedicated by workers' groups to city marches, but a demonstration planned weeks in advance to say 'NO TO ALL WARS'. The fragile truce in Gaza changes little. Gaza is not the only ongoing conflict in the world, and that 'fragile truce' neither erases the massacre of the civilian population nor allows for a hopeful outlook on the future. Then there are the wars in Ukraine and Sudan, as well as many other forgotten conflicts."
 dve_itapro.1.a:0 "No war but class war."
 dve_itapro.2.t:0 "The Strike for Ilva"
 dve_itapro.2.d:0 "The strikes at the former Ilva plant in Genoa represent a united response from workers and unions against the threat of a gradual, silent dismantling of the industrial complex. The protest erupted when the government unveiled a plan entailing substantial production cuts. For the workers in Genoa, this would mean a sharp rise in the number of employees relying on the wage guarantee fund - affecting nearly a thousand staff members.\n\nAsserting their right to work and produce steel, the workers responded with full-scale mobilization: they established a permanent picket line outside the factories - braving cold nights outdoors to guard the gates - and took to the streets with general strikes, massive marches, and road blockades that paralyzed key points across the city. This tenacious resistance is also backed by workers from other industrial sites, the party 'Lotta Comunista', and the people of Genoa."
 dve_itapro.2.a:0 "Avanti compagni!"
 DVE_debug_event_ita_1:0 "[DEBUG] Event: March Against All Wars"
 DVE_debug_event_ita_2:0 "[DEBUG] Event: The Strike for Ilva"
 dve_mayday.1.t:0 "May Day"
 dve_mayday.1.d:0 "Thousands of people are marching, a sea of red flags, rosettes, and banners, accompanied by a band playing 'The Internationale'. This morning, the traditional Labor Day demonstration made its way through the city centers of major urban areas. For anyone encountering this winding procession for the first time, it feels like witnessing a ritual from a bygone era, yet one that remains strikingly relevant today.\n\nMarches were organized in every single city by left-wing parties, Internationalism, the RCP, and trade unions."
 dve_mayday.1.a:0 "The Internationale unites the human race."
 DVE_debug_event_may_day:0 "[DEBUG] Event: May Day"
