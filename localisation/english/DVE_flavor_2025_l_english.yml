l_english:
 dve_rom.1.t:0 "Romania and Bulgaria in Schengen"
 dve_rom.1.d:0 "After years of waiting, Romania and Bulgaria are officially in the Schengen Area. Border checkpoints are shutting down. Passports are no longer needed to travel to the rest of the bloc.\n\nThis ends a long diplomatic fight. It brings both countries closer to the rest of Europe. Trade will move faster without the long lines of trucks at the border. Their economies will get a boost. For the citizens, it means true freedom of movement at last."
 dve_rom.1.a:0 "What a step for both nations."
 dve_rom.2.t:0 "The January Strikes"
 dve_rom.2.d:0 "In January 2025, a wave of strikes and industrial actions swept across Romania as workers confronted worsening economic conditions and government austerity measures. Police officers, railway workers, miners, forestry workers, steelworkers, public-sector employees and other organized labor groups took collective action over frozen wages, pension concerns, reduced benefits and measures introduced through the government's so-called 'austerity ordinance'.\n\nThe strikes represented a growing confrontation between organized labor and the Romanian government, with unions demanding that workers' rights and incomes be protected. Demonstrations organized specifically around political issues and the annulled presidential election remained a separate movement, distinct from the labor actions.\n\nThe January Strikes became a defining moment of labor unrest in Romania - a month when workers organized, withdrew their labor and demanded to be heard."
 dve_rom.2.a:0 "Hope the people get what they want."
 dve_rom.3.t:0 "Klaus Iohannis Resigns"
 dve_rom.3.d:0 "After more than a decade at the helm of Romania, President Klaus Iohannis announced his resignation on February 10, 2025, amid mounting political pressure and a parliamentary procedure seeking his suspension.\n\nIn his address from Cotroceni Palace, Iohannis stated that he was resigning to spare Romania from what he described as an unnecessary and damaging political crisis. His announcement immediately changed the political landscape, ending the planned parliamentary suspension proceedings. Two days later, on February 12, Iohannis formally left Cotroceni Palace. Senate President Ilie Bolojan assumed the role of interim president, beginning a transitional period ahead of the rescheduled presidential election."
 dve_rom.3.a:0 "Good luck for him."
 dve_rom.4.t:0 "The Detention of Calin Georgescu"
 dve_rom.4.d:0 "On February 26, 2025, Calin Georgescu was stopped by police in Bucharest while traveling to submit his candidacy for the upcoming presidential election. He was taken to the Prosecutor General's Office for questioning as prosecutors opened a criminal investigation into several alleged offenses.\n\nGeorgescu was questioned for approximately five hours. Prosecutors announced accusations including alleged incitement to actions against the constitutional order, communicating false information, false declarations concerning campaign financing, and promoting extremist organizations and ideologies. Georgescu denied wrongdoing and characterized the investigation as an attempt to prevent his candidacy.\n\nAfter the questioning, Georgescu was released under judicial control for 60 days, including a prohibition on leaving Romania. His detention triggered demonstrations outside the prosecutor's office, where supporters gathered demanding his release.\n\nA presidential candidate was taken in for questioning. A political crisis deepened."
 dve_rom.4.a:0 "Welp, there goes a hero."
 dve_lba.1.t:0 "Libyan Militias Revolt"
 dve_lba.1.d:0 "Prime Minister Abdul Hamid Dbeibeh has caused mass outrage in Libya due to his internal and external policies. Due to this, the militias in Tripoli, Zawiya, Misrata and Zintan have launched an open revolt.\n\nFree Libya!"
 dve_lba.1.a:0 "Death to Dbeibeh!"
 dve_lba.2.t:0 "Khalifa Haftar Dies"
 dve_lba.2.d:0 "The city of Tobruk has announced that the warlord Khalifa Haftar has died of old age in his apartment. The east has declared a week of mourning for the warlord, but with his death the various militias and the sons of Khalifa Haftar have begun vying for power."
 dve_lba.2.a:0 "The third civil war begins."
