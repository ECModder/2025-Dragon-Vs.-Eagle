l_english:
 # ==== DvE - Il Sovnarkom e le tre correnti ====

 # ---- sentinella (nascosto, non si vede mai) ----
 dve_sovnarkom.0.t:0 "Sovnarkom Watcher"
 dve_sovnarkom.0.d:0 "Hidden event. Starts the Sovnarkom chain when the Soviet Republic comes into being."
 dve_sovnarkom.0.a:0 "..."

 # ---- FASE 0 - Formazione ----
 dve_sovnarkom.1.t:0 "Sovnarkom Restored"
 dve_sovnarkom.1.d:0 "The Council of People's Commissars reconvenes amid the ashes of the old Union. Real power, however, does not rest with the Council - it rests with the three currents that fought to bring it here: the disciplined heirs of Lenin, the exiled prophets of permanent revolution, and the men of iron who never forgave either.\n\nBut, Sovnarkom leads the government. For now."
 dve_sovnarkom.1.a:0 "The Council convenes."

 # ---- FASE 1 - gli stalinisti ----
 dve_sovnarkom.2.t:0 "The Return of the Soyuz"
 dve_sovnarkom.2.d:0 "It's no longer just nostalgia for the past, the KPRF finally has the chance to bring back what was stolen from all of us. The Glorious Soyuz Sovetskikh Sotsialisticheskikh Respublik."
 dve_sovnarkom.2.a:0 "Let the KPRF raise the old banner."
 dve_sovnarkom.2.b:0 "The Union will be rebuilt by the Council, not by nostalgia."

 # ---- FASE 1 - i leninisti ----
 dve_sovnarkom.3.t:0 "The Vanguard Reorganizes"
 dve_sovnarkom.3.d:0 "Across the factory councils and party cells, the old Leninist and Internationalist cadres begin rebuilding the apparatus they know best: Discipline, Democratic Centralism, the vanguard party.\n\nThey organize."
 dve_sovnarkom.3.a:0 "Hand them the apparatus."
 dve_sovnarkom.3.b:0 "Democratic centralism can wait."

 # ---- FASE 1 - i trotskisti ----
 dve_sovnarkom.4.t:0 "The Flowering of Levoradikaly"
 dve_sovnarkom.4.d:0 "In the 1920s, the Trotskyists were systematically purged by the Stalinist apparatus. But in a situation where monarchists, authoritarians, and bourgeoisie wanted to see the Revolution suppressed again, the Trotskyist commissars were once again assuming positions in the political leadership of the Red Army.\n\nThey spoke of revolution for a Union that had already betrayed it once."
 dve_sovnarkom.4.a:0 "Give the commissars the Red Army."
 dve_sovnarkom.4.b:0 "The Revolution has prophets enough."
