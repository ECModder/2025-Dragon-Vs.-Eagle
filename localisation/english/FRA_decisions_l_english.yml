l_english:

 FRA_agricultural_crisis:0 "The Agricultural Crisis"
 FRA_agricultural_crisis_desc:0 "Farmers across France have taken to the roads with tractors, blockades and protests. Rising costs, heavy regulation and fears of foreign competition have left rural France angry. The government must act carefully to restore calm and rebuild trust."

 FRA_negotiate_with_farmers:0 "Open Negotiations with Farmers"
 FRA_negotiate_with_farmers_desc:0 "Meet with agricultural unions and representatives to discuss their demands. A negotiated settlement could calm the protests, but promises alone will not solve the crisis."

 FRA_reduce_agricultural_bureaucracy:0 "Reduce the Administrative Burden"
 FRA_reduce_agricultural_bureaucracy_desc:0 "Simplify certain regulations and reduce unnecessary paperwork for French farmers. These reforms may ease some of their frustrations, but implementing them will take time."

 FRA_emergency_farm_aid:0 "Provide Emergency Aid to Farmers"
 FRA_emergency_farm_aid_desc:0 "Provide temporary financial assistance to struggling farms facing rising costs. This could ease tensions in rural France, although it will place additional pressure on public finances."

 FRA_oppose_mercosur:0 "Oppose the Mercosur Agreement"
 FRA_oppose_mercosur_desc:0 "Take a stronger position against the EU-Mercosur trade agreement in response to farmers' concerns over foreign competition. This may reassure agricultural unions, but could complicate relations with European partners."

 FRA_long_term_agricultural_plan:0 "Establish a Long-Term Agricultural Plan"
 FRA_long_term_agricultural_plan_desc:0 "After negotiations, financial aid and reforms, establish a long-term plan for French agriculture. The government hopes this will bring the protests to an end and restore confidence in its ability to respond to the country's problems."
