l_english:

 # ==== National Ideology - new fourth tier ====
 councils_state:0 "Councils State"
 councils_state_desc:0 "The party apparatus does not so much fall as dissolve into something else: workers', soldiers' and local councils, deciding directly what the ministries used to decide for them."

 # ==== Economic Model - locked to ideology, not player-selectable ====
 market_economy:0 "Market Economy"
 market_economy_desc:0 "Ownership stays private, prices stay where supply and demand put them, and the state's role is to stay out of the way."
 mixed_economy_desc:0 "Markets do most of the deciding, with a state hand on the scale where it judges the outcome unacceptable."
 command_economy:0 "Command Economy"
 command_economy_desc:0 "Private property survives on paper. In practice the state tells industry what to build, and industry builds it."
 market_socialism:0 "Market Socialism"
 market_socialism_desc:0 "The factories belong to the people who work in them, and what they produce still meets a market to sell it in."
 state_capitalism:0 "State Capitalism"
 state_capitalism_desc:0 "The party owns the commanding heights of the economy and runs them exactly as a capitalist would - efficiently, and for the state's account rather than a private one."
 syndicalist_economy:0 "Syndicalist Economy"
 syndicalist_economy_desc:0 "Every workplace answers to the council that runs it, and every council answers to the workers inside it. Coordination between them is still being worked out."
 socialist_economy:0 "Socialist Economy"
 socialist_economy_desc:0 "Common ownership of the means of production, planned and coordinated at the national level - the councils' improvisation, made permanent."
 communist_economy:0 "Communist Economy"
 communist_economy_desc:0 "Production for use, not for exchange, administered as a single coordinated whole. As close as any state has come to what the word was supposed to mean."

 # ==== the paid upgrade decisions ====
 DVE_economic_upgrade_category:0 "Economic Transformation"
 DVE_economic_upgrade_category_desc:0 "The revolution's economics are not finished the day the revolution wins. What comes next has to be built, and paid for."
 DVE_upgrade_to_socialist_economy:0 "Complete the Transition to Socialism"
 DVE_upgrade_to_socialist_economy_desc:0 "The councils improvised well enough to win. Now the improvisation has to become a system - one economy, planned as a whole, instead of a thousand councils each solving the same problem differently."
 DVE_upgrade_to_communist_economy:0 "Abolish What Remains of the Market"
 DVE_upgrade_to_communist_economy_desc:0 "Prices, wages, exchange between enterprises - the last mechanisms inherited from the old economy are dismantled. What is produced is produced for use."
