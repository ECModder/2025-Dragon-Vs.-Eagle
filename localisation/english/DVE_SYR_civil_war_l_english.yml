l_english:
 dve_syrcw.1.t:0 "Syria Breaks Apart"
 dve_syrcw.1.d:0 "Three months after the fall of the old regime, the country the Interim Government inherited has stopped obeying it. On the coast, officers of the former army have taken Latakia and Tartus. In the north the factions paid by Ankara answer to no one in Damascus. In the south the Druze militias have closed the roads to Suwayda. Between Aleppo and Homs the Islamist brigades that never accepted the new government have raised their own flag. Each of them now fights all the others."
 dve_syrcw.1.a:0 "Damascus will hold the country together"
 dve_syrcw.1.b:0 "Play as the Assadist remnants on the coast"
 dve_syrcw.1.c:0 "Play as the Turkish-backed factions in the north"
 dve_syrcw.1.e:0 "Play as the Druze of Suwayda"
 dve_syrcw.1.f:0 "Play as the Islamist factions of Aleppo and Homs"
 dve_syrcw.2.t:0 "Syria Descends into Civil War"
 dve_syrcw.2.d:0 "The Syrian Interim Government has lost control of most of the country in a matter of days. Assadist officers hold the coast, Turkish-backed factions the north, Druze militias the south, and Islamist brigades the country between Aleppo and Homs. All of them are at war with Damascus and with each other. Only the Kurdish-led administration in the north-east has stayed out of the fighting."
 dve_syrcw.2.a:0 "The war was never over"
 DVE_debug_syria_category:0 "DVE DEBUG - Syrian Civil War"
 DVE_debug_syria_category_desc:0 "Debug tools for the Syrian civil war. Visible only in debug mode."
 DVE_debug_syria_civil_war:0 "[DEBUG] Start the Syrian Civil War"
SYR_we_won_but_at_what_cost:0 "We Won, But at What Cost..."
SYR_we_won_but_at_what_cost_desc:0 "The Civil War has destroyed millions of Syrian lives. The endless fighting between the Assadist Dogs, the Kurds, and our forces has left Syria devastated. With our victory, we now have a massive responsibility to rebuild Syria from the ground up. It will take years of hard work before we can finally get back on our feet."

SYR_is_syria_truly_free:0 "Is Syria Truly Free?"
SYR_is_syria_truly_free_desc:0 "Ever since the fall of the Tyrant Bashar al-Assad, many Syrians rejoiced in their freedom. However, the population remains divided, even among our own ranks. The HTS soldiers who 'liberated' Syria expected the swift establishment of extremist Islamic ideals upon the nation. They have bled and died for it, haven't they? Now that the government is moving towards a more moderate Syria, who knows what plots the disgruntled soldiers are planning?"