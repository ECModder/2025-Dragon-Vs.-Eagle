l_english:
 russian_defeated_focus:0 "Russia - After the War"

 RUS_pd_and_now_what:0 "And now what?"
 RUS_pd_and_now_what_desc:0 "The guns are quiet and nobody dares call it a victory. The maps have been folded away, the talking heads have moved on, and in every ministry the same question is being asked in a low voice: what happens now?"
 RUS_pd_on_tiptoes:0 "On tiptoes on a stool"
 RUS_pd_on_tiptoes_desc:0 "The regime survives the way a man balances on a stool with a rope around his neck - perfectly well, right up until something moves. Every faction must be kept still at the same time."
 RUS_pd_keep_the_left_quiet:0 "Keep the Left quiet."
 RUS_pd_keep_the_left_quiet_desc:0 "The communists smell blood. Their newspapers are suddenly bold, their rallies suddenly large. They are reminded, politely at first, whose country this still is."
 RUS_pd_arrest_the_reds:0 "Arrest the Reds"
 RUS_pd_arrest_the_reds_desc:0 "Politeness having failed, the vans go out at four in the morning. The organisers are taken, the presses are sealed, and the rallies find themselves without anyone to address them."
 RUS_pd_blame_the_generals:0 "Blame the generals."
 RUS_pd_blame_the_generals_desc:0 "Someone must answer for the defeat, and it will not be the men who ordered it. The General Staff is handed the bill, in public, at length."
 RUS_pd_follow_stalin_teaches:0 "Follow Stalin's Teachings"
 RUS_pd_follow_stalin_teaches_desc:0 "The old playbook is taken down from the shelf. A defeat is never a defeat - it is treason, and treason has names, and names have addresses."
 RUS_pd_keep_the_right_on_your_side:0 "Keep the Right on your side."
 RUS_pd_keep_the_right_on_your_side_desc:0 "The nationalists were promised an empire and handed a ceasefire. Their fury needs somewhere to go that is not the Kremlin's front gate."
 RUS_pd_werent_you_patriots:0 "Weren't you Patriots?"
 RUS_pd_werent_you_patriots_desc:0 "The question is put to them on live television, and it lands. Men who spent years demanding sacrifice discover how awkward it is to be asked for some."
 RUS_pd_did_they_shoot_him:0 "Did they shoot him? For Real?"
 RUS_pd_did_they_shoot_him_desc:0 "The first reports are denied. The second are not. By evening the state channels are playing ballet, and everyone in Russia understands exactly what that means."
 RUS_pd_what_will_happen:0 "What Will Happen?"
 RUS_pd_what_will_happen_desc:0 "No successor, no mechanism, no plan - only a handful of men and movements who all believe the country is theirs to inherit. Whoever moves first, and cleanly, takes it. Whoever moves slowest starts a civil war."

 RUS_pd_big_red_tent:0 "A Big Red Tent"
 RUS_pd_big_red_tent_desc:0 "Communists, socialists, and everyone who ever missed the Union are gathered under one canvas. It is not a party so much as a very large grievance with a flag."
 RUS_pd_support_among_the_people:0 "Support among the people"
 RUS_pd_support_among_the_people_desc:0 "Thirty years of humiliation have left a great deal of anger lying about unused. It is collected, sorted, and pointed."
 RUS_pd_your_party_your_coalition:0 "Your Party, Your Coalition"
 RUS_pd_your_party_your_coalition_desc:0 "The quarrelling factions of the Russian left are hammered into a single list. Several of them even survive the process."
 RUS_pd_contacts_into_the_army:0 "Contacts into the Army"
 RUS_pd_contacts_into_the_army_desc:0 "A revolution without soldiers is a demonstration. Quiet conversations begin with colonels who have not been paid on time since the war ended."
 RUS_pd_a_new_october:0 "A New October"
 RUS_pd_a_new_october_desc:0 "The date is chosen for its symbolism and the plan for its simplicity: the telegraph, the television, the bridges, the ministries. In that order."
 RUS_pd_coup_de_main:0 "Coup de main"
 RUS_pd_coup_de_main_desc:0 "It is over before the morning traffic. The red flag is over the Duma, the succession question is answered, and the civil war everyone expected simply never arrives."

 RUS_pd_finally_democracy:0 "Finally, Democracy!"
 RUS_pd_finally_democracy_desc:0 "For the first time in a quarter of a century the outcome of an election is not known in advance. The opposition can hardly believe its own posters."
 RUS_pd_smart_voting:0 "Smart Voting"
 RUS_pd_smart_voting_desc:0 "Not a coalition - an instruction. In every district, vote for whoever can beat the party of power, whatever else they believe."
 RUS_pd_organize_the_protest:0 "Organize the protest"
 RUS_pd_organize_the_protest_desc:0 "Permits are refused, so the squares are filled without them. The numbers are large enough that arresting everyone stops being an option."
 RUS_pd_voice_of_the_people:0 "The Voice of the people"
 RUS_pd_voice_of_the_people_desc:0 "Independent channels come back from exile, blocked sites reopen, and the country hears itself speak without a censor for the first time in years."
 RUS_pd_young_are_with_us:0 "The Young are with us."
 RUS_pd_young_are_with_us_desc:0 "A generation that has known exactly one leader has no attachment whatsoever to the system he built. They turn out in numbers nobody predicted."
 RUS_pd_ours_shall_be_heard:0 "Ours shall be heard, with force."
 RUS_pd_ours_shall_be_heard_desc:0 "When the ministries refuse to hand over power, the crowds take the buildings instead. It is not quite a revolution and not quite an election - but the republic that emerges is real."

 RUS_pd_medvedev_seriously:0 "Medvedev, seriously?"
 RUS_pd_medvedev_seriously_desc:0 "The system reaches for the safest hands it has left, and finds them faintly ridiculous. It does not matter: continuity is the entire point."
 RUS_pd_arrest_communist_extremists:0 "Arrest those Communist-Extremists"
 RUS_pd_arrest_communist_extremists_desc:0 "The Red Tent is dismantled while it is still being pitched. Its organisers are extremists by decree, and extremists have no rallies."
 RUS_pd_arrest_neo_tsarists:0 "Arrest the Neo-Tsarists"
 RUS_pd_arrest_neo_tsarists_desc:0 "The monarchist circles that hoped to crown someone are visited by men who explain, at length, that the throne is not vacant because there is no throne."
 RUS_pd_purge_oligarchs:0 "Purges the disrespectful oligarchs"
 RUS_pd_purge_oligarchs_desc:0 "The men who hesitated at the crucial hour are reminded that their fortunes exist at the pleasure of the state, and can cease to at the same pleasure."
 RUS_pd_united_russia_undisputed:0 "United Russia Undisputed"
 RUS_pd_united_russia_undisputed_desc:0 "With every rival either arrested, bankrupt or abroad, the party of power is once again the only party that matters. Nothing has changed, which is precisely the achievement."
 RUS_pd_firm_grip_on_power:0 "Firm grip on power"
 RUS_pd_firm_grip_on_power_desc:0 "The succession is settled by the men who were already in the room. Russia lost a war and a leader, and the system that produced both survives untouched."

 RUS_pd_liberty_patriotism_justice:0 "Liberty, Patriotism, Justice"
 RUS_pd_liberty_patriotism_justice_desc:0 "Three words on a banner, and not one of them meant in the usual sense. The nationalist right has decided the defeat was a betrayal, and betrayal requires a reckoning."
 RUS_pd_no_more_losers:0 "No more losers, and no more Reds."
 RUS_pd_no_more_losers_desc:0 "The men who signed the ceasefire and the men who cheered it are placed in the same category, and that category is shrinking."
 RUS_pd_roundups_in_the_neighborhoods:0 "Roundups in the neighborhoods"
 RUS_pd_roundups_in_the_neighborhoods_desc:0 "The lists are no longer political. Whole districts are worked through street by street, and the police follow the militias rather than the other way round."
 RUS_pd_collapse_of_the_commie:0 "Collapse of the Commie"
 RUS_pd_collapse_of_the_commie_desc:0 "The Russian left is broken as a political force - its parties banned, its press seized, its leadership scattered between prison and exile."
 RUS_pd_russia_above_all:0 "Russia Above All"
 RUS_pd_russia_above_all_desc:0 "The nation is declared the only legitimate object of loyalty. Everything else - class, faith, region, law - is a distraction to be corrected."
 RUS_pd_coup_detat:0 "Coup d'Etat"
 RUS_pd_coup_detat_desc:0 "The tanks come out for the second time in a generation, and this time nobody stands in front of them. What follows calls itself an empire and means it."
