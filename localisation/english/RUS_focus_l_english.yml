l_english:
 russian_focus:0 "Russian Federation Focus Tree"

 RUS_quarter_of_the_century:0 "The Quarter of the Century"
 RUS_quarter_of_the_century_desc:0 "Twenty-five years at the helm. A quarter of a century of promises, of wars that were never called wars, of an economy always about to recover. The century is a quarter gone, and Russia must decide what it intends to be for the rest of it."

 RUS_forgotten_who_you_are:0 "Have you forgotten who you are?"
 RUS_forgotten_who_you_are_desc:0 "The front has not moved in months. The generals speak of patience, the television of triumph. It is time to remind the army, and the nation, what Russia is supposed to be."

 RUS_the_farce_continues:0 "The Farce Continues"
 RUS_the_farce_continues_desc:0 "It is not a war. It has never been a war. It is a special operation, it is a police action, it is anything but the word we are forbidden to say. The fiction holds the home front together, at the price of never truly mobilising."

 RUS_officially_war:0 "It is officially war."
 RUS_officially_war_desc:0 "Enough pretending. The word is spoken aloud, the decrees are signed, the reservists are called. The country will be shaken - and for the first time it will fight with everything it has."

 RUS_prolong_conflict:0 "Prolongs the Conflict Even Further"
 RUS_prolong_conflict_desc:0 "Time is a weapon like any other. Let the front grind on: our reserves are deeper than theirs, and their patrons will tire before we do."

 RUS_donbas_presence:0 "Increasing Presence in the Donbas"
 RUS_donbas_presence_desc:0 "More men, more guns, more concrete. The Donbas becomes the anvil on which the enemy army is to be broken."

 RUS_russians_above_all:0 "Russians Above All Else"
 RUS_russians_above_all_desc:0 "One people, one language, one destiny. Everything that is Russian is placed above everything that is not."

 RUS_prolong_conflict_further:0 "Prolongs the Conflict Even Further"
 RUS_prolong_conflict_further_desc:0 "Another season of attrition. Another round of recruitment. The war becomes the natural condition of the state."

 RUS_draw_belarus:0 "Draws Belarus into the conflict"
 RUS_draw_belarus_desc:0 "Minsk has hedged long enough. The Union State was signed for days like this, and our neighbour will be reminded of the signature."

 RUS_joint_union_command:0 "Joint Union State Command"
 RUS_joint_union_command_desc:0 "Two armies, one staff. Belarusian formations are folded into our command structure, and the western approaches become a single theatre."
 RUS_draw_belarus_at_war:0 "Draws Belarus into the conflict"
 RUS_draw_belarus_at_war_desc:0 "Now that the war is called a war, Minsk can no longer hide behind training exercises and humanitarian corridors. Belarusian divisions are committed to the front under Russian command, and the Union State finally means what the treaty always said it did."

 RUS_centralized_army_command:0 "Further Centralized Army Command"
 RUS_centralized_army_command_desc:0 "Too many generals, too many private kingdoms. Authority is pulled back to the General Staff, whatever the marshals think of it."

 RUS_military_police:0 "Increase the Military Police Presence"
 RUS_military_police_desc:0 "Deserters, looters, and men who talk too freely. The military police will see to all three."

 RUS_fsb_presence:0 "Increase the FSB Presence"
 RUS_fsb_presence_desc:0 "The service returns to what it does best. Every barracks, every ministry, every editorial office acquires a quiet man who reports elsewhere."

 RUS_voinskiy_prizyv:0 "Increases Voinskiy Prizyv"
 RUS_voinskiy_prizyv_desc:0 "The conscription lists are widened, the exemptions narrowed. A generation that thought the war belonged to someone else receives its summons."

 RUS_relentless_attacks:0 "Relentless attacks against the enemy"
 RUS_relentless_attacks_desc:0 "No pauses, no operational rest. Pressure everywhere, always, until something gives - and something always gives."

 RUS_revanchist_fervor:0 "Revanchist Fervor Increases"
 RUS_revanchist_fervor_desc:0 "Humiliation is a renewable resource. Every grievance since 1991 is exhumed and put to work."

 RUS_deep_battle_theory:0 "Continuing with the Deep Battle theory"
 RUS_deep_battle_theory_desc:0 "Tukhachevsky's ghost is rehabilitated once more. Strike the whole depth of the enemy at once, and let his rear collapse before his front does."

 RUS_unify_command:0 "Unify Command Structures"
 RUS_unify_command_desc:0 "Army, National Guard, volunteer formations and mercenary companies answer at last to one chain of command."

 RUS_make_rossiya_great_again:0 "Make Rossiya Great Again"
 RUS_make_rossiya_great_again_desc:0 "The war, the army and the nation are finally pulling in the same direction. Whatever the cost has been, Russia stands as a great power again - and intends to be treated as one."

 RUS_government_framework:0 "Government Framework"
 RUS_government_framework_desc:0 "The vertical of power needs servicing. Before anything else can be decided, it must be clear who decides."

 RUS_lower_left_support:0 "Lower the left support"
 RUS_lower_left_support_desc:0 "The communists have grown comfortable playing loyal opposition while collecting the votes of the discontented. That arrangement ends."

 RUS_lower_right_support:0 "Lower the Right support"
 RUS_lower_right_support_desc:0 "The nationalists demand a war more total than the one we are fighting, and an empire we have not yet won. Their enthusiasm has become a liability."

 RUS_kprf_debacle:0 "KPRF Debacle"
 RUS_kprf_debacle_desc:0 "A scandal here, a disqualified list there, a hostile documentary at prime time. The party of Zyuganov is humiliated in front of its own electorate."

 RUS_meet_slutsky:0 "Meet with Slutsky"
 RUS_meet_slutsky_desc:0 "The Liberal Democrats were never liberal and never especially democratic, but they are useful. An understanding is reached with Zhirinovsky's heir."

 RUS_arrest_communist_extremists:0 "Arrest those Communist Extremists"
 RUS_arrest_communist_extremists_desc:0 "The line between opposition and extremism is drawn wherever it is most convenient. Tonight it is drawn through the KPRF's youth wing."

 RUS_russia_above_all:0 "Russia Above All"
 RUS_russia_above_all_desc:0 "Class is a foreign invention. There is only the nation, and those who serve it."

 RUS_increase_centralization:0 "Increase Centralization"
 RUS_increase_centralization_desc:0 "Governors, mayors and regional barons are reminded that they hold their offices at the pleasure of the centre."

 RUS_purge_oligarchs:0 "Purges the disrespectful oligarchs"
 RUS_purge_oligarchs_desc:0 "Wealth is tolerated. Independence is not. A few well-publicised windows are opened, and the rest of the class remembers its manners."

 RUS_united_russia_undisputed:0 "United Russia Undisputed"
 RUS_united_russia_undisputed_desc:0 "With left and right alike brought to heel, the party of power is no longer merely dominant. It is the only politics that remains."

 RUS_meet_zyuganov:0 "Meet with Zyuganov"
 RUS_meet_zyuganov_desc:0 "The old communist has spent thirty years being useful. He is invited to be useful once more, this time against the nationalists."

 RUS_collapse_of_the_right:0 "Collapse of the Right"
 RUS_collapse_of_the_right_desc:0 "Deprived of patronage and airtime, the nationalist movement fragments into a dozen quarrelling chapels."

 RUS_arrest_neo_tsarists:0 "Arrest the Neo-Tsarists"
 RUS_arrest_neo_tsarists_desc:0 "Monarchist circles, imperial re-enactors and their financiers discover that nostalgia for the crown is a form of separatism."

 RUS_successors_of_soviets:0 "Successors of the Soviets"
 RUS_successors_of_soviets_desc:0 "The red banner is lifted out of the museum. Not as revolution, but as inheritance: we are the state the Union left behind."

 RUS_tsar_vladimir:0 "Tsar Vladimir"
 RUS_tsar_vladimir_desc:0 "No coronation, no crown, no proclamation. Simply the quiet recognition, by everyone who matters, that the succession question has been settled - and that it will not be asked again."

 RUS_economy_is_a_mess:0 "The economy? It's a mess."
 RUS_economy_is_a_mess_desc:0 "Sanctions, shortages, a currency held together by decree and a budget devoured by the front. The books can be cooked only so long."

 RUS_let_economy_breathe:0 "Let the economy breathe."
 RUS_let_economy_breathe_desc:0 "Ease the pressure. Let goods reach the shelves and wages reach the workers, and buy the regime the one thing it cannot manufacture: patience."

 RUS_total_military_mobilization:0 "Total Military Mobilization"
 RUS_total_military_mobilization_desc:0 "Every lathe, every rail wagon, every hour of labour is requisitioned for the front. The civilian economy is not spared - it is conscripted."

 RUS_bonuses_for_workers:0 "Bonuses for Workers"
 RUS_bonuses_for_workers_desc:0 "Wage supplements, housing credits and a bonus timed for the holidays. Loyalty is cheaper bought than enforced."

 RUS_donbas_industry:0 "Increasing Presence in the Donbas"
 RUS_donbas_industry_desc:0 "The coal and steel of the basin are brought fully into the national accounts. The war has at least paid for part of itself."

 RUS_trade_with_china:0 "Increasing Trade with China"
 RUS_trade_with_china_desc:0 "What the West will no longer buy, Beijing will - at Beijing's price. The pipelines turn east."

 RUS_state_corporations:0 "All Power to the State Corporations"
 RUS_state_corporations_desc:0 "Strategic industry is consolidated into a handful of state champions, answerable to the Kremlin and to no shareholder."

 RUS_strengthen_gazprom:0 "Strengthens Gazprom"
 RUS_strengthen_gazprom_desc:0 "The gas giant is recapitalised and rearmed as an instrument of policy. Energy was always the sharpest weapon in the arsenal."

 RUS_chinese_investment:0 "Invites the Chinese to invest"
 RUS_chinese_investment_desc:0 "Chinese capital is welcomed into Russian industry. The terms are unfavourable, the alternative is worse, and the plants will be built."

 RUS_corruption_problem:0 "A Serious Problem of Corruption"
 RUS_corruption_problem_desc:0 "It is finally admitted, in public, that the money is disappearing. Admitting it is itself a political act."

 RUS_anti_corruption_campaign:0 "Anti-corruption campaign"
 RUS_anti_corruption_campaign_desc:0 "Investigators are unleashed - selectively. The state recovers its funds, and disposes of a few inconvenient men in the process."

 RUS_public_transparency:0 "A semblance of public transparency"
 RUS_public_transparency_desc:0 "Budgets are published, hearings are televised, and very little actually changes. The appearance of accountability proves quite as calming as the real thing."

 RUS_nationalize_oligarch_industries:0 "Nationalize Oligarch Industries"
 RUS_nationalize_oligarch_industries_desc:0 "The great private fortunes are folded into the war effort by decree. Compensation is promised, eventually, in principle."

 RUS_full_military_conversion:0 "Full Military Conversion"
 RUS_full_military_conversion_desc:0 "Tractor plants build hulls, appliance factories build shell casings. There is no longer a civilian sector worth the name."

 RUS_ban_labor_unions:0 "Total ban on Labor unions"
 RUS_ban_labor_unions_desc:0 "Strikes in wartime are sabotage. The unions are dissolved, their leaders detained, and the working day extended by decree."

 RUS_buy_chinese_weapons:0 "Buy Chinese Weapons"
 RUS_buy_chinese_weapons_desc:0 "Shells, drones and optics arrive in unmarked crates. Pride is expensive; ammunition is not optional."

 RUS_invest_in_csto:0 "Invest in CSTO Command"
 RUS_invest_in_csto_desc:0 "The alliance is given a real staff, real exercises and real money, so that it might one day be a real alliance."

 RUS_every_weapon_must_be_used:0 "Every weapon must be used."
 RUS_every_weapon_must_be_used_desc:0 "The depots are emptied to the bare walls. Museum pieces, mothballed stock, everything that can still fire is sent forward."

 RUS_sanction_proof_economy:0 "Sanction-proof Economy"
 RUS_sanction_proof_economy_desc:0 "Rewired, re-routed and turned eastward, the Russian economy has stopped waiting for the embargo to be lifted. It has learned to live without it."

 # ==== DvE - i tooltip delle condizioni di guerra ====
 RUS_tt_war_ongoing:0 "The war in Ukraine is still being fought"
 RUS_tt_holds_donbass:0 "The four oblasts of the Donbass are held"
 RUS_tt_won_ukraine:0 "The war in Ukraine has been won"
