l_english:
 dve_fracw.1.t:0 "The Centre Cannot Hold"
 dve_fracw.1.d:0 "A week into the collapse, the National Bloc's government has no army left to hold the south with. Brittany breaks away on its own terms, the officer corps moves in to restore order where the Bloc failed, and the vultures start circling what's left of the Republic."
 dve_fracw.1.a:0 "Let it happen"

 dve_fracw.2.t:0 "France Tears Itself Apart"
 dve_fracw.2.d:0 "The Fifth Republic has not survived its own election. The nationalist right has proclaimed a French State in the south, the Communards have risen in Champagne and the centre, and Corsica has declared itself free.\n\nEvery citizen of France has to choose a side. So do you."
 dve_fracw.2.a:0 "Stay with the government of the §YFrench Republic§!"
 dve_fracw.2.b:0 "Join §YThe French State§! (the nationalist right)"
 dve_fracw.2.c:0 "Join the §YCommunard Republic§! (the communists)"
 dve_fracw.2.d:0 "Join §YCorsica§! (the Corsican separatists)"

 dve_fracw.3.t:0 "New Flags over France"
 dve_fracw.3.d:0 "A week into the collapse, the map of France has been redrawn again. Royalists, socialists, anarchists, Breton separatists and the officer corps have each carved out a France of their own.\n\nThe Republic can still be defended, or abandoned for one of them."
 dve_fracw.3.a:0 "Stay with the government of the §YFrench Republic§!"
 dve_fracw.3.b:0 "Join §YMonarchist France§! (the royalists)"
 dve_fracw.3.c:0 "Join the §YFrench Socialist Republic§! (the socialists)"
 dve_fracw.3.d:0 "Join §YAnarchist France§! (the anarchists)"
 dve_fracw.3.e:0 "Join §YBrittany§! (the Breton separatists)"
 dve_fracw.3.f:0 "Join the §YFrench Army Command§! (the military junta)"
