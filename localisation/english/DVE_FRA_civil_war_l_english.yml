 dve_fracw.1.t:0 "The Centre Cannot Hold"
 dve_fracw.1.d:0 "A week into the collapse, the National Bloc's government has no army left to hold the south with. Brittany breaks away on its own terms, the officer corps moves in to restore order where the Bloc failed, and the vultures start circling what's left of the Republic."
 dve_fracw.1.a:0 "Let it happen"
